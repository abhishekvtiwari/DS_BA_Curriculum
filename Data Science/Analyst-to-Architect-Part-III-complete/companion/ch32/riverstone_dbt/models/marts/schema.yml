version: 2

models:
  - name: fct_sales_line
    description: "Grain: one non-cancelled order line. The single source for sales reporting."
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: customer_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: date_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: net_revenue
        data_tests: [not_null]
  - name: dim_customer
    description: "Type 2 customer dimension: one row per customer per period their details stayed the same."
    columns:
      - name: customer_key
        data_tests: [unique, not_null]
      - name: segment
        data_tests:
          - accepted_values:
              arguments:
                values: ['Retail', 'Hospitality', 'Wholesale']
  - name: dim_date
    columns:
      - name: date_key
        data_tests: [unique, not_null]
  - name: fct_daily_sales
    columns:
      - name: order_date
        data_tests: [unique, not_null]
