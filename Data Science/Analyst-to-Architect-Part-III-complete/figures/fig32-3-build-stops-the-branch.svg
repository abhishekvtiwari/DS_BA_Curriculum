<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="394" viewBox="0 0 1040 394" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1040" height="394" fill="#ffffff"/><text x="30" y="32" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Why dbt build, and not dbt run followed by dbt test</text><text x="60" y="66" font-size="13" fill="#b23b3b" font-weight="bold" text-anchor="start">dbt run, then dbt test</text><rect x="50" y="90" width="420" height="44" rx="6" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><text x="70" y="117" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">stg_order_items</text><text x="250" y="117" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">built</text><path d="M260,134 V146" fill="none" stroke="#c9d3df" stroke-width="1.4" stroke-linejoin="round"/><rect x="50" y="146" width="420" height="44" rx="6" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><text x="70" y="173" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">fct_sales_line</text><text x="250" y="173" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">built (with bad data)</text><path d="M260,190 V202" fill="none" stroke="#c9d3df" stroke-width="1.4" stroke-linejoin="round"/><rect x="50" y="202" width="420" height="44" rx="6" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><text x="70" y="229" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">dashboards</text><text x="250" y="229" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">refreshed from it</text><path d="M260,246 V258" fill="none" stroke="#c9d3df" stroke-width="1.4" stroke-linejoin="round"/><rect x="50" y="258" width="420" height="44" rx="6" fill="#fff" stroke="#b23b3b" stroke-width="1.6" /><text x="70" y="285" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">tests</text><text x="250" y="285" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">fail, an hour later</text><text x="60" y="324" font-size="12" fill="#b23b3b" font-weight="normal" text-anchor="start">Bad numbers reached people before anyone knew.</text><text x="570" y="66" font-size="13" fill="#2f7d6d" font-weight="bold" text-anchor="start">dbt build</text><rect x="560" y="90" width="420" height="44" rx="6" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><text x="580" y="117" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">stg_order_items</text><text x="760" y="117" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">built, then tested: pass</text><path d="M770,134 V146" fill="none" stroke="#c9d3df" stroke-width="1.4" stroke-linejoin="round"/><rect x="560" y="146" width="420" height="44" rx="6" fill="#fff" stroke="#b23b3b" stroke-width="1.6" /><text x="580" y="173" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">test on the grain</text><text x="760" y="173" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">FAIL: duplicate order_item_id</text><path d="M770,190 V202" fill="none" stroke="#c9d3df" stroke-width="1.4" stroke-linejoin="round"/><rect x="560" y="202" width="420" height="44" rx="6" fill="#fff" stroke="#5b6475" stroke-width="1.6" /><text x="580" y="229" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">fct_sales_line</text><text x="760" y="229" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">SKIPPED</text><path d="M770,246 V258" fill="none" stroke="#c9d3df" stroke-width="1.4" stroke-linejoin="round"/><rect x="560" y="258" width="420" height="44" rx="6" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><text x="580" y="285" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">dashboards</text><text x="760" y="285" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">still showing yesterday&#x27;s build</text><text x="570" y="324" font-size="12" fill="#2f7d6d" font-weight="normal" text-anchor="start">The failure stopped the branch. Nothing wrong shipped.</text><text x="30" y="354" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">dbt build runs each model and its tests together, in dependency order, and skips everything downstream of a failure. The run exits non-zero,</text><text x="30" y="374" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">so the scheduler raises an alarm (Chapter 29&#x27;s exit codes).</text></svg>