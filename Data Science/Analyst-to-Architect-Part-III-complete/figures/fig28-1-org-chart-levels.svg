 y="510" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">The anchor row is the person with no manager (level 1). Each pass of the recursive part adds the next level down,</text><text x="30" y="530" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">and the query stops when a pass finds nobody new. The chart shows 16 of the 35 people (the regional sales team is left out); the query returns all of them.</text></svg>