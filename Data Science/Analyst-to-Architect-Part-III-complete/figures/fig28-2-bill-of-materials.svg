<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="415" viewBox="0 0 1040 415" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1040" height="415" fill="#ffffff"/><text x="30" y="32" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Bill of materials: quantities multiply as you go down</text><rect x="390" y="55" width="220" height="46" rx="7" fill="#fff" stroke="#1d2330" stroke-width="1.6" /><text x="500.0" y="75" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="middle">Garden Chair (106)</text><text x="500.0" y="92" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">1 unit</text><path d="M500,101 V125 H140 V145" fill="none" stroke="#c9d3df" stroke-width="1.6" stroke-linejoin="round"/><rect x="40" y="145" width="200" height="46" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><text x="140.0" y="165" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="middle">Seat shell</text><text x="140.0" y="182" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">× 1</text><path d="M500,101 V125 H390 V145" fill="none" stroke="#c9d3df" stroke-width="1.6" stroke-linejoin="round"/><rect x="290" y="145" width="200" height="46" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><text x="390.0" y="165" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="middle">Steel frame</text><text x="390.0" y="182" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">× 1</text><path d="M500,101 V125 H640 V145" fill="none" stroke="#c9d3df" stroke-width="1.6" stroke-linejoin="round"/><rect x="540" y="145" width="200" height="46" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><text x="640.0" y="165" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="middle">Product label</text><text x="640.0" y="182" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">× 1  (material)</text><path d="M500,101 V125 H890 V145" fill="none" stroke="#c9d3df" stroke-width="1.6" stroke-linejoin="round"/><rect x="790" y="145" width="200" height="46" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><text x="890.0" y="165" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="middle">Shipping carton</text><text x="890.0" y="182" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">× 1  (material)</text><path d="M140,191 V215 H80 V235" fill="none" stroke="#c9d3df" stroke-width="1.6" stroke-linejoin="round"/><path d="M140,191 V215 H220 V235" fill="none" stroke="#c9d3df" stroke-width="1.6" stroke-linejoin="round"/><rect x="10" y="235" width="140" height="46" rx="7" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><text x="80.0" y="255" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="middle">PP granules</text><text x="80.0" y="272" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">× 2.2 kg</text><rect x="158" y="235" width="124" height="46" rx="7" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><text x="220.0" y="255" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="middle">Masterbatch</text><text x="220.0" y="272" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">× 0.08 kg</text><path d="M390,191 V215 H370 V235" fill="none" stroke="#c9d3df" stroke-width="1.6" stroke-linejoin="round"/><path d="M390,191 V215 H500 V235" fill="none" stroke="#c9d3df" stroke-width="1.6" stroke-linejoin="round"/><path d="M390,191 V215 H640 V235" fill="none" stroke="#c9d3df" stroke-width="1.6" stroke-linejoin="round"/><rect x="305" y="235" width="130" height="46" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><text x="370.0" y="255" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="middle">Leg assembly</text><text x="370.0" y="272" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">× 2</text><rect x="440" y="235" width="120" height="46" rx="7" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><text x="500.0" y="255" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="middle">Steel tube</text><text x="500.0" y="272" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">× 1.0 kg</text><rect x="570" y="235" width="140" height="46" rx="7" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><text x="640.0" y="255" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="middle">Fastener pack</text><text x="640.0" y="272" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">× 1</text><path d="M370,281 V305 H320 V325" fill="none" stroke="#c9d3df" stroke-width="1.6" stroke-linejoin="round"/><path d="M370,281 V305 H450 V325" fill="none" stroke="#c9d3df" stroke-width="1.6" stroke-linejoin="round"/><rect x="250" y="325" width="140" height="46" rx="7" fill="#fff" stroke="#c0662b" stroke-width="1.6" /><text x="320.0" y="345" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="middle">Steel tube</text><text x="320.0" y="362" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">1.2 kg × 2 = 2.4 kg</text><rect x="400" y="325" width="140" height="46" rx="7" fill="#fff" stroke="#c0662b" stroke-width="1.6" /><text x="470.0" y="345" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="middle">Fastener pack</text><text x="470.0" y="362" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">1 × 2 = 2</text><rect x="730" y="225" width="290" height="160" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="745" y="248" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="start">Material cost of one chair</text><text x="745" y="269" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">PP 2.2 kg × ₹110 = ₹242.00</text><text x="745" y="290" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Masterbatch 0.08 kg × ₹260 = ₹20.80</text><text x="745" y="311" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Steel tube 3.4 kg × ₹95 = ₹323.00</text><text x="745" y="332" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Fasteners 3 × ₹14 = ₹42.00</text><text x="745" y="353" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Label ₹2 + carton ₹18 = ₹20.00</text><text x="745" y="374" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="start">Total ₹647.80</text><text x="30" y="400" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Orange boxes are found on the third pass: the recursive CTE multiplies each child&#x27;s quantity by its parent&#x27;s running quantity.</text></svg>