<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="472" viewBox="0 0 1040 472" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1040" height="472" fill="#ffffff"/><text x="30" y="32" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Which method, and what it costs you</text><rect x="30" y="70" width="420" height="44" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="46" y="97" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Can you randomize?</text><path d="M455,92 H485" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M477,86 L487,92 L477,98" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><rect x="495" y="70" width="515" height="44" rx="6" fill="#fff" stroke="#2f7d6d" stroke-width="1.8" /><text x="512" y="90" font-size="12.5" fill="#2f7d6d" font-weight="bold" text-anchor="start">Run the experiment (Chapter 30)</text><text x="512" y="107" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">strongest evidence</text><rect x="30" y="122" width="420" height="44" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="46" y="149" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Is there a threshold rule?</text><path d="M455,144 H485" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M477,138 L487,144 L477,150" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><rect x="495" y="122" width="515" height="44" rx="6" fill="#fff" stroke="#2f7d6d" stroke-width="1.8" /><text x="512" y="142" font-size="12.5" fill="#2f7d6d" font-weight="bold" text-anchor="start">Regression discontinuity</text><text x="512" y="159" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">strong, but only near the cut-off</text><rect x="30" y="174" width="420" height="44" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="46" y="201" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Do you have before-and-after for both groups?</text><path d="M455,196 H485" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M477,190 L487,196 L477,202" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><rect x="495" y="174" width="515" height="44" rx="6" fill="#fff" stroke="#0f5c8c" stroke-width="1.8" /><text x="512" y="194" font-size="12.5" fill="#0f5c8c" font-weight="bold" text-anchor="start">Difference-in-differences</text><text x="512" y="211" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">needs parallel trends</text><rect x="30" y="226" width="420" height="44" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="46" y="253" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Many untreated units, one treated?</text><path d="M455,248 H485" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M477,242 L487,248 L477,254" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><rect x="495" y="226" width="515" height="44" rx="6" fill="#fff" stroke="#0f5c8c" stroke-width="1.8" /><text x="512" y="246" font-size="12.5" fill="#0f5c8c" font-weight="bold" text-anchor="start">Synthetic control</text><text x="512" y="263" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">judge it by the pre-change fit</text><rect x="30" y="278" width="420" height="44" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="46" y="305" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Only cross-sectional data, good covariates?</text><path d="M455,300 H485" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M477,294 L487,300 L477,306" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><rect x="495" y="278" width="515" height="44" rx="6" fill="#fff" stroke="#c0662b" stroke-width="1.8" /><text x="512" y="298" font-size="12.5" fill="#c0662b" font-weight="bold" text-anchor="start">Matching / propensity scores</text><text x="512" y="315" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">assumes nothing unmeasured</text><rect x="30" y="330" width="420" height="44" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="46" y="357" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Something that shifts treatment but not the outcome?</text><path d="M455,352 H485" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M477,346 L487,352 L477,358" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><rect x="495" y="330" width="515" height="44" rx="6" fill="#fff" stroke="#c0662b" stroke-width="1.8" /><text x="512" y="350" font-size="12.5" fill="#c0662b" font-weight="bold" text-anchor="start">Instrumental variables</text><text x="512" y="367" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">exclusion is untestable</text><rect x="30" y="382" width="420" height="44" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="46" y="409" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">None of the above?</text><path d="M455,404 H485" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M477,398 L487,404 L477,410" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><rect x="495" y="382" width="515" height="44" rx="6" fill="#fff" stroke="#b23b3b" stroke-width="1.8" /><text x="512" y="402" font-size="12.5" fill="#b23b3b" font-weight="bold" text-anchor="start">Describe, don&#x27;t claim cause</text><text x="512" y="419" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">say so plainly</text><text x="30" y="452" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Work down the list: the first row you can answer yes to is usually the strongest evidence available to you.</text></svg>