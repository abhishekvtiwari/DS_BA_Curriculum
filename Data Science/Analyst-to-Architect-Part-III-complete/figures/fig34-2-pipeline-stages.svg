<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="350" viewBox="0 0 1040 350" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1040" height="350" fill="#ffffff"/><text x="30" y="32" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">One question, five small tools: order lines by city</text><rect x="30" y="70" width="170" height="110" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="2" /><text x="115" y="97" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">cut -d, -f5</text><text x="115" y="122" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="middle">keep column 5</text><text x="115" y="139" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="middle">(the city)</text><text x="115" y="168" font-size="11.5" fill="#0f5c8c" font-weight="bold" text-anchor="middle">327 lines</text><path d="M200,125 H226" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M219,119 L228,125 L219,131" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><rect x="226" y="70" width="170" height="110" rx="8" fill="#fff" stroke="#7a4fa0" stroke-width="2" /><text x="311" y="97" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">tail -n +2</text><text x="311" y="122" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="middle">drop the</text><text x="311" y="139" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="middle">header row</text><text x="311" y="168" font-size="11.5" fill="#7a4fa0" font-weight="bold" text-anchor="middle">326 lines</text><path d="M396,125 H422" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M415,119 L424,125 L415,131" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><rect x="422" y="70" width="170" height="110" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="2" /><text x="507" y="97" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">sort</text><text x="507" y="122" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="middle">put identical</text><text x="507" y="139" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="middle">cities together</text><text x="507" y="168" font-size="11.5" fill="#2f7d6d" font-weight="bold" text-anchor="middle">326 lines</text><path d="M592,125 H618" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M611,119 L620,125 L611,131" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><rect x="618" y="70" width="170" height="110" rx="8" fill="#fff" stroke="#c0662b" stroke-width="2" /><text x="703" y="97" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">uniq -c</text><text x="703" y="122" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="middle">collapse and</text><text x="703" y="139" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="middle">count runs</text><text x="703" y="168" font-size="11.5" fill="#c0662b" font-weight="bold" text-anchor="middle">23 lines</text><path d="M788,125 H814" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M807,119 L816,125 L807,131" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><rect x="814" y="70" width="170" height="110" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="2" /><text x="899" y="97" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">sort -nr</text><text x="899" y="122" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="middle">biggest</text><text x="899" y="139" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="middle">first</text><text x="899" y="168" font-size="11.5" fill="#2f7d6d" font-weight="bold" text-anchor="middle">23 lines</text><rect x="30" y="205" width="480" height="105" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="48" y="230" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">     74 Mumbai</text><text x="48" y="247" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">     42 Pune</text><text x="48" y="264" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">     34 Bengaluru</text><text x="48" y="281" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">     28 Delhi</text><text x="48" y="298" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">     21 Kochi</text><text x="540" y="232" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Each tool reads what the one before it wrote.</text><text x="540" y="254" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Nothing is saved in between, and nothing is</text><text x="540" y="276" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">loaded into memory twice: the same command</text><text x="540" y="298" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">works on a 2 GB file on a server with no Excel.</text><text x="30" y="335" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Forgetting sort before uniq -c is the classic bug: uniq only collapses lines that are already next to each other.</text></svg>