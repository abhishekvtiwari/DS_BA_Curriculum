<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="380" viewBox="0 0 1110 380" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1110" height="380" fill="#ffffff"/><text x="30" y="32" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Riverstone&#x27;s 2025 sales as a star schema (schema dw)</text><rect x="280" y="120" width="280" height="170" rx="8" fill="#fdf3dc" stroke="#b7791f" stroke-width="2" /><text x="420" y="145" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="middle">fact_sales_line</text><text x="420" y="165" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle" font-style="italic">grain: one non-cancelled order line</text><text x="292" y="190" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">date_key → dim_date</text><text x="292" y="210" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">customer_key → dim_customer</text><text x="292" y="230" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">product_key → dim_product</text><text x="292" y="250" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">sales_rep_key → dim_sales_rep</text><text x="292" y="270" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">quantity · net_revenue · product_cost</text><rect x="60" y="70" width="220" height="56" rx="7" fill="#e2f3ee" stroke="#2f7d6d" stroke-width="1.6" /><text x="170" y="93" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="middle">dim_date</text><text x="170" y="112" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">365 rows: day, month, quarter</text><rect x="560" y="70" width="220" height="56" rx="7" fill="#e2f3ee" stroke="#2f7d6d" stroke-width="1.6" /><text x="670" y="93" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="middle">dim_customer</text><text x="670" y="112" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">27 rows (24 customers, SCD2)</text><rect x="60" y="300" width="220" height="56" rx="7" fill="#e2f3ee" stroke="#2f7d6d" stroke-width="1.6" /><text x="170" y="323" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="middle">dim_product</text><text x="170" y="342" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">8 rows: name, category</text><rect x="560" y="300" width="220" height="56" rx="7" fill="#e2f3ee" stroke="#2f7d6d" stroke-width="1.6" /><text x="670" y="323" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="middle">dim_sales_rep</text><text x="670" y="342" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">6 rows incl. &#x27;No rep recorded&#x27;</text><path d="M280,98 L280,140" fill="none" stroke="#2f7d6d" stroke-width="1.6" stroke-linejoin="round"/><path d="M560,98 L560,140" fill="none" stroke="#2f7d6d" stroke-width="1.6" stroke-linejoin="round"/><path d="M280,300 L280,290" fill="none" stroke="#2f7d6d" stroke-width="1.6" stroke-linejoin="round"/><path d="M560,300 L560,290" fill="none" stroke="#2f7d6d" stroke-width="1.6" stroke-linejoin="round"/><text x="830" y="70" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">dim_customer: Metro Mart</text><rect x="830" y="90" width="130" height="40" rx="5" fill="#efe7f6" stroke="#7a4fa0" stroke-width="1" /><text x="895" y="107" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="middle">key 6: Thane</text><text x="895" y="123" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">is_current = f</text><rect x="966" y="90" width="130" height="40" rx="5" fill="#e2f3ee" stroke="#2f7d6d" stroke-width="1" /><text x="1031" y="107" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="middle">key 7: Mumbai</text><text x="1031" y="123" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">is_current = t</text><path d="M830,145 H1096" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M830,139 V151" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M963,139 V151" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M1096,139 V151" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><text x="830" y="168" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">from 2024-12-22</text><text x="963" y="186" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">2025-07-01</text><text x="1096" y="168" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="end">to 9999-12-31</text><text x="830" y="220" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">A March 2025 order joins to key 6</text><text x="830" y="240" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">(Thane): the city at the time</text><text x="830" y="260" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">of the order.</text><text x="830" y="280" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start"></text><text x="830" y="300" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Reconciles: ₹4,335,471 in 326 fact</text><text x="830" y="320" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">lines, exactly the sales_lines</text><text x="830" y="340" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">view. ✓</text></svg>