<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="426" viewBox="0 0 1040 426" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1040" height="426" fill="#ffffff"/><text x="30" y="32" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Reading EXPLAIN ANALYZE: from the inside out (customer 2718&#x27;s revenue, no index on order_items.order_id)</text><rect x="34" y="59" width="20" height="20" rx="10" fill="#c0662b" stroke="none" stroke-width="1" /><text x="44" y="74" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="middle">4</text><text x="66" y="74" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Aggregate (actual time=225.300..225.326 rows=1)</text><text x="96" y="102" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">-&gt;  Hash Join (actual time=4.120..225.209 rows=108)</text><text x="126" y="130" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Hash Cond: (oi.order_id = o.order_id)</text><rect x="34" y="143" width="20" height="20" rx="10" fill="#c0662b" stroke="none" stroke-width="1" /><text x="44" y="158" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="middle">3</text><text x="126" y="158" font-size="12" fill="#b23b3b" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">-&gt;  Seq Scan on order_items oi (actual time=0.013..116.108 rows=1926847)</text><rect x="34" y="171" width="20" height="20" rx="10" fill="#c0662b" stroke="none" stroke-width="1" /><text x="44" y="186" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="middle">2</text><text x="126" y="186" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">-&gt;  Hash (actual time=0.060..0.084 rows=40)</text><text x="156" y="214" font-size="12" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">-&gt;  Bitmap Heap Scan on orders o (actual time=0.018..0.051 rows=40)</text><rect x="34" y="227" width="20" height="20" rx="10" fill="#c0662b" stroke="none" stroke-width="1" /><text x="44" y="242" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="middle">1</text><text x="186" y="242" font-size="12" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">-&gt;  Bitmap Index Scan on idx_orders_customer_id (rows=40)</text><text x="66" y="270" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Execution Time: 225.368 ms</text><rect x="26" y="52" width="988" height="232" rx="6" fill="none" stroke="#c9d3df" stroke-width="1" /><text x="30" y="318" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">1  Read the most indented step first: the index finds customer 2718&#x27;s 40 orders in a fraction of a millisecond.</text><text x="30" y="340" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">2  Their 40 order ids go into a small in-memory hash table.</text><text x="30" y="362" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">3  The expensive step: every one of 1,926,847 order lines is read and checked against that hash table.</text><text x="30" y="384" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">4  The top node is the final result. Its second time (225 ms) is the whole query; the Seq Scan&#x27;s 116 ms is about half of it.</text><text x="30" y="412" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Actual times are in milliseconds, shown as first row..last row. The other 109 ms is the Hash Join checking each of those lines.</text></svg>