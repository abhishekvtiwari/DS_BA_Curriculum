backoff + jitter)</text><rect x="40" y="142" width="90" height="30" rx="4" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="85" y="162" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">page 2</text><path d="M130,157 H250" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M242,151 L252,157 L242,163" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><rect x="255" y="142" width="70" height="30" rx="4" fill="#fff" stroke="#2f7d6d" stroke-width="2" /><text x="290" y="162" font-size="12.5" fill="#2f7d6d" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">200</text><text x="340" y="162" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">10 leads</text><rect x="40" y="182" width="90" height="30" rx="4" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="85" y="202" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">page 3</text><path d="M130,197 H250" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M242,191 L252,197 L242,203" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><rect x="255" y="182" width="70" height="30" rx="4" fill="#fff" stroke="#c0662b" stroke-width="2" /><text x="290" y="202" font-size="12.5" fill="#c0662b" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">429</text><text x="340" y="202" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">wait 1.000 s (Retry-After: 1)</text><rect x="40" y="222" width="90" height="30" rx="4" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="85" y="242" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">page 3</text><path d="M130,237 H250" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M242,231 L252,237 L242,243" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><rect x="255" y="222" width="70" height="30" rx="4" fill="#fff" stroke="#2f7d6d" stroke-width="2" /><text x="290" y="242" font-size="12.5" fill="#2f7d6d" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">200</text><text x="340" y="242" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">10 leads</text><rect x="40" y="262" width="90" height="30" rx="4" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="85" y="282" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">page 4</text><path d="M130,277 H250" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M242,271 L252,277 L242,283" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><rect x="255" y="262" width="70" height="30" rx="4" fill="#fff" stroke="#2f7d6d" stroke-width="2" /><text x="290" y="282" font-size="12.5" fill="#2f7d6d" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">200</text><text x="340" y="282" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">10 leads</text><rect x="40" y="302" width="90" height="30" rx="4" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="85" y="322" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">page 5</text><path d="M130,317 H250" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M242,311 L252,317 L242,323" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><rect x="255" y="302" width="70" height="30" rx="4" fill="#fff" stroke="#2f7d6d" stroke-width="2" /><text x="290" y="322" font-size="12.5" fill="#2f7d6d" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">200</text><text x="340" y="322" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">3 leads, next_page: null</text><rect x="640" y="62" width="370" height="270" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="656" y="90" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">Retry: 429, 500, 502, 503, 504,</text><text x="656" y="117" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">  connection errors, timeouts</text><text x="656" y="144" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">Don&#x27;t retry: 400, 401, 403, 404</text><text x="656" y="171" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">  (retrying can&#x27;t fix them)</text><text x="656" y="198" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">Wait: 0.5 s × 2^(attempt−1),</text><text x="656" y="225" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">  plus random jitter up to half</text><text x="656" y="252" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">429 with Retry-After: wait that long</text><text x="656" y="279" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">Give up after 4 attempts: raise CrmApiError</text><text x="656" y="306" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">Always set a timeout: (3.05, 10) s</text><text x="30" y="355" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Real run on the local mock server; the wait times are from the chapter&#x27;s output.</text></svg>