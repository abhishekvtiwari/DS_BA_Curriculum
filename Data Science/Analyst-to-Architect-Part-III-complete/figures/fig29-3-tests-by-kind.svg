<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="370" viewBox="0 0 1040 370" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1040" height="370" fill="#ffffff"/><text x="30" y="32" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">What each kind of test is for</text><rect x="30" y="70" width="760" height="70" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="2" /><text x="46" y="96" font-size="13" fill="#2f7d6d" font-weight="bold" text-anchor="start">Unit tests</text><text x="46" y="118" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">transform.py, config.py, and crm_client.py with a fake session</text><text x="46" y="134" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">milliseconds; no database or network</text><text x="810" y="110" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">14 tests</text><rect x="30" y="160" width="560" height="70" rx="8" fill="#fff" stroke="#7a4fa0" stroke-width="2" /><text x="46" y="186" font-size="13" fill="#7a4fa0" font-weight="bold" text-anchor="start">Parametrized tests</text><text x="46" y="208" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">parse_month (good and bad input), top_customers</text><text x="46" y="224" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">one test function, many inputs</text><text x="610" y="200" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">3 tests → 8 cases</text><rect x="30" y="250" width="360" height="70" rx="8" fill="#fff" stroke="#c0662b" stroke-width="2" /><text x="46" y="276" font-size="13" fill="#c0662b" font-weight="bold" text-anchor="start">Integration test</text><text x="46" y="298" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">December 2025 against riverstone_2025</text><text x="46" y="314" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">needs the database; skipped without it</text><text x="410" y="290" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">1 test</text><text x="30" y="350" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">The integration test reconciles to a number the book already trusts: December 2025 net revenue ₹439,823.50, 115.7% of target.</text></svg>