<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="390" viewBox="0 0 1040 390" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1040" height="390" fill="#ffffff"/><text x="30" y="32" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">From one script to a package</text><text x="30" y="66" font-size="13" fill="#b23b3b" font-weight="bold" text-anchor="start">Before: monthly_report.py (40 lines)</text><rect x="30" y="80" width="330" height="28" rx="4" fill="#fbeaea" stroke="#c9d3df" stroke-width="1" /><text x="44" y="99" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">connect with a password in the code</text><rect x="30" y="114" width="330" height="28" rx="4" fill="#fbeaea" stroke="#c9d3df" stroke-width="1" /><text x="44" y="133" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">hard-coded month and file name</text><rect x="30" y="148" width="330" height="28" rx="4" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="44" y="167" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">load every order line, filter in pandas</text><rect x="30" y="182" width="330" height="28" rx="4" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="44" y="201" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">calculate, print</text><rect x="30" y="216" width="330" height="28" rx="4" fill="#fbeaea" stroke="#c9d3df" stroke-width="1" /><text x="44" y="235" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">bare except: target = 0</text><rect x="30" y="250" width="330" height="28" rx="4" fill="#fbeaea" stroke="#c9d3df" stroke-width="1" /><text x="44" y="269" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">write Monthly_Report_Dec_FINAL.xlsx</text><rect x="30" y="284" width="330" height="28" rx="4" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="44" y="303" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">print(&#x27;done&#x27;)</text><text x="30" y="338" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Everything in one file, run top to bottom.</text><path d="M385,200 H445" fill="none" stroke="#1d2330" stroke-width="2.5" stroke-linejoin="round"/><path d="M436,193 L447,200 L436,207" fill="none" stroke="#1d2330" stroke-width="2.5" stroke-linejoin="round"/><text x="470" y="66" font-size="13" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">After: riverstone-report/</text><text x="470" y="92" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">pyproject.toml</text><text x="720" y="92" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">dependencies, tools, entry point</text><text x="470" y="116" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">uv.lock</text><text x="720" y="116" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">exact versions of 32 packages</text><text x="470" y="140" font-size="12" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">src/riverstone_report/</text><text x="496" y="164" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">config.py</text><text x="720" y="164" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">settings from env vars, validated</text><text x="496" y="188" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">db.py</text><text x="720" y="188" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">the only module with SQL</text><text x="496" y="212" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">transform.py</text><text x="720" y="212" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">pure calculations</text><text x="496" y="236" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">excel.py</text><text x="720" y="236" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">formatted workbook</text><text x="496" y="260" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">crm_client.py</text><text x="720" y="260" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">retries, pages, rate limits</text><text x="496" y="284" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">cli.py</text><text x="720" y="284" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">riverstone-report --month</text><text x="496" y="308" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">errors.py</text><text x="720" y="308" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">ReportError and friends</text><text x="470" y="332" font-size="12" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">tests/</text><text x="720" y="332" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">23 tests</text><text x="470" y="372" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Each file has one job, so each can be read, tested, and changed alone.</text></svg>