<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="375" viewBox="0 0 1130 375" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1130" height="375" fill="#ffffff"/><text x="30" y="32" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The same lift, four sample sizes: what a confidence interval buys</text><path d="M500.0,70 V300" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="4,4"/><text x="500.0" y="64" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="middle">no difference</text><text x="40" y="100" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">2,500 per group</text><path d="M388.0,95 H832.0" fill="none" stroke="#b23b3b" stroke-width="3" stroke-linejoin="round"/><path d="M388.0,88 V102" fill="none" stroke="#b23b3b" stroke-width="3" stroke-linejoin="round"/><path d="M832.0,88 V102" fill="none" stroke="#b23b3b" stroke-width="3" stroke-linejoin="round"/><rect x="606.0" y="91" width="8" height="8" rx="4" fill="#b23b3b" stroke="#b23b3b" stroke-width="1" /><text x="846.0" y="100" font-size="11.5" fill="#b23b3b" font-weight="normal" text-anchor="start">-0.56 to +1.66 pp — could be a loss</text><text x="40" y="155" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">10,000 per group</text><path d="M500.0,150 H720.0" fill="none" stroke="#c0662b" stroke-width="3" stroke-linejoin="round"/><path d="M500.0,143 V157" fill="none" stroke="#c0662b" stroke-width="3" stroke-linejoin="round"/><path d="M720.0,143 V157" fill="none" stroke="#c0662b" stroke-width="3" stroke-linejoin="round"/><rect x="606.0" y="146" width="8" height="8" rx="4" fill="#c0662b" stroke="#c0662b" stroke-width="1" /><text x="734.0" y="155" font-size="11.5" fill="#c0662b" font-weight="normal" text-anchor="start">-0.00 to +1.10 pp — still touches zero</text><text x="40" y="210" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">25,000 per group</text><path d="M540.0,205 H680.0" fill="none" stroke="#2f7d6d" stroke-width="3" stroke-linejoin="round"/><path d="M540.0,198 V212" fill="none" stroke="#2f7d6d" stroke-width="3" stroke-linejoin="round"/><path d="M680.0,198 V212" fill="none" stroke="#2f7d6d" stroke-width="3" stroke-linejoin="round"/><rect x="606.0" y="201" width="8" height="8" rx="4" fill="#2f7d6d" stroke="#2f7d6d" stroke-width="1" /><text x="694.0" y="210" font-size="11.5" fill="#2f7d6d" font-weight="normal" text-anchor="start">+0.20 to +0.90 pp — the test as run</text><text x="40" y="265" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">100,000 per group</text><path d="M574.0,260 H646.0" fill="none" stroke="#2f7d6d" stroke-width="3" stroke-linejoin="round"/><path d="M574.0,253 V267" fill="none" stroke="#2f7d6d" stroke-width="3" stroke-linejoin="round"/><path d="M646.0,253 V267" fill="none" stroke="#2f7d6d" stroke-width="3" stroke-linejoin="round"/><rect x="606.0" y="256" width="8" height="8" rx="4" fill="#2f7d6d" stroke="#2f7d6d" stroke-width="1" /><text x="660.0" y="265" font-size="11.5" fill="#2f7d6d" font-weight="normal" text-anchor="start">+0.37 to +0.73 pp — precise, and expensive</text><path d="M300.0,300 V306" fill="none" stroke="#5b6475" stroke-width="1.2" stroke-linejoin="round"/><text x="300.0" y="322" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">-1 pp</text><path d="M500.0,300 V306" fill="none" stroke="#5b6475" stroke-width="1.2" stroke-linejoin="round"/><text x="500.0" y="322" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">+0 pp</text><path d="M700.0,300 V306" fill="none" stroke="#5b6475" stroke-width="1.2" stroke-linejoin="round"/><text x="700.0" y="322" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">+1 pp</text><path d="M900.0,300 V306" fill="none" stroke="#5b6475" stroke-width="1.2" stroke-linejoin="round"/><text x="900.0" y="322" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">+2 pp</text><text x="30" y="355" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Every row measured the same +0.55 percentage points. Only the sample size changed, and with it what you are entitled to say.</text></svg>