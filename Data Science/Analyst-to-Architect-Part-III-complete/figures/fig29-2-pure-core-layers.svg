<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="355" viewBox="0 0 1040 355" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1040" height="355" fill="#ffffff"/><text x="30" y="32" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Keep the calculations pure: input and output live at the edges</text><rect x="410" y="56" width="220" height="48" rx="7" fill="#fff" stroke="#1d2330" stroke-width="1.6" /><text x="520.0" y="76" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="middle">cli.py</text><text x="520.0" y="93" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">reads arguments, sets up logging</text><rect x="60" y="150" width="200" height="48" rx="7" fill="#fff" stroke="#7a4fa0" stroke-width="1.6" /><text x="160.0" y="170" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="middle">config.py</text><text x="160.0" y="187" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">environment → ReportConfig</text><rect x="300" y="150" width="200" height="48" rx="7" fill="#fff" stroke="#c0662b" stroke-width="1.6" /><text x="400.0" y="170" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="middle">db.py</text><text x="400.0" y="187" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">SQL → DataFrame</text><rect x="540" y="150" width="200" height="48" rx="7" fill="#e2f3ee" stroke="#2f7d6d" stroke-width="1.6" /><text x="640.0" y="170" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="middle">transform.py</text><text x="640.0" y="187" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">DataFrame → results</text><rect x="780" y="150" width="200" height="48" rx="7" fill="#fff" stroke="#c0662b" stroke-width="1.6" /><text x="880.0" y="170" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="middle">excel.py</text><text x="880.0" y="187" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">results → .xlsx</text><path d="M520,104 V124 H160 V150" fill="none" stroke="#c9d3df" stroke-width="1.6" stroke-linejoin="round"/><path d="M520,104 V124 H400 V150" fill="none" stroke="#c9d3df" stroke-width="1.6" stroke-linejoin="round"/><path d="M520,104 V124 H640 V150" fill="none" stroke="#c9d3df" stroke-width="1.6" stroke-linejoin="round"/><path d="M520,104 V124 H880 V150" fill="none" stroke="#c9d3df" stroke-width="1.6" stroke-linejoin="round"/><rect x="300" y="250" width="200" height="44" rx="7" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1.6" /><text x="400.0" y="270" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="middle">PostgreSQL</text><text x="400.0" y="287" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">riverstone_2025</text><rect x="780" y="250" width="200" height="44" rx="7" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1.6" /><text x="880.0" y="270" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="middle">reports/ folder</text><text x="880.0" y="287" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">riverstone_monthly_2025-12.xlsx</text><path d="M400,198 V250" fill="none" stroke="#c0662b" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5,4"/><path d="M880,198 V250" fill="none" stroke="#c0662b" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5,4"/><rect x="540" y="240" width="200" height="64" rx="6" fill="#fff" stroke="#2f7d6d" stroke-width="1.2" /><text x="640" y="260" font-size="11.5" fill="#2f7d6d" font-weight="normal" text-anchor="middle">No database, no files:</text><text x="640" y="276" font-size="11.5" fill="#2f7d6d" font-weight="normal" text-anchor="middle">tested with a 5-row</text><text x="640" y="292" font-size="11.5" fill="#2f7d6d" font-weight="normal" text-anchor="middle">DataFrame in milliseconds</text><text x="30" y="338" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Orange modules touch the outside world and get a few integration tests. The green core holds the business rules and gets many fast unit tests.</text></svg>