<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="322" viewBox="0 0 1040 322" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1040" height="322" fill="#ffffff"/><text x="30" y="32" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Why a dictionary lookup does not get slower as it grows</text><rect x="40" y="80" width="200" height="40" rx="6" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><text x="140" y="105" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">(100001, 101)</text><path d="M240,100 H300" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M292,94 L302,100 L292,106" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><rect x="305" y="80" width="180" height="40" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="395" y="105" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">hash() % 8</text><path d="M485,100 H545" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M537,94 L547,100 L537,106" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><text x="565" y="105" font-size="12" fill="#7a4fa0" font-weight="bold" text-anchor="start">bucket 3</text><rect x="40" y="140" width="200" height="40" rx="6" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><text x="140" y="165" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">(100002, 104)</text><path d="M240,160 H300" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M292,154 L302,160 L292,166" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><rect x="305" y="140" width="180" height="40" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="395" y="165" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">hash() % 8</text><path d="M485,160 H545" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M537,154 L547,160 L537,166" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><text x="565" y="165" font-size="12" fill="#7a4fa0" font-weight="bold" text-anchor="start">bucket 6</text><rect x="40" y="200" width="200" height="40" rx="6" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><text x="140" y="225" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">(100003, 108)</text><path d="M240,220 H300" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M292,214 L302,220 L292,226" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><rect x="305" y="200" width="180" height="40" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="395" y="225" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">hash() % 8</text><path d="M485,220 H545" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M537,214 L547,220 L537,226" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><text x="565" y="225" font-size="12" fill="#7a4fa0" font-weight="bold" text-anchor="start">bucket 3</text><rect x="700" y="70" width="180" height="26" rx="4" fill="#fff" stroke="#c9d3df" stroke-width="1" /><text x="712" y="88" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">bucket 0</text><rect x="700" y="100" width="180" height="26" rx="4" fill="#fff" stroke="#c9d3df" stroke-width="1" /><text x="712" y="118" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">bucket 1</text><rect x="700" y="130" width="180" height="26" rx="4" fill="#fff" stroke="#c9d3df" stroke-width="1" /><text x="712" y="148" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">bucket 2</text><rect x="700" y="160" width="180" height="26" rx="4" fill="#e2f3ee" stroke="#c9d3df" stroke-width="1" /><text x="712" y="178" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">bucket 3</text><text x="790" y="178" font-size="11" fill="#2f7d6d" font-weight="normal" text-anchor="start">2 entries (a collision)</text><rect x="700" y="190" width="180" height="26" rx="4" fill="#fff" stroke="#c9d3df" stroke-width="1" /><text x="712" y="208" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">bucket 4</text><rect x="700" y="220" width="180" height="26" rx="4" fill="#fff" stroke="#c9d3df" stroke-width="1" /><text x="712" y="238" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">bucket 5</text><rect x="700" y="250" width="180" height="26" rx="4" fill="#e2f3ee" stroke="#c9d3df" stroke-width="1" /><text x="712" y="268" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">bucket 6</text><text x="790" y="268" font-size="11" fill="#2f7d6d" font-weight="normal" text-anchor="start">1 entry</text><rect x="700" y="280" width="180" height="26" rx="4" fill="#fff" stroke="#c9d3df" stroke-width="1" /><text x="712" y="298" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">bucket 7</text><text x="30" y="280" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">To find a key, Python hashes it, takes the remainder, and looks in one bucket: the same two steps whether the dictionary holds ten keys or ten million.</text><text x="30" y="302" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Collisions (two keys in one bucket) are normal and cheap. Keys must be immutable, because a key that changed would hash to a different bucket.</text></svg>