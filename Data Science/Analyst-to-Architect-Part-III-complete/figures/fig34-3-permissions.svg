<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="483" viewBox="0 0 1040 483" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1040" height="483" fill="#ffffff"/><text x="30" y="32" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Reading ls -l</text><rect x="30" y="58" width="980" height="44" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="50" y="86" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">-rw-r--r--  1  meera  meera  901  Jan  5  2026  customers.csv</text><path d="M50,102 V125" fill="none" stroke="#1d2330" stroke-width="1.4" stroke-linejoin="round"/><text x="58" y="129" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">type: - file, d folder, l link</text><path d="M70,102 V147" fill="none" stroke="#2f7d6d" stroke-width="1.4" stroke-linejoin="round"/><text x="78" y="151" font-size="12" fill="#2f7d6d" font-weight="bold" text-anchor="start">user: owner: read + write</text><path d="M95,102 V169" fill="none" stroke="#7a4fa0" stroke-width="1.4" stroke-linejoin="round"/><text x="103" y="173" font-size="12" fill="#7a4fa0" font-weight="bold" text-anchor="start">group: read only</text><path d="M120,102 V191" fill="none" stroke="#c0662b" stroke-width="1.4" stroke-linejoin="round"/><text x="128" y="195" font-size="12" fill="#c0662b" font-weight="bold" text-anchor="start">others: read only</text><text x="560" y="132" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Each set of three is read (r), write (w), execute (x).</text><text x="560" y="154" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">On a folder, x means &quot;can go into it&quot;.</text><rect x="30" y="240" width="980" height="42" rx="6" fill="#fff" stroke="#0f5c8c" stroke-width="1.5" /><text x="60" y="267" font-size="14" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">644</text><text x="130" y="267" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">rw- r-- r--</text><text x="290" y="267" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">owner writes, everyone reads</text><text x="620" y="267" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">data files, documents</text><rect x="30" y="292" width="980" height="42" rx="6" fill="#fff" stroke="#2f7d6d" stroke-width="1.5" /><text x="60" y="319" font-size="14" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">755</text><text x="130" y="319" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">rwx r-x r-x</text><text x="290" y="319" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">owner writes, everyone reads and runs</text><text x="620" y="319" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">scripts, folders</text><rect x="30" y="344" width="980" height="42" rx="6" fill="#fff" stroke="#c0662b" stroke-width="1.5" /><text x="60" y="371" font-size="14" fill="#c0662b" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">600</text><text x="130" y="371" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">rw- --- ---</text><text x="290" y="371" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">owner only</text><text x="620" y="371" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">SSH keys, .env files with passwords</text><rect x="30" y="396" width="980" height="42" rx="6" fill="#fff" stroke="#7a4fa0" stroke-width="1.5" /><text x="60" y="423" font-size="14" fill="#7a4fa0" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">700</text><text x="130" y="423" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">rwx --- ---</text><text x="290" y="423" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">owner only, and can enter</text><text x="620" y="423" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">~/.ssh</text><text x="30" y="466" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">chmod +x script.sh adds the execute bit; chmod 600 key removes everyone else&#x27;s access.</text></svg>