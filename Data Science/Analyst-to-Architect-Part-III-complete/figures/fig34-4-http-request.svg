<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="503" viewBox="0 0 1040 503" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1040" height="503" fill="#ffffff"/><text x="30" y="32" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">What happens when curl asks for a file</text><rect x="30" y="62" width="980" height="40" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="50" y="88" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">curl --silent http://127.0.0.1:8034/exports/orders_2025-12-16.csv</text><text x="50" y="128" font-size="12.5" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">http</text><text x="200" y="128" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">the protocol: HTTP, or https for encrypted</text><text x="50" y="152" font-size="12.5" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">127.0.0.1</text><text x="200" y="152" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">which machine (localhost = this one)</text><text x="50" y="176" font-size="12.5" fill="#7a4fa0" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">8034</text><text x="200" y="176" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">which program on it: the port</text><text x="50" y="200" font-size="12.5" fill="#c0662b" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">/exports/orders_…</text><text x="200" y="200" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">what to ask for: the path</text><rect x="30" y="240" width="980" height="52" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><text x="50" y="262" font-size="12.5" fill="#0f5c8c" font-weight="bold" text-anchor="start">1. Name → address</text><text x="50" y="281" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">A name like api.example.com is looked up in DNS. 127.0.0.1 is already an address, so there is nothing to look up.</text><rect x="30" y="302" width="980" height="52" rx="7" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><text x="50" y="324" font-size="12.5" fill="#2f7d6d" font-weight="bold" text-anchor="start">2. Connect to the port</text><text x="50" y="343" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">The machine&#x27;s program listening on 8034 accepts the connection. ss -ltn shows who is listening.</text><rect x="30" y="364" width="980" height="52" rx="7" fill="#fff" stroke="#7a4fa0" stroke-width="1.6" /><text x="50" y="386" font-size="12.5" fill="#7a4fa0" font-weight="bold" text-anchor="start">3. Send the request</text><text x="50" y="405" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">GET /exports/orders_2025-12-16.csv, plus headers such as an API key.</text><rect x="30" y="426" width="980" height="52" rx="7" fill="#fff" stroke="#c0662b" stroke-width="1.6" /><text x="50" y="448" font-size="12.5" fill="#c0662b" font-weight="bold" text-anchor="start">4. Read the answer</text><text x="50" y="467" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">A status code (200 found, 404 missing, 429 slow down, 503 try later), headers, then the body.</text></svg>