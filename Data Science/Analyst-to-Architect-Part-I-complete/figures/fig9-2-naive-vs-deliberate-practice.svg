<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="414" viewBox="0 0 1030 414" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1030" height="414" fill="#ffffff"/><rect x="30" y="30" width="970" height="40" rx="6" fill="#1d2330" stroke="none" stroke-width="1" /><text x="44" y="56" font-size="13" fill="#fff" font-weight="bold" text-anchor="start"></text><text x="194" y="56" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Naive practice</text><text x="574" y="56" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Deliberate practice</text><rect x="30" y="70" width="970" height="50" rx="0" fill="#f6f9fc" stroke="none" stroke-width="1" /><text x="44" y="100" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Goal</text><rect x="188" y="80" width="6" height="30" rx="2" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="204" y="100" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">&quot;Do some SQL tonight&quot;</text><rect x="568" y="80" width="6" height="30" rx="2" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="584" y="100" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">&quot;Write a LEFT JOIN that keeps never-ordered customers&quot;</text><rect x="30" y="120" width="970" height="50" rx="0" fill="#fff" stroke="none" stroke-width="1" /><text x="44" y="150" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Difficulty</text><rect x="188" y="130" width="6" height="30" rx="2" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="204" y="150" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">What already feels comfortable</text><rect x="568" y="130" width="6" height="30" rx="2" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="584" y="150" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">Slightly beyond what you can do unaided</text><rect x="30" y="170" width="970" height="50" rx="0" fill="#f6f9fc" stroke="none" stroke-width="1" /><text x="44" y="200" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Attention</text><rect x="188" y="180" width="6" height="30" rx="2" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="204" y="200" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">Half-watching a video, phone nearby</text><rect x="568" y="180" width="6" height="30" rx="2" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="584" y="200" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">Full focus for a short, fixed block</text><rect x="30" y="220" width="970" height="50" rx="0" fill="#fff" stroke="none" stroke-width="1" /><text x="44" y="250" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Feedback</text><rect x="188" y="230" width="6" height="30" rx="2" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="204" y="250" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">None, or &quot;it ran, so it&#x27;s right&quot;</text><rect x="568" y="230" width="6" height="30" rx="2" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="584" y="250" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">Compare with a known answer; find why it differs</text><rect x="30" y="270" width="970" height="50" rx="0" fill="#f6f9fc" stroke="none" stroke-width="1" /><text x="44" y="300" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Repetition</text><rect x="188" y="280" width="6" height="30" rx="2" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="204" y="300" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">Move on after one success</text><rect x="568" y="280" width="6" height="30" rx="2" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="584" y="300" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">Redo it tomorrow without looking; vary it</text><rect x="30" y="320" width="970" height="50" rx="0" fill="#fff" stroke="none" stroke-width="1" /><text x="44" y="350" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Record</text><rect x="188" y="330" width="6" height="30" rx="2" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="204" y="350" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">Nothing written down</text><rect x="568" y="330" width="6" height="30" rx="2" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="584" y="350" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">A log: what was hard, what to try next</text><path d="M30,370 H1000" fill="none" stroke="#c9d3df" stroke-width="1" stroke-linejoin="round"/><text x="30" y="396" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start">Same hours, different results: deliberate practice spends them where you&#x27;re weakest, and checks every attempt.</text></svg>