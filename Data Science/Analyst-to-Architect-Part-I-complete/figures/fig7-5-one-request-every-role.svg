<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="478" viewBox="0 0 1030 478" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1030" height="478" fill="#ffffff"/><rect x="30" y="24" width="988" height="62" rx="8" fill="#fff4e8" stroke="#c0662b" stroke-width="1.6" /><text x="46" y="50" font-size="14" fill="#c0662b" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Data architect</text><text x="46" y="72" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Designs how the pieces fit: where the score lives, who owns each definition, who may see what, what it costs.</text><text x="30" y="120" font-size="13.5" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">1 · Clarify and answer</text><rect x="33" y="137" width="226" height="74" rx="7" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="30" y="134" width="226" height="74" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.4" /><text x="42" y="160" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start">Business analyst</text><text x="42" y="181" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">turns the request into a clear</text><text x="42" y="198" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">question</text><rect x="33" y="225" width="226" height="74" rx="7" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="30" y="222" width="226" height="74" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.4" /><text x="42" y="248" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start">Data analyst</text><text x="42" y="269" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">finds the five quiet customers</text><path d="M258,170 L282,170" fill="none" stroke="#5b6475" stroke-width="2" stroke-linejoin="round"/><path d="M282,170 L273.9,173.9 L273.9,166.1 Z" fill="#5b6475"/><text x="284" y="120" font-size="13.5" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">2 · Share and standardize</text><rect x="287" y="137" width="226" height="74" rx="7" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="284" y="134" width="226" height="74" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.4" /><text x="296" y="160" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start">BI developer</text><text x="296" y="181" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">at-risk page on the sales</text><text x="296" y="198" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">dashboard</text><rect x="287" y="225" width="226" height="74" rx="7" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="284" y="222" width="226" height="74" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.4" /><text x="296" y="248" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start">Analytics engineer</text><text x="296" y="269" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">one tested definition of</text><text x="296" y="286" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">&quot;active&quot;</text><path d="M512,170 L536,170" fill="none" stroke="#5b6475" stroke-width="2" stroke-linejoin="round"/><path d="M536,170 L527.9,173.9 L527.9,166.1 Z" fill="#5b6475"/><text x="538" y="120" font-size="13.5" fill="#7a4fa0" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">3 · Predict</text><rect x="541" y="137" width="226" height="74" rx="7" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="538" y="134" width="226" height="74" rx="7" fill="#fff" stroke="#7a4fa0" stroke-width="1.4" /><text x="550" y="160" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start">Data scientist</text><text x="550" y="181" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">predicts who will go quiet</text><text x="550" y="198" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">next</text><rect x="541" y="225" width="226" height="74" rx="7" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="538" y="222" width="226" height="74" rx="7" fill="#fff" stroke="#7a4fa0" stroke-width="1.4" /><text x="550" y="248" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start">ML engineer</text><text x="550" y="269" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">scores every customer each</text><text x="550" y="286" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">night</text><path d="M766,170 L790,170" fill="none" stroke="#5b6475" stroke-width="2" stroke-linejoin="round"/><path d="M790,170 L781.9,173.9 L781.9,166.1 Z" fill="#5b6475"/><text x="792" y="120" font-size="13.5" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">4 · Run and act</text><rect x="795" y="137" width="226" height="74" rx="7" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="792" y="134" width="226" height="74" rx="7" fill="#fff" stroke="#2f7d6d" stroke-width="1.4" /><text x="804" y="160" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start">Data engineer</text><text x="804" y="181" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">fresh, checked data by 6 a.m.</text><rect x="795" y="225" width="226" height="74" rx="7" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="792" y="222" width="226" height="74" rx="7" fill="#fff" stroke="#2f7d6d" stroke-width="1.4" /><text x="804" y="248" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start">Integration engineer</text><text x="804" y="269" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">tasks in the CRM, Monday email</text><rect x="795" y="313" width="226" height="74" rx="7" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="792" y="310" width="226" height="74" rx="7" fill="#fff" stroke="#2f7d6d" stroke-width="1.4" /><text x="804" y="336" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start">AI engineer</text><text x="804" y="357" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">call brief drafted; rep</text><text x="804" y="374" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">approves</text><rect x="30" y="410" width="988" height="50" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="46" y="431" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">Start: Anita asks, &quot;Some customers seem to have stopped ordering. Which ones, and what should we do?&quot;</text><text x="46" y="450" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">End: every Monday, each sales rep knows which customers to call, and why.</text></svg>