<svg xmlns="http://www.w3.org/2000/svg" width="690" height="680" viewBox="0 0 690 680" font-family="DejaVu Sans, Arial, sans-serif"><rect width="690" height="680" fill="#ffffff"/><text x="34" y="36" font-size="15.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Four things go wrong. Ask where the change is before asking how to undo it.</text><text x="34" y="60" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Choosing between these is the whole skill. Typing them is not.</text><rect x="36" y="91" width="300" height="232" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="34" y="88" width="300" height="232" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><path d="M34,96 a8,8 0 0 1 8,-8 H326 a8,8 0 0 1 8,8 V124 H34 Z" fill="#0f5c8c"/><text x="48" y="113" font-size="13" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">1.  You edited a file</text><text x="48" y="148" font-size="11" fill="#5b6475" font-weight="bold" text-anchor="start">Where is the change?</text><text x="48" y="168" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">The change is in the working directory</text><text x="48" y="185" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">only. Nothing staged, nothing committed.</text><rect x="48" y="224" width="272" height="30" rx="5" fill="#f6f9fc" stroke="#0f5c8c" stroke-width="1.2" /><text x="58" y="244" font-size="12.5" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">git restore &lt;file&gt;</text><text x="48" y="272" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">Destructive: the edit was never recorded, so</text><text x="48" y="288" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">it is gone. Run git diff first.</text><rect x="358" y="91" width="300" height="232" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="356" y="88" width="300" height="232" rx="8" fill="#fff" stroke="#c0662b" stroke-width="1.6" /><path d="M356,96 a8,8 0 0 1 8,-8 H648 a8,8 0 0 1 8,8 V124 H356 Z" fill="#c0662b"/><text x="370" y="113" font-size="13" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">2.  You staged the wrong thing</text><text x="370" y="148" font-size="11" fill="#5b6475" font-weight="bold" text-anchor="start">Where is the change?</text><text x="370" y="168" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">The change is staged. The file on disk</text><text x="370" y="185" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">is untouched.</text><rect x="370" y="224" width="272" height="30" rx="5" fill="#f6f9fc" stroke="#c0662b" stroke-width="1.2" /><text x="380" y="244" font-size="12.5" fill="#c0662b" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">git restore --staged &lt;file&gt;</text><text x="370" y="272" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">Safe. It only removes the file from the next</text><text x="370" y="288" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">commit.</text><rect x="36" y="345" width="300" height="232" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="34" y="342" width="300" height="232" rx="8" fill="#fff" stroke="#7a4fa0" stroke-width="1.6" /><path d="M34,350 a8,8 0 0 1 8,-8 H326 a8,8 0 0 1 8,8 V378 H34 Z" fill="#7a4fa0"/><text x="48" y="367" font-size="13" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">3.  The last commit is wrong</text><text x="48" y="402" font-size="11" fill="#5b6475" font-weight="bold" text-anchor="start">Where is the change?</text><text x="48" y="422" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">It is in the history, but you have not</text><text x="48" y="439" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">pushed it.</text><rect x="48" y="478" width="272" height="30" rx="5" fill="#f6f9fc" stroke="#7a4fa0" stroke-width="1.2" /><text x="58" y="498" font-size="12.5" fill="#7a4fa0" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">git commit --amend</text><text x="48" y="526" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">Safe while private. Never amend a commit</text><text x="48" y="542" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">others have pulled.</text><rect x="358" y="345" width="300" height="232" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="356" y="342" width="300" height="232" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><path d="M356,350 a8,8 0 0 1 8,-8 H648 a8,8 0 0 1 8,8 V378 H356 Z" fill="#2f7d6d"/><text x="370" y="367" font-size="13" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">4.  A shared commit is wrong</text><text x="370" y="402" font-size="11" fill="#5b6475" font-weight="bold" text-anchor="start">Where is the change?</text><text x="370" y="422" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">It is in the history and other people</text><text x="370" y="439" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">already have it.</text><rect x="370" y="478" width="272" height="30" rx="5" fill="#f6f9fc" stroke="#2f7d6d" stroke-width="1.2" /><text x="380" y="498" font-size="12.5" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">git revert &lt;hash&gt;</text><text x="370" y="526" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">Adds a new commit that undoes it. History is</text><text x="370" y="542" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">never rewritten.</text><path d="M34,612 H656" fill="none" stroke="#c9d3df" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="4 4"/><text x="34" y="640" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">git reset --hard is not on this list on purpose. It is the command that loses work,</text><text x="34" y="660" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">and the four above cover almost everything you will meet in your first two years.</text></svg>