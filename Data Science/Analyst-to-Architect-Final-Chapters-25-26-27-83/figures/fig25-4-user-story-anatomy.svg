<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" font-family="DejaVu Sans, Arial, sans-serif"><rect width="960" height="480" fill="#ffffff"/><text x="30" y="36" font-size="15" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">A user story, and the acceptance criteria that make it testable</text><text x="30" y="58" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Without criteria a story cannot be tested, so it can never be finished.</text><rect x="32" y="87" width="900" height="112" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="30" y="84" width="900" height="112" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.8" /><text x="48" y="114" font-size="13" fill="#7a4fa0" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">As a</text><text x="122" y="114" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">sales rep</text><text x="914" y="114" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="end" font-style="italic">who wants it</text><text x="48" y="144" font-size="13" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">I want</text><text x="122" y="144" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">to see which of my accounts are at risk of not ordering again</text><text x="914" y="144" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="end" font-style="italic">what they want</text><text x="48" y="174" font-size="13" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">so that</text><text x="122" y="174" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">I can call them before they go quiet</text><text x="914" y="174" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="end" font-style="italic">why it is worth building</text><text x="48" y="188" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">The &quot;so that&quot; clause is the one people drop, and the one that stops you building something correct and useless.</text><rect x="32" y="219" width="900" height="52" rx="7" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="30" y="216" width="900" height="52" rx="7" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><rect x="30" y="216" width="74" height="52" rx="7" fill="#1f6fa3" stroke="none" stroke-width="1" /><rect x="94" y="216" width="10" height="52" rx="0" fill="#1f6fa3" stroke="none" stroke-width="1" /><text x="46" y="247" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">AC-1</text><text x="118" y="238" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Given I am a logged-in sales rep, when I open the at-risk list, then I see only accounts where I am the rep.</text><text x="118" y="257" font-size="11" fill="#1f6fa3" font-weight="normal" text-anchor="start" font-style="italic">scope</text><rect x="32" y="281" width="900" height="52" rx="7" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="30" y="278" width="900" height="52" rx="7" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><rect x="30" y="278" width="74" height="52" rx="7" fill="#0f5c8c" stroke="none" stroke-width="1" /><rect x="94" y="278" width="10" height="52" rx="0" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="46" y="309" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">AC-2</text><text x="118" y="300" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Given an account whose last order was more than 1.5 times its own average gap, when the list is generated, then it appears.</text><text x="118" y="319" font-size="11" fill="#0f5c8c" font-weight="normal" text-anchor="start" font-style="italic">the actual rule, not the word &quot;recently&quot;</text><rect x="32" y="343" width="900" height="52" rx="7" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="30" y="340" width="900" height="52" rx="7" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><rect x="30" y="340" width="74" height="52" rx="7" fill="#c0662b" stroke="none" stroke-width="1" /><rect x="94" y="340" width="10" height="52" rx="0" fill="#c0662b" stroke="none" stroke-width="1" /><text x="46" y="371" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">AC-3</text><text x="118" y="362" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Given an account with no orders at all, when the list is generated, then it does not appear.</text><text x="118" y="381" font-size="11" fill="#c0662b" font-weight="normal" text-anchor="start" font-style="italic">the edge case</text><rect x="32" y="405" width="900" height="52" rx="7" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="30" y="402" width="900" height="52" rx="7" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><rect x="30" y="402" width="74" height="52" rx="7" fill="#2f7d6d" stroke="none" stroke-width="1" /><rect x="94" y="402" width="10" height="52" rx="0" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="46" y="433" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">AC-4</text><text x="118" y="424" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Given the list is open, when I sort by value at risk, then accounts order by last twelve months&#x27; revenue, highest first.</text><text x="118" y="443" font-size="11" fill="#2f7d6d" font-weight="normal" text-anchor="start" font-style="italic">behavior the user can check</text></svg>