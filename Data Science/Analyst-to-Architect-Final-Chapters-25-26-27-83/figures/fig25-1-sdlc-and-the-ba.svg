<svg xmlns="http://www.w3.org/2000/svg" width="1330" height="336" viewBox="0 0 1330 336" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1330" height="336" fill="#ffffff"/><text x="32" y="34" font-size="15" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The software development life cycle, and what the business analyst does in each phase</text><text x="32" y="56" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">The requirements phase is not the job. It is the first sixth of it.</text><rect x="34" y="77" width="196" height="186" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="32" y="74" width="196" height="186" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><path d="M32,82 a8,8 0 0 1 8,-8 H220 a8,8 0 0 1 8,8 V108 H32 Z" fill="#0f5c8c"/><text x="44" y="97" font-size="13.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">1  Requirements</text><text x="44" y="132" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">All of it: elicit, map the</text><text x="44" y="149" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">as-is, gap analysis, write</text><text x="44" y="166" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">and agree the requirements</text><rect x="44" y="226" width="172" height="10" rx="5" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="44" y="226" width="172" height="10" rx="5" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="44" y="248" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">BA effort: heaviest</text><path d="M230,167.0 H240" fill="none" stroke="#5b6475" stroke-width="2" stroke-linejoin="round"/><path d="M240,162.0 L247,167.0 L240,172.0 Z" fill="#5b6475"/><rect x="248" y="77" width="196" height="186" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="246" y="74" width="196" height="186" rx="8" fill="#fff" stroke="#1f6fa3" stroke-width="1.6" /><path d="M246,82 a8,8 0 0 1 8,-8 H434 a8,8 0 0 1 8,8 V108 H246 Z" fill="#1f6fa3"/><text x="258" y="97" font-size="13.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">2  Design</text><text x="258" y="132" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Answer questions, defend</text><text x="258" y="149" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">the requirement when</text><text x="258" y="166" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">design quietly drops part</text><text x="258" y="183" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">of it</text><rect x="258" y="226" width="172" height="10" rx="5" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="258" y="226" width="123" height="10" rx="5" fill="#1f6fa3" stroke="none" stroke-width="1" /><text x="258" y="248" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">BA effort: heavy</text><path d="M444,167.0 H454" fill="none" stroke="#5b6475" stroke-width="2" stroke-linejoin="round"/><path d="M454,162.0 L461,167.0 L454,172.0 Z" fill="#5b6475"/><rect x="462" y="77" width="196" height="186" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="460" y="74" width="196" height="186" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><path d="M460,82 a8,8 0 0 1 8,-8 H648 a8,8 0 0 1 8,8 V108 H460 Z" fill="#2f7d6d"/><text x="472" y="97" font-size="13.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">3  Build</text><text x="472" y="132" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Stay available. Clarify</text><text x="472" y="149" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">the small things that</text><text x="472" y="166" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">would otherwise be guessed</text><rect x="472" y="226" width="172" height="10" rx="5" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="472" y="226" width="44" height="10" rx="5" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="472" y="248" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">BA effort: light</text><path d="M658,167.0 H668" fill="none" stroke="#5b6475" stroke-width="2" stroke-linejoin="round"/><path d="M668,162.0 L675,167.0 L668,172.0 Z" fill="#5b6475"/><rect x="676" y="77" width="196" height="186" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="674" y="74" width="196" height="186" rx="8" fill="#fff" stroke="#7a4fa0" stroke-width="1.6" /><path d="M674,82 a8,8 0 0 1 8,-8 H862 a8,8 0 0 1 8,8 V108 H674 Z" fill="#7a4fa0"/><text x="686" y="97" font-size="13.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">4  Test</text><text x="686" y="132" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Write or review the UAT</text><text x="686" y="149" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">plan, prepare the business</text><text x="686" y="166" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">users who will run it</text><rect x="686" y="226" width="172" height="10" rx="5" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="686" y="226" width="86" height="10" rx="5" fill="#7a4fa0" stroke="none" stroke-width="1" /><text x="686" y="248" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">BA effort: medium</text><path d="M872,167.0 H882" fill="none" stroke="#5b6475" stroke-width="2" stroke-linejoin="round"/><path d="M882,162.0 L889,167.0 L882,172.0 Z" fill="#5b6475"/><rect x="890" y="77" width="196" height="186" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="888" y="74" width="196" height="186" rx="8" fill="#fff" stroke="#c0662b" stroke-width="1.6" /><path d="M888,82 a8,8 0 0 1 8,-8 H1076 a8,8 0 0 1 8,8 V108 H888 Z" fill="#c0662b"/><text x="900" y="97" font-size="13.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">5  Deploy</text><text x="900" y="132" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Run UAT, confirm the</text><text x="900" y="149" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">business need is met, sign</text><text x="900" y="166" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">off, hand over, train</text><rect x="900" y="226" width="172" height="10" rx="5" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="900" y="226" width="123" height="10" rx="5" fill="#c0662b" stroke="none" stroke-width="1" /><text x="900" y="248" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">BA effort: heavy</text><path d="M1086,167.0 H1096" fill="none" stroke="#5b6475" stroke-width="2" stroke-linejoin="round"/><path d="M1096,162.0 L1103,167.0 L1096,172.0 Z" fill="#5b6475"/><rect x="1104" y="77" width="196" height="186" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="1102" y="74" width="196" height="186" rx="8" fill="#fff" stroke="#5b6475" stroke-width="1.6" /><path d="M1102,82 a8,8 0 0 1 8,-8 H1290 a8,8 0 0 1 8,8 V108 H1102 Z" fill="#5b6475"/><text x="1114" y="97" font-size="13.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">6  Maintain</text><text x="1114" y="132" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Collect what did not work,</text><text x="1114" y="149" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">specify the changes, watch</text><text x="1114" y="166" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">the process drift back</text><rect x="1114" y="226" width="172" height="10" rx="5" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="1114" y="226" width="86" height="10" rx="5" fill="#5b6475" stroke="none" stroke-width="1" /><text x="1114" y="248" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">BA effort: medium</text><path d="M32,290 H1298" fill="none" stroke="#c9d3df" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="4 4"/><text x="32" y="316" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">Sign-off happens at the end of phase 1. Most of the damage in this job happens in phases 2 to 6.</text></svg>