<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="526" viewBox="0 0 1060 526" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1060" height="526" fill="#ffffff"/><text x="40" y="38" font-size="15.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Ninety seconds: what a hiring manager reads, in order</text><text x="40" y="62" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Then they either read properly or they close the tab. The order is predictable, so build for it.</text><rect x="150" y="92" width="8" height="368" rx="4" fill="#e6ebf2" stroke="none" stroke-width="1" /><rect x="40" y="92" width="88" height="30" rx="6" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="84.0" y="112" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">0–15s</text><circle cx="154" cy="107" r="7" fill="#fff" stroke="#0f5c8c" stroke-width="2.6"/><text x="172" y="104" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">The README&#x27;s first paragraph</text><text x="172" y="124" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">They conclude:  Is there a question here, or a dataset?</text><text x="172" y="144" font-size="11.5" fill="#0f5c8c" font-weight="normal" text-anchor="start">So:  Write it as the question and the answer.</text><rect x="40" y="168" width="88" height="30" rx="6" fill="#c0662b" stroke="none" stroke-width="1" /><text x="84.0" y="188" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">15–30s</text><circle cx="154" cy="183" r="7" fill="#fff" stroke="#c0662b" stroke-width="2.6"/><text x="172" y="180" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">One chart or table</text><text x="172" y="200" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">They conclude:  Can this person present a number to a human?</text><text x="172" y="220" font-size="11.5" fill="#c0662b" font-weight="normal" text-anchor="start">So:  Put the finding in the title.</text><rect x="40" y="244" width="88" height="30" rx="6" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="84.0" y="264" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">30–50s</text><circle cx="154" cy="259" r="7" fill="#fff" stroke="#2f7d6d" stroke-width="2.6"/><text x="172" y="256" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">One file of code</text><text x="172" y="276" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">They conclude:  Do they write for a reader or a machine?</text><text x="172" y="296" font-size="11.5" fill="#2f7d6d" font-weight="normal" text-anchor="start">So:  Comment why, never what.</text><rect x="40" y="320" width="88" height="30" rx="6" fill="#7a4fa0" stroke="none" stroke-width="1" /><text x="84.0" y="340" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">50–75s</text><circle cx="154" cy="335" r="7" fill="#fff" stroke="#7a4fa0" stroke-width="2.6"/><text x="172" y="332" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">The commit history</text><text x="172" y="352" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">They conclude:  Two weeks of work, or one upload an hour ago?</text><text x="172" y="372" font-size="11.5" fill="#7a4fa0" font-weight="normal" text-anchor="start">So:  Commit from day one. It cannot be faked later.</text><rect x="40" y="396" width="88" height="30" rx="6" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="84.0" y="416" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">75–90s</text><circle cx="154" cy="411" r="7" fill="#fff" stroke="#b23b3b" stroke-width="2.6"/><text x="172" y="408" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Anything saying what you did NOT find</text><text x="172" y="428" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">They conclude:  Should I trust the rest of this?</text><text x="172" y="448" font-size="11.5" fill="#b23b3b" font-weight="normal" text-anchor="start">So:  A FINDINGS.md file. Almost nobody has one.</text><path d="M40,478 H1020" fill="none" stroke="#c9d3df" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="4 4"/><text x="40" y="506" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">Three of the five are writing, and one is a habit you cannot add at the end. Only one is the analysis.</text></svg>