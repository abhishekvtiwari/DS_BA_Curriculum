<svg xmlns="http://www.w3.org/2000/svg" width="1034" height="410" viewBox="0 0 1034 410" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1034" height="410" fill="#ffffff"/><rect x="30" y="30" width="318" height="360" rx="8" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><path d="M30,38 a8,8 0 0 1 8,-8 H340 a8,8 0 0 1 8,8 V84 H30 Z" fill="#0f5c8c"/><text x="44" y="54" font-size="15" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Structured</text><text x="44" y="74" font-size="11.5" fill="#fff" font-weight="normal" text-anchor="start">Rows and columns with a fixed layout</text><rect x="368" y="30" width="318" height="360" rx="8" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><path d="M368,38 a8,8 0 0 1 8,-8 H678 a8,8 0 0 1 8,8 V84 H368 Z" fill="#7a4fa0"/><text x="382" y="54" font-size="15" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Semi-structured</text><text x="382" y="74" font-size="11.5" fill="#fff" font-weight="normal" text-anchor="start">Labels travel with the values</text><rect x="706" y="30" width="318" height="360" rx="8" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><path d="M706,38 a8,8 0 0 1 8,-8 H1016 a8,8 0 0 1 8,8 V84 H706 Z" fill="#c0662b"/><text x="720" y="54" font-size="15" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Unstructured</text><text x="720" y="74" font-size="11.5" fill="#fff" font-weight="normal" text-anchor="start">Meaning is in the words, not a layout</text><text x="44" y="122" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">order_items (order 5001)</text><rect x="44" y="130" width="278" height="24" rx="4" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="52" y="146.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">product_id</text><text x="136" y="146.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">qty</text><text x="190" y="146.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">price</text><text x="260" y="146.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">disc_%</text><rect x="44" y="154" width="278" height="24" rx="0" fill="#fff" stroke="#c9d3df" stroke-width="0.8" /><text x="52" y="170.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">101</text><text x="136" y="170.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">20</text><text x="190" y="170.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">450</text><text x="260" y="170.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">0</text><rect x="44" y="178" width="278" height="24" rx="0" fill="#fff" stroke="#c9d3df" stroke-width="0.8" /><text x="52" y="194.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">103</text><text x="136" y="194.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">50</text><text x="190" y="194.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">120</text><text x="260" y="194.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">5</text><text x="44" y="238" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">orders</text><rect x="44" y="246" width="278" height="24" rx="4" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="52" y="262.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">order_id</text><text x="132" y="262.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">customer_id</text><text x="226" y="262.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">order_date</text><rect x="44" y="270" width="278" height="24" rx="0" fill="#fff" stroke="#c9d3df" stroke-width="0.8" /><text x="52" y="286.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">5001</text><text x="132" y="286.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">1</text><text x="226" y="286.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">2026-01-05</text><text x="44" y="324" font-size="11.8" fill="#5b6475" font-weight="normal" text-anchor="start">Easy to count, sum, sort,</text><text x="44" y="342" font-size="11.8" fill="#5b6475" font-weight="normal" text-anchor="start">and join. Spreadsheets and</text><text x="44" y="360" font-size="11.8" fill="#5b6475" font-weight="normal" text-anchor="start">databases work this way.</text><rect x="378" y="104" width="298" height="222" rx="5" fill="#f6f9fc" stroke="none" stroke-width="1" /><text x="386" y="126.0" font-size="11.3" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">{</text><text x="386" y="145.5" font-size="11.3" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">  &quot;order_id&quot;: 5001,</text><text x="386" y="165.0" font-size="11.3" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">  &quot;customer&quot;: &quot;Sharma Hardware&quot;,</text><text x="386" y="184.5" font-size="11.3" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">  &quot;order_date&quot;: &quot;2026-01-05&quot;,</text><text x="386" y="204.0" font-size="11.3" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">  &quot;items&quot;: [</text><text x="386" y="223.5" font-size="11.3" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">    {&quot;product_id&quot;: 101, &quot;qty&quot;: 20,</text><text x="386" y="243.0" font-size="11.3" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">     &quot;price&quot;: 450, &quot;disc_pct&quot;: 0},</text><text x="386" y="262.5" font-size="11.3" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">    {&quot;product_id&quot;: 103, &quot;qty&quot;: 50,</text><text x="386" y="282.0" font-size="11.3" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">     &quot;price&quot;: 120, &quot;disc_pct&quot;: 5}</text><text x="386" y="301.5" font-size="11.3" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">  ]</text><text x="386" y="321.0" font-size="11.3" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">}</text><text x="382" y="348" font-size="11.8" fill="#5b6475" font-weight="normal" text-anchor="start">JSON from a website or app. Each</text><text x="382" y="366" font-size="11.8" fill="#5b6475" font-weight="normal" text-anchor="start">value has a label; the layout can vary.</text><rect x="716" y="104" width="298" height="222" rx="5" fill="#fffdf6" stroke="#e5dcc3" stroke-width="1" /><text x="724" y="126.0" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">From: Rakesh (Sharma Hardware)</text><text x="724" y="145.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">To: Neha Kulkarni</text><text x="724" y="165.0" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Subject: Order</text><text x="724" y="184.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start"></text><text x="724" y="204.0" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Hi Neha,</text><text x="724" y="223.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Please send 20 of the 10L storage</text><text x="724" y="243.0" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">boxes and 50 water bottles, at the</text><text x="724" y="262.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">rates you quoted. 5% off the</text><text x="724" y="282.0" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">bottles as discussed?</text><text x="724" y="301.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start"></text><text x="724" y="321.0" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Thanks, Rakesh</text><text x="720" y="348" font-size="11.8" fill="#5b6475" font-weight="normal" text-anchor="start">An email. A person (or an AI tool)</text><text x="720" y="366" font-size="11.8" fill="#5b6475" font-weight="normal" text-anchor="start">must read it to pull out the facts.</text></svg>