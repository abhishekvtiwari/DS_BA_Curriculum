<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="440" viewBox="0 0 1040 440" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1040" height="440" fill="#ffffff"/><text x="40" y="30" font-size="14.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Up 50%, then down 50%</text><rect x="40" y="220.0" width="90" height="150.0" rx="4" fill="#5b6475" stroke="none" stroke-width="1" /><text x="85.0" y="210.0" font-size="15" fill="#1d2330" font-weight="bold" text-anchor="middle">₹100</text><text x="85.0" y="392" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="middle">start</text><rect x="200" y="145.0" width="90" height="225.0" rx="4" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="245.0" y="135.0" font-size="15" fill="#1d2330" font-weight="bold" text-anchor="middle">₹150</text><text x="245.0" y="392" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="middle">after +50%</text><path d="M138,190.0 L192,115.0" fill="none" stroke="#0f5c8c" stroke-width="2" stroke-linejoin="round"/><path d="M192,115.0 L190.0,123.8 L184.3,119.7 Z" fill="#0f5c8c"/><text x="165.0" y="97.0" font-size="13" fill="#0f5c8c" font-weight="bold" text-anchor="middle">+50% of 100</text><rect x="360" y="257.5" width="90" height="112.5" rx="4" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="405.0" y="247.5" font-size="15" fill="#1d2330" font-weight="bold" text-anchor="middle">₹75</text><text x="405.0" y="392" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="middle">after −50%</text><path d="M298,115.0 L352,227.5" fill="none" stroke="#0f5c8c" stroke-width="2" stroke-linejoin="round"/><path d="M352,227.5 L345.3,221.5 L351.6,218.5 Z" fill="#0f5c8c"/><text x="325.0" y="97.0" font-size="13" fill="#0f5c8c" font-weight="bold" text-anchor="middle">−50% of 150</text><path d="M30,370 H460" fill="none" stroke="#c9d3df" stroke-width="1.2" stroke-linejoin="round"/><text x="560" y="30" font-size="14.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Down 20%, then up 20%</text><rect x="560" y="220.0" width="90" height="150.0" rx="4" fill="#5b6475" stroke="none" stroke-width="1" /><text x="605.0" y="210.0" font-size="15" fill="#1d2330" font-weight="bold" text-anchor="middle">₹100</text><text x="605.0" y="392" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="middle">start</text><rect x="720" y="250.0" width="90" height="120.0" rx="4" fill="#c0662b" stroke="none" stroke-width="1" /><text x="765.0" y="240.0" font-size="15" fill="#1d2330" font-weight="bold" text-anchor="middle">₹80</text><text x="765.0" y="392" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="middle">after −20%</text><path d="M658,190.0 L712,220.0" fill="none" stroke="#c0662b" stroke-width="2" stroke-linejoin="round"/><path d="M712,220.0 L703.1,219.0 L706.5,212.9 Z" fill="#c0662b"/><text x="685.0" y="172.0" font-size="13" fill="#c0662b" font-weight="bold" text-anchor="middle">−20% of 100</text><rect x="880" y="226.0" width="90" height="144.0" rx="4" fill="#c0662b" stroke="none" stroke-width="1" /><text x="925.0" y="216.0" font-size="15" fill="#1d2330" font-weight="bold" text-anchor="middle">₹96</text><text x="925.0" y="392" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="middle">after +20%</text><path d="M818,220.0 L872,196.0" fill="none" stroke="#c0662b" stroke-width="2" stroke-linejoin="round"/><path d="M872,196.0 L865.8,202.6 L863.0,196.2 Z" fill="#c0662b"/><text x="845.0" y="178.0" font-size="13" fill="#c0662b" font-weight="bold" text-anchor="middle">+20% of 80</text><path d="M550,370 H980" fill="none" stroke="#c9d3df" stroke-width="1.2" stroke-linejoin="round"/><text x="40" y="420" font-size="13" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Each percentage is taken of a different starting number, so equal-looking rises and falls don&#x27;t cancel out.</text></svg>