<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="276" viewBox="0 0 1010 276" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1010" height="276" fill="#ffffff"/><rect x="30" y="30" width="305" height="200" rx="10" fill="#fff" stroke="#0f5c8c" stroke-width="1.8" /><circle cx="80" cy="85" r="34" fill="#0f5c8c"/><text x="80" y="98" font-size="34" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">3</text><text x="52" y="150" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start">copies of important data</text><text x="52" y="174" font-size="12.3" fill="#5b6475" font-weight="normal" text-anchor="start">the original, plus two backups</text><rect x="355" y="30" width="305" height="200" rx="10" fill="#fff" stroke="#7a4fa0" stroke-width="1.8" /><circle cx="405" cy="85" r="34" fill="#7a4fa0"/><text x="405" y="98" font-size="34" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">2</text><text x="377" y="150" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start">different types of storage</text><text x="377" y="174" font-size="12.3" fill="#5b6475" font-weight="normal" text-anchor="start">e.g. the laptop&#x27;s drive and an</text><text x="377" y="193" font-size="12.3" fill="#5b6475" font-weight="normal" text-anchor="start">external drive or a cloud service</text><rect x="680" y="30" width="305" height="200" rx="10" fill="#fff" stroke="#2f7d6d" stroke-width="1.8" /><circle cx="730" cy="85" r="34" fill="#2f7d6d"/><text x="730" y="98" font-size="34" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">1</text><text x="702" y="150" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start">copy kept somewhere else</text><text x="702" y="174" font-size="12.3" fill="#5b6475" font-weight="normal" text-anchor="start">off-site or in the cloud, safe from</text><text x="702" y="193" font-size="12.3" fill="#5b6475" font-weight="normal" text-anchor="start">fire, theft, or ransomware at the</text><text x="702" y="212" font-size="12.3" fill="#5b6475" font-weight="normal" text-anchor="start">office</text><text x="30" y="258" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">A backup you have never restored is a hope, not a backup: test a restore regularly.</text></svg>