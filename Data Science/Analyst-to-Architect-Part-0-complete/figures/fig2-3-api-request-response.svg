<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="400" viewBox="0 0 1010 400" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1010" height="400" fill="#ffffff"/><rect x="30" y="90" width="220" height="110" rx="10" fill="#fff" stroke="#0f5c8c" stroke-width="1.8" /><path d="M30,98 a8,8 0 0 1 8,-8 H242 a8,8 0 0 1 8,8 V128 H30 Z" fill="#0f5c8c"/><text x="44" y="115" font-size="14.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Your program</text><text x="44" y="152" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">a report script, an app,</text><text x="44" y="172" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">or a tool like Power BI</text><rect x="390" y="90" width="220" height="110" rx="10" fill="#fff" stroke="#7a4fa0" stroke-width="1.8" /><path d="M390,98 a8,8 0 0 1 8,-8 H602 a8,8 0 0 1 8,8 V128 H390 Z" fill="#7a4fa0"/><text x="404" y="115" font-size="14.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The API</text><text x="404" y="152" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">checks the key,</text><text x="404" y="172" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">understands the request</text><rect x="750" y="90" width="220" height="110" rx="10" fill="#fff" stroke="#2f7d6d" stroke-width="1.8" /><path d="M750,98 a8,8 0 0 1 8,-8 H962 a8,8 0 0 1 8,8 V128 H750 Z" fill="#2f7d6d"/><text x="764" y="115" font-size="14.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Riverstone&#x27;s database</text><text x="764" y="152" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">holds the data;</text><text x="764" y="172" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">never exposed directly</text><path d="M255,118 L385,118" fill="none" stroke="#0f5c8c" stroke-width="2.2" stroke-linejoin="round"/><path d="M385,118 L376.9,121.9 L376.9,114.1 Z" fill="#0f5c8c"/><text x="262" y="70" font-size="13" fill="#0f5c8c" font-weight="bold" text-anchor="start">1  Request</text><text x="30" y="268" font-size="12.5" fill="#0f5c8c" font-weight="bold" text-anchor="start">What step 1 sends:</text><rect x="30" y="280" width="300" height="70" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="42" y="304" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">GET /api/orders/5009</text><text x="42" y="324" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">X-API-Key: demo-key-123</text><path d="M615,130 L745,130" fill="none" stroke="#7a4fa0" stroke-width="2.2" stroke-linejoin="round"/><path d="M745,130 L736.9,133.9 L736.9,126.1 Z" fill="#7a4fa0"/><text x="622" y="82" font-size="13" fill="#7a4fa0" font-weight="bold" text-anchor="start">2  Query</text><path d="M745,172 L615,172" fill="none" stroke="#2f7d6d" stroke-width="2.2" stroke-linejoin="round"/><path d="M615,172 L623.1,168.1 L623.1,175.9 Z" fill="#2f7d6d"/><text x="636" y="194" font-size="13" fill="#2f7d6d" font-weight="bold" text-anchor="start">3  Rows</text><path d="M385,176 L255,176" fill="none" stroke="#7a4fa0" stroke-width="2.2" stroke-linejoin="round"/><path d="M255,176 L263.1,172.1 L263.1,179.9 Z" fill="#7a4fa0"/><text x="270" y="214" font-size="13" fill="#7a4fa0" font-weight="bold" text-anchor="start">4  Response</text><text x="390" y="268" font-size="12.5" fill="#7a4fa0" font-weight="bold" text-anchor="start">What step 4 brings back:</text><rect x="390" y="280" width="420" height="100" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="402" y="304" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">HTTP/1.0 200 OK</text><text x="402" y="324" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Content-Type: application/json</text><text x="402" y="344" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace"></text><text x="402" y="364" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">{ &quot;order_id&quot;: 5009, &quot;status&quot;: &quot;Shipped&quot;, … }</text><text x="30" y="40" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Like a restaurant: you (the program) never walk into the kitchen (the database). You give the waiter (the API) a clear order, and it brings back a dish.</text></svg>