<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="500" viewBox="0 0 1060 500" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1060" height="500" fill="#ffffff"/><path d="M399.20621530828487,101.0 L444.3097545810582,121.5" fill="none" stroke="#5b6475" stroke-width="2" stroke-linejoin="round"/><path d="M444.3097545810582,121.5 L435.3,121.3 L438.2,114.9 Z" fill="#5b6475"/><path d="M523.5159698893431,193.5 L523.5159698893431,306.5" fill="none" stroke="#5b6475" stroke-width="2" stroke-linejoin="round"/><path d="M523.5159698893431,306.5 L520.0,298.2 L527.0,298.2 Z" fill="#5b6475"/><path d="M444.3097545810582,378.5 L399.20621530828487,399.0" fill="none" stroke="#5b6475" stroke-width="2" stroke-linejoin="round"/><path d="M399.20621530828487,399.0 L405.3,392.4 L408.2,398.8 Z" fill="#5b6475"/><path d="M240.79378469171508,399.0 L195.69024541894186,378.50000000000006" fill="none" stroke="#5b6475" stroke-width="2" stroke-linejoin="round"/><path d="M195.69024541894186,378.50000000000006 L204.7,378.7 L201.8,385.1 Z" fill="#5b6475"/><path d="M116.48403011065696,306.50000000000006 L116.48403011065693,193.5" fill="none" stroke="#5b6475" stroke-width="2" stroke-linejoin="round"/><path d="M116.48403011065693,193.5 L120.0,201.8 L113.0,201.8 Z" fill="#5b6475"/><path d="M195.6902454189418,121.5 L240.79378469171513,101.0" fill="none" stroke="#5b6475" stroke-width="2" stroke-linejoin="round"/><path d="M240.79378469171513,101.0 L234.7,107.6 L231.8,101.2 Z" fill="#5b6475"/><rect x="212.0" y="35.0" width="216" height="60" rx="10" fill="#fff" stroke="#0f5c8c" stroke-width="1.8" /><text x="320.0" y="59.0" font-size="13.5" fill="#0f5c8c" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">1 Question</text><text x="320.0" y="79.0" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="middle">precise, tied to a decision</text><rect x="415.51596988934307" y="127.5" width="216" height="60" rx="10" fill="#fff" stroke="#7a4fa0" stroke-width="1.8" /><text x="523.5159698893431" y="151.5" font-size="13.5" fill="#7a4fa0" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">2 Hypotheses</text><text x="523.5159698893431" y="171.5" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="middle">possible answers, written down</text><rect x="415.51596988934307" y="312.5" width="216" height="60" rx="10" fill="#fff" stroke="#c0662b" stroke-width="1.8" /><text x="523.5159698893431" y="336.5" font-size="13.5" fill="#c0662b" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">3 Data needed</text><text x="523.5159698893431" y="356.5" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="middle">what would prove each wrong</text><rect x="212.0" y="405.0" width="216" height="60" rx="10" fill="#fff" stroke="#2f7d6d" stroke-width="1.8" /><text x="320.0" y="429.0" font-size="13.5" fill="#2f7d6d" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">4 Test</text><text x="320.0" y="449.0" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="middle">query, count, compare</text><rect x="8.48403011065696" y="312.50000000000006" width="216" height="60" rx="10" fill="#fff" stroke="#b23b3b" stroke-width="1.8" /><text x="116.48403011065696" y="336.50000000000006" font-size="13.5" fill="#b23b3b" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">5 Conclude</text><text x="116.48403011065696" y="356.50000000000006" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="middle">keep, reject, or refine</text><rect x="8.484030110656931" y="127.5" width="216" height="60" rx="10" fill="#fff" stroke="#5b6475" stroke-width="1.8" /><text x="116.48403011065693" y="151.5" font-size="13.5" fill="#5b6475" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">6 Act or ask</text><text x="116.48403011065693" y="171.5" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="middle">decide, or a sharper question</text><text x="320" y="246" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="middle">Most loops end</text><text x="320" y="265" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="middle">with a better question</text><text x="690" y="150" font-size="13.5" fill="#1d2330" font-weight="normal" text-anchor="start">Write hypotheses before you look at the data,</text><text x="690" y="174" font-size="13.5" fill="#5b6475" font-weight="normal" text-anchor="start">so the data can prove you wrong.</text><text x="690" y="198" font-size="13.5" fill="#5b6475" font-weight="normal" text-anchor="start"></text><text x="690" y="222" font-size="13.5" fill="#1d2330" font-weight="normal" text-anchor="start">A rejected hypothesis is progress:</text><text x="690" y="246" font-size="13.5" fill="#5b6475" font-weight="normal" text-anchor="start">it removes a branch of the issue tree.</text><text x="690" y="270" font-size="13.5" fill="#5b6475" font-weight="normal" text-anchor="start"></text><text x="690" y="294" font-size="13.5" fill="#1d2330" font-weight="normal" text-anchor="start">Stop when the answer is good enough</text><text x="690" y="318" font-size="13.5" fill="#5b6475" font-weight="normal" text-anchor="start">for the decision, not when it&#x27;s perfect.</text></svg>