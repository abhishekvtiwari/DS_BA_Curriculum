<svg xmlns="http://www.w3.org/2000/svg" width="1036" height="328" viewBox="0 0 1036 328" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1036" height="328" fill="#ffffff"/><rect x="32" y="33" width="232" height="92" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="30" y="30" width="232" height="92" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><path d="M30,38 a8,8 0 0 1 8,-8 H254 a8,8 0 0 1 8,8 V64 H30 Z" fill="#0f5c8c"/><text x="42" y="53" font-size="13.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Sales</text><text x="42" y="86" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">enquiries (leads), quotes,</text><text x="42" y="104" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">sales orders, customer visits</text><rect x="280" y="33" width="232" height="92" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="278" y="30" width="232" height="92" rx="8" fill="#fff" stroke="#7a4fa0" stroke-width="1.6" /><path d="M278,38 a8,8 0 0 1 8,-8 H502 a8,8 0 0 1 8,8 V64 H278 Z" fill="#7a4fa0"/><text x="290" y="53" font-size="13.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Marketing</text><text x="290" y="86" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">campaigns, website visits,</text><text x="290" y="104" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">trade-fair contacts</text><rect x="528" y="33" width="232" height="92" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="526" y="30" width="232" height="92" rx="8" fill="#fff" stroke="#c0662b" stroke-width="1.6" /><path d="M526,38 a8,8 0 0 1 8,-8 H750 a8,8 0 0 1 8,8 V64 H526 Z" fill="#c0662b"/><text x="538" y="53" font-size="13.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Purchasing</text><text x="538" y="86" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">suppliers, purchase orders,</text><text x="538" y="104" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">goods received</text><rect x="776" y="33" width="232" height="92" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="774" y="30" width="232" height="92" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><path d="M774,38 a8,8 0 0 1 8,-8 H998 a8,8 0 0 1 8,8 V64 H774 Z" fill="#2f7d6d"/><text x="786" y="53" font-size="13.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Production</text><text x="786" y="86" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">production plans, machine</text><text x="786" y="104" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">runs, output, scrap</text><rect x="32" y="209" width="232" height="92" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="30" y="206" width="232" height="92" rx="8" fill="#fff" stroke="#1f6fa3" stroke-width="1.6" /><path d="M30,214 a8,8 0 0 1 8,-8 H254 a8,8 0 0 1 8,8 V240 H30 Z" fill="#1f6fa3"/><text x="42" y="229" font-size="13.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Warehouse &amp; dispatch</text><text x="42" y="262" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">stock levels, picking lists,</text><text x="42" y="280" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">delivery challans, deliveries</text><rect x="280" y="209" width="232" height="92" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="278" y="206" width="232" height="92" rx="8" fill="#fff" stroke="#b23b3b" stroke-width="1.6" /><path d="M278,214 a8,8 0 0 1 8,-8 H502 a8,8 0 0 1 8,8 V240 H278 Z" fill="#b23b3b"/><text x="290" y="229" font-size="13.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Finance</text><text x="290" y="262" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">invoices, payments, expenses,</text><text x="290" y="280" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">budgets, tax records</text><rect x="528" y="209" width="232" height="92" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="526" y="206" width="232" height="92" rx="8" fill="#fff" stroke="#5b6475" stroke-width="1.6" /><path d="M526,214 a8,8 0 0 1 8,-8 H750 a8,8 0 0 1 8,8 V240 H526 Z" fill="#5b6475"/><text x="538" y="229" font-size="13.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">HR</text><text x="538" y="262" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">employees, attendance,</text><text x="538" y="280" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">payroll, hiring</text><rect x="776" y="209" width="232" height="92" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="774" y="206" width="232" height="92" rx="8" fill="#fff" stroke="#c0662b" stroke-width="1.6" /><path d="M774,214 a8,8 0 0 1 8,-8 H998 a8,8 0 0 1 8,8 V240 H774 Z" fill="#c0662b"/><text x="786" y="229" font-size="13.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Customer support</text><text x="786" y="262" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">complaints, tickets, returns,</text><text x="786" y="280" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">resolution times</text><rect x="328.0" y="140" width="380" height="48" rx="24" fill="#1d2330" stroke="none" stroke-width="1" /><text x="518.0" y="170" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Management uses all of it to decide</text><path d="M146.0,122 V140" fill="none" stroke="#c9d3df" stroke-width=