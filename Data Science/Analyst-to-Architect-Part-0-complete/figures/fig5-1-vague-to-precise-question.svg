<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="350" viewBox="0 0 1050 350" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1050" height="350" fill="#ffffff"/><rect x="30" y="120" width="220" height="110" rx="8" fill="#f3f5f8" stroke="#5b6475" stroke-width="1.5" /><text x="42" y="142" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start">The request</text><text x="42" y="166" font-size="14" fill="#1d2330" font-weight="normal" text-anchor="start">“Sales are down.</text><text x="42" y="190" font-size="14" fill="#1d2330" font-weight="normal" text-anchor="start">Find out why.”</text><rect x="320" y="30" width="330" height="54" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.4" /><circle cx="342" cy="57" r="12" fill="#0f5c8c"/><text x="342" y="62" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="middle">1</text><text x="364" y="53" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Metric and definition</text><text x="364" y="72" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">billed revenue (invoices raised)</text><rect x="320" y="92" width="330" height="54" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.4" /><circle cx="342" cy="119" r="12" fill="#0f5c8c"/><text x="342" y="124" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="middle">2</text><text x="364" y="115" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Period and comparison</text><text x="364" y="134" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">March 2026 vs February 2026</text><rect x="320" y="154" width="330" height="54" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.4" /><circle cx="342" cy="181" r="12" fill="#0f5c8c"/><text x="342" y="186" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="middle">3</text><text x="364" y="177" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Scope</text><text x="364" y="196" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">all customers; tax left out</text><rect x="320" y="216" width="330" height="54" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.4" /><circle cx="342" cy="243" r="12" fill="#0f5c8c"/><text x="342" y="248" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="middle">4</text><text x="364" y="239" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Decision it serves</text><text x="364" y="258" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">what sales does in the first week of April</text><rect x="320" y="278" width="330" height="54" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.4" /><circle cx="342" cy="305" r="12" fill="#0f5c8c"/><text x="342" y="310" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="middle">5</text><text x="364" y="301" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Deadline and precision</text><text x="364" y="320" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">by Wednesday; to the nearest ₹1,000</text><path d="M252,175 L312,175" fill="none" stroke="#5b6475" stroke-width="2" stroke-linejoin="round"/><path d="M312,175 L303.7,178.5 L303.7,171.5 Z" fill="#5b6475"/><path d="M656,175 L714,175" fill="none" stroke="#0f5c8c" stroke-width="2" stroke-linejoin="round"/><path d="M714,175 L705.7,178.5 L705.7,171.5 Z" fill="#0f5c8c"/><rect x="720" y="70" width="300" height="210" rx="8" fill="#eaf2f8" stroke="#0f5c8c" stroke-width="2" /><text x="732" y="92" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start">The precise question</text><text x="732" y="118" font-size="13.5" fill="#1d2330" font-weight="normal" text-anchor="start">Why was billed revenue in</text><text x="732" y="144" font-size="13.5" fill="#1d2330" font-weight="normal" text-anchor="start">March 2026 (₹31,800) 80.3%</text><text x="732" y="170" font-size="13.5" fill="#1d2330" font-weight="normal" text-anchor="start">lower than in February</text><text x="732" y="196" font-size="13.5" fill="#1d2330" font-weight="normal" text-anchor="start">(₹161,700), and is it a fall</text><text x="732" y="222" font-size="13.5" fill="#1d2330" font-weight="normal" text-anchor="start">in demand or a matter of timing?</text></svg>