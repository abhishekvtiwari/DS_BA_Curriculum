<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="422" viewBox="0 0 1000 422" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1000" height="422" fill="#ffffff"/><rect x="30" y="40" width="110" height="48" rx="6" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="44" y="70" font-size="20" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">B</text><text x="158" y="60" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start">1 byte  =  one English letter, digit, or space</text><text x="158" y="80" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start">&#x27;A&#x27; is stored as 01000001</text><rect x="30" y="98" width="144" height="48" rx="6" fill="#1f6fa3" stroke="none" stroke-width="1" /><text x="44" y="128" font-size="20" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">KB</text><text x="192" y="118" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start">1 kilobyte  =  1,000 bytes</text><text x="192" y="138" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start">a short plain-text email; the 4-order CSV in section 2.5 is 364 bytes</text><rect x="30" y="156" width="178" height="48" rx="6" fill="#7a4fa0" stroke="none" stroke-width="1" /><text x="44" y="186" font-size="20" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">MB</text><text x="226" y="176" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start">1 megabyte  =  1,000 KB</text><text x="226" y="196" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start">a phone photo is typically a few MB; 500,000 sales lines as CSV: 24 MB</text><rect x="30" y="214" width="212" height="48" rx="6" fill="#c0662b" stroke="none" stroke-width="1" /><text x="44" y="244" font-size="20" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">GB</text><text x="260" y="234" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start">1 gigabyte  =  1,000 MB</text><text x="260" y="254" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start">a feature-length film in HD is typically a few GB</text><rect x="30" y="272" width="246" height="48" rx="6" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="44" y="302" font-size="20" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">TB</text><text x="294" y="292" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start">1 terabyte  =  1,000 GB</text><text x="294" y="312" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start">a typical laptop or external hard drive</text><rect x="30" y="330" width="280" height="48" rx="6" fill="#5b6475" stroke="none" stroke-width="1" /><text x="44" y="360" font-size="20" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">PB</text><text x="328" y="350" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start">1 petabyte  =  1,000 TB</text><text x="328" y="370" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start">a large company&#x27;s data warehouse, or a video platform&#x27;s library</text><text x="30" y="404" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Each step is 1,000 times the one before. (Some software counts in steps of 1,024; see section 2.2.)</text></svg>