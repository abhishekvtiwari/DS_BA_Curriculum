<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="436" viewBox="0 0 1040 436" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1040" height="436" fill="#ffffff"/><text x="30" y="32" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The six questions every project in this chapter answers</text><rect x="30" y="72" width="300" height="120" rx="9" fill="#fff" stroke="#0f5c8c" stroke-width="1.8" /><rect x="46" y="86" width="26" height="26" rx="13" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="59" y="104" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text x="86" y="104" font-size="12.5" fill="#0f5c8c" font-weight="bold" text-anchor="start">What decision changes?</text><text x="52" y="148" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">If none, there is no project,</text><text x="52" y="165" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">however good the data</text><rect x="360" y="72" width="300" height="120" rx="9" fill="#fff" stroke="#7a4fa0" stroke-width="1.8" /><rect x="376" y="86" width="26" height="26" rx="13" fill="#7a4fa0" stroke="none" stroke-width="1" /><text x="389" y="104" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><text x="416" y="104" font-size="12.5" fill="#7a4fa0" font-weight="bold" text-anchor="start">What data exists, and</text><text x="416" y="121" font-size="12.5" fill="#7a4fa0" font-weight="bold" text-anchor="start">what must be created?</text><text x="382" y="148" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">Usually the bigger half.</text><text x="382" y="165" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">Usually the labels</text><rect x="690" y="72" width="300" height="120" rx="9" fill="#fff" stroke="#2f7d6d" stroke-width="1.8" /><rect x="706" y="86" width="26" height="26" rx="13" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="719" y="104" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><text x="746" y="104" font-size="12.5" fill="#2f7d6d" font-weight="bold" text-anchor="start">What is the simplest</text><text x="746" y="121" font-size="12.5" fill="#2f7d6d" font-weight="bold" text-anchor="start">thing that could work?</text><text x="712" y="148" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">The technical choice.</text><text x="712" y="165" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">The smallest box here</text><rect x="30" y="212" width="300" height="120" rx="9" fill="#fff" stroke="#c0662b" stroke-width="1.8" /><rect x="46" y="226" width="26" height="26" rx="13" fill="#c0662b" stroke="none" stroke-width="1" /><text x="59" y="244" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text><text x="86" y="244" font-size="12.5" fill="#c0662b" font-weight="bold" text-anchor="start">Where does the output go?</text><text x="52" y="288" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">Screen, queue, system of record,</text><text x="52" y="305" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">automated action</text><rect x="360" y="212" width="300" height="120" rx="9" fill="#fff" stroke="#b23b3b" stroke-width="1.8" /><rect x="376" y="226" width="26" height="26" rx="13" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="389" y="244" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">5</text><text x="416" y="244" font-size="12.5" fill="#b23b3b" font-weight="bold" text-anchor="start">What does an error cost,</text><text x="416" y="261" font-size="12.5" fill="#b23b3b" font-weight="bold" text-anchor="start">and who finds it?</text><text x="382" y="288" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">Sets the threshold, the review</text><text x="382" y="305" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">capacity, and whether to automate</text><rect x="690" y="212" width="300" height="120" rx="9" fill="#fff" stroke="#1d2330" stroke-width="1.8" /><rect x="706" y="226" width="26" height="26" rx="13" fill="#1d2330" stroke="none" stroke-width="1" /><text x="719" y="244" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">6</text><text x="746" y="244" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">Who owns it in a year?</text><text x="712" y="288" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">No answer: a demo</text><text x="712" y="305" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">with a longer runway</text><rect x="30" y="360" width="980" height="54" rx="8" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="520" y="382" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="middle">Question 3 is the one every case study is written about.</text><text x="520" y="402" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="middle">Questions 1, 2, 5 and 6 are where these nine projects were actually won or lost.</text></svg>