<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="358" viewBox="0 0 1040 358" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1040" height="358" fill="#ffffff"/><text x="30" y="32" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">What one forward pass produces: a probability for every token</text><text x="180" y="92" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="end" font-family="DejaVu Sans Mono, monospace">cracked</text><rect x="200" y="76" width="274.04" height="24" rx="4" fill="#2f7d6d" stroke="#2f7d6d" stroke-width="1" /><text x="484.04" y="93" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">0.442</text><text x="180" y="130" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="end" font-family="DejaVu Sans Mono, monospace">delivered</text><rect x="200" y="114" width="202.74" height="24" rx="4" fill="#2f7d6d" stroke="#2f7d6d" stroke-width="1" /><text x="412.74" y="131" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">0.327</text><text x="180" y="168" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="end" font-family="DejaVu Sans Mono, monospace">late</text><rect x="200" y="152" width="91.14" height="24" rx="4" fill="#0f5c8c" stroke="#0f5c8c" stroke-width="1" /><text x="301.14" y="169" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">0.147</text><text x="180" y="206" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="end" font-family="DejaVu Sans Mono, monospace">empty</text><rect x="200" y="190" width="45.26" height="24" rx="4" fill="#0f5c8c" stroke="#0f5c8c" stroke-width="1" /><text x="255.26" y="207" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">0.073</text><text x="180" y="244" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="end" font-family="DejaVu Sans Mono, monospace">blue</text><rect x="200" y="228" width="6.819999999999999" height="24" rx="4" fill="#c0662b" stroke="#c0662b" stroke-width="1" /><text x="216.82" y="245" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">0.011</text><text x="180" y="282" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="end" font-family="DejaVu Sans Mono, monospace">photosynthesis</text><rect x="200" y="266" width="3" height="24" rx="4" fill="#b23b3b" stroke="#b23b3b" stroke-width="1" /><text x="213" y="283" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">0.000</text><text x="30" y="318" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">“The crate was …”  The model ranks every token it knows. Sampling (section 54.5) decides which one is taken,</text><text x="30" y="338" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">and the tail is never quite zero — which is the mechanical root of hallucination.</text></svg>