<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="406" viewBox="0 0 1040 406" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1040" height="406" fill="#ffffff"/><text x="30" y="32" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The pipeline that ships: the model proposes, the rules dispose</text><rect x="30" y="70" width="180" height="80" rx="8" fill="#fff" stroke="#c9d3df" stroke-width="1.8" /><text x="120" y="96" font-size="12.5" fill="#c9d3df" font-weight="bold" text-anchor="middle">email arrives</text><text x="120" y="118" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">60 a day, five shapes</text><path d="M210,110 H258" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M250,104 L260,110 L250,116" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><rect x="230" y="70" width="180" height="80" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.8" /><text x="320" y="96" font-size="12.5" fill="#0f5c8c" font-weight="bold" text-anchor="middle">prompt the model</text><text x="320" y="118" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">instructions + example</text><text x="320" y="134" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">temperature 0</text><path d="M410,110 H458" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M450,104 L460,110 L450,116" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><rect x="430" y="70" width="180" height="80" rx="8" fill="#fff" stroke="#7a4fa0" stroke-width="1.8" /><text x="520" y="96" font-size="12.5" fill="#7a4fa0" font-weight="bold" text-anchor="middle">parse</text><text x="520" y="118" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">strip chat and fences</text><text x="520" y="134" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">JSON or nothing</text><path d="M610,110 H658" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M650,104 L660,110 L650,116" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><rect x="630" y="70" width="180" height="80" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.8" /><text x="720" y="96" font-size="12.5" fill="#2f7d6d" font-weight="bold" text-anchor="middle">validate</text><text x="720" y="118" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">codes, dates, quantities</text><text x="720" y="134" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">business rules</text><path d="M810,110 H870" fill="none" stroke="#2f7d6d" stroke-width="2" stroke-linejoin="round"/><path d="M862,104 L872,110 L862,116" fill="none" stroke="#2f7d6d" stroke-width="2" stroke-linejoin="round"/><rect x="870" y="70" width="150" height="80" rx="8" fill="#e2f3ee" stroke="#2f7d6d" stroke-width="1.8" /><text x="945" y="104" font-size="12.5" fill="#2f7d6d" font-weight="bold" text-anchor="middle">load to ERP</text><text x="945" y="126" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="middle">59 of 60</text><path d="M720,150 V200 H330 V174" fill="none" stroke="#c0662b" stroke-width="2" stroke-linejoin="round" stroke-dasharray="5,4"/><path d="M324,182 L330,172 L336,182" fill="none" stroke="#c0662b" stroke-width="2" stroke-linejoin="round"/><rect x="560" y="200" width="320" height="44" rx="7" fill="#fdf3dc" stroke="#c0662b" stroke-width="1.6" /><text x="720" y="227" font-size="12" fill="#c0662b" font-weight="bold" text-anchor="middle">retry once, quoting the exact problems</text><path d="M720,244 V280" fill="none" stroke="#b23b3b" stroke-width="2" stroke-linejoin="round"/><path d="M714,272 L720,282 L726,272" fill="none" stroke="#b23b3b" stroke-width="2" stroke-linejoin="round"/><rect x="560" y="282" width="320" height="50" rx="7" fill="#fbeaea" stroke="#b23b3b" stroke-width="1.6" /><text x="720" y="304" font-size="12.5" fill="#b23b3b" font-weight="bold" text-anchor="middle">still failing: a human, with the reason</text><text x="720" y="322" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="middle">the exception queue is the product, not the failure</text><text x="30" y="366" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Nothing the model returns is trusted. Every field is checked against real product codes, a plausible date window and sane quantities,</text><text x="30" y="386" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">which is also what stops a prompt-injection line in a customer&#x27;s email from changing an order.</text></svg>