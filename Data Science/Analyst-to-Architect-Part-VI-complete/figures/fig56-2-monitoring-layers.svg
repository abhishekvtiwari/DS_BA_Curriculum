<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="444" viewBox="0 0 1040 444" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1040" height="444" fill="#ffffff"/><text x="30" y="32" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Three layers of monitoring, and what each one can see</text><rect x="30" y="72" width="980" height="66" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.8" /><text x="52" y="100" font-size="13" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">service</text><text x="52" y="122" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">is it up and fast?</text><text x="300" y="100" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">uptime, error rate, p95 latency, memory</text><text x="300" y="122" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">delay: seconds</text><text x="990" y="100" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="end">page a human</text><rect x="30" y="150" width="980" height="66" rx="8" fill="#fff" stroke="#c0662b" stroke-width="1.8" /><text x="52" y="178" font-size="13" fill="#c0662b" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">input</text><text x="52" y="200" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">does the data look like training?</text><text x="300" y="178" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">feature distributions, PSI, KS, missing rates</text><text x="300" y="200" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">delay: minutes</text><text x="990" y="178" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="end">daily digest</text><rect x="30" y="228" width="980" height="66" rx="8" fill="#fff" stroke="#7a4fa0" stroke-width="1.8" /><text x="52" y="256" font-size="13" fill="#7a4fa0" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">output</text><text x="52" y="278" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">what is it saying?</text><text x="300" y="256" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">predicted-defective rate per shift vs the QC tally</text><text x="300" y="278" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">delay: hours</text><text x="990" y="256" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="end">daily digest</text><rect x="30" y="306" width="980" height="66" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.8" /><text x="52" y="334" font-size="13" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">outcome</text><text x="52" y="356" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">is it still right?</text><text x="300" y="334" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">recall from a 2% audit of parts the model passed</text><text x="300" y="356" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">delay: days to weeks</text><text x="990" y="334" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="end">weekly review</text><text x="30" y="402" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">The flash defect was invisible to the first three layers and obvious to the fourth, which is the slowest and the only one</text><text x="30" y="422" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">that measures whether the model is still right. Ground truth is late; plan for it rather than hoping.</text></svg>