ight="normal" text-anchor="middle">wk 4</text><text x="550.0" y="320" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">wk 5</text><text x="660.0" y="320" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">wk 6</text><text x="770.0" y="320" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">wk 7</text><text x="880.0" y="320" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">wk 8</text><rect x="30" y="340" width="980" height="58" rx="8" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="48" y="362" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Nothing changed: same prompt, same model, same code. Customers started asking about something nobody had written down.</text><text x="48" y="384" font-size="12" fill="#2f7d6d" font-weight="bold" text-anchor="start">The fix is three documents, not a model change. The assistant&#x27;s own honesty is the monitor.</text></svg>