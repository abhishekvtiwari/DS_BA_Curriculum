<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="464" viewBox="0 0 1040 464" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1040" height="464" fill="#ffffff"/><text x="30" y="32" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Attention on four tokens: who listens to whom</text><text x="303.0" y="68" font-size="12" fill="#5b6475" font-weight="bold" text-anchor="middle">the</text><text x="389.0" y="68" font-size="12" fill="#5b6475" font-weight="bold" text-anchor="middle">crate</text><text x="475.0" y="68" font-size="12" fill="#5b6475" font-weight="bold" text-anchor="middle">was</text><text x="561.0" y="68" font-size="12" fill="#5b6475" font-weight="bold" text-anchor="middle">cracked</text><text x="432" y="42" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="middle">attended to</text><text x="244" y="128.0" font-size="12" fill="#5b6475" font-weight="bold" text-anchor="end">the</text><rect x="260" y="80" width="82" height="82" rx="5" fill="rgb(171,189,177)" stroke="#c9d3df" stroke-width="1" /><text x="301.0" y="126.0" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">0.347</text><rect x="346" y="80" width="82" height="82" rx="5" fill="rgb(223,241,229)" stroke="#c9d3df" stroke-width="1" /><text x="387.0" y="126.0" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">0.244</text><rect x="432" y="80" width="82" height="82" rx="5" fill="rgb(239,255,245)" stroke="#c9d3df" stroke-width="1" /><text x="473.0" y="126.0" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">0.212</text><rect x="518" y="80" width="82" height="82" rx="5" fill="rgb(246,255,252)" stroke="#c9d3df" stroke-width="1" /><text x="559.0" y="126.0" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">0.197</text><text x="244" y="214.0" font-size="12" fill="#5b6475" font-weight="bold" text-anchor="end">crate</text><rect x="260" y="166" width="82" height="82" rx="5" fill="rgb(187,205,193)" stroke="#c9d3df" stroke-width="1" /><text x="301.0" y="212.0" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">0.315</text><rect x="346" y="166" width="82" height="82" rx="5" fill="rgb(200,218,206)" stroke="#c9d3df" stroke-width="1" /><text x="387.0" y="212.0" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">0.290</text><rect x="432" y="166" width="82" height="82" rx="5" fill="rgb(244,255,250)" stroke="#c9d3df" stroke-width="1" /><text x="473.0" y="212.0" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">0.202</text><rect x="518" y="166" width="82" height="82" rx="5" fill="rgb(248,255,254)" stroke="#c9d3df" stroke-width="1" /><text x="559.0" y="212.0" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">0.193</text><text x="244" y="300.0" font-size="12" fill="#5b6475" font-weight="bold" text-anchor="end">was</text><rect x="260" y="252" width="82" height="82" rx="5" fill="rgb(214,232,220)" stroke="#c9d3df" stroke-width="1" /><text x="301.0" y="298.0" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">0.262</text><rect x="346" y="252" width="82" height="82" rx="5" fill="rgb(213,231,219)" stroke="#c9d3df" stroke-width="1" /><text x="387.0" y="298.0" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">0.264</text><rect x="432" y="252" width="82" height="82" rx="5" fill="rgb(226,244,232)" stroke="#c9d3df" stroke-width="1" /><text x="473.0" y="298.0" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">0.238</text><rect x="518" y="252" width="82" height="82" rx="5" fill="rgb(227,245,233)" stroke="#c9d3df" stroke-width="1" /><text x="559.0" y="298.0" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">0.236</text><text x="244" y="386.0" font-size="12" fill="#5b6475" font-weight="bold" text-anchor="end">cracked</text><rect x="260" y="338" width="82" height="82" rx="5" fill="rgb(232,250,238)" stroke="#c9d3df" stroke-width="1" /><text x="301.0" y="384.0" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">0.226</text><rect x="346" y="338" width="82" height="82" rx="5" fill="rgb(147,165,153)" stroke="#c9d3df" stroke-width="1" /><text x="387.0" y="384.0" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">0.396</text><rect x="432" y="338" width="82" height="82" rx="5" fill="rgb(252,255,258)" stroke="#c9d3df" stroke-width="1" /><text x="473.0" y="384.0" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">0.186</text><rect x="518" y="338" width="82" height="82" rx="5" fill="rgb(249,255,255)" stroke="#c9d3df" stroke-width="1" /><text x="559.0" y="384.0" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">0.192</text><text x="60" y="252" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="middle">the token</text><text x="60" y="270" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="middle">doing the</text><text x="60" y="288" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="middle">looking</text><text x="640" y="90" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Each row sums to 1: it is how one token divides</text><text x="640" y="112" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">its attention over the sentence.</text><text x="640" y="134" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start"></text><text x="640" y="156" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">&#x27;cracked&#x27; puts 0.396 on &#x27;crate&#x27;, more than on any</text><text x="640" y="178" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">other token, including itself. Nothing told the model</text><text x="640" y="200" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">about grammar: the learned query of &#x27;cracked&#x27; simply</text><text x="640" y="222" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">lines up with the learned key of &#x27;crate&#x27;.</text><text x="640" y="244" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start"></text><text x="640" y="266" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Queries and keys decide who is listened to.</text><text x="640" y="288" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Values decide what is heard.</text></svg>