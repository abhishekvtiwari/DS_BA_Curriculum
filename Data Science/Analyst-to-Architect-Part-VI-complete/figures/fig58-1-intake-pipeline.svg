y="133" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">normalized dates</text><path d="M520,109 H566" fill="none" stroke="#1d2330" stroke-width="1.8" stroke-linejoin="round"/><path d="M558,103 L568,109 L558,115" fill="none" stroke="#1d2330" stroke-width="1.8" stroke-linejoin="round"/><rect x="540" y="70" width="150" height="78" rx="8" fill="#fff" stroke="#7a4fa0" stroke-width="1.8" /><text x="615" y="96" font-size="12.5" fill="#7a4fa0" font-weight="bold" text-anchor="middle">validate</text><text x="615" y="118" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">PO shape, real codes,</text><text x="615" y="133" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">plausible dates</text><path d="M690,109 H736" fill="none" stroke="#1d2330" stroke-width="1.8" stroke-linejoin="round"/><path d="M728,103 L738,109 L728,115" fill="none" stroke="#1d2330" stroke-width="1.8" stroke-linejoin="round"/><rect x="710" y="70" width="150" height="78" rx="8" fill="#fff" stroke="#c0662b" stroke-width="1.8" /><text x="785" y="96" font-size="12.5" fill="#c0662b" font-weight="bold" text-anchor="middle">decide</text><text x="785" y="118" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">under the limit?</text><path d="M860,109 H906" fill="none" stroke="#1d2330" stroke-width="1.8" stroke-linejoin="round"/><path d="M898,103 L908,109 L898,115" fill="none" stroke="#1d2330" stroke-width="1.8" stroke-linejoin="round"/><rect x="880" y="70" width="150" height="78" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.8" /><text x="955" y="96" font-size="12.5" fill="#2f7d6d" font-weight="bold" text-anchor="middle">write</text><text x="955" y="118" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">one transaction,</text><text x="955" y="133" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">audited</text><rect x="880" y="170" width="150" height="44" rx="7" fill="#e2f3ee" stroke="#2f7d6d" stroke-width="1.6" /><text x="955" y="190" font-size="12" fill="#2f7d6d" font-weight="bold" text-anchor="middle">loaded: 53</text><text x="955" y="207" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="middle">88% of emails</text><path d="M785,148 V196 H650 V196" fill="none" stroke="#c0662b" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="5,4"/><rect x="420" y="174" width="220" height="44" rx="7" fill="#fdf3dc" stroke="#c0662b" stroke-width="1.6" /><text x="530" y="194" font-size="12" fill="#c0662b" font-weight="bold" text-anchor="middle">awaiting approval: 6</text><text x="530" y="211" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="middle">over Rs 100,000</text><path d="M615,148 V174" fill="none" stroke="#b23b3b" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="5,4"/><rect x="170" y="174" width="220" height="44" rx="7" fill="#fbeaea" stroke="#b23b3b" stroke-width="1.6" /><text x="280" y="194" font-size="12" fill="#b23b3b" font-weight="bold" text-anchor="middle">held for review: 1</text><text x="280" y="211" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="middle">validation failed</text><rect x="30" y="240" width="1000" height="62" rx="8" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="48" y="262" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">The write is the part that is different: a UNIQUE key on the source email, one transaction for the header and its lines,</text><text x="48" y="284" font-size="12" fill="#2f7d6d" font-weight="bold" text-anchor="start">and an audit row naming the pipeline version. Replaying the whole morning wrote nothing twice.</text></svg>