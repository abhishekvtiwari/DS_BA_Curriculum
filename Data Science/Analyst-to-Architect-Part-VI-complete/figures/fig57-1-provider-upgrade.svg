<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="366" viewBox="0 0 1040 366" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1040" height="366" fill="#ffffff"/><text x="30" y="32" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The day the provider changed the model behind the same name</text><text x="290" y="102" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="end">pinned model v1, our parser</text><rect x="310" y="80" width="520" height="34" rx="5" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><rect x="310" y="80" width="407.3333333333333" height="34" rx="5" fill="#2f7d6d" stroke="#2f7d6d" stroke-width="1" /><text x="322" y="102" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="start">47 of 60 correct</text><text x="848" y="102" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">the system as it ran on Friday</text><text x="290" y="160" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="end">new model v2, same parser</text><rect x="310" y="138" width="520" height="34" rx="5" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><rect x="310" y="138" width="0.0" height="34" rx="5" fill="#b23b3b" stroke="#b23b3b" stroke-width="1" /><text x="322" y="160" font-size="12" fill="#b23b3b" font-weight="bold" text-anchor="start">60 of 60 unparseable</text><text x="848" y="160" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">every reply unparseable: nothing loads</text><text x="290" y="218" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="end">new model v2, tolerant parser</text><rect x="310" y="196" width="520" height="34" rx="5" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><rect x="310" y="196" width="407.3333333333333" height="34" rx="5" fill="#2f7d6d" stroke="#2f7d6d" stroke-width="1" /><text x="322" y="218" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="start">47 of 60 correct</text><text x="848" y="218" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">strip comments, normalize the date: 20 minutes</text><rect x="310" y="262" width="520" height="54" rx="6" fill="#fdf3dc" stroke="#b7791f" stroke-width="1" /><text x="570" y="284" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="middle">The model was not worse.</text><text x="570" y="304" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="middle">A contract we assumed and never enforced had changed.</text><text x="30" y="346" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Nightly golden-set runs turn this into a Saturday-night build failure. Without them, it is a Monday morning with no orders in the ERP.</text></svg>