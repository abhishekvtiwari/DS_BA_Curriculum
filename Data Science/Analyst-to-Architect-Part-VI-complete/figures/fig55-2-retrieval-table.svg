<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="430" viewBox="0 0 1040 430" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1040" height="430" fill="#ffffff"/><text x="30" y="32" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Chunking matters more than the search algorithm</text><text x="150" y="95" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="end">fixed 400</text><text x="230" y="95" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">bm25</text><rect x="250" y="78" width="483.6" height="26" rx="4" fill="#5b6475" stroke="#5b6475" stroke-width="1" /><text x="743.6" y="95" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">recall@1 0.78   MRR 0.868</text><text x="150" y="127" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="end">fixed 400</text><text x="230" y="127" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">vector</text><rect x="250" y="110" width="496.0" height="26" rx="4" fill="#5b6475" stroke="#5b6475" stroke-width="1" /><text x="756.0" y="127" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">recall@1 0.80   MRR 0.861</text><text x="150" y="159" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="end">fixed 400</text><text x="230" y="159" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">hybrid</text><rect x="250" y="142" width="527.0" height="26" rx="4" fill="#0f5c8c" stroke="#0f5c8c" stroke-width="1" /><text x="787.0" y="159" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">recall@1 0.85   MRR 0.918</text><text x="150" y="191" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="end">sentences</text><text x="230" y="191" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">bm25</text><rect x="250" y="174" width="564.2" height="26" rx="4" fill="#2f7d6d" stroke="#2f7d6d" stroke-width="1" /><text x="824.2" y="191" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">recall@1 0.91   MRR 0.949</text><text x="150" y="223" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="end">sentences</text><text x="230" y="223" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">vector</text><rect x="250" y="206" width="539.4" height="26" rx="4" fill="#0f5c8c" stroke="#0f5c8c" stroke-width="1" /><text x="799.4" y="223" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">recall@1 0.87   MRR 0.932</text><text x="150" y="255" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="end">sentences</text><text x="230" y="255" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">hybrid</text><rect x="250" y="238" width="539.4" height="26" rx="4" fill="#0f5c8c" stroke="#0f5c8c" stroke-width="1" /><text x="799.4" y="255" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">recall@1 0.87   MRR 0.936</text><text x="150" y="287" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="end">sections</text><text x="230" y="287" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">bm25</text><rect x="250" y="270" width="471.2" height="26" rx="4" fill="#5b6475" stroke="#5b6475" stroke-width="1" /><text x="731.2" y="287" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">recall@1 0.76   MRR 0.830</text><text x="150" y="319" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="end">sections</text><text x="230" y="319" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">vector</text><rect x="250" y="302" width="527.0" height="26" rx="4" fill="#0f5c8c" stroke="#0f5c8c" stroke-width="1" /><text x="787.0" y="319" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">recall@1 0.85   MRR 0.912</text><text x="150" y="351" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="end">sections</text><text x="230" y="351" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">hybrid</text><rect x="250" y="334" width="496.0" height="26" rx="4" fill="#5b6475" stroke="#5b6475" stroke-width="1" /><text x="756.0" y="351" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">recall@1 0.80   MRR 0.861</text><text x="30" y="388" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">55 questions whose correct source document was recorded in advance. Sentence chunks with plain keyword search win on this</text><text x="30" y="408" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">corpus of short policies and product codes; hybrid search rescues the worst chunking. “Just use embeddings” is not what the numbers say.</text></svg>