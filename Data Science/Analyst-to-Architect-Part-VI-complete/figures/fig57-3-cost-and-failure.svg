<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="334" viewBox="0 0 1040 334" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1040" height="334" fill="#ffffff"/><text x="30" y="32" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Cost and failure: the two things that decide whether a feature survives</text><rect x="30" y="70" width="480" height="210" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.8" /><text x="50" y="98" font-size="12.5" fill="#2f7d6d" font-weight="bold" text-anchor="start">Caching, on a realistic day of 300 requests</text><text x="50" y="140" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">no cache</text><rect x="200" y="120" width="280" height="28" rx="4" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><rect x="200" y="120" width="280.0" height="28" rx="4" fill="#5b6475" stroke="#5b6475" stroke-width="1" /><text x="210" y="139" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="start">Rs 23.62</text><text x="50" y="186" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">exact-match cache</text><rect x="200" y="166" width="280" height="28" rx="4" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><rect x="200" y="166" width="53.581710414902616" height="28" rx="4" fill="#2f7d6d" stroke="#2f7d6d" stroke-width="1" /><text x="210" y="185" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">Rs 4.52</text><text x="50" y="228" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">81% hit rate, 81% of the cost gone,</text><text x="50" y="248" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">and not one prompt improved.</text><rect x="530" y="70" width="480" height="210" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.8" /><text x="550" y="98" font-size="12.5" fill="#0f5c8c" font-weight="bold" text-anchor="start">Fallback, with the provider failing 20% of calls</text><text x="550" y="140" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">primary model</text><rect x="790" y="120" width="200" height="28" rx="4" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><rect x="790" y="120" width="160.0" height="28" rx="4" fill="#2f7d6d" stroke="#2f7d6d" stroke-width="1" /><text x="996" y="139" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="end">48</text><text x="550" y="186" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">cheaper fallback</text><rect x="790" y="166" width="200" height="28" rx="4" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><rect x="790" y="166" width="30.0" height="28" rx="4" fill="#0f5c8c" stroke="#0f5c8c" stroke-width="1" /><text x="996" y="185" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="end">9</text><text x="550" y="232" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">failed: sent to a human</text><rect x="790" y="212" width="200" height="28" rx="4" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><rect x="790" y="212" width="10.0" height="28" rx="4" fill="#b23b3b" stroke="#b23b3b" stroke-width="1" /><text x="996" y="231" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="end">3</text><text x="550" y="274" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">95% of emails served through</text><text x="550" y="294" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">29 provider errors.</text><text x="30" y="312" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Neither of these is modelling work, and together they decide the bill and the uptime. Build them before tuning a prompt.</text></svg>