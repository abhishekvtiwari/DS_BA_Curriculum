<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="334" viewBox="0 0 1040 334" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1040" height="334" fill="#ffffff"/><text x="30" y="32" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The assistant, end to end: retrieve, ground, cite, or refuse</text><rect x="30" y="70" width="170" height="78" rx="8" fill="#fff" stroke="#c9d3df" stroke-width="1.8" /><text x="115" y="96" font-size="12.5" fill="#c9d3df" font-weight="bold" text-anchor="middle">question</text><text x="115" y="118" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">from a customer</text><path d="M200,109 H238" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M230,103 L240,109 L230,115" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><rect x="210" y="70" width="170" height="78" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.8" /><text x="295" y="96" font-size="12.5" fill="#0f5c8c" font-weight="bold" text-anchor="middle">retrieve</text><text x="295" y="118" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">BM25 + vectors</text><text x="295" y="134" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">top 3 chunks</text><path d="M380,109 H418" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M410,103 L420,109 L410,115" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><rect x="400" y="70" width="170" height="78" rx="8" fill="#fff" stroke="#c0662b" stroke-width="1.8" /><text x="485" y="96" font-size="12.5" fill="#c0662b" font-weight="bold" text-anchor="middle">confident?</text><text x="485" y="118" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">BM25 &gt;= 8 and</text><text x="485" y="134" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">cosine &gt;= 0.60</text><path d="M570,109 H608" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M600,103 L610,109 L600,115" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><rect x="590" y="70" width="170" height="78" rx="8" fill="#fff" stroke="#7a4fa0" stroke-width="1.8" /><text x="675" y="96" font-size="12.5" fill="#7a4fa0" font-weight="bold" text-anchor="middle">ground</text><text x="675" y="118" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">answer ONLY from</text><text x="675" y="134" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">the numbered sources</text><path d="M760,109 H798" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M790,103 L800,109 L790,115" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><rect x="780" y="70" width="170" height="78" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.8" /><text x="865" y="96" font-size="12.5" fill="#2f7d6d" font-weight="bold" text-anchor="middle">answer + citation</text><text x="865" y="118" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">with the chunk id</text><text x="865" y="134" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">stored for tracing</text><path d="M485,148 V200" fill="none" stroke="#b23b3b" stroke-width="2" stroke-linejoin="round" stroke-dasharray="5,4"/><path d="M479,192 L485,202 L491,192" fill="none" stroke="#b23b3b" stroke-width="2" stroke-linejoin="round"/><rect x="330" y="202" width="320" height="50" rx="7" fill="#fbeaea" stroke="#b23b3b" stroke-width="1.6" /><text x="490" y="224" font-size="12" fill="#b23b3b" font-weight="bold" text-anchor="middle">no: refuse and hand to the support desk</text><text x="490" y="242" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="middle">7 of 10 unanswerable questions caught</text><rect x="700" y="202" width="320" height="50" rx="7" fill="#e2f3ee" stroke="#2f7d6d" stroke-width="1.6" /><text x="860" y="224" font-size="12" fill="#2f7d6d" font-weight="bold" text-anchor="middle">tools, when documents cannot answer</text><text x="860" y="242" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="middle">order status, price quote: read-only</text><text x="30" y="292" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Nothing retrieved is trusted: sources are numbered data, superseded documents are filtered at index time, and every answer</text><text x="30" y="312" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">stores the chunk ids it used, so a wrong answer is traced to its document in a minute.</text></svg>