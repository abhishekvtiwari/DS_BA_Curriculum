20" height="55" rx="7" fill="#fff" stroke="#7a4fa0" stroke-width="1.6" /><path d="M550,158 a7,7 0 0 1 7,-7 H763 a7,7 0 0 1 7,7 V174 H550 Z" fill="#7a4fa0"/><text x="660.0" y="166.5" font-size="10.2" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Edge inference
