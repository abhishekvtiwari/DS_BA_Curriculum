<svg xmlns="http://www.w3.org/2000/svg" width="810" height="414" viewBox="0 0 810 414" font-family="DejaVu Sans, Arial, sans-serif"><rect width="810" height="414" fill="#ffffff"/><text x="30" y="30" font-size="14.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">One scenario, three ways: sensor readings to a line alert and a warehouse</text><text x="40" y="66" font-size="12.5" fill="#0f5c8c" font-weight="bold" text-anchor="start">LAMBDA</text><rect x="33" y="82" width="220" height="50" rx="7" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="30" y="78" width="220" height="50" rx="7" fill="#fff" stroke="#5b6475" stroke-width="1.6" /><path d="M30,86 a7,7 0 0 1 7,-7 H243 a7,7 0 0 1 7,7 V102 H30 Z" fill="#5b6475"/><text x="140.0" y="94.5" font-size="10.2" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Sensors</text><rect x="33" y="154" width="220" height="55" rx="7" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="30" y="150" width="220" height="55" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><path d="M30,158 a7,7 0 0 1 7,-7 H243 a7,7 0 0 1 7,7 V174 H30 Z" fill="#0f5c8c"/><text x="140.0" y="166.5" font-size="10.2" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Batch layer
