<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="264" viewBox="0 0 1000 264" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1000" height="264" fill="#ffffff"/><text x="30" y="30" font-size="14.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Team structure: from four people to a function, one hire at a time</text><rect x="33" y="68" width="280" height="150" rx="7" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="30" y="64" width="280" height="150" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><path d="M30,72 a7,7 0 0 1 7,-7 H303 a7,7 0 0 1 7,7 V88 H30 Z" fill="#0f5c8c"/><text x="170.0" y="80.5" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">2026: Chapter 60
Four-person team</text><text x="170.0" y="104" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">Meera (lead) + 3</text><text x="170.0" y="118" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">Centralized, serves</text><text x="170.0" y="132" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">the whole company</text><text x="170.0" y="146" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle"></text><text x="170.0" y="160" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">Every request queues</text><text x="170.0" y="174" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">behind every other</text><rect x="363" y="68" width="280" height="150" rx="7" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="360" y="64" width="280" height="150" rx="7" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><path d="M360,72 a7,7 0 0 1 7,-7 H633 a7,7 0 0 1 7,7 V88 H360 Z" fill="#2f7d6d"/><text x="500.0" y="80.5" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Today: + 1 domain hire</text><text x="500.0" y="104" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">Taloja plant&#x27;s own</text><text x="500.0" y="118" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">data analyst (Ch 62)</text><text x="500.0" y="132" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle"></text><text x="500.0" y="146" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">First real domain</text><text x="500.0" y="160" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">capacity outside the</text><text x="500.0" y="174" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">central team</text><rect x="693" y="68" width="280" height="150" rx="7" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="690" y="64" width="280" height="150" rx="7" fill="#fff" stroke="#b7791f" stroke-width="1.6" /><path d="M690,72 a7,7 0 0 1 7,-7 H963 a7,7 0 0 1 7,7 V88 H690 Z" fill="#b7791f"/><text x="830.0" y="80.5" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Proposed next hire</text><text x="830.0" y="104" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">A data governance /</text><text x="830.0" y="118" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">catalog owner (Ch 64)</text><text x="830.0" y="132" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle"></text><text x="830.0" y="146" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">Not another generalist</text><text x="830.0" y="160" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">— the specific gap</text><text x="830.0" y="174" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">this chapter&#x27;s audit found</text><path d="M313,139 L357,139" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M357,139 L350.7,142.0 L350.7,136.0 Z" fill="#5b6475"/><path d="M643,139 L687,139" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M687,139 L680.7,142.0 L680.7,136.0 Z" fill="#5b6475"/><text x="30" y="244" font-size="11.3" fill="#5b6475" font-weight="normal" text-anchor="start">Each hire is justified by a specific, named gap this book already found — not headcount added because growth &quot;felt right.&quot;</text></svg>