<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="338" viewBox="0 0 1000 338" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1000" height="338" fill="#ffffff"/><text x="30" y="30" font-size="14.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The shift every architect eventually makes</text><rect x="53" y="74" width="380" height="190" rx="7" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="50" y="70" width="380" height="190" rx="7" fill="#fff" stroke="#5b6475" stroke-width="1.6" /><path d="M50,78 a7,7 0 0 1 7,-7 H423 a7,7 0 0 1 7,7 V94 H50 Z" fill="#5b6475"/><text x="240.0" y="86.5" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Individual contribution</text><text x="240.0" y="110" font-size="9.200000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">Impact = what you personally</text><text x="240.0" y="124" font-size="9.200000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">build, this week</text><text x="240.0" y="138" font-size="9.200000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle"></text><text x="240.0" y="152" font-size="9.200000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">Scales with your own hours</text><text x="240.0" y="166" font-size="9.200000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle"></text><text x="240.0" y="180" font-size="9.200000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">The skill: write the best</text><text x="240.0" y="194" font-size="9.200000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">query, the cleanest pipeline</text><rect x="573" y="74" width="380" height="190" rx="7" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="570" y="70" width="380" height="190" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><path d="M570,78 a7,7 0 0 1 7,-7 H943 a7,7 0 0 1 7,7 V94 H570 Z" fill="#0f5c8c"/><text x="760.0" y="86.5" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Leverage</text><text x="760.0" y="110" font-size="9.200000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">Impact = the decisions you make</text><text x="760.0" y="124" font-size="9.200000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">and the people you enable</text><text x="760.0" y="138" font-size="9.200000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle"></text><text x="760.0" y="152" font-size="9.200000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">Scales with judgment and trust</text><text x="760.0" y="166" font-size="9.200000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle"></text><text x="760.0" y="180" font-size="9.200000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">The skill: make the right call,</text><text x="760.0" y="194" font-size="9.200000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">and get others to build it well</text><path d="M432,165 L568,165" fill="none" stroke="#b7791f" stroke-width="2.2" stroke-linejoin="round"/><path d="M568,165 L561.7,168.0 L561.7,162.0 Z" fill="#b7791f"/><text x="450" y="150" font-size="11" fill="#b7791f" font-weight="bold" text-anchor="start">the shift</text><text x="30" y="300" font-size="11.3" fill="#5b6475" font-weight="normal" text-anchor="start">Neither replaces the other — an architect who can&#x27;t write the query anymore has lost the credibility that judgment rests on.</text><text x="30" y="318" font-size="11.3" fill="#5b6475" font-weight="normal" text-anchor="start">The shift is where your TIME goes, not whether the underlying skill still matters.</text></svg>