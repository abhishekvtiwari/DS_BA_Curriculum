<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="450" viewBox="0 0 1010 450" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1010" height="450" fill="#ffffff"/><text x="30" y="30" font-size="14.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Model governance: a loop, not a one-time approval</text><rect x="418.0" y="29.0" width="180" height="90" rx="7" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="415.0" y="25.0" width="180" height="90" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><path d="M415.0,33.0 a7,7 0 0 1 7,-7 H588.0 a7,7 0 0 1 7,7 V49.0 H415.0 Z" fill="#0f5c8c"/><text x="505.0" y="41.5" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Version &amp;
