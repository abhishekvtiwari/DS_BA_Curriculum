<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="406" viewBox="0 0 1010 406" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1010" height="406" fill="#ffffff"/><text x="30" y="30" font-size="14.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">A data maturity model, five stages, scored honestly across five dimensions</text><text x="349.0" y="54" font-size="9.8" fill="#5b6475" font-weight="bold" text-anchor="middle">1 Ad hoc</text><path d="M280,66 V346" fill="none" stroke="#dfe5ec" stroke-width="1" stroke-linejoin="round"/><text x="487.0" y="54" font-size="9.8" fill="#5b6475" font-weight="bold" text-anchor="middle">2 Reactive</text><path d="M418,66 V346" fill="none" stroke="#dfe5ec" stroke-width="1" stroke-linejoin="round"/><text x="625.0" y="54" font-size="9.8" fill="#5b6475" font-weight="bold" text-anchor="middle">3 Proactive</text><path d="M556,66 V346" fill="none" stroke="#dfe5ec" stroke-width="1" stroke-linejoin="round"/><text x="763.0" y="54" font-size="9.8" fill="#5b6475" font-weight="bold" text-anchor="middle">4 Managed</text><path d="M694,66 V346" fill="none" stroke="#dfe5ec" stroke-width="1" stroke-linejoin="round"/><text x="901.0" y="54" font-size="9.8" fill="#5b6475" font-weight="bold" text-anchor="middle">5 Optimized</text><path d="M832,66 V346" fill="none" stroke="#dfe5ec" stroke-width="1" stroke-linejoin="round"/><path d="M970,66 V346" fill="none" stroke="#dfe5ec" stroke-width="1" stroke-linejoin="round"/><text x="30" y="88" font-size="10.4" fill="#1d2330" font-weight="bold" text-anchor="start">Data quality</text><text x="30" y="102" font-size="9" fill="#5b6475" font-weight="normal" text-anchor="start">&amp; reliability (Ch 14, 47)</text><circle cx="638.8" cy="84" r="7" fill="#0f5c8c"/><text x="638.8" y="70" font-size="9.6" fill="#0f5c8c" font-weight="bold" text-anchor="middle">3.6</text><text x="30" y="140" font-size="10.4" fill="#1d2330" font-weight="bold" text-anchor="start">Architecture</text><text x="30" y="154" font-size="9" fill="#5b6475" font-weight="normal" text-anchor="start">&amp; platform (Ch 60-62)</text><circle cx="583.6" cy="136" r="7" fill="#2f6690"/><text x="583.6" y="122" font-size="9.6" fill="#2f6690" font-weight="bold" text-anchor="middle">3.2</text><text x="30" y="192" font-size="10.4" fill="#1d2330" font-weight="bold" text-anchor="start">Governance</text><text x="30" y="206" font-size="9" fill="#5b6475" font-weight="normal" text-anchor="start">&amp; security (Ch 63-64)</text><circle cx="611.2" cy="188" r="7" fill="#2f7d6d"/><text x="611.2" y="174" font-size="9.6" fill="#2f7d6d" font-weight="bold" text-anchor="middle">3.4</text><text x="30" y="244" font-size="10.4" fill="#1d2330" font-weight="bold" text-anchor="start">Cost</text><text x="30" y="258" font-size="9" fill="#5b6475" font-weight="normal" text-anchor="start">discipline (Ch 65)</text><circle cx="500.8" cy="240" r="7" fill="#b7791f"/><text x="500.8" y="226" font-size="9.6" fill="#b7791f" font-weight="bold" text-anchor="middle">2.6</text><text x="30" y="296" font-size="10.4" fill="#1d2330" font-weight="bold" text-anchor="start">Data-driven</text><text x="30" y="310" font-size="9" fill="#5b6475" font-weight="normal" text-anchor="start">culture (Ch 19, 24)</text><circle cx="445.6" cy="292" r="7" fill="#7a4fa0"/><text x="445.6" y="278" font-size="9.6" fill="#7a4fa0" font-weight="bold" text-anchor="middle">2.2</text><text x="30" y="366" font-size="11.2" fill="#5b6475" font-weight="normal" text-anchor="start">Riverstone sits mostly in stage 3 (Proactive): real governance and cost discipline exist, but data-driven culture</text><text x="30" y="384" font-size="11.2" fill="#5b6475" font-weight="normal" text-anchor="start">still lags — most decisions are still made by habit and hierarchy, not by routinely consulting the platform.</text></svg>