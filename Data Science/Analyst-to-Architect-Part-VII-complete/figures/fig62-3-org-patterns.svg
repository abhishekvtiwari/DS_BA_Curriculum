<svg xmlns="http://www.w3.org/2000/svg" width="970" height="356" viewBox="0 0 970 356" font-family="DejaVu Sans, Arial, sans-serif"><rect width="970" height="356" fill="#ffffff"/><text x="30" y="30" font-size="14.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Organizational patterns: who owns the data</text><rect x="33" y="64" width="290" height="230" rx="7" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="30" y="60" width="290" height="230" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><path d="M30,68 a7,7 0 0 1 7,-7 H313 a7,7 0 0 1 7,7 V84 H30 Z" fill="#0f5c8c"/><text x="175.0" y="76.5" font-size="10.2" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Centralized</text><text x="175.0" y="100" font-size="9.0" fill="#1d2330" font-weight="normal" text-anchor="middle">One team owns all data:</text><text x="175.0" y="114" font-size="9.0" fill="#1d2330" font-weight="normal" text-anchor="middle">ingestion, models, quality,</text><text x="175.0" y="128" font-size="9.0" fill="#1d2330" font-weight="normal" text-anchor="middle">delivery — for everyone.</text><text x="175.0" y="142" font-size="9.0" fill="#1d2330" font-weight="normal" text-anchor="middle"></text><text x="175.0" y="156" font-size="9.0" fill="#1d2330" font-weight="normal" text-anchor="middle">Simple to govern.</text><text x="175.0" y="170" font-size="9.0" fill="#1d2330" font-weight="normal" text-anchor="middle">Bottlenecks as the</text><text x="175.0" y="184" font-size="9.0" fill="#1d2330" font-weight="normal" text-anchor="middle">company grows past</text><text x="175.0" y="198" font-size="9.0" fill="#1d2330" font-weight="normal" text-anchor="middle">what one team can serve.</text><rect x="348" y="64" width="290" height="230" rx="7" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="345" y="60" width="290" height="230" rx="7" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><path d="M345,68 a7,7 0 0 1 7,-7 H628 a7,7 0 0 1 7,7 V84 H345 Z" fill="#2f7d6d"/><text x="490.0" y="76.5" font-size="10.2" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Data mesh</text><text x="490.0" y="100" font-size="9.0" fill="#1d2330" font-weight="normal" text-anchor="middle">Each domain team owns</text><text x="490.0" y="114" font-size="9.0" fill="#1d2330" font-weight="normal" text-anchor="middle">its own data as a product,</text><text x="490.0" y="128" font-size="9.0" fill="#1d2330" font-weight="normal" text-anchor="middle">on a shared self-serve</text><text x="490.0" y="142" font-size="9.0" fill="#1d2330" font-weight="normal" text-anchor="middle">platform, under federated</text><text x="490.0" y="156" font-size="9.0" fill="#1d2330" font-weight="normal" text-anchor="middle">governance.</text><text x="490.0" y="170" font-size="9.0" fill="#1d2330" font-weight="normal" text-anchor="middle"></text><text x="490.0" y="184" font-size="9.0" fill="#1d2330" font-weight="normal" text-anchor="middle">Scales organizationally.</text><text x="490.0" y="198" font-size="9.0" fill="#1d2330" font-weight="normal" text-anchor="middle">Needs real platform and</text><text x="490.0" y="212" font-size="9.0" fill="#1d2330" font-weight="normal" text-anchor="middle">cultural maturity to work.</text><rect x="663" y="64" width="290" height="230" rx="7" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="660" y="60" width="290" height="230" rx="7" fill="#fff" stroke="#7a4fa0" stroke-width="1.6" /><path d="M660,68 a7,7 0 0 1 7,-7 H943 a7,7 0 0 1 7,7 V84 H660 Z" fill="#7a4fa0"/><text x="805.0" y="76.5" font-size="10.2" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Data fabric</text><text x="805.0" y="100" font-size="9.0" fill="#1d2330" font-weight="normal" text-anchor="middle">An intelligent metadata</text><text x="805.0" y="114" font-size="9.0" fill="#1d2330" font-weight="normal" text-anchor="middle">layer unifies distributed</text><text x="805.0" y="128" font-size="9.0" fill="#1d2330" font-weight="normal" text-anchor="middle">data without necessarily</text><text x="805.0" y="142" font-size="9.0" fill="#1d2330" font-weight="normal" text-anchor="middle">moving or re-owning it.</text><text x="805.0" y="156" font-size="9.0" fill="#1d2330" font-weight="normal" text-anchor="middle"></text><text x="805.0" y="170" font-size="9.0" fill="#1d2330" font-weight="normal" text-anchor="middle">Technology-led rather</text><text x="805.0" y="184" font-size="9.0" fill="#1d2330" font-weight="normal" text-anchor="middle">than organization-led;</text><text x="805.0" y="198" font-size="9.0" fill="#1d2330" font-weight="normal" text-anchor="middle">often paired with either</text><text x="805.0" y="212" font-size="9.0" fill="#1d2330" font-weight="normal" text-anchor="middle">of the other two.</text><text x="30" y="318" font-size="11.3" fill="#5b6475" font-weight="normal" text-anchor="start">Riverstone today: firmly centralized — a four-person data platform team (Chapter 60) serves the whole company. That&#x27;s not a</text><text x="30" y="336" font-size="11.3" fill="#5b6475" font-weight="normal" text-anchor="start">failure; it&#x27;s the right fit for this size. Section 62.5 checks, honestly, whether that should change yet.</text></svg>