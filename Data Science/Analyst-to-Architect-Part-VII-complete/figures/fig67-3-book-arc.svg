<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="300" viewBox="0 0 1020 300" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1020" height="300" fill="#ffffff"/><text x="30" y="30" font-size="14.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The arc of this book, in one line</text><path d="M60,200 H835" fill="none" stroke="#dfe5ec" stroke-width="2" stroke-linejoin="round"/><circle cx="60" cy="200" r="9" fill="#5b6475"/><text x="60" y="178" font-size="9.6" fill="#5b6475" font-weight="bold" text-anchor="middle">Part I</text><text x="60" y="192" font-size="9.2" fill="#5b6475" font-weight="bold" text-anchor="middle">Ch 1</text><text x="60" y="224" font-size="9.6" fill="#1d2330" font-weight="normal" text-anchor="middle">One query</text><text x="60" y="238" font-size="9.6" fill="#1d2330" font-weight="normal" text-anchor="middle">against one table</text><circle cx="215" cy="200" r="9" fill="#0f5c8c"/><text x="215" y="178" font-size="9.6" fill="#5b6475" font-weight="bold" text-anchor="middle">Part II</text><text x="215" y="192" font-size="9.2" fill="#0f5c8c" font-weight="bold" text-anchor="middle">Ch 20</text><text x="215" y="224" font-size="9.6" fill="#1d2330" font-weight="normal" text-anchor="middle">One automation</text><text x="215" y="238" font-size="9.6" fill="#1d2330" font-weight="normal" text-anchor="middle">someone relies on</text><circle cx="370" cy="200" r="9" fill="#2f7d6d"/><text x="370" y="178" font-size="9.6" fill="#5b6475" font-weight="bold" text-anchor="middle">Part V-VI</text><text x="370" y="192" font-size="9.2" fill="#2f7d6d" font-weight="bold" text-anchor="middle">Ch 46-58</text><text x="370" y="224" font-size="9.6" fill="#1d2330" font-weight="normal" text-anchor="middle">A pipeline and a model</text><text x="370" y="238" font-size="9.6" fill="#1d2330" font-weight="normal" text-anchor="middle">in production</text><circle cx="525" cy="200" r="9" fill="#b7791f"/><text x="525" y="178" font-size="9.6" fill="#5b6475" font-weight="bold" text-anchor="middle">Part VII</text><text x="525" y="192" font-size="9.2" fill="#b7791f" font-weight="bold" text-anchor="middle">Ch 60-61</text><text x="525" y="224" font-size="9.6" fill="#1d2330" font-weight="normal" text-anchor="middle">A whole platform,</text><text x="525" y="238" font-size="9.6" fill="#1d2330" font-weight="normal" text-anchor="middle">designed and stress-tested</text><circle cx="680" cy="200" r="9" fill="#7a4fa0"/><text x="680" y="178" font-size="9.6" fill="#5b6475" font-weight="bold" text-anchor="middle">Part VII</text><text x="680" y="192" font-size="9.2" fill="#7a4fa0" font-weight="bold" text-anchor="middle">Ch 63-66</text><text x="680" y="224" font-size="9.6" fill="#1d2330" font-weight="normal" text-anchor="middle">Governed, secured,</text><text x="680" y="238" font-size="9.6" fill="#1d2330" font-weight="normal" text-anchor="middle">costed, and led</text><circle cx="835" cy="200" r="9" fill="#b23b3b"/><text x="835" y="178" font-size="9.6" fill="#5b6475" font-weight="bold" text-anchor="middle">Now</text><text x="835" y="192" font-size="9.2" fill="#b23b3b" font-weight="bold" text-anchor="middle">Ch 67</text><text x="835" y="224" font-size="9.6" fill="#1d2330" font-weight="normal" text-anchor="middle">Someone else&#x27;s turn</text><text x="835" y="238" font-size="9.6" fill="#1d2330" font-weight="normal" text-anchor="middle">to learn from you</text><text x="30" y="280" font-size="11.5" fill="#5b6475" font-weight="italic" text-anchor="start">Every layer was necessary. None of it, on its own, was sufficient. This last chapter is the one that makes the rest of it matter.</text></svg>