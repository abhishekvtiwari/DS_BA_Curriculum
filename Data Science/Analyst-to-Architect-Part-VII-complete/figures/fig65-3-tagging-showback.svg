r="start">Shared / platform overhead</text><text x="300" y="326" font-size="10" fill="#5b6475" font-weight="normal" text-anchor="start">Backups, transfer, monitoring</text><text x="730" y="326" font-size="11" fill="#b7791f" font-weight="bold" text-anchor="end">~23%</text><text x="30" y="369" font-size="11.2" fill="#5b6475" font-weight="normal" text-anchor="start">Showback shows a team its real cost without automatically charging it back — the first step, before any budget or chargeback policy exists.</text></svg>