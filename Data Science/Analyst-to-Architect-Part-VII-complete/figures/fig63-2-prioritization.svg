<svg xmlns="http://www.w3.org/2000/svg" width="970" height="466" viewBox="0 0 970 466" font-family="DejaVu Sans, Arial, sans-serif"><rect width="970" height="466" fill="#ffffff"/><text x="30" y="30" font-size="14.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Prioritizing automation: value, effort, and risk, plotted for real</text><rect x="90" y="60" width="760" height="300" rx="0" fill="#fff" stroke="#c9d3df" stroke-width="1.4" /><path d="M280.0,60 V360" fill="none" stroke="#dfe5ec" stroke-width="1" stroke-linejoin="round"/><path d="M470.0,60 V360" fill="none" stroke="#dfe5ec" stroke-width="1" stroke-linejoin="round"/><path d="M660.0,60 V360" fill="none" stroke="#dfe5ec" stroke-width="1" stroke-linejoin="round"/><path d="M90,135.0 H850" fill="none" stroke="#dfe5ec" stroke-width="1" stroke-linejoin="round"/><path d="M90,210.0 H850" fill="none" stroke="#dfe5ec" stroke-width="1" stroke-linejoin="round"/><path d="M90,285.0 H850" fill="none" stroke="#dfe5ec" stroke-width="1" stroke-linejoin="round"/><text x="470.0" y="412" font-size="11.5" fill="#5b6475" font-weight="bold" text-anchor="middle">EFFORT TO BUILD →</text><g transform="rotate(-90 50 210.0)"><text x="50" y="210.0" font-size="11.5" fill="#5b6475" font-weight="bold" text-anchor="middle">VALUE →</text></g><circle cx="226.79999999999998" cy="195.0" r="16" fill="#0f5c8c" fill-opacity="0.85" stroke="#fff" stroke-width="1.5"/><text x="226.79999999999998" y="225.0" font-size="9.4" fill="#1d2330" font-weight="bold" text-anchor="middle">Daily Flash</text><text x="226.79999999999998" y="238.0" font-size="9.4" fill="#1d2330" font-weight="None" text-anchor="middle">(325h/yr saved)</text><circle cx="204.0" cy="270.0" r="10" fill="#2f7d6d" fill-opacity="0.85" stroke="#fff" stroke-width="1.5"/><text x="204.0" y="294.0" font-size="9.4" fill="#1d2330" font-weight="bold" text-anchor="middle">Branch macro</text><text x="204.0" y="307.0" font-size="9.4" fill="#1d2330" font-weight="None" text-anchor="middle">consolidation</text><circle cx="508.00000000000006" cy="119.99999999999999" r="14" fill="#b7791f" fill-opacity="0.85" stroke="#fff" stroke-width="1.5"/><text x="508.00000000000006" y="148.0" font-size="9.4" fill="#1d2330" font-weight="bold" text-anchor="middle">PO-intake,</text><text x="508.00000000000006" y="161.0" font-size="9.4" fill="#1d2330" font-weight="None" text-anchor="middle">assisted mode</text><circle cx="470.0" cy="315.0" r="26" fill="#b23b3b" fill-opacity="0.85" stroke="#fff" stroke-width="1.5"/><text x="470.0" y="355.0" font-size="9.4" fill="#1d2330" font-weight="bold" text-anchor="middle">PO-intake,</text><text x="470.0" y="368.0" font-size="9.4" fill="#1d2330" font-weight="None" text-anchor="middle">straight-through</text><circle cx="736.0" cy="90.0" r="20" fill="#2f6690" fill-opacity="0.85" stroke="#fff" stroke-width="1.5"/><text x="736.0" y="124.0" font-size="9.4" fill="#1d2330" font-weight="bold" text-anchor="middle">Dagster</text><text x="736.0" y="137.0" font-size="9.4" fill="#1d2330" font-weight="None" text-anchor="middle">ingestion pipeline</text><circle cx="432.0" cy="225.0" r="12" fill="#7a4fa0" fill-opacity="0.85" stroke="#fff" stroke-width="1.5"/><text x="432.0" y="251.0" font-size="9.4" fill="#1d2330" font-weight="bold" text-anchor="middle">CRM reverse-ETL</text><text x="432.0" y="264.0" font-size="9.4" fill="#1d2330" font-weight="None" text-anchor="middle">sync</text><text x="108" y="78" font-size="10" fill="#5b6475" font-weight="italic" text-anchor="start">quick wins</text><text x="760" y="78" font-size="10" fill="#5b6475" font-weight="italic" text-anchor="start">big bets</text><text x="108" y="352" font-size="10" fill="#5b6475" font-weight="italic" text-anchor="start">question marks</text><text x="30" y="430" font-size="11.2" fill="#5b6475" font-weight="normal" text-anchor="start">Bubble size is risk (bigger = riskier). Straight-through PO-intake looks cheap and valuable on effort and speed alone —</text><text x="30" y="448" font-size="11.2" fill="#5b6475" font-weight="normal" text-anchor="start">only its risk bubble, drawn honestly, shows why assisted mode (smaller circle, still high value) was the actual choice.</text></svg>