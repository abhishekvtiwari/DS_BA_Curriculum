<svg xmlns="http://www.w3.org/2000/svg" width="970" height="434" viewBox="0 0 970 434" font-family="DejaVu Sans, Arial, sans-serif"><rect width="970" height="434" fill="#ffffff"/><text x="30" y="30" font-size="14.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Turning a vague requirement into a number</text><rect x="30" y="64" width="260" height="56" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1" /><text x="46" y="97" font-size="12" fill="#5b6475" font-weight="italic" text-anchor="start">&quot;Make it fast&quot;</text><path d="M295,92 L335,92" fill="none" stroke="#0f5c8c" stroke-width="1.8" stroke-linejoin="round"/><path d="M335,92 L328.7,95.0 L328.7,89.0 Z" fill="#0f5c8c"/><rect x="345" y="64" width="600" height="56" rx="6" fill="#fff" stroke="#0f5c8c" stroke-width="1.5" /><rect x="345" y="64" width="7" height="56" rx="0" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="364" y="86" font-size="10.6" fill="#1d2330" font-weight="normal" text-anchor="start">The daily flash email must be sent within 10 minutes of the 06:00</text><text x="364" y="102" font-size="10.6" fill="#1d2330" font-weight="normal" text-anchor="start">ERP load finishing, p95</text><rect x="30" y="136" width="260" height="56" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1" /><text x="46" y="169" font-size="12" fill="#5b6475" font-weight="italic" text-anchor="start">&quot;Make it reliable&quot;</text><path d="M295,164 L335,164" fill="none" stroke="#2f7d6d" stroke-width="1.8" stroke-linejoin="round"/><path d="M335,164 L328.7,167.0 L328.7,161.0 Z" fill="#2f7d6d"/><rect x="345" y="136" width="600" height="56" rx="6" fill="#fff" stroke="#2f7d6d" stroke-width="1.5" /><rect x="345" y="136" width="7" height="56" rx="0" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="364" y="158" font-size="10.6" fill="#1d2330" font-weight="normal" text-anchor="start">99.5% of scheduled pipeline runs succeed without manual</text><text x="364" y="174" font-size="10.6" fill="#1d2330" font-weight="normal" text-anchor="start">intervention, measured monthly</text><rect x="30" y="208" width="260" height="56" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1" /><text x="46" y="241" font-size="12" fill="#5b6475" font-weight="italic" text-anchor="start">&quot;Make it secure&quot;</text><path d="M295,236 L335,236" fill="none" stroke="#b23b3b" stroke-width="1.8" stroke-linejoin="round"/><path d="M335,236 L328.7,239.0 L328.7,233.0 Z" fill="#b23b3b"/><rect x="345" y="208" width="600" height="56" rx="6" fill="#fff" stroke="#b23b3b" stroke-width="1.5" /><rect x="345" y="208" width="7" height="56" rx="0" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="364" y="230" font-size="10.6" fill="#1d2330" font-weight="normal" text-anchor="start">No analyst credential can read another branch&#x27;s customer data;</text><text x="364" y="246" font-size="10.6" fill="#1d2330" font-weight="normal" text-anchor="start">access reviewed quarterly</text><rect x="30" y="280" width="260" height="56" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1" /><text x="46" y="313" font-size="12" fill="#5b6475" font-weight="italic" text-anchor="start">&quot;Make it scale&quot;</text><path d="M295,308 L335,308" fill="none" stroke="#b7791f" stroke-width="1.8" stroke-linejoin="round"/><path d="M335,308 L328.7,311.0 L328.7,305.0 Z" fill="#b7791f"/><rect x="345" y="280" width="600" height="56" rx="6" fill="#fff" stroke="#b7791f" stroke-width="1.5" /><rect x="345" y="280" width="7" height="56" rx="0" fill="#b7791f" stroke="none" stroke-width="1" /><text x="364" y="302" font-size="10.6" fill="#1d2330" font-weight="normal" text-anchor="start">The warehouse must handle 5x current order volume with no schema</text><text x="364" y="318" font-size="10.6" fill="#1d2330" font-weight="normal" text-anchor="start">change</text><rect x="30" y="352" width="260" height="56" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1" /><text x="46" y="385" font-size="12" fill="#5b6475" font-weight="italic" text-anchor="start">&quot;Keep it cheap&quot;</text><path d="M295,380 L335,380" fill="none" stroke="#7a4fa0" stroke-width="1.8" stroke-linejoin="round"/><path d="M335,380 L328.7,383.0 L328.7,377.0 Z" fill="#7a4fa0"/><rect x="345" y="352" width="600" height="56" rx="6" fill="#fff" stroke="#7a4fa0" stroke-width="1.5" /><rect x="345" y="352" width="7" height="56" rx="0" fill="#7a4fa0" stroke="none" stroke-width="1" /><text x="364" y="374" font-size="10.6" fill="#1d2330" font-weight="normal" text-anchor="start">Platform cost stays under ₹0.50 per 1,000 order lines processed,</text><text x="364" y="390" font-size="10.6" fill="#1d2330" font-weight="normal" text-anchor="start">reviewed monthly</text></svg>