<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="316" viewBox="0 0 1000 316" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1000" height="316" fill="#ffffff"/><text x="30" y="30" font-size="14.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The first automation audit: what an inventory actually finds</text><rect x="30" y="64" width="940" height="26" rx="4" fill="#1d2330" stroke="none" stroke-width="1" /><text x="40" y="82" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start">Category</text><text x="320" y="82" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start">Count</text><text x="400" y="82" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start">Examples</text><rect x="30" y="98" width="940" height="34" rx="0" fill="#fff" stroke="none" stroke-width="1" /><rect x="30" y="98" width="5" height="34" rx="0" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="40" y="120" font-size="9.8" fill="#1d2330" font-weight="bold" text-anchor="start">Documented, owned, monitored</text><text x="320" y="120" font-size="10.5" fill="#2f7d6d" font-weight="bold" text-anchor="start">6</text><text x="400" y="120" font-size="9.2" fill="#5b6475" font-weight="normal" text-anchor="start">Ch 20 Flash, Ch 46 pipeline, Ch 51 sync, Ch 55 assistant, Ch 56/57 model services, Ch 58 PO-int...</text><rect x="30" y="132" width="940" height="34" rx="0" fill="#f7f9fb" stroke="none" stroke-width="1" /><rect x="30" y="132" width="5" height="34" rx="0" fill="#b7791f" stroke="none" stroke-width="1" /><text x="40" y="154" font-size="9.8" fill="#1d2330" font-weight="bold" text-anchor="start">Working, but no owner on record</text><text x="320" y="154" font-size="10.5" fill="#b7791f" font-weight="bold" text-anchor="start">11</text><text x="400" y="154" font-size="9.2" fill="#5b6475" font-weight="normal" text-anchor="start">Branch-level macros, personal Apps Script projects, one Power Automate flow nobody remembers bu...</text><rect x="30" y="166" width="940" height="34" rx="0" fill="#fff" stroke="none" stroke-width="1" /><rect x="30" y="166" width="5" height="34" rx="0" fill="#c0662b" stroke="none" stroke-width="1" /><text x="40" y="188" font-size="9.8" fill="#1d2330" font-weight="bold" text-anchor="start">Duplicated logic, disagreeing outputs</text><text x="320" y="188" font-size="10.5" fill="#c0662b" font-weight="bold" text-anchor="start">4</text><text x="400" y="188" font-size="9.2" fill="#5b6475" font-weight="normal" text-anchor="start">Two branches independently built near-identical consolidation macros with different bugs</text><rect x="30" y="200" width="940" height="34" rx="0" fill="#f7f9fb" stroke="none" stroke-width="1" /><rect x="30" y="200" width="5" height="34" rx="0" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="40" y="222" font-size="9.8" fill="#1d2330" font-weight="bold" text-anchor="start">Business-critical, single point of failure</text><text x="320" y="222" font-size="10.5" fill="#b23b3b" font-weight="bold" text-anchor="start">1</text><text x="400" y="222" font-size="9.2" fill="#5b6475" font-weight="normal" text-anchor="start">MASTER_FINAL_v7_USE_THIS.xlsm (Ch 19) — still running, still unowned until the Ch 19 rewrite</text><rect x="30" y="234" width="940" height="34" rx="0" fill="#fff" stroke="none" stroke-width="1" /><rect x="30" y="234" width="5" height="34" rx="0" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="40" y="256" font-size="9.8" fill="#1d2330" font-weight="bold" text-anchor="start">Actively broken, nobody had noticed</text><text x="320" y="256" font-size="10.5" fill="#b23b3b" font-weight="bold" text-anchor="start">2</text><text x="400" y="256" font-size="9.2" fill="#5b6475" font-weight="normal" text-anchor="start">A stale Apps Script trigger silently stopped firing 5 months earlier</text><text x="30" y="296" font-size="11.2" fill="#5b6475" font-weight="normal" text-anchor="start">24 automations found, once someone actually looked. Only 6 had ever been through anything like this chapter&#x27;s governance model.</text></svg>