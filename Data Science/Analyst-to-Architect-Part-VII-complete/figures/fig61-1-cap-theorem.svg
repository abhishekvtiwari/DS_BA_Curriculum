<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="460" viewBox="0 0 1010 460" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1010" height="460" fill="#ffffff"/><text x="30" y="32" font-size="14.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">CAP: when the network partitions, pick one</text><polygon points="280.0,100.0 401.24355652982143,310.0 158.75644347017857,310.0" fill="#f3f6fa" stroke="#c9d3df" stroke-width="1.4"/><circle cx="280.0" cy="100.0" r="8" fill="#0f5c8c"/><text x="280.0" y="70.0" font-size="11.5" fill="#0f5c8c" font-weight="bold" text-anchor="middle">Consistency</text><text x="280.0" y="86.0" font-size="9.6" fill="#5b6475" font-weight="normal" text-anchor="middle">every reader sees</text><text x="280.0" y="99.0" font-size="9.6" fill="#5b6475" font-weight="normal" text-anchor="middle">the latest write</text><circle cx="401.24355652982143" cy="310.0" r="8" fill="#2f7d6d"/><text x="461.24355652982143" y="350.0" font-size="11.5" fill="#2f7d6d" font-weight="bold" text-anchor="middle">Availability</text><text x="461.24355652982143" y="366.0" font-size="9.6" fill="#5b6475" font-weight="normal" text-anchor="middle">the system keeps</text><text x="461.24355652982143" y="379.0" font-size="9.6" fill="#5b6475" font-weight="normal" text-anchor="middle">responding</text><circle cx="158.75644347017857" cy="310.0" r="8" fill="#b7791f"/><text x="98.75644347017857" y="350.0" font-size="11.5" fill="#b7791f" font-weight="bold" text-anchor="middle">Partition
tolerance</text><text x="98.75644347017857" y="366.0" font-size="9.6" fill="#5b6475" font-weight="normal" text-anchor="middle">the network can</text><text x="98.75644347017857" y="379.0" font-size="9.6" fill="#5b6475" font-weight="normal" text-anchor="middle">drop messages</text><text x="280" y="244" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="middle">P is not
optional
at scale</text><rect x="563" y="94" width="420" height="140" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="560" y="90" width="420" height="140" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><path d="M560,98 a8,8 0 0 1 8,-8 H972 a8,8 0 0 1 8,8 V116 H560 Z" fill="#0f5c8c"/><text x="770.0" y="108" font-size="10.8" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Order writes (PO-intake -&gt; ERP)</text><text x="770.0" y="134" font-size="9.200000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">Choose Consistency: if the ERP link is unreachable,</text><text x="770.0" y="149" font-size="9.200000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">refuse the write and queue it, rather than risk</text><text x="770.0" y="164" font-size="9.200000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">two different totals existing anywhere (Ch 51).</text><rect x="563" y="264" width="420" height="140" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="560" y="260" width="420" height="140" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><path d="M560,268 a8,8 0 0 1 8,-8 H972 a8,8 0 0 1 8,8 V286 H560 Z" fill="#2f7d6d"/><text x="770.0" y="278" font-size="10.8" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Dashboard reads (warehouse -&gt; BI)</text><text x="770.0" y="304" font-size="9.200000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">Choose Availability: if the warehouse is a few</text><text x="770.0" y="319" font-size="9.200000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">minutes stale, show yesterday&#x27;s number with a</text><text x="770.0" y="334" font-size="9.200000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">timestamp rather than show nothing at all.</text><text x="30" y="440" font-size="11.3" fill="#5b6475" font-weight="normal" text-anchor="start">CAP is not a menu you pick from once. Different parts of the same platform make different, deliberate choices.</text></svg>