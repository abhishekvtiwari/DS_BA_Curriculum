<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="492" viewBox="0 0 1040 492" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1040" height="492" fill="#ffffff"/><rect x="30" y="24" width="980" height="132" rx="8" fill="#fbfcfe" stroke="#0f5c8c" stroke-width="1.5" /><text x="48" y="54" font-size="15" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Fresher</text><rect x="48" y="68" width="250" height="52" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="60" y="89" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">Degree, course, or</text><text x="60" y="107" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">self-study</text><path d="M302,94 L338,94" fill="none" stroke="#0f5c8c" stroke-width="2" stroke-linejoin="round"/><path d="M338,94 L329.9,97.9 L329.9,90.1 Z" fill="#0f5c8c"/><rect x="344" y="68" width="250" height="52" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="356" y="89" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">Projects and a</text><text x="356" y="107" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">portfolio</text><path d="M598,94 L634,94" fill="none" stroke="#0f5c8c" stroke-width="2" stroke-linejoin="round"/><path d="M634,94 L625.9,97.9 L625.9,90.1 Z" fill="#0f5c8c"/><rect x="640" y="68" width="250" height="52" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="652" y="89" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">Internship or</text><text x="652" y="107" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">entry analyst role</text><text x="48" y="142" font-size="12" fill="#2f7d6d" font-weight="bold" text-anchor="start">Advantage: time to build skills from zero</text><text x="530" y="142" font-size="12" fill="#b23b3b" font-weight="bold" text-anchor="start">Obstacle: no work evidence yet</text><rect x="30" y="172" width="980" height="132" rx="8" fill="#fbfcfe" stroke="#7a4fa0" stroke-width="1.5" /><text x="48" y="202" font-size="15" fill="#7a4fa0" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Career switcher</text><rect x="48" y="216" width="250" height="52" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="60" y="237" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">Experience in another</text><text x="60" y="255" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">field (finance, sales, ops)</text><path d="M302,242 L338,242" fill="none" stroke="#7a4fa0" stroke-width="2" stroke-linejoin="round"/><path d="M338,242 L329.9,245.9 L329.9,238.1 Z" fill="#7a4fa0"/><rect x="344" y="216" width="250" height="52" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="356" y="237" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">Tier 1 keys plus projects</text><text x="356" y="255" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">on your own domain</text><path d="M598,242 L634,242" fill="none" stroke="#7a4fa0" stroke-width="2" stroke-linejoin="round"/><path d="M634,242 L625.9,245.9 L625.9,238.1 Z" fill="#7a4fa0"/><rect x="640" y="216" width="250" height="52" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="652" y="237" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">Domain analyst role</text><text x="652" y="255" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">(e.g. finance analyst)</text><text x="48" y="290" font-size="12" fill="#2f7d6d" font-weight="bold" text-anchor="start">Advantage: business context employers value</text><text x="530" y="290" font-size="12" fill="#b23b3b" font-weight="bold" text-anchor="start">Obstacle: less time; starting over feels risky</text><rect x="30" y="320" width="980" height="132" rx="8" fill="#fbfcfe" stroke="#2f7d6d" stroke-width="1.5" /><text x="48" y="350" font-size="15" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Internal move</text><rect x="48" y="364" width="250" height="52" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="60" y="385" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">A job inside a company</text><text x="60" y="403" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">(sales, support, ops)</text><path d="M302,390 L338,390" fill="none" stroke="#2f7d6d" stroke-width="2" stroke-linejoin="round"/><path d="M338,390 L329.9,393.9 L329.9,386.1 Z" fill="#2f7d6d"/><rect x="344" y="364" width="250" height="52" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="356" y="385" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">Automate your own work;</text><text x="356" y="403" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">volunteer analysis</text><path d="M598,390 L634,390" fill="none" stroke="#2f7d6d" stroke-width="2" stroke-linejoin="round"/><path d="M634,390 L625.9,393.9 L625.9,386.1 Z" fill="#2f7d6d"/><rect x="640" y="364" width="250" height="52" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="652" y="385" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">Internal opening or</text><text x="652" y="403" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">role reshaped around you</text><text x="48" y="438" font-size="12" fill="#2f7d6d" font-weight="bold" text-anchor="start">Advantage: people already trust you</text><text x="530" y="438" font-size="12" fill="#b23b3b" font-weight="bold" text-anchor="start">Obstacle: being seen as &#x27;only&#x27; your old job</text><text x="30" y="474" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start">All three routes end at the same tier 1 door. What differs is the evidence you bring to it.</text></svg>