<svg xmlns="http://www.w3.org/2000/svg" width="720" height="370" viewBox="0 0 720 370" font-family="DejaVu Sans, Arial, sans-serif"><rect width="720" height="370" fill="#ffffff"/><rect x="16" y="12" width="688" height="110" rx="8" fill="#fbfcfe" stroke="#0f5c8c" stroke-width="1.5" /><text x="30" y="36" font-size="14" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Fresher</text><rect x="30" y="46" width="200" height="46" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="40" y="64" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Degree, course, or</text><text x="40" y="80" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">self-study</text><path d="M233,69 L258,69" fill="none" stroke="#0f5c8c" stroke-width="2" stroke-linejoin="round"/><path d="M258,69 L249.9,72.9 L249.9,65.1 Z" fill="#0f5c8c"/><rect x="262" y="46" width="200" height="46" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="272" y="64" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Projects and a</text><text x="272" y="80" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">portfolio</text><path d="M465,69 L490,69" fill="none" stroke="#0f5c8c" stroke-width="2" stroke-linejoin="round"/><path d="M490,69 L481.9,72.9 L481.9,65.1 Z" fill="#0f5c8c"/><rect x="494" y="46" width="200" height="46" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="504" y="64" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Internship or</text><text x="504" y="80" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">entry analyst role</text><text x="30" y="111" font-size="11.5" fill="#2f7d6d" font-weight="bold" text-anchor="start">+ Advantage: time to build skills from zero</text><text x="360" y="111" font-size="11.5" fill="#b23b3b" font-weight="bold" text-anchor="start">– Obstacle: no work evidence yet</text><rect x="16" y="130" width="688" height="110" rx="8" fill="#fbfcfe" stroke="#7a4fa0" stroke-width="1.5" /><text x="30" y="154" font-size="14" fill="#7a4fa0" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Career switcher</text><rect x="30" y="164" width="200" height="46" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="40" y="182" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Experience in another</text><text x="40" y="198" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">field (finance, sales, ops)</text><path d="M233,187 L258,187" fill="none" stroke="#7a4fa0" stroke-width="2" stroke-linejoin="round"/><path d="M258,187 L249.9,190.9 L249.9,183.1 Z" fill="#7a4fa0"/><rect x="262" y="164" width="200" height="46" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="272" y="182" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Tier 1 keys plus projects</text><text x="272" y="198" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">on your own domain</text><path d="M465,187 L490,187" fill="none" stroke="#7a4fa0" stroke-width="2" stroke-linejoin="round"/><path d="M490,187 L481.9,190.9 L481.9,183.1 Z" fill="#7a4fa0"/><rect x="494" y="164" width="200" height="46" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="504" y="182" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Domain analyst role</text><text x="504" y="198" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">(e.g. finance analyst)</text><text x="30" y="229" font-size="11.5" fill="#2f7d6d" font-weight="bold" text-anchor="start">+ Advantage: business context employers value</text><text x="360" y="229" font-size="11.5" fill="#b23b3b" font-weight="bold" text-anchor="start">– Obstacle: less time; starting over feels risky</text><rect x="16" y="248" width="688" height="110" rx="8" fill="#fbfcfe" stroke="#2f7d6d" stroke-width="1.5" /><text x="30" y="272" font-size="14" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Internal move</text><rect x="30" y="282" width="200" height="46" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="40" y="300" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">A job inside a company</text><text x="40" y="316" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">(sales, support, ops)</text><path d="M233,305 L258,305" fill="none" stroke="#2f7d6d" stroke-width="2" stroke-linejoin="round"/><path d="M258,305 L249.9,308.9 L249.9,301.1 Z" fill="#2f7d6d"/><rect x="262" y="282" width="200" height="46" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="272" y="300" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Automate your own work;</text><text x="272" y="316" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">volunteer analysis</text><path d="M465,305 L490,305" fill="none" stroke="#2f7d6d" stroke-width="2" stroke-linejoin="round"/><path d="M490,305 L481.9,308.9 L481.9,301.1 Z" fill="#2f7d6d"/><rect x="494" y="282" width="200" height="46" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="504" y="300" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Internal opening or</text><text x="504" y="316" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">role reshaped around you</text><text x="30" y="347" font-size="11.5" fill="#2f7d6d" font-weight="bold" text-anchor="start">+ Advantage: people already trust you</text><text x="360" y="347" font-size="11.5" fill="#b23b3b" font-weight="bold" text-anchor="start">– Obstacle: being seen as &#x27;only&#x27; your old job</text></svg>