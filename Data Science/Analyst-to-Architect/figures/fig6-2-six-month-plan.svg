<svg xmlns="http://www.w3.org/2000/svg" width="950" height="510" viewBox="0 0 950 510" font-family="DejaVu Sans, Arial, sans-serif"><rect width="950" height="510" fill="#ffffff"/><text x="30" y="34" font-size="15" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">A sample six-month plan at about 8 hours a week</text><rect x="30" y="60" width="120" height="58" rx="8" fill="#5b6475" stroke="none" stroke-width="1" /><text x="90" y="85" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Month 1</text><text x="90" y="104" font-size="11.5" fill="#fff" font-weight="normal" text-anchor="middle">Weeks 1–4</text><rect x="160" y="60" width="760" height="58" rx="8" fill="#fff" stroke="#5b6475" stroke-width="1.5" /><text x="176" y="85" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start">Part 0 and Part I: Chapters 1–9</text><text x="176" y="105" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">foundations, the map, how learning works</text><rect x="30" y="130" width="120" height="58" rx="8" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="90" y="155" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Month 2</text><text x="90" y="174" font-size="11.5" fill="#fff" font-weight="normal" text-anchor="middle">Weeks 5–8</text><rect x="160" y="130" width="760" height="58" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.5" /><text x="176" y="155" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start">Chapters 10–11: spreadsheets</text><text x="176" y="175" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Excel and Google Sheets, pivot tables, Power Query</text><rect x="30" y="200" width="120" height="58" rx="8" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="90" y="225" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Month 3</text><text x="90" y="244" font-size="11.5" fill="#fff" font-weight="normal" text-anchor="middle">Weeks 9–12</text><rect x="160" y="200" width="760" height="58" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.5" /><text x="176" y="225" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start">Chapters 12–13: SQL</text><text x="176" y="245" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">queries on the Riverstone database, in PostgreSQL and MySQL</text><rect x="30" y="270" width="120" height="58" rx="8" fill="#c0662b" stroke="none" stroke-width="1" /><text x="90" y="295" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Month 4</text><text x="90" y="314" font-size="11.5" fill="#fff" font-weight="normal" text-anchor="middle">Weeks 13–17</text><rect x="160" y="270" width="760" height="58" rx="8" fill="#fff" stroke="#c0662b" stroke-width="1.5" /><text x="176" y="295" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start">Chapters 14–16: cleaning, charts, Power BI</text><text x="176" y="315" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">a first dashboard</text><rect x="30" y="340" width="120" height="58" rx="8" fill="#7a4fa0" stroke="none" stroke-width="1" /><text x="90" y="365" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Month 5</text><text x="90" y="384" font-size="11.5" fill="#fff" font-weight="normal" text-anchor="middle">Weeks 18–22</text><rect x="160" y="340" width="760" height="58" rx="8" fill="#fff" stroke="#7a4fa0" stroke-width="1.5" /><text x="176" y="365" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start">Chapters 17–18 and 21–22: Python, statistics</text><text x="176" y="385" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">pandas, descriptive statistics, not fooling yourself</text><rect x="30" y="410" width="120" height="58" rx="8" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="90" y="435" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Month 6</text><text x="90" y="454" font-size="11.5" fill="#fff" font-weight="normal" text-anchor="middle">Weeks 23–26</text><rect x="160" y="410" width="760" height="58" rx="8" fill="#fff" stroke="#b23b3b" stroke-width="1.5" /><text x="176" y="435" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start">Chapters 19–20 and 23–27: automation, business, portfolio</text><text x="176" y="455" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">capstone project; start interview practice (Chapters 68–71)</text><text x="30" y="490" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-style="italic">Every week: one review session, the chapter exercises, and a little SQL or Python practice on something you&#x27;ve already learned.</text></svg>