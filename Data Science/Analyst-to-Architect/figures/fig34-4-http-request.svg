<svg xmlns="http://www.w3.org/2000/svg" width="700" height="410" viewBox="0 0 700 410" font-family="DejaVu Sans, Arial, sans-serif"><rect width="700" height="410" fill="#ffffff"/><text x="20" y="28" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">What happens when curl asks for a file</text><rect x="20" y="44" width="660" height="34" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="32" y="66" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">curl --silent http://127.0.0.1:8034/exports/orders_2025-12-16.csv</text><text x="32" y="102" font-size="11.5" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">http</text><text x="180" y="102" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">the protocol: HTTP, or https for an encrypted connection</text><text x="32" y="122" font-size="11.5" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">127.0.0.1</text><text x="180" y="122" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">which machine: localhost, this one</text><text x="32" y="142" font-size="11.5" fill="#7a4fa0" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">8034</text><text x="180" y="142" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">which program on it: the port it listens on</text><text x="32" y="162" font-size="11.5" fill="#c0662b" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">/exports/orders_…</text><text x="180" y="162" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">what to ask for: the path</text><rect x="20" y="188" width="660" height="46" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.5" /><text x="34" y="207" font-size="11.5" fill="#0f5c8c" font-weight="bold" text-anchor="start">1. Name → address</text><text x="34" y="225" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">A name like api.example.com is looked up in DNS. 127.0.0.1 is already an address.</text><rect x="20" y="242" width="660" height="46" rx="7" fill="#fff" stroke="#2f7d6d" stroke-width="1.5" /><text x="34" y="261" font-size="11.5" fill="#2f7d6d" font-weight="bold" text-anchor="start">2. Connect to the port</text><text x="34" y="279" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">The program listening on port 8034 accepts. ss -ltn shows what is listening.</text><rect x="20" y="296" width="660" height="46" rx="7" fill="#fff" stroke="#7a4fa0" stroke-width="1.5" /><text x="34" y="315" font-size="11.5" fill="#7a4fa0" font-weight="bold" text-anchor="start">3. Send the request</text><text x="34" y="333" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">GET /exports/orders_2025-12-16.csv, plus headers such as an API key.</text><rect x="20" y="350" width="660" height="46" rx="7" fill="#fff" stroke="#c0662b" stroke-width="1.5" /><text x="34" y="369" font-size="11.5" fill="#c0662b" font-weight="bold" text-anchor="start">4. Read the answer</text><text x="34" y="387" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">A status code (200 OK, 404 not found, 500 and up: the server failed), headers, the body.</text></svg>