<svg xmlns="http://www.w3.org/2000/svg" width="700" height="416" viewBox="0 0 700 416" font-family="DejaVu Sans, Arial, sans-serif"><rect width="700" height="416" fill="#ffffff"/><text x="20" y="26" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Which method, and what it costs you</text><text x="20" y="52" font-size="11" fill="#5b6475" font-weight="bold" text-anchor="start">Question</text><text x="313" y="52" font-size="11" fill="#5b6475" font-weight="bold" text-anchor="start">Method, and its catch</text><text x="619" y="52" font-size="11" fill="#5b6475" font-weight="bold" text-anchor="middle">Evidence</text><rect x="20" y="60" width="262" height="42" rx="5" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="30" y="85" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">Can you randomize?</text><path d="M284,81 H301" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M294,76 L301,81 L294,86" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><rect x="303" y="60" width="245" height="42" rx="5" fill="#fff" stroke="#2f7d6d" stroke-width="1.8" /><text x="313" y="78" font-size="11.5" fill="#2f7d6d" font-weight="bold" text-anchor="start">Run the experiment (Chapter 30)</text><text x="313" y="94" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">you decide who gets it</text><rect x="554" y="68" width="130" height="26" rx="13" fill="#fff" stroke="#2f7d6d" stroke-width="1.2" /><text x="619" y="85" font-size="10.5" fill="#2f7d6d" font-weight="bold" text-anchor="middle">strongest</text><rect x="20" y="110" width="262" height="42" rx="5" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="30" y="135" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">Is there a threshold rule?</text><path d="M284,131 H301" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M294,126 L301,131 L294,136" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><rect x="303" y="110" width="245" height="42" rx="5" fill="#fff" stroke="#2f7d6d" stroke-width="1.8" /><text x="313" y="128" font-size="11.5" fill="#2f7d6d" font-weight="bold" text-anchor="start">Regression discontinuity</text><text x="313" y="144" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">the answer is local to the cut-off</text><rect x="554" y="118" width="130" height="26" rx="13" fill="#fff" stroke="#2f7d6d" stroke-width="1.2" /><text x="619" y="135" font-size="10.5" fill="#2f7d6d" font-weight="bold" text-anchor="middle">strong, local</text><rect x="20" y="160" width="262" height="42" rx="5" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="30" y="185" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">Before-and-after data for both groups?</text><path d="M284,181 H301" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M294,176 L301,181 L294,186" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><rect x="303" y="160" width="245" height="42" rx="5" fill="#fff" stroke="#0f5c8c" stroke-width="1.8" /><text x="313" y="178" font-size="11.5" fill="#0f5c8c" font-weight="bold" text-anchor="start">Difference-in-differences</text><text x="313" y="194" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">needs parallel trends</text><rect x="554" y="168" width="130" height="26" rx="13" fill="#fff" stroke="#0f5c8c" stroke-width="1.2" /><text x="619" y="185" font-size="10.5" fill="#0f5c8c" font-weight="bold" text-anchor="middle">moderate to strong</text><rect x="20" y="210" width="262" height="42" rx="5" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="30" y="235" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">Many untreated units, one treated?</text><path d="M284,231 H301" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M294,226 L301,231 L294,236" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><rect x="303" y="210" width="245" height="42" rx="5" fill="#fff" stroke="#0f5c8c" stroke-width="1.8" /><text x="313" y="228" font-size="11.5" fill="#0f5c8c" font-weight="bold" text-anchor="start">Synthetic control</text><text x="313" y="244" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">judge it by the pre-change fit</text><rect x="554" y="218" width="130" height="26" rx="13" fill="#fff" stroke="#0f5c8c" stroke-width="1.2" /><text x="619" y="235" font-size="10.5" fill="#0f5c8c" font-weight="bold" text-anchor="middle">moderate to strong</text><rect x="20" y="260" width="262" height="42" rx="5" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="30" y="285" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">Only one snapshot, good covariates?</text><path d="M284,281 H301" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M294,276 L301,281 L294,286" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><rect x="303" y="260" width="245" height="42" rx="5" fill="#fff" stroke="#c0662b" stroke-width="1.8" /><text x="313" y="278" font-size="11.5" fill="#c0662b" font-weight="bold" text-anchor="start">Matching / propensity scores</text><text x="313" y="294" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">assumes nothing unmeasured</text><rect x="554" y="268" width="130" height="26" rx="13" fill="#fff" stroke="#c0662b" stroke-width="1.2" /><text x="619" y="285" font-size="10.5" fill="#c0662b" font-weight="bold" text-anchor="middle">moderate</text><rect x="20" y="310" width="262" height="42" rx="5" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="30" y="335" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">Shifts the treatment, not the outcome?</text><path d="M284,331 H301" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M294,326 L301,331 L294,336" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><rect x="303" y="310" width="245" height="42" rx="5" fill="#fff" stroke="#c0662b" stroke-width="1.8" /><text x="313" y="328" font-size="11.5" fill="#c0662b" font-weight="bold" text-anchor="start">Instrumental variables</text><text x="313" y="344" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">exclusion can&#x27;t be tested</text><rect x="554" y="318" width="130" height="26" rx="13" fill="#fff" stroke="#c0662b" stroke-width="1.2" /><text x="619" y="335" font-size="10.5" fill="#c0662b" font-weight="bold" text-anchor="middle">strong if valid</text><rect x="20" y="360" width="262" height="42" rx="5" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="30" y="385" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">None of the above?</text><path d="M284,381 H301" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M294,376 L301,381 L294,386" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><rect x="303" y="360" width="245" height="42" rx="5" fill="#fff" stroke="#b23b3b" stroke-width="1.8" /><text x="313" y="378" font-size="11.5" fill="#b23b3b" font-weight="bold" text-anchor="start">Describe; don&#x27;t claim a cause</text><text x="313" y="394" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">say so plainly</text><rect x="554" y="368" width="130" height="26" rx="13" fill="#fff" stroke="#b23b3b" stroke-width="1.2" /><text x="619" y="385" font-size="10.5" fill="#b23b3b" font-weight="bold" text-anchor="middle">no causal claim</text></svg>