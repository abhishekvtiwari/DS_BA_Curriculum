hor="start" font-family="DejaVu Sans Mono, monospace">7</text><rect x="356" y="288" width="82" height="26" rx="0" fill="#f6f9fc" stroke="#c9d3df" stroke-width="0.8" /><text x="364" y="306" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">2</text><text x="20" y="342" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">product</text><rect x="110" y="324" width="82" height="26" rx="0" fill="#f6f9fc" stroke="#c9d3df" stroke-width="0.8" /><text x="118" y="342" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">105</text><rect x="192" y="324" width="82" height="26" rx="0" fill="#f6f9fc" stroke="#c9d3df" stroke-width="0.8" /><text x="200" y="342" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">107</text><rect x="274" y="324" width="82" height="26" rx="0" fill="#f6f9fc" stroke="#c9d3df" stroke-width="0.8" /><text x="282" y="342" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">101</text><rect x="356" y="324" width="82" height="26" rx="0" fill="#f6f9fc" stroke="#c9d3df" stroke-width="0.8" /><text x="364" y="342" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">103</text><text x="20" y="378" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">qty</text><rect x="110" y="360" width="82" height="26" rx="0" fill="#e2f3ee" stroke="#c9d3df" stroke-width="0.8" /><text x="118" y="378" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">77</text><rect x="192" y="360" width="82" height="26" rx="0" fill="#e2f3ee" stroke="#c9d3df" stroke-width="0.8" /><text x="200" y="378" font-size="12" fill="#1d