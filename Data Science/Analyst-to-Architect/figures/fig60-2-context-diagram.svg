<svg xmlns="http://www.w3.org/2000/svg" width="680" height="474" viewBox="0 0 680 474" font-family="DejaVu Sans, Arial, sans-serif"><rect width="680" height="474" fill="#ffffff"/><text x="12" y="24" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Context diagram: the Riverstone Analytics &amp; AI Platform (level 1)</text><rect x="253" y="174" width="180" height="96" rx="9" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="250" y="170" width="180" height="96" rx="9" fill="#fff" stroke="#0f5c8c" stroke-width="2" /><path d="M250,179 a9,9 0 0 1 9,-9 H421 a9,9 0 0 1 9,9 V206 H250 Z" fill="#0f5c8c"/><text x="340.0" y="185" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">Riverstone Analytics</text><text x="340.0" y="198" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">&amp; AI Platform</text><text x="340.0" y="224" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="middle">Turns orders, sensor readings</text><text x="340.0" y="237" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="middle">and documents into reports,</text><text x="340.0" y="250" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="middle">alerts and actions</text><circle cx="70" cy="55" r="10" fill="#5b6475"/><rect x="54" y="67" width="32" height="22" rx="7" fill="#5b6475" stroke="none" stroke-width="1" /><text x="70" y="103" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="middle">Branch</text><text x="70" y="116" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="middle">managers</text><circle cx="610" cy="55" r="10" fill="#5b6475"/><rect x="594" y="67" width="32" height="22" rx="7" fill="#5b6475" stroke="none" stroke-width="1" /><text x="610" y="103" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="middle">Customers</text><circle cx="70" cy="329" r="10" fill="#5b6475"/><rect x="54" y="341" width="32" height="22" rx="7" fill="#5b6475" stroke="none" stroke-width="1" /><text x="70" y="377" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="middle">Sales and</text><text x="70" y="390" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="middle">ops staff</text><circle cx="610" cy="329" r="10" fill="#5b6475"/><rect x="594" y="341" width="32" height="22" rx="7" fill="#5b6475" stroke="none" stroke-width="1" /><text x="610" y="377" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="middle">Data and</text><text x="610" y="390" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="middle">analytics team</text><rect x="280" y="44" width="120" height="46" rx="6" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.3" /><text x="340.0" y="64.5" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="middle">ERP</text><text x="340.0" y="77.5" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="middle">(order records)</text><rect x="280" y="350" width="120" height="46" rx="6" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.3" /><text x="340.0" y="377.0" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="middle">CRM</text><rect x="12" y="190" width="112" height="58" rx="6" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.3" /><text x="68.0" y="210.0" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="middle">Plant sensors;</text><text x="68.0" y="223.0" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="middle">Taloja line</text><text x="68.0" y="236.0" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="middle">camera</text><rect x="556" y="196" width="112" height="46" rx="6" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.3" /><text x="612.0" y="223.0" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="middle">Email inbox</text><path d="M318,90 L318,168" fill="none" stroke="#b7791f" stroke-width="1.5" stroke-linejoin="round"/><path d="M318,168 L315.0,161.7 L321.0,161.7 Z" fill="#b7791f"/><text x="312" y="134" font-size="10.5" fill="#b7791f" font-weight="normal" text-anchor="end">orders</text><path d="M362,170 L362,92" fill="none" stroke="#b7791f" stroke-width="1.5" stroke-linejoin="round"/><path d="M362,92 L365.0,98.3 L359.0,98.3 Z" fill="#b7791f"/><text x="368" y="126.0" font-size="10.5" fill="#b7791f" font-weight="normal" text-anchor="start">confirmed</text><text x="368" y="138.5" font-size="10.5" fill="#b7791f" font-weight="normal" text-anchor="start">PO orders</text><path d="M318,350 L318,268" fill="none" stroke="#b7791f" stroke-width="1.5" stroke-linejoin="round"/><path d="M318,268 L321.0,274.3 L315.0,274.3 Z" fill="#b7791f"/><text x="312" y="304.0" font-size="10.5" fill="#b7791f" font-weight="normal" text-anchor="end">leads,</text><text x="312" y="316.5" font-size="10.5" fill="#b7791f" font-weight="normal" text-anchor="end">segments</text><path d="M362,266 L362,348" fill="none" stroke="#b7791f" stroke-width="1.5" stroke-linejoin="round"/><path d="M362,348 L359.0,341.7 L365.0,341.7 Z" fill="#b7791f"/><text x="368" y="304.0" font-size="10.5" fill="#b7791f" font-weight="normal" text-anchor="start">lead scores,</text><text x="368" y="316.5" font-size="10.5" fill="#b7791f" font-weight="normal" text-anchor="start">follow-up flags</text><path d="M124,219 L248,219" fill="none" stroke="#b7791f" stroke-width="1.5" stroke-linejoin="round"/><path d="M248,219 L241.7,222.0 L241.7,216.0 Z" fill="#b7791f"/><text x="130" y="210" font-size="10.5" fill="#b7791f" font-weight="normal" text-anchor="start">readings, images</text><path d="M556,219 L432,219" fill="none" stroke="#b7791f" stroke-width="1.5" stroke-linejoin="round"/><path d="M432,219 L438.3,216.0 L438.3,222.0 Z" fill="#b7791f"/><text x="438" y="198.0" font-size="10.5" fill="#b7791f" font-weight="normal" text-anchor="start">PO and support</text><text x="438" y="210.5" font-size="10.5" fill="#b7791f" font-weight="normal" text-anchor="start">emails</text><path d="M260,168 L104,104" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M104,104 L111.0,103.6 L108.7,109.2 Z" fill="#5b6475"/><text x="150" y="92.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">dashboards,</text><text x="150" y="104.5" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">Daily Sales Flash</text><path d="M420,168 L578,104" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M578,104 L573.3,109.2 L571.0,103.5 Z" fill="#5b6475"/><text x="446" y="96.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">answers to</text><text x="446" y="108.5" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">questions</text><path d="M260,268 L104,326" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M104,326 L108.8,320.9 L111.0,326.7 Z" fill="#5b6475"/><text x="160" y="326.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">drafts to</text><text x="160" y="338.5" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">confirm, flags</text><path d="M578,326 L420,268" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="4 3"/><path d="M420,268 L427.0,267.3 L424.9,273.0 Z" fill="#5b6475"/><text x="500" y="272.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">builds and</text><text x="500" y="284.5" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">runs it</text><circle cx="20" cy="424" r="5" fill="#5b6475"/><text x="32" y="428" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">a person or group</text><rect x="160" y="417" width="18" height="13" rx="3" fill="#f1f3f6" stroke="#8a93a3" stroke-width="1.2" /><text x="184" y="428" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">another system, outside the platform</text><text x="12" y="450" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">One box in the middle, and every arrow crosses its edge. Nobody here asks which orchestrator runs inside: that question</text><text x="12" y="464" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">belongs one level down.</text></svg>