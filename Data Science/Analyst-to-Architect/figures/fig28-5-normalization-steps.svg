<svg xmlns="http://www.w3.org/2000/svg" width="700" height="262" viewBox="0 0 700 262" font-family="DejaVu Sans, Arial, sans-serif"><rect width="700" height="262" fill="#ffffff"/><text x="20" y="24" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Normalization, one rule at a time (the same six orders)</text><rect x="15" y="40" width="154" height="150" rx="7" fill="#fff" stroke="#b23b3b" stroke-width="1.8" /><text x="23" y="62" font-size="11.5" fill="#b23b3b" font-weight="bold" text-anchor="start">0NF: order_sheet</text><text x="23" y="80" font-size="10.5" fill="#5b6475" font-weight="bold" text-anchor="start">6 rows</text><text x="23" y="106" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">products packed in</text><text x="23" y="124" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">one cell:</text><text x="23" y="142" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">&#x27;101 Storage Box</text><text x="23" y="160" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">10L x45 @430; …&#x27;</text><path d="M172,115 H186" fill="none" stroke="#1d2330" stroke-width="1.8" stroke-linejoin="round"/><path d="M181,110 L187,115 L181,120" fill="none" stroke="#1d2330" stroke-width="1.8" stroke-linejoin="round"/><rect x="189" y="40" width="154" height="150" rx="7" fill="#fff" stroke="#c0662b" stroke-width="1.8" /><text x="197" y="62" font-size="11.5" fill="#c0662b" font-weight="bold" text-anchor="start">1NF</text><text x="197" y="80" font-size="10.5" fill="#5b6475" font-weight="bold" text-anchor="start">10 rows</text><text x="197" y="106" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">one value per cell,</text><text x="197" y="124" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">one row per order line,</text><text x="197" y="142" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">key (order_id,</text><text x="197" y="160" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">product_id)</text><path d="M346,115 H360" fill="none" stroke="#1d2330" stroke-width="1.8" stroke-linejoin="round"/><path d="M355,110 L361,115 L355,120" fill="none" stroke="#1d2330" stroke-width="1.8" stroke-linejoin="round"/><rect x="363" y="40" width="154" height="150" rx="7" fill="#fff" stroke="#7a4fa0" stroke-width="1.8" /><text x="371" y="62" font-size="11.5" fill="#7a4fa0" font-weight="bold" text-anchor="start">2NF: split by key</text><text x="371" y="80" font-size="10.5" fill="#5b6475" font-weight="bold" text-anchor="start">6 + 4 + 10 rows</text><text x="371" y="106" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">orders (order_id)</text><text x="371" y="124" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">products (product_id)</text><text x="371" y="142" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">order_lines</text><text x="371" y="160" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">(need both)</text><path d="M520,115 H534" fill="none" stroke="#1d2330" stroke-width="1.8" stroke-linejoin="round"/><path d="M529,110 L535,115 L529,120" fill="none" stroke="#1d2330" stroke-width="1.8" stroke-linejoin="round"/><rect x="537" y="40" width="154" height="150" rx="7" fill="#fff" stroke="#2f7d6d" stroke-width="1.8" /><text x="545" y="62" font-size="11.5" fill="#2f7d6d" font-weight="bold" text-anchor="start">3NF: customers</text><text x="545" y="80" font-size="10.5" fill="#5b6475" font-weight="bold" text-anchor="start">4 customers</text><text x="545" y="106" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">city depends on the</text><text x="545" y="124" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">customer, not the order:</text><text x="545" y="142" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">move it to its own</text><text x="545" y="160" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">table</text><text x="20" y="214" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">0NF → 1NF: you can filter and add up.   1NF → 2NF: a product&#x27;s name is stored once.</text><text x="20" y="232" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">2NF → 3NF: a customer&#x27;s city is stored once, so it can&#x27;t disagree with itself.</text><text x="20" y="250" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">At every step the net revenue still totals ₹1,29,040.</text></svg>