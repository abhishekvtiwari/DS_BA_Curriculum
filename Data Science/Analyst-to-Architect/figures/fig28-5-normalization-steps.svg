<svg xmlns="http://www.w3.org/2000/svg" width="1070" height="290" viewBox="0 0 1070 290" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1070" height="290" fill="#ffffff"/><text x="30" y="32" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Normalization, one rule at a time (the same six orders)</text><rect x="30" y="60" width="225" height="160" rx="8" fill="#fff" stroke="#b23b3b" stroke-width="2" /><text x="44" y="88" font-size="13" fill="#b23b3b" font-weight="bold" text-anchor="start">0NF: order_sheet</text><text x="44" y="110" font-size="12" fill="#5b6475" font-weight="bold" text-anchor="start">6 rows</text><text x="44" y="140" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">products packed in one cell:</text><text x="44" y="162" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">&#x27;101 Storage Box 10L x45</text><text x="44" y="184" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace"> @430; 102 Storage …&#x27;</text><path d="M258,155 H282" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M275,149 L283,155 L275,161" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><rect x="287" y="60" width="225" height="160" rx="8" fill="#fff" stroke="#c0662b" stroke-width="2" /><text x="301" y="88" font-size="13" fill="#c0662b" font-weight="bold" text-anchor="start">1NF: order_lines_1nf</text><text x="301" y="110" font-size="12" fill="#5b6475" font-weight="bold" text-anchor="start">10 rows</text><text x="301" y="140" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">one value per cell,</text><text x="301" y="162" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">one row per order line,</text><text x="301" y="184" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">key (order_id, product_id)</text><path d="M515,155 H539" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M532,149 L540,155 L532,161" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><rect x="544" y="60" width="225" height="160" rx="8" fill="#fff" stroke="#7a4fa0" stroke-width="2" /><text x="558" y="88" font-size="13" fill="#7a4fa0" font-weight="bold" text-anchor="start">2NF: split by key</text><text x="558" y="110" font-size="12" fill="#5b6475" font-weight="bold" text-anchor="start">6 + 4 + 10 rows</text><text x="558" y="140" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">orders (depend on order_id)</text><text x="558" y="162" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">products (depend on product_id)</text><text x="558" y="184" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">order_lines (need both)</text><path d="M772,155 H796" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M789,149 L797,155 L789,161" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><rect x="801" y="60" width="225" height="160" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="2" /><text x="815" y="88" font-size="13" fill="#2f7d6d" font-weight="bold" text-anchor="start">3NF: customers</text><text x="815" y="110" font-size="12" fill="#5b6475" font-weight="bold" text-anchor="start">4 customers</text><text x="815" y="140" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">city depends on customer,</text><text x="815" y="162" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">not on the order: move it</text><text x="815" y="184" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">to its own table</text><text x="30" y="252" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Problems removed:  0NF → 1NF you can filter and sum.  1NF → 2NF a product&#x27;s name is stored once.</text><text x="30" y="274" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">2NF → 3NF a customer&#x27;s city is stored once, so it can&#x27;t disagree with itself.  Every step: the net revenue still totals ₹129,040.</text></svg>