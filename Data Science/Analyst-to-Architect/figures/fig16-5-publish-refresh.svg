<svg xmlns="http://www.w3.org/2000/svg" width="620" height="252" viewBox="0 0 620 252" font-family="DejaVu Sans, Arial, sans-serif"><rect width="620" height="252" fill="#ffffff"/><text x="10" y="20" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">From a .pbix file to a report the branches trust</text><rect x="12" y="37" width="110" height="106" rx="6" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="10" y="34" width="110" height="106" rx="6" fill="#fff" stroke="#0f5c8c" stroke-width="1.4" /><path d="M10,40 a6,6 0 0 1 6,-6 H114 a6,6 0 0 1 6,6 V55 H10 Z" fill="#0f5c8c"/><text x="18" y="49" font-size="10.2" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">1  Build</text><text x="18.0" y="70" font-size="9.2" fill="#1d2330" font-weight="normal" text-anchor="start">In Desktop:</text><text x="18.0" y="83" font-size="9.2" fill="#1d2330" font-weight="normal" text-anchor="start">Power Query,</text><text x="18.0" y="96" font-size="9.2" fill="#1d2330" font-weight="normal" text-anchor="start">model, DAX,</text><text x="18.0" y="109" font-size="9.2" fill="#1d2330" font-weight="normal" text-anchor="start">pages; test</text><text x="18.0" y="122" font-size="9.2" fill="#1d2330" font-weight="normal" text-anchor="start">with View as</text><path d="M121,87 L130,87" fill="none" stroke="#5b6475" stroke-width="1.4" stroke-linejoin="round"/><path d="M130,87 L124.6,89.6 L124.6,84.4 Z" fill="#5b6475"/><rect x="134" y="37" width="110" height="106" rx="6" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="132" y="34" width="110" height="106" rx="6" fill="#fff" stroke="#2f7d6d" stroke-width="1.4" /><path d="M132,40 a6,6 0 0 1 6,-6 H236 a6,6 0 0 1 6,6 V55 H132 Z" fill="#2f7d6d"/><text x="140" y="49" font-size="10.2" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">2  Publish</text><text x="140.0" y="70" font-size="9.2" fill="#1d2330" font-weight="normal" text-anchor="start">To a shared</text><text x="140.0" y="83" font-size="9.2" fill="#1d2330" font-weight="normal" text-anchor="start">workspace;</text><text x="140.0" y="96" font-size="9.2" fill="#1d2330" font-weight="normal" text-anchor="start">model and</text><text x="140.0" y="109" font-size="9.2" fill="#1d2330" font-weight="normal" text-anchor="start">report land in</text><text x="140.0" y="122" font-size="9.2" fill="#1d2330" font-weight="normal" text-anchor="start">the Service</text><path d="M243,87 L252,87" fill="none" stroke="#5b6475" stroke-width="1.4" stroke-linejoin="round"/><path d="M252,87 L246.6,89.6 L246.6,84.4 Z" fill="#5b6475"/><rect x="256" y="37" width="110" height="106" rx="6" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="254" y="34" width="110" height="106" rx="6" fill="#fff" stroke="#c0662b" stroke-width="1.4" /><path d="M254,40 a6,6 0 0 1 6,-6 H358 a6,6 0 0 1 6,6 V55 H254 Z" fill="#c0662b"/><text x="262" y="49" font-size="10.2" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">3  Refresh</text><text x="262.0" y="70" font-size="9.2" fill="#1d2330" font-weight="normal" text-anchor="start">Credentials,</text><text x="262.0" y="83" font-size="9.2" fill="#1d2330" font-weight="normal" text-anchor="start">a schedule</text><text x="262.0" y="96" font-size="9.2" fill="#1d2330" font-weight="normal" text-anchor="start">(8 a day Pro,</text><text x="262.0" y="109" font-size="9.2" fill="#1d2330" font-weight="normal" text-anchor="start">48 PPU); a</text><text x="262.0" y="122" font-size="9.2" fill="#1d2330" font-weight="normal" text-anchor="start">gateway if needed</text><path d="M365,87 L374,87" fill="none" stroke="#5b6475" stroke-width="1.4" stroke-linejoin="round"/><path d="M374,87 L368.6,89.6 L368.6,84.4 Z" fill="#5b6475"/><rect x="378" y="37" width="110" height="106" rx="6" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="376" y="34" width="110" height="106" rx="6" fill="#fff" stroke="#7a4fa0" stroke-width="1.4" /><path d="M376,40 a6,6 0 0 1 6,-6 H480 a6,6 0 0 1 6,6 V55 H376 Z" fill="#7a4fa0"/><text x="384" y="49" font-size="10.2" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">4  Secure</text><text x="384.0" y="70" font-size="9.2" fill="#1d2330" font-weight="normal" text-anchor="start">Roles in the</text><text x="384.0" y="83" font-size="9.2" fill="#1d2330" font-weight="normal" text-anchor="start">model; map</text><text x="384.0" y="96" font-size="9.2" fill="#1d2330" font-weight="normal" text-anchor="start">people to</text><text x="384.0" y="109" font-size="9.2" fill="#1d2330" font-weight="normal" text-anchor="start">roles; Test</text><text x="384.0" y="122" font-size="9.2" fill="#1d2330" font-weight="normal" text-anchor="start">as role</text><path d="M487,87 L496,87" fill="none" stroke="#5b6475" stroke-width="1.4" stroke-linejoin="round"/><path d="M496,87 L490.6,89.6 L490.6,84.4 Z" fill="#5b6475"/><rect x="500" y="37" width="110" height="106" rx="6" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="498" y="34" width="110" height="106" rx="6" fill="#fff" stroke="#b7791f" stroke-width="1.4" /><path d="M498,40 a6,6 0 0 1 6,-6 H602 a6,6 0 0 1 6,6 V55 H498 Z" fill="#b7791f"/><text x="506" y="49" font-size="10.2" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">5  Deliver</text><text x="506.0" y="70" font-size="9.2" fill="#1d2330" font-weight="normal" text-anchor="start">Publish an</text><text x="506.0" y="83" font-size="9.2" fill="#1d2330" font-weight="normal" text-anchor="start">app, or share</text><text x="506.0" y="96" font-size="9.2" fill="#1d2330" font-weight="normal" text-anchor="start">the report;</text><text x="506.0" y="109" font-size="9.2" fill="#1d2330" font-weight="normal" text-anchor="start">subscriptions,</text><text x="506.0" y="122" font-size="9.2" fill="#1d2330" font-weight="normal" text-anchor="start">usage metrics</text><rect x="10" y="156" width="600" height="86" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1" /><text x="22" y="174" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">What breaks most often</text><rect x="22" y="184" width="5" height="24" rx="0" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="34" y="194" font-size="9.8" fill="#1d2330" font-weight="bold" text-anchor="start">Refresh fails:</text><text x="34" y="206" font-size="9.2" fill="#5b6475" font-weight="normal" text-anchor="start">credentials or the gateway</text><rect x="318" y="184" width="5" height="24" rx="0" fill="#c0662b" stroke="none" stroke-width="1" /><text x="330" y="194" font-size="9.8" fill="#1d2330" font-weight="bold" text-anchor="start">Numbers differ:</text><text x="330" y="206" font-size="9.2" fill="#5b6475" font-weight="normal" text-anchor="start">filters, not DAX</text><rect x="22" y="212" width="5" height="24" rx="0" fill="#7a4fa0" stroke="none" stroke-width="1" /><text x="34" y="222" font-size="9.8" fill="#1d2330" font-weight="bold" text-anchor="start">Viewers can&#x27;t open it:</text><text x="34" y="234" font-size="9.2" fill="#5b6475" font-weight="normal" text-anchor="start">a licence is missing</text><rect x="318" y="212" width="5" height="24" rx="0" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="330" y="222" font-size="9.8" fill="#1d2330" font-weight="bold" text-anchor="start">The report is slow:</text><text x="330" y="234" font-size="9.2" fill="#5b6475" font-weight="normal" text-anchor="start">too many visuals</text></svg>