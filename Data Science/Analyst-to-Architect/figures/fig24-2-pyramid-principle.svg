<svg xmlns="http://www.w3.org/2000/svg" width="680" height="264" viewBox="0 0 680 264" font-family="DejaVu Sans, Arial, sans-serif"><rect width="680" height="264" fill="#ffffff"/><text x="10" y="18" font-size="12" fill="#5b6475" font-weight="bold" text-anchor="start">How the analysis was built</text><text x="10" y="33" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">(in the order it was done)</text><rect x="10" y="44" width="240" height="26" rx="4" fill="#fff" stroke="#c9d3df" stroke-width="1" /><text x="20" y="61" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">1  Pulled Nov and Dec order data</text><path d="M130,70 L130,78" fill="none" stroke="#5b6475" stroke-width="1.2" stroke-linejoin="round"/><path d="M130,78 L127.0,71.7 L133.0,71.7 Z" fill="#5b6475"/><rect x="10" y="78" width="240" height="26" rx="4" fill="#fff" stroke="#c9d3df" stroke-width="1" /><text x="20" y="95" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">2  Customers, orders per customer, AOV</text><path d="M130,104 L130,112" fill="none" stroke="#5b6475" stroke-width="1.2" stroke-linejoin="round"/><path d="M130,112 L127.0,105.7 L133.0,105.7 Z" fill="#5b6475"/><rect x="10" y="112" width="240" height="26" rx="4" fill="#fff" stroke="#c9d3df" stroke-width="1" /><text x="20" y="129" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">3  Ran the chain-linked decomposition</text><path d="M130,138 L130,146" fill="none" stroke="#5b6475" stroke-width="1.2" stroke-linejoin="round"/><path d="M130,146 L127.0,139.7 L133.0,139.7 Z" fill="#5b6475"/><rect x="10" y="146" width="240" height="26" rx="4" fill="#fff" stroke="#c9d3df" stroke-width="1" /><text x="20" y="163" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">4  Checked the segment mix</text><path d="M130,172 L130,180" fill="none" stroke="#5b6475" stroke-width="1.2" stroke-linejoin="round"/><path d="M130,180 L127.0,173.7 L133.0,173.7 Z" fill="#5b6475"/><rect x="10" y="180" width="240" height="26" rx="4" fill="#fff" stroke="#c9d3df" stroke-width="1" /><text x="20" y="197" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">5  Compared with the May → June dip</text><path d="M130,206 L130,214" fill="none" stroke="#5b6475" stroke-width="1.2" stroke-linejoin="round"/><path d="M130,214 L127.0,207.7 L133.0,207.7 Z" fill="#5b6475"/><rect x="10" y="214" width="240" height="26" rx="4" fill="#eef2f7" stroke="#0f5c8c" stroke-width="1.4" /><text x="20" y="231" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">6  Concluded: seasonal, no action</text><text x="130" y="258" font-size="10.5" fill="#b23b3b" font-weight="bold" text-anchor="middle">the answer arrives last</text><path d="M258,150 L286,150" fill="none" stroke="#0f5c8c" stroke-width="2" stroke-linejoin="round"/><path d="M286,150 L279.7,153.0 L279.7,147.0 Z" fill="#0f5c8c"/><text x="296" y="18" font-size="12" fill="#5b6475" font-weight="bold" text-anchor="start">How it&#x27;s told to Vikram Singh</text><text x="296" y="33" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">(top-down: the answer first)</text><polygon points="384.0,46 384.0,46 418.7,108 349.3,108" fill="#0f5c8c" stroke="#fff" stroke-width="2"/><text x="384" y="98" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle">Answer</text><path d="M405.3,77.0 H498" fill="none" stroke="#c9d3df" stroke-width="1" stroke-linejoin="round"/><text x="502" y="66.0" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">December&#x27;s fall is</text><text x="502" y="81.0" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">seasonal. No action</text><text x="502" y="96.0" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">needed.</text><polygon points="349.3,108 418.7,108 453.3,170 314.7,170" fill="#2f7d6d" stroke="#fff" stroke-width="2"/><text x="384" y="160" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle">Reasons</text><path d="M440.0,139.0 H498" fill="none" stroke="#c9d3df" stroke-width="1" stroke-linejoin="round"/><text x="502" y="128.0" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">AOV drove two-thirds of it;</text><text x="502" y="143.0" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">the mix didn&#x27;t shift; same</text><text x="502" y="158.0" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">shape as May → June.</text><polygon points="314.7,170 453.3,170 488.0,232 280.0,232" fill="#dfe5ec" stroke="#fff" stroke-width="2"/><text x="384" y="222" font-size="10" fill="#1d2330" font-weight="bold" text-anchor="middle">Detail</text><path d="M474.7,201.0 H498" fill="none" stroke="#c9d3df" stroke-width="1" stroke-linejoin="round"/><text x="502" y="197.5" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">The decomposition, the</text><text x="502" y="212.5" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">segment table, the appendix.</text><text x="296" y="254" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">A reader who stops after the top tier still has the answer.</text></svg>