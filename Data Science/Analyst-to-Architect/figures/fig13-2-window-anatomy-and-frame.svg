<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="420" viewBox="0 0 1050 420" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1050" height="420" fill="#ffffff"/><rect x="30" y="60" width="112.0" height="38" rx="6" fill="#fff" stroke="#0f5c8c" stroke-width="2" /><text x="86.0" y="84" font-size="13" fill="#0f5c8c" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">AVG(revenue)</text><path d="M86.0,98 V122" fill="none" stroke="#0f5c8c" stroke-width="1.5" stroke-linejoin="round"/><rect x="150.0" y="60" width="64.0" height="38" rx="6" fill="#fff" stroke="#5b6475" stroke-width="2" /><text x="182.0" y="84" font-size="13" fill="#5b6475" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">OVER (</text><rect x="222.0" y="60" width="184.0" height="38" rx="6" fill="#fff" stroke="#7a4fa0" stroke-width="2" /><text x="314.0" y="84" font-size="13" fill="#7a4fa0" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">PARTITION BY category</text><path d="M314.0,98 V122" fill="none" stroke="#7a4fa0" stroke-width="1.5" stroke-linejoin="round"/><rect x="414.0" y="60" width="128.0" height="38" rx="6" fill="#fff" stroke="#c0662b" stroke-width="2" /><text x="478.0" y="84" font-size="13" fill="#c0662b" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">ORDER BY month</text><path d="M478.0,98 V122" fill="none" stroke="#c0662b" stroke-width="1.5" stroke-linejoin="round"/><rect x="550.0" y="60" width="336.0" height="38" rx="6" fill="#fff" stroke="#2f7d6d" stroke-width="2" /><text x="718.0" y="84" font-size="13" fill="#2f7d6d" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">ROWS BETWEEN 2 PRECEDING AND CURRENT ROW</text><path d="M718.0,98 V122" fill="none" stroke="#2f7d6d" stroke-width="1.5" stroke-linejoin="round"/><rect x="894.0" y="60" width="24.0" height="38" rx="6" fill="#fff" stroke="#5b6475" stroke-width="2" /><text x="906.0" y="84" font-size="13" fill="#5b6475" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">)</text><text x="86.0" y="142" font-size="12" fill="#0f5c8c" font-weight="bold" text-anchor="middle">1  What to calculate</text><text x="314.0" y="142" font-size="12" fill="#7a4fa0" font-weight="bold" text-anchor="middle">2  Restart for each group (optional)</text><text x="478.0" y="166" font-size="12" fill="#c0662b" font-weight="bold" text-anchor="middle">3  The order of rows inside each group</text><text x="718.0" y="142" font-size="12" fill="#2f7d6d" font-weight="bold" text-anchor="middle">4  Which rows count: the frame (optional)</text><text x="30" y="210" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">The frame slides down the rows. For April, the 3-month window is February, March and April:</text><rect x="30" y="230" width="300" height="28" rx="3" fill="#fff" stroke="#c9d3df" stroke-width="0.8" /><text x="44" y="249" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Jan 2025</text><text x="316" y="249" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">202,640</text><rect x="30" y="260" width="300" height="28" rx="3" fill="#e2f3ee" stroke="#2f7d6d" stroke-width="1.8" /><text x="44" y="279" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Feb 2025</text><text x="316" y="279" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">253,664</text><text x="342" y="279" font-size="12" fill="#2f7d6d" font-weight="normal" text-anchor="start">◄ 2 PRECEDING</text><rect x="30" y="290" width="300" height="28" rx="3" fill="#e2f3ee" stroke="#2f7d6d" stroke-width="1.8" /><text x="44" y="309" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Mar 2025</text><text x="316" y="309" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">278,008</text><rect x="30" y="320" width="300" height="28" rx="3" fill="#e2f3ee" stroke="#2f7d6d" stroke-width="1.8" /><text x="44" y="339" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Apr 2025</text><text x="316" y="339" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="end" font-family="DejaVu Sans Mono, monospace">210,282</text><text x="342" y="339" font-size="12" fill="#2f7d6d" font-weight="bold" text-anchor="start">◄ CURRENT ROW</text><rect x="30" y="350" width="300" height="28" rx="3" fill="#fff" stroke="#c9d3df" stroke-width="0.8" /><text x="44" y="369" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">May 2025</text><text x="316" y="369" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">329,359</text><rect x="30" y="380" width="300" height="28" rx="3" fill="#fff" stroke="#c9d3df" stroke-width="0.8" /><text x="44" y="399" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Jun 2025</text><text x="316" y="399" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">186,928</text><rect x="480" y="262" width="470" height="92" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="496" y="290" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">moving_avg_3m for April</text><text x="496" y="314" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">(253,664 + 278,008 + 210,282) ÷ 3 = 247,318</text><text x="496" y="338" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start">In May, the frame moves on: March, April, May.</text></svg>