e="#c9d3df" stroke-width="0.8" /><text x="30" y="308" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">May 2025</text><text x="230" y="308" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">3,29,359</text><rect x="20" y="316" width="220" height="22" rx="3" fill="#fff" stroke="#c9d3df" stroke-width="0.8" /><text x="30" y="332" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Jun 2025</text><text x="230" y="332" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">1,86,928</text><path d="M352,220 h8 V290 h-8" fill="none" stroke="#2f7d6d" stroke-width="1.6" stroke-linejoin="round"/><text x="366" y="259.0" font-size="11" fill="#2f7d6d" font-weight="bold" text-anchor="start">frame: 3 rows</text><rect x="470" y="202" width="230" height="118" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="482" y="224" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="start">moving_avg_3m for April</text><text x="482" y="246" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">(2,53,664 + 2,78,008</text><text x="489" y="264" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">+ 2,10,282) ÷ 3</text><text x="482" y="282" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">= 2,47,318</text><text x="482" y="306" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">In May, the frame moves on.</text></svg>