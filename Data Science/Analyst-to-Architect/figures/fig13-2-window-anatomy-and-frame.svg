<svg xmlns="http://www.w3.org/2000/svg" width="720" height="382" viewBox="0 0 720 382" font-family="DejaVu Sans, Arial, sans-serif"><rect width="720" height="382" fill="#ffffff"/><rect x="20" y="14" width="680" height="148" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="34" y="36" font-size="11.5" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">AVG(revenue) OVER (</text><text x="380" y="36" font-size="11" fill="#0f5c8c" font-weight="bold" text-anchor="start">1  What to calculate (always required)</text><text x="34" y="58" font-size="11.5" fill="#7a4fa0" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">    PARTITION BY category</text><text x="380" y="58" font-size="11" fill="#7a4fa0" font-weight="bold" text-anchor="start">2  Restart for each group (optional)</text><text x="34" y="80" font-size="11.5" fill="#c0662b" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">    ORDER BY month</text><text x="380" y="80" font-size="11" fill="#c0662b" font-weight="bold" text-anchor="start">3  The order of rows in each group (needed by</text><text x="380" y="102" font-size="11" fill="#c0662b" font-weight="normal" text-anchor="start">    RANK, ROW_NUMBER, LAG and LEAD; optional for SUM, AVG)</text><text x="34" y="124" font-size="11.5" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">    ROWS BETWEEN 2 PRECEDING AND CURRENT ROW</text><text x="380" y="124" font-size="11" fill="#2f7d6d" font-weight="bold" text-anchor="start">4  Which rows count: the frame (optional)</text><text x="34" y="146" font-size="11.5" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">)</text><text x="20" y="196" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="start">The frame slides down the rows. For April, the 3-month window is February, March and April:</text><rect x="20" y="210" width="220" height="24" rx="3" fill="#fff" stroke="#c9d3df" stroke-width="0.8" /><text x="30" y="227" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Jan 2025</text><text x="230" y="227" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">2,02,640</text><rect x="20" y="236" width="220" height="24" rx="3" fill="#e2f3ee" stroke="#2f7d6d" stroke-width="1.8" /><text x="30" y="253" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Feb 2025</text><text x="230" y="253" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">2,53,664</text><text x="250" y="253" font-size="11" fill="#2f7d6d" font-weight="normal" text-anchor="start">◄ 2 PRECEDING</text><rect x="20" y="262" width="220" height="24" rx="3" fill="#e2f3ee" stroke="#2f7d6d" stroke-width="1.8" /><text x="30" y="279" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Mar 2025</text><text x="230" y="279" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">2,78,008</text><text x="250" y="279" font-size="11" fill="#2f7d6d" font-weight="normal" text-anchor="start">◄ 1 PRECEDING</text><rect x="20" y="288" width="220" height="24" rx="3" fill="#e2f3ee" stroke="#2f7d6d" stroke-width="1.8" /><text x="30" y="305" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Apr 2025</text><text x="230" y="305" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="end" font-family="DejaVu Sans Mono, monospace">2,10,282</text><text x="250" y="305" font-size="11" fill="#2f7d6d" font-weight="bold" text-anchor="start">◄ CURRENT ROW</text><rect x="20" y="314" width="220" height="24" rx="3" fill="#fff" stroke="#c9d3df" stroke-width="0.8" /><text x="30" y="331" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">May 2025</text><text x="230" y="331" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">3,29,359</text><rect x="20" y="340" width="220" height="24" rx="3" fill="#fff" stroke="#c9d3df" stroke-width="0.8" /><text x="30" y="357" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Jun 2025</text><text x="230" y="357" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">1,86,928</text><path d="M352,236 h8 V312 h-8" fill="none" stroke="#2f7d6d" stroke-width="1.6" stroke-linejoin="round"/><text x="366" y="278.0" font-size="11" fill="#2f7d6d" font-weight="bold" text-anchor="start">frame: 3 rows</text><rect x="470" y="218" width="230" height="118" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="482" y="240" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="start">moving_avg_3m for April</text><text x="482" y="262" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">(2,53,664 + 2,78,008</text><text x="482" y="280" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace"> + 2,10,282) ÷ 3</text><text x="482" y="298" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">= 2,47,318</text><text x="482" y="322" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">In May, the frame moves on.</text></svg>