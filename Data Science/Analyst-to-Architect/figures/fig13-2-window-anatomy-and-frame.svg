<svg xmlns="http://www.w3.org/2000/svg" width="720" height="352" viewBox="0 0 720 352" font-family="DejaVu Sans, Arial, sans-serif"><rect width="720" height="352" fill="#ffffff"/><rect x="20" y="14" width="680" height="142" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="34.0" y="36" font-size="11.5" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">AVG(revenue) OVER (</text><text x="356" y="36" font-size="11" fill="#0f5c8c" font-weight="bold" text-anchor="start">1  What to calculate (always required)</text><text x="61.692" y="58" font-size="11.5" fill="#7a4fa0" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">PARTITION BY category</text><text x="356" y="58" font-size="11" fill="#7a4fa0" font-weight="bold" text-anchor="start">2  Restart for each group (optional)</text><text x="61.692" y="80" font-size="11.5" fill="#c0662b" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">ORDER BY month</text><text x="356" y="80" font-size="11" fill="#c0662b" font-weight="bold" text-anchor="start">3  The order of rows in each group: needed by</text><text x="377" y="96" font-size="11" fill="#c0662b" font-weight="normal" text-anchor="start">RANK, LAG and LEAD; optional for SUM and AVG</text><text x="61.692" y="118" font-size="11.5" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">ROWS BETWEEN 2 PRECEDING AND CURRENT ROW</text><text x="356" y="118" font-size="11" fill="#2f7d6d" font-weight="bold" text-anchor="start">4  Which rows count: the frame (optional)</text><text x="34.0" y="140" font-size="11.5" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">)</text><text x="20" y="184" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="start">The frame slides down the rows. For April, the 3-month window is February, March and April:</text><rect x="20" y="196" wi