<svg xmlns="http://www.w3.org/2000/svg" width="960" height="364" viewBox="0 0 960 364" font-family="DejaVu Sans, Arial, sans-serif"><rect width="960" height="364" fill="#ffffff"/><text x="30" y="30" font-size="14.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">An architecture decision record, filled in</text><rect x="30" y="58" width="900" height="520" rx="8" fill="#fff" stroke="#c9d3df" stroke-width="1.4" /><text x="46" y="80" font-size="10.8" fill="#0f5c8c" font-weight="bold" text-anchor="start">ADR-014</text><text x="220" y="80" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="start">Table format for the sensor archive</text><text x="46" y="104" font-size="10.8" fill="#5b6475" font-weight="bold" text-anchor="start">Status</text><text x="220" y="104" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="start">Accepted, 18 Sep 2026</text><text x="46" y="128" font-size="10.8" fill="#1d2330" font-weight="bold" text-anchor="start">Context</text><text x="220" y="128" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="start">The Taloja sensor archive is 19.8M+ rows and growing daily. A six-week correction to machine</text><text x="220" y="144" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="start">M-07&#x27;s readings failed mid-run under plain Parquet files, leaving the archive in a partly-</text><text x="220" y="160" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="start">corrected, unrecoverable state for two days.</text><text x="46" y="184" font-size="10.8" fill="#1d2330" font-weight="bold" text-anchor="start">Decision</text><text x="220" y="184" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="start">Store the sensor archive as a Delta Lake table (delta-rs), not plain Parquet files.</text><text x="46" y="208" font-size="10.8" fill="#1d2330" font-weight="bold" text-anchor="start">Alternatives considered</text><text x="220" y="208" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="start">(1) Plain Parquet with manual versioning by folder name — rejected: exactly what failed. (2)</text><text x="220" y="224" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="start">Apache Iceberg — comparable guarantees, rejected only because the team has no existing Java/Spark</text><text x="220" y="240" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="start">operational experience. (3) Keep it in Postgres — rejected: cost and query performance at this row</text><text x="220" y="256" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="start">count.</text><text x="46" y="280" font-size="10.8" fill="#1d2330" font-weight="bold" text-anchor="start">Consequences</text><text x="220" y="280" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="start">Atomic overwrites and time travel (Ch49); one more format for the team to operate; the `deltalake`</text><text x="220" y="296" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="start">Python package must be pinned and tested on version upgrades.</text><text x="46" y="320" font-size="10.8" fill="#5b6475" font-weight="bold" text-anchor="start">Owner</text><text x="220" y="320" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="start">Data platform team. Revisit if Iceberg adoption becomes a company standard.</text></svg>