<svg xmlns="http://www.w3.org/2000/svg" width="640" height="384" viewBox="0 0 640 384" font-family="DejaVu Sans, Arial, sans-serif"><rect width="640" height="384" fill="#ffffff"/><text x="12" y="22" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">How to read a traceback: start at the bottom</text><rect x="34" y="40" width="594" height="166" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1" /><text x="42.0" y="56" font-size="9.4" fill="#1d2330" font-weight="normal" font-family="DejaVu Sans Mono, monospace">Traceback (most recent call last):</text><circle cx="20" cy="52.5" r="7.5" fill="#5b6475"/><text x="20" y="56.1" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle">4</text><text x="53.3" y="71" font-size="9.4" fill="#1d2330" font-weight="normal" font-family="DejaVu Sans Mono, monospace">File &quot;/home/meera/analyst-to-architect/work/ch17/summarize_exports.py&quot;, line 51, in &lt;module&gt;</text><text x="64.6" y="86" font-size="9.4" fill="#1d2330" font-weight="normal" font-family="DejaVu Sans Mono, monospace">raise SystemExit(main(folder))</text><text x="160.9" y="101" font-size="9.4" fill="#1d2330" font-weight="normal" font-family="DejaVu Sans Mono, monospace">~~~~^^^^^^^^</text><text x="53.3" y="116" font-size="9.4" fill="#1d2330" font-weight="normal" font-family="DejaVu Sans Mono, monospace">File &quot;/home/meera/analyst-to-architect/work/ch17/summarize_exports.py&quot;, line 42, in main</text><text x="64.6" y="131" font-size="9.4" fill="#1d2330" font-weight="normal" font-family="DejaVu Sans Mono, monospace">s = summarize(path)</text><text x="53.3" y="146" font-size="9.4" fill="#1d2330" font-weight="normal" font-family="DejaVu Sans Mono, monospace">File &quot;/home/meera/analyst-to-architect/work/ch17/summarize_exports.py&quot;, line 23, in summarize</text><circle cx="20" cy="142.5" r="7.5" fill="#0f5c8c"/><text x="20" y="146.1" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle">3</text><text x="64.6" y="161" font-size="9.4" fill="#1d2330" font-weight="normal" font-family="DejaVu Sans Mono, monospace">values.append(float(row[&quot;net_revenue&quot;]))</text><circle cx="20" cy="157.5" r="7.5" fill="#c0662b"/><text x="20" y="161.1" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle">2</text><text x="143.9" y="176" font-size="9.4" fill="#1d2330" font-weight="normal" font-family="DejaVu Sans Mono, monospace">~~~~~^^^^^^^^^^^^^^^^^^^^</text><text x="42.0" y="191" font-size="9.4" fill="#b23b3b" font-weight="bold" font-family="DejaVu Sans Mono, monospace">ValueError: could not convert string to float: &#x27;&#x27;</text><circle cx="20" cy="187.5" r="7.5" fill="#b23b3b"/><text x="20" y="191.1" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle">1</text><circle cx="20" cy="228.5" r="7.5" fill="#b23b3b"/><text x="20" y="232.1" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle">1</text><text x="34" y="232" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">What went wrong: the error type and its message. Read this line first.</text><circle cx="20" cy="247.5" r="7.5" fill="#c0662b"/><text x="20" y="251.1" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle">2</text><text x="34" y="251" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">The line of code that failed, with ~~^^ marks under the part that raised the error.</text><circle cx="20" cy="266.5" r="7.5" fill="#0f5c8c"/><text x="20" y="270.1" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle">3</text><text x="34" y="270" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">Where that line is: the file, the line number, and the function it is in.</text><circle cx="20" cy="285.5" r="7.5" fill="#5b6475"/><text x="20" y="289.1" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle">4</text><text x="34" y="289" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">The chain of calls that led there, oldest at the top. Read it only if you need to.</text><rect x="12" y="314" width="616" height="62" rx="6" fill="#fff" stroke="#2f7d6d" stroke-width="1.4" /><rect x="12" y="314" width="6" height="62" rx="0" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="28" y="332" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">What it tells you here:</text><text x="28" y="349" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">a blank net_revenue in a CSV file reached float(). The fix is to convert defensively and</text><text x="28" y="365" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">count what failed (see “Handling errors on purpose”, below).</text></svg>