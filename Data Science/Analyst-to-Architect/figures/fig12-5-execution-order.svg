<svg xmlns="http://www.w3.org/2000/svg" width="640" height="330" viewBox="0 0 640 330" font-family="DejaVu Sans, Arial, sans-serif"><rect width="640" height="330" fill="#ffffff"/><text x="20" y="22" font-size="13" fill="#5b6475" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">You write it in this order</text><rect x="20" y="32" width="70" height="26" rx="13" fill="#eef2f6" stroke="#c9d3df" stroke-width="1" /><text x="55.0" y="49.5" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">SELECT</text><rect x="95" y="32" width="70" height="26" rx="13" fill="#eef2f6" stroke="#c9d3df" stroke-width="1" /><text x="130.0" y="49.5" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">FROM</text><rect x="170" y="32" width="70" height="26" rx="13" fill="#eef2f6" stroke="#c9d3df" stroke-width="1" /><text x="205.0" y="49.5" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">JOIN</text><rect x="245" y="32" width="70" height="26" rx="13" fill="#eef2f6" stroke="#c9d3df" stroke-width="1" /><text x="280.0" y="49.5" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">WHERE</text><rect x="320" y="32" width="70" height="26" rx="13" fill="#eef2f6" stroke="#c9d3df" stroke-width="1" /><text x="355.0" y="49.5" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">GROUP BY</text><rect x="395" y="32" width="70" height="26" rx="13" fill="#eef2f6" stroke="#c9d3df" stroke-width="1" /><text x="430.0" y="49.5" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">HAVING</text><rect x="470" y="32" width="70" height="26" rx="13" fill="#eef2f6" stroke="#c9d3df" stroke-width="1" /><text x="505.0" y="49.5" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">ORDER BY</text><rect x="545" y="32" width="70" height="26" rx="13" fill="#eef2f6" stroke="#c9d3df" stroke-width="1" /><text x="580.0" y="49.5" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">LIMIT</text><text x="20" y="90" font-size="13" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The database runs it in this order</text><rect x="20" y="108" width="134" height="66" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.5" /><circle cx="34" cy="123" r="10" fill="#0f5c8c"/><text x="34" y="127" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="middle">1</text><text x="50" y="127.5" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">FROM / JOIN</text><text x="30" y="147" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">gather and combine</text><text x="30" y="161" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">tables</text><path d="M156,141.0 H169" fill="none" stroke="#0f5c8c" stroke-width="2" stroke-linejoin="round"/><path d="M169,136.0 l6,5 l-6,5 z" fill="#0f5c8c"/><rect x="175" y="108" width="134" height="66" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.5" /><circle cx="189" cy="123" r="10" fill="#0f5c8c"/><text x="189" y="127" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="middle">2</text><text x="205" y="127.5" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">WHERE</text><text x="185" y="147" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">drop rows</text><path d="M311,141.0 H324" fill="none" stroke="#0f5c8c" stroke-width="2" stroke-linejoin="round"/><path d="M324,136.0 l6,5 l-6,5 z" fill="#0f5c8c"/><rect x="330" y="108" width="134" height="66" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.5" /><circle cx="344" cy="123" r="10" fill="#0f5c8c"/><text x="344" y="127" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="middle">3</text><text x="360" y="127.5" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">GROUP BY</text><text x="340" y="147" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">make groups</text><path d="M466,141.0 H479" fill="none" stroke="#0f5c8c" stroke-width="2" stroke-linejoin="round"/><path d="M479,136.0 l6,5 l-6,5 z" fill="#0f5c8c"/><rect x="485" y="108" width="134" height="66" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.5" /><circle cx="499" cy="123" r="10" fill="#0f5c8c"/><text x="499" y="127" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="middle">4</text><text x="515" y="127.5" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">HAVING</text><text x="495" y="147" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">drop groups</text><path d="M552.0,176 V191 H87.0 V202" fill="none" stroke="#0f5c8c" stroke-width="2" stroke-linejoin="round"/><path d="M82.0,202 l5,6 l5,-6 z" fill="#0f5c8c"/><rect x="20" y="208" width="134" height="66" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.5" /><circle cx="34" cy="223" r="10" fill="#0f5c8c"/><text x="34" y="227" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="middle">5</text><text x="50" y="227.5" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">SELECT</text><text x="30" y="247" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">compute columns and</text><text x="30" y="261" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">aliases</text><path d="M156,241.0 H169" fill="none" stroke="#0f5c8c" stroke-width="2" stroke-linejoin="round"/><path d="M169,236.0 l6,5 l-6,5 z" fill="#0f5c8c"/><rect x="175" y="208" width="134" height="66" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.5" /><circle cx="189" cy="223" r="10" fill="#0f5c8c"/><text x="189" y="227" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="middle">6</text><text x="205" y="227.5" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">DISTINCT</text><text x="185" y="247" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">remove duplicate</text><text x="185" y="261" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">rows</text><path d="M311,241.0 H324" fill="none" stroke="#0f5c8c" stroke-width="2" stroke-linejoin="round"/><path d="M324,236.0 l6,5 l-6,5 z" fill="#0f5c8c"/><rect x="330" y="208" width="134" height="66" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.5" /><circle cx="344" cy="223" r="10" fill="#0f5c8c"/><text x="344" y="227" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="middle">7</text><text x="360" y="227.5" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">ORDER BY</text><text x="340" y="247" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">sort (aliases exist</text><text x="340" y="261" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">now)</text><path d="M466,241.0 H479" fill="none" stroke="#0f5c8c" stroke-width="2" stroke-linejoin="round"/><path d="M479,236.0 l6,5 l-6,5 z" fill="#0f5c8c"/><rect x="485" y="208" width="134" height="66" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.5" /><circle cx="499" cy="223" r="10" fill="#0f5c8c"/><text x="499" y="227" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="middle">8</text><text x="515" y="227.5" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">LIMIT</text><text x="495" y="247" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">keep the first n</text><rect x="20" y="270" width="600" height="48" rx="5" fill="#fff4d6" stroke="#e2c46b" stroke-width="1" /><text x="30" y="289" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">This is why WHERE can&#x27;t use COUNT(*) or a SELECT alias (step 2 runs before</text><text x="30" y="306" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">steps 3 and 5), and why ORDER BY can use an alias (step 7 runs after step 5).</text></svg>