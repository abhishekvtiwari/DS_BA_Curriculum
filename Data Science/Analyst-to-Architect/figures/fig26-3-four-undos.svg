<svg xmlns="http://www.w3.org/2000/svg" width="700" height="546" viewBox="0 0 700 546" font-family="DejaVu Sans, Arial, sans-serif"><rect width="700" height="546" fill="#ffffff"/><text x="20" y="28" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Four things go wrong. Ask where the change is before asking how to undo it.</text><text x="20" y="50" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Choosing between these is the whole skill. Typing them is not.</text><rect x="22" y="69" width="324" height="196" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="20" y="66" width="324" height="196" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><path d="M20,74 a8,8 0 0 1 8,-8 H336 a8,8 0 0 1 8,8 V96 H20 Z" fill="#0f5c8c"/><text x="30" y="86" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">1.  You edited a file</text><text x="32" y="118" font-size="10.5" fill="#5b6475" font-weight="bold" text-anchor="start">Where is the change?</text><text x="32" y="136" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">The change is in the working directory only.</text><text x="32" y="152" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Nothing staged, nothing committed.</text><rect x="32" y="176" width="300" height="28" rx="5" fill="#f6f9fc" stroke="#0f5c8c" stroke-width="1.2" /><text x="42" y="195" font-size="11.5" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">git restore &lt;file&gt;</text><text x="32" y="224" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">Destructive: the edit was never recorded, so it is</text><text x="32" y="240" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">gone. Run git diff first.</text><rect x="358" y="69" width="324" height="196" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="356" y="66" width="324" height="196" rx="8" fill="#fff" stroke="#c0662b" stroke-width="1.6" /><path d="M356,74 a8,8 0 0 1 8,-8 H672 a8,8 0 0 1 8,8 V96 H356 Z" fill="#c0662b"/><text x="366" y="86" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">2.  You staged the wrong thing</text><text x="368" y="118" font-size="10.5" fill="#5b6475" font-weight="bold" text-anchor="start">Where is the change?</text><text x="368" y="136" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">The change is staged. The file on disk is</text><text x="368" y="152" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">untouched.</text><rect x="368" y="176" width="300" height="28" rx="5" fill="#f6f9fc" stroke="#c0662b" stroke-width="1.2" /><text x="378" y="195" font-size="11.5" fill="#c0662b" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">git restore --staged &lt;file&gt;</text><text x="368" y="224" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">Safe. It only takes the file out of the next commit.</text><rect x="22" y="277" width="324" height="196" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="20" y="274" width="324" height="196" rx="8" fill="#fff" stroke="#7a4fa0" stroke-width="1.6" /><path d="M20,282 a8,8 0 0 1 8,-8 H336 a8,8 0 0 1 8,8 V304 H20 Z" fill="#7a4fa0"/><text x="30" y="294" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">3.  The last commit is wrong</text><text x="32" y="326" font-size="10.5" fill="#5b6475" font-weight="bold" text-anchor="start">Where is the change?</text><text x="32" y="344" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">It is in the history, but you have not pushed it.</text><rect x="32" y="384" width="300" height="28" rx="5" fill="#f6f9fc" stroke="#7a4fa0" stroke-width="1.2" /><text x="42" y="403" font-size="11.5" fill="#7a4fa0" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">git commit --amend</text><text x="32" y="432" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">Safe while private. Never amend a commit others have</text><text x="32" y="448" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">pulled.</text><rect x="358" y="277" width="324" height="196" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="356" y="274" width="324" height="196" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><path d="M356,282 a8,8 0 0 1 8,-8 H672 a8,8 0 0 1 8,8 V304 H356 Z" fill="#2f7d6d"/><text x="366" y="294" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">4.  A shared commit is wrong</text><text x="368" y="326" font-size="10.5" fill="#5b6475" font-weight="bold" text-anchor="start">Where is the change?</text><text x="368" y="344" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">It is in the history and other people already have</text><text x="368" y="360" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">it.</text><rect x="368" y="384" width="300" height="28" rx="5" fill="#f6f9fc" stroke="#2f7d6d" stroke-width="1.2" /><text x="378" y="403" font-size="11.5" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">git revert &lt;hash&gt;</text><text x="368" y="432" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">Adds a new commit that undoes it. History is never</text><text x="368" y="448" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">rewritten.</text><path d="M20,490 H680" fill="none" stroke="#c9d3df" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="4 4"/><text x="20" y="514" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">git reset --hard</text><text x="140" y="514" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start">is not on this list on purpose. It is the command that loses work,</text><text x="20" y="533" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start">and the four above cover almost everything you will meet in your first two years.</text></svg>