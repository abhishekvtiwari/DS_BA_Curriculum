<svg xmlns="http://www.w3.org/2000/svg" width="680" height="306" viewBox="0 0 680 306" font-family="DejaVu Sans, Arial, sans-serif"><rect width="680" height="306" fill="#ffffff"/><text x="20" y="24" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The first automation audit: 24 automations, five categories</text><rect x="20" y="40" width="640" height="24" rx="4" fill="#1d2330" stroke="none" stroke-width="1" /><text x="28" y="56" font-size="11" fill="#fff" font-weight="bold" text-anchor="start">Category</text><text x="214" y="56" font-size="11" fill="#fff" font-weight="bold" text-anchor="end">Count</text><text x="234" y="56" font-size="11" fill="#fff" font-weight="bold" text-anchor="start">Action</text><text x="346" y="56" font-size="11" fill="#fff" font-weight="bold" text-anchor="start">Examples</text><rect x="20" y="64" width="640" height="54" rx="0" fill="#fff" stroke="none" stroke-width="1" /><rect x="20" y="64" width="5" height="54" rx="0" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="30" y="81" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">Documented, owned,</text><text x="30" y="95" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">monitored</text><text x="214" y="81" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="end">6</text><text x="234" y="81" font-size="10.5" fill="#2f7d6d" font-weight="bold" text-anchor="start">Keep: the</text><text x="234" y="95" font-size="10.5" fill="#2f7d6d" font-weight="bold" text-anchor="start">model to copy</text><text x="346" y="81" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">Flash (Ch 20), Dagster pipeline (Ch 46), CRM syncs (Ch</text><text x="346" y="95" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">51), support assistant (Ch 55), defect model (Ch 56), PO</text><text x="346" y="109" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">intake (Ch 58)</text><rect x="20" y="118" width="640" height="40" rx="0" fill="#f6f9fc" stroke="none" stroke-width="1" /><rect x="20" y="118" width="5" height="40" rx="0" fill="#b7791f" stroke="none" stroke-width="1" /><text x="30" y="135" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">Working, but no owner</text><text x="30" y="149" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">on record</text><text x="214" y="135" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="end">11</text><text x="234" y="135" font-size="10.5" fill="#b7791f" font-weight="bold" text-anchor="start">Urgent: name</text><text x="234" y="149" font-size="10.5" fill="#b7791f" font-weight="bold" text-anchor="start">an owner</text><text x="346" y="135" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">Branch macros, personal Apps Script projects, a Power</text><text x="346" y="149" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">Automate flow nobody remembers building</text><rect x="20" y="158" width="640" height="40" rx="0" fill="#fff" stroke="none" stroke-width="1" /><rect x="20" y="158" width="5" height="40" rx="0" fill="#c0662b" stroke="none" stroke-width="1" /><text x="30" y="175" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">Duplicated logic,</text><text x="30" y="189" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">disagreeing outputs</text><text x="214" y="175" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="end">4</text><text x="234" y="175" font-size="10.5" fill="#c0662b" font-weight="bold" text-anchor="start">Merge each pair</text><text x="346" y="175" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">Two pairs: Delhi and Kolkata consolidation macros;</text><text x="346" y="189" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">Bengaluru and Mumbai HO stock-report reformatters</text><rect x="20" y="198" width="640" height="40" rx="0" fill="#f6f9fc" stroke="none" stroke-width="1" /><rect x="20" y="198" width="5" height="40" rx="0" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="30" y="215" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">Business-critical,</text><text x="30" y="229" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">single point of failure</text><text x="214" y="215" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="end">1</text><text x="234" y="215" font-size="10.5" fill="#b23b3b" font-weight="bold" text-anchor="start">Confirm the fix</text><text x="234" y="229" font-size="10.5" fill="#b23b3b" font-weight="bold" text-anchor="start">held</text><text x="346" y="215" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">MASTER_FINAL_v7 (Ch 19): rewritten and owned since Ch</text><text x="346" y="229" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">19; the audit confirmed its checks still run</text><rect x="20" y="238" width="640" height="40" rx="0" fill="#fff" stroke="none" stroke-width="1" /><rect x="20" y="238" width="5" height="40" rx="0" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="30" y="255" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">Actively broken,</text><text x="30" y="269" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">nobody had noticed</text><text x="214" y="255" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="end">2</text><text x="234" y="255" font-size="10.5" fill="#b23b3b" font-weight="bold" text-anchor="start">Fix now</text><text x="346" y="255" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">An Apps Script trigger that stopped firing five months</text><text x="346" y="269" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">earlier; a macro saving to a moved folder</text><path d="M20,278 H660" fill="none" stroke="#c9d3df" stroke-width="1" stroke-linejoin="round"/><text x="30" y="295" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">Total</text><text x="214" y="295" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="end">24</text><text x="234" y="295" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">17 had no owner, no monitoring and no written failure plan</text></svg>