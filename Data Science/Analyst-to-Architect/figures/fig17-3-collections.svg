<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" font-family="DejaVu Sans, Arial, sans-serif"><rect width="640" height="300" fill="#ffffff"/><text x="12" y="22" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Which collection should I use?</text><text x="24" y="44" font-size="9.6" fill="#5b6475" font-weight="bold" text-anchor="start">Collection</text><text x="112" y="44" font-size="9.6" fill="#5b6475" font-weight="bold" text-anchor="start">What it is, and a Riverstone example</text><text x="400" y="44" font-size="9.6" fill="#5b6475" font-weight="bold" text-anchor="start">Typical operations</text><rect x="12" y="54" width="616" height="40" rx="5" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="12" y="54" width="6" height="40" rx="0" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="24" y="79" font-size="11" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">list</text><text x="112" y="71" font-size="10" fill="#1d2330" font-weight="bold" text-anchor="start">Ordered, changeable</text><text x="112" y="86" font-size="9.6" fill="#5b6475" font-weight="normal" text-anchor="start">order lines in a file; the months of a year</text><text x="400" y="79" font-size="9.4" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">values[0] · append() · sorted()</text><rect x="12" y="102" width="616" height="40" rx="5" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="12" y="102" width="6" height="40" rx="0" fill="#8a5a12" stroke="none" stroke-width="1" /><text x="24" y="127" font-size="11" fill="#8a5a12" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">tuple</text><text x="112" y="119" font-size="10" fill="#1d2330" font-weight="bold" text-anchor="start">Fixed, unchangeable</text><text x="112" y="134" font-size="9.6" fill="#5b6475" font-weight="normal" text-anchor="start">(city, region); what a function returns</text><text x="400" y="127" font-size="9.4" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">city, region = pair</text><rect x="12" y="150" width="616" height="40" rx="5" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="12" y="150" width="6" height="40" rx="0" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="24" y="175" font-size="11" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">dict</text><text x="112" y="167" font-size="10" fill="#1d2330" font-weight="bold" text-anchor="start">Lookup: key → value</text><text x="112" y="182" font-size="9.6" fill="#5b6475" font-weight="normal" text-anchor="start">city → region; product → price; counts</text><text x="400" y="175" font-size="9.4" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">d[k] · d.get(k, default) · d.items()</text><rect x="12" y="198" width="616" height="40" rx="5" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="12" y="198" width="6" height="40" rx="0" fill="#7a4fa0" stroke="none" stroke-width="1" /><text x="24" y="223" font-size="11" fill="#7a4fa0" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">set</text><text x="112" y="215" font-size="10" fill="#1d2330" font-weight="bold" text-anchor="start">Unique values, fast membership</text><text x="112" y="230" font-size="9.6" fill="#5b6475" font-weight="normal" text-anchor="start">distinct cities; codes in A but not B</text><text x="400" y="223" font-size="9.4" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">a &amp; b · a | b · a - b</text><rect x="12" y="246" width="616" height="40" rx="5" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="12" y="246" width="6" height="40" rx="0" fill="#5b6475" stroke="none" stroke-width="1" /><text x="24" y="271" font-size="11" fill="#5b6475" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">DataFrame</text><text x="112" y="263" font-size="10" fill="#1d2330" font-weight="bold" text-anchor="start">Rows and columns (Chapter 18)</text><text x="112" y="278" font-size="9.6" fill="#5b6475" font-weight="normal" text-anchor="start">a whole CSV file, a query result</text><text x="400" y="271" font-size="9.4" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">df.groupby() · df.merge()</text></svg>