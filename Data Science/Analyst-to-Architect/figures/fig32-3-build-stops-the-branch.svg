<svg xmlns="http://www.w3.org/2000/svg" width="800" height="354" viewBox="0 0 800 354" font-family="DejaVu Sans, Arial, sans-serif"><rect width="800" height="354" fill="#ffffff"/><text x="12" y="24" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Why dbt build, and not dbt run followed by dbt test</text><text x="12" y="56" font-size="13" fill="#b23b3b" font-weight="bold" text-anchor="start">✗  dbt run, then dbt test</text><rect x="12" y="72" width="370" height="40" rx="6" fill="#fff" stroke="#5b6475" stroke-width="1.4" /><text x="24" y="97" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">stg_order_items</text><text x="162" y="97" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">built</text><path d="M197,112 V122" fill="none" stroke="#5b6475" stroke-width="1.4" stroke-linejoin="round"/><path d="M197,124 L194.1,117.6 L199.9,117.6 Z" fill="#5b6475"/><rect x="12" y="124" width="370" height="40" rx="6" fill="#fff" stroke="#b23b3b" stroke-width="2.2" /><text x="24" y="149" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">fct_sales_line</text><text x="162" y="149" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">built, with bad data</text><path d="M197,164 V174" fill="none" stroke="#5b6475" stroke-width="1.4" stroke-linejoin="round"/><path d="M197,176 L194.1,169.6 L199.9,169.6 Z" fill="#5b6475"/><rect x="12" y="176" width="370" height="40" rx="6" fill="#fff" stroke="#b23b3b" stroke-width="2.2" /><text x="24" y="201" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">dashboards</text><text x="162" y="201" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">refreshed from it</text><path d="M197,216 V226" fill="none" stroke="#5b6475" stroke-width="1.4" stroke-linejoin="round"/><path d="M197,228 L194.1,221.6 L199.9,221.6 Z" fill="#5b6475"/><rect x="12" y="228" width="370" height="40" rx="6" fill="#fff" stroke="#b23b3b" stroke-width="2.2" /><text x="24" y="253" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">tests</text><text x="162" y="253" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">FAIL, an hour later</text><text x="12" y="292" font-size="12" fill="#b23b3b" font-weight="normal" text-anchor="start">✗ Bad numbers reached people before anyone knew.</text><text x="418" y="56" font-size="13" fill="#2f7d6d" font-weight="bold" text-anchor="start">✓  dbt build</text><rect x="418" y="72" width="370" height="40" rx="6" fill="#fff" stroke="#5b6475" stroke-width="1.4" /><text x="430" y="97" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">stg_order_items</text><text x="568" y="97" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">built</text><path d="M603,112 V122" fill="none" stroke="#5b6475" stroke-width="1.4" stroke-linejoin="round"/><path d="M603,124 L600.1,117.6 L605.9,117.6 Z" fill="#5b6475"/><rect x="418" y="124" width="370" height="40" rx="6" fill="#fff" stroke="#b23b3b" stroke-width="2.2" /><text x="430" y="149" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">its grain test</text><text x="568" y="149" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">FAIL: duplicate order_item_id</text><path d="M603,164 V174" fill="none" stroke="#5b6475" stroke-width="1.4" stroke-linejoin="round"/><path d="M603,176 L600.1,169.6 L605.9,169.6 Z" fill="#5b6475"/><rect x="418" y="176" width="370" height="40" rx="6" fill="#fff" stroke="#5b6475" stroke-width="1.4" /><text x="430" y="201" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">fct_sales_line</text><text x="568" y="201" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">SKIPPED</text><path d="M603,216 V226" fill="none" stroke="#5b6475" stroke-width="1.4" stroke-linejoin="round"/><path d="M603,228 L600.1,221.6 L605.9,221.6 Z" fill="#5b6475"/><rect x="418" y="228" width="370" height="40" rx="6" fill="#fff" stroke="#2f7d6d" stroke-width="2.2" /><text x="430" y="253" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">dashboards</text><text x="568" y="253" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">still show yesterday&#x27;s build</text><text x="418" y="292" font-size="12" fill="#2f7d6d" font-weight="normal" text-anchor="start">✓ The failure stopped the branch: nothing wrong shipped.</text><text x="12" y="324" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">dbt build runs each model and then its tests, in dependency order, and skips everything downstream of a failure.</text><text x="12" y="342" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">The run ends with a non-zero exit code, so the scheduler raises an alarm (Chapter 29&#x27;s exit codes).</text></svg>