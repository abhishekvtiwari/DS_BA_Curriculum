<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="442" viewBox="0 0 1040 442" font-family="DejaVu Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1040" height="442" fill="#ffffff"/><text x="30" y="34" font-size="14.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Event time, five-minute windows, and a watermark ten minutes behind</text><rect x="70.0" y="70" width="216.0" height="54" rx="5" fill="#f2f4f7" stroke="#c9d3df" stroke-width="1" /><text x="82.0" y="92" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">00:00 - 00:05</text><text x="82.0" y="112" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">450 on time + 6 late = 456</text><rect x="290.0" y="70" width="216.0" height="54" rx="5" fill="#f2f4f7" stroke="#c9d3df" stroke-width="1" /><text x="302.0" y="92" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">00:05 - 00:10</text><text x="302.0" y="112" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">450</text><rect x="510.0" y="70" width="216.0" height="54" rx="5" fill="#f2f4f7" stroke="#c9d3df" stroke-width="1" /><text x="522.0" y="92" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">00:10 - 00:15</text><text x="522.0" y="112" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">450</text><rect x="730.0" y="70" width="216.0" height="54" rx="5" fill="#f2f4f7" stroke="#c9d3df" stroke-width="1" /><text x="742.0" y="92" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">00:15 - 00:20</text><text x="742.0" y="112" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">filling</text><rect x="30" y="180" width="980" height="62" rx="7" fill="#fbfcfe" stroke="#0f5c8c" stroke-width="1.4" /><rect x="30" y="180" width="6" height="62" rx="3" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="48" y="204" font-size="12.5" fill="#0f5c8c" font-weight="bold" text-anchor="start">batch 1: newest event 00:09:50</text><text x="300" y="204" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">watermark 23:59:50 (previous day)</text><text x="48" y="226" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">nothing is final yet, so append mode emits nothing</text><rect x="30" y="256" width="980" height="62" rx="7" fill="#fbfcfe" stroke="#2f7d6d" stroke-width="1.4" /><rect x="30" y="256" width="6" height="62" rx="3" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="48" y="280" font-size="12.5" fill="#2f7d6d" font-weight="bold" text-anchor="start">batch 2: newest event 00:19:50</text><text x="300" y="280" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">watermark 00:09:50</text><text x="48" y="302" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">windows 00:00-00:05 and 00:05-00:10 close; the six events from 00:02 arrived first, so they count</text><rect x="30" y="332" width="980" height="62" rx="7" fill="#fbfcfe" stroke="#b23b3b" stroke-width="1.4" /><rect x="30" y="332" width="6" height="62" rx="3" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="48" y="356" font-size="12.5" fill="#b23b3b" font-weight="bold" text-anchor="start">batch 3: newest event 00:29:50</text><text x="300" y="356" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">watermark 00:19:50</text><text x="48" y="378" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">more events from 00:02 arrive: now behind the watermark, so they are dropped and 456 stays 456</text><text x="30" y="422" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">The watermark is a promise about how long you wait. Everything later than it is dropped, silently, by design.</text></svg>