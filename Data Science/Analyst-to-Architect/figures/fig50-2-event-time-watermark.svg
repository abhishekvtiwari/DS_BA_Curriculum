<svg xmlns="http://www.w3.org/2000/svg" width="760" height="526" viewBox="0 0 760 526" font-family="DejaVu Sans, Arial, sans-serif"><rect width="760" height="526" fill="#ffffff"/><text x="16" y="24" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Event time, 5-minute windows, and a watermark 10 minutes behind the newest event</text><rect x="71.0" y="126" width="98.0" height="44" rx="4" fill="#f2f4f7" stroke="#c9d3df" stroke-width="1" /><text x="77.0" y="144" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start">00:00–00:05</text><text x="77.0" y="162" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">456 = 450 + 6</text><rect x="171.0" y="126" width="98.0" height="44" rx="4" fill="#f2f4f7" stroke="#c9d3df" stroke-width="1" /><text x="177.0" y="144" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start">00:05–00:10</text><text x="177.0" y="162" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">450</text><rect x="271.0" y="126" width="98.0" height="44" rx="4" fill="#f2f4f7" stroke="#c9d3df" stroke-width="1" /><text x="277.0" y="144" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start">00:10–00:15</text><text x="277.0" y="162" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">450</text><rect x="371.0" y="126" width="98.0" height="44" rx="4" fill="#fff" stroke="#c9d3df" stroke-width="1" /><text x="377.0" y="144" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start">00:15–00:20</text><text x="377.0" y="162" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">open</text><rect x="471.0" y="126" width="98.0" height="44" rx="4" fill="#fff" stroke="#c9d3df" stroke-width="1" /><text x="477.0" y="144" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start">00:20–00:25</text><text x="477.0" y="162" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">open</text><rect x="571.0" y="126" width="98.0" height="44" rx="4" fill="#fff" stroke="#c9d3df" stroke-width="1" /><text x="577.0" y="144" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start">00:25–00:30</text><text x="577.0" y="162" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">open</text><text x="16" y="46" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Boxes: Bhiwandi Main readings per window after all three runs. Dashed lines: the watermark after each run.</text><path d="M30.0,176 H678.0" fill="none" stroke="#1d2330" stroke-width="1.4" stroke-linejoin="round"/><path d="M70.0,172 V180" fill="none" stroke="#1d2330" stroke-width="1.2" stroke-linejoin="round"/><text x="70.0" y="194" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="middle">00:00</text><path d="M170.0,172 V180" fill="none" stroke="#1d2330" stroke-width="1.2" stroke-linejoin="round"/><text x="170.0" y="194" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="middle">00:05</text><path d="M270.0,172 V180" fill="none" stroke="#1d2330" stroke-width="1.2" stroke-linejoin="round"/><text x="270.0" y="194" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="middle">00:10</text><path d="M370.0,172 V180" fill="none" stroke="#1d2330" stroke-width="1.2" stroke-linejoin="round"/><text x="370.0" y="194" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="middle">00:15</text><path d="M470.0,172 V180" fill="none" stroke="#1d2330" stroke-width="1.2" stroke-linejoin="round"/><text x="470.0" y="194" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="middle">00:20</text><path d="M570.0,172 V180" fill="none" stroke="#1d2330" stroke-width="1.2" stroke-linejoin="round"/><text x="570.0" y="194" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="middle">00:25</text><path d="M670.0,172 V180" fill="none" stroke="#1d2330" stroke-width="1.2" stroke-linejoin="round"/><text x="670.0" y="194" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="middle">00:30</text><text x="682.0" y="180" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">event time</text><circle cx="110.0" cy="176" r="5" fill="#b23b3b"/><path d="M110.0,182 V210" fill="none" stroke="#b23b3b" stroke-width="1.2" stroke-linejoin="round"/><text x="116.0" y="220" font-size="11" fill="#b23b3b" font-weight="bold" text-anchor="start">late readings with event time 00:02: six from M-07 arrive in run 2, six from M-09 in run 3</text><path d="M66.66666666666667,84 V178" fill="none" stroke="#0f5c8c" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="5 3"/><text x="70.66666666666667" y="80" font-size="11" fill="#0f5c8c" font-weight="bold" text-anchor="start">after run 1: 23:59:50</text><path d="M266.6666666666667,84 V178" fill="none" stroke="#2f7d6d" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="5 3"/><text x="270.6666666666667" y="80" font-size="11" fill="#2f7d6d" font-weight="bold" text-anchor="start">after run 2: 00:09:50</text><path d="M466.66666666666663,84 V178" fill="none" stroke="#c0662b" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="5 3"/><text x="470.66666666666663" y="80" font-size="11" fill="#c0662b" font-weight="bold" text-anchor="start">after run 3: 00:19:50</text><rect x="16" y="240" width="728" height="66" rx="7" fill="#fbfcfe" stroke="#0f5c8c" stroke-width="1.4" /><rect x="16" y="240" width="6" height="66" rx="3" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="32" y="262" font-size="12" fill="#0f5c8c" font-weight="bold" text-anchor="start">Run 1: events 00:00 to 00:09:50</text><text x="32" y="282" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="start">watermark in force: none yet; after the run: 23:59:50</text><text x="32" y="302" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">No window ends by 23:59:50, so append mode writes nothing.</text><rect x="16" y="314" width="728" height="84" rx="7" fill="#fbfcfe" stroke="#2f7d6d" stroke-width="1.4" /><rect x="16" y="314" width="6" height="84" rx="3" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="32" y="336" font-size="12" fill="#2f7d6d" font-weight="bold" text-anchor="start">Run 2: events 00:10 to 00:19:50, plus six M-07 readings from 00:02</text><text x="32" y="356" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="start">watermark in force: 23:59:50; after the run: 00:09:50</text><text x="32" y="376" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">00:02 is later than 23:59:50, so the six are kept: 450 + 6 = 456.</text><text x="32" y="394" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">00:00–00:05 ends before 00:09:50: written. 00:05–00:10 ends at 00:10:00: it waits.</text><rect x="16" y="406" width="728" height="84" rx="7" fill="#fbfcfe" stroke="#c0662b" stroke-width="1.4" /><rect x="16" y="406" width="6" height="84" rx="3" fill="#c0662b" stroke="none" stroke-width="1" /><text x="32" y="428" font-size="12" fill="#c0662b" font-weight="bold" text-anchor="start">Run 3: events 00:20 to 00:29:50, plus six M-09 readings from 00:02</text><text x="32" y="448" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="start">watermark in force: 00:09:50; after the run: 00:19:50</text><text x="32" y="468" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">00:02 is earlier than 00:09:50, so the six are dropped, silently; 456 stays 456.</text><text x="32" y="486" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">00:05–00:10 and 00:10–00:15 now end before 00:19:50: both are written.</text><text x="16" y="514" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="start">A window is final once the watermark passes its end; a reading older than the watermark in force is dropped.</text></svg>