<svg xmlns="http://www.w3.org/2000/svg" width="680" height="292" viewBox="0 0 680 292" font-family="DejaVu Sans, Arial, sans-serif"><rect width="680" height="292" fill="#ffffff"/><text x="20" y="26" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The six questions every project in this chapter answers</text><rect x="20" y="40.0" width="206" height="90" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><rect x="30" y="50.0" width="22" height="22" rx="11" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="41" y="65.5" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text><text x="58" y="65.0" font-size="11" fill="#0f5c8c" font-weight="bold" text-anchor="start">What decision changes?</text><text x="32" y="104.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">If none, there is no project,</text><text x="32" y="117.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">however good the data</text><rect x="237" y="40.0" width="206" height="90" rx="8" fill="#fff" stroke="#7a4fa0" stroke-width="1.6" /><rect x="247" y="50.0" width="22" height="22" rx="11" fill="#7a4fa0" stroke="none" stroke-width="1" /><text x="258" y="65.5" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text><text x="275" y="65.0" font-size="11" fill="#7a4fa0" font-weight="bold" text-anchor="start">What data exists, and</text><text x="275" y="80.0" font-size="11" fill="#7a4fa0" font-weight="bold" text-anchor="start">what must be created?</text><text x="249" y="104.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">Usually the bigger half.</text><text x="249" y="117.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">Usually the labels</text><rect x="462" y="44.0" width="190" height="82" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><rect x="472" y="54.0" width="22" height="22" rx="11" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="483" y="69.5" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text><text x="500" y="69.0" font-size="11" fill="#2f7d6d" font-weight="bold" text-anchor="start">What is the simplest</text><text x="500" y="84.0" font-size="11" fill="#2f7d6d" font-weight="bold" text-anchor="start">thing that could work?</text><text x="474" y="100.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">The technical choice.</text><text x="474" y="113.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">The smallest box here</text><rect x="20" y="140.0" width="206" height="90" rx="8" fill="#fff" stroke="#c0662b" stroke-width="1.6" /><rect x="30" y="150.0" width="22" height="22" rx="11" fill="#c0662b" stroke="none" stroke-width="1" /><text x="41" y="165.5" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text><text x="58" y="165.0" font-size="11" fill="#c0662b" font-weight="bold" text-anchor="start">Where does the</text><text x="58" y="180.0" font-size="11" fill="#c0662b" font-weight="bold" text-anchor="start">output go?</text><text x="32" y="204.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">Screen, queue, system of</text><text x="32" y="217.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">record, automated action</text><rect x="237" y="140.0" width="206" height="90" rx="8" fill="#fff" stroke="#b23b3b" stroke-width="1.6" /><rect x="247" y="150.0" width="22" height="22" rx="11" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="258" y="165.5" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="middle">5</text><text x="275" y="165.0" font-size="11" fill="#b23b3b" font-weight="bold" text-anchor="start">What does an error cost,</text><text x="275" y="180.0" font-size="11" fill="#b23b3b" font-weight="bold" text-anchor="start">and who finds it?</text><text x="249" y="204.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">Sets the threshold, the review</text><text x="249" y="217.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">capacity, whether to automate</text><rect x="454" y="140.0" width="206" height="90" rx="8" fill="#fff" stroke="#1d2330" stroke-width="1.6" /><rect x="464" y="150.0" width="22" height="22" rx="11" fill="#1d2330" stroke="none" stroke-width="1" /><text x="475" y="165.5" font-size="11.5" fill="#ffffff" font-weight="bold" text-anchor="middle">6</text><text x="492" y="165.0" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start">Who owns it in a year?</text><text x="466" y="204.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">No answer: a demo</text><text x="466" y="217.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">with a longer runway</text><rect x="20" y="240" width="640" height="44" rx="8" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="340" y="258" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="middle">Question 3 is the one every case study is written about.</text><text x="340" y="275" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">Questions 1, 2, 5 and 6 are where these nine projects were actually won or lost.</text></svg>