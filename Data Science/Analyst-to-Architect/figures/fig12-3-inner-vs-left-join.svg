e" font-style="italic">NULL</text><rect x="20" y="356" width="600" height="64" rx="5" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="30" y="375" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">INNER JOIN keeps a row only when both sides match. LEFT JOIN keeps every row</text><text x="30" y="392" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">of the left table (customers) and fills the missing right side with NULL.</text><text x="30" y="409" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">Sharma Hardware appears three times: one output row per matching pair.</text></svg>