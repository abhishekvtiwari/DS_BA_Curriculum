<svg xmlns="http://www.w3.org/2000/svg" width="720" height="384" viewBox="0 0 720 384" font-family="DejaVu Sans, Arial, sans-serif"><rect width="720" height="384" fill="#ffffff"/><text x="20" y="26" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">Like a restaurant: you (the program) never walk into the kitchen (the database).</text><text x="20" y="45" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">You give the waiter (the API) a clear order, and it brings back a dish.</text><rect x="20.0" y="96" width="186" height="106" rx="10" fill="#fff" stroke="#0f5c8c" stroke-width="1.8" /><path d="M20.0,104 a8,8 0 0 1 8,-8 H198.0 a8,8 0 0 1 8,8 V132 H20.0 Z" fill="#0f5c8c"/><text x="34.0" y="120" font-size="14" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Your program</text><text x="34.0" y="158" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">a report script, an app,</text><text x="34.0" y="178" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">or a tool like Power BI</text><rect x="267.0" y="96" width="186" height="106" rx="10" fill="#fff" stroke="#7a4fa0" stroke-width="1.8" /><path d="M267.0,104 a8,8 0 0 1 8,-8 H445.0 a8,8 0 0 1 8,8 V132 H267.0 Z" fill="#7a4fa0"/><text x="281.0" y="120" font-size="14" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The API</text><text x="281.0" y="158" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">checks the key,</text><text x="281.0" y="178" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">understands the request</text><rect x="514.0" y="96" width="186" height="106" rx="10" fill="#fff" stroke="#2f7d6d" stroke-width="1.8" /><path d="M514.0,104 a8,8 0 0 1 8,-8 H692.0 a8,8 0 0 1 8,8 V132 H514.0 Z" fill="#2f7d6d"/><text x="528.0" y="120" font-size="14" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The database</text><text x="528.0" y="158" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">holds Riverstone&#x27;s orders;</text><text x="528.0" y="178" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">never opened to outsiders</text><path d="M210.0,126 L263.0,126" fill="none" stroke="#0f5c8c" stroke-width="2.2" stroke-linejoin="round"/><path d="M263.0,126 L254.9,129.9 L254.9,122.1 Z" fill="#0f5c8c"/><path d="M263.0,176 L210.0,176" fill="none" stroke="#7a4fa0" stroke-width="2.2" stroke-linejoin="round"/><path d="M210.0,176 L218.1,172.1 L218.1,179.9 Z" fill="#7a4fa0"/><path d="M457.0,126 L510.0,126" fill="none" stroke="#7a4fa0" stroke-width="2.2" stroke-linejoin="round"/><path d="M510.0,126 L501.9,129.9 L501.9,122.1 Z" fill="#7a4fa0"/><path d="M510.0,176 L457.0,176" fill="none" stroke="#2f7d6d" stroke-width="2.2" stroke-linejoin="round"/><path d="M457.0,176 L465.1,172.1 L465.1,179.9 Z" fill="#2f7d6d"/><text x="236.5" y="86" font-size="13" fill="#0f5c8c" font-weight="bold" text-anchor="middle">1  Request →</text><text x="483.5" y="86" font-size="13" fill="#7a4fa0" font-weight="bold" text-anchor="middle">2  Query →</text><text x="483.5" y="222" font-size="13" fill="#2f7d6d" font-weight="bold" text-anchor="middle">← 3  Rows</text><text x="236.5" y="222" font-size="13" fill="#7a4fa0" font-weight="bold" text-anchor="middle">← 4  Response</text><text x="20" y="256" font-size="12.5" fill="#0f5c8c" font-weight="bold" text-anchor="start">What step 1 sends:</text><rect x="20" y="268" width="290" height="66" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="32" y="294" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">GET /api/orders/5009</text><text x="32" y="314" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">X-API-Key: demo-key-123</text><text x="330" y="256" font-size="12.5" fill="#7a4fa0" font-weight="bold" text-anchor="start">What step 4 brings back:</text><rect x="330" y="268" width="370" height="100" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="342" y="294" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">HTTP/1.0 200 OK</text><text x="342" y="314" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Content-Type: application/json</text><text x="342" y="334" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace"></text><text x="342" y="354" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">{ &quot;order_id&quot;: 5009, &quot;status&quot;: &quot;Shipped&quot;, … }</text></svg>