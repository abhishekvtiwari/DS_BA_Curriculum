<svg xmlns="http://www.w3.org/2000/svg" width="720" height="438" viewBox="0 0 720 438" font-family="DejaVu Sans, Arial, sans-serif"><rect width="720" height="438" fill="#ffffff"/><text x="24" y="28" font-size="15" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Up 50%, then down 50%</text><rect x="24" y="206.0" width="66" height="150.0" rx="4" fill="#5b6475" stroke="none" stroke-width="1" /><text x="57.0" y="197.0" font-size="15" fill="#1d2330" font-weight="bold" text-anchor="middle">₹100</text><text x="57.0" y="376" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="middle">start</text><rect x="128" y="131.0" width="66" height="225.0" rx="4" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="161.0" y="122.0" font-size="15" fill="#1d2330" font-weight="bold" text-anchor="middle">₹150</text><text x="161.0" y="376" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="middle">after +50%</text><path d="M94,180.0 L124,105.0" fill="none" stroke="#0f5c8c" stroke-width="2" stroke-linejoin="round"/><path d="M124,105.0 L124.2,114.0 L117.7,111.4 Z" fill="#0f5c8c"/><text x="109.0" y="69.0" font-size="13" fill="#0f5c8c" font-weight="bold" text-anchor="middle">+50%</text><text x="109.0" y="85.0" font-size="13" fill="#0f5c8c" font-weight="bold" text-anchor="middle">of 100</text><rect x="232" y="243.5" width="66" height="112.5" rx="4" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="265.0" y="234.5" font-size="15" fill="#1d2330" font-weight="bold" text-anchor="middle">₹75</text><text x="265.0" y="376" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="middle">after −50%</text><path d="M198,105.0 L228,217.5" fill="none" stroke="#0f5c8c" stroke-width="2" stroke-linejoin="round"/><path d="M228,217.5 L222.5,210.4 L229.3,208.6 Z" fill="#0f5c8c"/><text x="213.0" y="69.0" font-size="13" fill="#0f5c8c" font-weight="bold" text-anchor="middle">−50%</text><text x="213.0" y="85.0" font-size="13" fill="#0f5c8c" font-weight="bold" text-anchor="middle">of 150</text><path d="M16,356 H306" fill="none" stroke="#c9d3df" stroke-width="1.2" stroke-linejoin="round"/><text x="386" y="28" font-size="15" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Down 20%, then up 20%</text><rect x="386" y="206.0" width="66" height="150.0" rx="4" fill="#5b6475" stroke="none" stroke-width="1" /><text x="419.0" y="197.0" font-size="15" fill="#1d2330" font-weight="bold" text-anchor="middle">₹100</text><text x="419.0" y="376" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="middle">start</text><rect x="490" y="236.0" width="66" height="120.0" rx="4" fill="#c0662b" stroke="none" stroke-width="1" /><text x="523.0" y="227.0" font-size="15" fill="#1d2330" font-weight="bold" text-anchor="middle">₹80</text><text x="523.0" y="376" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="middle">after −20%</text><path d="M456,180.0 L486,210.0" fill="none" stroke="#c0662b" stroke-width="2" stroke-linejoin="round"/><path d="M486,210.0 L477.7,206.6 L482.6,201.7 Z" fill="#c0662b"/><text x="471.0" y="144.0" font-size="13" fill="#c0662b" font-weight="bold" text-anchor="middle">−20%</text><text x="471.0" y="160.0" font-size="13" fill="#c0662b" font-weight="bold" text-anchor="middle">of 100</text><rect x="594" y="212.0" width="66" height="144.0" rx="4" fill="#c0662b" stroke="none" stroke-width="1" /><text x="627.0" y="203.0" font-size="15" fill="#1d2330" font-weight="bold" text-anchor="middle">₹96</text><text x="627.0" y="376" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="middle">after +20%</text><path d="M560,210.0 L590,186.0" fill="none" stroke="#c0662b" stroke-width="2" stroke-linejoin="round"/><path d="M590,186.0 L585.7,193.9 L581.3,188.4 Z" fill="#c0662b"/><text x="575.0" y="150.0" font-size="13" fill="#c0662b" font-weight="bold" text-anchor="middle">+20%</text><text x="575.0" y="166.0" font-size="13" fill="#c0662b" font-weight="bold" text-anchor="middle">of 80</text><path d="M378,356 H668" fill="none" stroke="#c9d3df" stroke-width="1.2" stroke-linejoin="round"/><text x="24" y="404" font-size="13" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Each percentage is taken of a different starting number,</text><text x="24" y="423" font-size="13" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">so equal-looking rises and falls don&#x27;t cancel out.</text></svg>