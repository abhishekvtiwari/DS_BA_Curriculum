<svg xmlns="http://www.w3.org/2000/svg" width="720" height="352" viewBox="0 0 720 352" font-family="DejaVu Sans, Arial, sans-serif"><rect width="720" height="352" fill="#ffffff"/><defs><pattern id="hatch58" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#c0662b"/><line x1="0" y1="0" x2="0" y2="7" stroke="#fff" stroke-width="2.5"/></pattern></defs><text x="20" y="26" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Accuracy by email style: automate the segment you are excellent at</text><rect x="20" y="38" width="14" height="12" rx="2" fill="#0f5c8c" stroke="#0f5c8c" stroke-width="1" /><text x="40" y="48" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">correct</text><rect x="110" y="38" width="14" height="12" rx="2" fill="url(#hatch58)" stroke="#c0662b" stroke-width="1" /><text x="130" y="48" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">wrong (hatched)</text><text x="90" y="81" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="end">bulleted</text><rect x="100" y="64" width="286" height="26" rx="3" fill="#0f5c8c" stroke="#0f5c8c" stroke-width="1" /><text x="420" y="81" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">13 correct, 0 wrong</text><text x="700" y="81" font-size="11.5" fill="#0f5c8c" font-weight="bold" text-anchor="end">candidate</text><text x="90" y="117" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="end">forwarded</text><rect x="100" y="100" width="308" height="26" rx="3" fill="#0f5c8c" stroke="#0f5c8c" stroke-width="1" /><text x="420" y="117" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">14 correct, 0 wrong</text><text x="700" y="117" font-size="11.5" fill="#0f5c8c" font-weight="bold" text-anchor="end">candidate</text><text x="90" y="153" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="end">terse</text><rect x="100" y="136" width="220" height="26" rx="3" fill="#0f5c8c" stroke="#0f5c8c" stroke-width="1" /><text x="420" y="153" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">10 correct, 0 wrong</text><text x="700" y="153" font-size="11.5" fill="#0f5c8c" font-weight="bold" text-anchor="end">candidate</text><text x="90" y="189" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="end">table</text><rect x="100" y="172" width="154" height="26" rx="3" fill="#0f5c8c" stroke="#0f5c8c" stroke-width="1" /><rect x="254" y="172" width="88" height="26" rx="3" fill="url(#hatch58)" stroke="#c0662b" stroke-width="1" /><text x="420" y="189" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">7 correct, 4 wrong</text><text x="700" y="189" font-size="11.5" fill="#c0662b" font-weight="bold" text-anchor="end">review</text><text x="90" y="225" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="end">prose</text><rect x="100" y="208" width="66" height="26" rx="3" fill="#0f5c8c" stroke="#0f5c8c" stroke-width="1" /><rect x="166" y="208" width="176" height="26" rx="3" fill="url(#hatch58)" stroke="#c0662b" stroke-width="1" /><text x="420" y="225" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">3 correct, 8 wrong</text><text x="700" y="225" font-size="11.5" fill="#c0662b" font-weight="bold" text-anchor="end">review</text><rect x="20" y="250" width="680" height="50" rx="7" fill="#e6f0f7" stroke="#0f5c8c" stroke-width="1" /><text x="360.0" y="270" font-size="12" fill="#0f5c8c" font-weight="bold" text-anchor="middle">37 of 37 correct across three styles: 62% of the volume</text><text x="360.0" y="288" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="middle">0 errors so far, but with 37 cases the true rate could be up to about 8% (rule of three)</text><text x="20" y="322" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">Prose is hard, as expected. Tables are the second worst, because several items on one row are</text><text x="20" y="339" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">exactly what the extraction misses. You find the segment by measuring it, not by guessing.</text></svg>