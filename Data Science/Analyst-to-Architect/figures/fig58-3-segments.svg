<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="438" viewBox="0 0 1060 438" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1060" height="438" fill="#ffffff"/><text x="30" y="32" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Automate the segment you are excellent at, not everything you are mediocre at</text><text x="150" y="100" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="end">bulleted</text><rect x="170" y="80" width="557.1428571428571" height="32" rx="5" fill="#2f7d6d" stroke="#2f7d6d" stroke-width="1" /><text x="790" y="101" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">13 correct, 0 wrong</text><text x="1010" y="101" font-size="12" fill="#2f7d6d" font-weight="bold" text-anchor="end">automate</text><text x="150" y="144" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="end">forwarded</text><rect x="170" y="124" width="600.0" height="32" rx="5" fill="#2f7d6d" stroke="#2f7d6d" stroke-width="1" /><text x="790" y="145" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">14 correct, 0 wrong</text><text x="1010" y="145" font-size="12" fill="#2f7d6d" font-weight="bold" text-anchor="end">automate</text><text x="150" y="188" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="end">terse</text><rect x="170" y="168" width="428.57142857142856" height="32" rx="5" fill="#2f7d6d" stroke="#2f7d6d" stroke-width="1" /><text x="790" y="189" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">10 correct, 0 wrong</text><text x="1010" y="189" font-size="12" fill="#2f7d6d" font-weight="bold" text-anchor="end">automate</text><text x="150" y="232" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="end">table</text><rect x="170" y="212" width="471.42857142857144" height="32" rx="5" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><rect x="470.0" y="212" width="171.42857142857142" height="32" rx="5" fill="#b23b3b" stroke="#b23b3b" stroke-width="1" /><rect x="170" y="212" width="300.0" height="32" rx="5" fill="#2f7d6d" stroke="#2f7d6d" stroke-width="1" /><text x="790" y="233" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">7 correct, 4 wrong</text><text x="1010" y="233" font-size="12" fill="#b23b3b" font-weight="bold" text-anchor="end">review</text><text x="150" y="276" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="end">prose</text><rect x="170" y="256" width="471.42857142857144" height="32" rx="5" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><rect x="298.57142857142856" y="256" width="342.85714285714283" height="32" rx="5" fill="#b23b3b" stroke="#b23b3b" stroke-width="1" /><rect x="170" y="256" width="128.57142857142858" height="32" rx="5" fill="#2f7d6d" stroke="#2f7d6d" stroke-width="1" /><text x="790" y="277" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">3 correct, 8 wrong</text><text x="1010" y="277" font-size="12" fill="#b23b3b" font-weight="bold" text-anchor="end">review</text><rect x="170" y="310" width="600" height="54" rx="7" fill="#e2f3ee" stroke="#2f7d6d" stroke-width="1" /><text x="470" y="332" font-size="12.5" fill="#2f7d6d" font-weight="bold" text-anchor="middle">37 of 37 correct across three styles</text><text x="470" y="352" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="middle">62% of the volume, at 100% accuracy, automatic today</text><text x="30" y="396" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Nobody would have guessed this split: prose is hard, as expected, and tables are the second worst, because several items on one</text><text x="30" y="416" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">row are exactly what the extraction misses. You find the segment by measuring it, not by looking at the emails.</text></svg>