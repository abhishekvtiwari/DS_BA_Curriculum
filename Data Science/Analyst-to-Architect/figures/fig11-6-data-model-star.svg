<svg xmlns="http://www.w3.org/2000/svg" width="720" height="402" viewBox="0 0 720 402" font-family="DejaVu Sans, Arial, sans-serif"><rect width="720" height="402" fill="#ffffff"/><rect x="252" y="103" width="220" height="140" rx="6" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="250" y="100" width="220" height="140" rx="6" fill="#fff" stroke="#0f5c8c" stroke-width="1.4" /><path d="M250,106 a6,6 0 0 1 6,-6 H464 a6,6 0 0 1 6,6 V122 H250 Z" fill="#0f5c8c"/><text x="259" y="116" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Sales (fact) · 330 rows</text><text x="259" y="140" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">order_id</text><text x="259" y="156" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">order_date → Calendar</text><text x="259" y="172" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">customer_code → Customers</text><text x="259" y="188" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">product_id → Products</text><text x="259" y="204" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">quantity, unit_price,</text><text x="259" y="220" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">discount_pct, status</text><rect x="18" y="19" width="200" height="88" rx="6" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="16" y="16" width="200" height="88" rx="6" fill="#fff" stroke="#2f7d6d" stroke-width="1.4" /><path d="M16,22 a6,6 0 0 1 6,-6 H210 a6,6 0 0 1 6,6 V38 H16 Z" fill="#2f7d6d"/><text x="25" y="32" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Customers · 24 rows</text><text x="25" y="56" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">customer_code (key)</text><text x="25" y="72" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">customer_name</text><text x="25" y="88" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">city, segment</text><rect x="18" y="213" width="200" height="88" rx="6" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="16" y="210" width="200" height="88" rx="6" fill="#fff" stroke="#7a4fa0" stroke-width="1.4" /><path d="M16,216 a6,6 0 0 1 6,-6 H210 a6,6 0 0 1 6,6 V232 H16 Z" fill="#7a4fa0"/><text x="25" y="226" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Products · 8 rows</text><text x="25" y="250" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">product_id (key)</text><text x="25" y="266" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">product_name, category</text><text x="25" y="282" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">unit_cost</text><rect x="506" y="123" width="200" height="88" rx="6" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="504" y="120" width="200" height="88" rx="6" fill="#fff" stroke="#c0662b" stroke-width="1.4" /><path d="M504,126 a6,6 0 0 1 6,-6 H698 a6,6 0 0 1 6,6 V142 H504 Z" fill="#c0662b"/><text x="513" y="136" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Calendar · 365 rows</text><text x="513" y="160" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Date (key)</text><text x="513" y="176" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Month, Quarter, Year</text><text x="513" y="192" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">marked as date table</text><path d="M216,70 L250,140" fill="none" stroke="#2f7d6d" stroke-width="2" stroke-linejoin="round"/><text x="221" y="65" font-size="12" fill="#2f7d6d" font-weight="bold" text-anchor="start">1</text><text x="238" y="135" font-size="13" fill="#2f7d6d" font-weight="bold" text-anchor="start">*</text><path d="M216,250 L250,215" fill="none" stroke="#7a4fa0" stroke-width="2" stroke-linejoin="round"/><text x="221" y="245" font-size="12" fill="#7a4fa0" font-weight="bold" text-anchor="start">1</text><text x="238" y="210" font-size="13" fill="#7a4fa0" font-weight="bold" text-anchor="start">*</text><path d="M504,165 L470,165" fill="none" stroke="#c0662b" stroke-width="2" stroke-linejoin="round"/><text x="492" y="160" font-size="12" fill="#c0662b" font-weight="bold" text-anchor="start">1</text><text x="475" y="160" font-size="13" fill="#c0662b" font-weight="bold" text-anchor="start">*</text><text x="16" y="320" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">1 = one row on this side (one customer) · * = many rows (many order lines)</text><rect x="16" y="332" width="688" height="62" rx="5" fill="#fff4d6" stroke="#e2c46b" stroke-width="1" /><text x="26" y="351" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Valid Net Revenue := CALCULATE([Net Revenue], Sales[status] &lt;&gt; &quot;Cancelled&quot;)</text><text x="26" y="368" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">A measure is written once and recalculated for every pivot cell: by segment (via Customers),</text><text x="26" y="384" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">by category (via Products), or year to date (via Calendar). Filters flow from the 1 side to the * side.</text></svg>