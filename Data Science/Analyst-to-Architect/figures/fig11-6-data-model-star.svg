<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="480" viewBox="0 0 1040 480" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1040" height="480" fill="#ffffff"/><rect x="393" y="114" width="260" height="190" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="390" y="110" width="260" height="190" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><path d="M390,118 a8,8 0 0 1 8,-8 H642 a8,8 0 0 1 8,8 V138 H390 Z" fill="#0f5c8c"/><text x="402" y="129" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Sales (fact) · 330 rows</text><text x="402" y="158" font-size="11.3" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">order_id</text><text x="402" y="178" font-size="11.3" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">order_date  → Calendar</text><text x="402" y="198" font-size="11.3" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">customer_code → Customers</text><text x="402" y="218" font-size="11.3" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">product_id → Products</text><text x="402" y="238" font-size="11.3" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">quantity, unit_price,</text><text x="402" y="258" font-size="11.3" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">discount_pct, status</text><rect x="43" y="44" width="240" height="120" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="40" y="40" width="240" height="120" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><path d="M40,48 a8,8 0 0 1 8,-8 H272 a8,8 0 0 1 8,8 V68 H40 Z" fill="#2f7d6d"/><text x="52" y="59" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Customers · 24 rows</text><text x="52" y="88" font-size="11.3" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">customer_code (key)</text><text x="52" y="108" font-size="11.3" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">customer_name</text><text x="52" y="128" font-size="11.3" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">city, segment</text><rect x="43" y="244" width="240" height="120" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="40" y="240" width="240" height="120" rx="8" fill="#fff" stroke="#7a4fa0" stroke-width="1.6" /><path d="M40,248 a8,8 0 0 1 8,-8 H272 a8,8 0 0 1 8,8 V268 H40 Z" fill="#7a4fa0"/><text x="52" y="259" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Products · 8 rows</text><text x="52" y="288" font-size="11.3" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">product_id (key)</text><text x="52" y="308" font-size="11.3" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">product_name, category</text><text x="52" y="328" font-size="11.3" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">unit_cost</text><rect x="763" y="144" width="240" height="120" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="760" y="140" width="240" height="120" rx="8" fill="#fff" stroke="#c0662b" stroke-width="1.6" /><path d="M760,148 a8,8 0 0 1 8,-8 H992 a8,8 0 0 1 8,8 V168 H760 Z" fill="#c0662b"/><text x="772" y="159" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Calendar · 365 rows</text><text x="772" y="188" font-size="11.3" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Date (key)</text><text x="772" y="208" font-size="11.3" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Month, Quarter, Year</text><text x="772" y="228" font-size="11.3" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">marked as date table</text><path d="M280,100 L390,160" fill="none" stroke="#2f7d6d" stroke-width="2" stroke-linejoin="round"/><text x="286" y="94" font-size="12" fill="#2f7d6d" font-weight="bold" text-anchor="start">1</text><text x="376" y="154" font-size="14" fill="#2f7d6d" font-weight="bold" text-anchor="start">*</text><path d="M280,300 L390,250" fill="none" stroke="#7a4fa0" stroke-width="2" stroke-linejoin="round"/><text x="286" y="294" font-size="12" fill="#7a4fa0" font-weight="bold" text-anchor="start">1</text><text x="376" y="244" font-size="14" fill="#7a4fa0" font-weight="bold" text-anchor="start">*</text><path d="M760,200 L650,200" fill="none" stroke="#c0662b" stroke-width="2" stroke-linejoin="round"/><text x="746" y="194" font-size="12" fill="#c0662b" font-weight="bold" text-anchor="start">1</text><text x="656" y="194" font-size="14" fill="#c0662b" font-weight="bold" text-anchor="start">*</text><rect x="40" y="390" width="850" height="74" rx="6" fill="#fff4d6" stroke="#e2c46b" stroke-width="1" /><text x="56" y="414" font-size="12.3" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Valid Net Revenue := CALCULATE([Net Revenue], Sales[status] &lt;&gt; &quot;Cancelled&quot;)</text><text x="56" y="436" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">A measure is written once and recalculated for every pivot cell: by segment (via Customers),</text><text x="56" y="454" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">by category (via Products), or year to date (via Calendar). Filters flow from the 1 side to the * side.</text></svg>