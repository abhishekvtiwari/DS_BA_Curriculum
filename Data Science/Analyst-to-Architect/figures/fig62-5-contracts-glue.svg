<svg xmlns="http://www.w3.org/2000/svg" width="970" height="368" viewBox="0 0 970 368" font-family="DejaVu Sans, Arial, sans-serif"><rect width="970" height="368" fill="#ffffff"/><text x="30" y="30" font-size="14.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Without a contract, decentralization is just chaos with more owners</text><text x="60" y="64" font-size="12" fill="#b23b3b" font-weight="bold" text-anchor="start">NO CONTRACT</text><rect x="33" y="80" width="280" height="150" rx="7" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="30" y="76" width="280" height="150" rx="7" fill="#fff" stroke="#b23b3b" stroke-width="1.6" /><path d="M30,84 a7,7 0 0 1 7,-7 H303 a7,7 0 0 1 7,7 V100 H30 Z" fill="#b23b3b"/><text x="170.0" y="92.5" font-size="10.2" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Sales domain</text><text x="170.0" y="116" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">publishes &quot;active_customer&quot;</text><text x="170.0" y="130" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">as: ordered in last 30 days</text><rect x="333" y="80" width="280" height="150" rx="7" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="330" y="76" width="280" height="150" rx="7" fill="#fff" stroke="#b23b3b" stroke-width="1.6" /><path d="M330,84 a7,7 0 0 1 7,-7 H603 a7,7 0 0 1 7,7 V100 H330 Z" fill="#b23b3b"/><text x="470.0" y="92.5" font-size="10.2" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Finance domain</text><text x="470.0" y="116" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">publishes &quot;active_customer&quot;</text><text x="470.0" y="130" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">as: has a non-zero balance</text><rect x="33" y="244" width="580" height="60" rx="7" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="30" y="240" width="580" height="60" rx="7" fill="#fff" stroke="#b23b3b" stroke-width="1.6" /><path d="M30,248 a7,7 0 0 1 7,-7 H603 a7,7 0 0 1 7,7 V264 H30 Z" fill="#b23b3b"/><text x="320.0" y="256.5" font-size="10.2" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Two &quot;single sources of truth&quot; that disagree — and nobody outside either team knows it</text><text x="680" y="64" font-size="12" fill="#2f7d6d" font-weight="bold" text-anchor="start">WITH A CONTRACT</text><rect x="663" y="80" width="280" height="80" rx="7" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="660" y="76" width="280" height="80" rx="7" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><path d="M660,84 a7,7 0 0 1 7,-7 H933 a7,7 0 0 1 7,7 V100 H660 Z" fill="#2f7d6d"/><text x="800.0" y="92.5" font-size="10.2" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Sales domain</text><text x="800.0" y="116" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">publishes to the agreed</text><text x="800.0" y="130" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">&quot;active_customer&quot; contract</text><rect x="663" y="170" width="280" height="80" rx="7" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="660" y="166" width="280" height="80" rx="7" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><path d="M660,174 a7,7 0 0 1 7,-7 H933 a7,7 0 0 1 7,7 V190 H660 Z" fill="#2f7d6d"/><text x="800.0" y="182.5" font-size="10.2" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Finance domain</text><text x="800.0" y="206" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">reads the same contract,</text><text x="800.0" y="220" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">doesn&#x27;t redefine it</text><rect x="663" y="260" width="280" height="60" rx="7" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="660" y="256" width="280" height="60" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><path d="M660,264 a7,7 0 0 1 7,-7 H933 a7,7 0 0 1 7,7 V280 H660 Z" fill="#0f5c8c"/><text x="800.0" y="272.5" font-size="10.2" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">One shared definition
(Ch 23&#x27;s semantic layer)</text><path d="M800,156 L800,164" fill="none" stroke="#2f7d6d" stroke-width="1.6" stroke-linejoin="round"/><path d="M800,164 L797.0,157.7 L803.0,157.7 Z" fill="#2f7d6d"/><path d="M800,246 L800,254" fill="none" stroke="#0f5c8c" stroke-width="1.6" stroke-linejoin="round"/><path d="M800,254 L797.0,247.7 L803.0,247.7 Z" fill="#0f5c8c"/><text x="30" y="330" font-size="11.3" fill="#5b6475" font-weight="normal" text-anchor="start">A data contract (Ch 47) states the shape and meaning of a dataset in writing, and a semantic layer (Ch 23) is where the</text><text x="30" y="348" font-size="11.3" fill="#5b6475" font-weight="normal" text-anchor="start">agreed, shared definitions actually live. Decentralized ownership without both isn&#x27;t a mesh — it&#x27;s just several teams guessing.</text></svg>