<svg xmlns="http://www.w3.org/2000/svg" width="600" height="336.5" viewBox="0 0 600 336.5" font-family="DejaVu Sans, Arial, sans-serif"><rect width="600" height="336.5" fill="#ffffff"/><rect x="4" y="4" width="592" height="90" rx="6" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><text x="16" y="24" font-size="10" fill="#7a4fa0" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">As a</text><text x="74" y="24" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">sales rep</text><text x="586" y="24" font-size="9" fill="#5b6475" font-weight="normal" text-anchor="end" font-style="italic">who wants it</text><text x="16" y="42" font-size="10" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">I want</text><text x="74" y="42" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">to see which of my accounts are at risk of not ordering again</text><text x="586" y="42" font-size="9" fill="#5b6475" font-weight="normal" text-anchor="end" font-style="italic">what they want</text><text x="16" y="60" font-size="10" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">so that</text><text x="74" y="60" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">I can call them before they go quiet</text><text x="586" y="60" font-size="9" fill="#5b6475" font-weight="normal" text-anchor="end" font-style="italic">why it is worth building</text><path d="M16,70 H584" fill="none" stroke="#c9d3df" stroke-width="0.8" stroke-linejoin="round"/><text x="16" y="83" font-size="9" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">The &quot;so that&quot; clause is the one people drop, and the one that stops you building something correct and useless.</text><rect x="4" y="104" width="592" height="49.5" rx="5" fill="#fff" stroke="#c9d3df" stroke-width="1" /><path d="M4,109 a5,5 0 0 1 5,-5 H48 V153.5 H9 a5,5 0 0 1 -5,-5 Z" fill="#1f6fa3"/><text x="26" y="132.25" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">AC-1</text><text x="56" y="120.0" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">Given I am a logged-in sales rep, when I open the at-risk list, then I see only accounts where I am the assigned</text><text x="56" y="132.5" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">rep.</text><text x="56" y="145.0" font-size="9" fill="#1f6fa3" font-weight="bold" text-anchor="start" font-style="italic">scope</text><rect x="4" y="159.5" width="592" height="49.5" rx="5" fill="#fff" stroke="#c9d3df" stroke-width="1" /><path d="M4,164.5 a5,5 0 0 1 5,-5 H48 V209.0 H9 a5,5 0 0 1 -5,-5 Z" fill="#0f5c8c"/><text x="26" y="187.75" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">AC-2</text><text x="56" y="175.5" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">Given an account with at least four days of orders whose time since its last order is more than 1.5 times its</text><text x="56" y="188.0" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">own average gap between orders, when the list is generated, then that account appears on it.</text><text x="56" y="200.5" font-size="9" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-style="italic">the actual rule, not the word &quot;recently&quot;</text><rect x="4" y="215.0" width="592" height="62.0" rx="5" fill="#fff" stroke="#c9d3df" stroke-width="1" /><path d="M4,220.0 a5,5 0 0 1 5,-5 H48 V277.0 H9 a5,5 0 0 1 -5,-5 Z" fill="#b35a1f"/><text x="26" y="249.5" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">AC-3</text><text x="56" y="231.0" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">Given an account with fewer than four days of orders, including one with a single order or none, when the list</text><text x="56" y="243.5" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">is generated, then it does not appear on the at-risk list and is counted separately as &quot;too new to judge&quot;,</text><text x="56" y="256.0" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">because there is no rhythm to compare against.</text><text x="56" y="268.5" font-size="9" fill="#b35a1f" font-weight="bold" text-anchor="start" font-style="italic">the edge case</text><rect x="4" y="283.0" width="592" height="49.5" rx="5" fill="#fff" stroke="#c9d3df" stroke-width="1" /><path d="M4,288.0 a5,5 0 0 1 5,-5 H48 V332.5 H9 a5,5 0 0 1 -5,-5 Z" fill="#2f7d6d"/><text x="26" y="311.25" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">AC-4</text><text x="56" y="299.0" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">Given the list is open, when I sort by value at risk, then accounts are ordered by their last twelve months&#x27;</text><text x="56" y="311.5" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">revenue, highest first.</text><text x="56" y="324.0" font-size="9" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-style="italic">behavior the user can check</text></svg>