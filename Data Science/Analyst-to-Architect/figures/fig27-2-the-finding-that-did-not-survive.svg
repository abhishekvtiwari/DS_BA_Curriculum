ill="#f2f5f9" stroke="none" stroke-width="1" /><rect x="580" y="185.0" width="9" height="20" rx="4" fill="#c0662b" stroke="none" stroke-width="1" /><text x="597" y="200.0" font-size="11" fill="#c0662b" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">1.1</text><text x="462" y="227.0" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">Retail, under 5%</text><text x="462" y="242.0" font-size="9.5" fill="#5b6475" font-weight="normal" text-anchor="start">2,555 customers</text><rect x="580" y="218.0" width="148" height="20" rx="4" fill="#f2f5f9" stroke="none" stroke-width="1" /><rect x="580" y="218.0" width="76" height="20" rx="4" fill="#5b6475" stroke="none" stroke-width="1" /><text x="664" y="233.0" font-size="11" fill="#5b6475" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">9.3</text><text x="462" y="260.0" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">Hospitality, 5%+</text><text x="462" y="275.0" font-size="9.5" fill="#5b6475" font-weight="normal" text-anchor="start">9 customers</text><rect x="580" y="251.0" width="148" height="20" rx="4" fill="#f2f5f9" stroke="none" stroke-width="1" /><rect x="580" y="251.0" width="9" height="20" rx="4" fill="#c0662b" stroke="none" stroke-width="1" /><text x="597" y="266.0" font-size="11" fill="#c0662b" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">1.2</text><path d="M456,292 H784" fill="none" stroke="#c9d3df" stroke-width="1" stroke-linejoin="round" stroke-dasharray="3 3"/><text x="456" y="310" font-size="11" fill="#b23b3b" font-weight="normal" text-anchor="start">No Wholesale customer is below 5%. The bands were</text><text x="456" y="325" font-size="11" fill="#b23b3b" font-weight="normal" text-anchor="start">segments.</text><rect x="846" y="89" width="360" height="250" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="844" y="86" width="360" height="250" rx="8" fill="#fff" stroke="#c9d3df" stroke-width="1.4" /><text x="860" y="112" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">3. Inside Wholesale</text><text x="860" y="131" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">662 customers, by discount quartile</text><text x="866" y="161.0" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">Q1  7.9% discount</text><text x="866" y="176.0" font-size="9.5" fill="#5b6475" font-weight="normal" text-anchor="start">166 customers</text><rect x="984" y="152.0" width="148" height="20" rx="4" fill="#f2f5f9" stroke="none" stroke-width="1" /><rect x="984" y="152.0" width="115" height="20" rx="4" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="1107" y="167.0" font-size="11" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">14.1</text><text x="866" y="194.0" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">Q2  8.5%</text><text x="866" y="209.0" font-size="9.5" fill="#5b6475" font-weight="normal" text-anchor="start">166 customers</text><rect x="984" y="185.0" width="148" height="20" rx="4" fill="#f2f5f9" stroke="none" stroke-width="1" /><rect x="984" y="185.0" width="137" height="20" rx="4" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="1129" y="200.0" font-size="11" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">16.7</text><text x="866" y="227.0" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">Q3  9.0%</text><text x="866" y="242.0" font-size="9.5" fill="#5b6475" font-weight="normal" text-anchor="start">165 customers</text><rect x="984" y="218.0" width="148" height="20" rx="4" fill="#f2f5f9" stroke="none" stroke-width="1" /><rect x="984" y="218.0" width="134" height="20" rx="4" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="1126" y="233.0" font-size="11" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">16.4</text><text x="866" y="260.0" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">Q4  9.7% discount</text><text x="866" y="275.0" font-size="9.5" fill="#5b6475" font-weight="normal" text-anchor="start">165 customers</text><rect x="984" y="251.0" width="148" height="20" rx="4" fill="#f2f5f9" stroke="none" stroke-width="1" /><rect x="984" y="251.0" width="111" height="20" rx="4" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="1103" y="266.0" font-size="11" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">13.6</text><path d="M860,292 H1188" fill="none" stroke="#c9d3df" stroke-width="1" stroke-linejoin="round" stroke-dasharray="3 3"/><text x="860" y="310" font-size="11" fill="#2f7d6d" font-weight="normal" text-anchor="start">Q4 - Q1 = -0.48 orders, 95% CI [-1.89, 0.92]. No</text><text x="860" y="325" font-size="11" fill="#2f7d6d" font-weight="normal" text-anchor="start">ladder.</text><text x="36" y="376" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">Deeper discounts do not buy more orders. Panel 1 is what a portfolio shows when the analyst stops one query early.</text></svg>