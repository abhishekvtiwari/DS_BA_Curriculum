<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="400" viewBox="0 0 1240 400" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1240" height="400" fill="#ffffff"/><text x="36" y="36" font-size="15.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The same data, asked three ways. Only the third one answers the question.</text><text x="36" y="60" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Average orders per customer, 2025. Every bar is true.</text><rect x="38" y="89" width="360" height="250" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="36" y="86" width="360" height="250" rx="8" fill="#fff" stroke="#c9d3df" stroke-width="1.4" /><text x="52" y="112" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">1. The headline</text><text x="52" y="131" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">All customers, split at 5% discount</text><text x="58" y="161.0" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">5% or deeper</text><text x="58" y="176.0" font-size="9.5" fill="#5b6475" font-weight="normal" text-anchor="start">681 customers</text><rect x="176" y="152.0" width="148" height="20" rx="4" fill="#f2f5f9" stroke="none" stroke-width="1" /><rect x="176" y="152.0" width="121" height="20" rx="4" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="305" y="167.0" font-size="11" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">14.8</text><text x="58" y="227.0" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">under 5%</text><text x="58" y="242.0" font-size="9.5" fill="#5b6475" font-weight="normal" text-anchor="start">3,918 customers</text><rect x="176" y="218.0" width="148" height="20" rx="4" fill="#f2f5f9" stroke="none" stroke-width="1" /><re