<svg xmlns="http://www.w3.org/2000/svg" width="820" height="416" viewBox="0 0 820 416" font-family="DejaVu Sans, Arial, sans-serif"><rect width="820" height="416" fill="#ffffff"/><text x="20" y="28" font-size="15" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Attention on four tokens: who listens to whom</text><text x="308" y="68" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="middle">attended to</text><text x="195.0" y="92" font-size="13" fill="#5b6475" font-weight="bold" text-anchor="middle">the</text><text x="269.0" y="92" font-size="13" fill="#5b6475" font-weight="bold" text-anchor="middle">crate</text><text x="343.0" y="92" font-size="13" fill="#5b6475" font-weight="bold" text-anchor="middle">was</text><text x="417.0" y="92" font-size="13" fill="#5b6475" font-weight="bold" text-anchor="middle">cracked</text><text x="148" y="144.0" font-size="13" fill="#5b6475" font-weight="bold" text-anchor="end">the</text><rect x="160" y="104" width="70" height="70" rx="5" fill="rgb(122,151,187)" stroke="#c9d3df" stroke-width="1" /><text x="195.0" y="144.0" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">0.347</text><rect x="234" y="104" width="70" height="70" rx="5" fill="rgb(192,208,224)" stroke="#c9d3df" stroke-width="1" /><text x="269.0" y="144.0" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">0.244</text><rect x="308" y="104" width="70" height="70" rx="5" fill="rgb(214,225,236)" stroke="#c9d3df" stroke-width="1" /><text x="343.0" y="144.0" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">0.212</text><rect x="382" y="104" width="70" height="70" rx="5" fill="rgb(224,233,241)" stroke="#c9d3df" stroke-width="1" /><text x="417.0" y="144.0" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">0.197</text><text x="148" y="218.0" font-size="13" fill="#5b6475" font-weight="bold" text-anchor="end">crate</text><rect x="160" y="178" width="70" height="70" rx="5" fill="rgb(143,169,198)" stroke="#c9d3df" stroke-width="1" /><text x="195.0" y="218.0" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">0.315</text><rect x="234" y="178" width="70" height="70" rx="5" fill="rgb(161,183,208)" stroke="#c9d3df" stroke-width="1" /><text x="269.0" y="218.0" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">0.290</text><rect x="308" y="178" width="70" height="70" rx="5" fill="rgb(221,231,240)" stroke="#c9d3df" stroke-width="1" /><text x="343.0" y="218.0" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">0.202</text><rect x="382" y="178" width="70" height="70" rx="5" fill="rgb(227,235,243)" stroke="#c9d3df" stroke-width="1" /><text x="417.0" y="218.0" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">0.193</text><text x="148" y="292.0" font-size="13" fill="#5b6475" font-weight="bold" text-anchor="end">was</text><rect x="160" y="252" width="70" height="70" rx="5" fill="rgb(180,198,218)" stroke="#c9d3df" stroke-width="1" /><text x="195.0" y="292.0" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">0.262</text><rect x="234" y="252" width="70" height="70" rx="5" fill="rgb(178,197,217)" stroke="#c9d3df" stroke-width="1" /><text x="269.0" y="292.0" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">0.264</text><rect x="308" y="252" width="70" height="70" rx="5" fill="rgb(196,211,226)" stroke="#c9d3df" stroke-width="1" /><text x="343.0" y="292.0" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">0.238</text><rect x="382" y="252" width="70" height="70" rx="5" fill="rgb(197,212,227)" stroke="#c9d3df" stroke-width="1" /><text x="417.0" y="292.0" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">0.236</text><text x="148" y="366.0" font-size="13" fill="#5b6475" font-weight="bold" text-anchor="end">cracked</text><rect x="160" y="326" width="70" height="70" rx="5" fill="rgb(204,217,231)" stroke="#c9d3df" stroke-width="1" /><text x="195.0" y="366.0" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">0.226</text><rect x="234" y="326" width="70" height="70" rx="5" fill="rgb(88,125,169)" stroke="#c9d3df" stroke-width="1" /><text x="269.0" y="366.0" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">0.396</text><rect x="308" y="326" width="70" height="70" rx="5" fill="rgb(231,239,245)" stroke="#c9d3df" stroke-width="1" /><text x="343.0" y="366.0" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">0.186</text><rect x="382" y="326" width="70" height="70" rx="5" fill="rgb(227,236,243)" stroke="#c9d3df" stroke-width="1" /><text x="417.0" y="366.0" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">0.192</text><text x="56" y="222.4" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="middle">the token</text><text x="56" y="240.4" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="middle">doing the</text><text x="56" y="258.4" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="middle">looking</text><text x="480" y="112" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">Each row sums to 1: it is how one token</text><text x="480" y="133" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">divides its attention over the sentence.</text><text x="480" y="154" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start"></text><text x="480" y="175" font-size="13" fill="#5b6475" font-weight="normal" text-anchor="start">&#x27;cracked&#x27; puts 0.396 on &#x27;crate&#x27;, more</text><text x="480" y="196" font-size="13" fill="#5b6475" font-weight="normal" text-anchor="start">than on any other token, including</text><text x="480" y="217" font-size="13" fill="#5b6475" font-weight="normal" text-anchor="start">itself. Nothing told the model about</text><text x="480" y="238" font-size="13" fill="#5b6475" font-weight="normal" text-anchor="start">grammar: the learned query of &#x27;cracked&#x27;</text><text x="480" y="259" font-size="13" fill="#5b6475" font-weight="normal" text-anchor="start">lines up with the learned key of &#x27;crate&#x27;.</text><text x="480" y="280" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start"></text><text x="480" y="301" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">Queries and keys decide who is</text><text x="480" y="322" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">listened to. Values decide what is heard.</text></svg>