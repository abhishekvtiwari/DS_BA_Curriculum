<svg xmlns="http://www.w3.org/2000/svg" width="740" height="350" viewBox="0 0 740 350" font-family="DejaVu Sans, Arial, sans-serif"><rect width="740" height="350" fill="#ffffff"/><text x="20" y="28" font-size="15" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The day the provider changed the model</text><text x="20" y="48" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Prompt v3 on the 60-email golden set</text><text x="20" y="86" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">pinned workhorse-001</text><text x="20" y="103" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">Chapter 54&#x27;s parse</text><rect x="220" y="70" width="300" height="38" rx="4" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><rect x="220" y="70" width="235.0" height="38" rx="4" fill="#2f7d6d" stroke="#2f7d6d" stroke-width="1" /><text x="230" y="94" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="start">47 of 60 correct</text><text x="532" y="86" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">the system as it</text><text x="532" y="102" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">ran on Friday</text><text x="20" y="142" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">new workhorse-002</text><text x="20" y="159" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">Chapter 54&#x27;s parse</text><rect x="220" y="126" width="300" height="38" rx="4" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><rect x="220" y="126" width="300.0" height="38" rx="4" fill="#f6dcdc" stroke="#b23b3b" stroke-width="1" /><text x="230" y="150" font-size="12" fill="#b23b3b" font-weight="bold" text-anchor="start">0 correct: 60 of 60 unparseable</text><text x="532" y="142" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">every reply unparseable:</text><text x="532" y="158" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">nothing loads</text><text x="20" y="198" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">new workhorse-002</text><text x="20" y="215" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">tolerant_parse</text><rect x="220" y="182" width="300" height="38" rx="4" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><rect x="220" y="182" width="235.0" height="38" rx="4" fill="#2f7d6d" stroke="#2f7d6d" stroke-width="1" /><text x="230" y="206" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="start">47 of 60 correct</text><text x="532" y="198" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">drop comment lines, fix</text><text x="532" y="214" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">the date: 20 minutes</text><rect x="220" y="242" width="300" height="50" rx="6" fill="#fdf3dc" stroke="#b7791f" stroke-width="1" /><text x="370.0" y="262" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="middle">The model was not worse.</text><text x="370.0" y="281" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="middle">A contract nobody enforced had changed.</text><text x="20" y="318" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">A nightly golden-set run turns this into a Saturday-night build failure.</text><text x="20" y="336" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Without it, it is a Monday morning with no orders.</text></svg>