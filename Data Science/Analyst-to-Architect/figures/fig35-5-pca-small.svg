" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Orders are drawn 3 times wider than</text><text x="430" y="240" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">revenue so the points are easier to see,</text><text x="430" y="260" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">which makes the right angle look slanted.</text></svg>