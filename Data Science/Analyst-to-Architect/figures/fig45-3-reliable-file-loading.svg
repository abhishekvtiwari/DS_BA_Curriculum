<svg xmlns="http://www.w3.org/2000/svg" width="720" height="304" viewBox="0 0 720 304" font-family="DejaVu Sans, Arial, sans-serif"><rect width="720" height="304" fill="#ffffff"/><rect x="15" y="14" width="212" height="118" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="12" y="10" width="212" height="118" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><path d="M12,18 a8,8 0 0 1 8,-8 H216 a8,8 0 0 1 8,8 V44 H12 Z" fill="#0f5c8c"/><text x="24" y="33" font-size="13" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">1 Receive</text><text x="24" y="66" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Check name and date</text><text x="24" y="84" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Hash; skip repeats</text><text x="24" y="102" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Log it after loading</text><path d="M228,69.0 L250,69.0" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M250,69.0 L241.9,72.9 L241.9,65.1 Z" fill="#1d2330"/><rect x="257" y="14" width="212" height="118" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="254" y="10" width="212" height="118" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><path d="M254,18 a8,8 0 0 1 8,-8 H458 a8,8 0 0 1 8,8 V44 H254 Z" fill="#0f5c8c"/><text x="266" y="33" font-size="13" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">2 Read</text><text x="266" y="66" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Declare encoding,</text><text x="266" y="84" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">delimiter, header, types</text><text x="266" y="102" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Awkward fields as text</text><path d="M470,69.0 L492,69.0" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M492,69.0 L483.9,72.9 L483.9,65.1 Z" fill="#1d2330"/><rect x="499" y="14" width="212" height="118" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="496" y="10" width="212" height="118" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><path d="M496,18 a8,8 0 0 1 8,-8 H700 a8,8 0 0 1 8,8 V44 H496 Z" fill="#2f7d6d"/><text x="508" y="33" font-size="13" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">3 Land raw</text><text x="508" y="66" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Exactly what arrived</text><text x="508" y="84" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">+ file name</text><text x="508" y="102" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">+ load date</text><rect x="15" y="176" width="212" height="118" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="12" y="172" width="212" height="118" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><path d="M12,180 a8,8 0 0 1 8,-8 H216 a8,8 0 0 1 8,8 V206 H12 Z" fill="#2f7d6d"/><text x="24" y="195" font-size="13" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">4 Type in staging</text><text x="24" y="228" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Explicit date formats</text><text x="24" y="246" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Remove separators</text><text x="24" y="264" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">TRY_CAST; list failures</text><path d="M228,231.0 L250,231.0" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M250,231.0 L241.9,234.9 L241.9,227.1 Z" fill="#1d2330"/><rect x="257" y="176" width="212" height="118" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="254" y="172" width="212" height="118" rx="8" fill="#fff" stroke="#7a4fa0" stroke-width="1.6" /><path d="M254,180 a8,8 0 0 1 8,-8 H458 a8,8 0 0 1 8,8 V206 H254 Z" fill="#7a4fa0"/><text x="266" y="195" font-size="13" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">5 Reconcile</text><text x="266" y="228" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Records = rows loaded</text><text x="266" y="246" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Rejects listed</text><text x="266" y="264" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Totals vs sender</text><path d="M470,231.0 L492,231.0" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M492,231.0 L483.9,234.9 L483.9,227.1 Z" fill="#1d2330"/><rect x="499" y="176" width="212" height="118" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="496" y="172" width="212" height="118" rx="8" fill="#fff" stroke="#c0662b" stroke-width="1.6" /><path d="M496,180 a8,8 0 0 1 8,-8 H700 a8,8 0 0 1 8,8 V206 H496 Z" fill="#c0662b"/><text x="508" y="195" font-size="13" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">6 Alert or proceed</text><text x="508" y="228" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Tell a person about</text><text x="508" y="246" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">rejects before reports</text><text x="508" y="264" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">and emails run</text><path d="M602.0,134 V150 H118.0" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M118.0,150 L118.0,168" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M118.0,168 L114.1,159.9 L121.9,159.9 Z" fill="#1d2330"/></svg>