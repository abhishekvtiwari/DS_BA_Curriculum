<svg xmlns="http://www.w3.org/2000/svg" width="680" height="359.5" viewBox="0 0 680 359.5" font-family="DejaVu Sans, Arial, sans-serif"><rect width="680" height="359.5" fill="#ffffff"/><text x="20" y="24" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">One shape under every automation: six layers</text><rect x="20.0" y="42" width="200" height="109.5" rx="6" fill="#fff" stroke="#5b6475" stroke-width="1.4" /><path d="M20.0,48 a6,6 0 0 1 6,-6 H214.0 a6,6 0 0 1 6,6 V64 H20.0 Z" fill="#5b6475"/><text x="28.0" y="57.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="start">1  Sources</text><text x="28.0" y="80.0" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Platform: ERP, CRM, plant sensors,</text><text x="28.0" y="93.5" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">inbound email, hand-kept</text><text x="28.0" y="107.0" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">spreadsheets</text><text x="28.0" y="124.5" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">In a macro: the branch files it</text><text x="28.0" y="138.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">opens</text><path d="M222.0,96.75 L238.0,96.75" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M238.0,96.75 L231.7,99.8 L231.7,93.7 Z" fill="#5b6475"/><rect x="240.0" y="42" width="200" height="109.5" rx="6" fill="#fff" stroke="#0f5c8c" stroke-width="1.4" /><path d="M240.0,48 a6,6 0 0 1 6,-6 H434.0 a6,6 0 0 1 6,6 V64 H240.0 Z" fill="#0f5c8c"/><text x="248.0" y="57.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="start">2  Ingestion</text><text x="248.0" y="80.0" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Platform: Dagster jobs copy data</text><text x="248.0" y="93.5" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">in on a schedule (Ch 45, 46)</text><text x="248.0" y="111.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">In a macro: Workbooks.Open, file</text><text x="248.0" y="124.5" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">by file</text><path d="M442.0,96.75 L458.0,96.75" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M458.0,96.75 L451.7,99.8 L451.7,93.7 Z" fill="#5b6475"/><rect x="460.0" y="42" width="200" height="109.5" rx="6" fill="#fff" stroke="#2f6690" stroke-width="1.4" /><path d="M460.0,48 a6,6 0 0 1 6,-6 H654.0 a6,6 0 0 1 6,6 V64 H460.0 Z" fill="#2f6690"/><text x="468.0" y="57.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="start">3  Warehouse</text><text x="468.0" y="80.0" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Platform: raw, staging and mart</text><text x="468.0" y="93.5" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">tables, plus the Delta sensor</text><text x="468.0" y="107.0" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">archive (Ch 45, 49)</text><text x="468.0" y="124.5" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">In a macro: the Master sheet it</text><text x="468.0" y="138.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">rebuilds</text><path d="M560.0,153.5 V164.5 H120.0 V169.5" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M120.0,168.5 L120.0,175.5" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M120.0,175.5 L117.0,169.2 L123.0,169.2 Z" fill="#5b6475"/><rect x="20.0" y="177.5" width="200" height="96.0" rx="6" fill="#fff" stroke="#2f7d6d" stroke-width="1.4" /><path d="M20.0,183.5 a6,6 0 0 1 6,-6 H214.0 a6,6 0 0 1 6,6 V199.5 H20.0 Z" fill="#2f7d6d"/><text x="28.0" y="193.0" font-size="11" fill="#fff" font-weight="bold" text-anchor="start">4  Semantic layer</text><text x="28.0" y="215.5" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Platform: one tested definition per</text><text x="28.0" y="229.0" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">metric (Ch 32)</text><text x="28.0" y="246.5" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">In a macro: the one formula its</text><text x="28.0" y="260.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">author chose for revenue</text><path d="M222.0,225.5 L238.0,225.5" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M238.0,225.5 L231.7,228.5 L231.7,222.5 Z" fill="#5b6475"/><rect x="240.0" y="177.5" width="200" height="96.0" rx="6" fill="#fff" stroke="#b7791f" stroke-width="1.4" /><path d="M240.0,183.5 a6,6 0 0 1 6,-6 H434.0 a6,6 0 0 1 6,6 V199.5 H240.0 Z" fill="#b7791f"/><text x="248.0" y="193.0" font-size="11" fill="#fff" font-weight="bold" text-anchor="start">5  Delivery and activation</text><text x="248.0" y="215.5" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Platform: the Flash, dashboards,</text><text x="248.0" y="229.0" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">CRM writes, ERP orders (Ch 16,</text><text x="248.0" y="242.5" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">20, 51, 58)</text><text x="248.0" y="260.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">In a macro: the PDF it emails</text><path d="M442.0,225.5 L458.0,225.5" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M458.0,225.5 L451.7,228.5 L451.7,222.5 Z" fill="#5b6475"/><rect x="460.0" y="177.5" width="200" height="96.0" rx="6" fill="#fff" stroke="#b23b3b" stroke-width="1.4" /><path d="M460.0,183.5 a6,6 0 0 1 6,-6 H654.0 a6,6 0 0 1 6,6 V199.5 H460.0 Z" fill="#b23b3b"/><text x="468.0" y="193.0" font-size="11" fill="#fff" font-weight="bold" text-anchor="start">6  Monitoring</text><text x="468.0" y="215.5" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Platform: checks, run logs and</text><text x="468.0" y="229.0" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">failure alerts (Ch 20, 46, 47)</text><text x="468.0" y="246.5" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">In a macro: its checks since Ch 19;</text><text x="468.0" y="260.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">before that, nothing</text><rect x="20" y="303.5" width="640" height="46" rx="6" fill="#f1f3f6" stroke="#c9d3df" stroke-width="1" /><text x="30" y="322.5" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">A single macro (Ch 19) does all six jobs inside one workbook; Chapter 46&#x27;s pipeline does each one in its own</text><text x="30" y="337.5" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">named piece. Same six jobs, different visibility.</text></svg>