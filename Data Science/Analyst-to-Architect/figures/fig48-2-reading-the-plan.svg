<svg xmlns="http://www.w3.org/2000/svg" width="760" height="488" viewBox="0 0 760 488" font-family="DejaVu Sans, Arial, sans-serif"><rect width="760" height="488" fill="#ffffff"/><rect x="15" y="14" width="736" height="221" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="12" y="10" width="736" height="221" rx="8" fill="#fff" stroke="#b23b3b" stroke-width="1.6" /><path d="M12,18 a8,8 0 0 1 8,-8 H740 a8,8 0 0 1 8,8 V44 H12 Z" fill="#b23b3b"/><text x="24" y="33" font-size="14" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Group by machine: one Exchange, one shuffle</text><text x="24" y="66" font-size="11" font-family="DejaVu Sans Mono, monospace" fill="#1d2330" xml:space="preserve">AdaptiveSparkPlan isFinalPlan=false</text><text x="24" y="85" font-size="11" font-family="DejaVu Sans Mono, monospace" fill="#1d2330" xml:space="preserve">+- HashAggregate(keys=[machine_id], functions=[sum(units_made)])</text><rect x="18" y="90" width="724" height="19" rx="3" fill="#fff4d6" stroke="#e2c46b" stroke-width="1" /><text x="738" y="104" font-size="11.5" fill="#b23b3b" font-weight="bold" text-anchor="end">← the shuffle</text><text x="24" y="104" font-size="11" font-family="DejaVu Sans Mono, monospace" fill="#1d2330" xml:space="preserve">   +- Exchange hashpartitioning(machine_id, 8), ENSURE_REQUIREMENTS</text><text x="24" y="123" font-size="11" font-family="DejaVu Sans Mono, monospace" fill="#1d2330" xml:space="preserve">      +- HashAggregate(keys=[machine_id], functions=[partial_sum(units_made)])</text><text x="24" y="142" font-size="11" font-family="DejaVu Sans Mono, monospace" fill="#1d2330" xml:space="preserve">         +- Project [machine_id, units_made]</text><text x="24" y="161" font-size="11" font-family="DejaVu Sans Mono, monospace" fill="#1d2330" xml:space="preserve">            +- FileScan parquet [machine_id,units_made,reading_date] Batched: true</text><text x="24" y="180" font-size="11" font-family="DejaVu Sans Mono, monospace" fill="#1d2330" xml:space="preserve">        PartitionFilters: []</text><text x="24" y="199" font-size="11" font-family="DejaVu Sans Mono, monospace" fill="#1d2330" xml:space="preserve">        PushedFilters: []</text><text x="24" y="218" font-size="11" font-family="DejaVu Sans Mono, monospace" fill="#1d2330" xml:space="preserve">        ReadSchema: struct&lt;machine_id:string,units_made:int&gt;</text><rect x="15" y="251" width="736" height="183" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="12" y="247" width="736" height="183" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><path d="M12,255 a8,8 0 0 1 8,-8 H740 a8,8 0 0 1 8,8 V281 H12 Z" fill="#2f7d6d"/><text x="24" y="270" font-size="14" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">One day at one plant: no Exchange, and pruning</text><text x="24" y="303" font-size="11" font-family="DejaVu Sans Mono, monospace" fill="#1d2330" xml:space="preserve">*(1) Project [machine_id, temperature_c]</text><text x="24" y="322" font-size="11" font-family="DejaVu Sans Mono, monospace" fill="#1d2330" xml:space="preserve">+- *(1) Filter (isnotnull(plant) AND (plant = Bhiwandi Main))</text><text x="24" y="341" font-size="11" font-family="DejaVu Sans Mono, monospace" fill="#1d2330" xml:space="preserve">   +- *(1) ColumnarToRow</text><text x="24" y="360" font-size="11" font-family="DejaVu Sans Mono, monospace" fill="#1d2330" xml:space="preserve">      +- FileScan parquet [machine_id,plant,temperature_c,reading_date] Batched: true</text><rect x="18" y="365" width="724" height="19" rx="3" fill="#fff4d6" stroke="#e2c46b" stroke-width="1" /><text x="738" y="379" font-size="11.5" fill="#2f7d6d" font-weight="bold" text-anchor="end">← 1 folder of 92</text><text x="24" y="379" font-size="11" font-family="DejaVu Sans Mono, monospace" fill="#1d2330" xml:space="preserve">        PartitionFilters: [isnotnull(reading_date), (reading_date = 2025-12-01)]</text><text x="24" y="398" font-size="11" font-family="DejaVu Sans Mono, monospace" fill="#1d2330" xml:space="preserve">        PushedFilters: [IsNotNull(plant), EqualTo(plant,Bhiwandi Main)]</text><rect x="18" y="403" width="724" height="19" rx="3" fill="#fff4d6" stroke="#e2c46b" stroke-width="1" /><text x="738" y="417" font-size="11.5" fill="#2f7d6d" font-weight="bold" text-anchor="end">← 3 columns read</text><text x="24" y="417" font-size="11" font-family="DejaVu Sans Mono, monospace" fill="#1d2330" xml:space="preserve">        ReadSchema: struct&lt;machine_id:string,plant:string,temperature_c:double&gt;</text><text x="12" y="456" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">Read a plan from the bottom up. Count the Exchange lines: each one is a shuffle, the cost.</text><text x="12" y="476" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">Then check the scan: PartitionFilters skips whole folders; ReadSchema lists the only columns read.</text></svg>