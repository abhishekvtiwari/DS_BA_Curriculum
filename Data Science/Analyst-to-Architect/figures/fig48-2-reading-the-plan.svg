<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="384" viewBox="0 0 1040 384" font-family="DejaVu Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1040" height="384" fill="#ffffff"/><rect x="33" y="34" width="470" height="250" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="30" y="30" width="470" height="250" rx="8" fill="#fff" stroke="#b23b3b" stroke-width="1.6" /><path d="M30,38 a8,8 0 0 1 8,-8 H492 a8,8 0 0 1 8,8 V64 H30 Z" fill="#b23b3b"/><text x="42" y="53" font-size="15" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Group by machine: one shuffle</text><text x="48" y="92" font-size="11.5" font-family="DejaVu Sans Mono, monospace" fill="#1d2330" xml:space="preserve">AdaptiveSparkPlan isFinalPlan=false</text><text x="48" y="117" font-size="11.5" font-family="DejaVu Sans Mono, monospace" fill="#1d2330" xml:space="preserve">+- HashAggregate(keys=[machine_id], sum(units_made))</text><rect x="40" y="127" width="450" height="24" rx="4" fill="#fff4d6" stroke="#e2c46b" stroke-width="1" /><text x="48" y="142" font-size="11.5" font-family="DejaVu Sans Mono, monospace" fill="#1d2330" xml:space="preserve">   +- Exchange hashpartitioning(machine_id, 8)</text><text x="48" y="167" font-size="11.5" font-family="DejaVu Sans Mono, monospace" fill="#1d2330" xml:space="preserve">      +- HashAggregate(partial_sum(units_made))</text><text x="48" y="192" font-size="11.5" font-family="DejaVu Sans Mono, monospace" fill="#1d2330" xml:space="preserve">         +- Project [machine_id, units_made]</text><text x="48" y="217" font-size="11.5" font-family="DejaVu Sans Mono, monospace" fill="#1d2330" xml:space="preserve">            +- FileScan parquet [machine_id, units_made]</text><text x="48" y="268" font-size="12" fill="#b23b3b" font-weight="bold" text-anchor="start">Exchange = the shuffle: rows for a machine move together</text><rect x="543" y="34" width="470" height="250" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="540" y="30" width="470" height="250" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><path d="M540,38 a8,8 0 0 1 8,-8 H1002 a8,8 0 0 1 8,8 V64 H540 Z" fill="#2f7d6d"/><text x="552" y="53" font-size="15" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">One day, two columns: no shuffle</text><text x="558" y="92" font-size="11.5" font-family="DejaVu Sans Mono, monospace" fill="#1d2330" xml:space="preserve">*(1) Project [machine_id, temperature_c]</text><text x="558" y="117" font-size="11.5" font-family="DejaVu Sans Mono, monospace" fill="#1d2330" xml:space="preserve">+- *(1) Filter (plant = Bhiwandi Main)</text><text x="558" y="142" font-size="11.5" font-family="DejaVu Sans Mono, monospace" fill="#1d2330" xml:space="preserve">   +- *(1) ColumnarToRow</text><text x="558" y="167" font-size="11.5" font-family="DejaVu Sans Mono, monospace" fill="#1d2330" xml:space="preserve">      +- FileScan parquet</text><rect x="550" y="177" width="450" height="24" rx="4" fill="#fff4d6" stroke="#e2c46b" stroke-width="1" /><text x="558" y="192" font-size="11.5" font-family="DejaVu Sans Mono, monospace" fill="#1d2330" xml:space="preserve">             PartitionFilters: [reading_date = 2025-12-01]</text><rect x="550" y="202" width="450" height="24" rx="4" fill="#fff4d6" stroke="#e2c46b" stroke-width="1" /><text x="558" y="217" font-size="11.5" font-family="DejaVu Sans Mono, monospace" fill="#1d2330" xml:space="preserve">             PushedFilters: [EqualTo(plant, Bhiwandi Main)]</text><rect x="550" y="227" width="450" height="24" rx="4" fill="#fff4d6" stroke="#e2c46b" stroke-width="1" /><text x="558" y="242" font-size="11.5" font-family="DejaVu Sans Mono, monospace" fill="#1d2330" xml:space="preserve">             ReadSchema: machine_id, plant, temperature_c</text><text x="558" y="268" font-size="12" fill="#2f7d6d" font-weight="bold" text-anchor="start">PartitionFilters and ReadSchema = work never done</text><rect x="30" y="300" width="980" height="64" rx="7" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="46" y="326" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">Read a plan from the bottom up. Count the exchanges: each one writes data to disk, sends it, and reads it back.</text><text x="46" y="348" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Then look at the scan: PartitionFilters skip whole folders, ReadSchema shows which columns are read at all.</text></svg>