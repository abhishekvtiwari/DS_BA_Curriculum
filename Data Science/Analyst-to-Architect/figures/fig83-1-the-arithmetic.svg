–67</text><text x="342" y="462" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">762–978 hours</text><text x="846" y="462" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">2.4 to 3.1 years</text><text x="42" y="508" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">Being hirable is a quarter of the book. That is the number nobody is given, and it is the one you can plan against.</text></svg>