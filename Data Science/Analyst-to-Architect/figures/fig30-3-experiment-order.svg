<svg xmlns="http://www.w3.org/2000/svg" width="680" height="350" viewBox="0 0 680 350" font-family="DejaVu Sans, Arial, sans-serif"><rect width="680" height="350" fill="#ffffff"/><text x="16" y="26" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">An experiment, in the order the decisions are made</text><rect x="16" y="44" width="70" height="30" rx="5" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="51" y="64" font-size="10.5" fill="#5b6475" font-weight="bold" text-anchor="middle">Before</text><rect x="94" y="44" width="570" height="30" rx="5" fill="#fff" stroke="#0f5c8c" stroke-width="1.4" /><text x="106" y="64" font-size="11" fill="#0f5c8c" font-weight="bold" text-anchor="start">Question and change</text><text x="300" y="64" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">the shorter enquiry form</text><rect x="16" y="80" width="70" height="30" rx="5" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="51" y="100" font-size="10.5" fill="#5b6475" font-weight="bold" text-anchor="middle">Before</text><rect x="94" y="80" width="570" height="30" rx="5" fill="#fff" stroke="#0f5c8c" stroke-width="1.4" /><text x="106" y="100" font-size="11" fill="#0f5c8c" font-weight="bold" text-anchor="start">Primary metric, guardrails</text><text x="300" y="100" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">enquiry rate per visitor; pages, sessions, value</text><rect x="16" y="116" width="70" height="30" rx="5" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="51" y="136" font-size="10.5" fill="#5b6475" font-weight="bold" text-anchor="middle">Before</text><rect x="94" y="116" width="570" height="30" rx="5" fill="#fff" stroke="#7a4fa0" stroke-width="1.4" /><text x="106" y="136" font-size="11" fill="#7a4fa0" font-weight="bold" text-anchor="start">MDE and sample size</text><text x="300" y="136" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">0.5 pp → 25,000 per group</text><rect x="16" y="152" width="70" height="30" rx="5" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="51" y="172" font-size="10.5" fill="#5b6475" font-weight="bold" text-anchor="middle">Before</text><rect x="94" y="152" width="570" height="30" rx="5" fill="#fff" stroke="#7a4fa0" stroke-width="1.4" /><text x="106" y="172" font-size="11" fill="#7a4fa0" font-weight="bold" text-anchor="start">Duration, stopping rule</text><text x="300" y="172" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">two whole weeks, no interim decisions</text><path d="M16,190 H664" fill="none" stroke="#1d2330" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="7,4"/><text x="664" y="186" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="end">▲ above the line: written down before any visitor is randomized</text><rect x="16" y="200" width="70" height="30" rx="5" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="51" y="220" font-size="10.5" fill="#5b6475" font-weight="bold" text-anchor="middle">During</text><rect x="94" y="200" width="570" height="30" rx="5" fill="#fff" stroke="#2f7d6d" stroke-width="1.4" /><text x="106" y="220" font-size="11" fill="#2f7d6d" font-weight="bold" text-anchor="start">Randomize by visitor</text><text x="300" y="220" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">50/50, and watch the guardrails</text><rect x="16" y="236" width="70" height="30" rx="5" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="51" y="256" font-size="10.5" fill="#5b6475" font-weight="bold" text-anchor="middle">After</text><rect x="94" y="236" width="570" height="30" rx="5" fill="#fff" stroke="#b35a1f" stroke-width="1.4" /><text x="106" y="256" font-size="11" fill="#b35a1f" font-weight="bold" text-anchor="start">Sample-ratio check</text><text x="300" y="256" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">chi-square on group sizes: failed here</text><rect x="16" y="272" width="70" height="30" rx="5" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="51" y="292" font-size="10.5" fill="#5b6475" font-weight="bold" text-anchor="middle">After</text><rect x="94" y="272" width="570" height="30" rx="5" fill="#fff" stroke="#2f7d6d" stroke-width="1.4" /><text x="106" y="292" font-size="11" fill="#2f7d6d" font-weight="bold" text-anchor="start">Primary metric with CI</text><text x="300" y="292" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">+0.55 pp (0.19 to 0.91), p = 0.0026</text><rect x="16" y="308" width="70" height="30" rx="5" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="51" y="328" font-size="10.5" fill="#5b6475" font-weight="bold" text-anchor="middle">After</text><rect x="94" y="308" width="570" height="30" rx="5" fill="#fff" stroke="#2f7d6d" stroke-width="1.4" /><text x="106" y="328" font-size="11" fill="#2f7d6d" font-weight="bold" text-anchor="start">Effect size, decision</text><text x="300" y="328" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">+14% relative; ship, fix the Safari tag</text></svg>