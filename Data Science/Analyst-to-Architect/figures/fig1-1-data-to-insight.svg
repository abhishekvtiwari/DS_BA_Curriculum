<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="500" viewBox="0 0 1030 500" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1030" height="500" fill="#ffffff"/><rect x="33" y="254" width="232" height="190" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="30" y="250" width="232" height="190" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><path d="M30,258 a8,8 0 0 1 8,-8 H254 a8,8 0 0 1 8,8 V304 H30 Z" fill="#0f5c8c"/><text x="44" y="274" font-size="15" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">DATA</text><text x="44" y="294" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="start">Raw recorded facts</text><text x="44" y="330" font-size="12.5" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-style="italic">What was recorded?</text><text x="44" y="356" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">12 order rows, e.g.</text><text x="44" y="375" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">5009 · 2026-02-25 · Shipped</text><text x="44" y="394" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">5012 · 2026-03-15 · Pending</text><path d="M264,280 H278" fill="none" stroke="#5b6475" stroke-width="2" stroke-linejoin="round"/><path d="M278,275 L284,280 L278,285 Z" fill="#5b6475"/><rect x="283" y="192" width="232" height="252" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="280" y="188" width="232" height="252" rx="8" fill="#fff" stroke="#7a4fa0" stroke-width="1.6" /><path d="M280,196 a8,8 0 0 1 8,-8 H504 a8,8 0 0 1 8,8 V242 H280 Z" fill="#7a4fa0"/><text x="294" y="212" font-size="15" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">INFORMATION</text><text x="294" y="232" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="start">Facts organized for a question</text><text x="294" y="268" font-size="12.5" fill="#7a4fa0" font-weight="bold" text-anchor="start" font-style="italic">What happened?</text><text x="294" y="294" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">Revenue by month:</text><text x="294" y="313" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">Jan ₹104,210</text><text x="294" y="332" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">Feb ₹161,700</text><text x="294" y="351" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">Mar ₹31,800</text><path d="M514,218 H528" fill="none" stroke="#5b6475" stroke-width="2" stroke-linejoin="round"/><path d="M528,213 L534,218 L528,223 Z" fill="#5b6475"/><rect x="533" y="130" width="232" height="314" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="530" y="126" width="232" height="314" rx="8" fill="#fff" stroke="#c0662b" stroke-width="1.6" /><path d="M530,134 a8,8 0 0 1 8,-8 H754 a8,8 0 0 1 8,8 V180 H530 Z" fill="#c0662b"/><text x="544" y="150" font-size="15" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">KNOWLEDGE</text><text x="544" y="170" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="start">Understanding why</text><text x="544" y="206" font-size="12.5" fill="#c0662b" font-weight="bold" text-anchor="start" font-style="italic">Why did it happen?</text><text x="544" y="232" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">A few big wholesale orders</text><text x="544" y="251" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">drive revenue. March had none,</text><text x="544" y="270" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">and a ₹26,220 order is</text><text x="544" y="289" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">still Pending.</text><path d="M764,156 H778" fill="none" stroke="#5b6475" stroke-width="2" stroke-linejoin="round"/><path d="M778,151 L784,156 L778,161 Z" fill="#5b6475"/><rect x="783" y="68" width="232" height="376" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="780" y="64" width="232" height="376" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><path d="M780,72 a8,8 0 0 1 8,-8 H1004 a8,8 0 0 1 8,8 V118 H780 Z" fill="#2f7d6d"/><text x="794" y="88" font-size="15" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">INSIGHT</text><text x="794" y="108" font-size="11.5" fill="#ffffff" font-weight="normal" text-anchor="start">A conclusion someone can act on</text><text x="794" y="144" font-size="12.5" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-style="italic">So what do we do?</text><text x="794" y="170" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">March is not a collapse.</text><text x="794" y="189" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">Ship the pending order and</text><text x="794" y="208" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">follow up with the big</text><text x="794" y="227" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">wholesale buyers this week.</text><path d="M30,462 H1012" fill="none" stroke="#c9d3df" stroke-width="1.5" stroke-linejoin="round"/><text x="30" y="484" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start">Each step up needs more context and more thinking, and is worth more to the business.</text></svg>