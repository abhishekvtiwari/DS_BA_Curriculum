<svg xmlns="http://www.w3.org/2000/svg" width="720" height="498" viewBox="0 0 720 498" font-family="DejaVu Sans, Arial, sans-serif"><rect width="720" height="498" fill="#ffffff"/><rect x="77" y="24" width="214" height="92" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="74" y="20" width="214" height="92" rx="8" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="88" y="48" font-size="15" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">4  INSIGHT</text><text x="88" y="72" font-size="11.5" fill="#fff" font-weight="normal" text-anchor="start">A conclusion someone can act on</text><rect x="298" y="20" width="402" height="92" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><text x="312" y="44" font-size="12.5" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-style="italic">So what should we do?</text><text x="312" y="68" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">March is not a collapse. Ship the pending order and</text><text x="312" y="87" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">call the big wholesale buyers this week.</text><path d="M172.0,128 V122" fill="none" stroke="#5b6475" stroke-width="2" stroke-linejoin="round"/><path d="M167.0,123 L172.0,116 L177.0,123 Z" fill="#5b6475"/><rect x="59" y="134" width="214" height="92" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="56" y="130" width="214" height="92" rx="8" fill="#c0662b" stroke="none" stroke-width="1" /><text x="70" y="158" font-size="15" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">3  KNOWLEDGE</text><text x="70" y="182" font-size="11.5" fill="#fff" font-weight="normal" text-anchor="start">An understanding of why</text><rect x="280" y="130" width="420" height="92" rx="8" fill="#fff" stroke="#c0662b" stroke-width="1.6" /><text x="294" y="154" font-size="12.5" fill="#c0662b" font-weight="bold" text-anchor="start" font-style="italic">Why did it happen?</text><text x="294" y="178" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">A few big wholesale orders drive revenue. March had</text><text x="294" y="197" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">none, and a ₹26,220 order is still Pending.</text><path d="M154.0,238 V232" fill="none" stroke="#5b6475" stroke-width="2" stroke-linejoin="round"/><path d="M149.0,233 L154.0,226 L159.0,233 Z" fill="#5b6475"/><rect x="41" y="244" width="214" height="92" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="38" y="240" width="214" height="92" rx="8" fill="#7a4fa0" stroke="none" stroke-width="1" /><text x="52" y="268" font-size="15" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">2  INFORMATION</text><text x="52" y="292" font-size="11.5" fill="#fff" font-weight="normal" text-anchor="start">Facts organized for a question</text><rect x="262" y="240" width="438" height="92" rx="8" fill="#fff" stroke="#7a4fa0" stroke-width="1.6" /><text x="276" y="264" font-size="12.5" fill="#7a4fa0" font-weight="bold" text-anchor="start" font-style="italic">What happened?</text><text x="276" y="288" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Delivered and shipped orders by month:</text><text x="276" y="307" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Jan ₹1,04,210 · Feb ₹1,61,700 · Mar ₹31,800</text><path d="M136.0,348 V342" fill="none" stroke="#5b6475" stroke-width="2" stroke-linejoin="round"/><path d="M131.0,343 L136.0,336 L141.0,343 Z" fill="#5b6475"/><rect x="23" y="354" width="214" height="92" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="20" y="350" width="214" height="92" rx="8" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="34" y="378" font-size="15" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">1  DATA</text><text x="34" y="402" font-size="11.5" fill="#fff" font-weight="normal" text-anchor="start">Raw recorded facts</text><rect x="244" y="350" width="456" height="92" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><text x="258" y="374" font-size="12.5" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-style="italic">What was recorded?</text><text x="258" y="396" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">12 order rows, for example:</text><text x="258" y="414" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">5009 · 2026-02-25 · Shipped</text><text x="258" y="432" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">5012 · 2026-03-15 · Pending</text><path d="M20,460 H700" fill="none" stroke="#c9d3df" stroke-width="1.5" stroke-linejoin="round"/><text x="20" y="482" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Each step up needs more context and more thinking, and is worth more to the business.</text></svg>