<svg xmlns="http://www.w3.org/2000/svg" width="620" height="266" viewBox="0 0 620 266" font-family="DejaVu Sans, Arial, sans-serif"><rect width="620" height="266" fill="#ffffff"/><text x="10" y="20" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The pieces of Power BI, and where each one runs</text><rect x="12" y="37" width="170" height="104" rx="6" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="10" y="34" width="170" height="104" rx="6" fill="#fff" stroke="#0f5c8c" stroke-width="1.4" /><path d="M10,40 a6,6 0 0 1 6,-6 H174 a6,6 0 0 1 6,6 V55 H10 Z" fill="#0f5c8c"/><text x="18" y="49" font-size="10.2" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Power BI Desktop</text><text x="18.0" y="70.0" font-size="9.8" fill="#1d2330" font-weight="normal" text-anchor="start">Windows, free</text><text x="18.0" y="83.5" font-size="9.8" fill="#1d2330" font-weight="normal" text-anchor="start">Power Query: get, clean</text><text x="18.0" y="97.0" font-size="9.8" fill="#1d2330" font-weight="normal" text-anchor="start">Model and relationships</text><text x="18.0" y="110.5" font-size="9.8" fill="#1d2330" font-weight="normal" text-anchor="start">DAX measures, pages</text><text x="18.0" y="124.0" font-size="9.8" fill="#1d2330" font-weight="normal" text-anchor="start">Saved as one .pbix file</text><rect x="227" y="37" width="170" height="104" rx="6" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="225" y="34" width="170" height="104" rx="6" fill="#fff" stroke="#2f7d6d" stroke-width="1.4" /><path d="M225,40 a6,6 0 0 1 6,-6 H389 a6,6 0 0 1 6,6 V55 H225 Z" fill="#2f7d6d"/><text x="233" y="49" font-size="10.2" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Power BI Service</text><text x="233.0" y="70.0" font-size="9.8" fill="#1d2330" font-weight="normal" text-anchor="start">In the browser</text><text x="233.0" y="83.5" font-size="9.8" fill="#1d2330" font-weight="normal" text-anchor="start">Workspaces hold content</text><text x="233.0" y="97.0" font-size="9.8" fill="#1d2330" font-weight="normal" text-anchor="start">Semantic model: data + DAX</text><text x="233.0" y="110.5" font-size="9.8" fill="#1d2330" font-weight="normal" text-anchor="start">Refresh, apps, sharing</text><text x="233.0" y="124.0" font-size="9.8" fill="#1d2330" font-weight="normal" text-anchor="start">Row-level security</text><rect x="442" y="37" width="170" height="104" rx="6" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="440" y="34" width="170" height="104" rx="6" fill="#fff" stroke="#7a4fa0" stroke-width="1.4" /><path d="M440,40 a6,6 0 0 1 6,-6 H604 a6,6 0 0 1 6,6 V55 H440 Z" fill="#7a4fa0"/><text x="448" y="49" font-size="10.2" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Readers</text><text x="448.0" y="70.0" font-size="9.8" fill="#1d2330" font-weight="normal" text-anchor="start">Browser or mobile app</text><text x="448.0" y="83.5" font-size="9.8" fill="#1d2330" font-weight="normal" text-anchor="start">An app or a shared link</text><text x="448.0" y="97.0" font-size="9.8" fill="#1d2330" font-weight="normal" text-anchor="start">A licence to view</text><text x="448.0" y="110.5" font-size="9.8" fill="#1d2330" font-weight="normal" text-anchor="start">Export to Excel or PDF</text><text x="448.0" y="124.0" font-size="9.8" fill="#1d2330" font-weight="normal" text-anchor="start">Email subscriptions</text><path d="M182,84 L221,84" fill="none" stroke="#5b6475" stroke-width="1.4" stroke-linejoin="round"/><path d="M221,84 L215.6,86.6 L215.6,81.4 Z" fill="#5b6475"/><text x="201" y="78" font-size="9.2" fill="#5b6475" font-weight="normal" text-anchor="middle">publish</text><path d="M397,84 L436,84" fill="none" stroke="#5b6475" stroke-width="1.4" stroke-linejoin="round"/><path d="M436,84 L430.6,86.6 L430.6,81.4 Z" fill="#5b6475"/><text x="416" y="78" font-size="9.2" fill="#5b6475" font-weight="normal" text-anchor="middle">share</text><rect x="12" y="193" width="170" height="64" rx="6" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="10" y="190" width="170" height="64" rx="6" fill="#fff" stroke="#b7791f" stroke-width="1.4" /><path d="M10,196 a6,6 0 0 1 6,-6 H174 a6,6 0 0 1 6,6 V211 H10 Z" fill="#b7791f"/><text x="18" y="205" font-size="10.2" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Your data sources</text><text x="18.0" y="226.0" font-size="9.8" fill="#1d2330" font-weight="normal" text-anchor="start">riverstone_full database</text><text x="18.0" y="239.5" font-size="9.8" fill="#1d2330" font-weight="normal" text-anchor="start">CSV, Excel, SharePoint</text><rect x="227" y="193" width="170" height="64" rx="6" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="225" y="190" width="170" height="64" rx="6" fill="#fff" stroke="#c0662b" stroke-width="1.4" /><path d="M225,196 a6,6 0 0 1 6,-6 H389 a6,6 0 0 1 6,6 V211 H225 Z" fill="#c0662b"/><text x="233" y="205" font-size="10.2" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">On-premises gateway</text><text x="233.0" y="226.0" font-size="9.8" fill="#1d2330" font-weight="normal" text-anchor="start">For data inside the network</text><text x="233.0" y="239.5" font-size="9.8" fill="#1d2330" font-weight="normal" text-anchor="start">Runs on a server there</text><path d="M95,188 L95,142" fill="none" stroke="#5b6475" stroke-width="1.4" stroke-linejoin="round"/><path d="M95,142 L97.6,147.4 L92.4,147.4 Z" fill="#5b6475"/><text x="101" y="168" font-size="9.2" fill="#5b6475" font-weight="normal" text-anchor="start">import</text><path d="M310,188 L310,142" fill="none" stroke="#c0662b" stroke-width="1.4" stroke-linejoin="round"/><path d="M310,142 L312.6,147.4 L307.4,147.4 Z" fill="#c0662b"/><text x="316" y="168" font-size="9.2" fill="#5b6475" font-weight="normal" text