<svg xmlns="http://www.w3.org/2000/svg" width="700" height="320" viewBox="0 0 700 320" font-family="DejaVu Sans, Arial, sans-serif"><rect width="700" height="320" fill="#ffffff"/><text x="20" y="28" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">One question, five small tools: order lines by city</text><rect x="20" y="50" width="116" height="104" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="2" /><text x="78.0" y="74" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">cut -d, -f5</text><text x="78.0" y="98" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="middle">keep column 5</text><text x="78.0" y="114" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="middle">(the city)</text><text x="78.0" y="144" font-size="11" fill="#0f5c8c" font-weight="bold" text-anchor="middle">327 lines</text><path d="M138,102 H148" fill="none" stroke="#1d2330" stroke-width="1.8" stroke-linejoin="round"/><path d="M147,97 L155,102 L147,107 Z" fill="#1d2330"/><rect x="156" y="50" width="116" height="104" rx="7" fill="#fff" stroke="#7a4fa0" stroke-width="2" /><text x="214.0" y="74" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">tail -n +2</text><text x="214.0" y="98" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="middle">drop the</text><text x="214.0" y="114" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="middle">header row</text><text x="214.0" y="144" font-size="11" fill="#7a4fa0" font-weight="bold" text-anchor="middle">326 lines</text><path d="M274,102 H284" fill="none" stroke="#1d2330" stroke-width="1.8" stroke-linejoin="round"/><path d="M283,97 L291,102 L283,107 Z" fill="#1d2330"/><rect x="292" y="50" width="116" height="104" rx="7" fill="#fff" stroke="#2f7d6d" stroke-width="2" /><text x="350.0" y="74" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">sort</text><text x="350.0" y="98" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="middle">put identical</text><text x="350.0" y="114" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="middle">cities together</text><text x="350.0" y="144" font-size="11" fill="#2f7d6d" font-weight="bold" text-anchor="middle">326 lines</text><path d="M410,102 H420" fill="none" stroke="#1d2330" stroke-width="1.8" stroke-linejoin="round"/><path d="M419,97 L427,102 L419,107 Z" fill="#1d2330"/><rect x="428" y="50" width="116" height="104" rx="7" fill="#fff" stroke="#c0662b" stroke-width="2" /><text x="486.0" y="74" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">uniq -c</text><text x="486.0" y="98" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="middle">collapse and</text><text x="486.0" y="114" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="middle">count each run</text><text x="486.0" y="144" font-size="11" fill="#c0662b" font-weight="bold" text-anchor="middle">16 lines</text><path d="M546,102 H556" fill="none" stroke="#1d2330" stroke-width="1.8" stroke-linejoin="round"/><path d="M555,97 L563,102 L555,107 Z" fill="#1d2330"/><rect x="564" y="50" width="116" height="104" rx="7" fill="#fff" stroke="#2f7d6d" stroke-width="2" /><text x="622.0" y="74" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">sort -nr</text><text x="622.0" y="98" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="middle">biggest</text><text x="622.0" y="114" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="middle">first</text><text x="622.0" y="144" font-size="11" fill="#2f7d6d" font-weight="bold" text-anchor="middle">16 lines</text><rect x="20" y="176" width="230" height="104" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="38" y="198" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">74 Mumbai</text><text x="38" y="216" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">42 Pune</text><text x="38" y="234" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">34 Bengaluru</text><text x="38" y="252" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">28 Delhi</text><text x="38" y="270" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">21 Kochi</text><text x="276" y="198" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">Each tool reads what the one before it wrote.</text><text x="276" y="217" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">Nothing is saved in between, so the same command</text><text x="276" y="236" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">works on a 2 GB file on a server with no Excel.</text><text x="276" y="255" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">The 16 lines after uniq -c are the 16 cities;</text><text x="276" y="274" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">head -5 then keeps the top five.</text><text x="20" y="306" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Forgetting sort before uniq -c is the classic bug: uniq only collapses lines that are already next to each other.</text></svg>