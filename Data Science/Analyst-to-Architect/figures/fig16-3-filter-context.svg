<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" font-family="DejaVu Sans, Arial, sans-serif"><rect width="980" height="420" fill="#ffffff"/><text x="30" y="32" font-size="14.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Where a measure&#x27;s filters come from</text><rect x="30" y="60" width="300" height="190" rx="8" fill="#fff" stroke="#c9d3df" stroke-width="1" /><text x="46" y="84" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">A cell in a visual</text><rect x="46" y="102" width="268" height="24" rx="4" fill="#eef2f7" stroke="#0f5c8c" stroke-width="1" /><text x="56" y="118" font-size="10.8" fill="#1d2330" font-weight="normal" text-anchor="start">Rows: Segment = Wholesale</text><rect x="46" y="134" width="268" height="24" rx="4" fill="#eef2f7" stroke="#0f5c8c" stroke-width="1" /><text x="56" y="150" font-size="10.8" fill="#1d2330" font-weight="normal" text-anchor="start">Columns: Year = 2025</text><rect x="46" y="166" width="268" height="24" rx="4" fill="#eef2f7" stroke="#0f5c8c" stroke-width="1" /><text x="56" y="182" font-size="10.8" fill="#1d2330" font-weight="normal" text-anchor="start">Slicer: Region = West</text><rect x="46" y="198" width="268" height="24" rx="4" fill="#eef2f7" stroke="#0f5c8c" stroke-width="1" /><text x="56" y="214" font-size="10.8" fill="#1d2330" font-weight="normal" text-anchor="start">Page filter: Status ≠ Cancelled</text><text x="46" y="238" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Together: the filter context</text><path d="M334,155 L392,155" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M392,155 L385.7,158.0 L385.7,152.0 Z" fill="#5b6475"/><text x="336" y="146" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">applied to</text><rect x="403" y="84" width="320" height="150" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="400" y="80" width="320" height="150" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><path d="M400,88 a8,8 0 0 1 8,-8 H712 a8,8 0 0 1 8,8 V106 H400 Z" fill="#2f7d6d"/><text x="411" y="98" font-size="11.8" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The measure</text><text x="411" y="125" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="start">Net Revenue =</text><text x="411" y="142" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="start">  SUMX(Sales,</text><text x="411" y="159" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="start">    Sales[quantity] * Sales[unit_price]</text><text x="411" y="176" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="start">    * (1 - Sales[discount_pct] / 100))</text><text x="411" y="193" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="start"></text><text x="411" y="210" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="start">Evaluated once per cell</text><path d="M724,155 L782,155" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M782,155 L775.7,158.0 L775.7,152.0 Z" fill="#5b6475"/><rect x="790" y="120" width="160" height="70" rx="8" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="870" y="152" font-size="14" fill="#fff" font-weight="bold" text-anchor="middle">₹8.5 crore</text><text x="870" y="174" font-size="10.5" fill="#fff" font-weight="normal" text-anchor="middle">one number</text><rect x="30" y="282" width="920" height="120" rx="8" fill="#fff" stroke="#7a4fa0" stroke-width="1.6" /><rect x="30" y="282" width="8" height="120" rx="0" fill="#7a4fa0" stroke="none" stroke-width="1" /><text x="52" y="308" font-size="12.8" fill="#1d2330" font-weight="bold" text-anchor="start">CALCULATE changes the filter context before the measure runs</text><text x="52" y="334" font-size="11.2" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">CALCULATE([Net Revenue], Customer[segment] = &quot;Retail&quot;)</text><text x="52" y="356" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">replaces the Segment filter  ·  REMOVEFILTERS() clears it  ·  KEEPFILTERS() adds to it instead of replacing</text><text x="52" y="378" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">CALCULATE([Net Revenue], DATESYTD(Date[date])) replaces the date filter with &quot;year so far&quot;</text></svg>