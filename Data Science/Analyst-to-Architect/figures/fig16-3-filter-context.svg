<svg xmlns="http://www.w3.org/2000/svg" width="620" height="306" viewBox="0 0 620 306" font-family="DejaVu Sans, Arial, sans-serif"><rect width="620" height="306" fill="#ffffff"/><text x="10" y="20" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Where a measure&#x27;s filters come from</text><rect x="10" y="34" width="196" height="132" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1" /><text x="20" y="52" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">A cell in a visual</text><rect x="20" y="62" width="176" height="21" rx="4" fill="#eef2f7" stroke="#0f5c8c" stroke-width="1" /><text x="28" y="76.5" font-size="9.8" fill="#1d2330" font-weight="normal" text-anchor="start">Rows: Segment = Wholesale</text><rect x="20" y="90" width="176" height="21" rx="4" fill="#eef2f7" stroke="#0f5c8c" stroke-width="1" /><text x="28" y="104.5" font-size="9.8" fill="#1d2330" font-weight="normal" text-anchor="start">Columns: Year = 2025</text><rect x="20" y="118" width="176" height="21" rx="4" fill="#eef2f7" stroke="#0f5c8c" stroke-width="1" /><text x="28" y="132.5" font-size="9.8" fill="#1d2330" font-weight="normal" text-anchor="start">Slicer: Region = West</text><text x="20" y="156" font-size="9.8" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Together: the filter context</text><path d="M208,100 L244,100" fill="none" stroke="#5b6475" stroke-width="1.4" stroke-linejoin="round"/><path d="M244,100 L238.6,102.6 L238.6,97.4 Z" fill="#5b6475"/><text x="226" y="93" font-size="9.2" fill="#5b6475" font-weight="normal" text-anchor="middle">applied to</text><rect x="250" y="55" width="196" height="96" rx="6" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="248" y="52" width="196" height="96" rx="6" fill="#fff" stroke="#2f7d6d" stroke-width="1.4" /><path d="M248,58 a6,6 0 0 1 6,-6 H438 a6,6 0 0 1 6,6 V73 H248 Z" fill="#2f7d6d"/><text x="256" y="67" font-size="10.2" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The measure</text><text x="256.0" y="88" font-size="9.2" fill="#1d2330" font-weight="normal" text-anchor="start">Net Revenue =</text><text x="267.04" y="101" font-size="9.2" fill="#1d2330" font-weight="normal" text-anchor="start">SUM ( Sales[net_revenue] )</text><text x="256.0" y="114" font-size="9.2" fill="#1d2330" font-weight="normal" text-anchor="start"></text><text x="256.0" y="127" font-size="9.2" fill="#1d2330" font-weight="normal" text-anchor="start">Evaluated once per cell</text><path d="M446,100 L480,100" fill="none" stroke="#5b6475" stroke-width="1.4" stroke-linejoin="round"/><path d="M480,100 L474.6,102.6 L474.6,97.4 Z" fill="#5b6475"/><rect x="484" y="66" width="126" height="68" rx="6" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="547" y="96" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">₹10.5 crore</text><text x="547" y="116" font-size="9.8" fill="#fff" font-weight="normal" text-anchor="middle">one number</text><rect x="10" y="182" width="600" height="112" rx="6" fill="#fff" stroke="#7a4fa0" stroke-width="1.4" /><rect x="10" y="182" width="6" height="112" rx="0" fill="#7a4fa0" stroke="none" stroke-width="1" /><text x="26" y="202" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">CALCULATE changes the filter context before the measure runs</text><text x="26" y="222" font-size="9.2" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">CALCULATE ( [Net Revenue], Customer[Segment] = &quot;Retail&quot; )</text><text x="26" y="238" font-size="9.8" fill="#5b6475" font-weight="normal" text-anchor="start">replaces the Segment filter · REMOVEFILTERS clears it · KEEPFILTERS adds to it instead</text><text x="26" y="262" font-size="9.2" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">CALCULATE ( [Net Revenue], DATESYTD ( &#x27;Date&#x27;[Date] ) )</text><text x="26" y="278" font-size="9.8" fill="#5b6475" font-weight="normal" text-anchor="start">replaces the date filter with &quot;the year so far&quot;</text></svg>