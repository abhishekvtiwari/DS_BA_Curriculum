<svg xmlns="http://www.w3.org/2000/svg" width="780" height="590" viewBox="0 0 780 590" font-family="DejaVu Sans, Arial, sans-serif"><rect width="780" height="590" fill="#ffffff"/><rect x="19" y="20" width="450" height="554" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="16" y="16" width="450" height="554" rx="8" fill="#fff" stroke="#c9d3df" stroke-width="1.4" /><text x="34" y="50" font-size="15" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">At-risk customers: a one-page write-up</text><rect x="34" y="72" width="5" height="52" rx="2" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="50" y="87" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">The question</text><text x="50" y="105" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Which regular customers have stopped ordering, and</text><text x="50" y="121" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">what should sales do?</text><rect x="34" y="142" width="5" height="52" rx="2" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="50" y="157" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">The data</text><text x="50" y="175" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Riverstone one-year database, 2025: orders,</text><text x="50" y="191" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">customers (fictional)</text><rect x="34" y="212" width="5" height="52" rx="2" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="50" y="227" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">The approach</text><text x="50" y="245" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Each customer&#x27;s usual gap between orders vs days</text><text x="50" y="261" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">since last order</text><rect x="34" y="282" width="5" height="52" rx="2" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="50" y="297" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">The result</text><text x="50" y="315" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Two regular customers silent for over five months;</text><text x="50" y="331" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">table and chart</text><rect x="34" y="352" width="5" height="52" rx="2" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="50" y="367" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">The check</text><text x="50" y="385" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Hand-checked one customer; totals reconciled to</text><text x="50" y="401" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">annual revenue</text><rect x="34" y="422" width="5" height="52" rx="2" fill="#c0662b" stroke="none" stroke-width="1" /><text x="50" y="437" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">The decision</text><text x="50" y="455" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Call both this week; send the list to reps every</text><text x="50" y="471" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Monday</text><rect x="34" y="492" width="5" height="52" rx="2" fill="#7a4fa0" stroke="none" stroke-width="1" /><text x="50" y="507" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">What I&#x27;d do next</text><text x="50" y="525" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Automate the Monday email; add payment delays as a</text><text x="50" y="541" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">signal</text><rect x="490" y="67.0" width="276" height="62" rx="6" fill="#fbfcfe" stroke="#0f5c8c" stroke-width="1.3" /><text x="502" y="87.0" font-size="12.5" fill="#0f5c8c" font-weight="bold" text-anchor="start">Start with the business question</text><text x="502" y="105.0" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Not with the tool you used.</text><path d="M470,98 H486" fill="none" stroke="#0f5c8c" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="4 3"/><rect x="490" y="277.0" width="276" height="62" rx="6" fill="#fbfcfe" stroke="#2f7d6d" stroke-width="1.3" /><text x="502" y="297.0" font-size="12.5" fill="#2f7d6d" font-weight="bold" text-anchor="start">Show the result a manager reads</text><text x="502" y="315.0" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">One table or chart, clearly labeled.</text><path d="M470,308 H486" fill="none" stroke="#2f7d6d" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="4 3"/><rect x="490" y="347.0" width="276" height="62" rx="6" fill="#fbfcfe" stroke="#2f7d6d" stroke-width="1.3" /><text x="502" y="367.0" font-size="12.5" fill="#2f7d6d" font-weight="bold" text-anchor="start">Show that you checked it</text><text x="502" y="385.0" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">This is what separates you</text><text x="502" y="400.0" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">from copy-paste.</text><path d="M470,378 H486" fill="none" stroke="#2f7d6d" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="4 3"/><rect x="490" y="417.0" width="276" height="62" rx="6" fill="#fbfcfe" stroke="#c0662b" stroke-width="1.3" /><text x="502" y="437.0" font-size="12.5" fill="#c0662b" font-weight="bold" text-anchor="start">End in a decision</text><text x="502" y="455.0" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Every technique ends in</text><text x="502" y="470.0" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">something someone can do.</text><path d="M470,448 H486" fill="none" stroke="#c0662b" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="4 3"/><rect x="490" y="487.0" width="276" height="62" rx="6" fill="#fbfcfe" stroke="#7a4fa0" stroke-width="1.3" /><text x="502" y="507.0" font-size="12.5" fill="#7a4fa0" font-weight="bold" text-anchor="start">Say what you’d improve</text><text x="502" y="525.0" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">It shows judgment, and invites</text><text x="502" y="540.0" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">the interview question.</text><path d="M470,518 H486" fill="none" stroke="#7a4fa0" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="4 3"/></svg>