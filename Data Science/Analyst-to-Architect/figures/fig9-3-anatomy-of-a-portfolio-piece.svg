<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="544" viewBox="0 0 1040 544" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1040" height="544" fill="#ffffff"/><rect x="33" y="28" width="520" height="496" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="30" y="24" width="520" height="496" rx="8" fill="#fff" stroke="#c9d3df" stroke-width="1.4" /><text x="48" y="56" font-size="15" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">At-risk customers: a one-page write-up</text><rect x="48" y="74" width="5" height="44" rx="2" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="64" y="90" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">The question</text><text x="64" y="108" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Which regular customers have stopped ordering, and what should</text><text x="64" y="124" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">sales do?</text><rect x="48" y="136" width="5" height="44" rx="2" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="64" y="152" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">The data</text><text x="64" y="170" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Riverstone one-year database, 2025: orders, customers</text><text x="64" y="186" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">(fictional)</text><rect x="48" y="198" width="5" height="44" rx="2" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="64" y="214" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">The approach</text><text x="64" y="232" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Each customer&#x27;s usual gap between orders vs days since last</text><text x="64" y="248" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">order</text><rect x="48" y="260" width="5" height="44" rx="2" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="64" y="276" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">The result</text><text x="64" y="294" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Two regular customers silent for over five months; table and</text><text x="64" y="310" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">chart</text><rect x="48" y="322" width="5" height="44" rx="2" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="64" y="338" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">The check</text><text x="64" y="356" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Hand-checked one customer; totals reconciled to annual revenue</text><rect x="48" y="384" width="5" height="44" rx="2" fill="#c0662b" stroke="none" stroke-width="1" /><text x="64" y="400" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">The decision</text><text x="64" y="418" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Call both this week; send the list to reps every Monday</text><rect x="48" y="446" width="5" height="44" rx="2" fill="#7a4fa0" stroke="none" stroke-width="1" /><text x="64" y="462" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">What I&#x27;d do next</text><text x="64" y="480" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Automate the Monday email; add payment delays as a signal</text><rect x="610" y="72" width="400" height="50" rx="6" fill="#fbfcfe" stroke="#0f5c8c" stroke-width="1.3" /><text x="624" y="93" font-size="13" fill="#0f5c8c" font-weight="bold" text-anchor="start">Start with the business question</text><text x="624" y="112" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Not with the tool you used.</text><path d="M554,96 H606" fill="none" stroke="#0f5c8c" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="4 3"/><rect x="610" y="258" width="400" height="50" rx="6" fill="#fbfcfe" stroke="#2f7d6d" stroke-width="1.3" /><text x="624" y="279" font-size="13" fill="#2f7d6d" font-weight="bold" text-anchor="start">Show the result a manager reads</text><text x="624" y="298" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">One table or chart, clearly labeled.</text><path d="M554,282 H606" fill="none" stroke="#2f7d6d" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="4 3"/><rect x="610" y="320" width="400" height="50" rx="6" fill="#fbfcfe" stroke="#2f7d6d" stroke-width="1.3" /><text x="624" y="341" font-size="13" fill="#2f7d6d" font-weight="bold" text-anchor="start">Show that you checked it</text><text x="624" y="360" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">This is what separates you from copy-paste.</text><path d="M554,344 H606" fill="none" stroke="#2f7d6d" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="4 3"/><rect x="610" y="382" width="400" height="50" rx="6" fill="#fbfcfe" stroke="#c0662b" stroke-width="1.3" /><text x="624" y="403" font-size="13" fill="#c0662b" font-weight="bold" text-anchor="start">End in a decision</text><text x="624" y="422" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Every technique ends in something someone can do.</text><path d="M554,406 H606" fill="none" stroke="#c0662b" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="4 3"/><rect x="610" y="444" width="400" height="50" rx="6" fill="#fbfcfe" stroke="#7a4fa0" stroke-width="1.3" /><text x="624" y="465" font-size="13" fill="#7a4fa0" font-weight="bold" text-anchor="start">Say what you&#x27;d improve</text><text x="624" y="484" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">It shows judgment, and invites the interview question.</text><path d="M554,468 H606" fill="none" stroke="#7a4fa0" stroke-width="1.4" stroke-linejoin="round" stroke-dasharray="4 3"/></svg>