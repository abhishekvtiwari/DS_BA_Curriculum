<svg xmlns="http://www.w3.org/2000/svg" width="680" height="411" viewBox="0 0 680 411" font-family="DejaVu Sans, Arial, sans-serif"><rect width="680" height="411" fill="#ffffff"/><text x="12" y="22" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Is Riverstone ready for a data mesh? Five questions, scored 1 to 5</text><text x="12" y="42" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">Scale: 1 = absent · 3 = partly in place · 5 = working company-wide</text><text x="302.0" y="64" font-size="10.5" fill="#5b6475" font-weight="bold" text-anchor="middle">1</text><text x="358.0" y="64" font-size="10.5" fill="#5b6475" font-weight="bold" text-anchor="middle">2</text><text x="414.0" y="64" font-size="10.5" fill="#5b6475" font-weight="bold" text-anchor="middle">3</text><text x="470.0" y="64" font-size="10.5" fill="#5b6475" font-weight="bold" text-anchor="middle">4</text><text x="526.0" y="64" font-size="10.5" fill="#5b6475" font-weight="bold" text-anchor="middle">5</text><rect x="12" y="72" width="656" height="1" rx="0" fill="#c9d3df" stroke="none" stroke-width="1" /><text x="12" y="94.0" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start">Domain teams able to own data</text><rect x="276.0" y="83" width="52.0" height="16" rx="3" fill="#0f5c8c" stroke="#0f5c8c" stroke-width="1" /><rect x="332.0" y="83" width="52.0" height="16" rx="3" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="388.0" y="83" width="52.0" height="16" rx="3" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="444.0" y="83" width="52.0" height="16" rx="3" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="500.0" y="83" width="52.0" height="16" rx="3" fill="#fff" stroke="#c9d3df" stroke-width="1" /><text x="568" y="96" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start">1 / 5</text><text x="610" y="96" font-size="10.5" fill="#b23b3b" font-weight="bold" text-anchor="start">blocker</text><text x="20" y="114.5" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">One data platform team; sales, operations, and the plant have no builders of their own.</text><rect x="12" y="123.6" width="656" height="1" rx="0" fill="#c9d3df" stroke="none" stroke-width="1" /><text x="12" y="145.6" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start">A self-serve platform</text><rect x="276.0" y="134.6" width="52.0" height="16" rx="3" fill="#0f5c8c" stroke="#0f5c8c" stroke-width="1" /><rect x="332.0" y="134.6" width="52.0" height="16" rx="3" fill="#0f5c8c" stroke="#0f5c8c" stroke-width="1" /><rect x="388.0" y="134.6" width="52.0" height="16" rx="3" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="444.0" y="134.6" width="52.0" height="16" rx="3" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="500.0" y="134.6" width="52.0" height="16" rx="3" fill="#fff" stroke="#c9d3df" stroke-width="1" /><text x="568" y="147.6" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start">2 / 5</text><text x="20" y="166.1" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">Dagster and the warehouse exist, but no domain has used them without the platform team.</text><rect x="12" y="175.2" width="656" height="1" rx="0" fill="#c9d3df" stroke="none" stroke-width="1" /><text x="12" y="197.2" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start">Federated governance</text><rect x="276.0" y="186.2" width="52.0" height="16" rx="3" fill="#0f5c8c" stroke="#0f5c8c" stroke-width="1" /><rect x="332.0" y="186.2" width="52.0" height="16" rx="3" fill="#0f5c8c" stroke="#0f5c8c" stroke-width="1" /><rect x="388.0" y="186.2" width="52.0" height="16" rx="3" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="444.0" y="186.2" width="52.0" height="16" rx="3" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="500.0" y="186.2" width="52.0" height="16" rx="3" fill="#fff" stroke="#c9d3df" stroke-width="1" /><text x="568" y="199.2" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start">2 / 5</text><text x="20" y="217.7" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">A data contract (Chapter 47) exists for one feed, the Bhiwandi dispatch file, not as a company standard.</text><rect x="12" y="226.79999999999998" width="656" height="1" rx="0" fill="#c9d3df" stroke="none" stroke-width="1" /><text x="12" y="248.79999999999998" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start">A data-product mindset</text><rect x="276.0" y="237.79999999999998" width="52.0" height="16" rx="3" fill="#0f5c8c" stroke="#0f5c8c" stroke-width="1" /><rect x="332.0" y="237.79999999999998" width="52.0" height="16" rx="3" fill="#0f5c8c" stroke="#0f5c8c" stroke-width="1" /><rect x="388.0" y="237.79999999999998" width="52.0" height="16" rx="3" fill="#0f5c8c" stroke="#0f5c8c" stroke-width="1" /><rect x="444.0" y="237.79999999999998" width="52.0" height="16" rx="3" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="500.0" y="237.79999999999998" width="52.0" height="16" rx="3" fill="#fff" stroke="#c9d3df" stroke-width="1" /><text x="568" y="250.79999999999998" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start">3 / 5</text><text x="20" y="269.29999999999995" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">Chapter 60&#x27;s containers each have an owner and non-functional requirements: a real start.</text><rect x="12" y="278.4" width="656" height="1" rx="0" fill="#c9d3df" stroke="none" stroke-width="1" /><text x="12" y="300.4" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start">Appetite for the change</text><rect x="276.0" y="289.4" width="52.0" height="16" rx="3" fill="#0f5c8c" stroke="#0f5c8c" stroke-width="1" /><rect x="332.0" y="289.4" width="52.0" height="16" rx="3" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="388.0" y="289.4" width="52.0" height="16" rx="3" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="444.0" y="289.4" width="52.0" height="16" rx="3" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="500.0" y="289.4" width="52.0" height="16" rx="3" fill="#fff" stroke="#c9d3df" stroke-width="1" /><text x="568" y="302.4" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start">1 / 5</text><text x="610" y="302.4" font-size="10.5" fill="#b23b3b" font-weight="bold" text-anchor="start">blocker</text><text x="20" y="320.9" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">No domain outside the platform team has asked to own its data.</text><rect x="12" y="330.0" width="656" height="1.5" rx="0" fill="#1d2330" stroke="none" stroke-width="1" /><text x="12" y="350.0" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start">Total</text><text x="568" y="350.0" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start">9 / 25</text><rect x="12" y="362.0" width="656" height="41.2" rx="5" fill="#fff" stroke="#b23b3b" stroke-width="1.4" /><rect x="12" y="362.0" width="6" height="41.2" rx="0" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="28" y="379.5" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Rule: any question at 1, or a total under 15, means not ready. Riverstone has two at 1 and a total of 9: not ready, and</text><text x="28" y="393.1" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">that&#x27;s fine. Revisit when a business domain with its own builder asks to own its data.</text></svg>