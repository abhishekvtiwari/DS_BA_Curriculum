ext x="484" y="326" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">CSV</text><text x="670" y="326" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="end">14.6 MB</text><text x="484" y="349" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">SQLite table</text><text x="670" y="349" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="end">16.3 MB</text><text x="484" y="372" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">Parquet</text><text x="670" y="372" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="end">1.3 MB</text><text x="484" y="394" font-size="12" fill="#2f7d6d" font-weight="bold" text-anchor="start">Values of one kind sit together, so</text><text x="484" y="412" font-size="12" fill="#2f7d6d" font-weight="bold" text-anchor="start">Parquet is about 11 times smaller.</text><circle cx="33" cy="514" r="8" fill="none" stroke="#2f7d6d" stroke-width="1.8"/><path d="M29,514 L32,517.5 L37.5,510" fill="none" stroke="#2f7d6d" stroke-width="1.8" stroke-linejoin="round"/><text x="48" y="519" font-size="13" fill="#2f7d6d" font-weight="bold" text-anchor="start">Average temperature: reads one stripe; the other seven are never touched.</text></svg>