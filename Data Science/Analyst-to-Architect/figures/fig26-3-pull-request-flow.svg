<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="530" viewBox="0 0 1260 530" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1260" height="530" fill="#ffffff"/><text x="40" y="38" font-size="15.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">From a branch to merged: the loop you will run every working day</text><text x="40" y="62" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">The unit of work on a team is not a commit. It is a pull request.</text><path d="M80,136 H1180" fill="none" stroke="#5b6475" stroke-width="3" stroke-linejoin="round"/><text x="40" y="141" font-size="13" fill="#5b6475" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">main</text><text x="40" y="247" font-size="13" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">branch</text><path d="M250,136 C290,136 290,242 340,242" fill="none" stroke="#0f5c8c" stroke-width="3" stroke-linejoin="round"/><path d="M340,242 H980" fill="none" stroke="#0f5c8c" stroke-width="3" stroke-linejoin="round"/><path d="M980,242 C1030,242 1030,136 1070,136" fill="none" stroke="#0f5c8c" stroke-width="3" stroke-linejoin="round"/><circle cx="140" cy="136" r="8" fill="#fff" stroke="#5b6475" stroke-width="2.6"/><circle cx="250" cy="136" r="8" fill="#fff" stroke="#5b6475" stroke-width="2.6"/><circle cx="1070" cy="136" r="8" fill="#fff" stroke="#5b6475" stroke-width="2.6"/><circle cx="1150" cy="136" r="8" fill="#fff" stroke="#5b6475" stroke-width="2.6"/><circle cx="400" cy="242" r="8" fill="#fff" stroke="#0f5c8c" stroke-width="2.6"/><circle cx="540" cy="242" r="8" fill="#fff" stroke="#0f5c8c" stroke-width="2.6"/><circle cx="680" cy="242" r="8" fill="#fff" stroke="#0f5c8c" stroke-width="2.6"/><text x="256" y="92" font-size="11" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">git switch -c</text><text x="256" y="109" font-size="11" fill="#0f5c8c" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">fix-cancelled-orders</text><text x="540" y="174" font-size="11" fill="#0f5c8c" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">commit, commit, commit</text><text x="540" y="191" font-size="11" fill="#0f5c8c" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">small and reviewable</text><text x="820" y="174" font-size="11" fill="#1f6fa3" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">git push -u origin</text><text x="820" y="191" font-size="11" fill="#1f6fa3" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">&lt;branch&gt;</text><text x="1076" y="92" font-size="11" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">git merge</text><text x="1076" y="109" font-size="11" fill="#2f7d6d" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">(via the pull request)</text><rect x="652" y="301" width="340" height="150" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="650" y="298" width="340" height="150" rx="8" fill="#fff" stroke="#7a4fa0" stroke-width="1.8" /><path d="M650,306 a8,8 0 0 1 8,-8 H982 a8,8 0 0 1 8,8 V334 H650 Z" fill="#7a4fa0"/><text x="664" y="323" font-size="13" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The pull request</text><text x="664" y="358" font-size="11" fill="#5b6475" font-weight="bold" text-anchor="start">Title</text><text x="756" y="358" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">says what changed, not &quot;fix query&quot;</text><text x="664" y="382" font-size="11" fill="#5b6475" font-weight="bold" text-anchor="start">Description</text><text x="756" y="382" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">what, why, and how you checked</text><text x="664" y="406" font-size="11" fill="#5b6475" font-weight="bold" text-anchor="start">Review</text><text x="756" y="406" font-size="11" fill="#7a4fa0" font-weight="normal" text-anchor="start">questions before demands</text><text x="664" y="430" font-size="11" fill="#5b6475" font-weight="bold" text-anchor="start">Check</text><text x="756" y="430" font-size="11" fill="#2f7d6d" font-weight="normal" text-anchor="start">green before it can merge</text><path d="M820.0,298 V250" fill="none" stroke="#7a4fa0" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="4 4"/><circle cx="820.0" cy="242" r="5" fill="#7a4fa0"/><path d="M40,482 H1220" fill="none" stroke="#c9d3df" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="4 4"/><text x="40" y="510" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">Nothing here is optional at work. Even a one-line change goes round this loop, which is why the loop has to be cheap.</text></svg>