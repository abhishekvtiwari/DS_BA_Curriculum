<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="474" viewBox="0 0 1040 474" font-family="DejaVu Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1040" height="474" fill="#ffffff"/><rect x="30" y="30" width="980" height="50" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><rect x="30" y="30" width="8" height="50" rx="3" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="52" y="52" font-size="12.5" font-family="DejaVu Sans Mono, monospace" fill="#1d2330">FROM python:3.12-slim</text><text x="560" y="60" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">base image: small, official</text><path d="M520,80 L520,92" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M520,92 L516.1,83.9 L523.9,83.9 Z" fill="#5b6475"/><rect x="30" y="92" width="980" height="50" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><rect x="30" y="92" width="8" height="50" rx="3" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="52" y="114" font-size="12.5" font-family="DejaVu Sans Mono, monospace" fill="#1d2330">RUN apt-get install libpq-dev</text><text x="560" y="122" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">system packages, cache cleaned</text><path d="M520,142 L520,154" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M520,154 L516.1,145.9 L523.9,145.9 Z" fill="#5b6475"/><rect x="30" y="154" width="980" height="50" rx="7" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><rect x="30" y="154" width="8" height="50" rx="3" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="52" y="176" font-size="12.5" font-family="DejaVu Sans Mono, monospace" fill="#1d2330">COPY requirements.txt .</text><text x="52" y="193" font-size="12.5" font-family="DejaVu Sans Mono, monospace" fill="#1d2330">RUN pip install</text><text x="560" y="184" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">dependencies: rebuilds only when this file changes</text><path d="M520,204 L520,216" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M520,216 L516.1,207.9 L523.9,207.9 Z" fill="#5b6475"/><rect x="30" y="216" width="980" height="50" rx="7" fill="#fff" stroke="#c0662b" stroke-width="1.6" /><rect x="30" y="216" width="8" height="50" rx="3" fill="#c0662b" stroke="none" stroke-width="1" /><text x="52" y="238" font-size="12.5" font-family="DejaVu Sans Mono, monospace" fill="#1d2330">COPY *.py .</text><text x="560" y="246" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">application code: this is what usually changes</text><path d="M520,266 L520,278" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M520,278 L516.1,269.9 L523.9,269.9 Z" fill="#5b6475"/><rect x="30" y="278" width="980" height="50" rx="7" fill="#fff" stroke="#7a4fa0" stroke-width="1.6" /><rect x="30" y="278" width="8" height="50" rx="3" fill="#7a4fa0" stroke="none" stroke-width="1" /><text x="52" y="300" font-size="12.5" font-family="DejaVu Sans Mono, monospace" fill="#1d2330">RUN useradd; USER pipeline</text><text x="560" y="308" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">drop root before anything runs</text><path d="M520,328 L520,340" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M520,340 L516.1,331.9 L523.9,331.9 Z" fill="#5b6475"/><rect x="30" y="340" width="980" height="50" rx="7" fill="#fff" stroke="#5b6475" stroke-width="1.6" /><rect x="30" y="340" width="8" height="50" rx="3" fill="#5b6475" stroke="none" stroke-width="1" /><text x="52" y="362" font-size="12.5" font-family="DejaVu Sans Mono, monospace" fill="#1d2330">CMD ["dagster", "dev", ...]</text><text x="560" y="370" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">what runs when a container starts</text><rect x="30" y="408" width="980" height="52" rx="7" fill="#fff4e8" stroke="#c0662b" stroke-width="1" /><text x="46" y="430" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Layers 1-3 rarely change and stay cached. Editing ingest.py only rebuilds from layer 4 down.</text><text x="46" y="448" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">That ordering, dependencies before code, is the single biggest speed-up available to a Dockerfile.</text></svg>