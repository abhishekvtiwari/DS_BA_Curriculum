<svg xmlns="http://www.w3.org/2000/svg" width="720" height="438" viewBox="0 0 720 438" font-family="DejaVu Sans, Arial, sans-serif"><rect width="720" height="438" fill="#ffffff"/><rect x="16" y="16" width="688" height="34" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><rect x="16" y="16" width="30" height="34" rx="4" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="31" y="38.0" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">1</text><text x="56" y="37.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">FROM python:3.14-slim</text><text x="420" y="37.5" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">base image: small and official</text><path d="M360,50 L360,60" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M360,60 L356.1,51.9 L363.9,51.9 Z" fill="#5b6475"/><rect x="16" y="60" width="688" height="34" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><rect x="16" y="60" width="30" height="34" rx="4" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="31" y="82.0" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">2</text><text x="56" y="81.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">RUN useradd --create-home pipeline</text><text x="420" y="81.5" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">the user to run as, made once</text><path d="M360,94 L360,104" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M360,104 L356.1,95.9 L363.9,95.9 Z" fill="#5b6475"/><rect x="16" y="104" width="688" height="66" rx="7" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><rect x="16" y="104" width="30" height="66" rx="4" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="31" y="142.0" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">3</text><text x="56" y="125.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">WORKDIR /app</text><text x="56" y="141.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">COPY requirements.txt .</text><text x="56" y="157.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">RUN pip install ...</text><text x="420" y="133.5" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">dependencies: rebuilt only when</text><text x="420" y="149.5" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">requirements.txt changes</text><path d="M360,170 L360,180" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M360,180 L356.1,171.9 L363.9,171.9 Z" fill="#5b6475"/><rect x="16" y="180" width="688" height="50" rx="7" fill="#fff" stroke="#c0662b" stroke-width="1.6" /><rect x="16" y="180" width="30" height="50" rx="4" fill="#c0662b" stroke="none" stroke-width="1" /><text x="31" y="210.0" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">4</text><text x="56" y="201.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">COPY ingest.py riverstone_pipeline.py</text><text x="56" y="217.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">  run_flash.py ./</text><text x="420" y="201.5" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">application code:</text><text x="420" y="217.5" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">what usually changes</text><path d="M360,230 L360,240" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M360,240 L356.1,231.9 L363.9,231.9 Z" fill="#5b6475"/><rect x="16" y="240" width="688" height="34" rx="7" fill="#fff" stroke="#c0662b" stroke-width="1.6" /><rect x="16" y="240" width="30" height="34" rx="4" fill="#c0662b" stroke="none" stroke-width="1" /><text x="31" y="262.0" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">5</text><text x="56" y="261.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">RUN mkdir ... &amp;&amp; chown ...</text><text x="420" y="261.5" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">folders the pipeline writes to</text><path d="M360,274 L360,284" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M360,284 L356.1,275.9 L363.9,275.9 Z" fill="#5b6475"/><rect x="16" y="284" width="688" height="34" rx="7" fill="#fff" stroke="#7a4fa0" stroke-width="1.6" /><rect x="16" y="284" width="30" height="34" rx="4" fill="#7a4fa0" stroke="none" stroke-width="1" /><text x="31" y="306.0" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">6</text><text x="56" y="305.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">ENV ...   USER pipeline</text><text x="420" y="305.5" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">settings; stop being root</text><path d="M360,318 L360,328" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M360,328 L356.1,319.9 L363.9,319.9 Z" fill="#5b6475"/><rect x="16" y="328" width="688" height="34" rx="7" fill="#fff" stroke="#5b6475" stroke-width="1.6" /><rect x="16" y="328" width="30" height="34" rx="4" fill="#5b6475" stroke="none" stroke-width="1" /><text x="31" y="350.0" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">7</text><text x="56" y="349.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">CMD [&quot;python&quot;, &quot;run_flash.py&quot;]</text><text x="420" y="349.5" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">what runs when a container starts</text><rect x="16" y="374" width="688" height="52" rx="7" fill="#fff4e8" stroke="#c0662b" stroke-width="1" /><text x="30" y="395" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">Steps 1–3 rarely change, so Docker reuses them from its cache.</text><text x="30" y="415" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Editing ingest.py rebuilds from step 4 down: seconds, not minutes.</text></svg>