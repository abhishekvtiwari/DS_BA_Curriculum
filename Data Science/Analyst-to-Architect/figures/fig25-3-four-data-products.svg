<svg xmlns="http://www.w3.org/2000/svg" width="1272" height="376" viewBox="0 0 1272 376" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1272" height="376" fill="#ffffff"/><text x="30" y="34" font-size="15" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The four things a data team is asked to build, and what each requirement must pin down</text><text x="30" y="56" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Ask the wrong set of questions and you will build something that works and nobody uses.</text><rect x="32" y="81" width="288" height="272" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="30" y="78" width="288" height="272" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><path d="M30,86 a8,8 0 0 1 8,-8 H310 a8,8 0 0 1 8,8 V114 H30 Z" fill="#0f5c8c"/><text x="44" y="102" font-size="13.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Report or dashboard</text><circle cx="50" cy="136" r="3" fill="#0f5c8c"/><text x="62" y="140" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Who opens it, how often?</text><circle cx="50" cy="160" r="3" fill="#0f5c8c"/><text x="62" y="164" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">What do they do next?</text><circle cx="50" cy="184" r="3" fill="#0f5c8c"/><text x="62" y="188" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">What is one row?</text><circle cx="50" cy="208" r="3" fill="#0f5c8c"/><text x="62" y="212" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Default date range?</text><circle cx="50" cy="232" r="3" fill="#0f5c8c"/><text x="62" y="236" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Who may see which rows?</text><rect x="40" y="270" width="268" height="68" rx="6" fill="#f6f9fc" stroke="none" stroke-width="1" /><text x="50" y="290" font-size="10" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">HOW IT FAILS</text><text x="50" y="308" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">Fails by answering a question</text><text x="50" y="323" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">the reader already knew</text><rect x="340" y="81" width="288" height="272" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="338" y="78" width="288" height="272" rx="8" fill="#fff" stroke="#1f6fa3" stroke-width="1.6" /><path d="M338,86 a8,8 0 0 1 8,-8 H618 a8,8 0 0 1 8,8 V114 H338 Z" fill="#1f6fa3"/><text x="352" y="102" font-size="13.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Pipeline</text><circle cx="358" cy="136" r="3" fill="#1f6fa3"/><text x="370" y="140" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">What is the source of truth?</text><circle cx="358" cy="160" r="3" fill="#1f6fa3"/><text x="370" y="164" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">What happens when it is late?</text><circle cx="358" cy="184" r="3" fill="#1f6fa3"/><text x="370" y="188" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">What happens when the past</text><text x="370" y="203" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">changes?</text><circle cx="358" cy="223" r="3" fill="#1f6fa3"/><text x="370" y="227" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Rerun twice: same result?</text><circle cx="358" cy="247" r="3" fill="#1f6fa3"/><text x="370" y="251" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Who is alerted, and how fast?</text><rect x="348" y="270" width="268" height="68" rx="6" fill="#f6f9fc" stroke="none" stroke-width="1" /><text x="358" y="290" font-size="10" fill="#1f6fa3" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">HOW IT FAILS</text><text x="358" y="308" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">Fails by running green and being</text><text x="358" y="323" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">quietly wrong</text><rect x="648" y="81" width="288" height="272" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="646" y="78" width="288" height="272" rx="8" fill="#fff" stroke="#7a4fa0" stroke-width="1.6" /><path d="M646,86 a8,8 0 0 1 8,-8 H926 a8,8 0 0 1 8,8 V114 H646 Z" fill="#7a4fa0"/><text x="660" y="102" font-size="13.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Model</text><circle cx="666" cy="136" r="3" fill="#7a4fa0"/><text x="678" y="140" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">What decision does it serve?</text><circle cx="666" cy="160" r="3" fill="#7a4fa0"/><text x="678" y="164" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">What does each mistake cost?</text><circle cx="666" cy="184" r="3" fill="#7a4fa0"/><text x="678" y="188" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">What is it compared against?</text><circle cx="666" cy="208" r="3" fill="#7a4fa0"/><text x="678" y="212" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Who is never scored?</text><circle cx="666" cy="232" r="3" fill="#7a4fa0"/><text x="678" y="236" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">What is written out with the</text><text x="678" y="251" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">score?</text><rect x="656" y="270" width="268" height="68" rx="6" fill="#f6f9fc" stroke="none" stroke-width="1" /><text x="666" y="290" font-size="10" fill="#7a4fa0" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">HOW IT FAILS</text><text x="666" y="308" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">Fails by being accurate while</text><text x="666" y="323" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">nobody changes what they do</text><rect x="956" y="81" width="288" height="272" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="954" y="78" width="288" height="272" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><path d="M954,86 a8,8 0 0 1 8,-8 H1234 a8,8 0 0 1 8,8 V114 H954 Z" fill="#2f7d6d"/><text x="968" y="102" font-size="13.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Metric definition</text><circle cx="974" cy="136" r="3" fill="#2f7d6d"/><text x="986" y="140" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">What exactly is counted?</text><circle cx="974" cy="160" r="3" fill="#2f7d6d"/><text x="986" y="164" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">What is excluded?</text><circle cx="974" cy="184" r="3" fill="#2f7d6d"/><text x="986" y="188" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Which teams must agree?</text><circle cx="974" cy="208" r="3" fill="#2f7d6d"/><text x="986" y="212" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Where does the definition</text><text x="986" y="227" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">live?</text><circle cx="974" cy="247" r="3" fill="#2f7d6d"/><text x="986" y="251" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">How is a change announced?</text><rect x="964" y="270" width="268" height="68" rx="6" fill="#f6f9fc" stroke="none" stroke-width="1" /><text x="974" y="290" font-size="10" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">HOW IT FAILS</text><text x="974" y="308" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">Fails by living inside a query,</text><text x="974" y="323" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">reinvented by every new report</text></svg>