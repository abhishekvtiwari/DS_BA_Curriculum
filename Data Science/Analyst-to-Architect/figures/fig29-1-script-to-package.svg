<svg xmlns="http://www.w3.org/2000/svg" width="800" height="392" viewBox="0 0 800 392" font-family="DejaVu Sans, Arial, sans-serif"><rect width="800" height="392" fill="#ffffff"/><text x="20" y="30" font-size="16" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">From one script to a package</text><text x="20" y="62" font-size="13" fill="#b23b3b" font-weight="bold" text-anchor="start">Before: monthly_report.py (40 lines)</text><rect x="20" y="76" width="300" height="28" rx="4" fill="#fbeaea" stroke="#b23b3b" stroke-width="1.2" /><text x="32" y="95" font-size="13" fill="#b23b3b" font-weight="bold" text-anchor="start">✗</text><text x="50" y="95" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">connect with a password in the code</text><rect x="20" y="110" width="300" height="28" rx="4" fill="#fbeaea" stroke="#b23b3b" stroke-width="1.2" /><text x="32" y="129" font-size="13" fill="#b23b3b" font-weight="bold" text-anchor="start">✗</text><text x="50" y="129" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">hard-coded month and file name</text><rect x="20" y="144" width="300" height="28" rx="4" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="50" y="163" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">load every order line, filter in pandas</text><rect x="20" y="178" width="300" height="28" rx="4" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="50" y="197" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">calculate, print</text><rect x="20" y="212" width="300" height="28" rx="4" fill="#fbeaea" stroke="#b23b3b" stroke-width="1.2" /><text x="32" y="231" font-size="13" fill="#b23b3b" font-weight="bold" text-anchor="start">✗</text><text x="50" y="231" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">bare except: target = 0</text><rect x="20" y="246" width="300" height="28" rx="4" fill="#fbeaea" stroke="#b23b3b" stroke-width="1.2" /><text x="32" y="265" font-size="13" fill="#b23b3b" font-weight="bold" text-anchor="start">✗</text><text x="50" y="265" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">write Monthly_Report_Dec_FINAL.xlsx</text><rect x="20" y="280" width="300" height="28" rx="4" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="50" y="299" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">print(&#x27;done&#x27;)</text><rect x="20" y="322" width="14" height="14" rx="2" fill="#fbeaea" stroke="#b23b3b" stroke-width="1.2" /><text x="27" y="334" font-size="12" fill="#b23b3b" font-weight="bold" text-anchor="middle">✗</text><text x="42" y="333" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">a problem this chapter fixes</text><text x="20" y="358" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Everything in one file, run top to bottom.</text><path d="M330,196 H352" fill="none" stroke="#1d2330" stroke-width="2.5" stroke-linejoin="round"/><path d="M344,189 L354,196 L344,203" fill="none" stroke="#1d2330" stroke-width="2.5" stroke-linejoin="round"/><text x="368" y="62" font-size="13" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">After: riverstone-report/</text><text x="368" y="88" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">pyproject.toml</text><text x="554" y="88" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">what it needs; tools; the command</text><text x="368" y="113" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">uv.lock</text><text x="554" y="113" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">exact versions of all 58 packages</text><text x="368" y="138" font-size="12.5" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">src/riverstone_report/</text><text x="388" y="163" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">config.py</text><text x="554" y="163" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">settings, checked</text><text x="388" y="188" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">db.py</text><text x="554" y="188" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">the only module with SQL</text><text x="388" y="213" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">transform.py</text><text x="554" y="213" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">pure calculations</text><text x="388" y="238" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">excel.py</text><text x="554" y="238" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">the formatted workbook</text><text x="388" y="263" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">crm_client.py</text><text x="554" y="263" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">retries, pages, rate limits</text><text x="388" y="288" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">cli.py</text><text x="554" y="288" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">riverstone-report --month</text><text x="388" y="313" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">errors.py</text><text x="554" y="313" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">ReportError and its kinds</text><text x="368" y="338" font-size="12.5" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">tests/</text><text x="554" y="338" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">23 tests</text><text x="368" y="358" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Each file has one job, so each can be read, tested,</text><text x="368" y="376" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">and changed alone.</text></svg>