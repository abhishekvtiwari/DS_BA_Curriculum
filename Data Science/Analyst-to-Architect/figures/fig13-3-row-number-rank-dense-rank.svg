<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" font-family="DejaVu Sans, Arial, sans-serif"><rect width="720" height="280" fill="#ffffff"/><text x="20" y="32" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Units sold, ranked three ways</text><rect x="20" y="40" width="420" height="22" rx="3" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="27" y="55" font-size="11" fill="#fff" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">product_name</text><text x="203" y="55" font-size="11" fill="#fff" font-weight="bold" text-anchor="end" font-family="DejaVu Sans Mono, monospace">units</text><text x="293" y="55" font-size="11" fill="#fff" font-weight="bold" text-anchor="end" font-family="DejaVu Sans Mono, monospace">ROW_NUMBER</text><text x="343" y="55" font-size="11" fill="#fff" font-weight="bold" text-anchor="end" font-family="DejaVu Sans Mono, monospace">RANK</text><text x="433" y="55" font-size="11" fill="#fff" font-weight="bold" text-anchor="end" font-family="DejaVu Sans Mono, monospace">DENSE_RANK</text><rect x="20" y="62" width="420" height="22" rx="0" fill="#fff" stroke="#c9d3df" stroke-width="0.8" /><text x="27" y="77" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Water Bottle 1L</text><text x="203" y="77" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">230</text><text x="293" y="77" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">1</text><text x="343" y="77" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">1</text><text x="433" y="77" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">1</text><rect x="20" y="84" width="420" height="22" rx="0" fill="#fff" stroke="#c9d3df" stroke-width="0.8" /><text x="27" y="99" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Industrial Crate</text><text x="203" y="99" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">125</text><text x="293" y="99" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">2</text><text x="343" y="99" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">2</text><text x="433" y="99" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">2</text><rect x="20" y="106" width="420" height="22" rx="0" fill="#fff4d6" stroke="#c9d3df" stroke-width="0.8" /><text x="27" y="121" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Food Container Set</text><text x="203" y="121" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">85</text><text x="293" y="121" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">3</text><text x="343" y="121" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">3</text><text x="433" y="121" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">3</text><rect x="20" y="128" width="420" height="22" rx="0" fill="#fff4d6" stroke="#c9d3df" stroke-width="0.8" /><text x="27" y="143" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Storage Box 10L</text><text x="203" y="143" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">85</text><text x="293" y="143" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">4</text><text x="343" y="143" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">3</text><text x="433" y="143" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">3</text><rect x="20" y="150" width="420" height="22" rx="0" fill="#fff" stroke="#c9d3df" stroke-width="0.8" /><text x="27" y="165" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Storage Box 25L</text><text x="203" y="165" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">60</text><text x="293" y="165" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">5</text><text x="343" y="165" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">5</text><text x="433" y="165" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">4</text><rect x="20" y="172" width="420" height="22" rx="0" fill="#fff" stroke="#c9d3df" stroke-width="0.8" /><text x="27" y="187" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Garden Chair</text><text x="203" y="187" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">0</text><text x="293" y="187" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">6</text><text x="343" y="187" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">6</text><text x="433" y="187" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">5</text><rect x="20" y="40" width="420" height="154" rx="3" fill="none" stroke="#c9d3df" stroke-width="1" /><text x="20" y="214" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Shaded rows: the tie (85 units each).</text><rect x="452" y="22" width="250" height="76" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="464" y="40" font-size="11.5" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">ROW_NUMBER</text><text x="464" y="58" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Always 1, 2, 3, 4… Ties get different</text><text x="464" y="74" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">numbers, so add a tie-breaker to</text><text x="464" y="90" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">ORDER BY (here: product_name).</text><rect x="452" y="106" width="250" height="76" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="464" y="124" font-size="11.5" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">RANK</text><text x="464" y="142" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Ties share a number, then it skips:</text><text x="464" y="158" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">3, 3, 5. Like a race: two joint</text><text x="464" y="174" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">third places, then fifth.</text><rect x="452" y="190" width="250" height="76" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="464" y="208" font-size="11.5" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">DENSE_RANK</text><text x="464" y="226" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Ties share a number, no gaps:</text><text x="464" y="242" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">3, 3, 4. Use it for &#x27;the top 3</text><text x="464" y="258" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">distinct sales levels&#x27;.</text></svg>