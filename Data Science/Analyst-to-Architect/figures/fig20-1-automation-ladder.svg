<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420" font-family="DejaVu Sans, Arial, sans-serif"><rect width="700" height="420" fill="#ffffff"/><rect x="10" y="306" width="420" height="64" rx="7" fill="#fff" stroke="#5b6475" stroke-width="1.6" /><rect x="10" y="306" width="9" height="64" rx="0" fill="#5b6475" stroke="none" stroke-width="1" /><text x="32" y="328" font-size="13.5" fill="#5b6475" font-weight="bold" text-anchor="start">1  Manual</text><text x="418" y="328" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="end">0 hours saved</text><text x="32" y="346" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">Someone opens the files and does it</text><text x="32" y="362" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">Every time, from scratch</text><rect x="10" y="232" width="485" height="64" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><rect x="10" y="232" width="9" height="64" rx="0" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="32" y="254" font-size="13.5" fill="#0f5c8c" font-weight="bold" text-anchor="start">2  Refreshable</text><text x="483" y="254" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="end">Most of the errors gone</text><text x="32" y="272" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">Power Query, a model, or a saved query</text><text x="32" y="288" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">One click, the same steps</text><rect x="10" y="158" width="550" height="64" rx="7" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><rect x="10" y="158" width="9" height="64" rx="0" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="32" y="180" font-size="13.5" fill="#2f7d6d" font-weight="bold" text-anchor="start">3  Scheduled</text><text x="548" y="180" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="end">The report arrives</text><text x="32" y="198" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">A script runs at a fixed time</text><text x="32" y="214" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">Nobody has to remember</text><rect x="10" y="84" width="615" height="64" rx="7" fill="#fff" stroke="#7a4fa0" stroke-width="1.6" /><rect x="10" y="84" width="9" height="64" rx="0" fill="#7a4fa0" stroke="none" stroke-width="1" /><text x="32" y="106" font-size="13.5" fill="#7a4fa0" font-weight="bold" text-anchor="start">4  Triggered</text><text x="613" y="106" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="end">Minutes, not a day</text><text x="32" y="124" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">It runs when something happens</text><text x="32" y="140" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">New file, form response, threshold</text><rect x="10" y="10" width="680" height="64" rx="7" fill="#fff" stroke="#b7791f" stroke-width="1.6" /><rect x="10" y="10" width="9" height="64" rx="0" fill="#b7791f" stroke="none" stroke-width="1" /><text x="32" y="32" font-size="13.5" fill="#b7791f" font-weight="bold" text-anchor="start">5  Self-serve</text><text x="678" y="32" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="end">You stop being the bottleneck</text><text x="32" y="50" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">People answer their own questions</text><text x="32" y="66" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">A model or dashboard they trust</text><text x="10" y="392" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">Climbing costs effort and adds things that can break:</text><text x="10" y="410" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">every rung above 2 needs logging, a failure alert, and an owner.</text></svg>