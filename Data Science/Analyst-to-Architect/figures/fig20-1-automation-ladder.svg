<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1120" height="460" fill="#ffffff"/><text x="30" y="34" font-size="15" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The analyst&#x27;s automation ladder</text><text x="30" y="56" font-size="11.6" fill="#5b6475" font-weight="normal" text-anchor="start">Each rung removes a different kind of work. Most reports should stop at 3; the ones people ask about hourly belong at 5.</text><rect x="30" y="80" width="280" height="54" rx="7" fill="#fff" stroke="#5b6475" stroke-width="1.6" /><rect x="30" y="80" width="9" height="54" rx="0" fill="#5b6475" stroke="none" stroke-width="1" /><text x="52" y="102" font-size="13.5" fill="#5b6475" font-weight="bold" text-anchor="start">1  Manual</text><text x="52" y="121" font-size="11.4" fill="#1d2330" font-weight="normal" text-anchor="start">Someone opens the files and does it</text><text x="328" y="102" font-size="11.6" fill="#1d2330" font-weight="normal" text-anchor="start">Every time, from scratch</text><text x="328" y="121" font-size="11.4" fill="#5b6475" font-weight="normal" text-anchor="start">0 hours saved</text><rect x="30" y="150" width="400" height="54" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><rect x="30" y="150" width="9" height="54" rx="0" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="52" y="172" font-size="13.5" fill="#0f5c8c" font-weight="bold" text-anchor="start">2  Refreshable</text><text x="52" y="191" font-size="11.4" fill="#1d2330" font-weight="normal" text-anchor="start">Power Query / a model / a saved query</text><text x="448" y="172" font-size="11.6" fill="#1d2330" font-weight="normal" text-anchor="start">One click, same steps</text><text x="448" y="191" font-size="11.4" fill="#5b6475" font-weight="normal" text-anchor="start">Most of the error gone</text><rect x="30" y="220" width="520" height="54" rx="7" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><rect x="30" y="220" width="9" height="54" rx="0" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="52" y="242" font-size="13.5" fill="#2f7d6d" font-weight="bold" text-anchor="start">3  Scheduled</text><text x="52" y="261" font-size="11.4" fill="#1d2330" font-weight="normal" text-anchor="start">A script runs at a fixed time</text><text x="568" y="242" font-size="11.6" fill="#1d2330" font-weight="normal" text-anchor="start">Nobody has to remember</text><text x="568" y="261" font-size="11.4" fill="#5b6475" font-weight="normal" text-anchor="start">The report arrives</text><rect x="30" y="290" width="640" height="54" rx="7" fill="#fff" stroke="#7a4fa0" stroke-width="1.6" /><rect x="30" y="290" width="9" height="54" rx="0" fill="#7a4fa0" stroke="none" stroke-width="1" /><text x="52" y="312" font-size="13.5" fill="#7a4fa0" font-weight="bold" text-anchor="start">4  Triggered</text><text x="52" y="331" font-size="11.4" fill="#1d2330" font-weight="normal" text-anchor="start">It runs when something happens</text><text x="688" y="312" font-size="11.6" fill="#1d2330" font-weight="normal" text-anchor="start">New file, form response, threshold</text><text x="688" y="331" font-size="11.4" fill="#5b6475" font-weight="normal" text-anchor="start">Minutes, not a day</text><rect x="30" y="360" width="760" height="54" rx="7" fill="#fff" stroke="#b7791f" stroke-width="1.6" /><rect x="30" y="360" width="9" height="54" rx="0" fill="#b7791f" stroke="none" stroke-width="1" /><text x="52" y="382" font-size="13.5" fill="#b7791f" font-weight="bold" text-anchor="start">5  Self-serve</text><text x="52" y="401" font-size="11.4" fill="#1d2330" font-weight="normal" text-anchor="start">People answer their own questions</text><text x="808" y="382" font-size="11.6" fill="#1d2330" font-weight="normal" text-anchor="start">A model or dashboard they trust</text><text x="808" y="401" font-size="11.4" fill="#5b6475" font-weight="normal" text-anchor="start">You stop being the bottleneck</text><text x="30" y="442" font-size="11.6" fill="#5b6475" font-weight="normal" text-anchor="start">Climbing costs effort and adds things that can break: every rung above 2 needs logging, failure alerts, and an owner.</text></svg>