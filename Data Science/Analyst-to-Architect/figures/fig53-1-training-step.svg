<svg xmlns="http://www.w3.org/2000/svg" width="820" height="388" viewBox="0 0 820 388" font-family="DejaVu Sans, Arial, sans-serif"><rect width="820" height="388" fill="#ffffff"/><text x="20" y="28" font-size="15" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">One training step, with the numbers from section 53.2</text><text x="20" y="62" font-size="13" fill="#5b6475" font-weight="bold" text-anchor="start">forward pass: predict, then measure how wrong  →</text><rect x="20" y="74" width="150" height="84" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.8" /><text x="95" y="98" font-size="13" fill="#0f5c8c" font-weight="bold" text-anchor="middle">inputs</text><text x="95" y="122" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">x = [1.0, 2.0]</text><rect x="230" y="74" width="150" height="84" rx="8" fill="#fff" stroke="#7a4fa0" stroke-width="1.8" /><text x="305" y="98" font-size="13" fill="#7a4fa0" font-weight="bold" text-anchor="middle">hidden layer</text><text x="305" y="122" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">z1 = [2.1, 0.2]</text><text x="305" y="141" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">ReLU: a1 the same</text><rect x="440" y="74" width="150" height="84" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.8" /><text x="515" y="98" font-size="13" fill="#0f5c8c" font-weight="bold" text-anchor="middle">output</text><text x="515" y="122" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">z2 = 1.420</text><rect x="650" y="74" width="150" height="84" rx="8" fill="#fff" stroke="#b23b3b" stroke-width="1.8" /><text x="725" y="98" font-size="13" fill="#b23b3b" font-weight="bold" text-anchor="middle">loss</text><text x="725" y="122" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">(1.420 - 1.0)²</text><text x="725" y="141" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">= 0.176</text><path d="M174,116 H226" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M218,110 L226,116 L218,122" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M384,116 H436" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M428,110 L436,116 L428,122" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M594,116 H646" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M638,110 L646,116 L638,122" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><text x="20" y="194" font-size="13" fill="#c0662b" font-weight="bold" text-anchor="start">←  backward pass: pass the blame back, in proportion to each input</text><rect x="20" y="206" width="150" height="84" rx="8" fill="#fdf3dc" stroke="#c0662b" stroke-width="1.6" /><text x="95" y="228" font-size="13" fill="#c0662b" font-weight="bold" text-anchor="middle">dW1</text><text x="95" y="252" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">[[0.588, -0.420],</text><text x="95" y="271" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace"> [1.176, -0.840]]</text><rect x="230" y="206" width="150" height="84" rx="8" fill="#fdf3dc" stroke="#c0662b" stroke-width="1.6" /><text x="305" y="228" font-size="13" fill="#c0662b" font-weight="bold" text-anchor="middle">dz1</text><text x="305" y="252" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">[0.588, -0.420]</text><rect x="440" y="206" width="150" height="84" rx="8" fill="#fdf3dc" stroke="#c0662b" stroke-width="1.6" /><text x="515" y="228" font-size="13" fill="#c0662b" font-weight="bold" text-anchor="middle">dW2</text><text x="515" y="252" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">[1.764, 0.168]</text><text x="515" y="271" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">db2 = 0.840</text><rect x="650" y="206" width="150" height="84" rx="8" fill="#fdf3dc" stroke="#c0662b" stroke-width="1.6" /><text x="725" y="228" font-size="13" fill="#c0662b" font-weight="bold" text-anchor="middle">dloss/dz2</text><text x="725" y="252" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">2 × 0.420 = 0.840</text><path d="M226,248 H174" fill="none" stroke="#c0662b" stroke-width="2" stroke-linejoin="round"/><path d="M182,242 L174,248 L182,254" fill="none" stroke="#c0662b" stroke-width="2" stroke-linejoin="round"/><path d="M436,248 H384" fill="none" stroke="#c0662b" stroke-width="2" stroke-linejoin="round"/><path d="M392,242 L384,248 L392,254" fill="none" stroke="#c0662b" stroke-width="2" stroke-linejoin="round"/><path d="M646,248 H594" fill="none" stroke="#c0662b" stroke-width="2" stroke-linejoin="round"/><path d="M602,242 L594,248 L602,254" fill="none" stroke="#c0662b" stroke-width="2" stroke-linejoin="round"/><rect x="20" y="312" width="780" height="62" rx="8" fill="#e2f3ee" stroke="#2f7d6d" stroke-width="1.6" /><text x="38" y="337" font-size="13" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">update:  weight = weight - 0.05 × gradient, for every weight</text><text x="38" y="360" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">prediction 1.420 → 1.019,  loss 0.176 → 0.000.  Repeat thousands to millions of times.</text></svg>