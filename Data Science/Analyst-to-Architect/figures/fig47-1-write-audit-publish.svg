<svg xmlns="http://www.w3.org/2000/svg" width="720" height="376" viewBox="0 0 720 376" font-family="DejaVu Sans, Arial, sans-serif"><rect width="720" height="376" fill="#ffffff"/><rect x="13" y="68" width="204" height="150" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="10" y="64" width="204" height="150" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><path d="M10,72 a8,8 0 0 1 8,-8 H206 a8,8 0 0 1 8,8 V98 H10 Z" fill="#0f5c8c"/><text x="22" y="87" font-size="14" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">1 · Write</text><text x="22" y="122" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Build the day&#x27;s numbers</text><text x="22" y="141" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">into audit.daily_flash_new.</text><text x="22" y="160" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start"></text><text x="22" y="179" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Nobody reads this table.</text><path d="M218,139 L244,139" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M244,139 L235.9,142.9 L235.9,135.1 Z" fill="#1d2330"/><rect x="251" y="68" width="204" height="150" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="248" y="64" width="204" height="150" rx="8" fill="#fff" stroke="#c0662b" stroke-width="1.6" /><path d="M248,72 a8,8 0 0 1 8,-8 H444 a8,8 0 0 1 8,8 V98 H248 Z" fill="#c0662b"/><text x="260" y="87" font-size="14" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">2 · Audit</text><text x="260" y="122" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Tests run on the new table:</text><text x="260" y="141" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">- one row per day</text><text x="260" y="160" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">- revenue not negative</text><text x="260" y="179" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">- orders and revenue</text><text x="260" y="198" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">  match the ERP</text><path d="M456,112 L486,66" fill="none" stroke="#2f7d6d" stroke-width="2" stroke-linejoin="round"/><path d="M486,66 L484.9,74.9 L478.3,70.6 Z" fill="#2f7d6d"/><path d="M456,166 L486,212" fill="none" stroke="#b23b3b" stroke-width="2" stroke-linejoin="round"/><path d="M486,212 L478.3,207.4 L484.9,203.1 Z" fill="#b23b3b"/><rect x="493" y="14" width="222" height="128" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="490" y="10" width="222" height="128" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><path d="M490,18 a8,8 0 0 1 8,-8 H704 a8,8 0 0 1 8,8 V44 H490 Z" fill="#2f7d6d"/><text x="502" y="33" font-size="13" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">3 · All pass: publish</text><text x="502" y="62" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">One transaction replaces the</text><text x="502" y="80" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">day in mart.daily_flash,</text><text x="502" y="98" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">which dashboards and</text><text x="502" y="116" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">analysts read.</text><rect x="493" y="168" width="222" height="128" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="490" y="164" width="222" height="128" rx="8" fill="#fff" stroke="#b23b3b" stroke-width="1.6" /><path d="M490,172 a8,8 0 0 1 8,-8 H704 a8,8 0 0 1 8,8 V198 H490 Z" fill="#b23b3b"/><text x="502" y="187" font-size="13" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Any error: blocked</text><text x="502" y="216" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">mart.daily_flash keeps its</text><text x="502" y="234" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">last good data; an incident</text><text x="502" y="252" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">alert goes to the owner.</text><rect x="10" y="310" width="702" height="56" rx="7" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="24" y="334" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">Readers of the published table only ever see data that passed its tests.</text><text x="24" y="354" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">In Chapter 46 the same failure left a wrong row where anyone could query it.</text></svg>