<svg xmlns="http://www.w3.org/2000/svg" width="720" height="412" viewBox="0 0 720 412" font-family="DejaVu Sans, Arial, sans-serif"><rect width="720" height="412" fill="#ffffff"/><rect x="20" y="20" width="64" height="46" rx="6" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="32" y="50" font-size="18" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">B</text><text x="220" y="38" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start">1 byte  =  one English letter, digit, or space</text><text x="220" y="58" font-size="12" fill="#414a5a" font-weight="normal" text-anchor="start">&#x27;A&#x27; is stored as 01000001</text><rect x="20" y="78" width="90" height="46" rx="6" fill="#1f6fa3" stroke="none" stroke-width="1" /><text x="32" y="108" font-size="18" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">KB</text><text x="220" y="96" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start">1 kilobyte  =  1,000 bytes</text><text x="220" y="116" font-size="12" fill="#414a5a" font-weight="normal" text-anchor="start">a short plain-text email; the 4-order CSV in section 2.5 is 364 bytes</text><rect x="20" y="136" width="116" height="46" rx="6" fill="#7a4fa0" stroke="none" stroke-width="1" /><text x="32" y="166" font-size="18" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">MB</text><text x="220" y="154" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start">1 megabyte  =  1,000 KB</text><text x="220" y="174" font-size="12" fill="#414a5a" font-weight="normal" text-anchor="start">a phone photo is typically a few MB</text><rect x="20" y="194" width="142" height="46" rx="6" fill="#c0662b" stroke="none" stroke-width="1" /><text x="32" y="224" font-size="18" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">GB</text><text x="220" y="212" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start">1 gigabyte  =  1,000 MB</text><text x="220" y="232" font-size="12" fill="#414a5a" font-weight="normal" text-anchor="start">a feature-length film in HD is typically a few GB</text><rect x="20" y="252" width="168" height="46" rx="6" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="32" y="282" font-size="18" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">TB</text><text x="220" y="270" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start">1 terabyte  =  1,000 GB</text><text x="220" y="290" font-size="12" fill="#414a5a" font-weight="normal" text-anchor="start">a typical laptop or external hard drive</text><rect x="20" y="310" width="194" height="46" rx="6" fill="#5b6475" stroke="none" stroke-width="1" /><text x="32" y="340" font-size="18" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">PB</text><text x="220" y="328" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start">1 petabyte  =  1,000 TB</text><text x="220" y="348" font-size="12" fill="#414a5a" font-weight="normal" text-anchor="start">a large company&#x27;s data warehouse, or a video platform&#x27;s library</text><text x="20" y="382" font-size="12" fill="#414a5a" font-weight="normal" text-anchor="start">Each step is 1,000 times the one before.</text><text x="20" y="400" font-size="12" fill="#414a5a" font-weight="normal" text-anchor="start">(Some software counts in steps of 1,024; see the Watch out box below.)</text></svg>