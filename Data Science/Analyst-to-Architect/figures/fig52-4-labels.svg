<svg xmlns="http://www.w3.org/2000/svg" width="720" height="352" viewBox="0 0 720 352" font-family="DejaVu Sans, Arial, sans-serif"><rect width="720" height="352" fill="#ffffff"/><rect x="16" y="20" width="210" height="96" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><text x="30" y="44" font-size="12.5" fill="#0f5c8c" font-weight="bold" text-anchor="start">Deployment flash-page</text><text x="30" y="66" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">replicas: 2</text><text x="30" y="86" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">selector:</text><text x="46" y="104" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">app: flash-page</text><rect x="494" y="20" width="210" height="96" rx="8" fill="#fff" stroke="#7a4fa0" stroke-width="1.6" /><text x="508" y="44" font-size="12.5" fill="#7a4fa0" font-weight="bold" text-anchor="start">Service flash-page</text><text x="508" y="66" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">port 80 → 8080</text><text x="508" y="86" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">selector:</text><text x="524" y="104" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">app: flash-page</text><rect x="250" y="192" width="120" height="78" rx="8" fill="#eaf5f1" stroke="#2f7d6d" stroke-width="1.4" /><text x="310" y="216" font-size="12.5" fill="#2f7d6d" font-weight="bold" text-anchor="middle">Pod 1</text><text x="310" y="236" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">label:</text><text x="310" y="254" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">app: flash-page</text><rect x="390" y="192" width="120" height="78" rx="8" fill="#eaf5f1" stroke="#2f7d6d" stroke-width="1.4" /><text x="450" y="216" font-size="12.5" fill="#2f7d6d" font-weight="bold" text-anchor="middle">Pod 2</text><text x="450" y="236" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">label:</text><text x="450" y="254" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">app: flash-page</text><text x="30" y="138" font-size="12" fill="#0f5c8c" font-weight="normal" text-anchor="start" font-style="italic">keeps 2 Pods with this label</text><text x="690" y="138" font-size="12" fill="#7a4fa0" font-weight="normal" text-anchor="end" font-style="italic">sends traffic to Pods with this label</text><path d="M150,146 L300,188" fill="none" stroke="#0f5c8c" stroke-width="1.6" stroke-linejoin="round"/><path d="M300,188 L291.1,189.6 L293.3,182.0 Z" fill="#0f5c8c"/><path d="M170,146 L430,188" fill="none" stroke="#0f5c8c" stroke-width="1.6" stroke-linejoin="round"/><path d="M430,188 L421.4,190.6 L422.6,182.8 Z" fill="#0f5c8c"/><path d="M580,146 L330,188" fill="none" stroke="#7a4fa0" stroke-width="1.6" stroke-linejoin="round"/><path d="M330,188 L337.3,182.8 L338.6,190.5 Z" fill="#7a4fa0"/><path d="M600,146 L460,188" fill="none" stroke="#7a4fa0" stroke-width="1.6" stroke-linejoin="round"/><path d="M460,188 L466.6,181.9 L468.9,189.4 Z" fill="#7a4fa0"/><rect x="16" y="288" width="688" height="50" rx="7" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="30" y="309" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">The three labels must match exactly. A typo in one leaves the Service</text><text x="30" y="328" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">with no Pods to send to, and Kubernetes reports no error.</text></svg>