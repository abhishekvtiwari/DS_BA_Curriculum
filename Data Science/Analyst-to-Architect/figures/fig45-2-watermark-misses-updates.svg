<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="430" viewBox="0 0 1030 430" font-family="DejaVu Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1030" height="430" fill="#ffffff"/><text x="60" y="34" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">1 JANUARY: warehouse loaded up to order 10175</text><text x="60" y="58" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">2 JANUARY: what happens in the ERP, and what an ID-watermark load reads</text><rect x="60" y="80" width="900" height="170" rx="0" fill="#eaf5f1" stroke="none" stroke-width="1" /><rect x="60" y="250" width="900" height="130" rx="0" fill="#fbeaea" stroke="none" stroke-width="1" /><path d="M60,250 H960" fill="none" stroke="#1d2330" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="8 5"/><text x="952" y="240" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="end">watermark: order_id 10175</text><text x="74" y="104" font-size="12" fill="#2f7d6d" font-weight="bold" text-anchor="start">READ by the load (order_id &gt; 10175)</text><text x="74" y="274" font-size="12" fill="#b23b3b" font-weight="bold" text-anchor="start">NOT READ (order_id ≤ 10175)</text><rect x="180" y="140" width="240" height="70" rx="7" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><text x="194" y="170" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start">10176 inserted</text><text x="194" y="192" font-size="12" fill="#2f7d6d" font-weight="bold" text-anchor="start">new order, loaded</text><rect x="480" y="140" width="240" height="70" rx="7" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><text x="494" y="170" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start">10177 inserted</text><text x="494" y="192" font-size="12" fill="#2f7d6d" font-weight="bold" text-anchor="start">new order, loaded</text><rect x="180" y="290" width="240" height="70" rx="7" fill="#fff" stroke="#b23b3b" stroke-width="1.6" /><text x="194" y="320" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start">10174 updated</text><text x="194" y="342" font-size="12" fill="#b23b3b" font-weight="bold" text-anchor="start">Pending → Cancelled: missed</text><rect x="480" y="290" width="240" height="70" rx="7" fill="#fff" stroke="#b23b3b" stroke-width="1.6" /><text x="494" y="320" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start">10175 updated</text><text x="494" y="342" font-size="12" fill="#b23b3b" font-weight="bold" text-anchor="start">Shipped → Delivered: missed</text><text x="60" y="410" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start">The load finished without errors. Only a reconciliation against the source showed the two stale orders.</text></svg>