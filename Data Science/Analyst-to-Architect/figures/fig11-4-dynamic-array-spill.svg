<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="300" viewBox="0 0 1060 300" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1060" height="300" fill="#ffffff"/><text x="30" y="40" font-size="13.5" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The formula lives in one cell…</text><text x="30" y="58" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">F2: =SORT(UNIQUE(Sales[customer_name]))</text><rect x="30" y="70" width="230" height="24" rx="0" fill="#eef1f5" stroke="#c9d3df" stroke-width="1" /><text x="72" y="86" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">F</text><rect x="30" y="94" width="34" height="24" rx="0" fill="#eef1f5" stroke="#c9d3df" stroke-width="0.6" /><text x="47" y="110" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">1</text><rect x="64" y="94" width="196" height="24" rx="0" fill="#fff" stroke="#c9d3df" stroke-width="0.6" /><text x="72" y="110" font-size="11.3" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">customer (23 names)</text><rect x="30" y="118" width="34" height="24" rx="0" fill="#eef1f5" stroke="#c9d3df" stroke-width="0.6" /><text x="47" y="134" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">2</text><rect x="64" y="118" width="196" height="24" rx="0" fill="#e2f3ee" stroke="#c9d3df" stroke-width="0.6" /><text x="72" y="134" font-size="11.3" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Blue Bay Cafe</text><rect x="30" y="142" width="34" height="24" rx="0" fill="#eef1f5" stroke="#c9d3df" stroke-width="0.6" /><text x="47" y="158" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">3</text><rect x="64" y="142" width="196" height="24" rx="0" fill="#f2faf7" stroke="#c9d3df" stroke-width="0.6" /><text x="72" y="158" font-size="11.3" fill="#5b6475" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">City Needs Store</text><rect x="30" y="166" width="34" height="24" rx="0" fill="#eef1f5" stroke="#c9d3df" stroke-width="0.6" /><text x="47" y="182" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">4</text><rect x="64" y="166" width="196" height="24" rx="0" fill="#f2faf7" stroke="#c9d3df" stroke-width="0.6" /><text x="72" y="182" font-size="11.3" fill="#5b6475" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Coastal Foods</text><rect x="30" y="190" width="34" height="24" rx="0" fill="#eef1f5" stroke="#c9d3df" stroke-width="0.6" /><text x="47" y="206" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">5</text><rect x="64" y="190" width="196" height="24" rx="0" fill="#f2faf7" stroke="#c9d3df" stroke-width="0.6" /><text x="72" y="206" font-size="11.3" fill="#5b6475" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Deccan Packaging</text><rect x="30" y="214" width="34" height="24" rx="0" fill="#eef1f5" stroke="#c9d3df" stroke-width="0.6" /><text x="47" y="230" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">6</text><rect x="64" y="214" width="196" height="24" rx="0" fill="#f2faf7" stroke="#c9d3df" stroke-width="0.6" /><text x="72" y="230" font-size="11.3" fill="#5b6475" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Evergreen Mart</text><rect x="30" y="238" width="34" height="24" rx="0" fill="#eef1f5" stroke="#c9d3df" stroke-width="0.6" /><text x="47" y="254" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">7</text><rect x="64" y="238" width="196" height="24" rx="0" fill="#f2faf7" stroke="#c9d3df" stroke-width="0.6" /><text x="72" y="254" font-size="11.3" fill="#5b6475" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">… 18 more rows</text><rect x="30" y="262" width="34" height="24" rx="0" fill="#eef1f5" stroke="#c9d3df" stroke-width="0.6" /><text x="47" y="278" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">8</text><rect x="64" y="262" width="196" height="24" rx="0" fill="#fff" stroke="#c9d3df" stroke-width="0.6" /><text x="72" y="278" font-size="11.3" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace"></text><rect x="65" y="119" width="194" height="142" rx="0" fill="none" stroke="#2f7d6d" stroke-width="2" stroke-dasharray="5 3"/><text x="380" y="40" font-size="13.5" fill="#b23b3b" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">…and a blocked spill shows #SPILL!</text><text x="380" y="58" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Someone typed a note in F4</text><rect x="380" y="70" width="230" height="24" rx="0" fill="#eef1f5" stroke="#c9d3df" stroke-width="1" /><text x="422" y="86" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">F</text><rect x="380" y="94" width="34" height="24" rx="0" fill="#eef1f5" stroke="#c9d3df" stroke-width="0.6" /><text x="397" y="110" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">1</text><rect x="414" y="94" width="196" height="24" rx="0" fill="#fff" stroke="#c9d3df" stroke-width="0.6" /><text x="422" y="110" font-size="11.3" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">customer (23 names)</text><rect x="380" y="118" width="34" height="24" rx="0" fill="#eef1f5" stroke="#c9d3df" stroke-width="0.6" /><text x="397" y="134" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">2</text><rect x="414" y="118" width="196" height="24" rx="0" fill="#e2f3ee" stroke="#c9d3df" stroke-width="0.6" /><text x="422" y="134" font-size="11.3" fill="#b23b3b" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">#SPILL!</text><rect x="380" y="142" width="34" height="24" rx="0" fill="#eef1f5" stroke="#c9d3df" stroke-width="0.6" /><text x="397" y="158" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">3</text><rect x="414" y="142" width="196" height="24" rx="0" fill="#fff" stroke="#c9d3df" stroke-width="0.6" /><text x="422" y="158" font-size="11.3" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace"></text><rect x="380" y="166" width="34" height="24" rx="0" fill="#eef1f5" stroke="#c9d3df" stroke-width="0.6" /><text x="397" y="182" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">4</text><rect x="414" y="166" width="196" height="24" rx="0" fill="#f8e1e1" stroke="#c9d3df" stroke-width="0.6" /><text x="422" y="182" font-size="11.3" fill="#b23b3b" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">check later</text><rect x="380" y="190" width="34" height="24" rx="0" fill="#eef1f5" stroke="#c9d3df" stroke-width="0.6" /><text x="397" y="206" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">5</text><rect x="414" y="190" width="196" height="24" rx="0" fill="#fff" stroke="#c9d3df" stroke-width="0.6" /><text x="422" y="206" font-size="11.3" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace"></text><rect x="380" y="214" width="34" height="24" rx="0" fill="#eef1f5" stroke="#c9d3df" stroke-width="0.6" /><text x="397" y="230" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">6</text><rect x="414" y="214" width="196" height="24" rx="0" fill="#fff" stroke="#c9d3df" stroke-width="0.6" /><text x="422" y="230" font-size="11.3" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace"></text><rect x="380" y="238" width="34" height="24" rx="0" fill="#eef1f5" stroke="#c9d3df" stroke-width="0.6" /><text x="397" y="254" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">7</text><rect x="414" y="238" width="196" height="24" rx="0" fill="#fff" stroke="#c9d3df" stroke-width="0.6" /><text x="422" y="254" font-size="11.3" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace"></text><rect x="380" y="262" width="34" height="24" rx="0" fill="#eef1f5" stroke="#c9d3df" stroke-width="0.6" /><text x="397" y="278" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">8</text><rect x="414" y="262" width="196" height="24" rx="0" fill="#fff" stroke="#c9d3df" stroke-width="0.6" /><text x="422" y="278" font-size="11.3" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace"></text><text x="660" y="86" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">The dashed range is the spill range. Only F2</text><text x="660" y="108" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">holds a formula; the other cells show its</text><text x="660" y="130" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">results and can&#x27;t be typed into.</text><text x="660" y="152" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Refer to the whole result as F2# (Excel);</text><text x="660" y="174" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">it grows or shrinks with the data.</text><text x="660" y="196" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Clear the blocking cell and it spills again.</text><text x="660" y="218" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Google Sheets spills the same way; a blocked</text><text x="660" y="240" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">result shows #REF! (array not expanded).</text></svg>