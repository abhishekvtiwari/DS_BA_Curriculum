<svg xmlns="http://www.w3.org/2000/svg" width="720" height="274" viewBox="0 0 720 274" font-family="DejaVu Sans, Arial, sans-serif"><rect width="720" height="274" fill="#ffffff"/><text x="18" y="26" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The assistant, end to end: retrieve, ground, cite, or refuse</text><rect x="18" y="48" width="124" height="74" rx="8" fill="#fff" stroke="#1d2330" stroke-width="1.8" /><text x="80.0" y="72" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="middle">question</text><text x="80.0" y="92" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="middle">from a customer</text><path d="M142,85.0 H156" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M150,80.0 L158,85.0 L150,90.0" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><rect x="158" y="48" width="124" height="74" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.8" /><text x="220.0" y="72" font-size="12" fill="#0f5c8c" font-weight="bold" text-anchor="middle">retrieve</text><text x="220.0" y="92" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="middle">BM25 + vectors</text><text x="220.0" y="108" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="middle">top 3 chunks</text><path d="M282,85.0 H296" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M290,80.0 L298,85.0 L290,90.0" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><rect x="298" y="48" width="124" height="74" rx="8" fill="#fff" stroke="#c0662b" stroke-width="1.8" /><text x="360.0" y="72" font-size="12" fill="#c0662b" font-weight="bold" text-anchor="middle">confident?</text><text x="360.0" y="92" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="middle">BM25 ≥ 8 and</text><text x="360.0" y="108" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="middle">cosine ≥ 0.60</text><path d="M422,85.0 H436" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M430,80.0 L438,85.0 L430,90.0" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><rect x="438" y="48" width="124" height="74" rx="8" fill="#fff" stroke="#7a4fa0" stroke-width="1.8" /><text x="500.0" y="72" font-size="12" fill="#7a4fa0" font-weight="bold" text-anchor="middle">ground</text><text x="500.0" y="92" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="middle">answer ONLY from</text><text x="500.0" y="108" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="middle">numbered sources</text><path d="M562,85.0 H576" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M570,80.0 L578,85.0 L570,90.0" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><rect x="578" y="48" width="124" height="74" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.8" /><text x="640.0" y="72" font-size="12" fill="#2f7d6d" font-weight="bold" text-anchor="middle">cited answer</text><text x="640.0" y="92" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="middle">chunk ids stored</text><text x="640.0" y="108" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="middle">for tracing</text><path d="M80.0,122 V162" fill="none" stroke="#2f7d6d" stroke-width="2" stroke-linejoin="round"/><path d="M75.0,155 L80.0,164 L85.0,155" fill="none" stroke="#2f7d6d" stroke-width="2" stroke-linejoin="round"/><text x="88.0" y="146" font-size="10.5" fill="#2f7d6d" font-weight="bold" text-anchor="start">a live lookup</text><rect x="18" y="164" width="300" height="54" rx="7" fill="#e2f3ee" stroke="#2f7d6d" stroke-width="1.6" /><text x="168" y="186" font-size="11.5" fill="#2f7d6d" font-weight="bold" text-anchor="middle">tools, when documents can&#x27;t answer</text><text x="168" y="205" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="middle">order status, price quote: read-only</text><path d="M360.0,122 V162" fill="none" stroke="#b23b3b" stroke-width="2" stroke-linejoin="round" stroke-dasharray="5,4"/><path d="M355.0,155 L360.0,164 L365.0,155" fill="none" stroke="#b23b3b" stroke-width="2" stroke-linejoin="round"/><text x="368.0" y="146" font-size="10.5" fill="#b23b3b" font-weight="bold" text-anchor="start">no</text><rect x="340" y="164" width="362" height="54" rx="7" fill="#fbeaea" stroke="#b23b3b" stroke-width="1.6" /><text x="521" y="186" font-size="11.5" fill="#b23b3b" font-weight="bold" text-anchor="middle">refuse, and hand to the support desk</text><text x="521" y="205" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="middle">7 of 10 unanswerable questions caught</text><text x="18" y="244" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Nothing retrieved is trusted: sources are numbered data, and every answer stores the chunk ids</text><text x="18" y="261" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">it used. Superseded documents are filtered out at index time (section 55.10).</text></svg>