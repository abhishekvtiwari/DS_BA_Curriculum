<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="400" viewBox="0 0 1090 400" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1090" height="400" fill="#ffffff"/><text x="30" y="34" font-size="15" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">What makes an automation trustworthy</text><rect x="30" y="76" width="510" height="80" rx="7" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="30" y="76" width="8" height="80" rx="0" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="52" y="102" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">It says what it did</text><text x="52" y="124" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">A log line per run: rows, totals, time taken</text><rect x="52" y="134" width="158" height="18" rx="9" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="61" y="147" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start">logging, run history</text><rect x="570" y="76" width="510" height="80" rx="7" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="570" y="76" width="8" height="80" rx="0" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="592" y="102" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">It checks before it sends</text><text x="592" y="124" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">Row counts, date range, totals vs last period</text><rect x="592" y="134" width="123" height="18" rx="9" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="601" y="147" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start">fail = no email</text><rect x="30" y="174" width="510" height="80" rx="7" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="30" y="174" width="8" height="80" rx="0" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="52" y="200" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">It tells you when it breaks</text><text x="52" y="222" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">A failure alert to a person, not a mailbox nobody reads</text><rect x="52" y="232" width="144" height="18" rx="9" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="61" y="245" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start">alert on exception</text><rect x="570" y="174" width="510" height="80" rx="7" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="570" y="174" width="8" height="80" rx="0" fill="#b7791f" stroke="none" stroke-width="1" /><text x="592" y="200" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">It handles &#x27;nothing today&#x27;</text><text x="592" y="222" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">Says &quot;no sales recorded&quot; instead of an empty table</text><rect x="592" y="232" width="151" height="18" rx="9" fill="#b7791f" stroke="none" stroke-width="1" /><text x="601" y="245" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start">explicit empty case</text><rect x="30" y="272" width="510" height="80" rx="7" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="30" y="272" width="8" height="80" rx="0" fill="#7a4fa0" stroke="none" stroke-width="1" /><text x="52" y="298" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">It can be run twice</text><text x="52" y="320" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">Same input, same output, no duplicate emails</text><rect x="52" y="330" width="88" height="18" rx="9" fill="#7a4fa0" stroke="none" stroke-width="1" /><text x="61" y="343" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start">idempotent</text><rect x="570" y="272" width="510" height="80" rx="7" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="570" y="272" width="8" height="80" rx="0" fill="#5b6475" stroke="none" stroke-width="1" /><text x="592" y="298" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Someone else can run it</text><text x="592" y="320" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">Documented inputs, credentials in the environment, an owner</text><rect x="592" y="330" width="109" height="18" rx="9" fill="#5b6475" stroke="none" stroke-width="1" /><text x="601" y="343" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start">handover note</text><text x="30" y="384" font-size="11.8" fill="#5b6475" font-weight="normal" text-anchor="start">A report people trust is one they can check: the numbers, the time it ran, and what it excluded.</text></svg>