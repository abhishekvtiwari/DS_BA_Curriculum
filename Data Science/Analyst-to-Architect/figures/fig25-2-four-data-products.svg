<svg xmlns="http://www.w3.org/2000/svg" width="600" height="342" viewBox="0 0 600 342" font-family="DejaVu Sans, Arial, sans-serif"><rect width="600" height="342" fill="#ffffff"/><rect x="4.0" y="4" width="290.0" height="161" rx="6" fill="#fff" stroke="#0f5c8c" stroke-width="1.5" /><path d="M4.0,10 a6,6 0 0 1 6,-6 H288.0 a6,6 0 0 1 6,6 V28 H4.0 Z" fill="#0f5c8c"/><text x="14.0" y="20.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="start">Report or dashboard</text><circle cx="18.0" cy="42.7" r="2.4" fill="#0f5c8c"/><text x="26.0" y="46" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">Who opens it, and how often?</text><circle cx="18.0" cy="55.7" r="2.4" fill="#0f5c8c"/><text x="26.0" y="59" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">What do they do next?</text><circle cx="18.0" cy="68.7" r="2.4" fill="#0f5c8c"/><text x="26.0" y="72" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">What is one row?</text><circle cx="18.0" cy="81.7" r="2.4" fill="#0f5c8c"/><text x="26.0" y="85" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">What date range is the default?</text><circle cx="18.0" cy="94.7" r="2.4" fill="#0f5c8c"/><text x="26.0" y="98" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">Who may see which rows?</text><rect x="12.0" y="109" width="274.0" height="48" rx="4" fill="#f1f4f8" stroke="#0f5c8c" stroke-width="0.8" /><text x="18.0" y="121" font-size="9" fill="#0f5c8c" font-weight="bold" text-anchor="start">HOW IT FAILS</text><text x="18.0" y="134" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">Answers a question the reader already knew the</text><text x="18.0" y="147" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">answer to.</text><rect x="306.0" y="4" width="290.0" height="161" rx="6" fill="#fff" stroke="#1f6fa3" stroke-width="1.5" /><path d="M306.0,10 a6,6 0 0 1 6,-6 H590.0 a6,6 0 0 1 6,6 V28 H306.0 Z" fill="#1f6fa3"/><text x="316.0" y="20.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="start">Pipeline</text><circle cx="320.0" cy="42.7" r="2.4" fill="#1f6fa3"/><text x="328.0" y="46" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">What is the source of truth?</text><circle cx="320.0" cy="55.7" r="2.4" fill="#1f6fa3"/><text x="328.0" y="59" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">What happens when it is late?</text><circle cx="320.0" cy="68.7" r="2.4" fill="#1f6fa3"/><text x="328.0" y="72" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">What happens when the past changes?</text><circle cx="320.0" cy="81.7" r="2.4" fill="#1f6fa3"/><text x="328.0" y="85" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">Run twice: the same result?</text><circle cx="320.0" cy="94.7" r="2.4" fill="#1f6fa3"/><text x="328.0" y="98" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">Who is alerted, and how fast?</text><rect x="314.0" y="109" width="274.0" height="48" rx="4" fill="#f1f4f8" stroke="#1f6fa3" stroke-width="0.8" /><text x="320.0" y="121" font-size="9" fill="#1f6fa3" font-weight="bold" text-anchor="start">HOW IT FAILS</text><text x="320.0" y="134" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">Keeps running, shows a green tick, and is quietly</text><text x="320.0" y="147" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">wrong.</text><rect x="4.0" y="177" width="290.0" height="161" rx="6" fill="#fff" stroke="#7a4fa0" stroke-width="1.5" /><path d="M4.0,183 a6,6 0 0 1 6,-6 H288.0 a6,6 0 0 1 6,6 V201 H4.0 Z" fill="#7a4fa0"/><text x="14.0" y="193.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="start">Model</text><circle cx="18.0" cy="215.7" r="2.4" fill="#7a4fa0"/><text x="26.0" y="219" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">What decision does it serve?</text><circle cx="18.0" cy="228.7" r="2.4" fill="#7a4fa0"/><text x="26.0" y="232" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">What does each kind of mistake cost?</text><circle cx="18.0" cy="241.7" r="2.4" fill="#7a4fa0"/><text x="26.0" y="245" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">What baseline must it beat?</text><circle cx="18.0" cy="254.7" r="2.4" fill="#7a4fa0"/><text x="26.0" y="258" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">Which accounts are never scored?</text><circle cx="18.0" cy="267.7" r="2.4" fill="#7a4fa0"/><text x="26.0" y="271" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">What is written out with each score?</text><rect x="12.0" y="282" width="274.0" height="48" rx="4" fill="#f1f4f8" stroke="#7a4fa0" stroke-width="0.8" /><text x="18.0" y="294" font-size="9" fill="#7a4fa0" font-weight="bold" text-anchor="start">HOW IT FAILS</text><text x="18.0" y="307" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">Is accurate, and nobody changes what they do.</text><rect x="306.0" y="177" width="290.0" height="161" rx="6" fill="#fff" stroke="#2f7d6d" stroke-width="1.5" /><path d="M306.0,183 a6,6 0 0 1 6,-6 H590.0 a6,6 0 0 1 6,6 V201 H306.0 Z" fill="#2f7d6d"/><text x="316.0" y="193.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="start">Metric definition</text><circle cx="320.0" cy="215.7" r="2.4" fill="#2f7d6d"/><text x="328.0" y="219" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">What exactly is counted?</text><circle cx="320.0" cy="228.7" r="2.4" fill="#2f7d6d"/><text x="328.0" y="232" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">What is excluded?</text><circle cx="320.0" cy="241.7" r="2.4" fill="#2f7d6d"/><text x="328.0" y="245" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">Which teams must agree?</text><circle cx="320.0" cy="254.7" r="2.4" fill="#2f7d6d"/><text x="328.0" y="258" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">Where does the definition live?</text><circle cx="320.0" cy="267.7" r="2.4" fill="#2f7d6d"/><text x="328.0" y="271" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">How is a change announced?</text><rect x="314.0" y="282" width="274.0" height="48" rx="4" fill="#f1f4f8" stroke="#2f7d6d" stroke-width="0.8" /><text x="320.0" y="294" font-size="9" fill="#2f7d6d" font-weight="bold" text-anchor="start">HOW IT FAILS</text><text x="320.0" y="307" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">Lives inside one query and is reinvented by every new</text><text x="320.0" y="320" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">report.</text></svg>