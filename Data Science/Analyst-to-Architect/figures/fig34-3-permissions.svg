<svg xmlns="http://www.w3.org/2000/svg" width="700" height="398" viewBox="0 0 700 398" font-family="DejaVu Sans, Arial, sans-serif"><rect width="700" height="398" fill="#ffffff"/><text x="20" y="28" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Reading ls -l</text><rect x="20" y="44" width="660" height="36" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="34" y="68" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">-rw-r--r--  1  meera  meera  877  Jan  5  2026  customers.csv</text><path d="M35.0,84 V88 H40.826 V84" fill="none" stroke="#1d2330" stroke-width="1.4" stroke-linejoin="round"/><path d="M37.913,88 V164 H45.913" fill="none" stroke="#1d2330" stroke-width="1.4" stroke-linejoin="round"/><text x="49.913" y="168" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start">type: - a file, d a folder, l a link</text><path d="M42.826,84 V88 H64.304 V84" fill="none" stroke="#2f7d6d" stroke-width="1.4" stroke-linejoin="round"/><path d="M53.565,88 V144 H61.565" fill="none" stroke="#2f7d6d" stroke-width="1.4" stroke-linejoin="round"/><text x="65.565" y="148" font-size="11" fill="#2f7d6d" font-weight="bold" text-anchor="start">user (the owner): rw- read and write</text><path d="M66.304,84 V88 H87.782 V84" fill="none" stroke="#7a4fa0" stroke-width="1.4" stroke-linejoin="round"/><path d="M77.043,88 V124 H85.043" fill="none" stroke="#7a4fa0" stroke-width="1.4" stroke-linejoin="round"/><text x="89.043" y="128" font-size="11" fill="#7a4fa0" font-weight="bold" text-anchor="start">group: r-- read only</text><path d="M89.782,84 V88 H111.25999999999999 V84" fill="none" stroke="#c0662b" stroke-width="1.4" stroke-linejoin="round"/><path d="M100.52099999999999,88 V104 H108.52099999999999" fill="none" stroke="#c0662b" stroke-width="1.4" stroke-linejoin="round"/><text x="112.52099999999999" y="108" font-size="11" fill="#c0662b" font-weight="bold" text-anchor="start">others (everyone else): r-- read only</text><text x="380" y="108" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">Each set of three is read (r), write (w),</text><text x="380" y="128" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">execute (x), or - for &quot;not allowed&quot;.</text><text x="380" y="148" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">On a folder, x means &quot;can go into it&quot;.</text><text x="380" y="168" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">Then: links, owner, group, size, date, name.</text><text x="20" y="201" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start">Each set is also a digit: read 4 + write 2 + execute 1.</text><rect x="20" y="210" width="660" height="32" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.4" /><text x="36" y="231" font-size="12.5" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">644</text><text x="86" y="231" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">rw- r-- r--</text><text x="196" y="231" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">owner writes, everyone reads</text><text x="480" y="231" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">data files, documents</text><rect x="20" y="250" width="660" height="32" rx="7" fill="#fff" stroke="#2f7d6d" stroke-width="1.4" /><text x="36" y="271" font-size="12.5" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">755</text><text x="86" y="271" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">rwx r-x r-x</text><text x="196" y="271" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">owner writes, everyone reads and runs</text><text x="480" y="271" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">scripts, folders</text><rect x="20" y="290" width="660" height="32" rx="7" fill="#fff" stroke="#c0662b" stroke-width="1.4" /><text x="36" y="311" font-size="12.5" fill="#c0662b" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">600</text><text x="86" y="311" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">rw- --- ---</text><text x="196" y="311" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">owner only</text><text x="480" y="311" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">SSH keys, .env files</text><rect x="20" y="330" width="660" height="32" rx="7" fill="#fff" stroke="#7a4fa0" stroke-width="1.4" /><text x="36" y="351" font-size="12.5" fill="#7a4fa0" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">700</text><text x="86" y="351" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">rwx --- ---</text><text x="196" y="351" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">owner only, and can go in</text><text x="480" y="351" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">~/.ssh</text><text x="20" y="384" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">chmod +x script.sh adds the execute bit; chmod 600 key removes everyone else&#x27;s access.</text></svg>