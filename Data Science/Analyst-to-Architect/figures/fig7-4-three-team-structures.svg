weight="normal" text-anchor="middle" font-style="italic">(or a very small one)</text><rect x="384" y="120" width="140" height="62" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="396" y="144" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Sales</text><circle cx="406" cy="164" r="7" fill="#7a4fa0"/><text x="420" y="168" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">analyst</text><rect x="536" y="120" width="140" height="62" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="548" y="144" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Finance</text><circle cx="558" cy="164" r="7" fill="#7a4fa0"/><text x="572" y="168" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">analyst</text><rect x="384" y="300" width="140" height="62" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="396" y="324" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Operations</text><circle cx="406" cy="344" r="7" fill="#7a4fa0"/><text x="420" y="348" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">analyst</text><rect x="536" y="300" width="140" height="62" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="548" y="324" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Marketing</text><circle cx="558" cy="344" r="7" fill="#7a4fa0"/><text x="572" y="348" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">analyst</text><path d="M384,392 H676" fill="none" stroke="#c9d3df" stroke-width="1" stroke-linejoin="round"/><text x="384" y="420" font-size="12.5" fill="#2f7d6d" font-weight="bold" text-anchor="start">+ deep business context, fast</text><text x="384" y="446" font-size="12.5" fill="#b23b3b" font-weight="bold" text-anchor="start">– definitions drift apart</text><text x="384" y="472" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Common where departments differ a lot</text><rect x="710" y="20" width="320" height="470" rx="8" fill="#fbfcfe" stroke="#2f7d6d" stroke-width="1.6" /><path d="M710,28 a8,8 0 0 1 8,-8 H1022 a8,8 0 0 1 8,8 V56 H710 Z" fill="#2f7d6d"/><text x="724" y="45" font-size="15" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Hub-and-spoke</text><text x="724" y="80" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">A central hub owns the platform</text><text x="724" y="98" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">and definitions; spokes sit in teams.</text><path d="M840.0,212 L794,182" fill="none" stroke="#2f7d6d" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M900.0,212 L946,182" fill="none" stroke="#2f7d6d" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M840.0,268 L794,300" fill="none" stroke="#2f7d6d" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M900.0,268 L946,300" fill="none" stroke="#2f7d6d" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4"/><rect x="790.0" y="212" width="160" height="56" rx="6" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="870.0" y="237" font-size="13.5" fill="#fff" font-weight="bold" text-anchor="middle">Hub</text><text x="870.0" y="256" font-size="11" fill="#eef3f8" font-weight="normal" text-anchor="middle">platform · standards</text><rect x="724" y="120" width="140" height="62" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="736" y="144" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Sales</text><circle cx="746" cy="164" r="7" fill="#2f7d6d"/><text x="760" y="168" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">analyst</text><rect x="876" y="120" width="140" height="62" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="888" y="144" font-size="13" 