<svg xmlns="http://www.w3.org/2000/svg" width="720" height="588" viewBox="0 0 720 588" font-family="DejaVu Sans, Arial, sans-serif"><rect width="720" height="588" fill="#ffffff"/><rect x="16" y="16" width="688" height="176" rx="8" fill="#fbfcfe" stroke="#0f5c8c" stroke-width="1.6" /><path d="M16,24 a8,8 0 0 1 8,-8 H696 a8,8 0 0 1 8,8 V46 H16 Z" fill="#0f5c8c"/><text x="30" y="37" font-size="14" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Centralized</text><path d="M192.0,100 L78.0,126" fill="none" stroke="#0f5c8c" stroke-width="1.6" stroke-linejoin="round"/><path d="M78.0,126 L85.0,120.4 L86.8,128.0 Z" fill="#0f5c8c"/><path d="M222.0,100 L184.0,126" fill="none" stroke="#0f5c8c" stroke-width="1.6" stroke-linejoin="round"/><path d="M184.0,126 L188.5,118.2 L192.9,124.7 Z" fill="#0f5c8c"/><path d="M252.0,100 L290.0,126" fill="none" stroke="#0f5c8c" stroke-width="1.6" stroke-linejoin="round"/><path d="M290.0,126 L281.1,124.7 L285.5,118.2 Z" fill="#0f5c8c"/><path d="M282.0,100 L396.0,126" fill="none" stroke="#0f5c8c" stroke-width="1.6" stroke-linejoin="round"/><path d="M396.0,126 L387.2,128.0 L389.0,120.4 Z" fill="#0f5c8c"/><rect x="152.0" y="60" width="170" height="40" rx="6" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="237.0" y="78" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">Data team</text><text x="237.0" y="93" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="middle">all analysts here</text><rect x="30" y="128" width="96" height="52" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="40" y="148" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">Sales</text><rect x="136" y="128" width="96" height="52" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="146" y="148" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">Finance</text><rect x="242" y="128" width="96" height="52" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="252" y="148" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">Operations</text><rect x="348" y="128" width="96" height="52" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="358" y="148" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">Marketing</text><text x="468" y="70" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">One data team serves every</text><text x="468" y="88" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">department from the middle.</text><text x="468" y="120" font-size="12.5" fill="#2f7d6d" font-weight="bold" text-anchor="start">+ one version of the numbers</text><text x="468" y="144" font-size="12.5" fill="#b23b3b" font-weight="bold" text-anchor="start">– can feel far from the business</text><text x="468" y="168" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">Often the first setup</text><rect x="16" y="206" width="688" height="176" rx="8" fill="#fbfcfe" stroke="#7a4fa0" stroke-width="1.6" /><path d="M16,214 a8,8 0 0 1 8,-8 H696 a8,8 0 0 1 8,8 V236 H16 Z" fill="#7a4fa0"/><text x="30" y="227" font-size="14" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Embedded</text><rect x="152.0" y="250" width="170" height="40" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1" stroke-dasharray="5 4"/><text x="237.0" y="267" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="middle" font-style="italic">no central team</text><text x="237.0" y="283" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle" font-style="italic">(or a very small one)</text><rect x="30" y="318" width="96" height="52" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="40" y="338" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">Sales</text><circle cx="47" cy="355" r="6" fill="#7a4fa0"/><text x="58" y="359" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">analyst</text><rect x="136" y="318" width="96" height="52" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="146" y="338" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">Finance</text><circle cx="153" cy="355" r="6" fill="#7a4fa0"/><text x="164" y="359" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">analyst</text><rect x="242" y="318" width="96" height="52" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="252" y="338" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">Operations</text><circle cx="259" cy="355" r="6" fill="#7a4fa0"/><text x="270" y="359" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">analyst</text><rect x="348" y="318" width="96" height="52" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="358" y="338" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">Marketing</text><circle cx="365" cy="355" r="6" fill="#7a4fa0"/><text x="376" y="359" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">analyst</text><text x="468" y="260" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Analysts sit inside departments</text><text x="468" y="278" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">and report to their heads.</text><text x="468" y="310" font-size="12.5" fill="#2f7d6d" font-weight="bold" text-anchor="start">+ deep business context, fast</text><text x="468" y="334" font-size="12.5" fill="#b23b3b" font-weight="bold" text-anchor="start">– definitions drift apart</text><text x="468" y="358" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">Common where departments differ a</text><text x="468" y="374" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">lot</text><rect x="16" y="396" width="688" height="176" rx="8" fill="#fbfcfe" stroke="#2f7d6d" stroke-width="1.6" /><path d="M16,404 a8,8 0 0 1 8,-8 H696 a8,8 0 0 1 8,8 V426 H16 Z" fill="#2f7d6d"/><text x="30" y="417" font-size="14" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Hub-and-spoke</text><path d="M192.0,480 L78.0,508" fill="none" stroke="#2f7d6d" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M222.0,480 L184.0,508" fill="none" stroke="#2f7d6d" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M252.0,480 L290.0,508" fill="none" stroke="#2f7d6d" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M282.0,480 L396.0,508" fill="none" stroke="#2f7d6d" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4"/><rect x="152.0" y="440" width="170" height="40" rx="6" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="237.0" y="458" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">Hub</text><text x="237.0" y="473" font-size="11" fill="#ffffff" font-weight="normal" text-anchor="middle">platform · standards</text><rect x="30" y="508" width="96" height="52" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="40" y="528" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">Sales</text><circle cx="47" cy="545" r="6" fill="#2f7d6d"/><text x="58" y="549" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">analyst</text><rect x="136" y="508" width="96" height="52" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="146" y="528" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">Finance</text><circle cx="153" cy="545" r="6" fill="#2f7d6d"/><text x="164" y="549" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">analyst</text><rect x="242" y="508" width="96" height="52" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="252" y="528" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">Operations</text><circle cx="259" cy="545" r="6" fill="#2f7d6d"/><text x="270" y="549" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">analyst</text><rect x="348" y="508" width="96" height="52" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="358" y="528" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">Marketing</text><circle cx="365" cy="545" r="6" fill="#2f7d6d"/><text x="376" y="549" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">analyst</text><text x="468" y="450" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">A central hub owns the platform</text><text x="468" y="468" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">and definitions; spokes sit in teams.</text><text x="468" y="500" font-size="12.5" fill="#2f7d6d" font-weight="bold" text-anchor="start">+ context and consistency</text><text x="468" y="524" font-size="12.5" fill="#b23b3b" font-weight="bold" text-anchor="start">– needs clear ownership rules</text><text x="468" y="548" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">Common as companies grow</text></svg>