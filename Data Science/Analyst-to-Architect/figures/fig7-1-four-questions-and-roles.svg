-size="15" fill="#ffffff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">How should the whole</text><text x="794" y="98" font-size="15" fill="#ffffff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">system be designed?</text><text x="794" y="138" font-size="10.5" fill="#5b6475" font-weight="bold" text-anchor="start">TRACK</text><text x="794" y="158" font-size="13.5" fill="#c0662b" font-weight="bold" text-anchor="start">Architecture</text><path d="M794,172 H1002" fill="none" stroke="#c9d3df" stroke-width="1" stroke-linejoin="round"/><text x="794" y="194" font-size="10.5" fill="#5b6475" font-weight="bold" text-anchor="start">ROLES</text><circle cx="799" cy="212" r="3.5" fill="#c0662b"/><text x="810" y="216" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">Data architect</text><text x="794" y="344" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Taught in Part VII</text><rect x="30" y="382" width="986" height="48" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="46" y="402" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">Underneath all four: governance and data quality (data stewards, data quality and governance analysts).</text><text x="46" y="420" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">Shared by every role: SQL, business context, and some automation of repeated work.</text></svg>