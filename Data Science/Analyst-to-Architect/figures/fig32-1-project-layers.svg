<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="460" viewBox="0 0 1040 460" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1040" height="460" fill="#ffffff"/><text x="30" y="32" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The graph dbt builds from your ref() and source() calls</text><text x="60" y="62" font-size="12" fill="#5b6475" font-weight="bold" text-anchor="start">ERP tables (sources)</text><text x="330" y="62" font-size="12" fill="#5b6475" font-weight="bold" text-anchor="start">staging (views)</text><text x="600" y="62" font-size="12" fill="#5b6475" font-weight="bold" text-anchor="start">marts (tables)</text><text x="880" y="62" font-size="12" fill="#5b6475" font-weight="bold" text-anchor="start">used by</text><rect x="40" y="80" width="200" height="40" rx="7" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1.6" /><text x="140.0" y="105.0" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">orders</text><rect x="40" y="132" width="200" height="40" rx="7" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1.6" /><text x="140.0" y="157.0" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">order_items</text><rect x="40" y="184" width="200" height="40" rx="7" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1.6" /><text x="140.0" y="209.0" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">customers</text><rect x="40" y="236" width="200" height="40" rx="7" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1.6" /><text x="140.0" y="261.0" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">products</text><rect x="40" y="288" width="200" height="40" rx="7" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1.6" /><text x="140.0" y="313.0" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">employees</text><rect x="300" y="80" width="220" height="40" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><text x="410.0" y="105.0" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">stg_orders</text><rect x="300" y="132" width="220" height="40" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><text x="410.0" y="157.0" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">stg_order_items</text><rect x="300" y="184" width="220" height="40" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><text x="410.0" y="209.0" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">stg_customers</text><rect x="300" y="236" width="220" height="40" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><text x="410.0" y="261.0" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">stg_products</text><rect x="580" y="80" width="220" height="40" rx="7" fill="#e2f3ee" stroke="#2f7d6d" stroke-width="1.6" /><text x="690.0" y="105.0" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">dim_date</text><rect x="580" y="132" width="220" height="40" rx="7" fill="#e2f3ee" stroke="#2f7d6d" stroke-width="1.6" /><text x="690.0" y="157.0" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">dim_customer</text><rect x="580" y="184" width="220" height="40" rx="7" fill="#e2f3ee" stroke="#2f7d6d" stroke-width="1.6" /><text x="690.0" y="209.0" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">dim_product</text><rect x="580" y="236" width="220" height="40" rx="7" fill="#e2f3ee" stroke="#2f7d6d" stroke-width="1.6" /><text x="690.0" y="261.0" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">dim_sales_rep</text><rect x="580" y="288" width="220" height="40" rx="7" fill="#fdf3dc" stroke="#b7791f" stroke-width="1.6" /><text x="690.0" y="313.0" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">fct_sales_line</text><rect x="580" y="340" width="220" height="40" rx="7" fill="#fdf3dc" stroke="#b7791f" stroke-width="1.6" /><text x="690.0" y="365.0" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">fct_daily_sales</text><rect x="860" y="288" width="150" height="40" rx="7" fill="#fff" stroke="#7a4fa0" stroke-width="1.6" /><text x="935.0" y="313.0" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">Power BI</text><path d="M240,100 C270.0,100 270.0,100 300,100" fill="none" stroke="#c9d3df" stroke-width="1.3" stroke-linejoin="round"/><path d="M240,152 C270.0,152 270.0,152 300,152" fill="none" stroke="#c9d3df" stroke-width="1.3" stroke-linejoin="round"/><path d="M240,204 C270.0,204 270.0,204 300,204" fill="none" stroke="#c9d3df" stroke-width="1.3" stroke-linejoin="round"/><path d="M240,256 C270.0,256 270.0,256 300,256" fill="none" stroke="#c9d3df" stroke-width="1.3" stroke-linejoin="round"/><path d="M240,308 C410.0,308 410.0,256 580,256" fill="none" stroke="#c9d3df" stroke-width="1.3" stroke-linejoin="round"/><path d="M520,256 C550.0,256 550.0,204 580,204" fill="none" stroke="#c9d3df" stroke-width="1.3" stroke-linejoin="round"/><path d="M520,152 C550.0,152 550.0,308 580,308" fill="none" stroke="#b7791f" stroke-width="1.3" stroke-linejoin="round"/><path d="M520,100 C550.0,100 550.0,308 580,308" fill="none" stroke="#b7791f" stroke-width="1.3" stroke-linejoin="round"/><path d="M520,152 C550.0,152 550.0,360 580,360" fill="none" stroke="#b7791f" stroke-width="1.3" stroke-linejoin="round"/><path d="M520,100 C550.0,100 550.0,360 580,360" fill="none" stroke="#b7791f" stroke-width="1.3" stroke-linejoin="round"/><path d="M800,100 C690.0,100 690.0,308 580,308" fill="none" stroke="#2f7d6d" stroke-width="1.3" stroke-linejoin="round"/><path d="M800,152 C690.0,152 690.0,308 580,308" fill="none" stroke="#2f7d6d" stroke-width="1.3" stroke-linejoin="round"/><path d="M800,204 C690.0,204 690.0,308 580,308" fill="none" stroke="#2f7d6d" stroke-width="1.3" stroke-linejoin="round"/><path d="M800,256 C690.0,256 690.0,308 580,308" fill="none" stroke="#2f7d6d" stroke-width="1.3" stroke-linejoin="round"/><path d="M800,308 C830.0,308 830.0,308 860,308" fill="none" stroke="#7a4fa0" stroke-width="1.3" stroke-linejoin="round"/><text x="40" y="420" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Nobody wrote this order down. dbt reads the ref() and source() calls in the SQL and builds the graph, then runs it in dependency order,</text><text x="40" y="440" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">four models at a time. The same graph becomes the lineage diagram in the documentation site.</text></svg>