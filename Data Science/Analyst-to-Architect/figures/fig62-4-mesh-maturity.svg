<svg xmlns="http://www.w3.org/2000/svg" width="990" height="430" viewBox="0 0 990 430" font-family="DejaVu Sans, Arial, sans-serif"><rect width="990" height="430" fill="#ffffff"/><text x="30" y="30" font-size="14.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Is Riverstone ready for a data mesh? A maturity check, scored honestly</text><text x="30" y="84" font-size="10.6" fill="#1d2330" font-weight="bold" text-anchor="start">Multiple domain teams that could each own data</text><rect x="620" y="70" width="400" height="16" rx="8" fill="#dfe5ec" stroke="none" stroke-width="1" /><rect x="620" y="70" width="80.0" height="16" rx="8" fill="#b7791f" stroke="none" stroke-width="1" /><text x="1030" y="83" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">1/5</text><text x="30" y="100" font-size="9.6" fill="#5b6475" font-weight="normal" text-anchor="start">One data team; sales/ops/plant don&#x27;t yet have their own builders</text><text x="30" y="142" font-size="10.6" fill="#1d2330" font-weight="bold" text-anchor="start">A self-serve platform domains could use independently</text><rect x="620" y="128" width="400" height="16" rx="8" fill="#dfe5ec" stroke="none" stroke-width="1" /><rect x="620" y="128" width="160.0" height="16" rx="8" fill="#b7791f" stroke="none" stroke-width="1" /><text x="1030" y="141" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">2/5</text><text x="30" y="158" font-size="9.6" fill="#5b6475" font-weight="normal" text-anchor="start">Dagster + warehouse exist, but no domain has used them without the platform team</text><text x="30" y="200" font-size="10.6" fill="#1d2330" font-weight="bold" text-anchor="start">Federated governance (agreed standards, locally applied)</text><rect x="620" y="186" width="400" height="16" rx="8" fill="#dfe5ec" stroke="none" stroke-width="1" /><rect x="620" y="186" width="160.0" height="16" rx="8" fill="#b7791f" stroke="none" stroke-width="1" /><text x="1030" y="199" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">2/5</text><text x="30" y="216" font-size="9.6" fill="#5b6475" font-weight="normal" text-anchor="start">Data contracts (Ch 47) exist for one pipeline, not yet a company standard</text><text x="30" y="258" font-size="10.6" fill="#1d2330" font-weight="bold" text-anchor="start">A data-product mindset (data as something with an owner and a SLA)</text><rect x="620" y="244" width="400" height="16" rx="8" fill="#dfe5ec" stroke="none" stroke-width="1" /><rect x="620" y="244" width="240.0" height="16" rx="8" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="1030" y="257" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">3/5</text><text x="30" y="274" font-size="9.6" fill="#5b6475" font-weight="normal" text-anchor="start">Chapter 60&#x27;s containers each have an owner and NFRs — a real start</text><text x="30" y="316" font-size="10.6" fill="#1d2330" font-weight="bold" text-anchor="start">Organizational appetite for the cultural change mesh requires</text><rect x="620" y="302" width="400" height="16" rx="8" fill="#dfe5ec" stroke="none" stroke-width="1" /><rect x="620" y="302" width="80.0" height="16" rx="8" fill="#b7791f" stroke="none" stroke-width="1" /><text x="1030" y="315" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">1/5</text><text x="30" y="332" font-size="9.6" fill="#5b6475" font-weight="normal" text-anchor="start">Not raised; no domain team has asked to own its own data yet</text><rect x="30" y="360" width="930" height="50" rx="6" fill="#fff" stroke="#b23b3b" stroke-width="1.6" /><rect x="30" y="360" width="7" height="50" rx="0" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="50" y="382" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start">Verdict: not ready, and that&#x27;s fine. A data mesh imposed here would add organizational</text><text x="50" y="400" font-size="10.6" fill="#5b6475" font-weight="normal" text-anchor="start">complexity to solve a bottleneck that doesn&#x27;t exist yet. Revisit when a second domain team asks to own its own data.</text></svg>