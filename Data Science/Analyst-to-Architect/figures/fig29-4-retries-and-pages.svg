path d="M152,212 L162,218 L152,224" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><rect x="165" y="204" width="56" height="28" rx="4" fill="#fff" stroke="#2f7d6d" stroke-width="2" /><text x="193" y="223" font-size="13" fill="#2f7d6d" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">200</text><text x="232" y="223" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">10 leads</text><rect x="20" y="242" width="74" height="28" rx="4" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="57" y="261" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">page 4</text><path d="M94,256 H160" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M152,250 L162,256 L152,262" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><rect x="165" y="242" width="56" height="28" rx="4" fill="#fff" stroke="#2f7d6d" stroke-width="2" /><text x="193" y="261" font-size="13" fill="#2f7d6d" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">200</text><text x="232" y="261" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">10 leads</text><rect x="20" y="280" width="74" height="28" rx="4" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="57" y="299" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">page 5</text><path d="M94,294 H160" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M152,288 L162,294 L152,300" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><rect x="165" y="280" width="56" height="28" rx="4" fill="#fff" stroke="#2f7d6d" stroke-width="2" /><text x="193" y="299" font-size="13" fill="#2f7d6d" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">200</text><text x="232" y="299" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">3 leads, next_page: null</text><rect x="478" y="52" width="306" height="280" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="492" y="76" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">The client&#x27;s rules</text><text x="492" y="102" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">•</text><text x="506" y="102" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">Retry 429, 500, 502, 503, 504,</text><text x="506" y="118" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">connection errors, timeouts</text><text x="492" y="144" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">•</text><text x="506" y="144" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">Don&#x27;t retry 400, 401, 403, 404:</text><text x="506" y="160" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">retrying can&#x27;t fix them</text><text x="492" y="186" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">•</text><text x="506" y="186" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">Wait 0.5 s × 2^(attempt − 1),</text><text x="506" y="202" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">plus jitter up to half of that</text><text x="492" y="228" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">•</text><text x="506" y="228" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">429 with Retry-After:</text><text x="506" y="244" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">wait exactly that long</text><text x="492" y="270" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">•</text><text x="506" y="270" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">Give up after 4 attempts:</text><text x="506" y="286" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">raise CrmApiError</text><text x="492" y="312" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">•</text><text x="506" y="312" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">Always set a timeout: (3.05, 10) s</text><text x="20" y="356" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">A real run against the local mock server; the waits are the chapter&#x27;s output.</text></svg>