<svg xmlns="http://www.w3.org/2000/svg" width="970" height="358" viewBox="0 0 970 358" font-family="DejaVu Sans, Arial, sans-serif"><rect width="970" height="358" fill="#ffffff"/><text x="30" y="30" font-size="14.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">A first-90-days plan for a new architect</text><rect x="33" y="68" width="290" height="230" rx="7" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="30" y="64" width="290" height="230" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><path d="M30,72 a7,7 0 0 1 7,-7 H313 a7,7 0 0 1 7,7 V88 H30 Z" fill="#0f5c8c"/><text x="175.0" y="80.5" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Weeks 1-4: Listen</text><text x="175.0" y="104" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">Read every design doc,</text><text x="175.0" y="118" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">ADR, and postmortem that</text><text x="175.0" y="132" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">already exists</text><text x="175.0" y="146" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle"></text><text x="175.0" y="160" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">Ask &quot;what keeps you up</text><text x="175.0" y="174" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">at night?&quot; of every team lead</text><text x="175.0" y="188" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle"></text><text x="175.0" y="202" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">Build nothing yet</text><path d="M322,179 L348,179" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M348,179 L341.7,182.0 L341.7,176.0 Z" fill="#5b6475"/><rect x="353" y="68" width="290" height="230" rx="7" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="350" y="64" width="290" height="230" rx="7" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><path d="M350,72 a7,7 0 0 1 7,-7 H633 a7,7 0 0 1 7,7 V88 H350 Z" fill="#2f7d6d"/><text x="495.0" y="80.5" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Weeks 5-8: Diagnose</text><text x="495.0" y="104" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">Draw the real C4 diagram</text><text x="495.0" y="118" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">(Ch 60) — not the one in</text><text x="495.0" y="132" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">the wiki</text><text x="495.0" y="146" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle"></text><text x="495.0" y="160" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">Run a failure analysis</text><text x="495.0" y="174" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">(Ch 61) on the riskiest</text><text x="495.0" y="188" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">system</text><text x="495.0" y="202" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle"></text><text x="495.0" y="216" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">Score maturity honestly</text><text x="495.0" y="230" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">(Ch 66)</text><path d="M642,179 L668,179" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M668,179 L661.7,182.0 L661.7,176.0 Z" fill="#5b6475"/><rect x="673" y="68" width="290" height="230" rx="7" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="670" y="64" width="290" height="230" rx="7" fill="#fff" stroke="#b7791f" stroke-width="1.6" /><path d="M670,72 a7,7 0 0 1 7,-7 H953 a7,7 0 0 1 7,7 V88 H670 Z" fill="#b7791f"/><text x="815.0" y="80.5" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Weeks 9-12: Earn credibility</text><text x="815.0" y="104" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">Ship one small, visible,</text><text x="815.0" y="118" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">real fix — not a redesign</text><text x="815.0" y="132" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle"></text><text x="815.0" y="146" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">Close one long-open risk</text><text x="815.0" y="160" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">(the way Ch 64 closed</text><text x="815.0" y="174" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">Ch 60&#x27;s access-control gap)</text><text x="815.0" y="188" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle"></text><text x="815.0" y="202" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">Write it up; let the work</text><text x="815.0" y="216" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">speak first</text><text x="30" y="320" font-size="11.3" fill="#5b6475" font-weight="normal" text-anchor="start">Notice what&#x27;s missing from the first 90 days: a grand redesign. Chapter 60&#x27;s own story already taught this lesson —</text><text x="30" y="338" font-size="11.3" fill="#5b6475" font-weight="normal" text-anchor="start">the instinct to rebuild everything after finally seeing it clearly is almost always premature, especially in week six.</text></svg>