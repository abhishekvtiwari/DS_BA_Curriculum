<svg xmlns="http://www.w3.org/2000/svg" width="660" height="210" viewBox="0 0 660 210" font-family="DejaVu Sans, Arial, sans-serif"><rect width="660" height="210" fill="#ffffff"/><text x="6" y="22" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">A first-90-days plan for a new architect</text><rect x="9" y="44" width="200" height="145.0" rx="7" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="6" y="40" width="200" height="145.0" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><path d="M6,48 a7,7 0 0 1 7,-7 H199 a7,7 0 0 1 7,7 V66 H6 Z" fill="#0f5c8c"/><text x="106.0" y="58" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Weeks 1–4</text><text x="106.0" y="84" font-size="11" fill="#0f5c8c" font-weight="bold" text-anchor="middle">Listen</text><text x="106.0" y="104" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="middle">Read every design doc, ADR</text><text x="106.0" y="117.5" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="middle">and postmortem that exists</text><text x="106.0" y="137.75" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="middle">Ask every team lead: “What</text><text x="106.0" y="151.25" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="middle">keeps you up at night?”</text><text x="106.0" y="171.5" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="middle">Build nothing yet</text><rect x="233" y="44" width="200" height="145.0" rx="7" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="230" y="40" width="200" height="145.0" rx="7" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><path d="M230,48 a7,7 0 0 1 7,-7 H423 a7,7 0 0 1 7,7 V66 H230 Z" fill="#2f7d6d"/><text x="330.0" y="58" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Weeks 5–8</text><text x="330.0" y="84" font-size="11" fill="#2f7d6d" font-weight="bold" text-anchor="middle">Diagnose</text><text x="330.0" y="104" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="middle">Draw the real C4 diagram</text><text x="330.0" y="117.5" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="middle">(Ch 60), not the wiki’s</text><text x="330.0" y="137.75" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="middle">Run a failure analysis (Ch 61)</text><text x="330.0" y="151.25" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="middle">on the riskiest system</text><text x="330.0" y="171.5" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="middle">Score maturity honestly (Ch 66)</text><rect x="457" y="44" width="200" height="158.5" rx="7" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="454" y="40" width="200" height="158.5" rx="7" fill="#fff" stroke="#b7791f" stroke-width="1.6" /><path d="M454,48 a7,7 0 0 1 7,-7 H647 a7,7 0 0 1 7,7 V66 H454 Z" fill="#b7791f"/><text x="554.0" y="58" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Weeks 9–12</text><text x="554.0" y="84" font-size="11" fill="#b7791f" font-weight="bold" text-anchor="middle">Earn credibility</text><text x="554.0" y="104" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="middle">Ship one small, visible fix,</text><text x="554.0" y="117.5" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="middle">not a redesign</text><text x="554.0" y="137.75" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="middle">Close one long-open risk, the</text><text x="554.0" y="151.25" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="middle">way Ch 64 closed Ch 60’s</text><text x="554.0" y="164.75" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="middle">access-control gap</text><text x="554.0" y="185.0" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="middle">Write it up; let the work speak</text><path d="M210,100 L227,100" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M227,100 L220.7,103.0 L220.7,97.0 Z" fill="#5b6475"/><path d="M434,100 L451,100" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M451,100 L444.7,103.0 L444.7,97.0 Z" fill="#5b6475"/></svg>