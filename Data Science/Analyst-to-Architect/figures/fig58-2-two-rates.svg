<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="512" viewBox="0 0 1060 512" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1060" height="512" fill="#ffffff"/><text x="30" y="32" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The same system, described two ways</text><rect x="40" y="70" width="470" height="190" rx="8" fill="#e2f3ee" stroke="#2f7d6d" stroke-width="1.8" /><text x="275" y="100" font-size="12.5" fill="#2f7d6d" font-weight="bold" text-anchor="middle">what the business case says</text><text x="275" y="148" font-size="34" fill="#2f7d6d" font-weight="bold" text-anchor="middle">88%</text><text x="275" y="176" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="middle">straight-through rate</text><text x="275" y="204" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="middle">53 of 60 emails loaded</text><text x="275" y="224" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="middle">without anyone touching them</text><rect x="550" y="70" width="470" height="190" rx="8" fill="#fbeaea" stroke="#b23b3b" stroke-width="1.8" /><text x="785" y="100" font-size="12.5" fill="#b23b3b" font-weight="bold" text-anchor="middle">what the ground truth says</text><text x="785" y="148" font-size="34" fill="#b23b3b" font-weight="bold" text-anchor="middle">19%</text><text x="785" y="176" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="middle">silent error rate</text><text x="785" y="204" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="middle">10 of those 53 orders are wrong:</text><text x="785" y="224" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="middle">a quantity, a date, a missing line</text><text x="30" y="286" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">Cost per day at 40 emails, counting labour AND the cost of being wrong</text><text x="300" y="314" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="end">minutes</text><text x="430" y="314" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="end">labour Rs</text><text x="570" y="314" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="end">errors/day</text><text x="720" y="314" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="end">error cost Rs</text><text x="860" y="314" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="end">total Rs/day</text><rect x="30" y="326" width="1000" height="34" rx="6" fill="#fff" stroke="#5b6475" stroke-width="1.6" /><text x="48" y="348" font-size="12" fill="#5b6475" font-weight="bold" text-anchor="start">manual (today)</text><text x="300" y="348" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="end">120</text><text x="430" y="348" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="end">600</text><text x="570" y="348" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="end">0.0</text><text x="720" y="348" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="end">0</text><text x="860" y="348" font-size="12.5" fill="#5b6475" font-weight="bold" text-anchor="end">600</text><rect x="30" y="368" width="1000" height="34" rx="6" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><text x="48" y="390" font-size="12" fill="#2f7d6d" font-weight="bold" text-anchor="start">assisted: review each draft</text><text x="300" y="390" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="end">40</text><text x="430" y="390" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="end">198</text><text x="570" y="390" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="end">0.0</text><text x="720" y="390" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="end">0</text><text x="860" y="390" font-size="12.5" fill="#2f7d6d" font-weight="bold" text-anchor="end">198</text><rect x="30" y="410" width="1000" height="34" rx="6" fill="#fff" stroke="#b23b3b" stroke-width="1.6" /><text x="48" y="432" font-size="12" fill="#b23b3b" font-weight="bold" text-anchor="start">straight through</text><text x="300" y="432" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="end">9</text><text x="430" y="432" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="end">47</text><text x="570" y="432" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="end">6.7</text><text x="720" y="432" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="end">13,333</text><text x="860" y="432" font-size="12.5" fill="#b23b3b" font-weight="bold" text-anchor="end">13,380</text><text x="30" y="470" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Straight through saves the most labour and costs the most money. The recommendation this chapter&#x27;s own numbers force is the</text><text x="30" y="490" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">middle row: the model drafts every order, a person confirms it in 45 seconds, and nothing reaches the ERP unseen.</text></svg>