<svg xmlns="http://www.w3.org/2000/svg" width="720" height="422" viewBox="0 0 720 422" font-family="DejaVu Sans, Arial, sans-serif"><rect width="720" height="422" fill="#ffffff"/><text x="20" y="26" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The same system, described two ways</text><rect x="20" y="42" width="330" height="150" rx="8" fill="#e6f0f7" stroke="#0f5c8c" stroke-width="1.8" /><text x="185" y="66" font-size="12" fill="#0f5c8c" font-weight="bold" text-anchor="middle">what the business case says</text><text x="185" y="108" font-size="32" fill="#0f5c8c" font-weight="bold" text-anchor="middle">88%</text><text x="185" y="132" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="middle">straight-through rate</text><text x="185" y="156" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="middle">53 of 60 emails loaded</text><text x="185" y="174" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="middle">without anyone touching them</text><rect x="370" y="42" width="330" height="150" rx="8" fill="#fbeee4" stroke="#c0662b" stroke-width="1.8" /><text x="535" y="66" font-size="12" fill="#c0662b" font-weight="bold" text-anchor="middle">what the ground truth says</text><text x="535" y="108" font-size="32" fill="#c0662b" font-weight="bold" text-anchor="middle">19%</text><text x="535" y="132" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="middle">silent error rate</text><text x="535" y="156" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="middle">10 of those 53 orders are wrong:</text><text x="535" y="174" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="middle">a quantity or a missing line</text><text x="20" y="220" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">Cost per day at 40 emails, counting labour AND the cost of being wrong</text><text x="262" y="242" font-size="10.5" fill="#5b6475" font-weight="bold" text-anchor="end">minutes</text><text x="352" y="242" font-size="10.5" fill="#5b6475" font-weight="bold" text-anchor="end">labour ₹</text><text x="452" y="242" font-size="10.5" fill="#5b6475" font-weight="bold" text-anchor="end">errors/day</text><text x="572" y="242" font-size="10.5" fill="#5b6475" font-weight="bold" text-anchor="end">error cost ₹</text><text x="690" y="242" font-size="10.5" fill="#5b6475" font-weight="bold" text-anchor="end">total ₹/day</text><rect x="20" y="252" width="680" height="30" rx="6" fill="#fff" stroke="#5b6475" stroke-width="1.5" /><text x="32" y="272" font-size="11.5" fill="#5b6475" font-weight="bold" text-anchor="start">manual (today)</text><text x="262" y="272" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="end">120</text><text x="352" y="272" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="end">600</text><text x="452" y="272" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="end">0.00</text><text x="572" y="272" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="end">0</text><text x="690" y="272" font-size="12" fill="#5b6475" font-weight="bold" text-anchor="end">600</text><rect x="20" y="288" width="680" height="30" rx="6" fill="#fff" stroke="#0f5c8c" stroke-width="1.5" /><text x="32" y="308" font-size="11.5" fill="#0f5c8c" font-weight="bold" text-anchor="start">assisted: review each</text><text x="262" y="308" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="end">39</text><text x="352" y="308" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="end">197</text><text x="452" y="308" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="end">0.67</text><text x="572" y="308" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="end">1,333</text><text x="690" y="308" font-size="12" fill="#0f5c8c" font-weight="bold" text-anchor="end">1,530</text><rect x="20" y="324" width="680" height="30" rx="6" fill="#fff" stroke="#c0662b" stroke-width="1.5" /><text x="32" y="344" font-size="11.5" fill="#c0662b" font-weight="bold" text-anchor="start">straight through</text><text x="262" y="344" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="end">9</text><text x="352" y="344" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="end">47</text><text x="452" y="344" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="end">6.67</text><text x="572" y="344" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="end">13,333</text><text x="690" y="344" font-size="12" fill="#c0662b" font-weight="bold" text-anchor="end">13,380</text><text x="20" y="374" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">Straight through saves the most labour and costs the most money. Assisted costs more than</text><text x="20" y="391" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">typing on paper, because a reviewer misses 1 wrong draft in 10: it wins only if review catches</text><text x="20" y="408" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start">over 97%, or if typing itself gets more than 1.2% of orders wrong. Measure both in shadow mode.</text></svg>