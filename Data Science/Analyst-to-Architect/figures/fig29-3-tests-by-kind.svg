<svg xmlns="http://www.w3.org/2000/svg" width="800" height="364" viewBox="0 0 800 364" font-family="DejaVu Sans, Arial, sans-serif"><rect width="800" height="364" fill="#ffffff"/><text x="20" y="30" font-size="16" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">What each kind of test is for</text><rect x="20" y="52" width="590" height="72" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="2" /><text x="34" y="76" font-size="13.5" fill="#2f7d6d" font-weight="bold" text-anchor="start">Unit tests</text><text x="34" y="96" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">transform.py, config.py, and crm_client.py with a fake session</text><text x="34" y="114" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">milliseconds; no database or network</text><text x="626" y="94" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">14 tests</text><rect x="20" y="140" width="440" height="72" rx="8" fill="#fff" stroke="#7a4fa0" stroke-width="2" /><text x="34" y="164" font-size="13.5" fill="#7a4fa0" font-weight="bold" text-anchor="start">Parametrized tests</text><text x="34" y="184" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">parse_month (good and bad input), top_customers</text><text x="34" y="202" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">one test function, many inputs</text><text x="476" y="182" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">3 tests → 8 cases</text><rect x="20" y="228" width="290" height="72" rx="8" fill="#fff" stroke="#c0662b" stroke-width="2" /><text x="34" y="252" font-size="13.5" fill="#c0662b" font-weight="bold" text-anchor="start">Integration test</text><text x="34" y="272" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">December 2025 against riverstone_2025</text><text x="34" y="290" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">needs the database; skipped without it</text><text x="326" y="270" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">1 test</text><text x="20" y="330" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start">The integration test reconciles to a number the book already trusts:</text><text x="20" y="349" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start">December 2025 net revenue ₹4,39,823.50, 115.7% of target.</text></svg>