<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="424" viewBox="0 0 1000 424" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1000" height="424" fill="#ffffff"/><text x="30" y="30" font-size="14.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Failure analysis: the Riverstone platform, container by container</text><rect x="30" y="55" width="940" height="26" rx="4" fill="#1d2330" stroke="none" stroke-width="1" /><text x="40" y="73" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start">Container</text><text x="300" y="73" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start">Weakest link</text><text x="490" y="73" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start">What breaks</text><text x="720" y="73" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start">How it degrades</text><rect x="30" y="90" width="940" height="34" rx="0" fill="#fff" stroke="none" stroke-width="1" /><rect x="30" y="90" width="5" height="34" rx="0" fill="#b7791f" stroke="none" stroke-width="1" /><text x="40" y="111" font-size="9.8" fill="#1d2330" font-weight="bold" text-anchor="start">Ingestion (Dagster)</text><text x="300" y="111" font-size="9.4" fill="#5b6475" font-weight="normal" text-anchor="start">Single scheduler instance</text><text x="490" y="111" font-size="9.2" fill="#5b6475" font-weight="normal" text-anchor="start">Pipelines pause; last-good data still readable</text><text x="720" y="111" font-size="9.2" fill="#5b6475" font-weight="normal" text-anchor="start">Retries + alerting; no auto-failover yet</text><rect x="30" y="124" width="940" height="34" rx="0" fill="#f7f9fb" stroke="none" stroke-width="1" /><rect x="30" y="124" width="5" height="34" rx="0" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="40" y="145" font-size="9.8" fill="#1d2330" font-weight="bold" text-anchor="start">Warehouse (Postgres+Delta)</text><text x="300" y="145" font-size="9.4" fill="#5b6475" font-weight="normal" text-anchor="start">Single primary database</text><text x="490" y="145" font-size="9.2" fill="#5b6475" font-weight="normal" text-anchor="start">All reads/writes fail; total outage for the platform</text><text x="720" y="145" font-size="9.2" fill="#5b6475" font-weight="normal" text-anchor="start">None — this is platform&#x27;s one true SPOF</text><rect x="30" y="158" width="940" height="34" rx="0" fill="#fff" stroke="none" stroke-width="1" /><rect x="30" y="158" width="5" height="34" rx="0" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="40" y="179" font-size="9.8" fill="#1d2330" font-weight="bold" text-anchor="start">Semantic layer</text><text x="300" y="179" font-size="9.4" fill="#5b6475" font-weight="normal" text-anchor="start">None (stateless, recomputed)</text><text x="490" y="179" font-size="9.2" fill="#5b6475" font-weight="normal" text-anchor="start">Stale metrics until next run</text><text x="720" y="179" font-size="9.2" fill="#5b6475" font-weight="normal" text-anchor="start">Degrades gracefully: old numbers, clearly timestamped</text><rect x="30" y="192" width="940" height="34" rx="0" fill="#f7f9fb" stroke="none" stroke-width="1" /><rect x="30" y="192" width="5" height="34" rx="0" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="40" y="213" font-size="9.8" fill="#1d2330" font-weight="bold" text-anchor="start">BI &amp; Flash</text><text x="300" y="213" font-size="9.4" fill="#5b6475" font-weight="normal" text-anchor="start">Power BI service; SMTP</text><text x="490" y="213" font-size="9.2" fill="#5b6475" font-weight="normal" text-anchor="start">Dashboards unavailable; flash delayed, not lost</text><text x="720" y="213" font-size="9.2" fill="#5b6475" font-weight="normal" text-anchor="start">Retried on schedule; queued, not dropped</text><rect x="30" y="226" width="940" height="34" rx="0" fill="#fff" stroke="none" stroke-width="1" /><rect x="30" y="226" width="5" height="34" rx="0" fill="#b7791f" stroke="none" stroke-width="1" /><text x="40" y="247" font-size="9.8" fill="#1d2330" font-weight="bold" text-anchor="start">Defect model service</text><text x="300" y="247" font-size="9.4" fill="#5b6475" font-weight="normal" text-anchor="start">Single FastAPI instance (today)</text><text x="490" y="247" font-size="9.2" fill="#5b6475" font-weight="normal" text-anchor="start">Line alerts stop; QC reverts to manual sampling</text><text x="720" y="247" font-size="9.2" fill="#5b6475" font-weight="normal" text-anchor="start">Documented fallback procedure exists</text><rect x="30" y="260" width="940" height="34" rx="0" fill="#f7f9fb" stroke="none" stroke-width="1" /><rect x="30" y="260" width="5" height="34" rx="0" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="40" y="281" font-size="9.8" fill="#1d2330" font-weight="bold" text-anchor="start">Support assistant</text><text x="300" y="281" font-size="9.4" fill="#5b6475" font-weight="normal" text-anchor="start">Depends on document index</text><text x="490" y="281" font-size="9.2" fill="#5b6475" font-weight="normal" text-anchor="start">Assistant refuses instead of guessing (Ch 55)</text><text x="720" y="281" font-size="9.2" fill="#5b6475" font-weight="normal" text-anchor="start">By design: fails safe, not silently wrong</text><rect x="30" y="294" width="940" height="34" rx="0" fill="#fff" stroke="none" stroke-width="1" /><rect x="30" y="294" width="5" height="34" rx="0" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="40" y="315" font-size="9.8" fill="#1d2330" font-weight="bold" text-anchor="start">PO-intake pipeline</text><text x="300" y="315" font-size="9.4" fill="#5b6475" font-weight="normal" text-anchor="start">CRM/ERP network link</text><text x="490" y="315" font-size="9.2" fill="#5b6475" font-weight="normal" text-anchor="start">New orders queue instead of writing blind</text><text x="720" y="315" font-size="9.2" fill="#5b6475" font-weight="normal" text-anchor="start">Chooses consistency; see this chapter&#x27;s story</text><rect x="30" y="328" width="940" height="34" rx="0" fill="#f7f9fb" stroke="none" stroke-width="1" /><rect x="30" y="328" width="5" height="34" rx="0" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="40" y="349" font-size="9.8" fill="#1d2330" font-weight="bold" text-anchor="start">Reverse-ETL sync</text><text x="300" y="349" font-size="9.4" fill="#5b6475" font-weight="normal" text-anchor="start">CRM API availability</text><text x="490" y="349" font-size="9.2" fill="#5b6475" font-weight="normal" text-anchor="start">CRM falls behind; reconciled once link returns</text><text x="720" y="349" font-size="9.2" fill="#5b6475" font-weight="normal" text-anchor="start">Eventual consistency, accepted on purpose</text><text x="30" y="388" font-size="11.2" fill="#5b6475" font-weight="normal" text-anchor="start">One true single point of failure: the warehouse. Everything else degrades; the warehouse going down is a full platform outage —</text><text x="30" y="406" font-size="11.2" fill="#5b6475" font-weight="normal" text-anchor="start">which is exactly the finding that earns it a redundancy investment other containers don&#x27;t yet need.</text></svg>