<svg xmlns="http://www.w3.org/2000/svg" width="720" height="328" viewBox="0 0 720 328" font-family="DejaVu Sans, Arial, sans-serif"><rect width="720" height="328" fill="#ffffff"/><text x="16" y="18" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Customers sheet (rows 13–16 shown)</text><text x="16" y="35" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Question: what is the city for customer code 0014?</text><rect x="16" y="46" width="506" height="20" rx="3" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="22" y="60" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">A code</text><text x="112" y="60" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">B customer_name</text><text x="308" y="60" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">C city</text><text x="418" y="60" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">D segment</text><rect x="16" y="66" width="506" height="20" rx="0" fill="#fff" stroke="#c9d3df" stroke-width="0.7" /><text x="22" y="80" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">0012</text><text x="112" y="80" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Fresh Bowl Kitchens</text><text x="308" y="80" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Bengaluru</text><text x="418" y="80" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Hospitality</text><rect x="16" y="86" width="506" height="20" rx="0" fill="#fff" stroke="#c9d3df" stroke-width="0.7" /><text x="22" y="100" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">0013</text><text x="112" y="100" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Om Sai Provisions</text><text x="308" y="100" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Nashik</text><text x="418" y="100" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Retail</text><rect x="16" y="106" width="506" height="20" rx="0" fill="#fdf3dc" stroke="#c9d3df" stroke-width="0.7" /><text x="22" y="120" font-size="10.5" fill="#c0662b" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">0014</text><text x="112" y="120" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Deccan Packaging</text><text x="308" y="120" font-size="10.5" fill="#c0662b" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Hyderabad</text><text x="418" y="120" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Wholesale</text><rect x="16" y="126" width="506" height="20" rx="0" fill="#fff" stroke="#c9d3df" stroke-width="0.7" /><text x="22" y="140" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">0015</text><text x="112" y="140" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Spice Route Restaurants</text><text x="308" y="140" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Kolkata</text><text x="418" y="140" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Hospitality</text><rect x="18" y="67" width="86" height="78" rx="3" fill="none" stroke="#2f7d6d" stroke-width="1.8" /><rect x="304" y="67" width="106" height="78" rx="3" fill="none" stroke="#7a4fa0" stroke-width="1.8" /><text x="18" y="160" font-size="10.5" fill="#2f7d6d" font-weight="bold" text-anchor="start">lookup column (A)</text><text x="304" y="160" font-size="10.5" fill="#7a4fa0" font-weight="bold" text-anchor="start">return column (C)</text><text x="546" y="86" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">Row 15 of the sheet</text><text x="546" y="102" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">is the 14th code</text><text x="546" y="118" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">in A2:A25.</text><rect x="16" y="174" width="688" height="42" rx="5" fill="#fff" stroke="#2f7d6d" stroke-width="1.3" /><rect x="16" y="174" width="104" height="42" rx="5" fill="#2f7d6d" stroke="none" stroke-width="1" /><rect x="112" y="174" width="8" height="42" rx="0" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="24" y="200" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">XLOOKUP</text><text x="130" y="191" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">=XLOOKUP(&quot;0014&quot;, A2:A25, C2:C25)</text><text x="130" y="208" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">Point at the lookup column and the return column. Exact match by default.</text><text x="696" y="191" font-size="11" fill="#2f7d6d" font-weight="bold" text-anchor="end">→ Hyderabad</text><rect x="16" y="224" width="688" height="42" rx="5" fill="#fff" stroke="#0f5c8c" stroke-width="1.3" /><rect x="16" y="224" width="104" height="42" rx="5" fill="#0f5c8c" stroke="none" stroke-width="1" /><rect x="112" y="224" width="8" height="42" rx="0" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="24" y="250" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">INDEX / MATCH</text><text x="130" y="241" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">=INDEX(C2:C25, MATCH(&quot;0014&quot;, A2:A25, 0))</text><text x="130" y="258" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">MATCH finds the position (14); INDEX returns item 14. Every version.</text><text x="696" y="241" font-size="11" fill="#0f5c8c" font-weight="bold" text-anchor="end">→ Hyderabad</text><rect x="16" y="274" width="688" height="42" rx="5" fill="#fff" stroke="#b23b3b" stroke-width="1.3" /><rect x="16" y="274" width="104" height="42" rx="5" fill="#b23b3b" stroke="none" stroke-width="1" /><rect x="112" y="274" width="8" height="42" rx="0" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="24" y="300" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">VLOOKUP</text><text x="130" y="291" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">=VLOOKUP(&quot;0014&quot;, A2:D25, 3, FALSE)</text><text x="130" y="308" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">Counts columns (3). Insert a column inside A:D and it returns the wrong one.</text><text x="696" y="291" font-size="11" fill="#b23b3b" font-weight="bold" text-anchor="end">→ Hyderabad</text></svg>