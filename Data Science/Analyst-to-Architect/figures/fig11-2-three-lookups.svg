<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="445" viewBox="0 0 1060 445" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1060" height="445" fill="#ffffff"/><text x="30" y="40" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Customers sheet (rows 13–16 shown)</text><text x="30" y="58" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Question: what is the city for customer code 0014?</text><rect x="30" y="70" width="600" height="24" rx="4" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="38" y="86" font-size="11" fill="#fff" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">A customer_code</text><text x="188" y="86" font-size="11" fill="#fff" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">B customer_name</text><text x="398" y="86" font-size="11" fill="#fff" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">C city</text><text x="518" y="86" font-size="11" fill="#fff" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">D segment</text><rect x="30" y="94" width="600" height="26" rx="0" fill="#fff" stroke="#c9d3df" stroke-width="0.8" /><text x="38" y="111" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">0012</text><text x="188" y="111" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Fresh Bowl Kitchens</text><text x="398" y="111" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Bengaluru</text><text x="518" y="111" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Hospitality</text><rect x="30" y="120" width="600" height="26" rx="0" fill="#fff" stroke="#c9d3df" stroke-width="0.8" /><text x="38" y="137" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">0013</text><text x="188" y="137" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Om Sai Provisions</text><text x="398" y="137" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Nashik</text><text x="518" y="137" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Retail</text><rect x="30" y="146" width="600" height="26" rx="0" fill="#fdf3dc" stroke="#c9d3df" stroke-width="0.8" /><text x="38" y="163" font-size="11.5" fill="#c0662b" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">0014</text><text x="188" y="163" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Deccan Packaging</text><text x="398" y="163" font-size="11.5" fill="#c0662b" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Hyderabad</text><text x="518" y="163" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Wholesale</text><rect x="30" y="172" width="600" height="26" rx="0" fill="#fff" stroke="#c9d3df" stroke-width="0.8" /><text x="38" y="189" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">0015</text><text x="188" y="189" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Spice Route Restaurants</text><text x="398" y="189" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Kolkata</text><text x="518" y="189" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Hospitality</text><rect x="32" y="96" width="146" height="102" rx="4" fill="none" stroke="#2f7d6d" stroke-width="2" /><rect x="392" y="96" width="116" height="102" rx="4" fill="none" stroke="#7a4fa0" stroke-width="2" /><text x="32" y="220" font-size="11.5" fill="#2f7d6d" font-weight="bold" text-anchor="start">lookup column</text><text x="392" y="220" font-size="11.5" fill="#7a4fa0" font-weight="bold" text-anchor="start">return column</text><rect x="30" y="250" width="1000" height="50" rx="6" fill="#fff" stroke="#2f7d6d" stroke-width="1.4" /><rect x="30" y="250" width="130" height="50" rx="6" fill="#2f7d6d" stroke="none" stroke-width="1" /><rect x="150" y="250" width="10" height="50" rx="0" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="42" y="280" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">XLOOKUP</text><text x="176" y="272" font-size="12.3" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">=XLOOKUP(&quot;0014&quot;, A2:A25, C2:C25)</text><text x="176" y="291" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">Point at the lookup column and the return column. Default: exact match.</text><text x="1016" y="280" font-size="12.3" fill="#2f7d6d" font-weight="bold" text-anchor="end">→ Hyderabad</text><rect x="30" y="312" width="1000" height="50" rx="6" fill="#fff" stroke="#0f5c8c" stroke-width="1.4" /><rect x="30" y="312" width="130" height="50" rx="6" fill="#0f5c8c" stroke="none" stroke-width="1" /><rect x="150" y="312" width="10" height="50" rx="0" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="42" y="342" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">INDEX / MATCH</text><text x="176" y="334" font-size="12.3" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">=INDEX(C2:C25, MATCH(&quot;0014&quot;, A2:A25, 0))</text><text x="176" y="353" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">MATCH finds the position (14); INDEX returns item 14. Works in every version.</text><text x="1016" y="342" font-size="12.3" fill="#0f5c8c" font-weight="bold" text-anchor="end">→ Hyderabad</text><rect x="30" y="374" width="1000" height="50" rx="6" fill="#fff" stroke="#b23b3b" stroke-width="1.4" /><rect x="30" y="374" width="130" height="50" rx="6" fill="#b23b3b" stroke="none" stroke-width="1" /><rect x="150" y="374" width="10" height="50" rx="0" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="42" y="404" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">VLOOKUP</text><text x="176" y="396" font-size="12.3" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">=VLOOKUP(&quot;0014&quot;, A2:D25, 3, FALSE)</text><text x="176" y="415" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">Counts columns (3). Insert a column inside A:D and it silently returns the wrong one.</text><text x="1016" y="404" font-size="12.3" fill="#b23b3b" font-weight="bold" text-anchor="end">→ Hyderabad</text></svg>