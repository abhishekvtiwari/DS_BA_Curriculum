<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="334" viewBox="0 0 1030 334" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1030" height="334" fill="#ffffff"/><rect x="33" y="44" width="300" height="210" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="30" y="40" width="300" height="210" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><path d="M30,48 a8,8 0 0 1 8,-8 H322 a8,8 0 0 1 8,8 V74 H30 Z" fill="#0f5c8c"/><text x="42" y="63" font-size="15" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Study</text><text x="44" y="102" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">Concepts, examples,</text><text x="44" y="122" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">and exercises</text><text x="44" y="162" font-size="11" fill="#0f5c8c" font-weight="bold" text-anchor="start">PRODUCES KNOWLEDGE</text><path d="M44,174 H316" fill="none" stroke="#c9d3df" stroke-width="1" stroke-linejoin="round"/><text x="44" y="200" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">&quot;I understand how a join works.&quot;</text><path d="M334,145 L366,145" fill="none" stroke="#1d2330" stroke-width="2.2" stroke-linejoin="round"/><path d="M366,145 L357.9,148.9 L357.9,141.1 Z" fill="#1d2330"/><rect x="373" y="44" width="300" height="210" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="370" y="40" width="300" height="210" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><path d="M370,48 a8,8 0 0 1 8,-8 H662 a8,8 0 0 1 8,8 V74 H370 Z" fill="#2f7d6d"/><text x="382" y="63" font-size="15" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Projects</text><text x="384" y="102" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">Real questions on</text><text x="384" y="122" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">real, messy data</text><text x="384" y="162" font-size="11" fill="#2f7d6d" font-weight="bold" text-anchor="start">PRODUCES SKILL</text><path d="M384,174 H656" fill="none" stroke="#c9d3df" stroke-width="1" stroke-linejoin="round"/><text x="384" y="200" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">&quot;I can answer this question with a join.&quot;</text><path d="M674,145 L706,145" fill="none" stroke="#1d2330" stroke-width="2.2" stroke-linejoin="round"/><path d="M706,145 L697.9,148.9 L697.9,141.1 Z" fill="#1d2330"/><rect x="713" y="44" width="300" height="210" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="710" y="40" width="300" height="210" rx="8" fill="#fff" stroke="#7a4fa0" stroke-width="1.6" /><path d="M710,48 a8,8 0 0 1 8,-8 H1002 a8,8 0 0 1 8,8 V74 H710 Z" fill="#7a4fa0"/><text x="722" y="63" font-size="15" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Feedback and time</text><text x="724" y="102" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">Reviews, mentors, real</text><text x="724" y="122" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">users, many repetitions</text><text x="724" y="162" font-size="11" fill="#7a4fa0" font-weight="bold" text-anchor="start">PRODUCES JUDGMENT</text><path d="M724,174 H996" fill="none" stroke="#c9d3df" stroke-width="1" stroke-linejoin="round"/><text x="724" y="200" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">&quot;I know which join, and when it will mislead.&quot;</text><path d="M860.0,254 V290 H180.0 V262" fill="none" stroke="#5b6475" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/><path d="M174.0,264 L180.0,254 L186.0,264 Z" fill="#5b6475"/><text x="515" y="312" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="middle">Feedback shows what to study next. The loop repeats at 