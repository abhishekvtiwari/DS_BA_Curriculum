<svg xmlns="http://www.w3.org/2000/svg" width="760" height="298" viewBox="0 0 760 298" font-family="DejaVu Sans, Arial, sans-serif"><rect width="760" height="298" fill="#ffffff"/><rect x="23" y="24" width="220" height="206" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="20" y="20" width="220" height="206" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><path d="M20,28 a8,8 0 0 1 8,-8 H232 a8,8 0 0 1 8,8 V54 H20 Z" fill="#0f5c8c"/><text x="32" y="43" font-size="15" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Study</text><text x="34" y="78" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">Concepts, examples</text><text x="34" y="96" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">and exercises</text><text x="34" y="150" font-size="11.5" fill="#0f5c8c" font-weight="bold" text-anchor="start">PRODUCES KNOWLEDGE</text><path d="M34,161 H226" fill="none" stroke="#c9d3df" stroke-width="1" stroke-linejoin="round"/><text x="34" y="184" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">“I understand how</text><text x="34" y="201" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">a join works.”</text><path d="M243,120 L267,120" fill="none" stroke="#1d2330" stroke-width="2.2" stroke-linejoin="round"/><path d="M267,120 L258.9,123.9 L258.9,116.1 Z" fill="#1d2330"/><rect x="273" y="24" width="220" height="206" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="270" y="20" width="220" height="206" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><path d="M270,28 a8,8 0 0 1 8,-8 H482 a8,8 0 0 1 8,8 V54 H270 Z" fill="#2f7d6d"/><text x="282" y="43" font-size="15" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Projects</text><text x="284" y="78" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">Real questions on</text><text x="284" y="96" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">real, messy data</text><text x="284" y="150" font-size="11.5" fill="#2f7d6d" font-weight="bold" text-anchor="start">PRODUCES SKILL</text><path d="M284,161 H476" fill="none" stroke="#c9d3df" stroke-width="1" stroke-linejoin="round"/><text x="284" y="184" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">“I can answer this</text><text x="284" y="201" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">question with a join.”</text><path d="M493,120 L517,120" fill="none" stroke="#1d2330" stroke-width="2.2" stroke-linejoin="round"/><path d="M517,120 L508.9,123.9 L508.9,116.1 Z" fill="#1d2330"/><rect x="523" y="24" width="220" height="206" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="520" y="20" width="220" height="206" rx="8" fill="#fff" stroke="#7a4fa0" stroke-width="1.6" /><path d="M520,28 a8,8 0 0 1 8,-8 H732 a8,8 0 0 1 8,8 V54 H520 Z" fill="#7a4fa0"/><text x="532" y="43" font-size="15" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Feedback and time</text><text x="534" y="78" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">Reviews, mentors,</text><text x="534" y="96" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">real users, many</text><text x="534" y="114" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">repetitions</text><text x="534" y="150" font-size="11.5" fill="#7a4fa0" font-weight="bold" text-anchor="start">PRODUCES JUDGMENT</text><path d="M534,161 H726" fill="none" stroke="#c9d3df" stroke-width="1" stroke-linejoin="round"/><text x="534" y="184" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">“I know which join, and</text><text x="534" y="201" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">when it will mislead.”</text><path d="M630.0,230 V260 H130.0 V240" fill="none" stroke="#5b6475" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4"/><path d="M124.0,241 L130.0,231 L136.0,241 Z" fill="#5b6475"/><text x="380" y="284" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="middle">Feedback shows what to study next. The loop repeats at every tier, for years.</text></svg>