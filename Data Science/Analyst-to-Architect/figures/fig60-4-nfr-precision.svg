<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" font-family="DejaVu Sans, Arial, sans-serif"><rect width="680" height="320" fill="#ffffff"/><text x="12" y="24" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Turning a vague requirement into a number</text><rect x="12" y="40" width="158" height="46" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1" /><text x="24" y="67.0" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">“Make it fast”</text><path d="M176,63.0 L204,63.0" fill="none" stroke="#0f5c8c" stroke-width="1.8" stroke-linejoin="round"/><path d="M204,63.0 L197.7,66.0 L197.7,60.0 Z" fill="#0f5c8c"/><rect x="212" y="40" width="456" height="46" rx="6" fill="#fff" stroke="#0f5c8c" stroke-width="1.5" /><rect x="212" y="40" width="6" height="46" rx="0" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="230" y="60.0" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">The Daily Sales Flash is sent by 07:30 IST on working days, p95 over the month</text><text x="230" y="74.0" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">(the time that 95% of the month&#x27;s Flashes beat).</text><rect x="12" y="96" width="158" height="46" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1" /><text x="24" y="123.0" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">“Make it reliable”</text><path d="M176,119.0 L204,119.0" fill="none" stroke="#2f7d6d" stroke-width="1.8" stroke-linejoin="round"/><path d="M204,119.0 L197.7,122.0 L197.7,116.0 Z" fill="#2f7d6d"/><rect x="212" y="96" width="456" height="46" rx="6" fill="#fff" stroke="#2f7d6d" stroke-width="1.5" /><rect x="212" y="96" width="6" height="46" rx="0" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="230" y="116.0" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">At most 2 pipeline runs a year need a person to step in; counted each month</text><text x="230" y="130.0" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">from Dagster&#x27;s run history.</text><rect x="12" y="152" width="158" height="46" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1" /><text x="24" y="179.0" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">“Make it secure”</text><path d="M176,175.0 L204,175.0" fill="none" stroke="#b23b3b" stroke-width="1.8" stroke-linejoin="round"/><path d="M204,175.0 L197.7,178.0 L197.7,172.0 Z" fill="#b23b3b"/><rect x="212" y="152" width="456" height="46" rx="6" fill="#fff" stroke="#b23b3b" stroke-width="1.5" /><rect x="212" y="152" width="6" height="46" rx="0" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="230" y="172.0" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">No analyst&#x27;s login can read another branch&#x27;s customer data; access reviewed</text><text x="230" y="186.0" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">every quarter.</text><rect x="12" y="208" width="158" height="46" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1" /><text x="24" y="235.0" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">“Make it scale”</text><path d="M176,231.0 L204,231.0" fill="none" stroke="#b7791f" stroke-width="1.8" stroke-linejoin="round"/><path d="M204,231.0 L197.7,234.0 L197.7,228.0 Z" fill="#b7791f"/><rect x="212" y="208" width="456" height="46" rx="6" fill="#fff" stroke="#b7791f" stroke-width="1.5" /><rect x="212" y="208" width="6" height="46" rx="0" fill="#b7791f" stroke="none" stroke-width="1" /><text x="230" y="228.0" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">At 5 times today&#x27;s order volume (test data), the 06:30 run still finishes by 07:15</text><text x="230" y="242.0" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">and the sales dashboard&#x27;s first view loads in under 3 seconds, p95.</text><rect x="12" y="264" width="158" height="46" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1" /><text x="24" y="291.0" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">“Keep it cheap”</text><path d="M176,287.0 L204,287.0" fill="none" stroke="#7a4fa0" stroke-width="1.8" stroke-linejoin="round"/><path d="M204,287.0 L197.7,290.0 L197.7,284.0 Z" fill="#7a4fa0"/><rect x="212" y="264" width="456" height="46" rx="6" fill="#fff" stroke="#7a4fa0" stroke-width="1.5" /><rect x="212" y="264" width="6" height="46" rx="0" fill="#7a4fa0" stroke="none" stroke-width="1" /><text x="230" y="284.0" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Platform cost stays under ₹0.50 per 1,000 order lines processed; reviewed</text><text x="230" y="298.0" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">every month.</text></svg>