<svg xmlns="http://www.w3.org/2000/svg" width="600" height="365.0" viewBox="0 0 600 365.0" font-family="DejaVu Sans, Arial, sans-serif"><rect width="600" height="365.0" fill="#ffffff"/><rect x="8" y="4" width="181" height="144.5" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.3" /><path d="M8,11 a7,7 0 0 1 7,-7 H182 a7,7 0 0 1 7,7 V28 H8 Z" fill="#0f5c8c"/><text x="17" y="20.5" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start">1  SQL</text><text x="17" y="44.0" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">Get the headline out of the</text><text x="17" y="57.5" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">database</text><rect x="17" y="84.5" width="163" height="36" rx="4" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="23" y="98.5" font-size="9.5" fill="#0f5c8c" font-weight="bold" text-anchor="start">14.8 orders vs 9.3</text><text x="17" y="139.5" font-size="9" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Chapters 12, 13</text><path d="M191,76.25 H203" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M202,72.25 L208,76.25 L202,80.25 Z" fill="#5b6475"/><rect x="209" y="4" width="181" height="144.5" rx="7" fill="#fff" stroke="#b35a1f" stroke-width="1.3" /><path d="M209,11 a7,7 0 0 1 7,-7 H383 a7,7 0 0 1 7,7 V28 H209 Z" fill="#b35a1f"/><text x="218" y="20.5" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start">2  Cleaning</text><text x="218" y="44.0" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">Decide, log the decision,</text><text x="218" y="57.5" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">measure whether it mattered</text><rect x="218" y="84.5" width="163" height="36" rx="4" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="224" y="98.5" font-size="9.5" fill="#b35a1f" font-weight="bold" text-anchor="start">48 duplicates: headline</text><text x="224" y="111.5" font-size="9.5" fill="#b35a1f" font-weight="bold" text-anchor="start">moves 0.2 orders</text><text x="218" y="139.5" font-size="9" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Chapter 14</text><path d="M392,76.25 H404" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M403,72.25 L409,76.25 L403,80.25 Z" fill="#5b6475"/><rect x="410" y="4" width="181" height="144.5" rx="7" fill="#fff" stroke="#b23b3b" stroke-width="2.6" /><path d="M410,11 a7,7 0 0 1 7,-7 H584 a7,7 0 0 1 7,7 V28 H410 Z" fill="#b23b3b"/><text x="419" y="20.5" font-size="10" fill="#fff" font-weight="bold" text-anchor="start">3  The check  · often skipped</text><text x="419" y="44.0" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">Split it by the thing that could</text><text x="419" y="57.5" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">explain both</text><rect x="419" y="84.5" width="163" height="36" rx="4" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="425" y="98.5" font-size="9.5" fill="#b23b3b" font-weight="bold" text-anchor="start">662 of 681 are Wholesale</text><text x="419" y="139.5" font-size="9" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Chapters 21, 22</text><rect x="8" y="178.5" width="181" height="144.5" rx="7" fill="#fff" stroke="#2f7d6d" stroke-width="1.3" /><path d="M8,185.5 a7,7 0 0 1 7,-7 H182 a7,7 0 0 1 7,7 V202.5 H8 Z" fill="#2f7d6d"/><text x="17" y="195.0" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start">4  Python</text><text x="17" y="218.5" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">Turn your choices into</text><text x="17" y="232.0" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">parameters so they can be</text><text x="17" y="245.5" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">argued with</text><rect x="17" y="259.0" width="163" height="36" rx="4" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="23" y="273.0" font-size="9.5" fill="#2f7d6d" font-weight="bold" text-anchor="start">band_cut 3 / 5 / 8</text><text x="17" y="314.0" font-size="9" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Chapters 17, 18, 20</text><path d="M191,250.75 H203" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M202,246.75 L208,250.75 L202,254.75 Z" fill="#5b6475"/><rect x="209" y="178.5" width="181" height="144.5" rx="7" fill="#fff" stroke="#1f6fa3" stroke-width="1.3" /><path d="M209,185.5 a7,7 0 0 1 7,-7 H383 a7,7 0 0 1 7,7 V202.5 H209 Z" fill="#1f6fa3"/><text x="218" y="195.0" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start">5  Dashboard</text><text x="218" y="218.5" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">One page, one decision, one</text><text x="218" y="232.0" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">named reader</text><rect x="218" y="259.0" width="163" height="36" rx="4" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="224" y="273.0" font-size="9.5" fill="#1f6fa3" font-weight="bold" text-anchor="start">4 objects, nothing else</text><text x="218" y="314.0" font-size="9" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Chapters 15, 16</text><path d="M392,250.75 H404" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M403,246.75 L409,250.75 L403,254.75 Z" fill="#5b6475"/><rect x="410" y="178.5" width="181" height="144.5" rx="7" fill="#fff" stroke="#7a4fa0" stroke-width="1.3" /><path d="M410,185.5 a7,7 0 0 1 7,-7 H584 a7,7 0 0 1 7,7 V202.5 H410 Z" fill="#7a4fa0"/><text x="419" y="195.0" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start">6  Memo</text><text x="419" y="218.5" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">Recommendation first, and</text><text x="419" y="232.0" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">what did not support it</text><rect x="419" y="259.0" width="163" height="36" rx="4" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="425" y="273.0" font-size="9.5" fill="#7a4fa0" font-weight="bold" text-anchor="start">Recommendation: no</text><text x="419" y="314.0" font-size="9" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Chapters 23, 24</text><path d="M500.5,149.5 V163.5 H98.5" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M98.5,163.5 V172.5" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M94.5,171.5 L98.5,177.5 L102.5,171.5 Z" fill="#5b6475"/><text x="8" y="343.0" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">Stage 3 is the one that separates a capstone from a tutorial. It is also the one nobody can tell you</text><text x="8" y="357.0" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">skipped.</text></svg>