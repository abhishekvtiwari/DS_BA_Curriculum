<svg xmlns="http://www.w3.org/2000/svg" width="1392" height="350" viewBox="0 0 1392 350" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1392" height="350" fill="#ffffff"/><text x="32" y="36" font-size="15.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The analyst arc, and what each stage produced in this chapter&#x27;s project</text><text x="32" y="60" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Nothing here is new. The capstone is the order, and the stage most people skip.</text><rect x="34" y="81" width="208" height="196" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="32" y="78" width="208" height="196" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><path d="M32,86 a8,8 0 0 1 8,-8 H232 a8,8 0 0 1 8,8 V112 H32 Z" fill="#0f5c8c"/><text x="44" y="101" font-size="13.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">1  SQL</text><text x="44" y="136" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Get the headline out of the</text><text x="44" y="153" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">database</text><rect x="44" y="208" width="184" height="34" rx="5" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="52" y="226" font-size="10.5" fill="#0f5c8c" font-weight="normal" text-anchor="start">14.8 orders vs 9.3</text><text x="44" y="260" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Ch 12, 13</text><path d="M241,176.0 H251" fill="none" stroke="#5b6475" stroke-width="2" stroke-linejoin="round"/><path d="M251,171.0 L258,176.0 L251,181.0 Z" fill="#5b6475"/><rect x="258" y="81" width="208" height="196" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="256" y="78" width="208" height="196" rx="8" fill="#fff" stroke="#c0662b" stroke-width="1.6" /><path d="M256,86 a8,8 0 0 1 8,-8 H456 a8,8 0 0 1 8,8 V112 H256 Z" fill="#c0662b"/><text x="268" y="101" font-size="13.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">2  Cleaning</text><text x="268" y="136" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Decide, log the decision,</text><text x="268" y="153" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">measure whether it mattered</text><rect x="268" y="208" width="184" height="34" rx="5" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="276" y="226" font-size="10.5" fill="#c0662b" font-weight="normal" text-anchor="start">48 duplicates merged: +0.2</text><text x="276" y="240" font-size="10.5" fill="#c0662b" font-weight="normal" text-anchor="start">orders</text><text x="268" y="260" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Ch 14</text><path d="M465,176.0 H475" fill="none" stroke="#5b6475" stroke-width="2" stroke-linejoin="round"/><path d="M475,171.0 L482,176.0 L475,181.0 Z" fill="#5b6475"/><rect x="482" y="81" width="208" height="196" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="480" y="78" width="208" height="196" rx="8" fill="#fff" stroke="#b23b3b" stroke-width="2.6" /><path d="M480,86 a8,8 0 0 1 8,-8 H680 a8,8 0 0 1 8,8 V112 H480 Z" fill="#b23b3b"/><text x="492" y="101" font-size="13.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">3  The check</text><text x="492" y="136" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Split it by the thing that</text><text x="492" y="153" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">could explain both</text><rect x="492" y="208" width="184" height="34" rx="5" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="500" y="226" font-size="10.5" fill="#b23b3b" font-weight="normal" text-anchor="start">662 of 681 are Wholesale</text><text x="492" y="260" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Ch 21, 22</text><path d="M689,176.0 H699" fill="none" stroke="#5b6475" stroke-width="2" stroke-linejoin="round"/><path d="M699,171.0 L706,176.0 L699,181.0 Z" fill="#5b6475"/><rect x="706" y="81" width="208" height="196" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="704" y="78" width="208" height="196" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><path d="M704,86 a8,8 0 0 1 8,-8 H904 a8,8 0 0 1 8,8 V112 H704 Z" fill="#2f7d6d"/><text x="716" y="101" font-size="13.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">4  Python</text><text x="716" y="136" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Turn your choices into</text><text x="716" y="153" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">parameters so they can be</text><text x="716" y="170" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">argued with</text><rect x="716" y="208" width="184" height="34" rx="5" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="724" y="226" font-size="10.5" fill="#2f7d6d" font-weight="normal" text-anchor="start">band_cut 3 / 5 / 8</text><text x="716" y="260" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Ch 17, 18, 20</text><path d="M913,176.0 H923" fill="none" stroke="#5b6475" stroke-width="2" stroke-linejoin="round"/><path d="M923,171.0 L930,176.0 L923,181.0 Z" fill="#5b6475"/><rect x="930" y="81" width="208" height="196" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="928" y="78" width="208" height="196" rx="8" fill="#fff" stroke="#1f6fa3" stroke-width="1.6" /><path d="M928,86 a8,8 0 0 1 8,-8 H1128 a8,8 0 0 1 8,8 V112 H928 Z" fill="#1f6fa3"/><text x="940" y="101" font-size="13.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">5  Dashboard</text><text x="940" y="136" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">One page, one decision, one</text><text x="940" y="153" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">named reader</text><rect x="940" y="208" width="184" height="34" rx="5" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="948" y="226" font-size="10.5" fill="#1f6fa3" font-weight="normal" text-anchor="start">4 objects, nothing else</text><text x="940" y="260" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Ch 15, 16</text><path d="M1137,176.0 H1147" fill="none" stroke="#5b6475" stroke-width="2" stroke-linejoin="round"/><path d="M1147,171.0 L1154,176.0 L1147,181.0 Z" fill="#5b6475"/><rect x="1154" y="81" width="208" height="196" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="1152" y="78" width="208" height="196" rx="8" fill="#fff" stroke="#7a4fa0" stroke-width="1.6" /><path d="M1152,86 a8,8 0 0 1 8,-8 H1352 a8,8 0 0 1 8,8 V112 H1152 Z" fill="#7a4fa0"/><text x="1164" y="101" font-size="13.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">6  Memo</text><text x="1164" y="136" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Recommendation first, and</text><text x="1164" y="153" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">what did not support it</text><rect x="1164" y="208" width="184" height="34" rx="5" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="1172" y="226" font-size="10.5" fill="#7a4fa0" font-weight="normal" text-anchor="start">Recommendation: no</text><text x="1164" y="260" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Ch 23, 24</text><path d="M32,304 H1360" fill="none" stroke="#c9d3df" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="4 4"/><text x="32" y="330" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">Stage 3 is the one that separates a capstone from a tutorial. It is also the one nobody can tell you skipped.</text></svg>