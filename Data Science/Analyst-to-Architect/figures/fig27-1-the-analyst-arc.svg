<svg xmlns="http://www.w3.org/2000/svg" width="600" height="312.0" viewBox="0 0 600 312.0" font-family="DejaVu Sans, Arial, sans-serif"><rect width="600" height="312.0" fill="#ffffff"/><rect x="8" y="4" width="181" height="118.0" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.3" /><path d="M8,11 a7,7 0 0 1 7,-7 H182 a7,7 0 0 1 7,7 V28 H8 Z" fill="#0f5c8c"/><text x="17" y="20.5" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start">1  SQL</text><text x="17" y="44.0" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">Get the headline out of the</text><text x="17" y="57.5" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">database</text><rect x="17" y="71.0" width="163" height="23" rx="4" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="23" y="85.0" font-size="9.5" fill="#0f5c8c" font-weight="bold" text-anchor="start">14.8 orders vs 9.3</text><text x="17" y="113.0" font-size="9" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Chapters 12, 13</text><path d="M191,63.0 H203" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M202,59.0 L208,63.0 L202,67.0 Z" fill="#5b6475"/><rect x="209" y="4" width="181" height="118.0" rx="7" fill="#fff" stroke="#b35a1f" stroke-width="1.3" /><path d="M209,11 a7,7 0 0 1 7,-7 H383 a7,7 0 0 1 7,7 V28 H209 Z" fill="#b35a1f"/><text x="218" y="20.5" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start">2  Cleaning</text><text x="218" y="44.0" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">Decide, log the decision,</text><text x="218" y="57.5" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">measure whether it mattered</text><rect x="218" y="71.0" width="163" height="23" rx="4" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="224" y="85.0" font-size="9.5" fill="#b35a1f" font-weight="bold" text-anchor="start">48 duplicates: +0.2 orders</text><text x="218" y="113.0" font-size="9" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Chapter 14</text><path d="M392,63.0 H404" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M403,59.0 L409,63.0 L403,67.0 Z" fill="#5b6475"/><rect x="410" y="4" width="181" height="118.0" rx="7" fill="#fff" stroke="#b23b3b" stroke-width="2.6" /><path d="M410,11 a7,7 0 0 1 7,-7 H584 a7,7 0 0 1 7,7 V28 H410 Z" fill="#b23b3b"/><text x="419" y="20.5" font-size="10" fill="#fff" font-weight="bold" text-anchor="start">3  The check  · often skipped</text><text x="419" y="44.0" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">Split it by the thing that could</text><text x="419" y="57.5" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">explain both</text><rect x="419" y="71.0" width="163" height="23" rx="4" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="425" y="85.0" font-size="9.5" fill="#b23b3b" font-weight="bold" text-anchor="start">662 of 681 are Wholesale</text><text x="419" y="113.0" font-size="9" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Chapters 21, 22</text><rect x="8" y="152.0" width="181" height="118.0" rx="7" fill="#fff" stroke="#2f7d6d" stroke-width="1.3" /><path d="M8,159.0 a7,7 0 0 1 7,-7 H182 a7,7 0 0 1 7,7 V176.0 H8 Z" fill="#2f7d6d"/><text x="17" y="168.5" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start">4  Python</text><text x="17" y="192.0" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">Turn your choices into</text><text x="17" y="205.5" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">parameters to argue with</text><rect x="17" y="219.0" width="163" height="23" rx="4" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="23" y="233.0" font-size="9.5" fill="#2f7d6d" font-weight="bold" text-anchor="start">band_cut 3 / 5 / 8</text><text x="17" y="261.0" font-size="9" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Chapters 17, 18, 20</text><path d="M191,211.0 H203" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M202,207.0 L208,211.0 L202,215.0 Z" fill="#5b6475"/><rect x="209" y="152.0" width="181" height="118.0" rx="7" fill="#fff" stroke="#1f6fa3" stroke-width="1.3" /><path d="M209,159.0 a7,7 0 0 1 7,-7 H383 a7,7 0 0 1 7,7 V176.0 H209 Z" fill="#1f6fa3"/><text x="218" y="168.5" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start">5  Dashboard</text><text x="218" y="192.0" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">One page, one decision, one</text><text x="218" y="205.5" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">named reader</text><rect x="218" y="219.0" width="163" height="23" rx="4" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="224" y="233.0" font-size="9.5" fill="#1f6fa3" font-weight="bold" text-anchor="start">4 objects, nothing else</text><text x="218" y="261.0" font-size="9" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Chapters 15, 16</text><path d="M392,211.0 H404" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M403,207.0 L409,211.0 L403,215.0 Z" fill="#5b6475"/><rect x="410" y="152.0" width="181" height="118.0" rx="7" fill="#fff" stroke="#7a4fa0" stroke-width="1.3" /><path d="M410,159.0 a7,7 0 0 1 7,-7 H584 a7,7 0 0 1 7,7 V176.0 H410 Z" fill="#7a4fa0"/><text x="419" y="168.5" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start">6  Memo</text><text x="419" y="192.0" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">Recommendation first, and</text><text x="419" y="205.5" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">what did not support it</text><rect x="419" y="219.0" width="163" height="23" rx="4" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="425" y="233.0" font-size="9.5" fill="#7a4fa0" font-weight="bold" text-anchor="start">Recommendation: no</text><text x="419" y="261.0" font-size="9" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Chapters 23, 24</text><path d="M500.5,123.0 V137.0 H98.5" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M98.5,137.0 V146.0" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M94.5,145.0 L98.5,151.0 L102.5,145.0 Z" fill="#5b6475"/><text x="8" y="290.0" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">Stage 3 is the one that separates a capstone from a tutorial. It is also the one nobody can tell you</text><text x="8" y="304.0" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">skipped.</text></svg>