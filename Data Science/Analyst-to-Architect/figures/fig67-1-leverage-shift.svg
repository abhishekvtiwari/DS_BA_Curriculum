<svg xmlns="http://www.w3.org/2000/svg" width="660" height="180" viewBox="0 0 660 180" font-family="DejaVu Sans, Arial, sans-serif"><rect width="660" height="180" fill="#ffffff"/><text x="12" y="22" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The shift every architect eventually makes</text><rect x="15" y="44" width="262" height="128.0" rx="7" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="12" y="40" width="262" height="128.0" rx="7" fill="#fff" stroke="#5b6475" stroke-width="1.6" /><path d="M12,48 a7,7 0 0 1 7,-7 H267 a7,7 0 0 1 7,7 V66 H12 Z" fill="#5b6475"/><text x="143.0" y="58" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Individual contribution</text><text x="143.0" y="84" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="middle">Impact: what you personally</text><text x="143.0" y="98" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="middle">build, this week</text><text x="143.0" y="119.0" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="middle">Scales with your own hours</text><text x="143.0" y="140.0" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="middle">Skill: write the best query,</text><text x="143.0" y="154.0" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="middle">the cleanest pipeline</text><rect x="386" y="44" width="262" height="128.0" rx="7" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="383" y="40" width="262" height="128.0" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><path d="M383,48 a7,7 0 0 1 7,-7 H638 a7,7 0 0 1 7,7 V66 H383 Z" fill="#0f5c8c"/><text x="514.0" y="58" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Leverage</text><text x="514.0" y="84" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="middle">Impact: the decisions you make</text><text x="514.0" y="98" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="middle">and the people you enable</text><text x="514.0" y="119.0" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="middle">Scales with judgment and trust</text><text x="514.0" y="140.0" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="middle">Skill: make the right call, and</text><text x="514.0" y="154.0" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="middle">get others to build it well</text><path d="M282,104.0 L377,104.0" fill="none" stroke="#b7791f" stroke-width="2.2" stroke-linejoin="round"/><path d="M377,104.0 L370.7,107.0 L370.7,101.0 Z" fill="#b7791f"/><text x="330.0" y="94.0" font-size="11" fill="#b7791f" font-weight="bold" text-anchor="middle">the shift</text></svg>