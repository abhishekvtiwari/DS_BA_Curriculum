<svg xmlns="http://www.w3.org/2000/svg" width="740" height="312" viewBox="0 0 740 312" font-family="DejaVu Sans, Arial, sans-serif"><rect width="740" height="312" fill="#ffffff"/><text x="20" y="28" font-size="15" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Cost and failure: the work that decides the bill and the uptime</text><rect x="20" y="48" width="340" height="250" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><text x="36" y="74" font-size="12.5" fill="#2f7d6d" font-weight="bold" text-anchor="start">Exact-match cache, a normal day</text><text x="36" y="92" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">48 requests: 40 new emails, 8 resends</text><text x="36" y="124" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">no cache</text><rect x="36" y="132" width="300" height="30" rx="4" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><rect x="36" y="132" width="300.0" height="30" rx="4" fill="#5b6475" stroke="#5b6475" stroke-width="1" /><text x="46" y="152" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="start">₹3.82</text><text x="36" y="190" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">with cache</text><rect x="36" y="198" width="300" height="30" rx="4" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><rect x="36" y="198" width="250.30886962935648" height="30" rx="4" fill="#2f7d6d" stroke="#2f7d6d" stroke-width="1" /><text x="46" y="218" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="start">₹3.19</text><text x="36" y="258" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">hit rate 17%, 17% of the cost saved:</text><text x="36" y="276" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">a cache saves only what repeats.</text><rect x="380" y="48" width="340" height="250" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><text x="396" y="74" font-size="12.5" fill="#0f5c8c" font-weight="bold" text-anchor="start">Fallback, provider failing 20% of calls</text><text x="396" y="92" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">60 golden-set emails</text><text x="396" y="124" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">pinned model</text><rect x="396" y="132" width="250" height="22" rx="4" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><rect x="396" y="132" width="183.33333333333334" height="22" rx="4" fill="#2f7d6d" stroke="#2f7d6d" stroke-width="1" /><text x="656" y="148" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">44 of 60</text><text x="396" y="174" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">cheaper fallback</text><rect x="396" y="182" width="250" height="22" rx="4" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><rect x="396" y="182" width="54.166666666666664" height="22" rx="4" fill="#0f5c8c" stroke="#0f5c8c" stroke-width="1" /><text x="656" y="198" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">13 of 60</text><text x="396" y="224" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">failed: to a person</text><rect x="396" y="232" width="250" height="22" rx="4" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><rect x="396" y="232" width="12.5" height="22" rx="4" fill="#b23b3b" stroke="#b23b3b" stroke-width="1" /><text x="656" y="248" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">3 of 60</text><text x="396" y="276" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">95% served, through 41</text><text x="396" y="294" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">provider errors.</text></svg>