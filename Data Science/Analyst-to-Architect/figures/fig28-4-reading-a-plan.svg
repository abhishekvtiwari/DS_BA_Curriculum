<svg xmlns="http://www.w3.org/2000/svg" width="700" height="371" viewBox="0 0 700 371" font-family="DejaVu Sans, Arial, sans-serif"><rect width="700" height="371" fill="#ffffff"/><text x="20" y="24" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Reading EXPLAIN ANALYZE from the inside out</text><text x="20" y="42" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">customer 2718&#x27;s revenue, before order_items.order_id had an index (loops=1 and the Hash&#x27;s memory line trimmed)</text><rect x="24" y="57" width="18" height="18" rx="9" fill="#c0662b" stroke="none" stroke-width="1" /><text x="33" y="70" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="middle">5</text><text x="50" y="70" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Aggregate (actual time=285.475..285.485 rows=1)</text><rect x="24" y="79" width="18" height="18" rx="9" fill="#c0662b" stroke="none" stroke-width="1" /><text x="33" y="92" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="middle">4</text><text x="64" y="92" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">-&gt;  Hash Join (actual time=5.181..285.266 rows=108)</text><text x="92" y="114" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Hash Cond: (oi.order_id = o.order_id)</text><rect x="24" y="123" width="18" height="18" rx="9" fill="#c0662b" stroke="none" stroke-width="1" /><text x="33" y="136" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="middle">3</text><text x="78" y="136" font-size="10.5" fill="#b23b3b" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">-&gt;  Seq Scan on order_items oi (actual time=0.027..142.289 rows=1926847)</text><rect x="24" y="145" width="18" height="18" rx="9" fill="#c0662b" stroke="none" stroke-width="1" /><text x="33" y="158" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="middle">2</text><text x="78" y="158" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">-&gt;  Hash (actual time=0.151..0.158 rows=40)</text><text x="92" y="180" font-size="10.5" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">-&gt;  Bitmap Heap Scan on orders o (actual time=0.025..0.143 rows=40)</text><rect x="24" y="189" width="18" height="18" rx="9" fill="#c0662b" stroke="none" stroke-width="1" /><text x="33" y="202" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="middle">1</text><text x="106" y="202" font-size="10.5" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">-&gt;  Bitmap Index Scan on idx_orders_customer_id (actual time=0.014..0.015 rows=40)</text><text x="50" y="224" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Execution Time: 285.549 ms</text><rect x="16" y="52" width="674" height="182" rx="6" fill="none" stroke="#c9d3df" stroke-width="1" /><text x="20" y="260" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">1  Start at the most indented step: the index finds customer 2718&#x27;s 40 orders in 0.015 ms.</text><text x="20" y="279" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">2  The table rows are fetched, and their 40 order ids go into a small in-memory hash table.</text><text x="20" y="298" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">3  The expensive step: all 1,926,847 order lines are read, taking 142 ms of the total.</text><text x="20" y="317" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">4  The Hash Join checks each line against the hash table and keeps 108: another 143 ms.</text><text x="20" y="336" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">5  The top node is the final result. Its last time, 285 ms, is the whole query.</text><text x="20" y="359" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Times are milliseconds, shown as first row..last row. This is one run; the median of seven was 262.47 ms.</text></svg>