xt><rect x="520" y="484" width="350" height="24" rx="0" fill="#fff" stroke="#c9d3df" stroke-width="0.8" /><text x="527" y="500.5" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">103</text><text x="617" y="500.5" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Water Bottle 1L</text><text x="777" y="500.5" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Kitchen</text><rect x="520" y="412" width="350" height="96" rx="5" fill="none" stroke="#5b6475" stroke-width="1.5" /><path d="M410,126 C465,126 465,59 520,59" fill="none" stroke="#0f5c8c" stroke-width="2" stroke-linejoin="round"/><path d="M410,188 C465,188 465,151 520,151" fill="none" stroke="#2f7d6d" stroke-width="2" stroke-linejoin="round"/><path d="M410,240 C465,240 465,243 520,243" fill="none" stroke="#7a4fa0" stroke-width="2" stroke-linejoin="round"/><path d="M410,330 C465,330 465,346 520,346" fill="none" stroke="#c0662b" stroke-width="2" stroke-linejoin="round"/><path d="M410,350 C465,350 465,452 520,452" fill="none" stroke="#5b6475" stroke-width="2" stroke-linejoin="round"/><text x="520" y="535" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">Keys tie the pieces together:</text><text x="520" y="555" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">orders.customer_id = 1 finds the customer; sales_rep_id = 3 finds the rep;</text><text x="520" y="573" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">order_items.order_id = 5001 finds the lines; product_id finds each product.</text></svg>