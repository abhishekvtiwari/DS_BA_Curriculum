<svg xmlns="http://www.w3.org/2000/svg" width="910" height="590" viewBox="0 0 910 590" font-family="DejaVu Sans, Arial, sans-serif"><rect width="910" height="590" fill="#ffffff"/><rect x="20" y="190" width="210" height="92" rx="8" fill="#eef2f6" stroke="#1d2330" stroke-width="1.6" /><text x="30" y="210" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">Why did March billed</text><text x="30" y="227" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">revenue fall 80.3%?</text><text x="30" y="244" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">₹161,700 → ₹31,800</text><rect x="300" y="40" width="250" height="92" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><text x="310" y="60" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">Fewer invoiced orders?</text><text x="310" y="77" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">5 in Feb → 2 in Mar</text><text x="310" y="94" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">−₹97,020 of the fall</text><rect x="446" y="108" width="96" height="18" rx="9" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="494" y="121" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="middle">MAIN CAUSE</text><path d="M230,236 H265 V86 H300" fill="none" stroke="#c9d3df" stroke-width="1.6" stroke-linejoin="round"/><rect x="300" y="190" width="250" height="92" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><text x="310" y="210" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">Smaller orders?</text><text x="310" y="227" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">avg ₹32,340 → ₹15,900</text><text x="310" y="244" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">−₹32,880 of the fall</text><rect x="446" y="258" width="96" height="18" rx="9" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="494" y="271" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="middle">CONTRIBUTES</text><path d="M230,236 H265 V236 H300" fill="none" stroke="#c9d3df" stroke-width="1.6" stroke-linejoin="round"/><rect x="300" y="340" width="250" height="92" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><text x="310" y="360" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">Timing or season?</text><text x="310" y="377" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">March not closed; one</text><text x="310" y="394" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">order still Pending</text><rect x="446" y="408" width="96" height="18" rx="9" fill="#c0662b" stroke="none" stroke-width="1" /><text x="494" y="421" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="middle">PARTLY</text><path d="M230,236 H265 V386 H300" fill="none" stroke="#c9d3df" stroke-width="1.6" stroke-linejoin="round"/><rect x="620" y="10" width="270" height="80" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><text x="630" y="30" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">Which customers stopped?</text><text x="630" y="47" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Coastal, Sunrise, Northgate:</text><text x="630" y="64" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">ordered Feb, not Mar</text><rect x="786" y="66" width="96" height="18" rx="9" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="834" y="79" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="middle">FOUND</text><rect x="620" y="110" width="270" height="80" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><text x="630" y="130" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">Why didn&#x27;t they reorder?</text><text x="630" y="147" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">all three have overdue</text><text x="630" y="164" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">balances (₹82,510)</text><rect x="786" y="166" width="96" height="18" rx="9" fill="#7a4fa0" stroke="none" stroke-width="1" /><text x="834" y="179" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="middle">TEST: CALL</text><rect x="620" y="210" width="270" height="80" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><text x="630" y="230" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">Mix: wholesale orders?</text><text x="630" y="247" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">67.5% of Feb billed;</text><text x="630" y="264" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">none placed in March</text><rect x="786" y="266" width="96" height="18" rx="9" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="834" y="279" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="middle">FOUND</text><rect x="620" y="310" width="270" height="80" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><text x="630" y="330" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">Pending order 5012</text><text x="630" y="347" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">₹26,220 booked, not billed;</text><text x="630" y="364" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">with it, March = ₹58,020</text><rect x="786" y="366" width="96" height="18" rx="9" fill="#c0662b" stroke="none" stroke-width="1" /><text x="834" y="379" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="middle">TIMING</text><rect x="620" y="410" width="270" height="80" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><text x="630" y="430" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">Seasonal March dip?</text><text x="630" y="447" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">needs March last year:</text><text x="630" y="464" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">not in this data</text><rect x="786" y="466" width="96" height="18" rx="9" fill="#5b6475" stroke="none" stroke-width="1" /><text x="834" y="479" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="middle">UNKNOWN</text><path d="M550,86 H585 V50 H620" fill="none" stroke="#c9d3df" stroke-width="1.6" stroke-linejoin="round"/><path d="M550,86 H585 V150 H620" fill="none" stroke="#c9d3df" stroke-width="1.6" stroke-linejoin="round"/><path d="M550,236 H585 V250 H620" fill="none" stroke="#c9d3df" stroke-width="1.6" stroke-linejoin="round"/><path d="M550,386 H585 V350 H620" fill="none" stroke="#c9d3df" stroke-width="1.6" stroke-linejoin="round"/><path d="M550,386 H585 V450 H620" fill="none" stroke="#c9d3df" stroke-width="1.6" stroke-linejoin="round"/><rect x="20" y="499" width="14" height="14" rx="3" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="40" y="510" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">supported by the data</text><rect x="20" y="519" width="14" height="14" rx="3" fill="#c0662b" stroke="none" stroke-width="1" /><text x="40" y="530" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">partly explains</text><rect x="20" y="539" width="14" height="14" rx="3" fill="#7a4fa0" stroke="none" stroke-width="1" /><text x="40" y="550" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">hypothesis to test outside the data</text><rect x="20" y="559" width="14" height="14" rx="3" fill="#5b6475" stroke="none" stroke-width="1" /><text x="40" y="570" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">can&#x27;t be answered with this data</text></svg>