<svg xmlns="http://www.w3.org/2000/svg" width="720" height="542" viewBox="0 0 720 542" font-family="DejaVu Sans, Arial, sans-serif"><rect width="720" height="542" fill="#ffffff"/><rect x="430" y="10" width="280" height="88" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><text x="440" y="30" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Which customers stopped?</text><text x="440" y="47" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start">Coastal, Sunrise, Northgate:</text><text x="440" y="64" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start">ordered Feb, not Mar</text><rect x="642" y="72" width="60" height="20" rx="10" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="672.0" y="86.5" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">FOUND</text><rect x="430" y="106" width="280" height="88" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><text x="440" y="126" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Why didn&#x27;t they reorder?</text><text x="440" y="143" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start">all three have overdue</text><text x="440" y="160" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start">balances (₹82,510)</text><rect x="602" y="168" width="100" height="20" rx="10" fill="#7a4fa0" stroke="none" stroke-width="1" /><text x="652.0" y="182.5" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">TEST: CALL</text><rect x="430" y="202" width="280" height="88" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><text x="440" y="222" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Mix: wholesale orders?</text><text x="440" y="239" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start">67.5% of Feb billed;</text><text x="440" y="256" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start">none placed in March</text><rect x="642" y="264" width="60" height="20" rx="10" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="672.0" y="278.5" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">FOUND</text><rect x="430" y="298" width="280" height="88" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><text x="440" y="318" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Pending order 5012</text><text x="440" y="335" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start">₹26,220 booked, not billed;</text><text x="440" y="352" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start">with it, March = ₹58,020</text><rect x="634" y="360" width="68" height="20" rx="10" fill="#c0662b" stroke="none" stroke-width="1" /><text x="668.0" y="374.5" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">TIMING</text><rect x="430" y="394" width="280" height="88" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><text x="440" y="414" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Seasonal March dip?</text><text x="440" y="431" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start">needs March last year:</text><text x="440" y="448" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start">not in this data</text><rect x="626" y="456" width="76" height="20" rx="10" fill="#5b6475" stroke="none" stroke-width="1" /><text x="664.0" y="470.5" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">UNKNOWN</text><rect x="202" y="54.0" width="196" height="96" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><text x="212" y="74.0" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Fewer invoiced orders?</text><text x="212" y="91.0" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start">5 in Feb → 2 in Mar</text><text x="212" y="108.0" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start">−₹97,020 of the fall</text><rect x="290" y="124.0" width="100" height="20" rx="10" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="340.0" y="138.5" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">MAIN CAUSE</text><path d="M398,102.0 H414 V54.0 H430" fill="none" stroke="#c9d3df" stroke-width="1.6" stroke-linejoin="round"/><path d="M398,102.0 H414 V150.0 H430" fill="none" stroke="#c9d3df" stroke-width="1.6" stroke-linejoin="round"/><rect x="202" y="198.0" width="196" height="96" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><text x="212" y="218.0" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Smaller orders?</text><text x="212" y="235.0" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start">avg ₹32,340 → ₹15,900</text><text x="212" y="252.0" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start">−₹32,880 of the fall</text><rect x="282" y="268.0" width="108" height="20" rx="10" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="336.0" y="282.5" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">CONTRIBUTES</text><path d="M398,246.0 H414 V246.0 H430" fill="none" stroke="#c9d3df" stroke-width="1.6" stroke-linejoin="round"/><rect x="202" y="342.0" width="196" height="96" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><text x="212" y="362.0" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Timing or season?</text><text x="212" y="379.0" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start">March not closed; one</text><text x="212" y="396.0" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start">order still Pending</text><rect x="322" y="412.0" width="68" height="20" rx="10" fill="#c0662b" stroke="none" stroke-width="1" /><text x="356.0" y="426.5" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">PARTLY</text><path d="M398,390.0 H414 V342.0 H430" fill="none" stroke="#c9d3df" stroke-width="1.6" stroke-linejoin="round"/><path d="M398,390.0 H414 V438.0 H430" fill="none" stroke="#c9d3df" stroke-width="1.6" stroke-linejoin="round"/><rect x="10" y="198.0" width="166" height="96" rx="8" fill="#eef2f6" stroke="#1d2330" stroke-width="1.6" /><text x="20" y="218.0" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Why did March</text><text x="20" y="235.0" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start">billed revenue</text><text x="20" y="252.0" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start">fall 80.3%?</text><text x="20" y="269.0" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start">₹1,61,700 → ₹31,800</text><path d="M176,246.0 H192 V102.0 H202" fill="none" stroke="#c9d3df" stroke-width="1.6" stroke-linejoin="round"/><path d="M176,246.0 H192 V246.0 H202" fill="none" stroke="#c9d3df" stroke-width="1.6" stroke-linejoin="round"/><path d="M176,246.0 H192 V390.0 H202" fill="none" stroke="#c9d3df" stroke-width="1.6" stroke-linejoin="round"/><rect x="10" y="496" width="14" height="14" rx="3" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="30" y="508" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">supported by the data</text><rect x="280" y="496" width="14" height="14" rx="3" fill="#c0662b" stroke="none" stroke-width="1" /><text x="300" y="508" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">partly explains</text><rect x="10" y="518" width="14" height="14" rx="3" fill="#7a4fa0" stroke="none" stroke-width="1" /><text x="30" y="530" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">hypothesis to test outside the data</text><rect x="280" y="518" width="14" height="14" rx="3" fill="#5b6475" stroke="none" stroke-width="1" /><text x="300" y="530" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">can&#x27;t be answered with this data</text><text x="710" y="508" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="end" font-style="italic">Source: Mini database (Jan–Mar 2026).</text></svg>