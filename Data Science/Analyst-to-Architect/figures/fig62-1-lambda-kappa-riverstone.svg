<svg xmlns="http://www.w3.org/2000/svg" width="680" height="424" viewBox="0 0 680 424" font-family="DejaVu Sans, Arial, sans-serif"><rect width="680" height="424" fill="#ffffff"/><text x="12" y="22" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">One need, two shapes: the plant-sensor case from Chapter 50</text><text x="12" y="48" font-size="11.5" fill="#0f5c8c" font-weight="bold" text-anchor="start">LAMBDA: what Chapter 50 built</text><text x="346" y="48" font-size="11.5" fill="#2f7d6d" font-weight="bold" text-anchor="start">KAPPA: the same need, one path</text><rect x="12" y="58" width="322" height="62.8" rx="6" fill="#fff" stroke="#6b7383" stroke-width="1.4" /><path d="M12,64 a6,6 0 0 1 6,-6 H328 a6,6 0 0 1 6,6 V79.6 H12 Z" fill="#6b7383"/><text x="20" y="72.5" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start">Sources</text><text x="20" y="97.1" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Machine controllers send a reading every 10 seconds to</text><text x="20" y="110.69999999999999" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">the sensor-readings topic.</text><rect x="12" y="142.8" width="156.0" height="121.19999999999999" rx="6" fill="#fff" stroke="#b35a1f" stroke-width="1.4" /><path d="M12,148.8 a6,6 0 0 1 6,-6 H162.0 a6,6 0 0 1 6,6 V164.4 H12 Z" fill="#b35a1f"/><text x="20" y="157.3" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start">Speed layer (live)</text><text x="20" y="181.9" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Alert consumer: 2-minute</text><text x="20" y="195.5" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">average per machine;</text><text x="20" y="209.1" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">raises the line alert.</text><text x="20" y="226.7" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Streaming job: 5-minute</text><text x="20" y="240.29999999999998" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">windows into a streaming</text><text x="20" y="253.89999999999998" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">table.</text><rect x="178.0" y="142.8" width="156.0" height="121.19999999999999" rx="6" fill="#fff" stroke="#0f5c8c" stroke-width="1.4" /><path d="M178.0,148.8 a6,6 0 0 1 6,-6 H328.0 a6,6 0 0 1 6,6 V164.4 H178.0 Z" fill="#0f5c8c"/><text x="186.0" y="157.3" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start">Batch layer (daily)</text><text x="186.0" y="181.9" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Correction job: re-reads</text><text x="186.0" y="195.5" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">the day from the archive.</text><text x="186.0" y="213.1" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Rewrites yesterday&#x27;s</text><text x="186.0" y="226.7" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">windows into a corrected</text><text x="186.0" y="240.29999999999998" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">table.</text><path d="M90.0,122.80000000000001 L90.0,140.8" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M90.0,140.8 L87.0,134.5 L93.0,134.5 Z" fill="#5b6475"/><path d="M256.0,122.80000000000001 L256.0,140.8" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M256.0,140.8 L253.0,134.5 L259.0,134.5 Z" fill="#5b6475"/><rect x="12" y="286.0" width="322" height="62.8" rx="6" fill="#fff" stroke="#7a4fa0" stroke-width="1.4" /><path d="M12,292.0 a6,6 0 0 1 6,-6 H328 a6,6 0 0 1 6,6 V307.6 H12 Z" fill="#7a4fa0"/><text x="20" y="300.5" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start">Serving layer: the dashboard query</text><text x="20" y="325.1" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Reads the corrected table for past days and the</text><text x="20" y="338.70000000000005" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">streaming table for today.</text><path d="M90.0,266.0 L90.0,284.0" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M90.0,284.0 L87.0,277.7 L93.0,277.7 Z" fill="#5b6475"/><path d="M256.0,266.0 L256.0,284.0" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M256.0,284.0 L253.0,277.7 L259.0,277.7 Z" fill="#5b6475"/><rect x="346" y="58" width="322" height="62.8" rx="6" fill="#fff" stroke="#6b7383" stroke-width="1.4" /><path d="M346,64 a6,6 0 0 1 6,-6 H662 a6,6 0 0 1 6,6 V79.6 H346 Z" fill="#6b7383"/><text x="354" y="72.5" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start">Sources</text><text x="354" y="97.1" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">The same readings, on a topic kept for months, so any</text><text x="354" y="110.69999999999999" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">stretch of history can be replayed.</text><rect x="346" y="142.8" width="322" height="62.8" rx="6" fill="#fff" stroke="#2f7d6d" stroke-width="1.4" /><path d="M346,148.8 a6,6 0 0 1 6,-6 H662 a6,6 0 0 1 6,6 V164.4 H346 Z" fill="#2f7d6d"/><text x="354" y="157.3" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start">One streaming job</text><text x="354" y="181.9" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Raises the line alert, and writes 5-minute windows into</text><text x="354" y="195.5" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">one table.</text><path d="M507.0,122.80000000000001 L507.0,140.8" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M507.0,140.8 L504.0,134.5 L510.0,134.5 Z" fill="#5b6475"/><rect x="346" y="227.60000000000002" width="322" height="49.2" rx="6" fill="#fff" stroke="#7a4fa0" stroke-width="1.4" /><path d="M346,233.60000000000002 a6,6 0 0 1 6,-6 H662 a6,6 0 0 1 6,6 V249.20000000000002 H346 Z" fill="#7a4fa0"/><text x="354" y="242.10000000000002" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start">Serving: the dashboard query</text><text x="354" y="266.70000000000005" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Reads the one table.</text><path d="M507.0,207.60000000000002 L507.0,225.60000000000002" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M507.0,225.60000000000002 L504.0,219.3 L510.0,219.3 Z" fill="#5b6475"/><rect x="346" y="298.8" width="308" height="76.4" rx="6" fill="#fff" stroke="#2f7d6d" stroke-width="1.4" stroke-dasharray="5,3"/><path d="M346,304.8 a6,6 0 0 1 6,-6 H648 a6,6 0 0 1 6,6 V320.40000000000003 H346 Z" fill="#2f7d6d"/><text x="354" y="313.3" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start">To correct history: replay</text><text x="354" y="337.90000000000003" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Only when needed: reset the job&#x27;s offsets to the start</text><text x="354" y="351.50000000000006" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">of the topic and run the same code again, with a</text><text x="354" y="365.1" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">longer watermark, since nobody is waiting on it.</text><path d="M654,337.0 H672 V89.4" fill="none" stroke="#2f7d6d" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="4,3"/><path d="M672,89.4 L670,89.4" fill="none" stroke="#2f7d6d" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="4,3"/><path d="M670,89.4 L676.3,86.4 L676.3,92.4 Z" fill="#2f7d6d"/><text x="12" y="397.70000000000005" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">Cost: the window logic lives in two jobs that must</text><text x="12" y="411.30000000000007" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">keep agreeing.</text><text x="346" y="397.70000000000005" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">Cost: months of retention, and a replay you must</text><text x="346" y="411.30000000000007" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">trust.</text></svg>