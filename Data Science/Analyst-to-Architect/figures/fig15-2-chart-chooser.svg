<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="490" viewBox="0 0 1040 490" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1040" height="490" fill="#ffffff"/><text x="30" y="32" font-size="15" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Start from the question, then choose the chart</text><text x="30" y="70" font-size="12" fill="#5b6475" font-weight="bold" text-anchor="start">The question</text><text x="390" y="70" font-size="12" fill="#5b6475" font-weight="bold" text-anchor="start">First choice</text><text x="640" y="70" font-size="12" fill="#5b6475" font-weight="bold" text-anchor="start">Also consider</text><rect x="30" y="84" width="980" height="52" rx="7" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="30" y="84" width="8" height="52" rx="2" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="52" y="106" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start">Compare categories</text><text x="52" y="125" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">Which is biggest? How do they rank?</text><rect x="386" y="95" width="236" height="30" rx="15" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="504" y="115" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="middle">Sorted bar chart</text><text x="640" y="115" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">dot plot · lollipop · table for exact values</text><rect x="30" y="146" width="980" height="52" rx="7" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="30" y="146" width="8" height="52" rx="2" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="52" y="168" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start">Show change over time</text><text x="52" y="187" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">Is it rising? When did it change?</text><rect x="386" y="157" width="236" height="30" rx="15" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="504" y="177" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="middle">Line chart</text><text x="640" y="177" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">column chart for few periods · slope chart · sparkline</text><rect x="30" y="208" width="980" height="52" rx="7" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="30" y="208" width="8" height="52" rx="2" fill="#7a4fa0" stroke="none" stroke-width="1" /><text x="52" y="230" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start">Show a distribution</text><text x="52" y="249" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">What&#x27;s typical? How spread out? Outliers?</text><rect x="386" y="219" width="236" height="30" rx="15" fill="#7a4fa0" stroke="none" stroke-width="1" /><text x="504" y="239" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="middle">Histogram · box plot</text><text x="640" y="239" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">strip or dot plot · density curve</text><rect x="30" y="270" width="980" height="52" rx="7" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="30" y="270" width="8" height="52" rx="2" fill="#c0662b" stroke="none" stroke-width="1" /><text x="52" y="292" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start">Show a relationship</text><text x="52" y="311" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">Do two measures move together?</text><rect x="386" y="281" width="236" height="30" rx="15" fill="#c0662b" stroke="none" stroke-width="1" /><text x="504" y="301" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="middle">Scatter plot</text><text x="640" y="301" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">bubble chart · heatmap of binned values</text><rect x="30" y="332" width="980" height="52" rx="7" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="30" y="332" width="8" height="52" rx="2" fill="#b7791f" stroke="none" stroke-width="1" /><text x="52" y="354" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start">Show parts of a whole</text><text x="52" y="373" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">What share does each part take?</text><rect x="386" y="343" width="236" height="30" rx="15" fill="#b7791f" stroke="none" stroke-width="1" /><text x="504" y="363" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="middle">Stacked or 100% bar</text><text x="640" y="363" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">pie (2–3 parts) · treemap · waterfall for changes</text><rect x="30" y="394" width="980" height="52" rx="7" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="30" y="394" width="8" height="52" rx="2" fill="#1d2330" stroke="none" stroke-width="1" /><text x="52" y="416" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start">Show where</text><text x="52" y="435" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">Does location matter?</text><rect x="386" y="405" width="236" height="30" rx="15" fill="#1d2330" stroke="none" stroke-width="1" /><text x="504" y="425" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="middle">Map (filled or dots)</text><text x="640" y="425" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">sorted bar of regions · tile grid</text><text x="30" y="470" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Two more questions decide the details: who is reading it, and what should they do next?</text></svg>