<svg xmlns="http://www.w3.org/2000/svg" width="720" height="438" viewBox="0 0 720 438" font-family="DejaVu Sans, Arial, sans-serif"><rect width="720" height="438" fill="#ffffff"/><text x="16" y="26" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Start from the question, then choose the chart</text><text x="16" y="54" font-size="11" fill="#5b6475" font-weight="bold" text-anchor="start">The question</text><text x="292" y="54" font-size="11" fill="#5b6475" font-weight="bold" text-anchor="start">First choice</text><text x="466" y="54" font-size="11" fill="#5b6475" font-weight="bold" text-anchor="start">Also consider</text><rect x="16" y="64" width="688" height="50" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="16" y="64" width="7" height="50" rx="2" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="32" y="82" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">Compare categories</text><text x="32" y="96" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">Which is biggest? How do they rank?</text><rect x="288" y="74" width="164" height="30" rx="15" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="370" y="93.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">Sorted bar chart</text><text x="466" y="85" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">dot plot · lollipop</text><text x="466" y="99" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">table for exact values</text><rect x="16" y="122" width="688" height="50" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="16" y="122" width="7" height="50" rx="2" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="32" y="140" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">Show change over time</text><text x="32" y="154" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">Is it rising? When did it change?</text><rect x="288" y="132" width="164" height="30" rx="15" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="370" y="151.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">Line chart</text><text x="466" y="143" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">column chart for few periods</text><text x="466" y="157" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">slope chart · sparkline</text><rect x="16" y="180" width="688" height="50" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="16" y="180" width="7" height="50" rx="2" fill="#7a4fa0" stroke="none" stroke-width="1" /><text x="32" y="198" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">Show a distribution</text><text x="32" y="212" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">What&#x27;s typical? How spread out?</text><text x="32" y="224" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">Any outliers?</text><rect x="288" y="190" width="164" height="30" rx="15" fill="#7a4fa0" stroke="none" stroke-width="1" /><text x="370" y="209.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">Histogram · box plot</text><text x="466" y="201" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">strip or dot plot</text><text x="466" y="215" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">density curve</text><rect x="16" y="238" width="688" height="50" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="16" y="238" width="7" height="50" rx="2" fill="#c0662b" stroke="none" stroke-width="1" /><text x="32" y="256" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">Show a relationship</text><text x="32" y="270" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">Do two measures move together?</text><rect x="288" y="248" width="164" height="30" rx="15" fill="#c0662b" stroke="none" stroke-width="1" /><text x="370" y="267.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">Scatter plot</text><text x="466" y="259" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">bubble chart</text><text x="466" y="273" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">heatmap of binned values</text><rect x="16" y="296" width="688" height="50" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="16" y="296" width="7" height="50" rx="2" fill="#b7791f" stroke="none" stroke-width="1" /><text x="32" y="314" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">Show parts of a whole</text><text x="32" y="328" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">What share does each part take?</text><rect x="288" y="306" width="164" height="30" rx="15" fill="#b7791f" stroke="none" stroke-width="1" /><text x="370" y="325.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">Stacked or 100% bar</text><text x="466" y="317" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">pie (2–3 parts) · treemap</text><text x="466" y="331" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">waterfall for changes</text><rect x="16" y="354" width="688" height="50" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="16" y="354" width="7" height="50" rx="2" fill="#1d2330" stroke="none" stroke-width="1" /><text x="32" y="372" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">Show where</text><text x="32" y="386" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">Does location matter?</text><rect x="288" y="364" width="164" height="30" rx="15" fill="#1d2330" stroke="none" stroke-width="1" /><text x="370" y="383.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">Map (filled or dots)</text><text x="466" y="375" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">sorted bar of regions</text><text x="466" y="389" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">tile grid</text><text x="16" y="426" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Three more questions: who reads it, explore or explain, and what should they do next?</text></svg>