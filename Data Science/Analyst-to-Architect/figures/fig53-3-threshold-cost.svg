<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="DejaVu Sans, Arial, sans-serif"><rect width="900" height="400" fill="#ffffff"/><text x="20" y="28" font-size="15" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The threshold is a business decision, not a modelling one</text><path d="M100,340.0 H540" fill="none" stroke="#c9d3df" stroke-width="0.8" stroke-linejoin="round" stroke-dasharray="3,4"/><text x="90" y="345.0" font-size="13" fill="#5b6475" font-weight="normal" text-anchor="end">₹20k</text><path d="M100,276.0 H540" fill="none" stroke="#c9d3df" stroke-width="0.8" stroke-linejoin="round" stroke-dasharray="3,4"/><text x="90" y="281.0" font-size="13" fill="#5b6475" font-weight="normal" text-anchor="end">₹40k</text><path d="M100,212.0 H540" fill="none" stroke="#c9d3df" stroke-width="0.8" stroke-linejoin="round" stroke-dasharray="3,4"/><text x="90" y="217.0" font-size="13" fill="#5b6475" font-weight="normal" text-anchor="end">₹60k</text><path d="M100,148.0 H540" fill="none" stroke="#c9d3df" stroke-width="0.8" stroke-linejoin="round" stroke-dasharray="3,4"/><text x="90" y="153.0" font-size="13" fill="#5b6475" font-weight="normal" text-anchor="end">₹80k</text><path d="M100,84.0 H540" fill="none" stroke="#c9d3df" stroke-width="0.8" stroke-linejoin="round" stroke-dasharray="3,4"/><text x="90" y="89.0" font-size="13" fill="#5b6475" font-weight="normal" text-anchor="end">₹100k</text><path d="M100,340 H540" fill="none" stroke="#5b6475" stroke-width="1.4" stroke-linejoin="round"/><path d="M100,340 V78" fill="none" stroke="#5b6475" stroke-width="1.4" stroke-linejoin="round"/><text x="90" y="68" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="end">cost</text><path d="M120.0,108.96000000000001 L178.57142857142856,198.176 L237.14285714285714,233.632 L295.7142857142857,243.61599999999999 L354.2857142857143,301.088 L412.85714285714283,303.008 L471.42857142857144,301.472 L530.0,265.632" fill="none" stroke="#0f5c8c" stroke-width="2.5" stroke-linejoin="round"/><rect x="115.0" y="103.96000000000001" width="10" height="10" rx="5" fill="#0f5c8c" stroke="#0f5c8c" stroke-width="1" /><text x="120.0" y="360" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="middle">0.5</text><text x="120.0" y="380" font-size="13" fill="#5b6475" font-weight="normal" text-anchor="middle">99.4%</text><rect x="173.57142857142856" y="193.176" width="10" height="10" rx="5" fill="#0f5c8c" stroke="#0f5c8c" stroke-width="1" /><text x="178.57142857142856" y="360" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="middle">0.3</text><text x="178.57142857142856" y="380" font-size="13" fill="#5b6475" font-weight="normal" text-anchor="middle">99.5%</text><rect x="232.14285714285714" y="228.632" width="10" height="10" rx="5" fill="#0f5c8c" stroke="#0f5c8c" stroke-width="1" /><text x="237.14285714285714" y="360" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="middle">0.1</text><text x="237.14285714285714" y="380" font-size="13" fill="#5b6475" font-weight="normal" text-anchor="middle">99.0%</text><rect x="290.7142857142857" y="238.61599999999999" width="10" height="10" rx="5" fill="#0f5c8c" stroke="#0f5c8c" stroke-width="1" /><text x="295.7142857142857" y="360" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="middle">0.05</text><text x="295.7142857142857" y="380" font-size="13" fill="#5b6475" font-weight="normal" text-anchor="middle">98.6%</text><rect x="349.2857142857143" y="296.088" width="10" height="10" rx="5" fill="#0f5c8c" stroke="#0f5c8c" stroke-width="1" /><text x="354.2857142857143" y="360" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="middle">0.02</text><text x="354.2857142857143" y="380" font-size="13" fill="#5b6475" font-weight="normal" text-anchor="middle">97.5%</text><path d="M412.85714285714283,294.008 L421.85714285714283,303.008 L412.85714285714283,312.008 L403.85714285714283,303.008 Z" fill="#2f7d6d"/><text x="412.85714285714283" y="360" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="middle">0.01</text><text x="412.85714285714283" y="380" font-size="13" fill="#5b6475" font-weight="normal" text-anchor="middle">95.7%</text><rect x="466.42857142857144" y="296.472" width="10" height="10" rx="5" fill="#0f5c8c" stroke="#0f5c8c" stroke-width="1" /><text x="471.42857142857144" y="360" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="middle">0.005</text><text x="471.42857142857144" y="380" font-size="13" fill="#5b6475" font-weight="normal" text-anchor="middle">93.2%</text><rect x="525.0" y="260.632" width="10" height="10" rx="5" fill="#0f5c8c" stroke="#0f5c8c" stroke-width="1" /><text x="530.0" y="360" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="middle">0.002</text><text x="530.0" y="380" font-size="13" fill="#5b6475" font-weight="normal" text-anchor="middle">87.0%</text><text x="90" y="360" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="end">threshold</text><text x="90" y="380" font-size="13" fill="#5b6475" font-weight="bold" text-anchor="end">accuracy</text><path d="M412.85714285714283,291.008 V233.00799999999998" fill="none" stroke="#2f7d6d" stroke-width="1.4" stroke-linejoin="round"/><text x="412.85714285714283" y="225.00799999999998" font-size="13" fill="#2f7d6d" font-weight="bold" text-anchor="middle">cheapest: ₹31,560</text><rect x="575" y="60" width="305" height="318" rx="8" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="591" y="86.0" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">A missed defect costs ₹4,000.</text><text x="591" y="105.5" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">A false alarm costs ₹40.</text><text x="591" y="125.0" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start"></text><text x="591" y="144.5" font-size="13" fill="#5b6475" font-weight="normal" text-anchor="start">At 0.5: 23 missed, 5 re-inspected,</text><text x="591" y="164.0" font-size="13" fill="#5b6475" font-weight="normal" text-anchor="start">    ₹92,200</text><text x="591" y="183.5" font-size="13" fill="#5b6475" font-weight="normal" text-anchor="start">At 0.01: 6 missed, 189 re-inspected,</text><text x="591" y="203.0" font-size="13" fill="#5b6475" font-weight="normal" text-anchor="start">    ₹31,560</text><text x="591" y="222.5" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start"></text><text x="591" y="242.0" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">Same model, same 4,500 parts. Only</text><text x="591" y="261.5" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">the threshold changed, and the bill</text><text x="591" y="281.0" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">fell by about two thirds.</text><text x="591" y="300.5" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start"></text><text x="591" y="320.0" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Accuracy is highest at the most</text><text x="591" y="339.5" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">expensive thresholds: it points the</text><text x="591" y="359.0" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">wrong way, so nobody should quote it.</text></svg>