<svg xmlns="http://www.w3.org/2000/svg" width="700" height="362" viewBox="0 0 700 362" font-family="DejaVu Sans, Arial, sans-serif"><rect width="700" height="362" fill="#ffffff"/><rect x="10" y="10" width="335" height="100" rx="7" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="10" y="10" width="8" height="100" rx="0" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="32" y="34" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">It says what it did</text><text x="32" y="54" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">A log line per run: rows, totals,</text><text x="32" y="70" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">and the time it took</text><rect x="32" y="80" width="148.0" height="20" rx="10" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="42" y="94" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start">logging, run history</text><rect x="355" y="10" width="335" height="100" rx="7" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="355" y="10" width="8" height="100" rx="0" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="377" y="34" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">It checks before it sends</text><text x="377" y="54" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">Row counts, date range, and</text><text x="377" y="70" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">today against the recent median</text><rect x="377" y="80" width="116.0" height="20" rx="10" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="387" y="94" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start">fail = no email</text><rect x="10" y="120" width="335" height="100" rx="7" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="10" y="120" width="8" height="100" rx="0" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="32" y="144" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">It tells you when it breaks</text><text x="32" y="164" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">A failure alert to a person,</text><text x="32" y="180" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">not a mailbox nobody reads</text><rect x="32" y="190" width="122.4" height="20" rx="10" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="42" y="204" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start">alert on failure</text><rect x="355" y="120" width="335" height="100" rx="7" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="355" y="120" width="8" height="100" rx="0" fill="#b7791f" stroke="none" stroke-width="1" /><text x="377" y="144" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">It handles &#x27;nothing today&#x27;</text><text x="377" y="164" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">Says &quot;no sales recorded&quot;</text><text x="377" y="180" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">instead of an empty table</text><rect x="377" y="190" width="141.60000000000002" height="20" rx="10" fill="#b7791f" stroke="none" stroke-width="1" /><text x="387" y="204" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start">explicit empty case</text><rect x="10" y="230" width="335" height="100" rx="7" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="10" y="230" width="8" height="100" rx="0" fill="#7a4fa0" stroke="none" stroke-width="1" /><text x="32" y="254" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">It can be run twice</text><text x="32" y="274" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">Same input, same output,</text><text x="32" y="290" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">and no duplicate emails</text><rect x="32" y="300" width="84.0" height="20" rx="10" fill="#7a4fa0" stroke="none" stroke-width="1" /><text x="42" y="314" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start">idempotent</text><rect x="355" y="230" width="335" height="100" rx="7" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="355" y="230" width="8" height="100" rx="0" fill="#5b6475" stroke="none" stroke-width="1" /><text x="377" y="254" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">Someone else can run it</text><text x="377" y="274" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">Documented inputs, credentials</text><text x="377" y="290" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">in the environment, an owner</text><rect x="377" y="300" width="103.2" height="20" rx="10" fill="#5b6475" stroke="none" stroke-width="1" /><text x="387" y="314" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start">handover note</text><text x="10" y="352" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">A report people trust is one they can check: the numbers, when it ran, and what it excluded.</text></svg>