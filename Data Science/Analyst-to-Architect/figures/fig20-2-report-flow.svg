<svg xmlns="http://www.w3.org/2000/svg" width="700" height="360" viewBox="0 0 700 360" font-family="DejaVu Sans, Arial, sans-serif"><rect width="700" height="360" fill="#ffffff"/><rect x="10" y="10" width="200" height="92" rx="7" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><text x="22" y="34" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">1  ERP export</text><text x="22" y="54" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">daily, 02:00</text><rect x="22" y="66" width="176" height="24" rx="4" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="110.0" y="82.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">automatic</text><path d="M213,56.0 L252,56.0" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M252,56.0 L245.7,59.0 L245.7,53.0 Z" fill="#5b6475"/><rect x="255" y="10" width="200" height="92" rx="7" fill="#fff" stroke="#b23b3b" stroke-width="1.6" /><text x="267" y="34" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">2  Analyst opens 4 files</text><text x="267" y="54" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">08:30</text><rect x="267" y="66" width="176" height="24" rx="4" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="355.0" y="82.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">MANUAL 25 min</text><path d="M458,56.0 L497,56.0" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M497,56.0 L490.7,59.0 L490.7,53.0 Z" fill="#5b6475"/><rect x="500" y="10" width="200" height="92" rx="7" fill="#fff" stroke="#b23b3b" stroke-width="1.6" /><text x="512" y="34" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">3  Clean and combine</text><text x="512" y="54" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">in a workbook</text><rect x="512" y="66" width="176" height="24" rx="4" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="600.0" y="82.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">MANUAL 30 min</text><rect x="10" y="142" width="200" height="92" rx="7" fill="#fff" stroke="#b23b3b" stroke-width="1.6" /><text x="22" y="166" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">4  Pivot + chart</text><text x="22" y="186" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">in the same workbook</text><rect x="22" y="198" width="176" height="24" rx="4" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="110.0" y="214.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">MANUAL 20 min</text><path d="M213,188.0 L252,188.0" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M252,188.0 L245.7,191.0 L245.7,185.0 Z" fill="#5b6475"/><rect x="255" y="142" width="200" height="92" rx="7" fill="#fff" stroke="#b7791f" stroke-width="1.6" /><text x="267" y="166" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">5  Write commentary</text><text x="267" y="186" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">3 sentences</text><rect x="267" y="198" width="176" height="24" rx="4" fill="#b7791f" stroke="none" stroke-width="1" /><text x="355.0" y="214.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">judgment: keep</text><path d="M458,188.0 L497,188.0" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M497,188.0 L490.7,191.0 L490.7,185.0 Z" fill="#5b6475"/><rect x="500" y="142" width="200" height="92" rx="7" fill="#fff" stroke="#b23b3b" stroke-width="1.6" /><text x="512" y="166" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">6  Email 14 managers</text><text x="512" y="186" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">by 10:00</text><rect x="512" y="198" width="176" height="24" rx="4" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="600.0" y="214.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">MANUAL 5 min</text><path d="M600.0,104 V122 H110.0 V133" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M110.0,132 L110.0,140" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M110.0,140 L107.0,133.7 L113.0,133.7 Z" fill="#5b6475"/><rect x="10" y="266" width="680" height="84" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.5" /><rect x="10" y="266" width="9" height="84" rx="0" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="32" y="290" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">What the map tells you</text><text x="32" y="311" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">80 minutes a day are mechanical; 3 sentences are judgment. Automate the 80,</text><text x="32" y="330" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">keep the 3. Time the steps for a week first: people misjudge which step is slow.</text></svg>