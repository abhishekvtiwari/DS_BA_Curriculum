<svg xmlns="http://www.w3.org/2000/svg" width="600" height="296.0" viewBox="0 0 600 296.0" font-family="DejaVu Sans, Arial, sans-serif"><rect width="600" height="296.0" fill="#ffffff"/><rect x="4" y="4" width="206" height="111.0" rx="6" fill="#fdf1f1" stroke="#b23b3b" stroke-width="1.4" /><path d="M4,10 a6,6 0 0 1 6,-6 H204 a6,6 0 0 1 6,6 V26 H4 Z" fill="#b23b3b"/><text x="14" y="19.5" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start">AS-IS</text><text x="12" y="42.0" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">A driver brings back a paper proof of</text><text x="12" y="54.5" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">delivery. Someone at Bhiwandi Main</text><text x="12" y="67.0" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">scans it, emails it to finance, and</text><text x="12" y="79.5" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">changes the order to Delivered by</text><text x="12" y="92.0" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">hand, days later or not at all. The ERP</text><text x="12" y="104.5" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">holds no delivery date.</text><rect x="232.0" y="4" width="136" height="111.0" rx="6" fill="#fdf5ee" stroke="#b35a1f" stroke-width="1.4" /><path d="M232.0,10 a6,6 0 0 1 6,-6 H362.0 a6,6 0 0 1 6,6 V26 H232.0 Z" fill="#b35a1f"/><text x="242.0" y="19.5" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start">THE GAP</text><text x="240.0" y="42.0" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">Nothing records the</text><text x="240.0" y="54.5" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">delivery when it</text><text x="240.0" y="67.0" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">happens. The ERP hears</text><text x="240.0" y="79.5" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">about it later, from a</text><text x="240.0" y="92.0" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">scanned email.</text><rect x="390.0" y="4" width="206" height="111.0" rx="6" fill="#eef7f4" stroke="#2f7d6d" stroke-width="1.4" /><path d="M390.0,10 a6,6 0 0 1 6,-6 H590.0 a6,6 0 0 1 6,6 V26 H390.0 Z" fill="#2f7d6d"/><text x="400.0" y="19.5" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start">TO-BE</text><text x="398.0" y="42.0" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">The delivery is recorded in the ERP</text><text x="398.0" y="54.5" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">when the customer signs, with the date</text><text x="398.0" y="67.0" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">and time, and the signed proof of</text><text x="398.0" y="79.5" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">delivery is attached to the order.</text><path d="M212,59.5 H225.0" fill="none" stroke="#b35a1f" stroke-width="1.8" stroke-linejoin="round"/><path d="M224.0,55.5 L230.0,59.5 L224.0,63.5 Z" fill="#b35a1f"/><path d="M370.0,59.5 H383.0" fill="none" stroke="#b35a1f" stroke-width="1.8" stroke-linejoin="round"/><path d="M382.0,55.5 L388.0,59.5 L382.0,63.5 Z" fill="#b35a1f"/><path d="M300.0,117.0 V131.0" fill="none" stroke="#5b6475" stroke-width="1.8" stroke-linejoin="round"/><path d="M296.0,130.0 L300.0,136.0 L304.0,130.0 Z" fill="#5b6475"/><rect x="4" y="137.0" width="592" height="37.0" rx="6" fill="#fff" stroke="#b35a1f" stroke-width="1.4" /><path d="M4,143.0 a6,6 0 0 1 6,-6 H104 V174.0 H10 a6,6 0 0 1 -6,-6 Z" fill="#b35a1f"/><text x="14" y="159.0" font-size="10" fill="#fff" font-weight="bold" text-anchor="start">ROOT CAUSE</text><text x="114" y="153.0" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">Not &quot;the warehouse is slow&quot;. The only record of the delivery is a piece of paper at the customer&#x27;s</text><text x="114" y="165.5" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">site: the driver has no device, so the fact travels back on the truck before anyone can type it in.</text><path d="M300.0,176.0 V189.0" fill="none" stroke="#5b6475" stroke-width="1.8" stroke-linejoin="round"/><path d="M296.0,188.0 L300.0,194.0 L304.0,188.0 Z" fill="#5b6475"/><rect x="4" y="196.0" width="592" height="37.0" rx="6" fill="#fff" stroke="#0f5c8c" stroke-width="1.4" /><path d="M4,202.0 a6,6 0 0 1 6,-6 H104 V233.0 H10 a6,6 0 0 1 -6,-6 Z" fill="#0f5c8c"/><text x="14" y="218.0" font-size="10" fill="#fff" font-weight="bold" text-anchor="start">REQUIREMENT</text><text x="114" y="212.0" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">FR-14: the delivery status and date shall be recorded in the ERP within one hour of the proof of</text><text x="114" y="224.5" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">delivery being signed.</text><path d="M300.0,235.0 V248.0" fill="none" stroke="#5b6475" stroke-width="1.8" stroke-linejoin="round"/><path d="M296.0,247.0 L300.0,253.0 L304.0,247.0 Z" fill="#5b6475"/><rect x="4" y="255.0" width="592" height="37.0" rx="6" fill="#fff" stroke="#1f6fa3" stroke-width="1.4" /><path d="M4,261.0 a6,6 0 0 1 6,-6 H104 V292.0 H10 a6,6 0 0 1 -6,-6 Z" fill="#1f6fa3"/><text x="14" y="277.0" font-size="10" fill="#fff" font-weight="bold" text-anchor="start">DEPENDS ON</text><text x="114" y="271.0" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">NFR-09: a delivery recorded where there is no mobile signal shall reach the ERP within one hour of</text><text x="114" y="283.5" font-size="9.5" fill="#1d2330" font-weight="normal" text-anchor="start">the signal returning, and none shall be lost.</text></svg>