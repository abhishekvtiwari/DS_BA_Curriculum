<svg xmlns="http://www.w3.org/2000/svg" width="600" height="282.0" viewBox="0 0 600 282.0" font-family="DejaVu Sans, Arial, sans-serif"><rect width="600" height="282.0" fill="#ffffff"/><rect x="82" y="8" width="6" height="234" rx="3" fill="#e6ebf2" stroke="none" stroke-width="1" /><rect x="6" y="4" width="62" height="22" rx="5" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="37.0" y="19" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle">0–15 s</text><circle cx="85" cy="15" r="5.5" fill="#fff" stroke="#0f5c8c" stroke-width="2.2"/><text x="110" y="15" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">The README&#x27;s first paragraph</text><text x="110" y="30" font-size="9.5" fill="#5b6475" font-weight="normal" text-anchor="start">They conclude:  Is there a question here, or a dataset?</text><text x="110" y="44" font-size="9.5" fill="#0f5c8c" font-weight="bold" text-anchor="start">So:  Write it as the question and the answer.</text><rect x="6" y="54" width="62" height="22" rx="5" fill="#b35a1f" stroke="none" stroke-width="1" /><text x="37.0" y="69" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle">15–30 s</text><circle cx="85" cy="65" r="5.5" fill="#fff" stroke="#b35a1f" stroke-width="2.2"/><text x="110" y="65" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">One chart or table</text><text x="110" y="80" font-size="9.5" fill="#5b6475" font-weight="normal" text-anchor="start">They conclude:  Can this person present a number to a human?</text><text x="110" y="94" font-size="9.5" fill="#b35a1f" font-weight="bold" text-anchor="start">So:  Put the finding in the title.</text><rect x="6" y="104" width="62" height="22" rx="5" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="37.0" y="119" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle">30–50 s</text><circle cx="85" cy="115" r="5.5" fill="#fff" stroke="#2f7d6d" stroke-width="2.2"/><text x="110" y="115" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">One file of code</text><text x="110" y="130" font-size="9.5" fill="#5b6475" font-weight="normal" text-anchor="start">They conclude:  Do they write for a reader or a machine?</text><text x="110" y="144" font-size="9.5" fill="#2f7d6d" font-weight="bold" text-anchor="start">So:  Comment why, never what.</text><rect x="6" y="154" width="62" height="22" rx="5" fill="#7a4fa0" stroke="none" stroke-width="1" /><text x="37.0" y="169" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle">50–75 s</text><circle cx="85" cy="165" r="5.5" fill="#fff" stroke="#7a4fa0" stroke-width="2.2"/><text x="110" y="165" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">The commit history</text><text x="110" y="180" font-size="9.5" fill="#5b6475" font-weight="normal" text-anchor="start">They conclude:  Two weeks of work, or one upload an hour ago?</text><text x="110" y="194" font-size="9.5" fill="#7a4fa0" font-weight="bold" text-anchor="start">So:  Commit from day one. It cannot be faked later.</text><rect x="6" y="204" width="62" height="22" rx="5" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="37.0" y="219" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle">75–90 s</text><circle cx="85" cy="215" r="5.5" fill="#fff" stroke="#b23b3b" stroke-width="2.2"/><text x="110" y="215" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">Anything saying what you did NOT find</text><text x="110" y="230" font-size="9.5" fill="#5b6475" font-weight="normal" text-anchor="start">They conclude:  Should I trust the rest of this?</text><text x="110" y="244" font-size="9.5" fill="#b23b3b" font-weight="bold" text-anchor="start">So:  A FINDINGS.md file. Almost nobody has one.</text><path d="M6,256 H594" fill="none" stroke="#c9d3df" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="4 4"/><text x="6" y="274.0" font-size="10" fill="#1d2330" font-weight="bold" text-anchor="start">Three of the five are writing, and one is a habit you cannot add at the end. Only one is the analysis.</text></svg>