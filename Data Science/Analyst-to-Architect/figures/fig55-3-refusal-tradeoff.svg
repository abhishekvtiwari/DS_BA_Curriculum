<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="310" viewBox="0 0 1040 310" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1040" height="310" fill="#ffffff"/><text x="30" y="32" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Refusal is a business trade, not a setting</text><text x="300" y="66" font-size="12" fill="#b23b3b" font-weight="bold" text-anchor="middle">answerable questions wrongly refused</text><text x="760" y="66" font-size="12" fill="#2f7d6d" font-weight="bold" text-anchor="middle">unanswerable questions correctly refused</text><text x="150" y="104" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">BM25 &lt; 6 or cosine &lt; 0.50</text><rect x="170" y="86" width="42.54545454545455" height="26" rx="4" fill="#b23b3b" stroke="#b23b3b" stroke-width="1" /><text x="222.54545454545456" y="104" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">3 of 55</text><rect x="620" y="86" width="78.0" height="26" rx="4" fill="#2f7d6d" stroke="#2f7d6d" stroke-width="1" /><text x="708.0" y="104" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">3 of 10</text><text x="150" y="144" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="end" font-family="DejaVu Sans Mono, monospace">BM25 &lt; 8 or cosine &lt; 0.60</text><rect x="170" y="126" width="70.9090909090909" height="26" rx="4" fill="#b23b3b" stroke="#b23b3b" stroke-width="1" /><text x="250.9090909090909" y="144" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">5 of 55</text><rect x="620" y="126" width="182.0" height="26" rx="4" fill="#2f7d6d" stroke="#2f7d6d" stroke-width="1" /><text x="812.0" y="144" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">7 of 10</text><text x="1000" y="144" font-size="12" fill="#0f5c8c" font-weight="bold" text-anchor="end">chosen</text><text x="150" y="184" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">BM25 &lt; 9 or cosine &lt; 0.60</text><rect x="170" y="166" width="212.72727272727272" height="26" rx="4" fill="#b23b3b" stroke="#b23b3b" stroke-width="1" /><text x="392.72727272727275" y="184" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">15 of 55</text><rect x="620" y="166" width="182.0" height="26" rx="4" fill="#2f7d6d" stroke="#2f7d6d" stroke-width="1" /><text x="812.0" y="184" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">7 of 10</text><text x="150" y="224" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">BM25 &lt; 10 or cosine &lt; 0.60</text><rect x="170" y="206" width="241.09090909090907" height="26" rx="4" fill="#b23b3b" stroke="#b23b3b" stroke-width="1" /><text x="421.09090909090907" y="224" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">17 of 55</text><rect x="620" y="206" width="208.0" height="26" rx="4" fill="#2f7d6d" stroke="#2f7d6d" stroke-width="1" /><text x="838.0" y="224" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">8 of 10</text><text x="30" y="268" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Catching more of the questions the corpus cannot answer always means refusing more of the ones it can. Riverstone takes the</text><text x="30" y="288" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">middle rule, because a wrong answer reaches a customer and a handover costs two minutes of someone&#x27;s time.</text></svg>