<svg xmlns="http://www.w3.org/2000/svg" width="720" height="276" viewBox="0 0 720 276" font-family="DejaVu Sans, Arial, sans-serif"><rect width="720" height="276" fill="#ffffff"/><text x="18" y="26" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Refusal is a business trade, not a setting</text><text x="196" y="50" font-size="11.5" fill="#c0662b" font-weight="bold" text-anchor="start">answerable, wrongly refused</text><text x="196" y="66" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">(of 55; fewer is better)</text><text x="470" y="50" font-size="11.5" fill="#0f5c8c" font-weight="bold" text-anchor="start">unanswerable, correctly refused</text><text x="470" y="66" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">(of 10; more is better)</text><text x="186" y="93" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">BM25 &lt; 6, cosine &lt; 0.50</text><rect x="196" y="80" width="31.5" height="18" rx="3" fill="#c0662b" stroke="#c0662b" stroke-width="1" /><text x="233.5" y="93" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">3</text><rect x="470" y="80" width="45.0" height="18" rx="3" fill="#0f5c8c" stroke="#0f5c8c" stroke-width="1" /><text x="521.0" y="93" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">3</text><rect x="10" y="107" width="700" height="28" rx="4" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="186" y="125" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="end" font-family="DejaVu Sans Mono, monospace">BM25 &lt; 8, cosine &lt; 0.60</text><rect x="196" y="112" width="52.5" height="18" rx="3" fill="#c0662b" stroke="#c0662b" stroke-width="1" /><text x="254.5" y="125" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">5</text><rect x="470" y="112" width="105.0" height="18" rx="3" fill="#0f5c8c" stroke="#0f5c8c" stroke-width="1" /><text x="581.0" y="125" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">7</text><text x="704" y="125" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="end">chosen</text><text x="186" y="157" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">BM25 &lt; 9, cosine &lt; 0.60</text><rect x="196" y="144" width="157.5" height="18" rx="3" fill="#c0662b" stroke="#c0662b" stroke-width="1" /><text x="359.5" y="157" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">15</text><rect x="470" y="144" width="105.0" height="18" rx="3" fill="#0f5c8c" stroke="#0f5c8c" stroke-width="1" /><text x="581.0" y="157" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">7</text><text x="186" y="189" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">BM25 &lt; 10, cosine &lt; 0.60</text><rect x="196" y="176" width="178.5" height="18" rx="3" fill="#c0662b" stroke="#c0662b" stroke-width="1" /><text x="380.5" y="189" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">17</text><rect x="470" y="176" width="120.0" height="18" rx="3" fill="#0f5c8c" stroke="#0f5c8c" stroke-width="1" /><text x="596.0" y="189" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">8</text><path d="M196.0,202 V208" fill="none" stroke="#5b6475" stroke-width="1" stroke-linejoin="round"/><text x="196.0" y="222" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">0</text><path d="M301.0,202 V208" fill="none" stroke="#5b6475" stroke-width="1" stroke-linejoin="round"/><text x="301.0" y="222" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">10</text><path d="M406.0,202 V208" fill="none" stroke="#5b6475" stroke-width="1" stroke-linejoin="round"/><text x="406.0" y="222" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">20</text><path d="M470.0,202 V208" fill="none" stroke="#5b6475" stroke-width="1" stroke-linejoin="round"/><text x="470.0" y="222" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">0</text><path d="M545.0,202 V208" fill="none" stroke="#5b6475" stroke-width="1" stroke-linejoin="round"/><text x="545.0" y="222" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">5</text><path d="M620.0,202 V208" fill="none" stroke="#5b6475" stroke-width="1" stroke-linejoin="round"/><text x="620.0" y="222" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">10</text><text x="18" y="246" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Catching more of the questions the corpus cannot answer always means refusing more of the ones</text><text x="18" y="263" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">it can. Riverstone starts with the middle rule; section 55.6 prices each rule in rupees.</text></svg>