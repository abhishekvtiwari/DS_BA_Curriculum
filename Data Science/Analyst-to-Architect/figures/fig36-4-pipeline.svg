<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="420" viewBox="0 0 1010 420" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1010" height="420" fill="#ffffff"/><rect x="20" y="170" width="150" height="70" rx="6" fill="#8a93a3" stroke="none" stroke-width="1" /><text x="95.0" y="201.0" font-size="13.5" fill="#fff" font-weight="bold" text-anchor="middle">Raw lead columns</text><text x="95.0" y="220.0" font-size="11.5" fill="#fff" font-weight="normal" text-anchor="middle">13 columns</text><rect x="210" y="40" width="440" height="330" rx="10" fill="none" stroke="none" stroke-width="1" /><path d="M210,40 h440 v330 h-440 Z" fill="none" stroke="#c9d3df" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6 5"/><text x="430" y="64" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">ColumnTransformer</text><rect x="240" y="95" width="180" height="64" rx="6" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="330.0" y="123.0" font-size="13.5" fill="#fff" font-weight="bold" text-anchor="middle">Fill blanks</text><text x="330.0" y="142.0" font-size="11.5" fill="#fff" font-weight="normal" text-anchor="middle">&quot;Missing&quot;</text><rect x="450" y="95" width="180" height="64" rx="6" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="540.0" y="123.0" font-size="13.5" fill="#fff" font-weight="bold" text-anchor="middle">One-hot encode</text><text x="540.0" y="142.0" font-size="11.5" fill="#fff" font-weight="normal" text-anchor="middle">6 sources → 6 columns</text><text x="230" y="88" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">5 categorical columns</text><rect x="240" y="255" width="180" height="64" rx="6" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="330.0" y="283.0" font-size="13.5" fill="#fff" font-weight="bold" text-anchor="middle">Fill blanks</text><text x="330.0" y="302.0" font-size="11.5" fill="#fff" font-weight="normal" text-anchor="middle">median + missing indicator</text><rect x="450" y="255" width="180" height="64" rx="6" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="540.0" y="283.0" font-size="13.5" fill="#fff" font-weight="bold" text-anchor="middle">Standard scale</text><text x="540.0" y="302.0" font-size="11.5" fill="#fff" font-weight="normal" text-anchor="middle">learned from training rows</text><text x="230" y="248" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">8 numeric columns</text><path d="M170.0,205.0 L208.0,205.0" fill="none" stroke="#1d2330" stroke-width="1.6" stroke-linejoin="round"/><path d="M208,205 l-9,-5 l0,10 Z" fill="#1d2330"/><path d="M208.0,205.0 L208.0,127.0" fill="none" stroke="#1d2330" stroke-width="1.6" stroke-linejoin="round"/><path d="M208.0,205.0 L208.0,287.0" fill="none" stroke="#1d2330" stroke-width="1.6" stroke-linejoin="round"/><path d="M208.0,127.0 L238.0,127.0" fill="none" stroke="#1d2330" stroke-width="1.6" stroke-linejoin="round"/><path d="M238,127 l-9,-5 l0,10 Z" fill="#1d2330"/><path d="M208.0,287.0 L238.0,287.0" fill="none" stroke="#1d2330" stroke-width="1.6" stroke-linejoin="round"/><path d="M238,287 l-9,-5 l0,10 Z" fill="#1d2330"/><path d="M420.0,127.0 L448.0,127.0" fill="none" stroke="#1d2330" stroke-width="1.6" stroke-linejoin="round"/><path d="M448,127 l-9,-5 l0,10 Z" fill="#1d2330"/><path d="M420.0,287.0 L448.0,287.0" fill="none" stroke="#1d2330" stroke-width="1.6" stroke-linejoin="round"/><path d="M448,287 l-9,-5 l0,10 Z" fill="#1d2330"/><path d="M630.0,127.0 L672.0,127.0" fill="none" stroke="#1d2330" stroke-width="1.6" stroke-linejoin="round"/><path d="M630.0,287.0 L672.0,287.0" fill="none" stroke="#1d2330" stroke-width="1.6" stroke-linejoin="round"/><path d="M672.0,127.0 L672.0,287.0" fill="none" stroke="#1d2330" stroke-width="1.6" stroke-linejoin="round"/><path d="M672.0,205.0 L700.0,205.0" fill="none" stroke="#1d2330" stroke-width="1.6" stroke-linejoin="round"/><path d="M700,205 l-9,-5 l0,10 Z" fill="#