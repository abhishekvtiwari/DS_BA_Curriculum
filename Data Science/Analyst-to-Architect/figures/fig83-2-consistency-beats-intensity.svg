<svg xmlns="http://www.w3.org/2000/svg" width="700" height="394" viewBox="0 0 700 394" font-family="DejaVu Sans, Arial, sans-serif"><rect width="700" height="394" fill="#ffffff"/><defs><pattern id="jr" patternUnits="userSpaceOnUse" width="7" height="7" patternTransform="rotate(45)"><rect width="7" height="7" fill="#ffffff"/><line x1="0" y1="0" x2="0" y2="7" stroke="#8fc1b4" stroke-width="2.4"/></pattern></defs><text x="24" y="28" font-size="15" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Six hours a week beats twenty-five, and the crossover is week 50</text><text x="24" y="48" font-size="11.2" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Cumulative hours. The sprinter holds twenty-five hours a week for twelve weeks, then stops.</text><path d="M53,306.0 H670" fill="none" stroke="#eef2f7" stroke-width="1" stroke-linejoin="round"/><text x="49" y="310.0" font-size="10.2" fill="#5b6475" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">0</text><path d="M53,260.0 H670" fill="none" stroke="#eef2f7" stroke-width="1" stroke-linejoin="round"/><text x="49" y="264.0" font-size="10.2" fill="#5b6475" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">250</text><path d="M53,214.0 H670" fill="none" stroke="#eef2f7" stroke-width="1" stroke-linejoin="round"/><text x="49" y="218.0" font-size="10.2" fill="#5b6475" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">500</text><path d="M53,168.0 H670" fill="none" stroke="#eef2f7" stroke-width="1" stroke-linejoin="round"/><text x="49" y="172.0" font-size="10.2" fill="#5b6475" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">750</text><path d="M53,122.0 H670" fill="none" stroke="#eef2f7" stroke-width="1" stroke-linejoin="round"/><text x="49" y="126.0" font-size="10.2" fill="#5b6475" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">1,000</text><path d="M53,76.0 H670" fill="none" stroke="#eef2f7" stroke-width="1" stroke-linejoin="round"/><text x="49" y="80.0" font-size="10.2" fill="#5b6475" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">1,250</text><rect x="58" y="86.488" width="612" height="43.42400000000001" rx="0" fill="none" stroke="#5b6475" stroke-width="1.2" stroke-dasharray="5 4"/><text x="66" y="101.488" font-size="10.2" fill="#5b6475" font-weight="bold" text-anchor="start">the whole book: 957–1,193 hours</text><rect x="58" y="216.208" width="612" height="17.29600000000002" rx="0" fill="url(#jr)" stroke="#2f7d6d" stroke-width="1.4" /><rect x="372" y="218.708" width="292" height="12.29600000000002" rx="3" fill="#ffffff" stroke="none" stroke-width="1" /><text x="378" y="228.856" font-size="10.2" fill="#2f7d6d" font-weight="bold" text-anchor="start">job-ready band: 394–488 hours (end of Part 2)</text><path d="M58,76 V306 H670" fill="none" stroke="#c9d3df" stroke-width="1.4" stroke-linejoin="round"/><path d="M58.0,306 V311" fill="none" stroke="#c9d3df" stroke-width="1.2" stroke-linejoin="round"/><text x="58.0" y="324" font-size="10.2" fill="#5b6475" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">0</text><path d="M211.0,306 V311" fill="none" stroke="#c9d3df" stroke-width="1.2" stroke-linejoin="round"/><text x="211.0" y="324" font-size="10.2" fill="#5b6475" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">52</text><text x="211.0" y="337" font-size="10.2" fill="#5b6475" font-weight="normal" text-anchor="middle">year 1</text><path d="M364.0,306 V311" fill="none" stroke="#c9d3df" stroke-width="1.2" stroke-linejoin="round"/><text x="364.0" y="324" font-size="10.2" fill="#5b6475" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">104</text><text x="364.0" y="337" font-size="10.2" fill="#5b6475" font-weight="normal" text-anchor="middle">year 2</text><path d="M517.0,306 V311" fill="none" stroke="#c9d3df" stroke-width="1.2" stroke-linejoin="round"/><text x="517.0" y="324" font-size="10.2" fill="#5b6475" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">156</text><text x="517.0" y="337" font-size="10.2" fill="#5b6475" font-weight="normal" text-anchor="middle">year 3</text><path d="M670.0,306 V311" fill="none" stroke="#c9d3df" stroke-width="1.2" stroke-linejoin="round"/><text x="670.0" y="324" font-size="10.2" fill="#5b6475" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">208</text><text x="670.0" y="337" font-size="10.2" fill="#5b6475" font-weight="normal" text-anchor="middle">year 4</text><text x="364.0" y="354" font-size="10.2" fill="#5b6475" font-weight="normal" text-anchor="middle">weeks since starting</text><text x="24" y="64" font-size="10.2" fill="#5b6475" font-weight="normal" text-anchor="start">cumulative hours</text><path d="M58.0,306.0 L670.0,76.368" fill="none" stroke="#0f5c8c" stroke-width="3" stroke-linejoin="round"/><path d="M58.0,306.0 L93.3076923076923,250.8 L670.0,250.8" fill="none" stroke="#b23b3b" stroke-width="3" stroke-linejoin="round" stroke-dasharray="9 5"/><circle cx="252.19230769230768" cy="233.136" r="4" fill="#0f5c8c"/><circle cx="296.3269230769231" cy="216.576" r="4" fill="#0f5c8c"/><text x="352.2307692307692" y="211.208" font-size="10.2" fill="#0f5c8c" font-weight="bold" text-anchor="start">the steady one gets there in weeks 66–81</text><path d="M205.1153846153846,250.8 V306" fill="none" stroke="#5b6475" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="4 4"/><circle cx="205.1153846153846" cy="250.8" r="6" fill="#fff" stroke="#1d2330" stroke-width="2.4"/><text x="215.1153846153846" y="272.8" font-size="11.2" fill="#1d2330" font-weight="bold" text-anchor="start">week 50: the crossover,</text><text x="215.1153846153846" y="286.8" font-size="10.2" fill="#5b6475" font-weight="normal" text-anchor="start">both at 300 hours</text><rect x="88.3076923076923" y="245.8" width="10" height="10" fill="#b23b3b"/><text x="64" y="243.8" font-size="10.2" fill="#b23b3b" font-weight="bold" text-anchor="start">week 12: burnout</text><text x="666.0" y="270.8" font-size="11.2" fill="#b23b3b" font-weight="bold" text-anchor="end">the sprinter (dashed): stops at 300</text><text x="434.61538461538464" y="190.688" font-size="11.2" fill="#0f5c8c" font-weight="bold" text-anchor="start">the steady one (solid), 6 hours a week</text><text x="24" y="378" font-size="11.6" fill="#1d2330" font-weight="bold" text-anchor="start">Nothing dramatic happens in any single week of the solid line. That is the entire point of it.</text></svg>