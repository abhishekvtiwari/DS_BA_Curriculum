<svg xmlns="http://www.w3.org/2000/svg" width="1164" height="526" viewBox="0 0 1164 526" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1164" height="526" fill="#ffffff"/><text x="46" y="38" font-size="15.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Six hours a week beats twenty-five, and the crossover is week 50</text><text x="46" y="62" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Cumulative hours. The sprinter holds twenty-five hours a week for twelve weeks, then stops.</text><rect x="46" y="305.32" width="720" height="25.410000000000025" rx="0" fill="#e2f3ee" stroke="none" stroke-width="1" /><text x="56" y="295.32" font-size="11" fill="#2f7d6d" font-weight="normal" text-anchor="start" font-style="italic">job-ready band: 319–396 hours (end of Part II)</text><path d="M46,106 V436 H766" fill="none" stroke="#c9d3df" stroke-width="1.4" stroke-linejoin="round"/><path d="M41,436.0 H766" fill="none" stroke="#eef2f7" stroke-width="1" stroke-linejoin="round"/><text x="34" y="440.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">0</text><path d="M41,353.5 H766" fill="none" stroke="#eef2f7" stroke-width="1" stroke-linejoin="round"/><text x="34" y="357.5" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">250</text><path d="M41,271.0 H766" fill="none" stroke="#eef2f7" stroke-width="1" stroke-linejoin="round"/><text x="34" y="275.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">500</text><path d="M41,188.5 H766" fill="none" stroke="#eef2f7" stroke-width="1" stroke-linejoin="round"/><text x="34" y="192.5" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">750</text><path d="M41,106.0 H766" fill="none" stroke="#eef2f7" stroke-width="1" stroke-linejoin="round"/><text x="34" y="110.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">1000</text><text x="46.0" y="456" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">0</text><text x="158.5" y="456" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">25</text><text x="271.0" y="456" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">50</text><text x="383.5" y="456" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">75</text><text x="496.0" y="456" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">100</text><text x="608.5" y="456" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">125</text><text x="748.0" y="456" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">156</text><text x="406.0" y="478" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="middle">weeks</text><text x="12" y="90" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">cumulative hours</text><path d="M46.0,436.0 L100.0,337.0 L766.0,337.0" fill="none" stroke="#b23b3b" stroke-width="3" stroke-linejoin="round"/><path d="M46.0,436.0 L766.0,119.19999999999999" fill="none" stroke="#0f5c8c" stroke-width="3" stroke-linejoin="round"/><path d="M271.0,337.0 V436" fill="none" stroke="#5b6475" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="4 4"/><circle cx="271.0" cy="337.0" r="7" fill="#fff" stroke="#1d2330" stroke-width="2.6"/><text x="285.0" y="377.0" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">week 50: the crossover</text><text x="285.0" y="395.0" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">both at 300 hours</text><text x="760.0" y="359.0" font-size="12" fill="#b23b3b" font-weight="bold" text-anchor="end">the sprinter, stopped at 300</text><text x="577.0" y="186.36" font-size="12" fill="#0f5c8c" font-weight="bold" text-anchor="end">the steady one, 6 hours a week</text><circle cx="100.0" cy="337.0" r="5" fill="#b23b3b"/><text x="110.0" y="321.0" font-size="11" fill="#b23b3b" font-weight="normal" text-anchor="start">week 12: burnout</text><rect x="820" y="115" width="300" height="250" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="818" y="112" width="300" height="250" rx="8" fill="#fff" stroke="#c9d3df" stroke-width="1.4" /><text x="834" y="138" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">At each point</text><text x="834" y="166" font-size="11.5" fill="#5b6475" font-weight="bold" text-anchor="start"></text><text x="948" y="166" font-size="11.5" fill="#5b6475" font-weight="bold" text-anchor="start">sprinter</text><text x="1034" y="166" font-size="11.5" fill="#5b6475" font-weight="bold" text-anchor="start">steady</text><path d="M830,174 H1106" fill="none" stroke="#c9d3df" stroke-width="1" stroke-linejoin="round"/><text x="834" y="196" font-size="11.5" fill="#5b6475" font-weight="bold" text-anchor="start">week 12</text><text x="948" y="196" font-size="11.5" fill="#b23b3b" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">300</text><text x="1034" y="196" font-size="11.5" fill="#0f5c8c" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">72</text><text x="834" y="226" font-size="11.5" fill="#5b6475" font-weight="bold" text-anchor="start">week 50</text><text x="948" y="226" font-size="11.5" fill="#b23b3b" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">300</text><text x="1034" y="226" font-size="11.5" fill="#0f5c8c" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">300</text><text x="834" y="256" font-size="11.5" fill="#5b6475" font-weight="bold" text-anchor="start">week 66</text><text x="948" y="256" font-size="11.5" fill="#b23b3b" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">300</text><text x="1034" y="256" font-size="11.5" fill="#0f5c8c" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">396</text><text x="834" y="286" font-size="11.5" fill="#5b6475" font-weight="bold" text-anchor="start">year 3</text><text x="948" y="286" font-size="11.5" fill="#b23b3b" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">300</text><text x="1034" y="286" font-size="11.5" fill="#0f5c8c" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">936</text><text x="834" y="320" font-size="11" fill="#b23b3b" font-weight="normal" text-anchor="start">300 hours does not reach the end</text><text x="834" y="336" font-size="11" fill="#b23b3b" font-weight="normal" text-anchor="start">of Part II. The sprinter stops</text><text x="834" y="352" font-size="11" fill="#b23b3b" font-weight="normal" text-anchor="start">short of employable.</text><text x="46" y="502" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">Nothing dramatic happens in any single week of the blue line. That is the entire point of it.</text></svg>