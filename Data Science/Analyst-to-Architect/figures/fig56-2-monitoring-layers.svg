<svg xmlns="http://www.w3.org/2000/svg" width="720" height="384" viewBox="0 0 720 384" font-family="DejaVu Sans, Arial, sans-serif"><rect width="720" height="384" fill="#ffffff"/><text x="16" y="26" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Three layers of monitoring, and what each one can see</text><rect x="16" y="44" width="688" height="52" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><text x="30" y="66" font-size="12.5" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">1 service</text><text x="30" y="84" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">is it up and fast?</text><text x="250" y="66" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">uptime, error rate, p95 latency, memory</text><text x="250" y="84" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">delay: seconds</text><text x="692" y="66" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="end">page a human</text><rect x="16" y="104" width="688" height="52" rx="7" fill="#fff" stroke="#c0662b" stroke-width="1.6" /><text x="30" y="126" font-size="12.5" fill="#c0662b" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">2 input</text><text x="30" y="144" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">does the data look like training?</text><text x="250" y="126" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">feature distributions, PSI, KS, missing rates</text><text x="250" y="144" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">delay: minutes</text><text x="692" y="126" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="end">daily digest</text><rect x="16" y="164" width="688" height="150" rx="7" fill="#fbf8fd" stroke="#7a4fa0" stroke-width="1.6" /><text x="30" y="186" font-size="12.5" fill="#7a4fa0" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">3 output and outcome</text><text x="250" y="186" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">is it still right? one layer, two streams:</text><rect x="30" y="198" width="660" height="50" rx="6" fill="#fff" stroke="#7a4fa0" stroke-width="1.1" /><text x="42" y="218" font-size="11.5" fill="#7a4fa0" font-weight="bold" text-anchor="start">fast proxy (output)</text><text x="236" y="218" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">share of parts predicted defective, per shift</text><text x="236" y="236" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">delay: hours · needs no labels · measures change, not correctness</text><text x="678" y="218" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="end">daily digest</text><rect x="30" y="256" width="660" height="50" rx="6" fill="#fff" stroke="#2f7d6d" stroke-width="1.1" /><text x="42" y="276" font-size="11.5" fill="#2f7d6d" font-weight="bold" text-anchor="start">slow truth (outcome)</text><text x="236" y="276" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">recall from a 2% audit of parts the model passed</text><text x="236" y="294" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">delay: days to weeks · the only stream that counts misses</text><text x="678" y="276" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="end">weekly review</text><text x="16" y="334" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">The flash defect was invisible to the service and input layers, hidden in the fast proxy (misses</text><text x="16" y="352" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">and extra false alarms cancelled out), and plain only in the audited outcome. Ground truth is late:</text><text x="16" y="370" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="start">plan for it rather than hoping.</text></svg>