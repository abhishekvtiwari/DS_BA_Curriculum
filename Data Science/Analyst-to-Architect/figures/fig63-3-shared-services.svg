<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1000" height="440" fill="#ffffff"/><text x="30" y="30" font-size="14.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Shared services: build once, every automation uses them</text><rect x="373" y="154" width="260" height="110" rx="7" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="370" y="150" width="260" height="110" rx="7" fill="#fff" stroke="#1d2330" stroke-width="1.6" /><path d="M370,158 a7,7 0 0 1 7,-7 H623 a7,7 0 0 1 7,7 V174 H370 Z" fill="#1d2330"/><text x="500.0" y="166.5" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Every automation
in the platform</text><rect x="93" y="64" width="200" height="110" rx="7" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="90" y="60" width="200" height="110" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><path d="M90,68 a7,7 0 0 1 7,-7 H283 a7,7 0 0 1 7,7 V84 H90 Z" fill="#0f5c8c"/><text x="190.0" y="76.5" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Notification
service</text><text x="190.0" y="100" font-size="8.8" fill="#1d2330" font-weight="normal" text-anchor="middle">one place to send</text><text x="190.0" y="114" font-size="8.8" fill="#1d2330" font-weight="normal" text-anchor="middle">email, Slack, SMS</text><rect x="93" y="264" width="200" height="110" rx="7" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="90" y="260" width="200" height="110" rx="7" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><path d="M90,268 a7,7 0 0 1 7,-7 H283 a7,7 0 0 1 7,7 V284 H90 Z" fill="#2f7d6d"/><text x="190.0" y="276.5" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Credential
vault</text><text x="190.0" y="300" font-size="8.8" fill="#1d2330" font-weight="normal" text-anchor="middle">no password in</text><text x="190.0" y="314" font-size="8.8" fill="#1d2330" font-weight="normal" text-anchor="middle">any script (Ch 20)</text><rect x="743" y="64" width="200" height="110" rx="7" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="740" y="60" width="200" height="110" rx="7" fill="#fff" stroke="#b7791f" stroke-width="1.6" /><path d="M740,68 a7,7 0 0 1 7,-7 H933 a7,7 0 0 1 7,7 V84 H740 Z" fill="#b7791f"/><text x="840.0" y="76.5" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Run logs</text><text x="840.0" y="100" font-size="8.8" fill="#1d2330" font-weight="normal" text-anchor="middle">every run, every</text><text x="840.0" y="114" font-size="8.8" fill="#1d2330" font-weight="normal" text-anchor="middle">outcome, centrally</text><rect x="743" y="264" width="200" height="110" rx="7" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="740" y="260" width="200" height="110" rx="7" fill="#fff" stroke="#b23b3b" stroke-width="1.6" /><path d="M740,268 a7,7 0 0 1 7,-7 H933 a7,7 0 0 1 7,7 V284 H740 Z" fill="#b23b3b"/><text x="840.0" y="276.5" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Alerting</text><text x="840.0" y="300" font-size="8.8" fill="#1d2330" font-weight="normal" text-anchor="middle">pages a person on</text><text x="840.0" y="314" font-size="8.8" fill="#1d2330" font-weight="normal" text-anchor="middle">failure (Ch 20)</text><path d="M290,115 L430,175" fill="none" stroke="#0f5c8c" stroke-width="1.6" stroke-linejoin="round"/><path d="M430,175 L423.0,175.3 L425.4,169.7 Z" fill="#0f5c8c"/><path d="M290,290 L430,235" fill="none" stroke="#2f7d6d" stroke-width="1.6" stroke-linejoin="round"/><path d="M430,235 L425.2,240.1 L423.0,234.5 Z" fill="#2f7d6d"/><path d="M738,115 L632,175" fill="none" stroke="#b7791f" stroke-width="1.6" stroke-linejoin="round"/><path d="M632,175 L636.0,169.2 L639.0,174.5 Z" fill="#b7791f"/><path d="M738,290 L632,235" fill="none" stroke="#b23b3b" stroke-width="1.6" stroke-linejoin="round"/><path d="M632,235 L639.0,235.2 L636.2,240.6 Z" fill="#b23b3b"/><text x="30" y="400" font-size="11.2" fill="#5b6475" font-weight="normal" text-anchor="start">Without these built once and shared, every one of Riverstone&#x27;s 40+ automations reinvents its own logging, its own alerting,</text><text x="30" y="418" font-size="11.2" fill="#5b6475" font-weight="normal" text-anchor="start">and — worst of all — its own place to hide a password. Chapter 20&#x27;s daily flash already assumes all four exist.</text></svg>