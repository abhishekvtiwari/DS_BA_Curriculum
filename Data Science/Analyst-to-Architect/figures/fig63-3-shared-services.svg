<svg xmlns="http://www.w3.org/2000/svg" width="680" height="336" viewBox="0 0 680 336" font-family="DejaVu Sans, Arial, sans-serif"><rect width="680" height="336" fill="#ffffff"/><text x="20" y="24" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Four shared services, built once, used by every automation</text><rect x="250" y="44" width="180" height="212" rx="6" fill="#fff" stroke="#1d2330" stroke-width="1.4" /><path d="M250,50 a6,6 0 0 1 6,-6 H424 a6,6 0 0 1 6,6 V66 H250 Z" fill="#1d2330"/><text x="258" y="59.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="start">Every automation</text><text x="262" y="96" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Daily Sales Flash</text><text x="262" y="115" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Dagster pipeline</text><text x="262" y="134" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">CRM syncs</text><text x="262" y="153" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">PO intake</text><text x="262" y="172" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">support assistant</text><text x="262" y="191" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">defect model</text><text x="262" y="210" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">branch macros</text><text x="262" y="229" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">… all 24 in the inventory</text><rect x="20" y="44" width="196" height="78" rx="6" fill="#fff" stroke="#0f5c8c" stroke-width="1.4" /><path d="M20,50 a6,6 0 0 1 6,-6 H210 a6,6 0 0 1 6,6 V66 H20 Z" fill="#0f5c8c"/><text x="28" y="59.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="start">Notification service</text><text x="28" y="84" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">one function sends email or chat</text><text x="28" y="98" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">for everyone</text><path d="M216,83.0 L248,83.0" fill="none" stroke="#0f5c8c" stroke-width="1.5" stroke-linejoin="round"/><path d="M248,83.0 L241.7,86.0 L241.7,80.0 Z" fill="#0f5c8c"/><rect x="20" y="178" width="196" height="78" rx="6" fill="#fff" stroke="#2f7d6d" stroke-width="1.4" /><path d="M20,184 a6,6 0 0 1 6,-6 H210 a6,6 0 0 1 6,6 V200 H20 Z" fill="#2f7d6d"/><text x="28" y="193.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="start">Credential vault</text><text x="28" y="218" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">no password in any script; rotate</text><text x="28" y="232" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">without editing code</text><path d="M216,217.0 L248,217.0" fill="none" stroke="#2f7d6d" stroke-width="1.5" stroke-linejoin="round"/><path d="M248,217.0 L241.7,220.0 L241.7,214.0 Z" fill="#2f7d6d"/><rect x="464" y="44" width="196" height="78" rx="6" fill="#fff" stroke="#b7791f" stroke-width="1.4" /><path d="M464,50 a6,6 0 0 1 6,-6 H654 a6,6 0 0 1 6,6 V66 H464 Z" fill="#b7791f"/><text x="472" y="59.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="start">Run logs</text><text x="472" y="84" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">every run: start, end, outcome,</text><text x="472" y="98" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">key numbers, in one place</text><path d="M464,83.0 L432,83.0" fill="none" stroke="#b7791f" stroke-width="1.5" stroke-linejoin="round"/><path d="M432,83.0 L438.3,80.0 L438.3,86.0 Z" fill="#b7791f"/><rect x="464" y="178" width="196" height="78" rx="6" fill="#fff" stroke="#b23b3b" stroke-width="1.4" /><path d="M464,184 a6,6 0 0 1 6,-6 H654 a6,6 0 0 1 6,6 V200 H464 Z" fill="#b23b3b"/><text x="472" y="193.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="start">Alerting</text><text x="472" y="218" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">a failure pages the owner, the</text><text x="472" y="232" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">same way every time</text><path d="M464,217.0 L432,217.0" fill="none" stroke="#b23b3b" stroke-width="1.5" stroke-linejoin="round"/><path d="M432,217.0 L438.3,214.0 L438.3,220.0 Z" fill="#b23b3b"/><rect x="20" y="280" width="640" height="46" rx="6" fill="#f1f3f6" stroke="#c9d3df" stroke-width="1" /><text x="30" y="299" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">Chapter 20 built the minimum version of each for one script: its own mail code, environment variables in a .env</text><text x="30" y="314" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">file instead of a vault, a log file, and a failure email.</text></svg>