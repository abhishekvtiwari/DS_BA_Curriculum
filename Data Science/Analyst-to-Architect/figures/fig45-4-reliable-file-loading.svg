<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="216" viewBox="0 0 1030 216" font-family="DejaVu Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1030" height="216" fill="#ffffff"/><rect x="33" y="44" width="146" height="150" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="30" y="40" width="146" height="150" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><path d="M30,48 a8,8 0 0 1 8,-8 H168 a8,8 0 0 1 8,8 V74 H30 Z" fill="#0f5c8c"/><text x="42" y="63" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">1 Receive</text><text x="40" y="102" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Check name and date</text><text x="40" y="121" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Hash; skip repeats</text><text x="40" y="140" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Record in load log</text><path d="M178,130 L194,130" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M194,130 L185.9,133.9 L185.9,126.1 Z" fill="#1d2330"/><rect x="199" y="44" width="146" height="150" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="196" y="40" width="146" height="150" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><path d="M196,48 a8,8 0 0 1 8,-8 H334 a8,8 0 0 1 8,8 V74 H196 Z" fill="#0f5c8c"/><text x="208" y="63" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">2 Read</text><text x="206" y="102" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Declare encoding,</text><text x="206" y="121" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">delimiter, header, types</text><text x="206" y="140" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Awkward fields as text</text><path d="M344,130 L360,130" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M360,130 L351.9,133.9 L351.9,126.1 Z" fill="#1d2330"/><rect x="365" y="44" width="146" height="150" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="362" y="40" width="146" height="150" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><path d="M362,48 a8,8 0 0 1 8,-8 H500 a8,8 0 0 1 8,8 V74 H362 Z" fill="#2f7d6d"/><text x="374" y="63" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">3 Land raw</text><text x="372" y="102" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Exactly what arrived</text><text x="372" y="121" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">+ file name</text><text x="372" y="140" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">+ load date</text><path d="M510,130 L526,130" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M526,130 L517.9,133.9 L517.9,126.1 Z" fill="#1d2330"/><rect x="531" y="44" width="146" height="150" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="528" y="40" width="146" height="150" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><path d="M528,48 a8,8 0 0 1 8,-8 H666 a8,8 0 0 1 8,8 V74 H528 Z" fill="#2f7d6d"/><text x="540" y="63" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">4 Type in staging</text><text x="538" y="102" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Explicit date formats</text><text x="538" y="121" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Remove separators</text><text x="538" y="140" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">TRY_CAST; list failures</text><path d="M676,130 L692,130" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M692,130 L683.9,133.9 L683.9,126.1 Z" fill="#1d2330"/><rect x="697" y="44" width="146" height="150" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="694" y="40" width="146" height="150" rx="8" fill="#fff" stroke="#7a4fa0" stroke-width="1.6" /><path d="M694,48 a8,8 0 0 1 8,-8 H832 a8,8 0 0 1 8,8 V74 H694 Z" fill="#7a4fa0"/><text x="706" y="63" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">5 Reconcile</text><text x="704" y="102" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Records = rows loaded</text><text x="704" y="121" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Rejects listed</text><text x="704" y="140" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Totals vs sender</text><path d="M842,130 L858,130" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M858,130 L849.9,133.9 L849.9,126.1 Z" fill="#1d2330"/><rect x="863" y="44" width="146" height="150" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="860" y="40" width="146" height="150" rx="8" fill="#fff" stroke="#c0662b" stroke-width="1.6" /><path d="M860,48 a8,8 0 0 1 8,-8 H998 a8,8 0 0 1 8,8 V74 H860 Z" fill="#c0662b"/><text x="872" y="63" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">6 Alert or proceed</text><text x="870" y="102" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Tell a person about</text><text x="870" y="121" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">rejects before reports</text><text x="870" y="140" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">and emails run</text></svg>