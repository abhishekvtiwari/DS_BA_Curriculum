<svg xmlns="http://www.w3.org/2000/svg" width="700" height="360" viewBox="0 0 700 360" font-family="DejaVu Sans, Arial, sans-serif"><rect width="700" height="360" fill="#ffffff"/><text x="20" y="24" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Riverstone&#x27;s 2025 profit tree: every level multiplies (×) or adds (+) to the one above</text><rect x="250" y="38" width="200" height="58" rx="6" fill="#fff" stroke="#0f5c8c" stroke-width="1.5" /><path d="M250,44 a6,6 0 0 1 6,-6 H444 a6,6 0 0 1 6,6 V60 H250 Z" fill="#0f5c8c"/><text x="350.0" y="54" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Gross profit</text><text x="350.0" y="78" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="middle">₹31.5 cr = revenue × margin</text><rect x="110" y="124" width="220" height="58" rx="6" fill="#fff" stroke="#0f5c8c" stroke-width="1.5" /><path d="M110,130 a6,6 0 0 1 6,-6 H324 a6,6 0 0 1 6,6 V146 H110 Z" fill="#0f5c8c"/><text x="220.0" y="140" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Revenue</text><text x="220.0" y="164" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="middle">₹114.7 cr = C × F × A</text><rect x="420" y="124" width="170" height="58" rx="6" fill="#fff" stroke="#7a4fa0" stroke-width="1.5" /><path d="M420,130 a6,6 0 0 1 6,-6 H584 a6,6 0 0 1 6,6 V146 H420 Z" fill="#7a4fa0"/><text x="505.0" y="140" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Gross margin</text><text x="505.0" y="164" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="middle">27.5%</text><path d="M330,96 L220,122" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M220,122 L225.4,117.6 L226.8,123.5 Z" fill="#5b6475"/><path d="M370,96 L505,122" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M505,122 L498.2,123.8 L499.4,117.8 Z" fill="#5b6475"/><text x="372" y="116" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="middle">×</text><rect x="10" y="214" width="220" height="72" rx="6" fill="#fff" stroke="#2f7d6d" stroke-width="1.5" /><path d="M10,220 a6,6 0 0 1 6,-6 H224 a6,6 0 0 1 6,6 V236 H10 Z" fill="#2f7d6d"/><text x="120.0" y="230" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Active customers (C)</text><text x="120.0" y="254" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="middle">4,599</text><text x="120.0" y="270" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="middle">= retained + new</text><path d="M220,182 L120,212" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M120,212 L125.2,207.3 L126.9,213.1 Z" fill="#5b6475"/><rect x="240" y="214" width="220" height="58" rx="6" fill="#fff" stroke="#c0662b" stroke-width="1.5" /><path d="M240,220 a6,6 0 0 1 6,-6 H454 a6,6 0 0 1 6,6 V236 H240 Z" fill="#c0662b"/><text x="350.0" y="230" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Orders per customer (F)</text><text x="350.0" y="254" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="middle">10.08 a year</text><path d="M220,182 L350,212" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M350,212 L343.2,213.5 L344.5,207.6 Z" fill="#5b6475"/><rect x="470" y="214" width="220" height="72" rx="6" fill="#fff" stroke="#b7791f" stroke-width="1.5" /><path d="M470,220 a6,6 0 0 1 6,-6 H684 a6,6 0 0 1 6,6 V236 H470 Z" fill="#b7791f"/><text x="580.0" y="230" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Average order value (A)</text><text x="580.0" y="254" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="middle">₹24,735.56</text><text x="580.0" y="270" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="middle">= units × price</text><path d="M220,182 L580,212" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M580,212 L573.5,214.5 L574.0,208.4 Z" fill="#5b6475"/><text x="118" y="208" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">×</text><text x="318" y="208" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">×</text><rect x="10" y="294" width="220" height="30" rx="4" fill="#fff" stroke="#2f7d6d" stroke-width="1.2" /><text x="18" y="307" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start">Retained 3,827</text><text x="18" y="320" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">= active 2024 (4,104) − churned (277)</text><rect x="10" y="328" width="220" height="30" rx="4" fill="#fff" stroke="#2f7d6d" stroke-width="1.2" /><text x="18" y="341" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start">New 772</text><text x="18" y="354" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">first order in 2025</text><rect x="470" y="294" width="220" height="30" rx="4" fill="#fff" stroke="#b7791f" stroke-width="1.2" /><text x="478" y="307" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start">Units per order 53.75</text><text x="478" y="320" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">basket size</text><rect x="470" y="328" width="220" height="30" rx="4" fill="#fff" stroke="#b7791f" stroke-width="1.2" /><text x="478" y="341" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start">Net price per unit ₹460.16</text><text x="478" y="354" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">list price less discount</text><path d="M120,286 V292" fill="none" stroke="#5b6475" stroke-width="1.2" stroke-linejoin="round"/><path d="M580,286 V292" fill="none" stroke="#5b6475" stroke-width="1.2" stroke-linejoin="round"/><text x="240" y="310" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">C × F × A gives revenue exactly:</text><text x="240" y="325" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">orders ÷ customers and revenue ÷ orders</text><text x="240" y="340" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">cancel out, leaving revenue.</text></svg>