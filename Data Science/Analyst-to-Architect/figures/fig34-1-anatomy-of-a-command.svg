<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300" font-family="DejaVu Sans, Arial, sans-serif"><rect width="700" height="300" fill="#ffffff"/><text x="20" y="28" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">One command: one channel in, two channels out, and an exit code</text><rect x="214" y="92" width="272" height="62" rx="7" fill="#f6f9fc" stroke="#1d2330" stroke-width="1.6" /><text x="350.0" y="117" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">grep -c &quot;Pune&quot;</text><text x="350.0" y="137" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">../sales_lines_2025.csv</text><rect x="20" y="80" width="160" height="86" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><text x="32" y="102" font-size="11.5" fill="#0f5c8c" font-weight="bold" text-anchor="start">standard input</text><text x="32" y="122" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">the keyboard, a file</text><text x="32" y="137" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">(&lt; file), or the output</text><text x="32" y="152" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">of a pipe (|)</text><path d="M180,123.0 H205" fill="none" stroke="#0f5c8c" stroke-width="1.8" stroke-linejoin="round"/><path d="M204,118.0 L212,123.0 L204,128.0 Z" fill="#0f5c8c"/><rect x="520" y="52" width="160" height="78" rx="7" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><text x="532" y="73" font-size="11.5" fill="#2f7d6d" font-weight="bold" text-anchor="start">standard output</text><text x="532" y="92" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">42</text><text x="532" y="110" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">the screen, a file (&gt; file),</text><text x="532" y="125" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">or the next command (|)</text><rect x="520" y="142" width="160" height="78" rx="7" fill="#fff" stroke="#b23b3b" stroke-width="1.6" /><text x="532" y="163" font-size="11.5" fill="#b23b3b" font-weight="bold" text-anchor="start">standard error</text><text x="532" y="182" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-style="italic">(nothing this time)</text><text x="532" y="200" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">the screen, even in a pipe,</text><text x="532" y="215" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">or a file (2&gt; file)</text><path d="M488,112 H500 V91 H512" fill="none" stroke="#2f7d6d" stroke-width="1.8" stroke-linejoin="round"/><path d="M512,86 L520,91 L512,96 Z" fill="#2f7d6d"/><path d="M488,134 H500 V181 H512" fill="none" stroke="#b23b3b" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="5 3"/><path d="M512,176 L520,181 L512,186 Z" fill="#b23b3b"/><path d="M350.0,154 V189" fill="none" stroke="#7a4fa0" stroke-width="1.8" stroke-linejoin="round"/><path d="M345.0,188 L350.0,196 L355.0,188 Z" fill="#7a4fa0"/><rect x="230" y="198" width="240" height="56" rx="7" fill="#fff" stroke="#7a4fa0" stroke-width="1.6" /><text x="350.0" y="220" font-size="11.5" fill="#7a4fa0" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">exit code:  echo $?  prints 0</text><text x="350.0" y="240" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="middle">0 means it worked; anything else, it failed</text><text x="20" y="284" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Output and errors are separate channels, so a pipe or a file can take one and leave the other on the screen.</text></svg>