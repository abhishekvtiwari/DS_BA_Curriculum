<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="370" viewBox="0 0 1040 370" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1040" height="370" fill="#ffffff"/><text x="30" y="32" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Anatomy of a command</text><rect x="30" y="60" width="980" height="70" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="50" y="103" font-size="13.5" fill="#5b6475" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">meera@laptop:~/ch34/practice$</text><text x="300" y="103" font-size="13.5" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">grep</text><text x="390" y="103" font-size="13.5" fill="#7a4fa0" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">-c</text><text x="450" y="103" font-size="13.5" fill="#c0662b" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">&quot;Pune&quot;</text><text x="590" y="103" font-size="13.5" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">../sales_lines_2025.csv</text><path d="M310,130 V150" fill="none" stroke="#c9d3df" stroke-width="1.2" stroke-linejoin="round"/><text x="318" y="160" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">the command: a small program</text><path d="M400,130 V176" fill="none" stroke="#c9d3df" stroke-width="1.2" stroke-linejoin="round"/><text x="408" y="186" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">options change how it works</text><path d="M460,130 V202" fill="none" stroke="#c9d3df" stroke-width="1.2" stroke-linejoin="round"/><text x="468" y="212" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">arguments say what to work on</text><path d="M600,130 V228" fill="none" stroke="#c9d3df" stroke-width="1.2" stroke-linejoin="round"/><text x="608" y="238" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">often a file or a folder</text><text x="30" y="295" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Output goes to the screen, errors go to a separate channel, and the command ends with an exit code:</text><rect x="30" y="310" width="300" height="40" rx="5" fill="#e2f3ee" stroke="#2f7d6d" stroke-width="1" /><text x="180" y="335" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">standard output  →  42</text><rect x="350" y="310" width="300" height="40" rx="5" fill="#fbeaea" stroke="#b23b3b" stroke-width="1" /><text x="500" y="335" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">standard error  →  (nothing)</text><rect x="670" y="310" width="340" height="40" rx="5" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="840" y="335" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">exit code  →  $? is 0 (found something)</text></svg>