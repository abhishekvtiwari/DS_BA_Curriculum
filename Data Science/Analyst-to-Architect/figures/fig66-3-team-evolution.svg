<svg xmlns="http://www.w3.org/2000/svg" width="680" height="225.7" viewBox="0 0 680 225.7" font-family="DejaVu Sans, Arial, sans-serif"><rect width="680" height="225.7" fill="#ffffff"/><text x="20" y="26" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Team structure: from four people to a function, one hire at a time</text><rect x="22" y="51" width="196" height="132.0" rx="6" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="20" y="48" width="196" height="132.0" rx="6" fill="#fff" stroke="#0f5c8c" stroke-width="1.5" /><path d="M20,54 a6,6 0 0 1 6,-6 H210 a6,6 0 0 1 6,6 V86 H20 Z" fill="#0f5c8c"/><text x="118.0" y="65" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">At Chapter 60: a four-person</text><text x="118.0" y="79" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">team</text><text x="29" y="103.0" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Meera (Head of Data Platform)</text><text x="29" y="116.8" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">and three others. Centralized:</text><text x="29" y="130.6" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">serves the whole company, so</text><text x="29" y="144.4" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">every request queues behind</text><text x="29" y="158.2" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">every other.</text><rect x="244" y="51" width="196" height="132.0" rx="6" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="242" y="48" width="196" height="132.0" rx="6" fill="#fff" stroke="#2f7d6d" stroke-width="1.5" /><path d="M242,54 a6,6 0 0 1 6,-6 H432 a6,6 0 0 1 6,6 V72 H242 Z" fill="#2f7d6d"/><text x="340.0" y="65" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">Then: one domain hire</text><text x="251" y="89.0" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">The Taloja plant&#x27;s own data</text><text x="251" y="102.8" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">analyst (Ch 62). The mesh check</text><text x="251" y="116.6" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">reran at 12 of 25: not a mesh,</text><text x="251" y="130.4" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">but one plant data product</text><text x="251" y="144.2" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">owned by the plant.</text><rect x="466" y="51" width="196" height="132.0" rx="6" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="464" y="48" width="196" height="132.0" rx="6" fill="#fff" stroke="#b7791f" stroke-width="1.5" /><path d="M464,54 a6,6 0 0 1 6,-6 H654 a6,6 0 0 1 6,6 V86 H464 Z" fill="#b7791f"/><text x="562.0" y="65" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">Proposed next: catalog and</text><text x="562.0" y="79" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">governance owner</text><text x="473" y="103.0" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">For the weakest dimension in</text><text x="473" y="116.8" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">section 66.2, catalog and</text><text x="473" y="130.6" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">discoverability (1.8). Not another</text><text x="473" y="144.4" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">generalist: the specific gap the</text><text x="473" y="158.2" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">maturity scores found.</text><path d="M219,114.0 L239,114.0" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M239,114.0 L232.7,117.0 L232.7,111.0 Z" fill="#5b6475"/><path d="M441,114.0 L461,114.0" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M461,114.0 L454.7,117.0 L454.7,111.0 Z" fill="#5b6475"/><text x="20" y="206.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">Each hire is justified by a specific, named gap this book already found, not headcount added because growth “felt right.”</text></svg>