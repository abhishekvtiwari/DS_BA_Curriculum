<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="352" viewBox="0 0 1040 352" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1040" height="352" fill="#ffffff"/><rect x="33" y="44" width="310" height="190" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="30" y="40" width="310" height="190" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><path d="M30,48 a8,8 0 0 1 8,-8 H332 a8,8 0 0 1 8,8 V74 H30 Z" fill="#0f5c8c"/><text x="42" y="63" font-size="15" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Did it run?</text><text x="44" y="104" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">Run success or failure</text><text x="44" y="125" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">Duration vs usual</text><text x="44" y="146" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">Runs that never started</text><path d="M44,180 H326" fill="none" stroke="#c9d3df" stroke-width="1" stroke-linejoin="round"/><text x="44" y="204" font-size="12" fill="#0f5c8c" font-weight="bold" text-anchor="start">Chapter 46: the orchestrator</text><rect x="369" y="44" width="310" height="190" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="366" y="40" width="310" height="190" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><path d="M366,48 a8,8 0 0 1 8,-8 H668 a8,8 0 0 1 8,8 V74 H366 Z" fill="#2f7d6d"/><text x="378" y="63" font-size="15" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Is it fresh?</text><text x="380" y="104" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">Age of the newest row</text><text x="380" y="125" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">Limits from the promise</text><text x="380" y="146" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">to users, not from habit</text><path d="M380,180 H662" fill="none" stroke="#c9d3df" stroke-width="1" stroke-linejoin="round"/><text x="380" y="204" font-size="12" fill="#2f7d6d" font-weight="bold" text-anchor="start">raw.dispatch: 102.5 h old, limit 48 h</text><rect x="705" y="44" width="310" height="190" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="702" y="40" width="310" height="190" rx="8" fill="#fff" stroke="#7a4fa0" stroke-width="1.6" /><path d="M702,48 a8,8 0 0 1 8,-8 H1004 a8,8 0 0 1 8,8 V74 H702 Z" fill="#7a4fa0"/><text x="714" y="63" font-size="15" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Does it look normal?</text><text x="716" y="104" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">Rows loaded vs history</text><text x="716" y="125" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">Key totals vs a median</text><text x="716" y="146" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">Zero rows on a working day</text><path d="M716,180 H998" fill="none" stroke="#c9d3df" stroke-width="1" stroke-linejoin="round"/><text x="716" y="204" font-size="12" fill="#7a4fa0" font-weight="bold" text-anchor="start">2025 median day: Rs 27,442.50</text><rect x="30" y="252" width="982" height="74" rx="7" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="46" y="278" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Tests ask whether the data is right. Observability asks whether the platform is behaving normally.</text><text x="46" y="302" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Stale data is the most common incident and the least noticed: nothing fails, the numbers simply stop changing.</text></svg>