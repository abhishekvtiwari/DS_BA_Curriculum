<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="390" viewBox="0 0 1040 390" font-family="DejaVu Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1040" height="390" fill="#ffffff"/><text x="40" y="40" font-size="15" fill="#b23b3b" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Naive step: append</text><rect x="40" y="60" width="440" height="40" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.3" /><text x="54" y="86" font-size="12.5" fill="#1d2330" font-weight="None" text-anchor="start">Run 1: INSERT the day&#x27;s row</text><rect x="40" y="110" width="440" height="40" rx="6" fill="#fff" stroke="#b23b3b" stroke-width="1.3" /><text x="54" y="136" font-size="12.5" fill="#b23b3b" font-weight="bold" text-anchor="start">Worker lost before success is reported</text><rect x="40" y="160" width="440" height="40" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.3" /><text x="54" y="186" font-size="12.5" fill="#1d2330" font-weight="None" text-anchor="start">Orchestrator retries</text><rect x="40" y="210" width="440" height="40" rx="6" fill="#fff" stroke="#b23b3b" stroke-width="1.3" /><text x="54" y="236" font-size="12.5" fill="#b23b3b" font-weight="bold" text-anchor="start">Run 2: INSERT the day&#x27;s row again</text><rect x="40" y="260" width="440" height="40" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.3" /><text x="54" y="286" font-size="12.5" fill="#1d2330" font-weight="None" text-anchor="start">Run 2 succeeds</text><rect x="40" y="316" width="440" height="54" rx="7" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="54" y="338" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="start">2 rows for 2 January</text><text x="54" y="358" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="start">SUM(revenue) = Rs 77,420 (true: 38,710)</text><text x="550" y="40" font-size="15" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Safe step: overwrite in a transaction</text><rect x="550" y="60" width="440" height="40" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.3" /><text x="564" y="86" font-size="12.5" fill="#1d2330" font-weight="None" text-anchor="start">Run 1: BEGIN; DELETE day; INSERT day</text><rect x="550" y="110" width="440" height="40" rx="6" fill="#fff" stroke="#b23b3b" stroke-width="1.3" /><text x="564" y="136" font-size="12.5" fill="#b23b3b" font-weight="bold" text-anchor="start">Worker lost before COMMIT</text><rect x="550" y="160" width="440" height="40" rx="6" fill="#fff" stroke="#c0662b" stroke-width="1.3" /><text x="564" y="186" font-size="12.5" fill="#c0662b" font-weight="bold" text-anchor="start">ROLLBACK: table unchanged</text><rect x="550" y="210" width="440" height="40" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.3" /><text x="564" y="236" font-size="12.5" fill="#1d2330" font-weight="None" text-anchor="start">Run 2: BEGIN; DELETE; INSERT; COMMIT</text><rect x="550" y="260" width="440" height="40" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.3" /><text x="564" y="286" font-size="12.5" fill="#1d2330" font-weight="None" text-anchor="start">Run 2 succeeds</text><rect x="550" y="316" width="440" height="54" rx="7" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="564" y="338" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="start">1 row for 2 January</text><text x="564" y="358" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="start">SUM(revenue) = Rs 38,710</text></svg>