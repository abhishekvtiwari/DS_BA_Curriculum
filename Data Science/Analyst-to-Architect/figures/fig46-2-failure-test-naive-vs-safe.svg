<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" font-family="DejaVu Sans, Arial, sans-serif"><rect width="760" height="340" fill="#ffffff"/><text x="20" y="34" font-size="14" fill="#b23b3b" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Naive step: append</text><rect x="20" y="50" width="350" height="36" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.3" /><text x="32" y="73" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Run 1: INSERT the day&#x27;s row</text><rect x="20" y="94" width="350" height="36" rx="6" fill="#fff" stroke="#b23b3b" stroke-width="1.3" /><text x="32" y="117" font-size="11.5" fill="#b23b3b" font-weight="bold" text-anchor="start">Worker lost before success is reported</text><rect x="20" y="138" width="350" height="36" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.3" /><text x="32" y="161" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Orchestrator retries</text><rect x="20" y="182" width="350" height="36" rx="6" fill="#fff" stroke="#b23b3b" stroke-width="1.3" /><text x="32" y="205" font-size="11.5" fill="#b23b3b" font-weight="bold" text-anchor="start">Run 2: INSERT the day&#x27;s row again</text><rect x="20" y="226" width="350" height="36" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.3" /><text x="32" y="249" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Run 2 succeeds</text><rect x="20" y="276" width="350" height="56" rx="7" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="36" y="315" font-size="26" fill="#ffffff" font-weight="bold" text-anchor="start">✗</text><text x="72" y="299" font-size="12.5" fill="#ffffff" font-weight="bold" text-anchor="start">Wrong: 2 rows for 2 January</text><text x="72" y="319" font-size="12.5" fill="#ffffff" font-weight="bold" text-anchor="start">SUM(revenue) = ₹77,420 (true: ₹38,710)</text><text x="390" y="34" font-size="14" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Safe step: overwrite in a transaction</text><rect x="390" y="50" width="350" height="36" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.3" /><text x="402" y="73" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Run 1: BEGIN; DELETE the day&#x27;s row</text><rect x="390" y="94" width="350" height="36" rx="6" fill="#fff" stroke="#b23b3b" stroke-width="1.3" /><text x="402" y="117" font-size="11.5" fill="#b23b3b" font-weight="bold" text-anchor="start">Worker lost between DELETE and INSERT</text><rect x="390" y="138" width="350" height="36" rx="6" fill="#fff" stroke="#c0662b" stroke-width="1.3" /><text x="402" y="161" font-size="11.5" fill="#c0662b" font-weight="bold" text-anchor="start">ROLLBACK: the old row is still there</text><rect x="390" y="182" width="350" height="36" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.3" /><text x="402" y="205" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Run 2: BEGIN; DELETE; INSERT; COMMIT</text><rect x="390" y="226" width="350" height="36" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.3" /><text x="402" y="249" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Run 2 succeeds</text><rect x="390" y="276" width="350" height="56" rx="7" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="406" y="315" font-size="26" fill="#ffffff" font-weight="bold" text-anchor="start">✓</text><text x="442" y="299" font-size="12.5" fill="#ffffff" font-weight="bold" text-anchor="start">Right: 1 row for 2 January</text><text x="442" y="319" font-size="12.5" fill="#ffffff" font-weight="bold" text-anchor="start">SUM(revenue) = ₹38,710</text></svg>