<svg xmlns="http://www.w3.org/2000/svg" width="720" height="258" viewBox="0 0 720 258" font-family="DejaVu Sans, Arial, sans-serif"><rect width="720" height="258" fill="#ffffff"/><text x="16" y="26" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The five things that must be versioned, and where they travel</text><rect x="16" y="46" width="122" height="78" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><text x="77.0" y="68" font-size="12.5" fill="#0f5c8c" font-weight="bold" text-anchor="middle">data</text><text x="77.0" y="90" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">6,000 images,</text><text x="77.0" y="107" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">hash 64712189</text><path d="M140,85 H154" fill="none" stroke="#1d2330" stroke-width="1.6" stroke-linejoin="round"/><path d="M149,80 L155,85 L149,90" fill="none" stroke="#1d2330" stroke-width="1.6" stroke-linejoin="round"/><rect x="157" y="46" width="122" height="78" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><text x="218.0" y="68" font-size="12.5" fill="#0f5c8c" font-weight="bold" text-anchor="middle">features</text><text x="218.0" y="90" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">conv108-v1:</text><text x="218.0" y="107" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">108 features</text><path d="M281,85 H295" fill="none" stroke="#1d2330" stroke-width="1.6" stroke-linejoin="round"/><path d="M290,80 L296,85 L290,90" fill="none" stroke="#1d2330" stroke-width="1.6" stroke-linejoin="round"/><rect x="298" y="46" width="122" height="78" rx="7" fill="#fff" stroke="#7a4fa0" stroke-width="1.6" /><text x="359.0" y="68" font-size="12.5" fill="#7a4fa0" font-weight="bold" text-anchor="middle">code</text><text x="359.0" y="90" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">train.py at</text><text x="359.0" y="107" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">a Git commit</text><path d="M422,85 H436" fill="none" stroke="#1d2330" stroke-width="1.6" stroke-linejoin="round"/><path d="M431,80 L437,85 L431,90" fill="none" stroke="#1d2330" stroke-width="1.6" stroke-linejoin="round"/><rect x="439" y="46" width="122" height="78" rx="7" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><text x="500.0" y="68" font-size="12.5" fill="#2f7d6d" font-weight="bold" text-anchor="middle">artifact</text><text x="500.0" y="90" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">defect_v1.joblib</text><text x="500.0" y="107" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">95 kB</text><path d="M563,85 H577" fill="none" stroke="#1d2330" stroke-width="1.6" stroke-linejoin="round"/><path d="M572,80 L578,85 L572,90" fill="none" stroke="#1d2330" stroke-width="1.6" stroke-linejoin="round"/><rect x="580" y="46" width="122" height="78" rx="7" fill="#fff" stroke="#c0662b" stroke-width="1.6" /><text x="641.0" y="68" font-size="12.5" fill="#c0662b" font-weight="bold" text-anchor="middle">config</text><text x="641.0" y="90" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">threshold 0.1,</text><text x="641.0" y="107" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">in metadata</text><rect x="16" y="140" width="688" height="62" rx="7" fill="#e2f3ee" stroke="#2f7d6d" stroke-width="1.4" /><text x="360" y="161" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="middle">one artifact carries the model AND its metadata, so a rollback restores</text><text x="360" y="177" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="middle">both the weights and the decision boundary</text><text x="360" y="194" font-size="11" fill="#2f7d6d" font-weight="bold" text-anchor="middle">rollback = swap the file (or move the registry alias), restart, and time it</text><text x="16" y="226" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">If any one of the five is missing, you cannot reproduce the model, compare it with its successor,</text><text x="16" y="244" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">or explain a decision six months later.</text></svg>