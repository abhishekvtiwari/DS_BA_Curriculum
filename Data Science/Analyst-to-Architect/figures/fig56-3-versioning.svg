<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="286" viewBox="0 0 1040 286" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1040" height="286" fill="#ffffff"/><text x="30" y="32" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The five things that must be versioned, and where they travel</text><rect x="40" y="70" width="170" height="84" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.8" /><text x="125" y="96" font-size="12.5" fill="#0f5c8c" font-weight="bold" text-anchor="middle">data</text><text x="125" y="118" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">6,000 images</text><text x="125" y="134" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">hash 1e86c528</text><path d="M210,112 H266" fill="none" stroke="#1d2330" stroke-width="1.8" stroke-linejoin="round"/><path d="M258,106 L268,112 L258,118" fill="none" stroke="#1d2330" stroke-width="1.8" stroke-linejoin="round"/><rect x="230" y="70" width="170" height="84" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.8" /><text x="315" y="96" font-size="12.5" fill="#0f5c8c" font-weight="bold" text-anchor="middle">features</text><text x="315" y="118" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">108 convolution</text><text x="315" y="134" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">features, in Git</text><path d="M400,112 H456" fill="none" stroke="#1d2330" stroke-width="1.8" stroke-linejoin="round"/><path d="M448,106 L458,112 L448,118" fill="none" stroke="#1d2330" stroke-width="1.8" stroke-linejoin="round"/><rect x="420" y="70" width="170" height="84" rx="8" fill="#fff" stroke="#7a4fa0" stroke-width="1.8" /><text x="505" y="96" font-size="12.5" fill="#7a4fa0" font-weight="bold" text-anchor="middle">code</text><text x="505" y="118" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">train.py at a</text><text x="505" y="134" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">commit hash</text><path d="M590,112 H646" fill="none" stroke="#1d2330" stroke-width="1.8" stroke-linejoin="round"/><path d="M638,106 L648,112 L638,118" fill="none" stroke="#1d2330" stroke-width="1.8" stroke-linejoin="round"/><rect x="610" y="70" width="170" height="84" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.8" /><text x="695" y="96" font-size="12.5" fill="#2f7d6d" font-weight="bold" text-anchor="middle">artifact</text><text x="695" y="118" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">defect_v1.joblib</text><text x="695" y="134" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">96 kB</text><path d="M780,112 H836" fill="none" stroke="#1d2330" stroke-width="1.8" stroke-linejoin="round"/><path d="M828,106 L838,112 L828,118" fill="none" stroke="#1d2330" stroke-width="1.8" stroke-linejoin="round"/><rect x="800" y="70" width="170" height="84" rx="8" fill="#fff" stroke="#c0662b" stroke-width="1.8" /><text x="885" y="96" font-size="12.5" fill="#c0662b" font-weight="bold" text-anchor="middle">config</text><text x="885" y="118" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">threshold 0.1,</text><text x="885" y="134" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">in the metadata</text><rect x="40" y="180" width="930" height="52" rx="8" fill="#e2f3ee" stroke="#2f7d6d" stroke-width="1.6" /><text x="505" y="202" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="middle">one artifact carries the model AND its metadata, so a rollback restores both the weights and the decision boundary</text><text x="505" y="222" font-size="12" fill="#2f7d6d" font-weight="bold" text-anchor="middle">rollback = swap the file, restart, four minutes — timed on a quiet afternoon, written in the runbook</text><text x="30" y="262" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">If any one of the five is missing, you cannot reproduce the model, compare it with its successor, or explain a decision six months later.</text></svg>