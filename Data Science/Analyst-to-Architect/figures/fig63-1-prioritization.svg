" stroke="#7a4fa0" stroke-width="2"/><text x="352.0" y="198.0" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="middle">R3</text><text x="379.0" y="192.0" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">CRM reverse-ETL syncs</text><text x="379.0" y="206.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">value 3, effort 3, risk 3</text><text x="20" y="396" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">Bubble size and the R number show the risk score: 1 = a wrong result is stopped before anyone uses it, 5 = wrong</text><text x="20" y="410" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">results reach customers unseen. A dashed outline marks high risk (4 or 5).</text></svg>