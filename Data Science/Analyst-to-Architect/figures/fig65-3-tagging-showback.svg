<svg xmlns="http://www.w3.org/2000/svg" width="760" height="338" viewBox="0 0 760 338" font-family="DejaVu Sans, Arial, sans-serif"><rect width="760" height="338" fill="#ffffff"/><text x="20" y="26" font-size="15" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Tagging and showback: one bill, split honestly by owner</text><rect x="23" y="47" width="220" height="78" rx="7" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="20" y="44" width="220" height="78" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><path d="M20,51 a7,7 0 0 1 7,-7 H233 a7,7 0 0 1 7,7 V68 H20 Z" fill="#0f5c8c"/><text x="130.0" y="61" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">1. Tag at creation</text><text x="130.0" y="86" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="middle">owner, container, environment</text><text x="130.0" y="102" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="middle">(Chapter 63&#x27;s ownership)</text><rect x="273" y="47" width="220" height="78" rx="7" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="270" y="44" width="220" height="78" rx="7" fill="#fff" stroke="#b7791f" stroke-width="1.6" /><path d="M270,51 a7,7 0 0 1 7,-7 H483 a7,7 0 0 1 7,7 V68 H270 Z" fill="#b7791f"/><text x="380.0" y="61" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">2. One bill, grouped</text><text x="380.0" y="86" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="middle">one AWS invoice, split</text><text x="380.0" y="102" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="middle">by tag automatically</text><rect x="523" y="47" width="220" height="78" rx="7" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="520" y="44" width="220" height="78" rx="7" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><path d="M520,51 a7,7 0 0 1 7,-7 H733 a7,7 0 0 1 7,7 V68 H520 Z" fill="#2f7d6d"/><text x="630.0" y="61" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">3. Showback, per owner</text><text x="630.0" y="86" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="middle">₹37,780 a month,</text><text x="630.0" y="102" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="middle">shared out below</text><path d="M243,83 L261,83" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M267,83 L259,78.5 L259,87.5 Z" fill="#5b6475"/><path d="M493,83 L511,83" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M517,83 L509,78.5 L509,87.5 Z" fill="#5b6475"/><rect x="20" y="144" width="720" height="36" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="20" y="144" width="6" height="36" rx="0" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="36" y="167" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">Data platform team</text><text x="190" y="167" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">warehouse compute, storage, backups; orchestration</text><text x="728" y="167" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="end">81.7%</text><rect x="20" y="186" width="720" height="36" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="20" y="186" width="6" height="36" rx="0" fill="#7a4fa0" stroke="none" stroke-width="1" /><text x="36" y="209" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">AI applications</text><text x="190" y="209" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">defect-model serving; PO-intake and RAG LLM calls</text><text x="728" y="209" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="end">15.6%</text><rect x="20" y="228" width="720" height="36" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="20" y="228" width="6" height="36" rx="0" fill="#b7791f" stroke="none" stroke-width="1" /><text x="36" y="251" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">Shared</text><text x="190" y="251" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">data transfer out: dashboards, API replies, emails</text><text x="728" y="251" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="end">2.0%</text><rect x="20" y="270" width="720" height="36" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="20" y="270" width="6" height="36" rx="0" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="36" y="293" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">Plant operations</text><text x="190" y="293" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">sensor archive, hot and cold tiers</text><text x="728" y="293" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="end">0.6%</text><text x="20" y="326" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Showback shows each owner its real cost without charging it; a genuinely shared cost stays &quot;shared&quot;.</text></svg>