<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="502" viewBox="0 0 1040 502" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1040" height="502" fill="#ffffff"/><rect x="33" y="28" width="540" height="411" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="30" y="24" width="540" height="411" rx="8" fill="#fff" stroke="#c9d3df" stroke-width="1.4" /><text x="76" y="60" font-size="15.5" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Data Analyst (Sales Analytics and Automation)</text><text x="76" y="84" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Riverstone Supplies · head office, hybrid · 1–3 years</text><text x="76" y="103" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">(freshers with strong projects considered)</text><text x="76" y="130" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">What you&#x27;ll do</text><text x="76" y="151" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">• Run a weekly at-risk customer list for sales reps</text><text x="76" y="171" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">• Build and maintain the sales dashboard (Power BI)</text><text x="76" y="191" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">• Agree definitions like &#x27;active customer&#x27; with finance</text><text x="76" y="211" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">• Automate recurring reports, incl. the Daily Sales Flash</text><text x="76" y="239" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Must have</text><text x="76" y="260" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">• SQL: joins, aggregation; window functions a plus</text><text x="76" y="280" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">• Excel or Google Sheets: lookups, pivot tables</text><text x="76" y="300" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">• A BI tool, Power BI preferred</text><text x="76" y="320" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">• Automated a recurring report, with any tool</text><text x="76" y="340" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">• Clear written English</text><text x="76" y="368" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Nice to have</text><text x="76" y="389" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">• Python (pandas) · VBA or Apps Script</text><text x="76" y="409" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">• Forecasting or customer analytics · CRM experience</text><circle cx="54" cy="56" r="11" fill="#0f5c8c"/><text x="54" y="60.5" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">1</text><rect x="600" y="34" width="410" height="56" rx="6" fill="#fbfcfe" stroke="#0f5c8c" stroke-width="1.3" /><circle cx="620" cy="54" r="11" fill="#0f5c8c"/><text x="620" y="58.5" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">1</text><text x="640" y="58" font-size="13" fill="#0f5c8c" font-weight="bold" text-anchor="start">Title = track + tier</text><text x="640" y="78" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Analytics &amp; BI, tier 1, with the automation thread.</text><circle cx="54" cy="99" r="11" fill="#2f7d6d"/><text x="54" y="103.5" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">2</text><rect x="600" y="98" width="410" height="56" rx="6" fill="#fbfcfe" stroke="#2f7d6d" stroke-width="1.3" /><circle cx="620" cy="118" r="11" fill="#2f7d6d"/><text x="620" y="122.5" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">2</text><text x="640" y="122" font-size="13" fill="#2f7d6d" font-weight="bold" text-anchor="start">A door for freshers</text><text x="640" y="142" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">&quot;Strong projects&quot; means a portfolio can replace experience.</text><circle cx="54" cy="147" r="11" fill="#0f5c8c"/><text x="54" y="151.5" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">3</text><rect x="600" y="162" width="410" height="56" rx="6" fill="#fbfcfe" stroke="#0f5c8c" stroke-width="1.3" /><circle cx="620" cy="182" r="11" fill="#0f5c8c"/><text x="620" y="186.5" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">3</text><text x="640" y="186" font-size="13" fill="#0f5c8c" font-weight="bold" text-anchor="start">Duties are outputs</text><text x="640" y="206" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">At-risk list: Ch 13 · dashboard: Ch 16 · automation: Ch 20.</text><circle cx="54" cy="187" r="11" fill="#7a4fa0"/><text x="54" y="191.5" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">4</text><rect x="600" y="226" width="410" height="56" rx="6" fill="#fbfcfe" stroke="#7a4fa0" stroke-width="1.3" /><circle cx="620" cy="246" r="11" fill="#7a4fa0"/><text x="620" y="250.5" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">4</text><text x="640" y="250" font-size="13" fill="#7a4fa0" font-weight="bold" text-anchor="start">Hidden skill</text><text x="640" y="270" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Agreeing definitions is stakeholder work: Ch 23–24.</text><circle cx="54" cy="236" r="11" fill="#2f7d6d"/><text x="54" y="240.5" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">5</text><rect x="600" y="290" width="410" height="56" rx="6" fill="#fbfcfe" stroke="#2f7d6d" stroke-width="1.3" /><circle cx="620" cy="310" r="11" fill="#2f7d6d"/><text x="620" y="314.5" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">5</text><text x="640" y="314" font-size="13" fill="#2f7d6d" font-weight="bold" text-anchor="start">Must-haves = the keys</text><text x="640" y="334" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">These decide the shortlist. Score yourself on each.</text><circle cx="54" cy="316" r="11" fill="#2f7d6d"/><text x="54" y="320.5" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">6</text><rect x="600" y="354" width="410" height="56" rx="6" fill="#fbfcfe" stroke="#2f7d6d" stroke-width="1.3" /><circle cx="620" cy="374" r="11" fill="#2f7d6d"/><text x="620" y="378.5" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">6</text><text x="640" y="378" font-size="13" fill="#2f7d6d" font-weight="bold" text-anchor="start">&quot;With any tool&quot;</text><text x="640" y="398" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">They care about the result, not a brand of software.</text><circle cx="54" cy="365" r="11" fill="#c0662b"/><text x="54" y="369.5" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">7</text><rect x="600" y="418" width="410" height="56" rx="6" fill="#fbfcfe" stroke="#c0662b" stroke-width="1.3" /><circle cx="620" cy="438" r="11" fill="#c0662b"/><text x="620" y="442.5" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">7</text><text x="640" y="442" font-size="13" fill="#c0662b" font-weight="bold" text-anchor="start">Nice-to-haves are not rules</text><text x="640" y="462" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Apply if you meet the must-haves; these are tie-breakers.</text></svg>