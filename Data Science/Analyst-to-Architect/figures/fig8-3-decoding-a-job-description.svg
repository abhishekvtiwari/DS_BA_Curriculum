<svg xmlns="http://www.w3.org/2000/svg" width="720" height="486" viewBox="0 0 720 486" font-family="DejaVu Sans, Arial, sans-serif"><rect width="720" height="486" fill="#ffffff"/><rect x="19" y="20" width="404" height="454" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="16" y="16" width="404" height="454" rx="8" fill="#fff" stroke="#c9d3df" stroke-width="1.4" /><text x="56" y="46" font-size="13.5" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Data Analyst</text><text x="56" y="69.04347826086956" font-size="13.5" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">(Sales Analytics and Automation)</text><text x="56" y="92.08695652173913" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">Riverstone Supplies · head office, hybrid</text><text x="56" y="111.67391304347825" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">1–3 years (freshers with strong projects considered)</text><text x="56" y="139.32608695652172" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">What you&#x27;ll do</text><text x="56" y="161.2173913043478" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">• Run a weekly at-risk customer list for sales reps</text><text x="56" y="181.95652173913044" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">• Build and maintain the sales dashboard (Power BI)</text><text x="56" y="202.69565217391306" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">• Agree definitions (&#x27;active customer&#x27;) with finance</text><text x="56" y="223.43478260869568" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">• Automate reports, incl. the Daily Sales Flash</text><text x="56" y="252.23913043478265" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">Must have</text><text x="56" y="274.13043478260875" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">• SQL: joins, aggregation; window functions a plus</text><text x="56" y="294.86956521739137" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">• Excel or Google Sheets: lookups, pivot tables</text><text x="56" y="315.608695652174" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">• A BI tool, Power BI preferred</text><text x="56" y="336.3478260869566" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">• Automated a recurring report, with any tool</text><text x="56" y="357.08695652173924" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">• Clear written English</text><text x="56" y="385.89130434782624" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">Nice to have</text><text x="56" y="407.7826086956523" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">• Python (pandas) · VBA or Apps Script</text><text x="56" y="428.5217391304349" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">• Forecasting or customer analytics</text><text x="56" y="449.26086956521755" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">• Experience with a CRM or ERP</text><circle cx="36" cy="42" r="10" fill="#0f5c8c"/><text x="36" y="46.5" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="middle">1</text><rect x="432" y="16" width="272" height="58" rx="6" fill="#fbfcfe" stroke="#0f5c8c" stroke-width="1.3" /><circle cx="450" cy="34" r="10" fill="#0f5c8c"/><text x="450" y="38.5" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="middle">1</text><text x="468" y="38" font-size="12" fill="#0f5c8c" font-weight="bold" text-anchor="start">Title = track + tier</text><text x="468" y="55" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">Analytics &amp; BI, tier 1, with the</text><text x="468" y="69" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">automation thread.</text><circle cx="36" cy="107.67391304347825" r="10" fill="#2f7d6d"/><text x="36" y="112.17391304347825" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="middle">2</text><rect x="432" y="82" width="272" height="58" rx="6" fill="#fbfcfe" stroke="#2f7d6d" stroke-width="1.3" /><circle cx="450" cy="100" r="10" fill="#2f7d6d"/><text x="450" y="104.5" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="middle">2</text><text x="468" y="104" font-size="12" fill="#2f7d6d" font-weight="bold" text-anchor="start">A door for freshers</text><text x="468" y="121" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">&quot;Strong projects&quot; means a portfolio</text><text x="468" y="135" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">can replace experience.</text><circle cx="36" cy="157.2173913043478" r="10" fill="#0f5c8c"/><text x="36" y="161.7173913043478" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="middle">3</text><rect x="432" y="148" width="272" height="58" rx="6" fill="#fbfcfe" stroke="#0f5c8c" stroke-width="1.3" /><circle cx="450" cy="166" r="10" fill="#0f5c8c"/><text x="450" y="170.5" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="middle">3</text><text x="468" y="170" font-size="12" fill="#0f5c8c" font-weight="bold" text-anchor="start">Duties are outputs</text><text x="468" y="187" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">At-risk list: Ch 13 · dashboard: Ch 16</text><text x="468" y="201" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">· automation: Ch 20.</text><circle cx="36" cy="198.69565217391306" r="10" fill="#7a4fa0"/><text x="36" y="203.19565217391306" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="middle">4</text><rect x="432" y="214" width="272" height="58" rx="6" fill="#fbfcfe" stroke="#7a4fa0" stroke-width="1.3" /><circle cx="450" cy="232" r="10" fill="#7a4fa0"/><text x="450" y="236.5" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="middle">4</text><text x="468" y="236" font-size="12" fill="#7a4fa0" font-weight="bold" text-anchor="start">Hidden skill</text><text x="468" y="253" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">Agreeing definitions is stakeholder</text><text x="468" y="267" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">work: Ch 23–24.</text><circle cx="36" cy="248.23913043478265" r="10" fill="#2f7d6d"/><text x="36" y="252.73913043478265" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="middle">5</text><rect x="432" y="280" width="272" height="58" rx="6" fill="#fbfcfe" stroke="#2f7d6d" stroke-width="1.3" /><circle cx="450" cy="298" r="10" fill="#2f7d6d"/><text x="450" y="302.5" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="middle">5</text><text x="468" y="302" font-size="12" fill="#2f7d6d" font-weight="bold" text-anchor="start">Must-haves = the keys</text><text x="468" y="319" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">These decide the shortlist. Score</text><text x="468" y="333" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">yourself on each.</text><circle cx="36" cy="332.3478260869566" r="10" fill="#2f7d6d"/><text x="36" y="336.8478260869566" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="middle">6</text><rect x="432" y="346" width="272" height="58" rx="6" fill="#fbfcfe" stroke="#2f7d6d" stroke-width="1.3" /><circle cx="450" cy="364" r="10" fill="#2f7d6d"/><text x="450" y="368.5" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="middle">6</text><text x="468" y="368" font-size="12" fill="#2f7d6d" font-weight="bold" text-anchor="start">&quot;With any tool&quot;</text><text x="468" y="385" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">They care about the result, not a</text><text x="468" y="399" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">brand of software.</text><circle cx="36" cy="381.89130434782624" r="10" fill="#c0662b"/><text x="36" y="386.39130434782624" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="middle">7</text><rect x="432" y="412" width="272" height="58" rx="6" fill="#fbfcfe" stroke="#c0662b" stroke-width="1.3" /><circle cx="450" cy="430" r="10" fill="#c0662b"/><text x="450" y="434.5" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="middle">7</text><text x="468" y="434" font-size="12" fill="#c0662b" font-weight="bold" text-anchor="start">Nice-to-haves are not rules</text><text x="468" y="451" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">Apply if you meet the must-haves;</text><text x="468" y="465" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">these are tie-breakers.</text></svg>