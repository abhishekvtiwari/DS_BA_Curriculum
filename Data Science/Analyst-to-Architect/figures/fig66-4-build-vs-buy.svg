<svg xmlns="http://www.w3.org/2000/svg" width="680" height="321.4" viewBox="0 0 680 321.4" font-family="DejaVu Sans, Arial, sans-serif"><rect width="680" height="321.4" fill="#ffffff"/><text x="20" y="26" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Build vs. buy: a managed data catalog, scored honestly</text><rect x="20" y="44" width="640" height="24" rx="3" fill="#1d2330" stroke="none" stroke-width="1" /><text x="26" y="60" font-size="11" fill="#fff" font-weight="bold" text-anchor="start">Dimension</text><text x="206" y="60" font-size="11" fill="#fff" font-weight="bold" text-anchor="start">Buy</text><text x="366" y="60" font-size="11" fill="#fff" font-weight="bold" text-anchor="start">Build</text><text x="546" y="60" font-size="11" fill="#fff" font-weight="bold" text-anchor="start">Edge to</text><rect x="20" y="68" width="640" height="39.6" rx="0" fill="#fff" stroke="none" stroke-width="1" /><text x="26" y="86.0" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">Time to a working solution</text><text x="206" y="86.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">Weeks</text><text x="366" y="86.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">Months of a 4-person team&#x27;s</text><text x="366" y="99.8" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">time</text><text x="546" y="86.0" font-size="10.5" fill="#0f5c8c" font-weight="bold" text-anchor="start">Buy</text><rect x="20" y="107.6" width="640" height="39.6" rx="0" fill="#f6f9fc" stroke="none" stroke-width="1" /><text x="26" y="125.6" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">Fit to Riverstone&#x27;s exact</text><text x="26" y="139.4" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">needs</text><text x="206" y="125.6" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">Good enough</text><text x="366" y="125.6" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">Perfect, eventually</text><text x="546" y="125.6" font-size="10.5" fill="#b7791f" font-weight="bold" text-anchor="start">Build (eventually)</text><rect x="20" y="147.2" width="640" height="39.6" rx="0" fill="#fff" stroke="none" stroke-width="1" /><text x="26" y="165.2" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">Ongoing maintenance</text><text x="206" y="165.2" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">The vendor&#x27;s problem</text><text x="366" y="165.2" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">The 4-person team&#x27;s problem,</text><text x="366" y="179.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">forever</text><text x="546" y="165.2" font-size="10.5" fill="#0f5c8c" font-weight="bold" text-anchor="start">Buy</text><rect x="20" y="186.79999999999998" width="640" height="39.6" rx="0" fill="#f6f9fc" stroke="none" stroke-width="1" /><text x="26" y="204.79999999999998" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">Cost at current scale</text><text x="206" y="204.79999999999998" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">A predictable subscription</text><text x="366" y="204.79999999999998" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">Engineering time, not on any</text><text x="366" y="218.6" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">bill</text><text x="546" y="204.79999999999998" font-size="10.5" fill="#0f5c8c" font-weight="bold" text-anchor="start">Buy</text><rect x="20" y="226.39999999999998" width="640" height="39.6" rx="0" fill="#fff" stroke="none" stroke-width="1" /><text x="26" y="244.39999999999998" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">Lock-in risk</text><text x="206" y="244.39999999999998" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">Real: switching is</text><text x="206" y="258.2" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">expensive</text><text x="366" y="244.39999999999998" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">Worse: one person</text><text x="366" y="258.2" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">understands it</text><text x="546" y="244.39999999999998" font-size="10.5" fill="#0f5c8c" font-weight="bold" text-anchor="start">Buy, narrowly</text><path d="M20,266.0 H660" fill="none" stroke="#c9d3df" stroke-width="1" stroke-linejoin="round"/><text x="20" y="288.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">Buy wins on four of five dimensions. Build wins only on fit, and only eventually: worth it when Riverstone&#x27;s needs are</text><text x="20" y="301.65" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">genuinely unlike anyone else&#x27;s, which a catalog&#x27;s needs, honestly, are not.</text></svg>