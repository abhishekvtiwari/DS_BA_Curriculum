ext x="34" y="282" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">TOTAL</text><text x="306" y="282" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="end" font-family="DejaVu Sans Mono, monospace">₹1,092</text><text x="34" y="308" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Paid by: UPI</text><text x="170.0" y="334" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">Thank you! Visit again</text><text x="350" y="48" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">What happens to the receipt</text><rect x="350" y="64" width="330" height="176" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="364" y="90" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">• Each item line on the receipt (shaded)</text><text x="364" y="110" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">  becomes one row: a record.</text><text x="364" y="130" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">• Each kind of detail becomes one</text><text x="364" y="150" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">  column: a field.</text><text x="364" y="170" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">• The bill number, date and payment</text><text x="364" y="190" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">  method repeat on every row.</text><text x="364" y="210" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">• The total ₹1,092 is not a row: it can be</text><text x="364" y="230" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">  calculated from the amount column.</text><path d="M350.0,364 V394" fill="none" stroke="#5b6475" stroke-width="2" stroke-linejoin="round"/><path d="M344.0,392 L350.0,402 L356.0,392 Z" fill="#5b6475"/><text x="20" y="422" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The same bill as a table: one row per item</text><text x="20" y="439" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">bill_no, bill_date and paid_by repeat on every row</text><rect x="20" y="448" width="660" height="24" rx="4" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="28" y="464.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">bill_no</text><text x="104" y="464.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">bill_date</text><text x="210" y="464.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">item</text><text x="376" y="464.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">qty</text><text x="426" y="464.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">unit_price</text><text x="526" y="464.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">amount</text><text x="606" y="464.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">paid_by</text><rect x="20" y="472" width="660" height="24" rx="0" fill="#fdf3dc" stroke="#c9d3df" stroke-width="0.8" /><text x="28" y="488.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">4417</text><text x="104" y="488.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">2026-09-14</text><text 