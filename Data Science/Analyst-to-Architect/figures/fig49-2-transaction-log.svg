<svg xmlns="http://www.w3.org/2000/svg" width="760" height="552" viewBox="0 0 760 552" font-family="DejaVu Sans, Arial, sans-serif"><rect width="760" height="552" fill="#ffffff"/><text x="24" y="28" font-size="15" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The folder: ordinary Parquet</text><text x="300" y="28" font-size="15" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The log: what each version contains</text><rect x="300" y="44" width="436" height="92" rx="7" fill="#fbfcfe" stroke="#0f5c8c" stroke-width="1.5" /><rect x="300" y="44" width="6" height="92" rx="3" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="318" y="66" font-size="13.5" fill="#0f5c8c" font-weight="bold" text-anchor="start">version 0</text><text x="410" y="66" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">_delta_log/…00.json</text><text x="318" y="88" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">metaData: 8 columns</text><text x="318" y="107" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">add part-0000</text><text x="318" y="128" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">first write: the whole day</text><rect x="24" y="62" width="228" height="56" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="38" y="84" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">part-0000.parquet</text><text x="38" y="104" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">1.25 MB · 216,000 readings</text><path d="M296,90.0 L256,90.0" fill="none" stroke="#0f5c8c" stroke-width="1.5" stroke-linejoin="round"/><path d="M256,90.0 L264.1,86.1 L264.1,93.9 Z" fill="#0f5c8c"/><rect x="300" y="148" width="436" height="92" rx="7" fill="#fbfcfe" stroke="#c0662b" stroke-width="1.5" /><rect x="300" y="148" width="6" height="92" rx="3" fill="#c0662b" stroke="none" stroke-width="1" /><text x="318" y="170" font-size="13.5" fill="#c0662b" font-weight="bold" text-anchor="start">version 1</text><text x="410" y="170" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">_delta_log/…01.json</text><text x="318" y="192" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">remove part-0000</text><text x="318" y="211" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">add part-0001</text><text x="318" y="232" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">M-07 corrected, one atomic commit</text><rect x="24" y="166" width="228" height="56" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="38" y="188" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">part-0001.parquet</text><text x="38" y="208" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">1.25 MB · 216,000, M-07 corrected</text><path d="M296,194.0 L256,194.0" fill="none" stroke="#c0662b" stroke-width="1.5" stroke-linejoin="round"/><path d="M256,194.0 L264.1,190.1 L264.1,197.9 Z" fill="#c0662b"/><rect x="300" y="252" width="436" height="92" rx="7" fill="#fbfcfe" stroke="#7a4fa0" stroke-width="1.5" /><rect x="300" y="252" width="6" height="92" rx="3" fill="#7a4fa0" stroke="none" stroke-width="1" /><text x="318" y="274" font-size="13.5" fill="#7a4fa0" font-weight="bold" text-anchor="start">version 2</text><text x="410" y="274" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">_delta_log/…02.json</text><text x="318" y="296" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">remove part-0001</text><text x="318" y="315" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">add part-0000</text><text x="318" y="336" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">restore: back to version 0&#x27;s file</text><path d="M296,298.0 L256,104.0" fill="none" stroke="#7a4fa0" stroke-width="1.5" stroke-linejoin="round"/><path d="M256,104.0 L261.5,111.1 L253.8,112.7 Z" fill="#7a4fa0"/><rect x="300" y="356" width="436" height="92" rx="7" fill="#fbfcfe" stroke="#2f7d6d" stroke-width="1.5" /><rect x="300" y="356" width="6" height="92" rx="3" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="318" y="378" font-size="13.5" fill="#2f7d6d" font-weight="bold" text-anchor="start">version 3</text><text x="410" y="378" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">_delta_log/…03.json</text><text x="318" y="400" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">metaData: 9 columns</text><text x="318" y="419" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">add part-0002</text><text x="318" y="440" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">append with a new column, shift</text><rect x="24" y="374" width="228" height="56" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="38" y="396" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">part-0002.parquet</text><text x="38" y="416" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">0.11 MB · 8,640 readings of M-01</text><path d="M296,402.0 L256,402.0" fill="none" stroke="#2f7d6d" stroke-width="1.5" stroke-linejoin="round"/><path d="M256,402.0 L264.1,398.1 L264.1,405.9 Z" fill="#2f7d6d"/><text x="24" y="464" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Each arrow points at the file a version adds. File names are shortened.</text><rect x="24" y="476" width="712" height="62" rx="7" fill="#fff4d6" stroke="#e2c46b" stroke-width="1" /><text x="38" y="500" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">Readers follow the log, not the folder, so a commit becomes visible all at once.</text><text x="38" y="521" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">Time travel reads an older version&#x27;s list. Vacuum deletes files no kept version needs.</text></svg>