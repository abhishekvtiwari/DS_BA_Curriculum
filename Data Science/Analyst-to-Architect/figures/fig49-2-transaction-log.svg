<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="494" viewBox="0 0 1040 494" font-family="DejaVu Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1040" height="494" fill="#ffffff"/><text x="30" y="34" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The folder: ordinary Parquet files</text><rect x="30" y="56" width="260" height="42" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="44" y="82" font-size="11.5" font-family="DejaVu Sans Mono, monospace" fill="#1d2330">part-0000.parquet</text><text x="240" y="82" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">1.25 MB</text><rect x="30" y="108" width="260" height="42" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="44" y="134" font-size="11.5" font-family="DejaVu Sans Mono, monospace" fill="#1d2330">part-0001.parquet</text><text x="240" y="134" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">0.42 MB</text><rect x="30" y="160" width="260" height="42" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="44" y="186" font-size="11.5" font-family="DejaVu Sans Mono, monospace" fill="#1d2330">part-0002.parquet</text><text x="240" y="186" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">1.25 MB</text><rect x="30" y="212" width="260" height="42" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="44" y="238" font-size="11.5" font-family="DejaVu Sans Mono, monospace" fill="#1d2330">part-0003.parquet</text><text x="240" y="238" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">0.31 MB</text><text x="30" y="278" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">No file is special. Nothing here says</text><text x="30" y="296" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">which files make up the table today.</text><text x="370" y="34" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The log: which files each version contains</text><rect x="370" y="56" width="420" height="126" rx="7" fill="#fbfcfe" stroke="#0f5c8c" stroke-width="1.5" /><rect x="370" y="56" width="6" height="126" rx="3" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="388" y="80" font-size="13" fill="#0f5c8c" font-weight="bold" text-anchor="start">version 0</text><text x="388" y="100" font-size="11.5" font-family="DejaVu Sans Mono, monospace" fill="#1d2330">metaData: 8 columns</text><text x="388" y="120" font-size="11.5" font-family="DejaVu Sans Mono, monospace" fill="#1d2330">add part-0000</text><text x="388" y="140" font-size="11.5" font-family="DejaVu Sans Mono, monospace" fill="#1d2330">add part-0001</text><text x="388" y="172" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">first write</text><path d="M366,119.0 L296,119.0" fill="none" stroke="#0f5c8c" stroke-width="1.4" stroke-linejoin="round"/><path d="M296,119.0 L304.1,115.1 L304.1,122.9 Z" fill="#0f5c8c"/><rect x="370" y="198" width="420" height="106" rx="7" fill="#fbfcfe" stroke="#c0662b" stroke-width="1.5" /><rect x="370" y="198" width="6" height="106" rx="3" fill="#c0662b" stroke="none" stroke-width="1" /><text x="388" y="222" font-size="13" fill="#c0662b" font-weight="bold" text-anchor="start">version 1</text><text x="388" y="242" font-size="11.5" font-family="DejaVu Sans Mono, monospace" fill="#1d2330">remove part-0001</text><text x="388" y="262" font-size="11.5" font-family="DejaVu Sans Mono, monospace" fill="#1d2330">add part-0002</text><text x="388" y="294" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">M-07 corrected, one atomic commit</text><path d="M366,251.0 L296,251.0" fill="none" stroke="#c0662b" stroke-width="1.4" stroke-linejoin="round"/><path d="M296,251.0 L304.1,247.1 L304.1,254.9 Z" fill="#c0662b"/><rect x="370" y="320" width="420" height="86" rx="7" fill="#fbfcfe" stroke="#2f7d6d" stroke-width="1.5" /><rect x="370" y="320" width="6" height="86" rx="3" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="388" y="344" font-size="13" fill="#2f7d6d" font-weight="bold" text-anchor="start">version 2</text><text x="388" y="364" font-size="11.5" font-family="DejaVu Sans Mono, monospace" fill="#1d2330">add part-0003</text><text x="388" y="396" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">an append</text><path d="M366,363.0 L296,363.0" fill="none" stroke="#2f7d6d" stroke-width="1.4" stroke-linejoin="round"/><path d="M296,363.0 L304.1,359.1 L304.1,366.9 Z" fill="#2f7d6d"/><rect x="820" y="56" width="190" height="150" rx="7" fill="#fff4d6" stroke="#e2c46b" stroke-width="1" /><text x="834" y="82" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Readers follow the log,</text><text x="834" y="102" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">not the folder.</text><text x="834" y="122" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start"></text><text x="834" y="142" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">A commit becomes</text><text x="834" y="162" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">visible all at once:</text><text x="834" y="182" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">that is atomicity.</text><rect x="30" y="426" width="980" height="52" rx="7" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="46" y="456" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">Time travel is reading an older version&#x27;s file list. Vacuum deletes files no kept version needs.</text></svg>