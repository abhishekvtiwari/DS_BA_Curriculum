<svg xmlns="http://www.w3.org/2000/svg" width="680" height="264" viewBox="0 0 680 264" font-family="DejaVu Sans, Arial, sans-serif"><rect width="680" height="264" fill="#ffffff"/><text x="12" y="22" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Two domains, one name: without and with an agreed definition</text><text x="12" y="48" font-size="11.5" fill="#b23b3b" font-weight="bold" text-anchor="start">WITHOUT A CONTRACT</text><text x="346" y="48" font-size="11.5" fill="#2f7d6d" font-weight="bold" text-anchor="start">WITH A CONTRACT</text><rect x="12" y="58" width="156.0" height="76.4" rx="6" fill="#fff" stroke="#b23b3b" stroke-width="1.4" /><path d="M12,64 a6,6 0 0 1 6,-6 H162.0 a6,6 0 0 1 6,6 V79.6 H12 Z" fill="#b23b3b"/><text x="20" y="72.5" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start">Sales publishes</text><text x="20" y="97.1" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">active_customer = a</text><text x="20" y="110.69999999999999" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">non-cancelled order in the</text><text x="20" y="124.3" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">trailing 12 months</text><rect x="178.0" y="58" width="156.0" height="76.4" rx="6" fill="#fff" stroke="#b23b3b" stroke-width="1.4" /><path d="M178.0,64 a6,6 0 0 1 6,-6 H328.0 a6,6 0 0 1 6,6 V79.6 H178.0 Z" fill="#b23b3b"/><text x="186.0" y="72.5" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start">Finance publishes</text><text x="186.0" y="97.1" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">active_customer = has a</text><text x="186.0" y="110.69999999999999" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">non-zero balance</text><path d="M90.0,136.4 L149.0,154.4" fill="none" stroke="#b23b3b" stroke-width="1.5" stroke-linejoin="round"/><path d="M149.0,154.4 L142.1,155.5 L143.9,149.6 Z" fill="#b23b3b"/><path d="M256.0,136.4 L197.0,154.4" fill="none" stroke="#b23b3b" stroke-width="1.5" stroke-linejoin="round"/><path d="M197.0,154.4 L202.1,149.6 L203.9,155.5 Z" fill="#b23b3b"/><rect x="12" y="156.4" width="322" height="62.8" rx="6" fill="#fff" stroke="#b23b3b" stroke-width="1.4" /><path d="M12,162.4 a6,6 0 0 1 6,-6 H328 a6,6 0 0 1 6,6 V178.0 H12 Z" fill="#b23b3b"/><text x="20" y="170.9" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start">Result: two counts, one name</text><text x="20" y="195.5" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Each table is right by its own rule. Nobody notices until</text><text x="20" y="209.1" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">one report uses both and the numbers don&#x27;t match.</text><rect x="346" y="58" width="322" height="62.8" rx="6" fill="#fff" stroke="#0f5c8c" stroke-width="1.4" /><path d="M346,64 a6,6 0 0 1 6,-6 H662 a6,6 0 0 1 6,6 V79.6 H346 Z" fill="#0f5c8c"/><text x="354" y="72.5" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start">Semantic layer (owned by the data platform team)</text><text x="354" y="97.1" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">active_customer = a non-cancelled order in the trailing</text><text x="354" y="110.69999999999999" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">12 months. Written once, tested, read by everyone.</text><rect x="346" y="142.8" width="156.0" height="62.8" rx="6" fill="#fff" stroke="#2f7d6d" stroke-width="1.4" /><path d="M346,148.8 a6,6 0 0 1 6,-6 H496.0 a6,6 0 0 1 6,6 V164.4 H346 Z" fill="#2f7d6d"/><text x="354" y="157.3" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start">Sales reads it</text><text x="354" y="181.9" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">uses active_customer as</text><text x="354" y="195.5" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">defined</text><rect x="512.0" y="142.8" width="156.0" height="62.8" rx="6" fill="#fff" stroke="#2f7d6d" stroke-width="1.4" /><path d="M512.0,148.8 a6,6 0 0 1 6,-6 H662.0 a6,6 0 0 1 6,6 V164.4 H512.0 Z" fill="#2f7d6d"/><text x="520.0" y="157.3" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start">Finance names its own</text><text x="520.0" y="181.9" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">publishes</text><text x="520.0" y="195.5" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">customer_with_balance</text><path d="M424.0,122.8 L424.0,140.8" fill="none" stroke="#2f7d6d" stroke-width="1.5" stroke-linejoin="round"/><path d="M424.0,140.8 L421.0,134.5 L427.0,134.5 Z" fill="#2f7d6d"/><text x="12" y="239.7" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">A data contract (Chapter 47) states in writing what a dataset promises; the semantic layer (Chapter 32) is where the shared</text><text x="12" y="253.29999999999998" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">definitions live. A second meaning gets a second name.</text></svg>