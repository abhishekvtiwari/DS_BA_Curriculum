<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="380" viewBox="0 0 1040 380" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1040" height="380" fill="#ffffff"/><text x="30" y="32" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Four materializations, and what each one costs</text><rect x="30" y="70" width="980" height="58" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.8" /><text x="52" y="94" font-size="13" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">view</text><text x="52" y="114" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">CREATE VIEW: nothing is stored</text><text x="330" y="94" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">build: free</text><text x="330" y="114" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">query: the full query, every time</text><text x="700" y="104" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">staging models</text><rect x="30" y="138" width="980" height="58" rx="7" fill="#fff" stroke="#2f7d6d" stroke-width="1.8" /><text x="52" y="162" font-size="13" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">table</text><text x="52" y="182" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">CREATE TABLE AS: rebuilt each run</text><text x="330" y="162" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">build: full rebuild</text><text x="330" y="182" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">query: fast</text><text x="700" y="172" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">marts</text><rect x="30" y="206" width="980" height="58" rx="7" fill="#fff" stroke="#b7791f" stroke-width="1.8" /><text x="52" y="230" font-size="13" fill="#b7791f" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">incremental</text><text x="52" y="250" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">new rows only after the first build</text><text x="330" y="230" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">build: 0.90 s vs 13.91 s here</text><text x="330" y="250" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">query: fast</text><text x="700" y="240" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">large fact tables</text><rect x="30" y="274" width="980" height="58" rx="7" fill="#fff" stroke="#7a4fa0" stroke-width="1.8" /><text x="52" y="298" font-size="13" fill="#7a4fa0" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">ephemeral</text><text x="52" y="318" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">pasted into the models that ref it</text><text x="330" y="298" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">build: nothing exists</text><text x="330" y="318" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">query: recomputed each time</text><text x="700" y="308" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">small intermediate steps</text><text x="30" y="360" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Set the default per folder in dbt_project.yml; override it in a model with {{ config(materialized=&#x27;...&#x27;) }}.</text></svg>