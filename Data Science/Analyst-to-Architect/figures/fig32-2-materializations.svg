<svg xmlns="http://www.w3.org/2000/svg" width="800" height="358" viewBox="0 0 800 358" font-family="DejaVu Sans, Arial, sans-serif"><rect width="800" height="358" fill="#ffffff"/><text x="12" y="24" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Four materializations, and what each one costs</text><text x="24" y="52" font-size="12" fill="#5b6475" font-weight="bold" text-anchor="start">materialization</text><text x="160" y="52" font-size="12" fill="#5b6475" font-weight="bold" text-anchor="start">what dbt creates, and what it suits</text><text x="488" y="52" font-size="12" fill="#5b6475" font-weight="bold" text-anchor="start">cost to build, and to query</text><rect x="12" y="64" width="776" height="56" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.8" /><rect x="12" y="64" width="8" height="56" rx="3" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="30" y="97" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">view</text><text x="160" y="87" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">creates: a view; nothing is stored</text><text x="160" y="107" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">suits: staging models</text><text x="488" y="87" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">build: almost free</text><text x="488" y="107" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">query: the full query, every time</text><rect x="12" y="130" width="776" height="56" rx="7" fill="#fff" stroke="#2f7d6d" stroke-width="1.8" /><rect x="12" y="130" width="8" height="56" rx="3" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="30" y="163" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">table</text><text x="160" y="153" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">creates: a table, rebuilt each run</text><text x="160" y="173" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">suits: marts</text><text x="488" y="153" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">build: a full rebuild</text><text x="488" y="173" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">query: fast</text><rect x="12" y="196" width="776" height="56" rx="7" fill="#fff" stroke="#b7791f" stroke-width="1.8" /><rect x="12" y="196" width="8" height="56" rx="3" fill="#b7791f" stroke="none" stroke-width="1" /><text x="30" y="229" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">incremental</text><text x="160" y="219" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">creates: a table; later runs add new rows</text><text x="160" y="239" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">suits: large fact tables</text><text x="488" y="219" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">build: new rows only (0.55 s, not 2.19 s)</text><text x="488" y="239" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">query: fast</text><rect x="12" y="262" width="776" height="56" rx="7" fill="#fff" stroke="#7a4fa0" stroke-width="1.8" /><rect x="12" y="262" width="8" height="56" rx="3" fill="#7a4fa0" stroke="none" stroke-width="1" /><text x="30" y="295" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">ephemeral</text><text x="160" y="285" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">creates: nothing; its SQL is pasted in</text><text x="160" y="305" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">suits: small intermediate steps</text><text x="488" y="285" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">build: nothing stored</text><text x="488" y="305" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">query: runs inside each model that uses it</text><text x="12" y="344" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Set the default per folder in dbt_project.yml; override it in one model with {{ config(materialized=&#x27;...&#x27;) }}.</text></svg>