<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" font-family="DejaVu Sans, Arial, sans-serif"><rect width="720" height="300" fill="#ffffff"/><text x="20" y="26" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">One forward pass: a probability for every token</text><text x="20" y="46" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">“The crate was …”  (section 54.1; bars in order of probability)</text><text x="150" y="79" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="end" font-family="DejaVu Sans Mono, monospace">cracked</text><rect x="162" y="64" width="424.32" height="22" rx="4" fill="#2f7d6d" stroke="#2f7d6d" stroke-width="1" /><text x="594.3199999999999" y="79" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">0.442</text><text x="150" y="111" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="end" font-family="DejaVu Sans Mono, monospace">delivered</text><rect x="162" y="96" width="313.92" height="22" rx="4" fill="#2f7d6d" stroke="#2f7d6d" stroke-width="1" /><text x="483.92" y="111" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">0.327</text><text x="150" y="143" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="end" font-family="DejaVu Sans Mono, monospace">late</text><rect x="162" y="128" width="141.12" height="22" rx="4" fill="#0f5c8c" stroke="#0f5c8c" stroke-width="1" /><text x="311.12" y="143" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">0.147</text><text x="150" y="175" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="end" font-family="DejaVu Sans Mono, monospace">empty</text><rect x="162" y="160" width="70.08" height="22" rx="4" fill="#0f5c8c" stroke="#0f5c8c" stroke-width="1" /><text x="240.07999999999998" y="175" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">0.073</text><text x="150" y="207" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="end" font-family="DejaVu Sans Mono, monospace">blue</text><rect x="162" y="192" width="10.559999999999999" height="22" rx="4" fill="#c0662b" stroke="#c0662b" stroke-width="1" /><text x="180.56" y="207" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">0.011</text><text x="150" y="239" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="end" font-family="DejaVu Sans Mono, monospace">photosynthesis</text><rect x="162" y="224" width="3" height="22" rx="4" fill="#b23b3b" stroke="#b23b3b" stroke-width="1" /><text x="173" y="239" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">0.000</text><text x="20" y="270" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">The model ranks tokens by how plausible they are, not by whether they are true.</text><text x="20" y="288" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">When the plausible word and the true one differ, it confidently says the wrong one.</text></svg>