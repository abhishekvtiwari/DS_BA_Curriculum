<svg xmlns="http://www.w3.org/2000/svg" width="800" height="384" viewBox="0 0 800 384" font-family="DejaVu Sans, Arial, sans-serif"><rect width="800" height="384" fill="#ffffff"/><text x="20" y="30" font-size="16" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Keep the calculations pure: input and output at the edges</text><rect x="290" y="50" width="220" height="52" rx="7" fill="#fff" stroke="#1d2330" stroke-width="1.6" /><text x="400.0" y="71" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">cli.py</text><text x="400.0" y="90" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="middle">arguments, logging, exit code</text><text x="106.0" y="146" font-size="12" fill="#c0662b" font-weight="bold" text-anchor="middle">EDGE</text><rect x="16" y="154" width="180" height="52" rx="7" fill="#fff" stroke="#c0662b" stroke-width="1.6" /><text x="106.0" y="175" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">config.py</text><text x="106.0" y="194" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="middle">env vars → ReportConfig</text><path d="M400,102 V124 H106.0 V134" fill="none" stroke="#c9d3df" stroke-width="1.6" stroke-linejoin="round"/><text x="302.0" y="146" font-size="12" fill="#c0662b" font-weight="bold" text-anchor="middle">EDGE</text><rect x="212" y="154" width="180" height="52" rx="7" fill="#fff" stroke="#c0662b" stroke-width="1.6" /><text x="302.0" y="175" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">db.py</text><text x="302.0" y="194" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="middle">SQL → DataFrame</text><path d="M400,102 V124 H302.0 V134" fill="none" stroke="#c9d3df" stroke-width="1.6" stroke-linejoin="round"/><text x="498.0" y="146" font-size="12" fill="#2f7d6d" font-weight="bold" text-anchor="middle">CORE</text><rect x="408" y="154" width="180" height="52" rx="7" fill="#e2f3ee" stroke="#2f7d6d" stroke-width="1.6" /><text x="498.0" y="175" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">transform.py</text><text x="498.0" y="194" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="middle">DataFrame → results</text><path d="M400,102 V124 H498.0 V134" fill="none" stroke="#c9d3df" stroke-width="1.6" stroke-linejoin="round"/><text x="694.0" y="146" font-size="12" fill="#c0662b" font-weight="bold" text-anchor="middle">EDGE</text><rect x="604" y="154" width="180" height="52" rx="7" fill="#fff" stroke="#c0662b" stroke-width="1.6" /><text x="694.0" y="175" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">excel.py</text><text x="694.0" y="194" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="middle">results → .xlsx</text><path d="M400,102 V124 H694.0 V134" fill="none" stroke="#c9d3df" stroke-width="1.6" stroke-linejoin="round"/><rect x="212" y="262" width="180" height="48" rx="7" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1.6" /><text x="302.0" y="283" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="middle">PostgreSQL</text><text x="302.0" y="302" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="middle">riverstone_2025</text><rect x="604" y="262" width="180" height="48" rx="7" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1.6" /><text x="694.0" y="283" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">reports/</text><text x="694.0" y="302" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="middle">monthly .xlsx files</text><rect x="16" y="262" width="180" height="48" rx="7" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1.6" /><text x="106.0" y="283" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="middle">environment</text><text x="106.0" y="302" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="middle">RIVERSTONE_… variables</text><path d="M106.0,206 V262" fill="none" stroke="#c0662b" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5,4"/><path d="M302.0,206 V262" fill="none" stroke="#c0662b" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5,4"/><path d="M694.0,206 V262" fill="none" stroke="#c0662b" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5,4"/><rect x="408" y="250" width="180" height="68" rx="6" fill="#fff" stroke="#2f7d6d" stroke-width="1.2" /><text x="498.0" y="270" font-size="12" fill="#2f7d6d" font-weight="normal" text-anchor="middle">No database, no files:</text><text x="498.0" y="288" font-size="12" fill="#2f7d6d" font-weight="normal" text-anchor="middle">tested with a 5-row</text><text x="498.0" y="306" font-size="12" fill="#2f7d6d" font-weight="normal" text-anchor="middle">DataFrame in milliseconds</text><text x="20" y="348" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start">EDGE modules (orange) touch the outside world and get a few integration tests.</text><text x="20" y="368" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start">The CORE (green) holds the business rules and gets many fast unit tests.</text></svg>