<svg xmlns="http://www.w3.org/2000/svg" width="680" height="314" viewBox="0 0 680 314" font-family="DejaVu Sans, Arial, sans-serif"><rect width="680" height="314" fill="#ffffff"/><rect x="10" y="8" width="250" height="48" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1" /><text x="22" y="28" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start">A stakeholder asks you to change</text><text x="22" y="44" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start">a method, a filter, or a number</text><path d="M260,32 L300,32" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M300,32 L293.7,35.0 L293.7,29.0 Z" fill="#5b6475"/><rect x="300" y="8" width="370" height="48" rx="6" fill="#fff" stroke="#b7791f" stroke-width="1.6" /><text x="312" y="28" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">You ask: “Help me understand why — is something</text><text x="312" y="44" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">wrong with the calculation, or should the comparison change?”</text><text x="10" y="82" font-size="10.5" fill="#5b6475" font-weight="bold" text-anchor="start">THE REASON TURNS OUT TO BE…</text><text x="372" y="82" font-size="10.5" fill="#5b6475" font-weight="bold" text-anchor="start">SO YOU…</text><rect x="10" y="94" width="340" height="50" rx="6" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><rect x="10" y="94" width="26" height="50" rx="0" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="23" y="124" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">1</text><text x="46" y="115" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">A genuine error you missed</text><text x="46" y="131" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">(wrong filter, wrong period)</text><path d="M350,119 L372,119" fill="none" stroke="#2f7d6d" stroke-width="1.6" stroke-linejoin="round"/><path d="M372,119 L365.7,122.0 L365.7,116.0 Z" fill="#2f7d6d"/><rect x="372" y="94" width="298" height="50" rx="6" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="384" y="115" font-size="11" fill="#fff" font-weight="bold" text-anchor="start">Fix it and thank them;</text><text x="384" y="131" font-size="11" fill="#fff" font-weight="normal" text-anchor="start">re-check nearby numbers too</text><rect x="10" y="156" width="340" height="50" rx="6" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><rect x="10" y="156" width="26" height="50" rx="0" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="23" y="186" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">2</text><text x="46" y="177" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">A reasonable alternative definition,</text><text x="46" y="193" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">argued on its merits</text><path d="M350,181 L372,181" fill="none" stroke="#0f5c8c" stroke-width="1.6" stroke-linejoin="round"/><path d="M372,181 L365.7,184.0 L365.7,178.0 Z" fill="#0f5c8c"/><rect x="372" y="156" width="298" height="50" rx="6" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="384" y="177" font-size="11" fill="#fff" font-weight="bold" text-anchor="start">Show both versions, let them</text><text x="384" y="193" font-size="11" fill="#fff" font-weight="normal" text-anchor="start">choose, document which and why</text><rect x="10" y="218" width="340" height="50" rx="6" fill="#fff" stroke="#b23b3b" stroke-width="1.6" /><rect x="10" y="218" width="26" height="50" rx="0" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="23" y="248" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">3</text><text x="46" y="239" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">“It doesn&#x27;t look good”:</text><text x="46" y="255" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">no methodological reason</text><path d="M350,243 L372,243" fill="none" stroke="#b23b3b" stroke-width="1.6" stroke-linejoin="round"/><path d="M372,243 L365.7,246.0 L365.7,240.0 Z" fill="#b23b3b"/><rect x="372" y="218" width="298" height="50" rx="6" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="384" y="239" font-size="11" fill="#fff" font-weight="bold" text-anchor="start">Hold the number; offer to</text><text x="384" y="255" font-size="11" fill="#fff" font-weight="normal" text-anchor="start">explain the method in writing</text><text x="10" y="290" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">The test is always the same: would you be comfortable explaining this change, and the reason for it,</text><text x="10" y="305" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">to the person who first asked for the number?</text></svg>