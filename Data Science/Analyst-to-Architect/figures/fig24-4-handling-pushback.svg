<svg xmlns="http://www.w3.org/2000/svg" width="940" height="588" viewBox="0 0 940 588" font-family="DejaVu Sans, Arial, sans-serif"><rect width="940" height="588" fill="#ffffff"/><text x="30" y="30" font-size="14.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">&quot;Can you just change the number?&quot; — a decision flow</text><rect x="30" y="60" width="260" height="70" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1" /><text x="48" y="85" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="start">A stakeholder asks you to</text><text x="48" y="105" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="start">change a method, filter, or number</text><path d="M160,130 L160,158" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M160,158 L157.0,151.7 L163.0,151.7 Z" fill="#5b6475"/><rect x="60" y="160" width="200" height="60" rx="6" fill="#fff" stroke="#b7791f" stroke-width="1.6" /><text x="75" y="185" font-size="10.6" fill="#1d2330" font-weight="normal" text-anchor="start">Ask: what&#x27;s the reason</text><text x="75" y="203" font-size="10.6" fill="#1d2330" font-weight="normal" text-anchor="start">for the change?</text><path d="M60,190 L10,190" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M10,190 L16.3,187.0 L16.3,193.0 Z" fill="#5b6475"/><text x="-40" y="186" font-size="1" fill="#1d2330" font-weight="normal" text-anchor="start"></text><path d="M160,220 C160,310 260,340 300,340" fill="none" stroke="#2f7d6d" stroke-width="1.6" stroke-linejoin="round"/><rect x="300" y="316" width="270" height="52" rx="6" fill="#fff" stroke="#2f7d6d" stroke-width="1.4" /><text x="312" y="334" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">A genuine error you missed</text><text x="312" y="349" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">(wrong filter, wrong period)</text><path d="M570,340 L610,340" fill="none" stroke="#2f7d6d" stroke-width="1.6" stroke-linejoin="round"/><path d="M610,340 L603.7,343.0 L603.7,337.0 Z" fill="#2f7d6d"/><rect x="615" y="316" width="300" height="52" rx="6" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="628" y="334" font-size="10.2" fill="#fff" font-weight="bold" text-anchor="start">Fix it, thank them,</text><text x="628" y="349" font-size="10.2" fill="#fff" font-weight="None" text-anchor="start">re-check nearby numbers too</text><path d="M160,220 C160,410 260,440 300,440" fill="none" stroke="#0f5c8c" stroke-width="1.6" stroke-linejoin="round"/><rect x="300" y="416" width="270" height="52" rx="6" fill="#fff" stroke="#0f5c8c" stroke-width="1.4" /><text x="312" y="434" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">A reasonable alternative</text><text x="312" y="449" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">definition, argued on merits</text><path d="M570,440 L610,440" fill="none" stroke="#0f5c8c" stroke-width="1.6" stroke-linejoin="round"/><path d="M610,440 L603.7,443.0 L603.7,437.0 Z" fill="#0f5c8c"/><rect x="615" y="416" width="300" height="52" rx="6" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="628" y="434" font-size="10.2" fill="#fff" font-weight="bold" text-anchor="start">Show both versions,</text><text x="628" y="449" font-size="10.2" fill="#fff" font-weight="None" text-anchor="start">let them choose, document it</text><path d="M160,220 C160,510 260,540 300,540" fill="none" stroke="#b23b3b" stroke-width="1.6" stroke-linejoin="round"/><rect x="300" y="516" width="270" height="52" rx="6" fill="#fff" stroke="#b23b3b" stroke-width="1.4" /><text x="312" y="534" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">&quot;It doesn&#x27;t look good&quot; —</text><text x="312" y="549" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">no methodological reason</text><path d="M570,540 L610,540" fill="none" stroke="#b23b3b" stroke-width="1.6" stroke-linejoin="round"/><path d="M610,540 L603.7,543.0 L603.7,537.0 Z" fill="#b23b3b"/><rect x="615" y="516" width="300" height="52" rx="6" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="628" y="534" font-size="10.2" fill="#fff" font-weight="bold" text-anchor="start">Hold the number; offer</text><text x="628" y="549" font-size="10.2" fill="#fff" font-weight="None" text-anchor="start">to explain it, in writing</text><text x="30" y="570" font-size="11.3" fill="#5b6475" font-weight="normal" text-anchor="start">The test is always the same: would you be comfortable explaining this change, and the reason for it, to the person who first asked for the number?</text></svg>