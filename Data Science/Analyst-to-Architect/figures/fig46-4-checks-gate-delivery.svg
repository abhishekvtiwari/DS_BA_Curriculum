<svg xmlns="http://www.w3.org/2000/svg" width="760" height="366" viewBox="0 0 760 366" font-family="DejaVu Sans, Arial, sans-serif"><rect width="760" height="366" fill="#ffffff"/><rect x="19" y="100" width="130" height="56" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="16" y="96" width="130" height="56" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><rect x="16" y="96" width="7" height="56" rx="3" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="32" y="120" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Ingest</text><text x="32" y="139" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">4 raw assets</text><path d="M150,124 L170,124" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M170,124 L161.9,127.9 L161.9,120.1 Z" fill="#1d2330"/><rect x="177" y="100" width="160" height="56" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="174" y="96" width="160" height="56" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><rect x="174" y="96" width="7" height="56" rx="3" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="190" y="120" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Build Flash</text><text x="190" y="139" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">per-day overwrite</text><path d="M338,124 L358,124" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M358,124 L349.9,127.9 L349.9,120.1 Z" fill="#1d2330"/><rect x="362" y="86" width="190" height="76" rx="8" fill="#fff4d6" stroke="#e2c46b" stroke-width="1.6" /><text x="376" y="110" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">check: flash_matches_erp</text><text x="376" y="130" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">same query on ERP and</text><text x="376" y="147" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">warehouse; one row a day</text><path d="M556,100 L596,62" fill="none" stroke="#2f7d6d" stroke-width="2.2" stroke-linejoin="round"/><path d="M596,62 L592.8,70.4 L587.4,64.7 Z" fill="#2f7d6d"/><text x="566" y="66" font-size="12" fill="#2f7d6d" font-weight="bold" text-anchor="end">✓ passed</text><rect x="603" y="30" width="145" height="56" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="600" y="26" width="145" height="56" rx="8" fill="#fff" stroke="#7a4fa0" stroke-width="1.6" /><rect x="600" y="26" width="7" height="56" rx="3" fill="#7a4fa0" stroke="none" stroke-width="1" /><text x="616" y="50" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">deliver_flash</text><text x="616" y="69" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">outbox + log</text><path d="M556,148 L596,186" fill="none" stroke="#b23b3b" stroke-width="2.2" stroke-linejoin="round"/><path d="M596,186 L587.4,183.3 L592.8,177.6 Z" fill="#b23b3b"/><text x="566" y="192" font-size="12" fill="#b23b3b" font-weight="bold" text-anchor="end">✗ failed</text><rect x="600" y="168" width="145" height="44" rx="8" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="672" y="195" font-size="12.5" fill="#ffffff" font-weight="bold" text-anchor="middle">✗ Delivery blocked</text><rect x="350" y="232" width="395" height="118" rx="8" fill="#fbfcfe" stroke="#b23b3b" stroke-width="1.4" /><text x="364" y="256" font-size="13" fill="#b23b3b" font-weight="bold" text-anchor="start">Alert to the pipeline owner</text><text x="364" y="278" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">What: the Flash for 2026-01-05 was NOT sent</text><text x="364" y="296" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Why: ERP 1 order, ₹18,750 | warehouse 0, ₹0</text><text x="364" y="314" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Next: compare raw.order_items with the ERP, fix,</text><text x="364" y="332" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">then re-run the day. Runbook: daily_flash.md</text><rect x="16" y="232" width="318" height="118" rx="8" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="30" y="256" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">On 5 January the order-line load loaded</text><text x="30" y="275" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">nothing and raised no error. The Flash</text><text x="30" y="294" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">built a row of 0 orders. Only the check,</text><text x="30" y="313" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">comparing with the ERP, caught it: checks</text><text x="30" y="332" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">catch the failures that don&#x27;t crash.</text></svg>