<svg xmlns="http://www.w3.org/2000/svg" width="680" height="184" viewBox="0 0 680 184" font-family="DejaVu Sans, Arial, sans-serif"><rect width="680" height="184" fill="#ffffff"/><text x="12" y="24" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The C4 model: the same system at four levels of zoom</text><rect x="12" y="40" width="150" height="98" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><path d="M12,48 a8,8 0 0 1 8,-8 H154 a8,8 0 0 1 8,8 V64 H12 Z" fill="#0f5c8c"/><text x="87.0" y="56.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">Level 1: Context</text><text x="21" y="82" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">The system as one box,</text><text x="21" y="96" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">among the people and</text><text x="21" y="110" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">other systems around it</text><path d="M164,89.0 L175,89.0" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M175,89.0 L168.7,92.0 L168.7,86.0 Z" fill="#5b6475"/><rect x="176" y="40" width="150" height="98" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><path d="M176,48 a8,8 0 0 1 8,-8 H318 a8,8 0 0 1 8,8 V64 H176 Z" fill="#2f7d6d"/><text x="251.0" y="56.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">Level 2: Container</text><text x="185" y="82" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">The system opened up:</text><text x="185" y="96" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">its major deployable</text><text x="185" y="110" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">pieces (app, database,</text><text x="185" y="124" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">pipeline)</text><path d="M328,89.0 L339,89.0" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M339,89.0 L332.7,92.0 L332.7,86.0 Z" fill="#5b6475"/><rect x="340" y="40" width="150" height="98" rx="8" fill="#fff" stroke="#b7791f" stroke-width="1.6" /><path d="M340,48 a8,8 0 0 1 8,-8 H482 a8,8 0 0 1 8,8 V64 H340 Z" fill="#b7791f"/><text x="415.0" y="56.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">Level 3: Component</text><text x="349" y="82" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">One container opened</text><text x="349" y="96" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">up: the modules inside it</text><text x="349" y="110" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">and how they call each</text><text x="349" y="124" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">other</text><path d="M492,89.0 L503,89.0" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M503,89.0 L496.7,92.0 L496.7,86.0 Z" fill="#5b6475"/><rect x="504" y="40" width="150" height="98" rx="8" fill="#fff" stroke="#7a4fa0" stroke-width="1.6" /><path d="M504,48 a8,8 0 0 1 8,-8 H646 a8,8 0 0 1 8,8 V64 H504 Z" fill="#7a4fa0"/><text x="579.0" y="56.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">Level 4: Code</text><text x="513" y="82" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">One component&#x27;s actual</text><text x="513" y="96" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">classes or functions;</text><text x="513" y="110" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">rarely drawn by hand</text><text x="12" y="160" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">Zoom in one level at a time. A context diagram with component detail crammed in helps nobody, and a component</text><text x="12" y="174" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">diagram of the whole company is unreadable. Pick the level the conversation needs, and stop there.</text></svg>