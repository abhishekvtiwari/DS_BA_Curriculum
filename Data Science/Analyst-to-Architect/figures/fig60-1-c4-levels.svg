<svg xmlns="http://www.w3.org/2000/svg" width="970" height="278" viewBox="0 0 970 278" font-family="DejaVu Sans, Arial, sans-serif"><rect width="970" height="278" fill="#ffffff"/><text x="30" y="30" font-size="14.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The C4 model: the same system, four levels of zoom</text><rect x="33" y="64" width="210" height="150" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="30" y="60" width="210" height="150" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><path d="M30,68 a8,8 0 0 1 8,-8 H232 a8,8 0 0 1 8,8 V86 H30 Z" fill="#0f5c8c"/><text x="135.0" y="78" font-size="10.8" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Level 1: Context</text><text x="135.0" y="104" font-size="9.4" fill="#1d2330" font-weight="normal" text-anchor="middle">The system as one box,</text><text x="135.0" y="119" font-size="9.4" fill="#1d2330" font-weight="normal" text-anchor="middle">among the people and other</text><text x="135.0" y="134" font-size="9.4" fill="#1d2330" font-weight="normal" text-anchor="middle">systems around it</text><path d="M242,135 L258,135" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M258,135 L251.7,138.0 L251.7,132.0 Z" fill="#5b6475"/><rect x="268" y="64" width="210" height="150" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="265" y="60" width="210" height="150" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><path d="M265,68 a8,8 0 0 1 8,-8 H467 a8,8 0 0 1 8,8 V86 H265 Z" fill="#2f7d6d"/><text x="370.0" y="78" font-size="10.8" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Level 2: Container</text><text x="370.0" y="104" font-size="9.4" fill="#1d2330" font-weight="normal" text-anchor="middle">The system opened up:</text><text x="370.0" y="119" font-size="9.4" fill="#1d2330" font-weight="normal" text-anchor="middle">its major deployable pieces</text><text x="370.0" y="134" font-size="9.4" fill="#1d2330" font-weight="normal" text-anchor="middle">(app, database, pipeline)</text><path d="M477,135 L493,135" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M493,135 L486.7,138.0 L486.7,132.0 Z" fill="#5b6475"/><rect x="503" y="64" width="210" height="150" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="500" y="60" width="210" height="150" rx="8" fill="#fff" stroke="#b7791f" stroke-width="1.6" /><path d="M500,68 a8,8 0 0 1 8,-8 H702 a8,8 0 0 1 8,8 V86 H500 Z" fill="#b7791f"/><text x="605.0" y="78" font-size="10.8" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Level 3: Component</text><text x="605.0" y="104" font-size="9.4" fill="#1d2330" font-weight="normal" text-anchor="middle">One container opened up:</text><text x="605.0" y="119" font-size="9.4" fill="#1d2330" font-weight="normal" text-anchor="middle">the modules inside it and</text><text x="605.0" y="134" font-size="9.4" fill="#1d2330" font-weight="normal" text-anchor="middle">how they call each other</text><path d="M712,135 L728,135" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M728,135 L721.7,138.0 L721.7,132.0 Z" fill="#5b6475"/><rect x="738" y="64" width="210" height="150" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="735" y="60" width="210" height="150" rx="8" fill="#fff" stroke="#7a4fa0" stroke-width="1.6" /><path d="M735,68 a8,8 0 0 1 8,-8 H937 a8,8 0 0 1 8,8 V86 H735 Z" fill="#7a4fa0"/><text x="840.0" y="78" font-size="10.8" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Level 4: Code</text><text x="840.0" y="104" font-size="9.4" fill="#1d2330" font-weight="normal" text-anchor="middle">One component&#x27;s actual</text><text x="840.0" y="119" font-size="9.4" fill="#1d2330" font-weight="normal" text-anchor="middle">classes or functions —</text><text x="840.0" y="134" font-size="9.4" fill="#1d2330" font-weight="normal" text-anchor="middle">rarely drawn by hand</text><text x="30" y="240" font-size="11.3" fill="#5b6475" font-weight="normal" text-anchor="start">Zoom in one level at a time. A context diagram with component-level detail crammed in helps nobody; a component</text><text x="30" y="258" font-size="11.3" fill="#5b6475" font-weight="normal" text-anchor="start">diagram of the whole company is unreadable. Pick the zoom level the conversation needs, and stop there.</text></svg>