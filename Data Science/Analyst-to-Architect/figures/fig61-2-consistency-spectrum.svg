<svg xmlns="http://www.w3.org/2000/svg" width="990" height="330" viewBox="0 0 990 330" font-family="DejaVu Sans, Arial, sans-serif"><rect width="990" height="330" fill="#ffffff"/><text x="30" y="32" font-size="14.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The consistency spectrum, with real Riverstone systems on it</text><path d="M60,140 H960" fill="none" stroke="#c9d3df" stroke-width="2" stroke-linejoin="round"/><text x="60" y="120" font-size="11.5" fill="#0f5c8c" font-weight="bold" text-anchor="start">STRONG</text><text x="60" y="180" font-size="9.8" fill="#5b6475" font-weight="normal" text-anchor="start">every reader sees</text><text x="60" y="194" font-size="9.8" fill="#5b6475" font-weight="normal" text-anchor="start">the latest write, always</text><text x="910" y="120" font-size="11.5" fill="#b7791f" font-weight="bold" text-anchor="end">EVENTUAL</text><text x="910" y="182" font-size="9.8" fill="#5b6475" font-weight="normal" text-anchor="end">readers may see stale data;</text><text x="910" y="196" font-size="9.8" fill="#5b6475" font-weight="normal" text-anchor="end">it converges given time</text><circle cx="70" cy="140" r="7" fill="#0f5c8c"/><path d="M70,140 V190" fill="none" stroke="#0f5c8c" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="3 2"/><text x="70" y="220" font-size="10" fill="#1d2330" font-weight="bold" text-anchor="middle">Postgres, single</text><text x="70" y="235" font-size="10" fill="#1d2330" font-weight="None" text-anchor="middle">transaction</text><circle cx="270" cy="140" r="7" fill="#2f6690"/><path d="M270,140 V190" fill="none" stroke="#2f6690" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="3 2"/><text x="270" y="220" font-size="10" fill="#1d2330" font-weight="bold" text-anchor="middle">Delta Lake reads</text><text x="270" y="235" font-size="10" fill="#1d2330" font-weight="None" text-anchor="middle">(snapshot isolation)</text><circle cx="470" cy="140" r="7" fill="#2f7d6d"/><path d="M470,140 V190" fill="none" stroke="#2f7d6d" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="3 2"/><text x="470" y="220" font-size="10" fill="#1d2330" font-weight="bold" text-anchor="middle">Warehouse vs</text><text x="470" y="235" font-size="10" fill="#1d2330" font-weight="None" text-anchor="middle">ERP (Ch 45 sync lag)</text><circle cx="670" cy="140" r="7" fill="#b7791f"/><path d="M670,140 V190" fill="none" stroke="#b7791f" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="3 2"/><text x="670" y="220" font-size="10" fill="#1d2330" font-weight="bold" text-anchor="middle">CRM reverse-ETL</text><text x="670" y="235" font-size="10" fill="#1d2330" font-weight="None" text-anchor="middle">sync (Ch 51)</text><circle cx="880" cy="140" r="7" fill="#b23b3b"/><path d="M880,140 V190" fill="none" stroke="#b23b3b" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="3 2"/><text x="880" y="220" font-size="10" fill="#1d2330" font-weight="bold" text-anchor="middle">Support assistant&#x27;s</text><text x="880" y="235" font-size="10" fill="#1d2330" font-weight="None" text-anchor="middle">document index</text><text x="30" y="290" font-size="11.3" fill="#5b6475" font-weight="normal" text-anchor="start">Nothing here is a defect. Strong consistency costs latency and availability; eventual consistency is a deliberate trade</text><text x="30" y="308" font-size="11.3" fill="#5b6475" font-weight="normal" text-anchor="start">for scale and resilience. The judgment is choosing which one each system genuinely needs — not defaulting to either.</text></svg>