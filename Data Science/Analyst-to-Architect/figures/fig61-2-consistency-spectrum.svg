<svg xmlns="http://www.w3.org/2000/svg" width="740" height="286" viewBox="0 0 740 286" font-family="DejaVu Sans, Arial, sans-serif"><rect width="740" height="286" fill="#ffffff"/><text x="20" y="30" font-size="16" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The consistency spectrum, with Riverstone systems on it</text><text x="20" y="62" font-size="12.5" fill="#0f5c8c" font-weight="bold" text-anchor="start">STRONG</text><text x="20" y="79" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">every reader sees the</text><text x="20" y="94" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">latest write, always</text><text x="720" y="62" font-size="12.5" fill="#b7791f" font-weight="bold" text-anchor="end">EVENTUAL</text><text x="720" y="79" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="end">readers may see stale data;</text><text x="720" y="94" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="end">it converges, given time</text><path d="M40,122 H700" fill="none" stroke="#c9d3df" stroke-width="2.5" stroke-linejoin="round"/><path d="M700,116 L712,122 L700,128 Z" fill="#c9d3df"/><circle cx="78" cy="122" r="7" fill="#0f5c8c"/><path d="M78,130 V156" fill="none" stroke="#0f5c8c" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="3 2"/><text x="78" y="174" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="middle">An order in</text><text x="78" y="189" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="middle">the ERP database</text><text x="78" y="204" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="middle">(one copy)</text><circle cx="224" cy="122" r="7" fill="#2f6690"/><path d="M224,130 V156" fill="none" stroke="#2f6690" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="3 2"/><text x="224" y="174" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="middle">Delta Lake</text><text x="224" y="189" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="middle">reads (snapshot)</text><text x="224" y="204" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="middle">(Ch 49)</text><circle cx="370" cy="122" r="7" fill="#2f7d6d"/><path d="M370,130 V156" fill="none" stroke="#2f7d6d" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="3 2"/><text x="370" y="174" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="middle">Warehouse vs ERP</text><text x="370" y="189" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="middle">previous working</text><text x="370" y="204" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="middle">day (Ch 47)</text><circle cx="516" cy="122" r="7" fill="#b7791f"/><path d="M516,130 V156" fill="none" stroke="#b7791f" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="3 2"/><text x="516" y="174" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="middle">CRM reverse-</text><text x="516" y="189" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="middle">ETL sync</text><text x="516" y="204" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="middle">(Ch 51)</text><circle cx="662" cy="122" r="7" fill="#b23b3b"/><path d="M662,130 V156" fill="none" stroke="#b23b3b" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="3 2"/><text x="662" y="174" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="middle">Support assistant&#x27;s</text><text x="662" y="189" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="middle">document index</text><text x="662" y="204" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="middle">(Ch 55)</text><text x="20" y="238" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Nothing here is a defect. Strong consistency costs latency and availability; eventual</text><text x="20" y="255" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">consistency is a deliberate trade for scale and resilience. The judgment is choosing</text><text x="20" y="272" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">which one each system genuinely needs, not defaulting to either.</text></svg>