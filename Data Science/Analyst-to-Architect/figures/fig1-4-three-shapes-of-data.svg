<svg xmlns="http://www.w3.org/2000/svg" width="720" height="622" viewBox="0 0 720 622" font-family="DejaVu Sans, Arial, sans-serif"><rect width="720" height="622" fill="#ffffff"/><rect x="20" y="20" width="680" height="210" rx="8" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><path d="M20,28 a8,8 0 0 1 8,-8 H692 a8,8 0 0 1 8,8 V74 H20 Z" fill="#0f5c8c"/><text x="34" y="44" font-size="15" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">1  Structured</text><text x="34" y="64" font-size="11.5" fill="#fff" font-weight="normal" text-anchor="start">Rows and columns with a fixed layout</text><text x="36" y="112" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">order_items (order 5001)</text><rect x="36" y="120" width="282" height="24" rx="4" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="44" y="136.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">product_id</text><text x="132" y="136.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">qty</text><text x="186" y="136.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">price</text><text x="256" y="136.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">disc_%</text><rect x="36" y="144" width="282" height="24" rx="0" fill="#fff" stroke="#c9d3df" stroke-width="0.8" /><text x="44" y="160.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">101</text><text x="132" y="160.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">20</text><text x="186" y="160.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">450</text><text x="256" y="160.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">0</text><rect x="36" y="168" width="282" height="24" rx="0" fill="#fff" stroke="#c9d3df" stroke-width="0.8" /><text x="44" y="184.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">103</text><text x="132" y="184.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">50</text><text x="186" y="184.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">120</text><text x="256" y="184.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">5</text><text x="372" y="112" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">orders</text><rect x="372" y="120" width="298" height="24" rx="4" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="380" y="136.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">order_id</text><text x="464" y="136.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">customer_id</text><text x="568" y="136.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">order_date</text><rect x="372" y="144" width="298" height="24" rx="0" fill="#fff" stroke="#c9d3df" stroke-width="0.8" /><text x="380" y="160.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">5001</text><text x="464" y="160.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">1</text><text x="568" y="160.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">2026-01-05</text><text x="36" y="218" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Easy to count, sum, sort and join. Spreadsheets and databases work this way.</text><rect x="20" y="246" width="332.0" height="356" rx="8" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><path d="M20,254 a8,8 0 0 1 8,-8 H344.0 a8,8 0 0 1 8,8 V300 H20 Z" fill="#7a4fa0"/><text x="34" y="270" font-size="15" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">2  Semi-structured</text><text x="34" y="290" font-size="11.5" fill="#fff" font-weight="normal" text-anchor="start">Labels travel with the values</text><rect x="30" y="312" width="312.0" height="226" rx="5" fill="#f6f9fc" stroke="none" stroke-width="1" /><text x="38" y="334.0" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">{</text><text x="38" y="353.5" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">  &quot;order_id&quot;: 5001,</text><text x="38" y="373.0" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">  &quot;customer&quot;: &quot;Sharma Hardware&quot;,</text><text x="38" y="392.5" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">  &quot;order_date&quot;: &quot;2026-01-05&quot;,</text><text x="38" y="412.0" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">  &quot;items&quot;: [</text><text x="38" y="431.5" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">    {&quot;product_id&quot;: 101, &quot;qty&quot;: 20,</text><text x="38" y="451.0" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">     &quot;price&quot;: 450, &quot;disc_pct&quot;: 0},</text><text x="38" y="470.5" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">    {&quot;product_id&quot;: 103, &quot;qty&quot;: 50,</text><text x="38" y="490.0" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">     &quot;price&quot;: 120, &quot;disc_pct&quot;: 5}</text><text x="38" y="509.5" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">  ]</text><text x="38" y="529.0" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">}</text><text x="34" y="560" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">JSON from a website or app. Each value</text><text x="34" y="578" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">has a label; the layout can vary.</text><rect x="368.0" y="246" width="332.0" height="356" rx="8" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><path d="M368.0,254 a8,8 0 0 1 8,-8 H692.0 a8,8 0 0 1 8,8 V300 H368.0 Z" fill="#c0662b"/><text x="382.0" y="270" font-size="15" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">3  Unstructured</text><text x="382.0" y="290" font-size="11.5" fill="#fff" font-weight="normal" text-anchor="start">Meaning is in the words, not a layout</text><rect x="378.0" y="312" width="312.0" height="226" rx="5" fill="#fffdf6" stroke="#e5dcc3" stroke-width="1" /><text x="386.0" y="334.0" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">From: Rakesh (Sharma Hardware)</text><text x="386.0" y="353.5" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">To: Neha Kulkarni</text><text x="386.0" y="373.0" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Subject: Order</text><text x="386.0" y="392.5" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start"></text><text x="386.0" y="412.0" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Hi Neha,</text><text x="386.0" y="431.5" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Please send 20 of the 10L storage</text><text x="386.0" y="451.0" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">boxes and 50 water bottles, at the</text><text x="386.0" y="470.5" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">rates you quoted. 5% off the</text><text x="386.0" y="490.0" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">bottles as discussed?</text><text x="386.0" y="509.5" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start"></text><text x="386.0" y="529.0" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Thanks, Rakesh</text><text x="382.0" y="560" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">An email. A person (or an AI tool) must</text><text x="382.0" y="578" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">read it to pull out the facts.</text></svg>