<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="364" viewBox="0 0 1040 364" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1040" height="364" fill="#ffffff"/><text x="30" y="32" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Three prompts, 60 emails, one number: prompting is engineering</text><text x="210" y="102" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="end">naive</text><rect x="230" y="80" width="600" height="34" rx="5" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><rect x="230" y="80" width="120.0" height="34" rx="5" fill="#b23b3b" stroke="#b23b3b" stroke-width="1" /><text x="240" y="102" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">12 of 60 emails fully correct</text><text x="850" y="102" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">fields 156/240  ·  4 unparseable</text><text x="210" y="158" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="end">with instructions</text><rect x="230" y="136" width="600" height="34" rx="5" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><rect x="230" y="136" width="350.0" height="34" rx="5" fill="#c0662b" stroke="#c0662b" stroke-width="1" /><text x="240" y="158" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="start">35 of 60 emails fully correct</text><text x="850" y="158" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">fields 215/240</text><text x="210" y="214" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="end">plus one example</text><rect x="230" y="192" width="600" height="34" rx="5" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><rect x="230" y="192" width="470.0" height="34" rx="5" fill="#2f7d6d" stroke="#2f7d6d" stroke-width="1" /><text x="240" y="214" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="start">47 of 60 emails fully correct</text><text x="850" y="214" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">fields 227/240</text><rect x="230" y="258" width="600" height="60" rx="6" fill="#fdf3dc" stroke="#b7791f" stroke-width="1" /><text x="250" y="282" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">Validation lets 59 of 60 through. Only 47 are actually right.</text><text x="250" y="302" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">The gap is a dozen well-formed, plausible, wrong orders.</text><text x="30" y="344" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Same model, same emails, same evaluation set. Only the wording changed — and the wording is code, so it belongs in Git.</text></svg>