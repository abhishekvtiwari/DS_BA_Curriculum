<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="325" viewBox="0 0 1060 325" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1060" height="325" fill="#ffffff"/><text x="30" y="30" font-size="14.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">A reference architecture for automation, one layer at a time</text><rect x="33" y="68" width="155" height="150" rx="7" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="30" y="64" width="155" height="150" rx="7" fill="#fff" stroke="#5b6475" stroke-width="1.6" /><path d="M30,72 a7,7 0 0 1 7,-7 H178 a7,7 0 0 1 7,7 V88 H30 Z" fill="#5b6475"/><text x="107.5" y="80.5" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">SOURCES</text><text x="107.5" y="104" font-size="8.4" fill="#1d2330" font-weight="normal" text-anchor="middle">ERP, CRM, sensors,</text><text x="107.5" y="118" font-size="8.4" fill="#1d2330" font-weight="normal" text-anchor="middle">email, spreadsheets</text><path d="M187,139 L195,139" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M195,139 L188.7,142.0 L188.7,136.0 Z" fill="#5b6475"/><rect x="200" y="68" width="155" height="150" rx="7" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="197" y="64" width="155" height="150" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><path d="M197,72 a7,7 0 0 1 7,-7 H345 a7,7 0 0 1 7,7 V88 H197 Z" fill="#0f5c8c"/><text x="274.5" y="80.5" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">INGESTION</text><text x="274.5" y="104" font-size="8.4" fill="#1d2330" font-weight="normal" text-anchor="middle">Dagster (Ch 46)</text><text x="274.5" y="118" font-size="8.4" fill="#1d2330" font-weight="normal" text-anchor="middle">scheduled + event-driven</text><path d="M354,139 L362,139" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M362,139 L355.7,142.0 L355.7,136.0 Z" fill="#5b6475"/><rect x="367" y="68" width="155" height="150" rx="7" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="364" y="64" width="155" height="150" rx="7" fill="#fff" stroke="#2f6690" stroke-width="1.6" /><path d="M364,72 a7,7 0 0 1 7,-7 H512 a7,7 0 0 1 7,7 V88 H364 Z" fill="#2f6690"/><text x="441.5" y="80.5" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">WAREHOUSE</text><text x="441.5" y="104" font-size="8.4" fill="#1d2330" font-weight="normal" text-anchor="middle">Postgres + Delta</text><text x="441.5" y="118" font-size="8.4" fill="#1d2330" font-weight="normal" text-anchor="middle">(Ch 45, 49)</text><path d="M521,139 L529,139" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M529,139 L522.7,142.0 L522.7,136.0 Z" fill="#5b6475"/><rect x="534" y="68" width="155" height="150" rx="7" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="531" y="64" width="155" height="150" rx="7" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><path d="M531,72 a7,7 0 0 1 7,-7 H679 a7,7 0 0 1 7,7 V88 H531 Z" fill="#2f7d6d"/><text x="608.5" y="80.5" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">SEMANTIC LAYER</text><text x="608.5" y="104" font-size="8.4" fill="#1d2330" font-weight="normal" text-anchor="middle">One definition per</text><text x="608.5" y="118" font-size="8.4" fill="#1d2330" font-weight="normal" text-anchor="middle">metric (Ch 23)</text><path d="M688,139 L696,139" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M696,139 L689.7,142.0 L689.7,136.0 Z" fill="#5b6475"/><rect x="701" y="68" width="155" height="150" rx="7" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="698" y="64" width="155" height="150" rx="7" fill="#fff" stroke="#b7791f" stroke-width="1.6" /><path d="M698,72 a7,7 0 0 1 7,-7 H846 a7,7 0 0 1 7,7 V88 H698 Z" fill="#b7791f"/><text x="775.5" y="80.5" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">DELIVERY &amp;
