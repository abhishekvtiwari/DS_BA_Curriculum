roke-width="1.6" /><text x="650" y="195" font-size="12" fill="#0f5c8c" font-weight="bold" text-anchor="middle">loaded: 53</text><text x="650" y="212" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="middle">88% of emails</text><rect x="20" y="240" width="680" height="50" rx="7" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="34" y="260" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">The write is the part that is different: two UNIQUE keys, one transaction for an order&#x27;s</text><text x="34" y="278" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start">header and lines, and an audit row naming the run. Replaying the morning wrote nothing twice.</text></svg>