<svg xmlns="http://www.w3.org/2000/svg" width="870" height="526" viewBox="0 0 870 526" font-family="DejaVu Sans, Arial, sans-serif"><rect width="870" height="526" fill="#ffffff"/><text x="30" y="36" font-size="15" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">One row of a gap analysis, from Riverstone&#x27;s invoicing step</text><text x="30" y="58" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">A row is not finished until it produces a numbered requirement.</text><rect x="32" y="89" width="330" height="150" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="30" y="86" width="330" height="150" rx="8" fill="#fdecec" stroke="#b23b3b" stroke-width="1.6" /><path d="M30,94 a8,8 0 0 1 8,-8 H352 a8,8 0 0 1 8,8 V120 H30 Z" fill="#b23b3b"/><text x="42" y="109" font-size="13.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">AS-IS</text><text x="42" y="144" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Finance raises the invoice after the</text><text x="42" y="161" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">warehouse emails a shipment notification,</text><text x="42" y="178" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">typically one to two days after the goods</text><text x="42" y="195" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">leave Bhiwandi Main.</text><rect x="512" y="89" width="330" height="150" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="510" y="86" width="330" height="150" rx="8" fill="#e2f3ee" stroke="#2f7d6d" stroke-width="1.6" /><path d="M510,94 a8,8 0 0 1 8,-8 H832 a8,8 0 0 1 8,8 V120 H510 Z" fill="#2f7d6d"/><text x="522" y="109" font-size="13.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">TO-BE</text><text x="522" y="144" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">The invoice is raised automatically when the</text><text x="522" y="161" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">warehouse marks the order Shipped in the</text><text x="522" y="178" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">ERP.</text><rect x="374" y="116" width="122" height="90" rx="8" fill="#fff" stroke="#c0662b" stroke-width="1.6" /><text x="435.0" y="140" font-size="12" fill="#c0662b" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">THE GAP</text><text x="384" y="162" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">no link between</text><text x="384" y="177" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">shipment status</text><text x="384" y="192" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">and invoicing</text><path d="M362,161.0 H368" fill="none" stroke="#c0662b" stroke-width="2" stroke-linejoin="round"/><path d="M368,156.0 L375,161.0 L368,166.0 Z" fill="#c0662b"/><path d="M498,161.0 H504" fill="none" stroke="#c0662b" stroke-width="2" stroke-linejoin="round"/><path d="M504,156.0 L511,161.0 L504,166.0 Z" fill="#c0662b"/><rect x="32" y="267" width="810" height="68" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="30" y="264" width="810" height="68" rx="8" fill="#fff" stroke="#c0662b" stroke-width="1.5" /><rect x="30" y="264" width="150" height="68" rx="8" fill="#c0662b" stroke="none" stroke-width="1" /><rect x="170" y="264" width="10" height="68" rx="0" fill="#c0662b" stroke="none" stroke-width="1" /><text x="44" y="303" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">ROOT CAUSE</text><text x="194" y="290" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Not &quot;finance is slow&quot;. The warehouse updates the ERP once a day from its own</text><text x="194" y="307" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">spreadsheet, so the status change is not reliable enough to trigger</text><text x="194" y="324" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">anything.</text><path d="M435.0,334 V344" fill="none" stroke="#5b6475" stroke-width="2" stroke-linejoin="round"/><path d="M430.0,342 L435.0,348 L440.0,342 Z" fill="#5b6475"/><rect x="32" y="349" width="810" height="68" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="30" y="346" width="810" height="68" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.5" /><rect x="30" y="346" width="150" height="68" rx="8" fill="#0f5c8c" stroke="none" stroke-width="1" /><rect x="170" y="346" width="10" height="68" rx="0" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="44" y="385" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">REQUIREMENT</text><text x="194" y="372" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">FR-11: when an order&#x27;s status changes to Shipped, the system shall generate</text><text x="194" y="389" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">the invoice for that order within one hour.</text><path d="M435.0,416 V426" fill="none" stroke="#5b6475" stroke-width="2" stroke-linejoin="round"/><path d="M430.0,424 L435.0,430 L440.0,424 Z" fill="#5b6475"/><rect x="32" y="431" width="810" height="68" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="30" y="428" width="810" height="68" rx="8" fill="#fff" stroke="#1f6fa3" stroke-width="1.5" /><rect x="30" y="428" width="150" height="68" rx="8" fill="#1f6fa3" stroke="none" stroke-width="1" /><rect x="170" y="428" width="10" height="68" rx="0" fill="#1f6fa3" stroke="none" stroke-width="1" /><text x="44" y="467" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">DEPENDS ON</text><text x="194" y="454" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">NFR-04: order status in the ERP shall be updated within fifteen minutes of</text><text x="194" y="471" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">dispatch.</text></svg>