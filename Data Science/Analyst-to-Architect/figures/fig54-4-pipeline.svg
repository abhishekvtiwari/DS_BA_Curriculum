<svg xmlns="http://www.w3.org/2000/svg" width="720" height="298" viewBox="0 0 720 298" font-family="DejaVu Sans, Arial, sans-serif"><rect width="720" height="298" fill="#ffffff"/><text x="20" y="26" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The pipeline: the model proposes, the rules dispose</text><rect x="20" y="50" width="112" height="70" rx="7" fill="#fff" stroke="#5b6475" stroke-width="1.8" /><text x="76" y="72" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="middle">email arrives</text><text x="76" y="92" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">20–40 a day,</text><text x="76" y="107" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">five shapes</text><rect x="150" y="50" width="112" height="70" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.8" /><text x="206" y="72" font-size="12" fill="#0f5c8c" font-weight="bold" text-anchor="middle">prompt</text><text x="206" y="92" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">instructions,</text><text x="206" y="107" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">then the email</text><rect x="280" y="50" width="112" height="70" rx="7" fill="#fff" stroke="#7a4fa0" stroke-width="1.8" /><text x="336" y="72" font-size="12" fill="#7a4fa0" font-weight="bold" text-anchor="middle">parse</text><text x="336" y="92" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">JSON object,</text><text x="336" y="107" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">or None</text><rect x="410" y="50" width="112" height="70" rx="7" fill="#fff" stroke="#2f7d6d" stroke-width="1.8" /><text x="466" y="72" font-size="12" fill="#2f7d6d" font-weight="bold" text-anchor="middle">validate</text><text x="466" y="92" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">codes, dates,</text><text x="466" y="107" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">quantities</text><path d="M133,85 H167" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M161,80 L169,85 L161,90" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M263,85 H297" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M291,80 L299,85 L291,90" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M393,85 H427" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M421,80 L429,85 L421,90" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M522,85 H556" fill="none" stroke="#2f7d6d" stroke-width="2" stroke-linejoin="round"/><path d="M550,80 L558,85 L550,90" fill="none" stroke="#2f7d6d" stroke-width="2" stroke-linejoin="round"/><rect x="558" y="50" width="142" height="70" rx="7" fill="#e2f3ee" stroke="#2f7d6d" stroke-width="1.8" /><text x="629" y="72" font-size="12" fill="#2f7d6d" font-weight="bold" text-anchor="middle">load to ERP</text><text x="629" y="92" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="middle">59 of 60 loaded</text><text x="629" y="107" font-size="11" fill="#b23b3b" font-weight="bold" text-anchor="middle">47 right, 12 wrong</text><path d="M466,120 V160 H206 V128" fill="none" stroke="#c0662b" stroke-width="2" stroke-linejoin="round" stroke-dasharray="5,4"/><path d="M200,134 L206,124 L212,134" fill="none" stroke="#c0662b" stroke-width="2" stroke-linejoin="round"/><rect x="286" y="146" width="280" height="30" rx="6" fill="#fdf3dc" stroke="#c0662b" stroke-width="1.4" /><text x="426" y="166" font-size="11" fill="#c0662b" font-weight="bold" text-anchor="middle">retry once, quoting the exact problems</text><path d="M466,176 V200" fill="none" stroke="#b23b3b" stroke-width="2" stroke-linejoin="round"/><path d="M460,194 L466,202 L472,194" fill="none" stroke="#b23b3b" stroke-width="2" stroke-linejoin="round"/><rect x="330" y="202" width="272" height="40" rx="6" fill="#fbeaea" stroke="#b23b3b" stroke-width="1.4" /><text x="466" y="219" font-size="11.5" fill="#b23b3b" font-weight="bold" text-anchor="middle">still failing: a person, with the reason</text><text x="466" y="235" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="middle">1 of 60 here (“no items”)</text><text x="20" y="268" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">Validation catches malformed answers; only a check against the truth finds the 12 that</text><text x="20" y="286" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">are well-formed, plausible and wrong. Sample loaded orders by hand every week.</text></svg>