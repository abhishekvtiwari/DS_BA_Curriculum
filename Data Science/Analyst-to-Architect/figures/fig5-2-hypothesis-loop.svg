<svg xmlns="http://www.w3.org/2000/svg" width="720" height="488.0" viewBox="0 0 720 488.0" font-family="DejaVu Sans, Arial, sans-serif"><rect width="720" height="488.0" fill="#ffffff"/><path d="M443.16064454289034,85.0 L462.1687918669796,93.0" fill="none" stroke="#5b6475" stroke-width="2" stroke-linejoin="round"/><path d="M462.1687918669796,93.0 L453.2,93.0 L455.9,86.6 Z" fill="#5b6475"/><path d="M545.3294364098699,163.0 L545.3294364098699,249.0" fill="none" stroke="#5b6475" stroke-width="2" stroke-linejoin="round"/><path d="M545.3294364098699,249.0 L541.8,240.7 L548.8,240.7 Z" fill="#5b6475"/><path d="M462.1687918669796,319.0 L443.16064454289034,327.0" fill="none" stroke="#5b6475" stroke-width="2" stroke-linejoin="round"/><path d="M443.16064454289034,327.0 L449.4,320.6 L452.2,327.0 Z" fill="#5b6475"/><path d="M276.8393554571096,327.0 L257.83120813302054,319.00000000000006" fill="none" stroke="#5b6475" stroke-width="2" stroke-linejoin="round"/><path d="M257.83120813302054,319.00000000000006 L266.8,319.0 L264.1,325.4 Z" fill="#5b6475"/><path d="M174.67056359013017,249.00000000000006 L174.67056359013014,163.0" fill="none" stroke="#5b6475" stroke-width="2" stroke-linejoin="round"/><path d="M174.67056359013014,163.0 L178.2,171.3 L171.2,171.3 Z" fill="#5b6475"/><path d="M257.8312081330205,92.99999999999999 L276.83935545710966,85.0" fill="none" stroke="#5b6475" stroke-width="2" stroke-linejoin="round"/><path d="M276.83935545710966,85.0 L270.6,91.4 L267.8,85.0 Z" fill="#5b6475"/><rect x="254.0" y="21.0" width="212" height="58" rx="10" fill="#fff" stroke="#0f5c8c" stroke-width="1.8" /><text x="360.0" y="45.0" font-size="14.5" fill="#0f5c8c" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">1 Question</text><text x="360.0" y="66.0" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="middle">precise, tied to a decision</text><rect x="439.3294364098699" y="99.0" width="212" height="58" rx="10" fill="#fff" stroke="#7a4fa0" stroke-width="1.8" /><text x="545.3294364098699" y="123.0" font-size="14.5" fill="#7a4fa0" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">2 Hypotheses</text><text x="545.3294364098699" y="144.0" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="middle">possible answers, written down</text><rect x="439.3294364098699" y="255.0" width="212" height="58" rx="10" fill="#fff" stroke="#c0662b" stroke-width="1.8" /><text x="545.3294364098699" y="279.0" font-size="14.5" fill="#c0662b" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">3 Data needed</text><text x="545.3294364098699" y="300.0" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="middle">what would prove each wrong</text><rect x="254.0" y="333.0" width="212" height="58" rx="10" fill="#fff" stroke="#2f7d6d" stroke-width="1.8" /><text x="360.0" y="357.0" font-size="14.5" fill="#2f7d6d" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">4 Test</text><text x="360.0" y="378.0" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="middle">query, count, compare</text><rect x="68.67056359013017" y="255.00000000000006" width="212" height="58" rx="10" fill="#fff" stroke="#b23b3b" stroke-width="1.8" /><text x="174.67056359013017" y="279.00000000000006" font-size="14.5" fill="#b23b3b" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">5 Conclude</text><text x="174.67056359013017" y="300.00000000000006" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="middle">keep, reject, or refine</text><rect x="68.67056359013014" y="98.99999999999999" width="212" height="58" rx="10" fill="#fff" stroke="#5b6475" stroke-width="1.8" /><text x="174.67056359013014" y="122.99999999999999" font-size="14.5" fill="#5b6475" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">6 Act or ask</text><text x="174.67056359013014" y="144.0" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="middle">decide, or a sharper question</text><text x="360" y="202" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="middle">Most loops end</text><text x="360" y="222" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="middle">with a better question</text><text x="16" y="425.0" font-size="13" fill="#1d2330"><tspan font-weight="bold">Write hypotheses before you look at the data,</tspan><tspan fill="#5b6475"> so the data can prove you wrong.</tspan></text><text x="16" y="446.0" font-size="13" fill="#1d2330"><tspan font-weight="bold">A rejected hypothesis is progress:</tspan><tspan fill="#5b6475"> it removes a branch of the issue tree.</tspan></text><text x="16" y="467.0" font-size="13" fill="#1d2330"><tspan font-weight="bold">Stop when the answer is good enough for the decision,</tspan><tspan fill="#5b6475"> not when it's perfect.</tspan></text></svg>