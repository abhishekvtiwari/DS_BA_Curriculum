<svg xmlns="http://www.w3.org/2000/svg" width="640" height="232" viewBox="0 0 640 232" font-family="DejaVu Sans, Arial, sans-serif"><rect width="640" height="232" fill="#ffffff"/><text x="12" y="22" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Three ways to run Python, and what each is for</text><rect x="14" y="39" width="196" height="150" rx="7" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="12" y="36" width="196" height="150" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.4" /><path d="M12,43 a7,7 0 0 1 7,-7 H201 a7,7 0 0 1 7,7 V60 H12 Z" fill="#0f5c8c"/><text x="21" y="52.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">1. The REPL</text><text x="21" y="78.0" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">Type python, get &gt;&gt;&gt;</text><text x="21" y="93.5" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">Each line runs when you press Enter</text><text x="21" y="109.0" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">Shows each expression&#x27;s value</text><text x="21" y="124.5" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">Nothing is saved</text><text x="21" y="140.0" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start"></text><text x="21" y="155.5" font-size="10" fill="#1d2330" font-weight="bold" text-anchor="start">Use for: trying one thing,</text><text x="21" y="171.0" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">checking what a function does</text><rect x="224" y="39" width="196" height="150" rx="7" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="222" y="36" width="196" height="150" rx="7" fill="#fff" stroke="#2f7d6d" stroke-width="1.4" /><path d="M222,43 a7,7 0 0 1 7,-7 H411 a7,7 0 0 1 7,7 V60 H222 Z" fill="#2f7d6d"/><text x="231" y="52.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">2. A notebook (Jupyter)</text><text x="231" y="78.0" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">Cells of code, output underneath</text><text x="231" y="93.5" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">Notes and charts in between</text><text x="231" y="109.0" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">Values stay between cells</text><text x="231" y="124.5" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">Cells can run out of order</text><text x="231" y="140.0" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start"></text><text x="231" y="155.5" font-size="10" fill="#1d2330" font-weight="bold" text-anchor="start">Use for: exploring data,</text><text x="231" y="171.0" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">showing your working</text><rect x="434" y="39" width="196" height="150" rx="7" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="432" y="36" width="196" height="150" rx="7" fill="#fff" stroke="#7a4fa0" stroke-width="1.4" /><path d="M432,43 a7,7 0 0 1 7,-7 H621 a7,7 0 0 1 7,7 V60 H432 Z" fill="#7a4fa0"/><text x="441" y="52.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">3. A script (.py file)</text><text x="441" y="78.0" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">Runs top to bottom, every time</text><text x="441" y="93.5" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">Only print() shows anything</text><text x="441" y="109.0" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">Takes arguments, gives an exit code</text><text x="441" y="124.5" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">Can be scheduled and versioned</text><text x="441" y="140.0" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start"></text><text x="441" y="155.5" font-size="10" fill="#1d2330" font-weight="bold" text-anchor="start">Use for: anything repeated,</text><text x="441" y="171.0" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="start">shared, or run at 6 a.m.</text><path d="M320.0,189 V206" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M320.0,206 L530.0,206" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M530.0,206 L522.8,209.5 L522.8,202.5 Z" fill="#5b6475"/><path d="M530.0,206 V197" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M530.0,206 L530.0,191" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M530.0,191 L533.5,198.2 L526.5,198.2 Z" fill="#5b6475"/><text x="425.0" y="222" font-size="10" fill="#1d2330" font-weight="normal" text-anchor="middle">when it works, move it into a script (section 17.12)</text></svg>