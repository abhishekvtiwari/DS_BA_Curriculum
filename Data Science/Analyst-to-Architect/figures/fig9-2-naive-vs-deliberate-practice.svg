<svg xmlns="http://www.w3.org/2000/svg" width="800" height="428" viewBox="0 0 800 428" font-family="DejaVu Sans, Arial, sans-serif"><rect width="800" height="428" fill="#ffffff"/><rect x="20" y="16" width="760" height="38" rx="6" fill="#1d2330" stroke="none" stroke-width="1" /><text x="142" y="41" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Naive practice</text><text x="412" y="41" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Deliberate practice</text><rect x="20" y="54" width="760" height="54" rx="0" fill="#f6f9fc" stroke="none" stroke-width="1" /><text x="32" y="86" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">Goal</text><rect x="136" y="64" width="5" height="34" rx="2" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="150" y="86" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">“Do some SQL tonight”</text><rect x="406" y="64" width="5" height="34" rx="2" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="420" y="78" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">“Build a monthly total of your spending log</text><text x="420" y="95" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">and check it against the sum of every row”</text><rect x="20" y="108" width="760" height="54" rx="0" fill="#fff" stroke="none" stroke-width="1" /><text x="32" y="140" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">Difficulty</text><rect x="136" y="118" width="5" height="34" rx="2" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="150" y="140" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">What already feels comfortable</text><rect x="406" y="118" width="5" height="34" rx="2" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="420" y="140" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Slightly beyond what you can do unaided</text><rect x="20" y="162" width="760" height="54" rx="0" fill="#f6f9fc" stroke="none" stroke-width="1" /><text x="32" y="194" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">Attention</text><rect x="136" y="172" width="5" height="34" rx="2" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="150" y="186" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Half-watching a video,</text><text x="150" y="203" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">phone nearby</text><rect x="406" y="172" width="5" height="34" rx="2" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="420" y="194" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Full focus for a short, fixed block</text><rect x="20" y="216" width="760" height="54" rx="0" fill="#fff" stroke="none" stroke-width="1" /><text x="32" y="248" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">Feedback</text><rect x="136" y="226" width="5" height="34" rx="2" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="150" y="248" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">None, or “it ran, so it’s right”</text><rect x="406" y="226" width="5" height="34" rx="2" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="420" y="248" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Compare with a known answer; find why it differs</text><rect x="20" y="270" width="760" height="54" rx="0" fill="#f6f9fc" stroke="none" stroke-width="1" /><text x="32" y="302" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">Repetition</text><rect x="136" y="280" width="5" height="34" rx="2" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="150" y="302" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Move on after one success</text><rect x="406" y="280" width="5" height="34" rx="2" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="420" y="302" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Redo it tomorrow without looking; vary it</text><rect x="20" y="324" width="760" height="54" rx="0" fill="#fff" stroke="none" stroke-width="1" /><text x="32" y="356" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">Record</text><rect x="136" y="334" width="5" height="34" rx="2" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="150" y="356" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Nothing written down</text><rect x="406" y="334" width="5" height="34" rx="2" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="420" y="356" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">A log: what was hard, what to try next</text><path d="M20,378 H780" fill="none" stroke="#c9d3df" stroke-width="1" stroke-linejoin="round"/><text x="20" y="402" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Same hours, different results: deliberate practice spends them where you’re weakest,</text><text x="20" y="419" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">and checks every attempt.</text></svg>