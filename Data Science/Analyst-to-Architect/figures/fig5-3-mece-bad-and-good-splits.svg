<svg xmlns="http://www.w3.org/2000/svg" width="1070" height="370" viewBox="0 0 1070 370" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1070" height="370" fill="#ffffff"/><text x="30" y="30" font-size="15" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Not MECE</text><rect x="180" y="48" width="190" height="40" rx="8" fill="#1d2330" stroke="none" stroke-width="1" /><text x="275" y="73" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="middle">Riverstone&#x27;s 8 customers</text><path d="M275,88 V110 H105.0 V124" fill="none" stroke="#c9d3df" stroke-width="1.5" stroke-linejoin="round"/><rect x="30" y="124" width="150" height="78" rx="8" fill="#fff" stroke="#b23b3b" stroke-width="1.6" /><text x="40" y="146" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">Big (wholesale)</text><text x="40" y="168" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Coastal Foods</text><text x="40" y="187" font-size="11.5" fill="#b23b3b" font-weight="bold" text-anchor="start">Northgate</text><path d="M275,88 V110 H270.0 V124" fill="none" stroke="#c9d3df" stroke-width="1.5" stroke-linejoin="round"/><rect x="195" y="124" width="150" height="78" rx="8" fill="#fff" stroke="#b23b3b" stroke-width="1.6" /><text x="205" y="146" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">In Mumbai</text><text x="205" y="168" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Sharma Hardware</text><text x="205" y="187" font-size="11.5" fill="#b23b3b" font-weight="bold" text-anchor="start">Metro Mart</text><path d="M275,88 V110 H435.0 V124" fill="none" stroke="#c9d3df" stroke-width="1.5" stroke-linejoin="round"/><rect x="360" y="124" width="150" height="135" rx="8" fill="#fff" stroke="#b23b3b" stroke-width="1.6" /><text x="370" y="146" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">New in 2026</text><text x="370" y="168" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Green Leaf Hotels</text><text x="370" y="187" font-size="11.5" fill="#b23b3b" font-weight="bold" text-anchor="start">Metro Mart</text><text x="370" y="206" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Sunrise Caterers</text><text x="370" y="225" font-size="11.5" fill="#b23b3b" font-weight="bold" text-anchor="start">Northgate</text><text x="370" y="244" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Blue Bay Cafe</text><text x="30" y="300" font-size="12.5" fill="#b23b3b" font-weight="bold" text-anchor="start">Overlaps: Metro Mart and Northgate appear twice.</text><text x="30" y="320" font-size="12.5" fill="#b23b3b" font-weight="normal" text-anchor="start">Gap: Patel Kitchenware is in no group.</text><text x="30" y="340" font-size="12.5" fill="#b23b3b" font-weight="normal" text-anchor="start">Totals by group won&#x27;t add up to the whole.</text><text x="555" y="30" font-size="15" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">MECE</text><rect x="705" y="48" width="190" height="40" rx="8" fill="#1d2330" stroke="none" stroke-width="1" /><text x="800" y="73" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="middle">Riverstone&#x27;s 8 customers</text><path d="M800,88 V110 H630.0 V124" fill="none" stroke="#c9d3df" stroke-width="1.5" stroke-linejoin="round"/><rect x="555" y="124" width="150" height="97" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><text x="565" y="146" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">Retail</text><text x="565" y="168" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Sharma Hardware</text><text x="565" y="187" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Patel Kitchenware</text><text x="565" y="206" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Metro Mart</text><path d="M800,88 V110 H795.0 V124" fill="none" stroke="#c9d3df" stroke-width="1.5" stroke-linejoin="round"/><rect x="720" y="124" width="150" height="78" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><text x="730" y="146" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">Wholesale</text><text x="730" y="168" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Coastal Foods</text><text x="730" y="187" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Northgate</text><path d="M800,88 V110 H960.0 V124" fill="none" stroke="#c9d3df" stroke-width="1.5" stroke-linejoin="round"/><rect x="885" y="124" width="150" height="97" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><text x="895" y="146" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">Hospitality</text><text x="895" y="168" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Green Leaf Hotels</text><text x="895" y="187" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Sunrise Caterers</text><text x="895" y="206" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Blue Bay Cafe</text><text x="555" y="300" font-size="12.5" fill="#2f7d6d" font-weight="bold" text-anchor="start">Every customer is in exactly one group.</text><text x="555" y="320" font-size="12.5" fill="#2f7d6d" font-weight="normal" text-anchor="start">Nothing is counted twice; nothing is left out.</text><text x="555" y="340" font-size="12.5" fill="#2f7d6d" font-weight="normal" text-anchor="start">Totals by group add up to the whole.</text></svg>