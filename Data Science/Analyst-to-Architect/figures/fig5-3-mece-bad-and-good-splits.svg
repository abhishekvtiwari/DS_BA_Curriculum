<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600" viewBox="0 0 720 600" font-family="DejaVu Sans, Arial, sans-serif"><rect width="720" height="600" fill="#ffffff"/><text x="16" y="30" font-size="16" fill="#b23b3b" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">✗ Not MECE</text><text x="134" y="30" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start">split: big, in Mumbai, new in 2026</text><rect x="255" y="44" width="210" height="36" rx="8" fill="#1d2330" stroke="none" stroke-width="1" /><text x="360" y="67" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">Riverstone&#x27;s 8 customers</text><path d="M360,80 V94 H124.0 V106" fill="none" stroke="#c9d3df" stroke-width="1.5" stroke-linejoin="round"/><rect x="16" y="106" width="216" height="74" rx="8" fill="#fff" stroke="#b23b3b" stroke-width="1.6" /><text x="28" y="128" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start">Big (wholesale)</text><text x="28" y="148" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">Coastal Foods</text><text x="28" y="167" font-size="13" fill="#b23b3b" font-weight="bold" text-anchor="start">Northgate  (twice)</text><path d="M360,80 V94 H352.0 V106" fill="none" stroke="#c9d3df" stroke-width="1.5" stroke-linejoin="round"/><rect x="244" y="106" width="216" height="74" rx="8" fill="#fff" stroke="#b23b3b" stroke-width="1.6" /><text x="256" y="128" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start">In Mumbai</text><text x="256" y="148" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">Sharma Hardware</text><text x="256" y="167" font-size="13" fill="#b23b3b" font-weight="bold" text-anchor="start">Metro Mart  (twice)</text><path d="M360,80 V94 H580.0 V106" fill="none" stroke="#c9d3df" stroke-width="1.5" stroke-linejoin="round"/><rect x="472" y="106" width="216" height="131" rx="8" fill="#fff" stroke="#b23b3b" stroke-width="1.6" /><text x="484" y="128" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start">New in 2026</text><text x="484" y="148" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">Green Leaf Hotels</text><text x="484" y="167" font-size="13" fill="#b23b3b" font-weight="bold" text-anchor="start">Metro Mart  (twice)</text><text x="484" y="186" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">Sunrise Caterers</text><text x="484" y="205" font-size="13" fill="#b23b3b" font-weight="bold" text-anchor="start">Northgate  (twice)</text><text x="484" y="224" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">Blue Bay Cafe</text><rect x="16" y="244" width="290" height="22" rx="5" fill="#fff" stroke="#b23b3b" stroke-width="1.4" stroke-dasharray="4 3"/><text x="26" y="260" font-size="13" fill="#b23b3b" font-weight="bold" text-anchor="start">In no group: Patel Kitchenware</text><text x="16" y="287" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">Overlaps: Metro Mart and Northgate appear twice. Gap: Patel Kitchenware is in no group.</text><text x="16" y="306" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">Totals by group won&#x27;t add up to the whole.</text><path d="M16,329 H704" fill="none" stroke="#c9d3df" stroke-width="1.2" stroke-linejoin="round"/><text x="16" y="367" font-size="16" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">✓ MECE</text><text x="100" y="367" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start">split: segment</text><rect x="255" y="381" width="210" height="36" rx="8" fill="#1d2330" stroke="none" stroke-width="1" /><text x="360" y="404" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">Riverstone&#x27;s 8 customers</text><path d="M360,417 V431 H124.0 V443" fill="none" stroke="#c9d3df" stroke-width="1.5" stroke-linejoin="round"/><rect x="16" y="443" width="216" height="93" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><text x="28" y="465" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start">Retail</text><text x="28" y="485" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">Sharma Hardware</text><text x="28" y="504" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">Patel Kitchenware</text><text x="28" y="523" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">Metro Mart</text><path d="M360,417 V431 H352.0 V443" fill="none" stroke="#c9d3df" stroke-width="1.5" stroke-linejoin="round"/><rect x="244" y="443" width="216" height="74" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><text x="256" y="465" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start">Wholesale</text><text x="256" y="485" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">Coastal Foods</text><text x="256" y="504" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">Northgate</text><path d="M360,417 V431 H580.0 V443" fill="none" stroke="#c9d3df" stroke-width="1.5" stroke-linejoin="round"/><rect x="472" y="443" width="216" height="93" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><text x="484" y="465" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start">Hospitality</text><text x="484" y="485" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">Green Leaf Hotels</text><text x="484" y="504" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">Sunrise Caterers</text><text x="484" y="523" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">Blue Bay Cafe</text><text x="16" y="558" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">Every customer is in exactly one group: nothing is counted twice, nothing is left out.</text><text x="16" y="577" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">Totals by group add up to the whole. Source: Mini database (Jan–Mar 2026).</text></svg>