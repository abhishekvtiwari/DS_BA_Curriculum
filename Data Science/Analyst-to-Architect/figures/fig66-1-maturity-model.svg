<svg xmlns="http://www.w3.org/2000/svg" width="680" height="349.4" viewBox="0 0 680 349.4" font-family="DejaVu Sans, Arial, sans-serif"><rect width="680" height="349.4" fill="#ffffff"/><text x="20" y="26" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Riverstone&#x27;s maturity, six dimensions, scored against written criteria</text><text x="247.0" y="48" font-size="10.5" fill="#5b6475" font-weight="bold" text-anchor="middle">1 Ad hoc</text><path d="M200,58 V266" fill="none" stroke="#dfe5ec" stroke-width="1" stroke-linejoin="round"/><text x="341.0" y="48" font-size="10.5" fill="#5b6475" font-weight="bold" text-anchor="middle">2 Reactive</text><path d="M294,58 V266" fill="none" stroke="#dfe5ec" stroke-width="1" stroke-linejoin="round"/><rect x="388" y="58" width="94" height="208" rx="0" fill="#f3f7fb" stroke="none" stroke-width="1" /><text x="435.0" y="48" font-size="10.5" fill="#5b6475" font-weight="bold" text-anchor="middle">3 Proactive</text><path d="M388,58 V266" fill="none" stroke="#dfe5ec" stroke-width="1" stroke-linejoin="round"/><text x="529.0" y="48" font-size="10.5" fill="#5b6475" font-weight="bold" text-anchor="middle">4 Managed</text><path d="M482,58 V266" fill="none" stroke="#dfe5ec" stroke-width="1" stroke-linejoin="round"/><text x="623.0" y="48" font-size="10.5" fill="#5b6475" font-weight="bold" text-anchor="middle">5 Optimized</text><path d="M576,58 V266" fill="none" stroke="#dfe5ec" stroke-width="1" stroke-linejoin="round"/><path d="M670,58 V266" fill="none" stroke="#dfe5ec" stroke-width="1" stroke-linejoin="round"/><path d="M200,79.0 H670" fill="none" stroke="#eef1f5" stroke-width="1" stroke-linejoin="round"/><text x="20" y="83.0" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start">Security &amp; access</text><circle cx="463.2" cy="79.0" r="7" fill="#0f5c8c"/><text x="476.2" y="83.0" font-size="11" fill="#0f5c8c" font-weight="bold" text-anchor="start">3.8</text><path d="M200,113.0 H670" fill="none" stroke="#eef1f5" stroke-width="1" stroke-linejoin="round"/><text x="20" y="117.0" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start">Data quality &amp; reliability</text><circle cx="444.4" cy="113.0" r="7" fill="#0f5c8c"/><text x="457.4" y="117.0" font-size="11" fill="#0f5c8c" font-weight="bold" text-anchor="start">3.6</text><path d="M200,147.0 H670" fill="none" stroke="#eef1f5" stroke-width="1" stroke-linejoin="round"/><text x="20" y="151.0" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start">Architecture &amp; platform</text><circle cx="406.8" cy="147.0" r="7" fill="#0f5c8c"/><text x="419.8" y="151.0" font-size="11" fill="#0f5c8c" font-weight="bold" text-anchor="start">3.2</text><path d="M200,181.0 H670" fill="none" stroke="#eef1f5" stroke-width="1" stroke-linejoin="round"/><text x="20" y="185.0" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start">Cost discipline</text><path d="M350.4,173.0 L358.4,181.0 L350.4,189.0 L342.4,181.0 Z" fill="#b7791f"/><text x="363.4" y="185.0" font-size="11" fill="#b7791f" font-weight="bold" text-anchor="start">2.6</text><path d="M200,215.0 H670" fill="none" stroke="#eef1f5" stroke-width="1" stroke-linejoin="round"/><text x="20" y="219.0" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start">Data-driven culture</text><path d="M312.8,207.0 L320.8,215.0 L312.8,223.0 L304.8,215.0 Z" fill="#b7791f"/><text x="325.8" y="219.0" font-size="11" fill="#b7791f" font-weight="bold" text-anchor="start">2.2</text><path d="M200,249.0 H670" fill="none" stroke="#eef1f5" stroke-width="1" stroke-linejoin="round"/><text x="20" y="253.0" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start">Catalog &amp; discoverability</text><path d="M275.2,241.0 L283.2,249.0 L275.2,257.0 L267.2,249.0 Z" fill="#b7791f"/><text x="288.2" y="253.0" font-size="11" fill="#b7791f" font-weight="bold" text-anchor="start">1.8</text><circle cx="26" cy="286" r="6" fill="#0f5c8c"/><text x="38" y="290" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">technical dimension</text><path d="M190,279 L197,286 L190,293 L183,286 Z" fill="#b7791f"/><text x="203" y="290" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">organizational dimension</text><text x="20" y="314.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">Score = the highest stage whose five criteria are all met, plus one-fifth for each criterion of the next stage that is met.</text><text x="20" y="327.65" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">The technical dimensions sit in stage 3; the organizational ones lag in stages 1 and 2. Read the lowest score first.</text></svg>