<svg xmlns="http://www.w3.org/2000/svg" width="620" height="334" viewBox="0 0 620 334" font-family="DejaVu Sans, Arial, sans-serif"><rect width="620" height="334" fill="#ffffff"/><text x="10" y="20" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Row-level security: one report, four views</text><rect x="12" y="37" width="262" height="126" rx="6" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="10" y="34" width="262" height="126" rx="6" fill="#fff" stroke="#7a4fa0" stroke-width="1.4" /><path d="M10,40 a6,6 0 0 1 6,-6 H266 a6,6 0 0 1 6,6 V55 H10 Z" fill="#7a4fa0"/><text x="18" y="49" font-size="10.2" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Role &quot;Region manager&quot; on Customer</text><text x="18.0" y="70" font-size="9.2" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Customer[Region]</text><text x="29.04" y="84" font-size="9.2" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">IN CALCULATETABLE (</text><text x="40.08" y="98" font-size="9.2" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">VALUES ( UserRegion[region] ),</text><text x="40.08" y="112" font-size="9.2" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">UserRegion[email]</text><text x="51.12" y="126" font-size="9.2" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">= USERPRINCIPALNAME () )</text><text x="18" y="154" font-size="9.2" fill="#7a4fa0" font-weight="bold" text-anchor="start">Leaders: role &quot;All regions&quot;, rule TRUE ()</text><rect x="318" y="37" width="294" height="126" rx="6" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="316" y="34" width="294" height="126" rx="6" fill="#fff" stroke="#0f5c8c" stroke-width="1.4" /><path d="M316,40 a6,6 0 0 1 6,-6 H604 a6,6 0 0 1 6,6 V55 H316 Z" fill="#0f5c8c"/><text x="324" y="49" font-size="10.2" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">UserRegion (a small hidden table)</text><text x="324.0" y="70" font-size="9.2" fill="#1d2330" font-weight="normal" text-anchor="start">pooja.desai@…    →  West</text><text x="324.0" y="85" font-size="9.2" fill="#1d2330" font-weight="normal" text-anchor="start">pooja.desai@…    →  East</text><text x="324.0" y="100" font-size="9.2" fill="#1d2330" font-weight="normal" text-anchor="start">arjun.nair@…     →  South</text><text x="324.0" y="115" font-size="9.2" fill="#1d2330" font-weight="normal" text-anchor="start">sandeep.gill@…   →  North</text><text x="324.0" y="130" font-size="9.2" fill="#1d2330" font-weight="normal" text-anchor="start">Anita Rao: the All regions role</text><path d="M314,97 L276,97" fill="none" stroke="#5b6475" stroke-width="1.4" stroke-linejoin="round"/><path d="M276,97 L281.4,94.4 L281.4,99.6 Z" fill="#5b6475"/><text x="295" y="90" font-size="9.2" fill="#5b6475" font-weight="normal" text-anchor="middle">reads</text><text x="10" y="184" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">What each person sees in the same report (2025 net revenue):</text><rect x="10" y="194" width="600" height="23" rx="4" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="10" y="194" width="5" height="23" rx="0" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="24" y="209.5" font-size="9.8" fill="#1d2330" font-weight="bold" text-anchor="start">Anita Rao (All regions)</text><text x="236" y="209.5" font-size="9.8" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">₹114.7 cr</text><text x="330" y="209.5" font-size="9.8" fill="#5b6475" font-weight="normal" text-anchor="start">all 4,599 customers</text><rect x="10" y="222" width="600" height="23" rx="4" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="10" y="222" width="5" height="23" rx="0" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="24" y="237.5" font-size="9.8" fill="#1d2330" font-weight="bold" text-anchor="start">Pooja Desai (West + East)</text><text x="236" y="237.5" font-size="9.8" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">₹52.6 cr</text><text x="330" y="237.5" font-size="9.8" fill="#5b6475" font-weight="normal" text-anchor="start">West ₹38.4 cr + East ₹14.2 cr</text><rect x="10" y="250" width="600" height="23" rx="4" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="10" y="250" width="5" height="23" rx="0" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="24" y="265.5" font-size="9.8" fill="#1d2330" font-weight="bold" text-anchor="start">Arjun Nair (South)</text><text x="236" y="265.5" font-size="9.8" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">₹31.9 cr</text><text x="330" y="265.5" font-size="9.8" fill="#5b6475" font-weight="normal" text-anchor="start">1,289 customers</text><rect x="10" y="278" width="600" height="23" rx="4" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="10" y="278" width="5" height="23" rx="0" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="24" y="293.5" font-size="9.8" fill="#1d2330" font-weight="bold" text-anchor="start">Sandeep Gill (North)</text><text x="236" y="293.5" font-size="9.8" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">₹27.9 cr</text><text x="330" y="293.5" font-size="9.8" fill="#5b6475" font-weight="normal" text-anchor="start">1,127 customers</text><text x="10" y="322" font-size="9.8" fill="#5b6475" font-weight="normal" text-anchor="start">₹2.3 crore from customers with no city has no region: only the All regions role sees it.</text></svg>