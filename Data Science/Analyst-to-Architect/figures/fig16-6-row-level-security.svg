<svg xmlns="http://www.w3.org/2000/svg" width="960" height="468" viewBox="0 0 960 468" font-family="DejaVu Sans, Arial, sans-serif"><rect width="960" height="468" fill="#ffffff"/><text x="30" y="32" font-size="14.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Row-level security: one report, four views</text><rect x="33" y="70" width="260" height="140" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="30" y="66" width="260" height="140" rx="8" fill="#fff" stroke="#7a4fa0" stroke-width="1.6" /><path d="M30,74 a8,8 0 0 1 8,-8 H282 a8,8 0 0 1 8,8 V92 H30 Z" fill="#7a4fa0"/><text x="41" y="84" font-size="11.8" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Role &quot;Region manager&quot;</text><text x="41" y="111" font-size="10.2" fill="#1d2330" font-weight="normal" text-anchor="start">Table: Customer</text><text x="41" y="128" font-size="10.2" fill="#1d2330" font-weight="normal" text-anchor="start">DAX rule:</text><text x="41" y="145" font-size="10.2" fill="#1d2330" font-weight="normal" text-anchor="start">[region] = LOOKUPVALUE(</text><text x="41" y="162" font-size="10.2" fill="#1d2330" font-weight="normal" text-anchor="start">  UserRegion[region],</text><text x="41" y="179" font-size="10.2" fill="#1d2330" font-weight="normal" text-anchor="start">  UserRegion[email],</text><text x="41" y="196" font-size="10.2" fill="#1d2330" font-weight="normal" text-anchor="start">  USERPRINCIPALNAME())</text><rect x="333" y="70" width="250" height="140" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="330" y="66" width="250" height="140" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><path d="M330,74 a8,8 0 0 1 8,-8 H572 a8,8 0 0 1 8,8 V92 H330 Z" fill="#0f5c8c"/><text x="341" y="84" font-size="11.8" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">UserRegion (a small table)</text><text x="341" y="111" font-size="10.2" fill="#1d2330" font-weight="normal" text-anchor="start">arjun@…  →  South</text><text x="341" y="128" font-size="10.2" fill="#1d2330" font-weight="normal" text-anchor="start">pooja@…  →  West and East</text><text x="341" y="145" font-size="10.2" fill="#1d2330" font-weight="normal" text-anchor="start">sandeep@…  →  North</text><text x="341" y="162" font-size="10.2" fill="#1d2330" font-weight="normal" text-anchor="start">anita@…  →  (no role: sees all)</text><path d="M294,136 L326,136" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M326,136 L319.7,139.0 L319.7,133.0 Z" fill="#5b6475"/><text x="30" y="236" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">What each person sees when they open the same report (2025 net revenue):</text><rect x="30" y="256" width="900" height="30" rx="5" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="30" y="256" width="7" height="30" rx="0" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="50" y="276" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="start">Anita Rao (no role)</text><text x="320" y="276" font-size="11.5" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">₹114.7 cr</text><text x="460" y="276" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">all 4,599 customers</text><rect x="30" y="294" width="900" height="30" rx="5" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="30" y="294" width="7" height="30" rx="0" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="50" y="314" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="start">Pooja Desai (West + East)</text><text x="320" y="314" font-size="11.5" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">₹52.6 cr</text><text x="460" y="314" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">West ₹38.4 cr + East ₹14.2 cr</text><rect x="30" y="332" width="900" height="30" rx="5" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="30" y="332" width="7" height="30" rx="0" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="50" y="352" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="start">Arjun Nair (South)</text><text x="320" y="352" font-size="11.5" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">₹31.9 cr</text><text x="460" y="352" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">1,289 customers</text><rect x="30" y="370" width="900" height="30" rx="5" fill="#fff" stroke="#c9d3df" stroke-width="1" /><rect x="30" y="370" width="7" height="30" rx="0" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="50" y="390" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="start">Sandeep Gill (North)</text><text x="320" y="390" font-size="11.5" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">₹27.9 cr</text><text x="460" y="390" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">1,127 customers</text><text x="30" y="432" font-size="11.3" fill="#5b6475" font-weight="normal" text-anchor="start">₹2.3 crore of 2025 revenue belongs to customers with no city, so it has no region: it appears only in the unfiltered view.</text><text x="30" y="450" font-size="11.3" fill="#5b6475" font-weight="normal" text-anchor="start">Rules filter the dimension; the filter flows to the facts. Security lives in the semantic model, not in the report pages.</text></svg>