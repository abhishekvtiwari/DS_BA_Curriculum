ert when a rule trips</text><rect x="286" y="412" width="200" height="104" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="298" y="438" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">Analyst · BI developer ·</text><text x="298" y="457" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">integration engineer ·</text><text x="298" y="476" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">AI engineer</text><rect x="500" y="412" width="204" height="104" rx="6" fill="#fbeaea" stroke="#e3b7b7" stroke-width="1" /><text x="512" y="436" font-size="11" fill="#b23b3b" font-weight="bold" text-anchor="start">By hand:</text><text x="512" y="456" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Emailed attachment,</text><text x="512" y="474" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">re-keyed into the CRM</text></svg>