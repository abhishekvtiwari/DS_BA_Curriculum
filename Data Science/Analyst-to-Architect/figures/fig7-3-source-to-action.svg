4" y="282" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">Analyst · BI developer</text><text x="804" y="300" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">integration engineer</text><text x="804" y="318" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">AI engineer</text><text x="30" y="362" font-size="11" fill="#b23b3b" font-weight="bold" text-anchor="start">THE SAME FLOW DONE BY HAND</text><rect x="30" y="372" width="226" height="58" rx="6" fill="#fbeaea" stroke="#e3b7b7" stroke-width="1" /><text x="42" y="394" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Export by hand</text><rect x="284" y="372" width="226" height="58" rx="6" fill="#fbeaea" stroke="#e3b7b7" stroke-width="1" /><text x="296" y="394" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Copy-paste into one file</text><rect x="538" y="372" width="226" height="58" rx="6" fill="#fbeaea" stroke="#e3b7b7" stroke-width="1" /><text x="550" y="394" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Formulas re-typed each week</text><rect x="792" y="372" width="226" height="58" rx="6" fill="#fbeaea" stroke="#e3b7b7" stroke-width="1" /><text x="804" y="394" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Emailed attachment; re-keyed</text><text x="804" y="412" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">into the CRM</text></svg>