<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="DejaVu Sans, Arial, sans-serif"><rect width="680" height="300" fill="#ffffff"/><rect x="20" y="20" width="640" height="68" rx="10" fill="#fff" stroke="#0f5c8c" stroke-width="1.8" /><circle cx="60" cy="54.0" r="25" fill="#0f5c8c"/><text x="60" y="64.0" font-size="28" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">3</text><text x="104" y="48" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start">copies of important data</text><text x="104" y="70" font-size="12" fill="#414a5a" font-weight="normal" text-anchor="start">the original, plus two backups</text><rect x="20" y="98" width="640" height="68" rx="10" fill="#fff" stroke="#7a4fa0" stroke-width="1.8" /><circle cx="60" cy="132.0" r="25" fill="#7a4fa0"/><text x="60" y="142.0" font-size="28" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">2</text><text x="104" y="126" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start">different types of storage</text><text x="104" y="148" font-size="12" fill="#414a5a" font-weight="normal" text-anchor="start">for example the laptop&#x27;s drive and an external drive or a cloud service</text><rect x="20" y="176" width="640" height="68" rx="10" fill="#fff" stroke="#2f7d6d" stroke-width="1.8" /><circle cx="60" cy="210.0" r="25" fill="#2f7d6d"/><text x="60" y="220.0" font-size="28" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">1</text><text x="104" y="204" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start">copy kept somewhere else</text><text x="104" y="226" font-size="12" fill="#414a5a" font-weight="normal" text-anchor="start">off-site or in the cloud, safe from fire, theft, or ransomware at the office</text><text x="20" y="268" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">A backup you have never restored is a hope, not a backup:</text><text x="20" y="287" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">test a restore regularly.</text></svg>