<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="352" viewBox="0 0 1000 352" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1000" height="352" fill="#ffffff"/><text x="30" y="30" font-size="14.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Build vs. buy: a managed data catalog, scored honestly</text><rect x="30" y="64" width="940" height="26" rx="4" fill="#1d2330" stroke="none" stroke-width="1" /><text x="40" y="82" font-size="10.2" fill="#fff" font-weight="bold" text-anchor="start">Dimension</text><text x="330" y="82" font-size="10.2" fill="#fff" font-weight="bold" text-anchor="start">Buy</text><text x="590" y="82" font-size="10.2" fill="#fff" font-weight="bold" text-anchor="start">Build</text><text x="860" y="82" font-size="10.2" fill="#fff" font-weight="bold" text-anchor="start">Edge to</text><rect x="30" y="98" width="940" height="38" rx="0" fill="#fff" stroke="none" stroke-width="1" /><rect x="30" y="98" width="5" height="38" rx="0" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="40" y="122" font-size="9.8" fill="#1d2330" font-weight="bold" text-anchor="start">Time to working solution</text><text x="330" y="122" font-size="9.4" fill="#5b6475" font-weight="normal" text-anchor="start">weeks</text><text x="590" y="122" font-size="9.4" fill="#5b6475" font-weight="normal" text-anchor="start">months</text><text x="900" y="122" font-size="10" fill="#2f7d6d" font-weight="bold" text-anchor="middle">Buy</text><rect x="30" y="136" width="940" height="38" rx="0" fill="#f7f9fb" stroke="none" stroke-width="1" /><rect x="30" y="136" width="5" height="38" rx="0" fill="#b7791f" stroke="none" stroke-width="1" /><text x="40" y="160" font-size="9.8" fill="#1d2330" font-weight="bold" text-anchor="start">Fit to Riverstone&#x27;s exact needs</text><text x="330" y="160" font-size="9.4" fill="#5b6475" font-weight="normal" text-anchor="start">good enough</text><text x="590" y="160" font-size="9.4" fill="#5b6475" font-weight="normal" text-anchor="start">perfect, eventually</text><text x="900" y="160" font-size="10" fill="#b7791f" font-weight="bold" text-anchor="middle">Buy</text><rect x="30" y="174" width="940" height="38" rx="0" fill="#fff" stroke="none" stroke-width="1" /><rect x="30" y="174" width="5" height="38" rx="0" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="40" y="198" font-size="9.8" fill="#1d2330" font-weight="bold" text-anchor="start">Ongoing maintenance burden</text><text x="330" y="198" font-size="9.4" fill="#5b6475" font-weight="normal" text-anchor="start">vendor&#x27;s problem</text><text x="590" y="198" font-size="9.4" fill="#5b6475" font-weight="normal" text-anchor="start">the 4-person team&#x27;s problem</text><text x="900" y="198" font-size="10" fill="#b23b3b" font-weight="bold" text-anchor="middle">Buy</text><rect x="30" y="212" width="940" height="38" rx="0" fill="#f7f9fb" stroke="none" stroke-width="1" /><rect x="30" y="212" width="5" height="38" rx="0" fill="#b7791f" stroke="none" stroke-width="1" /><text x="40" y="236" font-size="9.8" fill="#1d2330" font-weight="bold" text-anchor="start">Cost at current scale</text><text x="330" y="236" font-size="9.4" fill="#5b6475" font-weight="normal" text-anchor="start">predictable subscription</text><text x="590" y="236" font-size="9.4" fill="#5b6475" font-weight="normal" text-anchor="start">engineering time, unbounded</text><text x="900" y="236" font-size="10" fill="#b7791f" font-weight="bold" text-anchor="middle">Buy</text><rect x="30" y="250" width="940" height="38" rx="0" fill="#fff" stroke="none" stroke-width="1" /><rect x="30" y="250" width="5" height="38" rx="0" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="40" y="274" font-size="9.8" fill="#1d2330" font-weight="bold" text-anchor="start">Lock-in risk</text><text x="330" y="274" font-size="9.4" fill="#5b6475" font-weight="normal" text-anchor="start">real, but exit paths exist</text><text x="590" y="274" font-size="9.4" fill="#5b6475" font-weight="normal" text-anchor="start">none, but nobody else knows it</text><text x="900" y="274" font-size="10" fill="#2f7d6d" font-weight="bold" text-anchor="middle">Buy</text><text x="30" y="314" font-size="11.2" fill="#5b6475" font-weight="normal" text-anchor="start">At a 4-person team&#x27;s scale, buy wins on every dimension that matters — build only wins if Riverstone&#x27;s catalog needs</text><text x="30" y="332" font-size="11.2" fill="#5b6475" font-weight="normal" text-anchor="start">are genuinely unlike anyone else&#x27;s, which a governance catalog&#x27;s needs, honestly, are not.</text></svg>