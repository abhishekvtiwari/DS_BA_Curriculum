f" stroke-width="1.5"/><text x="98.96000000000001" y="58.95999999999998" font-size="12" fill="#c0662b" font-weight="bold" text-anchor="start">Tasty Tiffins</text><text x="98.96000000000001" y="73.95999999999998" font-size="11.5" fill="#c0662b" font-weight="normal" text-anchor="start">[0.096, 0.904]</text><path d="M147.2,260.7 A92,92 0 0 0 113.0,222.1" fill="none" stroke="#2f7d6d" stroke-width="2"/><text x="138.83074300484284" y="242.95633679568962" font-size="12.5" fill="#2f7d6d" font-weight="bold" text-anchor="start">33°</text><text x="420" y="40" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Reading the picture</text><text x="420" y="68" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Each arrow is one customer&#x27;s mix.</text><text x="420" y="88" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Its direction says what they buy;</text><text x="420" y="108" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">its length doesn&#x27;t matter for similarity.</text><text x="420" y="128" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start"></text><text x="420" y="148" font-size="12" fill="#2f7d6d" font-weight="bold" text-anchor="start">Angle Sharma to Green Leaf: 33°</text><text x="420" y="168" font-size="12" fill="#2f7d6d" font-weight="bold" text-anchor="start">cosine in these 2 dimensions = 0.843</text><text x="420" y="188" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start"></text><text x="420" y="208" font-size="12" fill="#c0662b" font-weight="bold" text-anchor="start">Angle Sharma to Tasty Tiffins: 59°</text><text x="420" y="228" font-size="12" fill="#c0662b" font-weight="bold" text-anchor="start">cosine in these 2 dimensions = 0.520</text><text x="420" y="248" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start"></text><text x="420" y="268" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Smaller angle, higher cosine, more alike.</text><text x="420" y="300" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Industrial and Furniture shares are zero for</text><text x="420" y="316" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">these three, apart from Sharma&#x27;s 3.4% Furniture.</text></svg>