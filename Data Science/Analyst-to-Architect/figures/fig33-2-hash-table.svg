<svg xmlns="http://www.w3.org/2000/svg" width="700" height="334" viewBox="0 0 700 334" font-family="DejaVu Sans, Arial, sans-serif"><rect width="700" height="334" fill="#ffffff"/><text x="20" y="26" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Why a dictionary lookup does not get slower as it grows</text><rect x="20" y="52" width="122" height="30" rx="5" fill="#fff" stroke="#0f5c8c" stroke-width="1.4" /><text x="81" y="72" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">(100001, 101)</text><path d="M142,67 H160" fill="none" stroke="#5b6475" stroke-width="1.4" stroke-linejoin="round"/><path d="M154,62 L161,67 L154,72" fill="none" stroke="#5b6475" stroke-width="1.4" stroke-linejoin="round"/><rect x="163" y="52" width="92" height="30" rx="5" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="209" y="72" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">hash() % 8</text><path d="M255,67 H273" fill="none" stroke="#5b6475" stroke-width="1.4" stroke-linejoin="round"/><path d="M267,62 L274,67 L267,72" fill="none" stroke="#5b6475" stroke-width="1.4" stroke-linejoin="round"/><text x="280" y="72" font-size="11" fill="#7a4fa0" font-weight="bold" text-anchor="start">bucket 7</text><rect x="20" y="98" width="122" height="30" rx="5" fill="#fff" stroke="#0f5c8c" stroke-width="1.4" /><text x="81" y="118" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">(100002, 104)</text><path d="M142,113 H160" fill="none" stroke="#5b6475" stroke-width="1.4" stroke-linejoin="round"/><path d="M154,108 L161,113 L154,118" fill="none" stroke="#5b6475" stroke-width="1.4" stroke-linejoin="round"/><rect x="163" y="98" width="92" height="30" rx="5" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="209" y="118" font-size="11" fill=