 stroke-width="1" /><text x="209" y="210" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">hash() % 8</text><path d="M255,205 H273" fill="none" stroke="#5b6475" stroke-width="1.4" stroke-linejoin="round"/><path d="M267,200 L274,205 L267,210" fill="none" stroke="#5b6475" stroke-width="1.4" stroke-linejoin="round"/><text x="280" y="210" font-size="11" fill="#7a4fa0" font-weight="bold" text-anchor="start">bucket 7</text><text x="380" y="44" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start">8 buckets</text><rect x="380" y="52" width="310" height="23" rx="3" fill="#e2f3ee" stroke="#c9d3df" stroke-width="1" /><text x="388" y="68" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">bucket 0</text><text x="460" y="68" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">(100003, 108)</text><rect x="380" y="78" width="310" height="23" rx="3" fill="#fff" stroke="#c9d3df" stroke-width="1" /><text x="388" y="94" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">bucket 1</text><text x="460" y="94" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">empty</text><rect x="380" y="104" width="310" height="23" rx="3" fill="#fff" stroke="#c9d3df" stroke-width="1" /><text x="388" y="120" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">bucket 2</text><text x="460" y="120" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">empty</text><rect x="380" y="130" width="310" height="23" rx="3" fill="#fff" stroke="#c9d3df" stroke-width="1" /><text x="388" y="146" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">bucket 3</text><text x="460" y="146" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">empty</text><rect x="380" y="156" width="310" height="23" rx="3" fill="#fff" stroke="#c9d3df" stroke-width="1" /><text x="388" y="172" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">bucket 4</text><text x="460" y="172" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">empty</text><rect x="380" y="182" width="310" height="23" rx="3" fill="#fff" stroke="#c9d3df" stroke-width="1" /><text x="388" y="198" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">bucket 5</text><text x="460" y="198" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">empty</text><rect x="380" y="208" width="310" height="23" rx="3" fill="#e2f3ee" stroke="#c9d3df" stroke-width="1" /><text x="388" y="224" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">bucket 6</text><text x="460" y="224" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">(100002, 104)</text><rect x="380" y="234" width="310" height="23" rx="3" fill="#e2f3ee" stroke="#c9d3df" stroke-width="1" /><text x="388" y="250" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">bucket 7</text><text x="460" y="250" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">(100001, 101)  (100004, 105)</text><text x="380" y="277" font-size="10.5" fill="#2f7d6d" font-weight="bold" text-anchor="start">Bucket 7 holds two keys: a collision, and normal.</text><text x="20" y="306" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">To find a key: hash it, take the remainder, look in one bucket. The same steps whether the dictionary</text><text x="20" y="322" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">holds ten keys or ten million.</text></svg>