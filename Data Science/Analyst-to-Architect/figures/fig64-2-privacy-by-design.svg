<svg xmlns="http://www.w3.org/2000/svg" width="680" height="182.0" viewBox="0 0 680 182.0" font-family="DejaVu Sans, Arial, sans-serif"><rect width="680" height="182.0" fill="#ffffff"/><rect x="6.0" y="6" width="159.5" height="170.0" rx="6" fill="#fff" stroke="#0f5c8c" stroke-width="1.4" /><path d="M6.0,12 a6,6 0 0 1 6,-6 H159.5 a6,6 0 0 1 6,6 V42 H6.0 Z" fill="#0f5c8c"/><text x="85.75" y="21.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">Data minimization</text><text x="14.0" y="58.0" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Collect only what the</text><text x="14.0" y="71.5" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">feature actually needs.</text><rect x="10.0" y="110.0" width="151.5" height="62.0" rx="4" fill="#eef2f7" stroke="none" stroke-width="1" /><text x="14.0" y="124.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">Riverstone: The lead score</text><text x="14.0" y="137.5" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">uses company size,</text><text x="14.0" y="151.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">industry and recency,</text><text x="14.0" y="164.5" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">never browsing data.</text><rect x="175.5" y="6" width="159.5" height="170.0" rx="6" fill="#fff" stroke="#2f7d6d" stroke-width="1.4" /><path d="M175.5,12 a6,6 0 0 1 6,-6 H329.0 a6,6 0 0 1 6,6 V42 H175.5 Z" fill="#2f7d6d"/><text x="255.25" y="21.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">Purpose limitation</text><text x="183.5" y="58.0" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Data collected for one</text><text x="183.5" y="71.5" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">reason is not reused for</text><text x="183.5" y="85.0" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">another without a fresh</text><text x="183.5" y="98.5" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">reason.</text><rect x="179.5" y="110.0" width="151.5" height="62.0" rx="4" fill="#eef2f7" stroke="none" stroke-width="1" /><text x="183.5" y="124.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">Riverstone: Support tickets</text><text x="183.5" y="137.5" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">are not fed into marketing</text><text x="183.5" y="151.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">scoring.</text><rect x="345.0" y="6" width="159.5" height="170.0" rx="6" fill="#fff" stroke="#b7791f" stroke-width="1.4" /><path d="M345.0,12 a6,6 0 0 1 6,-6 H498.5 a6,6 0 0 1 6,6 V42 H345.0 Z" fill="#b7791f"/><text x="424.75" y="21.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">Sensible retention</text><text x="353.0" y="58.0" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Keep data only as long as</text><text x="353.0" y="71.5" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">it is needed, then delete it</text><text x="353.0" y="85.0" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">on purpose.</text><rect x="349.0" y="110.0" width="151.5" height="62.0" rx="4" fill="#eef2f7" stroke="none" stroke-width="1" /><text x="353.0" y="124.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">Riverstone: Raw PO emails</text><text x="353.0" y="137.5" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">deleted 90 days after the</text><text x="353.0" y="151.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">order is confirmed.</text><rect x="514.5" y="6" width="159.5" height="170.0" rx="6" fill="#fff" stroke="#7a4fa0" stroke-width="1.4" /><path d="M514.5,12 a6,6 0 0 1 6,-6 H668.0 a6,6 0 0 1 6,6 V42 H514.5 Z" fill="#7a4fa0"/><text x="594.25" y="21.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">Pseudonymize or</text><text x="594.25" y="35.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">anonymize</text><text x="522.5" y="58.0" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Mask identity when the</text><text x="522.5" y="71.5" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">analysis doesn&#x27;t need it.</text><rect x="518.5" y="110.0" width="151.5" height="62.0" rx="4" fill="#eef2f7" stroke="none" stroke-width="1" /><text x="522.5" y="124.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">Riverstone: Assistant logs</text><text x="522.5" y="137.5" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">keep a hash of the</text><text x="522.5" y="151.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">question for a year, the</text><text x="522.5" y="164.5" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">words for 30 days (Ch 57).</text></svg>