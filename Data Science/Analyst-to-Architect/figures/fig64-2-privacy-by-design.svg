<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="304" viewBox="0 0 1010 304" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1010" height="304" fill="#ffffff"/><text x="30" y="30" font-size="14.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Privacy by design: four habits, built in from the start</text><rect x="33" y="64" width="225" height="140" rx="7" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="30" y="60" width="225" height="140" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><path d="M30,68 a7,7 0 0 1 7,-7 H248 a7,7 0 0 1 7,7 V84 H30 Z" fill="#0f5c8c"/><text x="142.5" y="76.5" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Data
minimization</text><text x="142.5" y="100" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">Collect only what the</text><text x="142.5" y="114" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">feature actually needs</text><rect x="30" y="206" width="225" height="50" rx="6" fill="#f3f6fa" stroke="none" stroke-width="1" /><text x="142" y="224" font-size="9.2" fill="#5b6475" font-weight="normal" text-anchor="middle">Lead scoring uses order</text><text x="142" y="239" font-size="9.2" fill="#5b6475" font-weight="normal" text-anchor="middle">history, not browsing data</text><rect x="278" y="64" width="225" height="140" rx="7" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="275" y="60" width="225" height="140" rx="7" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><path d="M275,68 a7,7 0 0 1 7,-7 H493 a7,7 0 0 1 7,7 V84 H275 Z" fill="#2f7d6d"/><text x="387.5" y="76.5" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Purpose
limitation</text><text x="387.5" y="100" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">Data collected for one</text><text x="387.5" y="114" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">reason isn&#x27;t reused for</text><text x="387.5" y="128" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">another without new consent</text><rect x="275" y="206" width="225" height="50" rx="6" fill="#f3f6fa" stroke="none" stroke-width="1" /><text x="387" y="224" font-size="9.2" fill="#5b6475" font-weight="normal" text-anchor="middle">Support tickets aren&#x27;t fed</text><text x="387" y="239" font-size="9.2" fill="#5b6475" font-weight="normal" text-anchor="middle">into marketing scoring</text><rect x="523" y="64" width="225" height="140" rx="7" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="520" y="60" width="225" height="140" rx="7" fill="#fff" stroke="#b7791f" stroke-width="1.6" /><path d="M520,68 a7,7 0 0 1 7,-7 H738 a7,7 0 0 1 7,7 V84 H520 Z" fill="#b7791f"/><text x="632.5" y="76.5" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Sensible
retention</text><text x="632.5" y="100" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">Keep data only as long</text><text x="632.5" y="114" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">as it&#x27;s actually needed</text><rect x="520" y="206" width="225" height="50" rx="6" fill="#f3f6fa" stroke="none" stroke-width="1" /><text x="632" y="224" font-size="9.2" fill="#5b6475" font-weight="normal" text-anchor="middle">Raw PO emails purged 90</text><text x="632" y="239" font-size="9.2" fill="#5b6475" font-weight="normal" text-anchor="middle">days after order confirmed</text><rect x="768" y="64" width="225" height="140" rx="7" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="765" y="60" width="225" height="140" rx="7" fill="#fff" stroke="#7a4fa0" stroke-width="1.6" /><path d="M765,68 a7,7 0 0 1 7,-7 H983 a7,7 0 0 1 7,7 V84 H765 Z" fill="#7a4fa0"/><text x="877.5" y="76.5" font-size="10" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Anonymization /
pseudonymization</text><text x="877.5" y="100" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">Strip or mask identity</text><text x="877.5" y="114" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">when the analysis doesn&#x27;t</text><text x="877.5" y="128" font-size="8.600000000000001" fill="#1d2330" font-weight="normal" text-anchor="middle">need it</text><rect x="765" y="206" width="225" height="50" rx="6" fill="#f3f6fa" stroke="none" stroke-width="1" /><text x="877" y="224" font-size="9.2" fill="#5b6475" font-weight="normal" text-anchor="middle">Ch 56 drift monitoring</text><text x="877" y="239" font-size="9.2" fill="#5b6475" font-weight="normal" text-anchor="middle">uses hashed customer IDs</text><text x="30" y="285" font-size="11.3" fill="#5b6475" font-weight="normal" text-anchor="start">Each of these costs a little convenience today and removes a whole category of future incident, audit finding, or regulatory exposure.</text></svg>