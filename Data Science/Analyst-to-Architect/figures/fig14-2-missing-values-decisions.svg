<svg xmlns="http://www.w3.org/2000/svg" width="990" height="405" viewBox="0 0 990 405" font-family="DejaVu Sans, Arial, sans-serif"><rect width="990" height="405" fill="#ffffff"/><text x="30" y="30" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">What to do with a missing or wrong value</text><rect x="30" y="56" width="420" height="62" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><text x="46" y="82" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Is it really missing?</text><text x="46" y="103" font-size="11.3" fill="#5b6475" font-weight="normal" text-anchor="start">&#x27;&#x27;, NULL, &#x27;N/A&#x27;, &#x27;-&#x27;, &#x27;unknown&#x27;, &#x27;NULL&#x27; all mean the same thing</text><rect x="30" y="152" width="420" height="62" rx="8" fill="#fff" stroke="#7a4fa0" stroke-width="1.6" /><text x="46" y="178" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Can another column supply it reliably?</text><text x="46" y="199" font-size="11.3" fill="#5b6475" font-weight="normal" text-anchor="start">product from a unique list price; date from the entry timestamp</text><rect x="30" y="248" width="420" height="62" rx="8" fill="#fff" stroke="#c0662b" stroke-width="1.6" /><text x="46" y="274" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Is it needed for the number you report?</text><text x="46" y="295" font-size="11.3" fill="#5b6475" font-weight="normal" text-anchor="start">quantity is needed for revenue; sales rep is not</text><rect x="560" y="63" width="400" height="50" rx="8" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="576" y="85" font-size="13" fill="#fff" font-weight="bold" text-anchor="start">Standardize to NULL</text><text x="576" y="104" font-size="11.5" fill="#fff" font-weight="normal" text-anchor="start">100 cities, 150 emails</text><rect x="560" y="159" width="400" height="50" rx="8" fill="#7a4fa0" stroke="none" stroke-width="1" /><text x="576" y="181" font-size="13" fill="#fff" font-weight="bold" text-anchor="start">Repair, and log it</text><text x="576" y="200" font-size="11.5" fill="#fff" font-weight="normal" text-anchor="start">8 products, 9 dates</text><rect x="560" y="255" width="400" height="50" rx="8" fill="#c0662b" stroke="none" stroke-width="1" /><text x="576" y="277" font-size="13" fill="#fff" font-weight="bold" text-anchor="start">Quarantine, and report the gap</text><text x="576" y="296" font-size="11.5" fill="#fff" font-weight="normal" text-anchor="start">14 quantities (+6 impossible)</text><rect x="560" y="316" width="400" height="50" rx="8" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="576" y="338" font-size="13" fill="#fff" font-weight="bold" text-anchor="start">Keep NULL and label it</text><text x="576" y="357" font-size="11.5" fill="#fff" font-weight="normal" text-anchor="start">3.1% of lines have no sales rep</text><path d="M452,87 L556,87" fill="none" stroke="#0f5c8c" stroke-width="1.6" stroke-linejoin="round"/><path d="M556,87 L549.7,90.0 L549.7,84.0 Z" fill="#0f5c8c"/><text x="470" y="80" font-size="11" fill="#0f5c8c" font-weight="bold" text-anchor="start">yes</text><path d="M240,120 L240,150" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M240,150 L237.0,143.7 L243.0,143.7 Z" fill="#5b6475"/><text x="250" y="140" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">then</text><path d="M452,183 L556,183" fill="none" stroke="#7a4fa0" stroke-width="1.6" stroke-linejoin="round"/><path d="M556,183 L549.7,186.0 L549.7,180.0 Z" fill="#7a4fa0"/><text x="470" y="176" font-size="11" fill="#7a4fa0" font-weight="bold" text-anchor="start">yes</text><path d="M240,216 L240,246" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M240,246 L237.0,239.7 L243.0,239.7 Z" fill="#5b6475"/><text x="250" y="236" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">no</text><path d="M452,279 L556,279" fill="none" stroke="#c0662b" stroke-width="1.6" stroke-linejoin="round"/><path d="M556,279 L549.7,282.0 L549.7,276.0 Z" fill="#c0662b"/><text x="470" y="272" font-size="11" fill="#c0662b" font-weight="bold" text-anchor="start">yes</text><path d="M240,310 V340 H556" fill="none" stroke="#2f7d6d" stroke-width="1.6" stroke-linejoin="round"/><path d="M556,340 l-8,-5 l0,10 z" fill="#2f7d6d"/><text x="250" y="334" font-size="11" fill="#2f7d6d" font-weight="bold" text-anchor="start">no</text><text x="30" y="390" font-size="11.8" fill="#b23b3b" font-weight="normal" text-anchor="start">Never fill an identifier, a price, or a quantity with 0 or an average: the report would look complete and be wrong.</text></svg>