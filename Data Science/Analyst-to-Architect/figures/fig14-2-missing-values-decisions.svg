<svg xmlns="http://www.w3.org/2000/svg" width="700" height="440" viewBox="0 0 700 440" font-family="DejaVu Sans, Arial, sans-serif"><rect width="700" height="440" fill="#ffffff"/><text x="20" y="28" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">What to do with a missing or wrong value</text><rect x="20" y="48" width="330" height="72" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><text x="32" y="70" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">Is it really missing?</text><text x="32" y="90" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">&#x27;&#x27;, NULL, &#x27;N/A&#x27;, &#x27;-&#x27;, &#x27;unknown&#x27;, &#x27;NULL&#x27;</text><text x="32" y="107" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">all mean the same thing</text><rect x="20" y="148" width="330" height="72" rx="8" fill="#fff" stroke="#7a4fa0" stroke-width="1.6" /><text x="32" y="170" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">Can another column supply it reliably?</text><text x="32" y="190" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">product from a unique list price;</text><text x="32" y="207" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">date from the entry timestamp</text><rect x="20" y="248" width="330" height="72" rx="8" fill="#fff" stroke="#c0662b" stroke-width="1.6" /><text x="32" y="270" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">Is it needed for the number you report?</text><text x="32" y="290" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">quantity is needed for revenue;</text><text x="32" y="307" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">sales rep is not</text><rect x="440" y="58" width="245" height="52" rx="8" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="452" y="79" font-size="12" fill="#fff" font-weight="bold" text-anchor="start">1 Standardize to NULL</text><text x="452" y="99" font-size="11" fill="#fff" font-weight="normal" text-anchor="start">100 cities, 150 emails</text><rect x="440" y="158" width="245" height="52" rx="8" fill="#7a4fa0" stroke="none" stroke-width="1" /><text x="452" y="179" font-size="12" fill="#fff" font-weight="bold" text-anchor="start">2 Repair, and log it</text><text x="452" y="199" font-size="11" fill="#fff" font-weight="normal" text-anchor="start">8 products, 9 dates</text><rect x="440" y="258" width="245" height="52" rx="8" fill="#c0662b" stroke="none" stroke-width="1" /><text x="452" y="279" font-size="12" fill="#fff" font-weight="bold" text-anchor="start">3 Quarantine, report the gap</text><text x="452" y="299" font-size="11" fill="#fff" font-weight="normal" text-anchor="start">14 quantities (+6 impossible)</text><rect x="440" y="330" width="245" height="52" rx="8" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="452" y="351" font-size="12" fill="#fff" font-weight="bold" text-anchor="start">4 Keep NULL and label it</text><text x="452" y="371" font-size="11" fill="#fff" font-weight="normal" text-anchor="start">3.1% of lines have no rep</text><path d="M352,84 L436,84" fill="none" stroke="#0f5c8c" stroke-width="1.6" stroke-linejoin="round"/><path d="M436,84 L429.7,87.0 L429.7,81.0 Z" fill="#0f5c8c"/><text x="362" y="77" font-size="11" fill="#0f5c8c" font-weight="bold" text-anchor="start">yes</text><path d="M185,121 L185,146" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M185,146 L182.0,139.7 L188.0,139.7 Z" fill="#5b6475"/><text x="195" y="138" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">then</text><path d="M352,184 L436,184" fill="none" stroke="#7a4fa0" stroke-width="1.6" stroke-linejoin="round"/><path d="M436,184 L429.7,187.0 L429.7,181.0 Z" fill="#7a4fa0"/><text x="362" y="177" font-size="11" fill="#7a4fa0" font-weight="bold" text-anchor="start">yes</text><path d="M185,221 L185,246" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M185,246 L182.0,239.7 L188.0,239.7 Z" fill="#5b6475"/><text x="195" y="238" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">no</text><path d="M352,284 L436,284" fill="none" stroke="#c0662b" stroke-width="1.6" stroke-linejoin="round"/><path d="M436,284 L429.7,287.0 L429.7,281.0 Z" fill="#c0662b"/><text x="362" y="277" font-size="11" fill="#c0662b" font-weight="bold" text-anchor="start">yes</text><path d="M185,321 V356 H432" fill="none" stroke="#2f7d6d" stroke-width="1.6" stroke-linejoin="round"/><path d="M436,356 l-8,-5 l0,10 z" fill="#2f7d6d"/><text x="195" y="348" font-size="11" fill="#2f7d6d" font-weight="bold" text-anchor="start">no</text><text x="20" y="410" font-size="11.5" fill="#b23b3b" font-weight="bold" text-anchor="start">Never fill an identifier, a price, or a quantity with 0 or an average:</text><text x="20" y="428" font-size="11.5" fill="#b23b3b" font-weight="bold" text-anchor="start">the report would look complete and be wrong.</text></svg>