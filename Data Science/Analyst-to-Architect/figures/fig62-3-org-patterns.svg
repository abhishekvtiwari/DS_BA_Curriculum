<svg xmlns="http://www.w3.org/2000/svg" width="680" height="233" viewBox="0 0 680 233" font-family="DejaVu Sans, Arial, sans-serif"><rect width="680" height="233" fill="#ffffff"/><text x="12" y="22" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Who owns the data: three organizational patterns</text><rect x="12.0" y="36" width="212.0" height="152.4" rx="6" fill="#fff" stroke="#0f5c8c" stroke-width="1.4" /><path d="M12.0,42 a6,6 0 0 1 6,-6 H218.0 a6,6 0 0 1 6,6 V57.6 H12.0 Z" fill="#0f5c8c"/><text x="20.0" y="50.5" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start">Centralized</text><text x="20.0" y="75.1" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Who owns it: one team owns</text><text x="20.0" y="88.69999999999999" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">ingestion, models, quality, and</text><text x="20.0" y="102.3" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">delivery for everyone.</text><text x="20.0" y="119.89999999999999" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Gains: simple to govern; one set of</text><text x="20.0" y="133.5" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">standards, one place to look.</text><text x="20.0" y="151.1" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Costs: every request waits in one</text><text x="20.0" y="164.7" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">queue as the company grows.</text><rect x="234.0" y="36" width="212.0" height="152.4" rx="6" fill="#fff" stroke="#2f7d6d" stroke-width="1.4" /><path d="M234.0,42 a6,6 0 0 1 6,-6 H440.0 a6,6 0 0 1 6,6 V57.6 H234.0 Z" fill="#2f7d6d"/><text x="242.0" y="50.5" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start">Data mesh</text><text x="242.0" y="75.1" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Who owns it: each domain team</text><text x="242.0" y="88.69999999999999" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">owns its data as a product, on a</text><text x="242.0" y="102.3" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">shared self-serve platform, under</text><text x="242.0" y="115.89999999999999" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">federated governance.</text><text x="242.0" y="133.5" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Gains: removes the central queue.</text><text x="242.0" y="151.1" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Costs: needs builders in every</text><text x="242.0" y="164.7" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">domain and a mature platform.</text><rect x="456.0" y="36" width="212.0" height="152.4" rx="6" fill="#fff" stroke="#7a4fa0" stroke-width="1.4" /><path d="M456.0,42 a6,6 0 0 1 6,-6 H662.0 a6,6 0 0 1 6,6 V57.6 H456.0 Z" fill="#7a4fa0"/><text x="464.0" y="50.5" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="start">Data fabric</text><text x="464.0" y="75.1" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Who owns it: no change. Tools find</text><text x="464.0" y="88.69999999999999" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">and query data where it already</text><text x="464.0" y="102.3" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">lives: a data catalog, plus a query</text><text x="464.0" y="115.89999999999999" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">engine that reads several sources.</text><text x="464.0" y="133.5" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Gains: easier discovery, without</text><text x="464.0" y="147.1" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">moving data.</text><text x="464.0" y="164.7" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Costs: technology, not organization;</text><text x="464.0" y="178.29999999999998" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">it pairs with either of the other two.</text><text x="12" y="208.9" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">Riverstone today: centralized. Meera&#x27;s four-person data platform team (Chapter 60) serves the whole company, which fits</text><text x="12" y="222.5" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">its size. Section 62.6 checks whether that should change.</text></svg>