<svg xmlns="http://www.w3.org/2000/svg" width="700" height="404" viewBox="0 0 700 404" font-family="DejaVu Sans, Arial, sans-serif"><rect width="700" height="404" fill="#ffffff"/><text x="20" y="28" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The three places a file lives, and the commands that move it</text><text x="20" y="50" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Almost every confusing Git message is Git telling you which of these three it means.</text><rect x="22" y="73" width="172" height="196" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="20" y="70" width="172" height="196" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><path d="M20,78 a8,8 0 0 1 8,-8 H184 a8,8 0 0 1 8,8 V100 H20 Z" fill="#0f5c8c"/><text x="30" y="90" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">1  Working directory</text><text x="30" y="122" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">The files as your editor</text><text x="30" y="138" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">sees them. Edit here.</text><text x="30" y="154" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Nothing is safe here yet.</text><rect x="30" y="208" width="152" height="46" rx="5" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="38" y="228" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">monthly_revenue.sql</text><text x="38" y="245" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">(edited)</text><rect x="266" y="73" width="172" height="196" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="264" y="70" width="172" height="196" rx="8" fill="#fff" stroke="#c0662b" stroke-width="1.6" /><path d="M264,78 a8,8 0 0 1 8,-8 H428 a8,8 0 0 1 8,8 V100 H264 Z" fill="#c0662b"/><text x="274" y="90" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">2  Staging area</text><text x="274" y="122" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">What you have chosen for</text><text x="274" y="138" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">the next snapshot. A</text><text x="274" y="154" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">shopping basket.</text><rect x="274" y="208" width="152" height="46" rx="5" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="282" y="228" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">monthly_revenue.sql</text><text x="282" y="245" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">(chosen)</text><rect x="510" y="73" width="172" height="196" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="508" y="70" width="172" height="196" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><path d="M508,78 a8,8 0 0 1 8,-8 H672 a8,8 0 0 1 8,8 V100 H508 Z" fill="#2f7d6d"/><text x="518" y="90" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">3  Repository</text><text x="518" y="122" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">The history: commits, each</text><text x="518" y="138" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">with a message, a hash, and</text><text x="518" y="154" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">an author.</text><rect x="518" y="208" width="152" height="46" rx="5" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="526" y="228" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">a2a9885 Split…</text><text x="526" y="245" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">75b063a Revert…</text><text x="228.0" y="138.0" font-size="11" fill="#0f5c8c" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">git add</text><path d="M198,148.0 H250" fill="none" stroke="#0f5c8c" stroke-width="2.2" stroke-linejoin="round"/><path d="M249,143.0 L257,148.0 L249,153.0 Z" fill="#0f5c8c"/><text x="228.0" y="164.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle" font-style="italic">choose</text><text x="472.0" y="138.0" font-size="11" fill="#0f5c8c" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">git commit</text><path d="M442,148.0 H494" fill="none" stroke="#0f5c8c" stroke-width="2.2" stroke-linejoin="round"/><path d="M493,143.0 L501,148.0 L493,153.0 Z" fill="#0f5c8c"/><text x="472.0" y="164.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle" font-style="italic">record</text><path d="M258,188.0 H206" fill="none" stroke="#b23b3b" stroke-width="2" stroke-linejoin="round"/><path d="M207,183.0 L199,188.0 L207,193.0 Z" fill="#b23b3b"/><text x="228.0" y="208.0" font-size="10.5" fill="#b23b3b" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">git</text><text x="228.0" y="222.0" font-size="10.5" fill="#b23b3b" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">restore</text><path d="M502,188.0 H450" fill="none" stroke="#b23b3b" stroke-width="2" stroke-linejoin="round"/><path d="M451,183.0 L443,188.0 L451,193.0 Z" fill="#b23b3b"/><text x="472.0" y="208.0" font-size="10.5" fill="#b23b3b" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">git restore</text><text x="472.0" y="222.0" font-size="10.5" fill="#b23b3b" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">--staged</text><text x="20" y="300" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="start">And the three commands that only look:</text><rect x="20" y="309" width="104" height="22" rx="5" fill="#f6f9fc" stroke="#0f5c8c" stroke-width="1.2" /><text x="30" y="325" font-size="11" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">git status</text><text x="136" y="325" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">which files differ, and in which of the three places</text><rect x="20" y="335" width="104" height="22" rx="5" fill="#f6f9fc" stroke="#c0662b" stroke-width="1.2" /><text x="30" y="351" font-size="11" fill="#c0662b" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">git diff</text><text x="136" y="351" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">what changed in the working directory, line by line (--staged: in the staging area)</text><rect x="20" y="361" width="104" height="22" rx="5" fill="#f6f9fc" stroke="#2f7d6d" stroke-width="1.2" /><text x="30" y="377" font-size="11" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">git log</text><text x="136" y="377" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">what is already in the history</text></svg>