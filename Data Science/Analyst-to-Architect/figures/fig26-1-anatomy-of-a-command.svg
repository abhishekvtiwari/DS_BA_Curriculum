<svg xmlns="http://www.w3.org/2000/svg" width="700" height="276" viewBox="0 0 700 276" font-family="DejaVu Sans, Arial, sans-serif"><rect width="700" height="276" fill="#ffffff"/><text x="20" y="28" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Reading a command: a program, then options, then arguments</text><rect x="20" y="48" width="660" height="50" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="44.0" y="81" font-size="18" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">git</text><text x="87.36" y="81" font-size="18" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">log</text><text x="130.72" y="81" font-size="18" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">--oneline</text><text x="239.12" y="81" font-size="18" fill="#7a4fa0" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">-n 2</text><path d="M44.0,104 V108 H76.52 V104" fill="none" stroke="#1d2330" stroke-width="1.4" stroke-linejoin="round"/><path d="M60.26,108 V192 H68.25999999999999" fill="none" stroke="#1d2330" stroke-width="1.4" stroke-linejoin="round"/><text x="72.25999999999999" y="196" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="start">the program</text><path d="M87.36,104 V108 H119.88 V104" fill="none" stroke="#0f5c8c" stroke-width="1.4" stroke-linejoin="round"/><path d="M103.62,108 V170 H111.62" fill="none" stroke="#0f5c8c" stroke-width="1.4" stroke-linejoin="round"/><text x="115.62" y="174" font-size="11.5" fill="#0f5c8c" font-weight="bold" text-anchor="start">which of Git&#x27;s commands</text><path d="M130.72,104 V108 H228.28 V104" fill="none" stroke="#2f7d6d" stroke-width="1.4" stroke-linejoin="round"/><path d="M179.5,108 V148 H187.5" fill="none" stroke="#2f7d6d" stroke-width="1.4" stroke-linejoin="round"/><text x="191.5" y="152" font-size="11.5" fill="#2f7d6d" font-weight="bold" text-anchor="start">a long option: two dashes, a word</text><path d="M239.12,104 V108 H282.48 V104" fill="none" stroke="#7a4fa0" stroke-width="1.4" stroke-linejoin="round"/><path d="M260.8,108 V126 H268.8" fill="none" stroke="#7a4fa0" stroke-width="1.4" stroke-linejoin="round"/><text x="272.8" y="130" font-size="11.5" fill="#7a4fa0" font-weight="bold" text-anchor="start">a short option with a value: show 2</text><rect x="20" y="214" width="660" height="50" rx="6" fill="#fff" stroke="#c9d3df" stroke-width="1" /><text x="32" y="234" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">Arguments come last and say what to work on, often a file:</text><text x="410" y="234" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">git add monthly_revenue.sql</text><text x="32" y="254" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">Text with spaces goes in quotes, as one argument:</text><text x="345" y="254" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">git commit -m &quot;Add monthly revenue query&quot;</text></svg>