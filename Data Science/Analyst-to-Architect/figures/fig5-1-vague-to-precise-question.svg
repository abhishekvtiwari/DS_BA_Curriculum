<svg xmlns="http://www.w3.org/2000/svg" width="720" height="462" viewBox="0 0 720 462" font-family="DejaVu Sans, Arial, sans-serif"><rect width="720" height="462" fill="#ffffff"/><rect x="16" y="122" width="176" height="96" rx="8" fill="#f3f5f8" stroke="#5b6475" stroke-width="1.5" /><text x="30" y="146" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start">The request</text><text x="30" y="170" font-size="14" fill="#1d2330" font-weight="normal" text-anchor="start">“Sales are down.</text><text x="30" y="194" font-size="14" fill="#1d2330" font-weight="normal" text-anchor="start">Find out why.”</text><path d="M196,170 L228,170" fill="none" stroke="#5b6475" stroke-width="2" stroke-linejoin="round"/><path d="M228,170 L219.7,173.5 L219.7,166.5 Z" fill="#5b6475"/><rect x="236" y="16" width="468" height="54" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.4" /><circle cx="258" cy="43" r="13" fill="#0f5c8c"/><text x="258" y="48" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">1</text><text x="282" y="39" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Metric and definition</text><text x="282" y="59" font-size="13" fill="#5b6475" font-weight="normal" text-anchor="start">billed revenue (invoices raised)</text><rect x="236" y="78" width="468" height="54" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.4" /><circle cx="258" cy="105" r="13" fill="#0f5c8c"/><text x="258" y="110" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">2</text><text x="282" y="101" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Period and comparison</text><text x="282" y="121" font-size="13" fill="#5b6475" font-weight="normal" text-anchor="start">March 2026 vs February 2026</text><rect x="236" y="140" width="468" height="54" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.4" /><circle cx="258" cy="167" r="13" fill="#0f5c8c"/><text x="258" y="172" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">3</text><text x="282" y="163" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Scope</text><text x="282" y="183" font-size="13" fill="#5b6475" font-weight="normal" text-anchor="start">all customers; tax left out</text><rect x="236" y="202" width="468" height="54" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.4" /><circle cx="258" cy="229" r="13" fill="#0f5c8c"/><text x="258" y="234" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">4</text><text x="282" y="225" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Decision it serves</text><text x="282" y="245" font-size="13" fill="#5b6475" font-weight="normal" text-anchor="start">what sales does in the first week of April</text><rect x="236" y="264" width="468" height="54" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.4" /><circle cx="258" cy="291" r="13" fill="#0f5c8c"/><text x="258" y="296" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle">5</text><text x="282" y="287" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Deadline and precision</text><text x="282" y="307" font-size="13" fill="#5b6475" font-weight="normal" text-anchor="start">by Wednesday; to the nearest ₹1,000</text><path d="M470.0,322 L470.0,348" fill="none" stroke="#0f5c8c" stroke-width="2" stroke-linejoin="round"/><path d="M470.0,348 L466.5,339.7 L473.5,339.7 Z" fill="#0f5c8c"/><rect x="16" y="354" width="688" height="92" rx="8" fill="#eaf2f8" stroke="#0f5c8c" stroke-width="2" /><text x="30" y="378" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start">The precise question</text><text x="30" y="402" font-size="14" fill="#1d2330" font-weight="normal" text-anchor="start">Why was billed revenue in March 2026 (₹31,800) 80.3% lower than in February</text><text x="30" y="426" font-size="14" fill="#1d2330" font-weight="normal" text-anchor="start">(₹1,61,700), and is it a fall in demand or a matter of timing?</text></svg>