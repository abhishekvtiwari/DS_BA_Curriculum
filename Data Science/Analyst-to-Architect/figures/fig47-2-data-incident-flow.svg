<svg xmlns="http://www.w3.org/2000/svg" width="720" height="404" viewBox="0 0 720 404" font-family="DejaVu Sans, Arial, sans-serif"><rect width="720" height="404" fill="#ffffff"/><rect x="10" y="12" width="150" height="50" rx="7" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="22" y="42.0" font-size="13" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">1 · Detect</text><rect x="166" y="12" width="546" height="50" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.4" /><text x="178" y="41.0" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">A failed test, a stale table, or a person saying a number looks wrong.</text><path d="M85,63 L85,75" fill="none" stroke="#1d2330" stroke-width="1.8" stroke-linejoin="round"/><path d="M85,75 L81.1,66.9 L88.9,66.9 Z" fill="#1d2330"/><rect x="10" y="76" width="150" height="50" rx="7" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="22" y="106.0" font-size="13" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">2 · Classify</text><rect x="166" y="76" width="546" height="50" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.4" /><text x="178" y="97.0" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">S1: wrong data reached people or systems.  S2: an output is late or blocked;</text><text x="178" y="114.0" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">nothing wrong was sent.  S3: a minor problem or a warning-level failure.</text><path d="M85,127 L85,139" fill="none" stroke="#1d2330" stroke-width="1.8" stroke-linejoin="round"/><path d="M85,139 L81.1,130.9 L88.9,130.9 Z" fill="#1d2330"/><rect x="10" y="140" width="150" height="50" rx="7" fill="#c0662b" stroke="none" stroke-width="1" /><text x="22" y="170.0" font-size="13" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">3 · Contain</text><rect x="166" y="140" width="546" height="50" rx="7" fill="#fff" stroke="#c0662b" stroke-width="1.4" /><text x="178" y="161.0" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Stop publishing and syncs. Tell the people who use the data,</text><text x="178" y="178.0" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">before they find out for themselves.</text><path d="M85,191 L85,203" fill="none" stroke="#1d2330" stroke-width="1.8" stroke-linejoin="round"/><path d="M85,203 L81.1,194.9 L88.9,194.9 Z" fill="#1d2330"/><rect x="10" y="204" width="150" height="50" rx="7" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="22" y="234.0" font-size="13" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">4 · Fix and verify</text><rect x="166" y="204" width="546" height="50" rx="7" fill="#fff" stroke="#2f7d6d" stroke-width="1.4" /><text x="178" y="233.0" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Repair the cause, re-run the affected days, run the same tests, then publish.</text><path d="M85,255 L85,267" fill="none" stroke="#1d2330" stroke-width="1.8" stroke-linejoin="round"/><path d="M85,267 L81.1,258.9 L88.9,258.9 Z" fill="#1d2330"/><rect x="10" y="268" width="150" height="50" rx="7" fill="#7a4fa0" stroke="none" stroke-width="1" /><text x="22" y="298.0" font-size="13" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">5 · Review</text><rect x="166" y="268" width="546" height="50" rx="7" fill="#fff" stroke="#7a4fa0" stroke-width="1.4" /><text x="178" y="289.0" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">A blameless write-up: timeline, cause, impact, and the checks added</text><text x="178" y="306.0" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">to catch it sooner next time.</text><rect x="10" y="336" width="702" height="56" rx="7" fill="#fff4e8" stroke="#c0662b" stroke-width="1" /><text x="24" y="360" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">People forgive late data far more than wrong data they already acted on.</text><text x="24" y="380" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">So communication happens at step 3, not after step 4.</text></svg>