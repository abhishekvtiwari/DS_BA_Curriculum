<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360" font-family="DejaVu Sans, Arial, sans-serif"><rect width="860" height="360" fill="#ffffff"/><rect x="250" y="90" width="162" height="102" rx="6" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="331.0" y="132" font-size="26" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">100</text><text x="331.0" y="160" font-size="12" fill="#fff" font-weight="normal" text-anchor="middle">True positives</text><rect x="420" y="90" width="162" height="102" rx="6" fill="#c0662b" stroke="none" stroke-width="1" /><text x="501.0" y="132" font-size="26" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">386</text><text x="501.0" y="160" font-size="12" fill="#fff" font-weight="normal" text-anchor="middle">False positives</text><rect x="250" y="200" width="162" height="102" rx="6" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="331.0" y="242" font-size="26" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">46</text><text x="331.0" y="270" font-size="12" fill="#fff" font-weight="normal" text-anchor="middle">False negatives</text><rect x="420" y="200" width="162" height="102" rx="6" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="501.0" y="242" font-size="26" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">1,693</text><text x="501.0" y="270" font-size="12" fill="#fff" font-weight="normal" text-anchor="middle">True negatives</text><text x="331.0" y="76" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="middle">Actually won</text><text x="501.0" y="76" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="middle">Actually lost</text><text x="236" y="145.0" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="end">Predicted won</text><text x="236" y="129.0" font