<svg xmlns="http://www.w3.org/2000/svg" width="700" height="460" viewBox="0 0 700 460" font-family="DejaVu Sans, Arial, sans-serif"><rect width="700" height="460" fill="#ffffff"/><text x="20" y="24" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Bill of materials: quantities multiply as you go down</text><text x="8" y="130" font-size="10.5" fill="#5b6475" font-weight="bold" text-anchor="start">depth 1</text><text x="8" y="202" font-size="10.5" fill="#5b6475" font-weight="bold" text-anchor="start">depth 2</text><text x="8" y="284" font-size="10.5" fill="#5b6475" font-weight="bold" text-anchor="start">depth 3</text><rect x="290" y="40" width="150" height="40" rx="6" fill="#fff" stroke="#1d2330" stroke-width="1.4" /><text x="365.0" y="57.25" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="middle">Garden Chair (106)</text><text x="365.0" y="70.75" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">product, 1 unit</text><path d="M365,80 V94 H150 V104" fill="none" stroke="#c9d3df" stroke-width="1.4" stroke-linejoin="round"/><rect x="90" y="104" width="120" height="44" rx="6" fill="#fff" stroke="#0f5c8c" stroke-width="1.4" /><text x="150.0" y="123.25" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="middle">Seat shell</text><text x="150.0" y="136.75" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">assembly, × 1</text><path d="M365,80 V94 H290 V104" fill="none" stroke="#c9d3df" stroke-width="1.4" stroke-linejoin="round"/><rect x="230" y="104" width="120" height="44" rx="6" fill="#fff" stroke="#0f5c8c" stroke-width="1.4" /><text x="290.0" y="123.25" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="middle">Steel frame</text><text x="290.0" y="136.75" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">assembly, × 1</text><path d="M365,80 V94 H430 V104" fill="none" stroke="#c9d3df" stroke-width="1.4" stroke-linejoin="round"/><rect x="370" y="104" width="120" height="44" rx="6" fill="#fff" stroke="#2f7d6d" stroke-width="1.4" /><text x="430.0" y="123.25" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="middle">Product label</text><text x="430.0" y="136.75" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">material, × 1</text><path d="M365,80 V94 H570 V104" fill="none" stroke="#c9d3df" stroke-width="1.4" stroke-linejoin="round"/><rect x="510" y="104" width="120" height="44" rx="6" fill="#fff" stroke="#2f7d6d" stroke-width="1.4" /><text x="570.0" y="123.25" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="middle">Shipping carton</text><text x="570.0" y="136.75" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">material, × 1</text><path d="M150,148 V166 H135 V176" fill="none" stroke="#c9d3df" stroke-width="1.4" stroke-linejoin="round"/><rect x="80" y="176" width="110" height="56" rx="6" fill="#fff" stroke="#2f7d6d" stroke-width="1.4" /><text x="135.0" y="194.5" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="middle">PP granules</text><text x="135.0" y="208.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">× 2.2 kg</text><text x="135.0" y="221.5" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">material</text><path d="M150,148 V166 H253 V176" fill="none" stroke="#c9d3df" stroke-width="1.4" stroke-linejoin="round"/><rect x="198" y="176" width="110" height="56" rx="6" fill="#fff" stroke="#2f7d6d" stroke-width="1.4" /><text x="253.0" y="194.5" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="middle">Masterbatch</text><text x="253.0" y="208.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">× 0.08 kg</text><text x="253.0" y="221.5" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">material</text><path d="M290,148 V166 H371 V176" fill="none" stroke="#c9d3df" stroke-width="1.4" stroke-linejoin="round"/><rect x="316" y="176" width="110" height="56" rx="6" fill="#fff" stroke="#0f5c8c" stroke-width="1.4" /><text x="371.0" y="194.5" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="middle">Leg assembly</text><text x="371.0" y="208.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">× 2</text><text x="371.0" y="221.5" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">assembly</text><path d="M290,148 V166 H489 V176" fill="none" stroke="#c9d3df" stroke-width="1.4" stroke-linejoin="round"/><rect x="434" y="176" width="110" height="56" rx="6" fill="#fff" stroke="#2f7d6d" stroke-width="1.4" /><text x="489.0" y="194.5" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="middle">Steel tube</text><text x="489.0" y="208.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">× 1.0 kg</text><text x="489.0" y="221.5" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">material</text><path d="M290,148 V166 H607 V176" fill="none" stroke="#c9d3df" stroke-width="1.4" stroke-linejoin="round"/><rect x="552" y="176" width="110" height="56" rx="6" fill="#fff" stroke="#2f7d6d" stroke-width="1.4" /><text x="607.0" y="194.5" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="middle">Fastener pack</text><text x="607.0" y="208.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">× 1</text><text x="607.0" y="221.5" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">material</text><path d="M371,232 V248 H365 V258" fill="none" stroke="#c9d3df" stroke-width="1.4" stroke-linejoin="round"/><rect x="300" y="258" width="130" height="44" rx="6" fill="#fbeee4" stroke="#c0662b" stroke-width="1.4" /><text x="365.0" y="277.25" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="middle">Steel tube</text><text x="365.0" y="290.75" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">1.2 kg × 2 = 2.4 kg</text><path d="M371,232 V248 H515 V258" fill="none" stroke="#c9d3df" stroke-width="1.4" stroke-linejoin="round"/><rect x="450" y="258" width="130" height="44" rx="6" fill="#fbeee4" stroke="#c0662b" stroke-width="1.4" /><text x="515.0" y="277.25" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="middle">Fastener pack</text><text x="515.0" y="290.75" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">1 × 2 = 2</text><text x="20" y="332" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">Depth-3 boxes (shaded) are found on the second pass of the recursive part: each child&#x27;s quantity is</text><text x="20" y="348" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">multiplied by its parent&#x27;s running quantity. Steel tube appears twice: 1.0 kg + 2.4 kg = 3.4 kg per chair.</text><rect x="20" y="364" width="660" height="84" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="32" y="384" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">Material cost of one chair</text><text x="32" y="404" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">PP granules 2.2 kg × ₹110 = ₹242.00</text><text x="32" y="420" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Masterbatch 0.08 kg × ₹260 = ₹20.80</text><text x="32" y="436" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Steel tube 3.4 kg × ₹95 = ₹323.00</text><text x="360" y="404" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Fasteners 3 × ₹14 = ₹42.00</text><text x="360" y="420" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Label ₹2 + carton ₹18 = ₹20.00</text><text x="360" y="436" font-size="10.5" fill="#1d2330" font-weight="bold" text-anchor="start">Total ₹647.80</text></svg>