<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="390" viewBox="0 0 1040 390" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1040" height="390" fill="#ffffff"/><text x="30" y="32" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The threshold is a business decision, not a modelling one</text><path d="M120,330 H640" fill="none" stroke="#5b6475" stroke-width="1.4" stroke-linejoin="round"/><path d="M120,330 V70" fill="none" stroke="#5b6475" stroke-width="1.4" stroke-linejoin="round"/><path d="M120,305.0 H640" fill="none" stroke="#c9d3df" stroke-width="0.8" stroke-linejoin="round" stroke-dasharray="3,4"/><text x="110" y="309.0" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="end">₹15k</text><path d="M120,263.3333333333333 H640" fill="none" stroke="#c9d3df" stroke-width="0.8" stroke-linejoin="round" stroke-dasharray="3,4"/><text x="110" y="267.3333333333333" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="end">₹20k</text><path d="M120,180.0 H640" fill="none" stroke="#c9d3df" stroke-width="0.8" stroke-linejoin="round" stroke-dasharray="3,4"/><text x="110" y="184.0" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="end">₹30k</text><path d="M120,96.66666666666666 H640" fill="none" stroke="#c9d3df" stroke-width="0.8" stroke-linejoin="round" stroke-dasharray="3,4"/><text x="110" y="100.66666666666666" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="end">₹40k</text><path d="M120.0,96.0 L191.42857142857144,162.66666666666666 L262.8571428571429,228.0 L334.2857142857143,258.3333333333333 L405.7142857142857,287.3333333333333 L477.14285714285717,314.6666666666667 L548.5714285714286,299.0 L620.0,261.6666666666667" fill="none" stroke="#0f5c8c" stroke-width="2.5" stroke-linejoin="round"/><rect x="115.0" y="91.0" width="10" height="10" rx="5" fill="#0f5c8c" stroke="#0f5c8c" stroke-width="1" /><text x="120.0" y="350" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">0.5</text><rect x="186.42857142857144" y="157.66666666666666" width="10" height="10" rx="5" fill="#0f5c8c" stroke="#0f5c8c" stroke-width="1" /><text x="191.42857142857144" y="350" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">0.3</text><rect x="257.8571428571429" y="223.0" width="10" height="10" rx="5" fill="#0f5c8c" stroke="#0f5c8c" stroke-width="1" /><text x="262.8571428571429" y="350" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">0.1</text><rect x="329.2857142857143" y="253.33333333333331" width="10" height="10" rx="5" fill="#0f5c8c" stroke="#0f5c8c" stroke-width="1" /><text x="334.2857142857143" y="350" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">0.05</text><rect x="400.7142857142857" y="282.3333333333333" width="10" height="10" rx="5" fill="#0f5c8c" stroke="#0f5c8c" stroke-width="1" /><text x="405.7142857142857" y="350" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">0.02</text><rect x="472.14285714285717" y="309.6666666666667" width="10" height="10" rx="5" fill="#2f7d6d" stroke="#2f7d6d" stroke-width="1" /><text x="477.14285714285717" y="350" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">0.01</text><rect x="543.5714285714286" y="294.0" width="10" height="10" rx="5" fill="#0f5c8c" stroke="#0f5c8c" stroke-width="1" /><text x="548.5714285714286" y="350" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">0.005</text><rect x="615.0" y="256.6666666666667" width="10" height="10" rx="5" fill="#0f5c8c" stroke="#0f5c8c" stroke-width="1" /><text x="620.0" y="350" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">0.002</text><text x="477.14285714285717" y="298.6666666666667" font-size="12" fill="#2f7d6d" font-weight="bold" text-anchor="middle">cheapest: ₹13,840</text><text x="370" y="372" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="middle">decision threshold</text><rect x="700" y="80" width="310" height="250" rx="8" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="718" y="108" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">A missed defect costs ₹4,000.</text><text x="718" y="128" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">A false alarm costs ₹40.</text><text x="718" y="148" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start"></text><text x="718" y="168" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">At 0.50: 10 missed, 2 re-inspected</text><text x="718" y="188" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">At 0.01: 3 missed, 46 re-inspected</text><text x="718" y="208" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start"></text><text x="718" y="228" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">Same model, same data.</text><text x="718" y="248" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Only the threshold changed, and the</text><text x="718" y="268" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">bill fell by two thirds.</text><text x="718" y="288" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start"></text><text x="718" y="308" font-size="11.5" fill="#5b6475" font-weight="bold" text-anchor="start">Accuracy is 92% at every row,</text><text x="718" y="328" font-size="11.5" fill="#5b6475" font-weight="bold" text-anchor="start">which is why nobody should quote it.</text></svg>