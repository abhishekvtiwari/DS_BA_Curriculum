7</text><rect x="480" y="178" width="54" height="46" rx="4" fill="#e6edf4" stroke="#c9d3df" stroke-width="1" /><text x="487" y="196" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">off 5</text><text x="487" y="215" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="start">M-21</text><rect x="538" y="178" width="54" height="46" rx="4" fill="#fff" stroke="#c9d3df" stroke-width="1" stroke-dasharray="4 3"/><text x="545" y="196" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">off 6</text><text x="545" y="215" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">next</text><path d="M536.0,112 V132" fill="none" stroke="#2f7d6d" stroke-width="1.8" stroke-linejoin="round"/><path d="M536.0,111 l-5,9 h10 Z" fill="#2f7d6d"/><text x="530.0" y="134" font-size="11" fill="#2f7d6d" font-weight="bold" text-anchor="end">both groups: offset 6</text><path d="M362.0,226 V246" fill="none" stroke="#c0662b" stroke-width="1.8" stroke-linejoin="round"/><path d="M362.0,225 l-5,9 h10 Z" fill="#c0662b"/><text x="368.0" y="248" font-size="11" fill="#c0662b" font-weight="bold" text-anchor="start">alerting: offset 3 (lag 3)</text><path d="M536.0,226 V264" fill="none" stroke="#2f7d6d" stroke-width="1.8" stroke-linejoin="round"/><path d="M536.0,225 l-5,9 h10 Z" fill="#2f7d6d"/><text x="530.0" y="266" font-size="11" fill="#2f7d6d" font-weight="bold" text-anchor="end">scrap-monitor: offset 6 (lag 0)</text><text x="610" y="24" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Consumer groups</text><rect x="610" y="48" width="142" height="78" rx="7" fill="#fbfcfe" stroke="#2f7d6d" stroke-width="1.5" /><rect x="610" y="48" width="6" height="78" rx="3" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="626" y="72" font-size="12.5" fill="#2f7d6d" font-weight="bold" text-anchor="start">scrap-monitor</text><text x="626" y="94" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">offsets: 6 and 6</text><text x="626" y="112" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">lag 0: up to date</text><rect x="610" y="160" width="142" height="96" rx="7" fill="#fbfcfe" stroke="#c0662b" stroke-width="1.5" /><rect x="610" y="160" width="6" height="96" rx="3" fill="#c0662b" stroke="none" stroke-width="1" /><text x="626" y="184" font-size="12.5" fill="#c0662b" font-weight="bold" text-anchor="start">alerting</text><text x="626" y="206" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">offsets: 6 and 3</text><text x="626" y="224" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">lag 3: three events</text><text x="626" y="242" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="start">behind in partition 1</text><path d="M16,296 H744" fill="none" stroke="#c9d3df" stroke-width="1" stroke-linejoin="round"/><text x="16" y="320" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="start">Order is guaranteed inside a partition: every M-07 reading is in partition 1, in the order it was sent.</text><text x="16" y="342" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">Across partitions there is no order: that is the price of reading them in parallel.</text><text x="16" y="364" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">A committed offset is the next position the group will read, so offset 3 means offsets 0, 1 and 2 are done.</text></svg>