<svg xmlns="http://www.w3.org/2000/svg" width="1114" height="466" viewBox="0 0 1114 466" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1114" height="466" fill="#ffffff"/><text x="34" y="36" font-size="15.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The three places a file lives, and the commands that move it</text><text x="34" y="60" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Almost every confusing Git message is Git telling you which of these three it means.</text><rect x="36" y="89" width="250" height="210" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="34" y="86" width="250" height="210" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><path d="M34,94 a8,8 0 0 1 8,-8 H276 a8,8 0 0 1 8,8 V120 H34 Z" fill="#0f5c8c"/><text x="46" y="109" font-size="13" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">1  Working directory</text><text x="46" y="144" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">The files as your editor sees</text><text x="46" y="161" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">them. Edit here. Nothing is safe</text><text x="46" y="178" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">here.</text><rect x="46" y="222" width="226" height="56" rx="5" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="54" y="242" font-size="10" fill="#5b6475" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">monthly_revenue.sql</text><text x="54" y="262" font-size="10" fill="#5b6475" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">  (edited, unsaved to Git)</text><rect x="434" y="89" width="250" height="210" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="432" y="86" width="250" height="210" rx="8" fill="#fff" stroke="#c0662b" stroke-width="1.6" /><path d="M432,94 a8,8 0 0 1 8,-8 H674 a8,8 0 0 1 8,8 V120 H432 Z" fill="#c0662b"/><text x="444" y="109" font-size="13" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">2  Staging area</text><text x="444" y="144" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">What you have chosen to put in</text><text x="444" y="161" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">the next snapshot. A shopping</text><text x="444" y="178" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">basket.</text><rect x="444" y="222" width="226" height="56" rx="5" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="452" y="242" font-size="10" fill="#5b6475" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">monthly_revenue.sql</text><text x="452" y="262" font-size="10" fill="#5b6475" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">  (selected for commit)</text><rect x="832" y="89" width="250" height="210" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="830" y="86" width="250" height="210" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><path d="M830,94 a8,8 0 0 1 8,-8 H1072 a8,8 0 0 1 8,8 V120 H830 Z" fill="#2f7d6d"/><text x="842" y="109" font-size="13" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">3  Repository (history)</text><text x="842" y="144" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Commits. Permanent, each with a</text><text x="842" y="161" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">message, a hash, and an author.</text><rect x="842" y="222" width="226" height="56" rx="5" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="850" y="242" font-size="10" fill="#5b6475" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">6489661 Split monthly revenue</text><text x="850" y="262" font-size="10" fill="#5b6475" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">1bed4f9 Revert &quot;Limit the...&quot;</text><path d="M298,175.0 H412" fill="none" stroke="#0f5c8c" stroke-width="2.4" stroke-linejoin="round"/><path d="M412,170.0 L419,175.0 L412,180.0 Z" fill="#0f5c8c"/><text x="358.0" y="165.0" font-size="12" fill="#0f5c8c" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">git add</text><text x="358.0" y="193.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle" font-style="italic">choose</text><path d="M696,175.0 H810" fill="none" stroke="#0f5c8c" stroke-width="2.4" stroke-linejoin="round"/><path d="M810,170.0 L817,175.0 L810,180.0 Z" fill="#0f5c8c"/><text x="756.0" y="165.0" font-size="12" fill="#0f5c8c" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">git commit</text><text x="756.0" y="193.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle" font-style="italic">record</text><path d="M418,231.0 H304" fill="none" stroke="#b23b3b" stroke-width="2" stroke-linejoin="round"/><path d="M304,226.0 L297,231.0 L304,236.0 Z" fill="#b23b3b"/><text x="358.0" y="253.0" font-size="10.5" fill="#b23b3b" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">git restore</text><path d="M816,231.0 H702" fill="none" stroke="#b23b3b" stroke-width="2" stroke-linejoin="round"/><path d="M702,226.0 L695,231.0 L702,236.0 Z" fill="#b23b3b"/><text x="756.0" y="253.0" font-size="10.5" fill="#b23b3b" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">git restore</text><text x="756.0" y="268.0" font-size="10.5" fill="#b23b3b" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">--staged</text><text x="34" y="342" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">And the three commands that only look:</text><rect x="34" y="354" width="156" height="22" rx="5" fill="#f6f9fc" stroke="#0f5c8c" stroke-width="1.2" /><text x="44" y="370" font-size="11.5" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">git status</text><text x="206" y="370" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">which files differ, and in which of the three</text><rect x="34" y="382" width="156" height="22" rx="5" fill="#f6f9fc" stroke="#c0662b" stroke-width="1.2" /><text x="44" y="398" font-size="11.5" fill="#c0662b" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">git diff</text><text x="206" y="398" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">what changed in the working directory, line by line</text><rect x="34" y="410" width="156" height="22" rx="5" fill="#f6f9fc" stroke="#2f7d6d" stroke-width="1.2" /><text x="44" y="426" font-size="11.5" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">git log</text><text x="206" y="426" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">what is already in the history</text></svg>