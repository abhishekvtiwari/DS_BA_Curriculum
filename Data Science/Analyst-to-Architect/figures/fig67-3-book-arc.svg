<svg xmlns="http://www.w3.org/2000/svg" width="660" height="146" viewBox="0 0 660 146" font-family="DejaVu Sans, Arial, sans-serif"><rect width="660" height="146" fill="#ffffff"/><text x="6" y="22" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The arc of this book, in one line</text><path d="M60,84 H600" fill="none" stroke="#c9d3df" stroke-width="2" stroke-linejoin="round"/><text x="60" y="50" font-size="10.0" fill="#5b6475" font-weight="bold" text-anchor="middle">Parts 0–1</text><text x="60" y="64" font-size="10.6" fill="#5b6475" font-weight="bold" text-anchor="middle">Ch 1–9</text><circle cx="60" cy="84" r="7" fill="#5b6475"/><text x="60" y="108" font-size="10.0" fill="#1d2330" font-weight="normal" text-anchor="middle">What data is,</text><text x="60" y="121" font-size="10.0" fill="#1d2330" font-weight="normal" text-anchor="middle">and where it</text><text x="60" y="134" font-size="10.0" fill="#1d2330" font-weight="normal" text-anchor="middle">can take you</text><text x="168" y="50" font-size="10.0" fill="#5b6475" font-weight="bold" text-anchor="middle">Part 2</text><text x="168" y="64" font-size="10.6" fill="#0f5c8c" font-weight="bold" text-anchor="middle">Ch 10–27</text><circle cx="168" cy="84" r="7" fill="#0f5c8c"/><text x="168" y="108" font-size="10.0" fill="#1d2330" font-weight="normal" text-anchor="middle">One query (Ch 12)</text><text x="168" y="121" font-size="10.0" fill="#1d2330" font-weight="normal" text-anchor="middle">to one trusted</text><text x="168" y="134" font-size="10.0" fill="#1d2330" font-weight="normal" text-anchor="middle">automation (Ch 20)</text><text x="276" y="50" font-size="10.0" fill="#5b6475" font-weight="bold" text-anchor="middle">Parts 3–4</text><text x="276" y="64" font-size="10.6" fill="#2f7d6d" font-weight="bold" text-anchor="middle">Ch 28–44</text><circle cx="276" cy="84" r="7" fill="#2f7d6d"/><text x="276" y="108" font-size="10.0" fill="#1d2330" font-weight="normal" text-anchor="middle">Engineering</text><text x="276" y="121" font-size="10.0" fill="#1d2330" font-weight="normal" text-anchor="middle">discipline</text><text x="276" y="134" font-size="10.0" fill="#1d2330" font-weight="normal" text-anchor="middle">and models</text><text x="384" y="50" font-size="10.0" fill="#5b6475" font-weight="bold" text-anchor="middle">Parts 5–6</text><text x="384" y="64" font-size="10.6" fill="#2f6690" font-weight="bold" text-anchor="middle">Ch 45–59</text><circle cx="384" cy="84" r="7" fill="#2f6690"/><text x="384" y="108" font-size="10.0" fill="#1d2330" font-weight="normal" text-anchor="middle">Pipelines and AI</text><text x="384" y="121" font-size="10.0" fill="#1d2330" font-weight="normal" text-anchor="middle">in production</text><text x="492" y="50" font-size="10.0" fill="#5b6475" font-weight="bold" text-anchor="middle">Part 7</text><text x="492" y="64" font-size="10.6" fill="#b7791f" font-weight="bold" text-anchor="middle">Ch 60–66</text><circle cx="492" cy="84" r="7" fill="#b7791f"/><text x="492" y="108" font-size="10.0" fill="#1d2330" font-weight="normal" text-anchor="middle">A platform designed,</text><text x="492" y="121" font-size="10.0" fill="#1d2330" font-weight="normal" text-anchor="middle">governed, secured</text><text x="492" y="134" font-size="10.0" fill="#1d2330" font-weight="normal" text-anchor="middle">and costed</text><text x="600" y="50" font-size="10.0" fill="#5b6475" font-weight="bold" text-anchor="middle">Part 7</text><text x="600" y="64" font-size="10.6" fill="#b23b3b" font-weight="bold" text-anchor="middle">Ch 67</text><circle cx="600" cy="84" r="7" fill="#b23b3b"/><text x="600" y="108" font-size="10.0" fill="#1d2330" font-weight="normal" text-anchor="middle">Led, and someone</text><text x="600" y="121" font-size="10.0" fill="#1d2330" font-weight="normal" text-anchor="middle">else’s turn to</text><text x="600" y="134" font-size="10.0" fill="#1d2330" font-weight="normal" text-anchor="middle">learn from you</text></svg>