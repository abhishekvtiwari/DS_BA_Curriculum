<svg xmlns="http://www.w3.org/2000/svg" width="1058" height="340" viewBox="0 0 1058 340" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1058" height="340" fill="#ffffff"/><text x="30" y="34" font-size="15" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The core toolkit, in the order the book first uses it</text><rect x="32" y="73" width="182" height="180" rx="10" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="30" y="70" width="182" height="180" rx="10" fill="#fff" stroke="#0f5c8c" stroke-width="1.8" /><path d="M30,80 a10,10 0 0 1 10,-10 H202 a10,10 0 0 1 10,10 V110 H30 Z" fill="#0f5c8c"/><text x="42" y="96" font-size="13.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Spreadsheets</text><text x="42" y="132" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">Excel or</text><text x="42" y="148" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">Google Sheets</text><text x="42" y="174" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">First used:</text><text x="42" y="191" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">Ch 10–11, 19</text><text x="42" y="220" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">Runs on:</text><text x="42" y="237" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Windows, Mac, browser</text><path d="M215,155 L231,155" fill="none" stroke="#c9d3df" stroke-width="2" stroke-linejoin="round"/><path d="M231,155 L222.7,158.5 L222.7,151.5 Z" fill="#c9d3df"/><rect x="236" y="73" width="182" height="180" rx="10" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="234" y="70" width="182" height="180" rx="10" fill="#fff" stroke="#2f7d6d" stroke-width="1.8" /><path d="M234,80 a10,10 0 0 1 10,-10 H406 a10,10 0 0 1 10,10 V110 H234 Z" fill="#2f7d6d"/><text x="246" y="96" font-size="13.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Databases</text><text x="246" y="132" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">PostgreSQL, MySQL,</text><text x="246" y="148" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">DBeaver</text><text x="246" y="174" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">First used:</text><text x="246" y="191" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">Ch 12–13, 14, 28</text><text x="246" y="220" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">Runs on:</text><text x="246" y="237" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Windows, Mac, Linux</text><path d="M419,155 L435,155" fill="none" stroke="#c9d3df" stroke-width="2" stroke-linejoin="round"/><path d="M435,155 L426.7,158.5 L426.7,151.5 Z" fill="#c9d3df"/><rect x="440" y="73" width="182" height="180" rx="10" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="438" y="70" width="182" height="180" rx="10" fill="#fff" stroke="#c0662b" stroke-width="1.8" /><path d="M438,80 a10,10 0 0 1 10,-10 H610 a10,10 0 0 1 10,10 V110 H438 Z" fill="#c0662b"/><text x="450" y="96" font-size="13.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Business intelligence</text><text x="450" y="132" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">Power BI</text><text x="450" y="148" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">Desktop</text><text x="450" y="174" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">First used:</text><text x="450" y="191" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">Ch 16</text><text x="450" y="220" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">Runs on:</text><text x="450" y="237" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Windows only</text><path d="M623,155 L639,155" fill="none" stroke="#c9d3df" stroke-width="2" stroke-linejoin="round"/><path d="M639,155 L630.7,158.5 L630.7,151.5 Z" fill="#c9d3df"/><rect x="644" y="73" width="182" height="180" rx="10" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="642" y="70" width="182" height="180" rx="10" fill="#fff" stroke="#7a4fa0" stroke-width="1.8" /><path d="M642,80 a10,10 0 0 1 10,-10 H814 a10,10 0 0 1 10,10 V110 H642 Z" fill="#7a4fa0"/><text x="654" y="96" font-size="13.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Python</text><text x="654" y="132" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">Python, VS Code,</text><text x="654" y="148" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">Jupyter</text><text x="654" y="174" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">First used:</text><text x="654" y="191" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">Ch 17–18, 20–22, Part 4</text><text x="654" y="220" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">Runs on:</text><text x="654" y="237" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Windows, Mac, Linux</text><path d="M827,155 L843,155" fill="none" stroke="#c9d3df" stroke-width="2" stroke-linejoin="round"/><path d="M843,155 L834.7,158.5 L834.7,151.5 Z" fill="#c9d3df"/><rect x="848" y="73" width="182" height="180" rx="10" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="846" y="70" width="182" height="180" rx="10" fill="#fff" stroke="#5b6475" stroke-width="1.8" /><path d="M846,80 a10,10 0 0 1 10,-10 H1018 a10,10 0 0 1 10,10 V110 H846 Z" fill="#5b6475"/><text x="858" y="96" font-size="13.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Version control</text><text x="858" y="132" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">Git</text><text x="858" y="174" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">First used:</text><text x="858" y="191" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">Ch 26 onward</text><text x="858" y="220" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">Runs on:</text><text x="858" y="237" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Windows, Mac, Linux</text><rect x="30" y="275" width="998" height="44" rx="8" fill="#f3f5f8" stroke="none" stroke-width="1" /><text x="44" y="302" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">Later parts install their own tools when you reach them: dbt, the command line, cloud accounts, containers, and ML libraries.</text></svg>