<svg xmlns="http://www.w3.org/2000/svg" width="720" height="228" viewBox="0 0 720 228" font-family="DejaVu Sans, Arial, sans-serif"><rect width="720" height="228" fill="#ffffff"/><text x="20" y="26" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Three prompts, 60 emails, one number each</text><text x="20" y="46" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">Measured on the chapter&#x27;s stand-in model: the method is real, the numbers illustrate it.</text><text x="140" y="85" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="end">naive</text><rect x="150" y="66" width="400" height="28" rx="4" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><rect x="150" y="66" width="86.66666666666667" height="28" rx="4" fill="#b23b3b" stroke="#b23b3b" stroke-width="1" /><text x="244.66666666666669" y="85" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">13 of 60</text><text x="560" y="78" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">fields 161/240</text><text x="560" y="92" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">3 unparseable</text><text x="140" y="125" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="end">with instructions</text><rect x="150" y="106" width="400" height="28" rx="4" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><rect x="150" y="106" width="233.33333333333334" height="28" rx="4" fill="#c0662b" stroke="#c0662b" stroke-width="1" /><text x="391.33333333333337" y="125" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">35 of 60</text><text x="560" y="118" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">fields 215/240</text><text x="560" y="132" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">0 unparseable</text><text x="140" y="165" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="end">plus one example</text><rect x="150" y="146" width="400" height="28" rx="4" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><rect x="150" y="146" width="313.3333333333333" height="28" rx="4" fill="#2f7d6d" stroke="#2f7d6d" stroke-width="1" /><text x="471.3333333333333" y="165" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">47 of 60</text><text x="560" y="158" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">fields 227/240</text><text x="560" y="172" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">0 unparseable</text><text x="150" y="190" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">bar = emails fully correct (all four fields right)</text><text x="20" y="216" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">Same stand-in, same emails, same marking: only the wording of the prompt changed.</text></svg>