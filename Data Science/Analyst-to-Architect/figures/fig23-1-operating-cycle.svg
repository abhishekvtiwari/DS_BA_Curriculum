<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="DejaVu Sans, Arial, sans-serif"><rect width="680" height="300" fill="#ffffff"/><text x="20" y="26" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The cash cycle, as a timeline (Riverstone&#x27;s days, worked out in section 23.3)</text><path d="M40,150 H640" fill="none" stroke="#1d2330" stroke-width="1.5" stroke-linejoin="round"/><circle cx="40.0" cy="150" r="5" fill="#1d2330"/><text x="40.0" y="172" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start">Day 0</text><text x="40.0" y="187" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">stock arrives</text><circle cx="275.1" cy="150" r="5" fill="#1d2330"/><text x="275.0515463917526" y="172" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="middle">Day 38</text><text x="275.0515463917526" y="187" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">we pay supplier</text><circle cx="380.2" cy="150" r="5" fill="#1d2330"/><text x="380.2061855670103" y="172" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="middle">Day 55</text><text x="380.2061855670103" y="187" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">stock is sold</text><circle cx="640.0" cy="150" r="5" fill="#1d2330"/><text x="640.0" y="172" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="end">Day 97</text><text x="640.0" y="187" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="end">customer pays</text><rect x="40.0" y="92" width="340.2061855670103" height="26" rx="3" fill="#fbe7da" stroke="#c0662b" stroke-width="1.2" /><text x="210.10309278350516" y="109" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="middle">DIO 55 days: stock waits to be sold</text><rect x="380.2061855670103" y="92" width="259.7938144329897" height="26" rx="3" fill="#ece3f4" stroke="#7a4fa0" stroke-width="1.2" /><text x="510.1030927835052" y="109" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="middle">DSO 42 days: waiting to be paid</text><path d="M40.0,74 V84 H640.0 V74" fill="none" stroke="#5b6475" stroke-width="1" stroke-linejoin="round"/><text x="340.0" y="68" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="middle">Operating cycle = DIO + DSO = 97 days</text><rect x="40.0" y="204" width="235.0515463917526" height="26" rx="3" fill="#fbf0d9" stroke="#b7791f" stroke-width="1.2" /><text x="157.5257731958763" y="221" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="middle">DPO 38 days: supplier&#x27;s credit</text><rect x="275.0515463917526" y="204" width="364.9484536082474" height="26" rx="3" fill="#f6dede" stroke="#b23b3b" stroke-width="1.2" stroke-dasharray="5 3"/><text x="457.5257731958763" y="221" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="middle">Cash conversion cycle 59 days: our own cash is tied up</text><text x="20" y="262" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="start">Cash conversion cycle = DIO + DSO − DPO = 55 + 42 − 38 = 59 days.</text><text x="20" y="282" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">The company can be profitable all the while: the gap is about timing, not about profit.</text></svg>