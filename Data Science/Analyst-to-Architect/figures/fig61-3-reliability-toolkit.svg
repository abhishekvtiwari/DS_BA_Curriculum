<svg xmlns="http://www.w3.org/2000/svg" width="740" height="456" viewBox="0 0 740 456" font-family="DejaVu Sans, Arial, sans-serif"><rect width="740" height="456" fill="#ffffff"/><text x="20" y="30" font-size="16" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The reliability toolkit</text><rect x="23" y="54" width="226" height="108" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="20" y="50" width="226" height="108" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><path d="M20,58 a8,8 0 0 1 8,-8 H238 a8,8 0 0 1 8,8 V78 H20 Z" fill="#0f5c8c"/><text x="133.0" y="69" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Partitioning &amp; sharding</text><text x="133.0" y="98" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="middle">Partition: split one table by</text><text x="133.0" y="115" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="middle">a key. Shard: put the pieces</text><text x="133.0" y="132" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="middle">on different servers</text><rect x="20" y="164" width="226" height="50" rx="6" fill="#f3f6fa" stroke="none" stroke-width="1" /><text x="133.0" y="184" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">Sensor archive: partitioned by</text><text x="133.0" y="200" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">month (Ch 49), not sharded</text><rect x="260" y="54" width="226" height="108" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="257" y="50" width="226" height="108" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><path d="M257,58 a8,8 0 0 1 8,-8 H475 a8,8 0 0 1 8,8 V78 H257 Z" fill="#2f7d6d"/><text x="370.0" y="69" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Replication</text><text x="370.0" y="98" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="middle">Keep copies for availability</text><text x="370.0" y="115" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="middle">and durability; copies of data</text><text x="370.0" y="132" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="middle">can lag: a consistency cost</text><rect x="257" y="164" width="226" height="50" rx="6" fill="#f3f6fa" stroke="none" stroke-width="1" /><text x="370.0" y="184" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">replicas: 2 keeps two copies</text><text x="370.0" y="200" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">of the Flash page (Ch 52)</text><rect x="497" y="54" width="226" height="108" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="494" y="50" width="226" height="108" rx="8" fill="#fff" stroke="#b7791f" stroke-width="1.6" /><path d="M494,58 a8,8 0 0 1 8,-8 H712 a8,8 0 0 1 8,8 V78 H494 Z" fill="#b7791f"/><text x="607.0" y="69" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Load balancing</text><text x="607.0" y="98" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="middle">Spread requests across copies</text><text x="607.0" y="115" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="middle">of one service, so no single</text><text x="607.0" y="132" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="middle">copy is swamped</text><rect x="494" y="164" width="226" height="50" rx="6" fill="#f3f6fa" stroke="none" stroke-width="1" /><text x="607.0" y="184" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">A Kubernetes Service sends each</text><text x="607.0" y="200" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">request to a ready copy (Ch 52)</text><rect x="23" y="238" width="226" height="108" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="20" y="234" width="226" height="108" rx="8" fill="#fff" stroke="#7a4fa0" stroke-width="1.6" /><path d="M20,242 a8,8 0 0 1 8,-8 H238 a8,8 0 0 1 8,8 V262 H20 Z" fill="#7a4fa0"/><text x="133.0" y="253" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Caching</text><text x="133.0" y="282" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="middle">Serve repeats from memory;</text><text x="133.0" y="299" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="middle">the hard part is knowing</text><text x="133.0" y="316" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="middle">when an answer is stale</text><rect x="20" y="348" width="226" height="50" rx="6" fill="#f3f6fa" stroke="none" stroke-width="1" /><text x="133.0" y="368" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">Exact-match cache (Ch 57):</text><text x="133.0" y="384" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">17% saved on a normal day</text><rect x="260" y="238" width="226" height="108" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="257" y="234" width="226" height="108" rx="8" fill="#fff" stroke="#b23b3b" stroke-width="1.6" /><path d="M257,242 a8,8 0 0 1 8,-8 H475 a8,8 0 0 1 8,8 V262 H257 Z" fill="#b23b3b"/><text x="370.0" y="253" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Message queues</text><text x="370.0" y="282" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="middle">Put a log between producer</text><text x="370.0" y="299" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="middle">and consumer; absorb bursts</text><text x="370.0" y="316" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="middle">without losing work</text><rect x="257" y="348" width="226" height="50" rx="6" fill="#f3f6fa" stroke="none" stroke-width="1" /><text x="370.0" y="368" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">MessageLog (Ch 50): topics,</text><text x="370.0" y="384" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">partitions, offsets, like Kafka</text><rect x="497" y="238" width="226" height="108" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="494" y="234" width="226" height="108" rx="8" fill="#fff" stroke="#2f6690" stroke-width="1.6" /><path d="M494,242 a8,8 0 0 1 8,-8 H712 a8,8 0 0 1 8,8 V262 H494 Z" fill="#2f6690"/><text x="607.0" y="253" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Scaling up or out</text><text x="607.0" y="282" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="middle">Up: one bigger machine.</text><text x="607.0" y="299" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="middle">Out: more machines sharing</text><text x="607.0" y="316" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="middle">the work</text><rect x="494" y="348" width="226" height="50" rx="6" fill="#f3f6fa" stroke="none" stroke-width="1" /><text x="607.0" y="368" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">Up: a bigger warehouse server.</text><text x="607.0" y="384" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">Out: a second defect-model copy</text><text x="20" y="424" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">None of these is exotic: Parts 5 and 6 already use most of them. This chapter names</text><text x="20" y="441" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">them as a reusable kit, and each one has a cost.</text></svg>