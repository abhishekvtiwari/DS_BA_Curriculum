<svg xmlns="http://www.w3.org/2000/svg" width="990" height="304" viewBox="0 0 990 304" font-family="DejaVu Sans, Arial, sans-serif"><rect width="990" height="304" fill="#ffffff"/><text x="30" y="30" font-size="14.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The reliability toolkit</text><rect x="33" y="64" width="175" height="140" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="30" y="60" width="175" height="140" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><path d="M30,68 a8,8 0 0 1 8,-8 H197 a8,8 0 0 1 8,8 V86 H30 Z" fill="#0f5c8c"/><text x="117.5" y="78" font-size="10.8" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Sharding</text><text x="117.5" y="104" font-size="8.8" fill="#1d2330" font-weight="normal" text-anchor="middle">Split data across machines</text><text x="117.5" y="119" font-size="8.8" fill="#1d2330" font-weight="normal" text-anchor="middle">by key, so no one machine</text><text x="117.5" y="134" font-size="8.8" fill="#1d2330" font-weight="normal" text-anchor="middle">holds it all</text><rect x="30" y="206" width="175" height="50" rx="6" fill="#f3f6fa" stroke="none" stroke-width="1" /><text x="117.5" y="224" font-size="9.4" fill="#5b6475" font-weight="normal" text-anchor="middle">Warehouse partitioned</text><text x="117.5" y="239" font-size="9.4" fill="#5b6475" font-weight="normal" text-anchor="middle">by reading_date (Ch 49)</text><rect x="225" y="64" width="175" height="140" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="222" y="60" width="175" height="140" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><path d="M222,68 a8,8 0 0 1 8,-8 H389 a8,8 0 0 1 8,8 V86 H222 Z" fill="#2f7d6d"/><text x="309.5" y="78" font-size="10.8" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Replication</text><text x="309.5" y="104" font-size="8.8" fill="#1d2330" font-weight="normal" text-anchor="middle">Keep copies for availability</text><text x="309.5" y="119" font-size="8.8" fill="#1d2330" font-weight="normal" text-anchor="middle">and durability, at a</text><text x="309.5" y="134" font-size="8.8" fill="#1d2330" font-weight="normal" text-anchor="middle">consistency cost</text><rect x="222" y="206" width="175" height="50" rx="6" fill="#f3f6fa" stroke="none" stroke-width="1" /><text x="309.5" y="224" font-size="9.4" fill="#5b6475" font-weight="normal" text-anchor="middle">Postgres read replicas</text><text x="309.5" y="239" font-size="9.4" fill="#5b6475" font-weight="normal" text-anchor="middle">for BI queries</text><rect x="417" y="64" width="175" height="140" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="414" y="60" width="175" height="140" rx="8" fill="#fff" stroke="#b7791f" stroke-width="1.6" /><path d="M414,68 a8,8 0 0 1 8,-8 H581 a8,8 0 0 1 8,8 V86 H414 Z" fill="#b7791f"/><text x="501.5" y="78" font-size="10.8" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Load balancing</text><text x="501.5" y="104" font-size="8.8" fill="#1d2330" font-weight="normal" text-anchor="middle">Spread requests across</text><text x="501.5" y="119" font-size="8.8" fill="#1d2330" font-weight="normal" text-anchor="middle">multiple instances of</text><text x="501.5" y="134" font-size="8.8" fill="#1d2330" font-weight="normal" text-anchor="middle">the same service</text><rect x="414" y="206" width="175" height="50" rx="6" fill="#f3f6fa" stroke="none" stroke-width="1" /><text x="501.5" y="224" font-size="9.4" fill="#5b6475" font-weight="normal" text-anchor="middle">The defect-model</text><text x="501.5" y="239" font-size="9.4" fill="#5b6475" font-weight="normal" text-anchor="middle">FastAPI service, scaled</text><rect x="609" y="64" width="175" height="140" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="606" y="60" width="175" height="140" rx="8" fill="#fff" stroke="#7a4fa0" stroke-width="1.6" /><path d="M606,68 a8,8 0 0 1 8,-8 H773 a8,8 0 0 1 8,8 V86 H606 Z" fill="#7a4fa0"/><text x="693.5" y="78" font-size="10.8" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Caching</text><text x="693.5" y="104" font-size="8.8" fill="#1d2330" font-weight="normal" text-anchor="middle">Serve from memory for</text><text x="693.5" y="119" font-size="8.8" fill="#1d2330" font-weight="normal" text-anchor="middle">speed; the hard part is</text><text x="693.5" y="134" font-size="8.8" fill="#1d2330" font-weight="normal" text-anchor="middle">knowing when it&#x27;s stale</text><rect x="606" y="206" width="175" height="50" rx="6" fill="#f3f6fa" stroke="none" stroke-width="1" /><text x="693.5" y="224" font-size="9.4" fill="#5b6475" font-weight="normal" text-anchor="middle">LLMOps prompt cache</text><text x="693.5" y="239" font-size="9.4" fill="#5b6475" font-weight="normal" text-anchor="middle">(Ch 57): 81% hit rate</text><rect x="801" y="64" width="175" height="140" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="798" y="60" width="175" height="140" rx="8" fill="#fff" stroke="#b23b3b" stroke-width="1.6" /><path d="M798,68 a8,8 0 0 1 8,-8 H965 a8,8 0 0 1 8,8 V86 H798 Z" fill="#b23b3b"/><text x="885.5" y="78" font-size="10.8" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Message queues</text><text x="885.5" y="104" font-size="8.8" fill="#1d2330" font-weight="normal" text-anchor="middle">Decouple producer from</text><text x="885.5" y="119" font-size="8.8" fill="#1d2330" font-weight="normal" text-anchor="middle">consumer; absorb bursts</text><text x="885.5" y="134" font-size="8.8" fill="#1d2330" font-weight="normal" text-anchor="middle">without losing work</text><rect x="798" y="206" width="175" height="50" rx="6" fill="#f3f6fa" stroke="none" stroke-width="1" /><text x="885.5" y="224" font-size="9.4" fill="#5b6475" font-weight="normal" text-anchor="middle">The mini-log pattern</text><text x="885.5" y="239" font-size="9.4" fill="#5b6475" font-weight="normal" text-anchor="middle">(Ch 50)</text><text x="30" y="286" font-size="11.3" fill="#5b6475" font-weight="normal" text-anchor="start">None of these is exotic — Parts 5 and 6 already use every one. This chapter names them as a reusable kit.</text></svg>