<svg xmlns="http://www.w3.org/2000/svg" width="720" height="416" viewBox="0 0 720 416" font-family="DejaVu Sans, Arial, sans-serif"><rect width="720" height="416" fill="#ffffff"/><text x="20" y="24" font-size="15" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Who secures what, at each service level</text><text x="20" y="46" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Each cell says who is responsible; the heavy line is where the split falls.</text><text x="327.0" y="68" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="middle">IaaS</text><text x="485.0" y="68" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="middle">PaaS</text><text x="643.0" y="68" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="middle">SaaS</text><text x="20" y="105" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">Your data, and who can access it</text><rect x="252" y="83" width="150" height="34" rx="5" fill="#fff4e8" stroke="#c0662b" stroke-width="1" /><text x="327.0" y="105" font-size="12" fill="#c0662b" font-weight="bold" text-anchor="middle">You</text><rect x="410" y="83" width="150" height="34" rx="5" fill="#fff4e8" stroke="#c0662b" stroke-width="1" /><text x="485.0" y="105" font-size="12" fill="#c0662b" font-weight="bold" text-anchor="middle">You</text><rect x="568" y="83" width="150" height="34" rx="5" fill="#fff4e8" stroke="#c0662b" stroke-width="1" /><text x="643.0" y="105" font-size="12" fill="#c0662b" font-weight="bold" text-anchor="middle">You</text><text x="20" y="145" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">How you configure the service</text><rect x="252" y="123" width="150" height="34" rx="5" fill="#fff4e8" stroke="#c0662b" stroke-width="1" /><text x="327.0" y="145" font-size="12" fill="#c0662b" font-weight="bold" text-anchor="middle">You</text><rect x="410" y="123" width="150" height="34" rx="5" fill="#fff4e8" stroke="#c0662b" stroke-width="1" /><text x="485.0" y="145" font-size="12" fill="#c0662b" font-weight="bold" text-anchor="middle">You</text><rect x="568" y="123" width="150" height="34" rx="5" fill="#fff4e8" stroke="#c0662b" stroke-width="1" /><text x="643.0" y="145" font-size="12" fill="#c0662b" font-weight="bold" text-anchor="middle">You: your settings</text><text x="20" y="185" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Application code</text><rect x="252" y="163" width="150" height="34" rx="5" fill="#fff4e8" stroke="#c0662b" stroke-width="1" /><text x="327.0" y="185" font-size="12" fill="#c0662b" font-weight="bold" text-anchor="middle">You</text><rect x="410" y="163" width="150" height="34" rx="5" fill="#fff4e8" stroke="#c0662b" stroke-width="1" /><text x="485.0" y="185" font-size="12" fill="#c0662b" font-weight="bold" text-anchor="middle">You</text><rect x="568" y="163" width="150" height="34" rx="5" fill="#eaf1f8" stroke="#0f5c8c" stroke-width="1" /><text x="643.0" y="185" font-size="12" fill="#0f5c8c" font-weight="normal" text-anchor="middle">Provider</text><text x="20" y="225" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Operating system and runtime</text><rect x="252" y="203" width="150" height="34" rx="5" fill="#fff4e8" stroke="#c0662b" stroke-width="1" /><text x="327.0" y="225" font-size="12" fill="#c0662b" font-weight="bold" text-anchor="middle">You</text><rect x="410" y="203" width="150" height="34" rx="5" fill="#eaf1f8" stroke="#0f5c8c" stroke-width="1" /><text x="485.0" y="225" font-size="12" fill="#0f5c8c" font-weight="normal" text-anchor="middle">Provider</text><rect x="568" y="203" width="150" height="34" rx="5" fill="#eaf1f8" stroke="#0f5c8c" stroke-width="1" /><text x="643.0" y="225" font-size="12" fill="#0f5c8c" font-weight="normal" text-anchor="middle">Provider</text><text x="20" y="265" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Virtualization layer</text><rect x="252" y="243" width="150" height="34" rx="5" fill="#eaf1f8" stroke="#0f5c8c" stroke-width="1" /><text x="327.0" y="265" font-size="12" fill="#0f5c8c" font-weight="normal" text-anchor="middle">Provider</text><rect x="410" y="243" width="150" height="34" rx="5" fill="#eaf1f8" stroke="#0f5c8c" stroke-width="1" /><text x="485.0" y="265" font-size="12" fill="#0f5c8c" font-weight="normal" text-anchor="middle">Provider</text><rect x="568" y="243" width="150" height="34" rx="5" fill="#eaf1f8" stroke="#0f5c8c" stroke-width="1" /><text x="643.0" y="265" font-size="12" fill="#0f5c8c" font-weight="normal" text-anchor="middle">Provider</text><text x="20" y="305" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Hardware and data centres</text><rect x="252" y="283" width="150" height="34" rx="5" fill="#eaf1f8" stroke="#0f5c8c" stroke-width="1" /><text x="327.0" y="305" font-size="12" fill="#0f5c8c" font-weight="normal" text-anchor="middle">Provider</text><rect x="410" y="283" width="150" height="34" rx="5" fill="#eaf1f8" stroke="#0f5c8c" stroke-width="1" /><text x="485.0" y="305" font-size="12" fill="#0f5c8c" font-weight="normal" text-anchor="middle">Provider</text><rect x="568" y="283" width="150" height="34" rx="5" fill="#eaf1f8" stroke="#0f5c8c" stroke-width="1" /><text x="643.0" y="305" font-size="12" fill="#0f5c8c" font-weight="normal" text-anchor="middle">Provider</text><path d="M249,240 H405" fill="none" stroke="#1d2330" stroke-width="3.2" stroke-linejoin="round"/><text x="327.0" y="338" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="middle" font-style="italic">e.g. a virtual server</text><path d="M407,200 H563" fill="none" stroke="#1d2330" stroke-width="3.2" stroke-linejoin="round"/><text x="485.0" y="338" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="middle" font-style="italic">e.g. managed PostgreSQL</text><path d="M565,160 H721" fill="none" stroke="#1d2330" stroke-width="3.2" stroke-linejoin="round"/><text x="643.0" y="338" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="middle" font-style="italic">e.g. a CRM, Gmail</text><rect x="20" y="354" width="680" height="50" rx="7" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="34" y="375" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">The line moves with what you rent. What never moves:</text><text x="34" y="394" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">your data, who can access it, and how you configure the service are always yours.</text></svg>