<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="400" viewBox="0 0 1040 400" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1040" height="400" fill="#ffffff"/><text x="30" y="32" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The pipeline that makes a fallible model safe to automate</text><rect x="30" y="80" width="150" height="70" rx="8" fill="#fff" stroke="#c9d3df" stroke-width="1.8" /><text x="105" y="108" font-size="12.5" fill="#c9d3df" font-weight="bold" text-anchor="middle">email</text><text x="105" y="130" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">60 in the inbox</text><path d="M180,115 H194" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M188,109 L196,115 L188,121" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><rect x="194" y="80" width="150" height="70" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.8" /><text x="269" y="108" font-size="12.5" fill="#0f5c8c" font-weight="bold" text-anchor="middle">prompt</text><text x="269" y="130" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">instructions above, data below</text><path d="M344,115 H358" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M352,109 L360,115 L352,121" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><rect x="358" y="80" width="150" height="70" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.8" /><text x="433" y="108" font-size="12.5" fill="#2f7d6d" font-weight="bold" text-anchor="middle">model</text><text x="433" y="130" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">returns JSON (usually)</text><path d="M508,115 H522" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M516,109 L524,115 L516,121" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><rect x="522" y="80" width="150" height="70" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.8" /><text x="597" y="108" font-size="12.5" fill="#0f5c8c" font-weight="bold" text-anchor="middle">parse</text><text x="597" y="130" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">strip fences, json.loads</text><path d="M672,115 H686" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M680,109 L688,115 L680,121" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><rect x="686" y="80" width="150" height="70" rx="8" fill="#fff" stroke="#7a4fa0" stroke-width="1.8" /><text x="761" y="108" font-size="12.5" fill="#7a4fa0" font-weight="bold" text-anchor="middle">validate</text><text x="761" y="130" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">business rules, not just format</text><path d="M836,115 H850" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M844,109 L852,115 L844,121" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><rect x="850" y="80" width="150" height="70" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.8" /><text x="925" y="108" font-size="12.5" fill="#2f7d6d" font-weight="bold" text-anchor="middle">load</text><text x="925" y="130" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">59 of 60 automatically</text><path d="M640,150 V196" fill="none" stroke="#c0662b" stroke-width="2" stroke-linejoin="round" stroke-dasharray="5,4"/><rect x="470" y="196" width="340" height="54" rx="8" fill="#fdf3dc" stroke="#c0662b" stroke-width="1.6" /><text x="640" y="220" font-size="12" fill="#c0662b" font-weight="bold" text-anchor="middle">retry once, with the problems listed</text><text x="640" y="240" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">&quot;delivery_date not YYYY-MM-DD: &#x27;04 Mar&#x27;&quot;</text><path d="M810,223 H900 V150" fill="none" stroke="#c0662b" stroke-width="2" stroke-linejoin="round" stroke-dasharray="5,4"/><path d="M640,250 V292" fill="none" stroke="#b23b3b" stroke-width="2" stroke-linejoin="round"/><rect x="470" y="292" width="340" height="54" rx="8" fill="#fbeaea" stroke="#b23b3b" stroke-width="1.6" /><text x="640" y="316" font-size="12" fill="#b23b3b" font-weight="bold" text-anchor="middle">still failing: needs_a_human</text><text x="640" y="336" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="middle">1 of 60, with the reason attached</text><text x="30" y="380" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Every arrow is code you write, not model behaviour you hope for. The status a step returns is what a dashboard counts and what a person acts on.</text></svg>