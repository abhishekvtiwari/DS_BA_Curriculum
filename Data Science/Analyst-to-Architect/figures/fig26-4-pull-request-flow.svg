<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420" font-family="DejaVu Sans, Arial, sans-serif"><rect width="700" height="420" fill="#ffffff"/><text x="20" y="28" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">From a branch to merged: the loop you will run every working day</text><text x="20" y="50" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">Branch, commit, push, open a pull request, review, merge. Then pull main and delete the branch.</text><path d="M70,104 H672" fill="none" stroke="#5b6475" stroke-width="3" stroke-linejoin="round"/><text x="20" y="109" font-size="12" fill="#5b6475" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">main</text><text x="20" y="189" font-size="12" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">branch</text><path d="M150,104 C180,104 180,184 220,184" fill="none" stroke="#0f5c8c" stroke-width="3" stroke-linejoin="round"/><path d="M220,184 H530" fill="none" stroke="#0f5c8c" stroke-width="3" stroke-linejoin="round"/><path d="M530,184 C570,184 570,104 600,104" fill="none" stroke="#0f5c8c" stroke-width="3" stroke-linejoin="round"/><circle cx="90" cy="104" r="7" fill="#fff" stroke="#5b6475" stroke-width="2.6"/><circle cx="150" cy="104" r="7" fill="#fff" stroke="#5b6475" stroke-width="2.6"/><circle cx="600" cy="104" r="7" fill="#fff" stroke="#5b6475" stroke-width="2.6"/><circle cx="660" cy="104" r="7" fill="#fff" stroke="#5b6475" stroke-width="2.6"/><circle cx="260" cy="184" r="7" fill="#fff" stroke="#0f5c8c" stroke-width="2.6"/><circle cx="340" cy="184" r="7" fill="#fff" stroke="#0f5c8c" stroke-width="2.6"/><text x="146" y="70" font-size="10.5" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">1  git switch -c</text><text x="146" y="85" font-size="10.5" fill="#0f5c8c" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">add-order-count</text><text x="300" y="214" font-size="10.5" fill="#1f6fa3" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">2  commit, then</text><text x="300" y="229" font-size="10.5" fill="#1f6fa3" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">git push -u origin</text><text x="300" y="244" font-size="10.5" fill="#1f6fa3" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">add-order-count</text><text x="604" y="70" font-size="10.5" fill="#2f7d6d" font-weight="bold" text-anchor="end" font-family="DejaVu Sans Mono, monospace">4  merge on GitHub,</text><text x="604" y="85" font-size="10.5" fill="#2f7d6d" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">then git pull</text><rect x="386" y="209" width="290" height="134" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="384" y="206" width="290" height="134" rx="8" fill="#fff" stroke="#7a4fa0" stroke-width="1.6" /><path d="M384,214 a8,8 0 0 1 8,-8 H666 a8,8 0 0 1 8,8 V236 H384 Z" fill="#7a4fa0"/><text x="394" y="226" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">3  The pull request</text><text x="396" y="258" font-size="10.5" fill="#5b6475" font-weight="bold" text-anchor="start">Title</text><text x="480" y="258" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">says what changed, not &quot;fix query&quot;</text><text x="396" y="279" font-size="10.5" fill="#5b6475" font-weight="bold" text-anchor="start">Description</text><text x="480" y="279" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">what, why, and how you checked</text><text x="396" y="300" font-size="10.5" fill="#5b6475" font-weight="bold" text-anchor="start">Review</text><text x="480" y="300" font-size="10.5" fill="#7a4fa0" font-weight="normal" text-anchor="start">questions before demands</text><text x="396" y="321" font-size="10.5" fill="#5b6475" font-weight="bold" text-anchor="start">Check</text><text x="480" y="321" font-size="10.5" fill="#2f7d6d" font-weight="normal" text-anchor="start">green before it can merge</text><path d="M529.0,206 V191" fill="none" stroke="#7a4fa0" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="4 4"/><path d="M20,368 H680" fill="none" stroke="#c9d3df" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="4 4"/><text x="20" y="390" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start">Nothing here is optional at work. Even a one-line change goes round this loop,</text><text x="20" y="408" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start">which is why the loop has to be cheap.</text></svg>