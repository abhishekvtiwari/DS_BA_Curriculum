<svg xmlns="http://www.w3.org/2000/svg" width="680" height="334" viewBox="0 0 680 334" font-family="DejaVu Sans, Arial, sans-serif"><rect width="680" height="334" fill="#ffffff"/><text x="16" y="26" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Power: the chance of catching an effect that is really there</text><path d="M60,262 H650" fill="none" stroke="#c9d3df" stroke-width="0.8" stroke-linejoin="round" stroke-dasharray="3,4"/><text x="52" y="266" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="end">0%</text><path d="M60,220.0 H650" fill="none" stroke="#c9d3df" stroke-width="0.8" stroke-linejoin="round" stroke-dasharray="3,4"/><text x="52" y="224.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="end">20%</text><path d="M60,178.0 H650" fill="none" stroke="#c9d3df" stroke-width="0.8" stroke-linejoin="round" stroke-dasharray="3,4"/><text x="52" y="182.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="end">40%</text><path d="M60,136.0 H650" fill="none" stroke="#c9d3df" stroke-width="0.8" stroke-linejoin="round" stroke-dasharray="3,4"/><text x="52" y="140.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="end">60%</text><path d="M60,94.0 H650" fill="none" stroke="#c9d3df" stroke-width="0.8" stroke-linejoin="round" stroke-dasharray="3,4"/><text x="52" y="98.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="end">80%</text><path d="M60,52.0 H650" fill="none" stroke="#c9d3df" stroke-width="0.8" stroke-linejoin="round" stroke-dasharray="3,4"/><text x="52" y="56.0" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="end">100%</text><path d="M60,262 H650" fill="none" stroke="#5b6475" stroke-width="1.2" stroke-linejoin="round"/><text x="60.0" y="279" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">0k</text><text x="158.33333333333331" y="279" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">10k</text><text x="256.66666666666663" y="279" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">20k</text><text x="355.0" y="279" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">30k</text><text x="453.3333333333333" y="279" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">40k</text><text x="551.6666666666667" y="279" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">50k</text><text x="650.0" y="279" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">60k</text><text x="355.0" y="298" font-size="11" fill="#1d2330" font-weight="normal" text-anchor="middle">visitors per group</text><path d="M69.8,243.8 L79.7,235.8 L89.5,227.7 L99.3,219.6 L109.2,211.4 L119.0,203.3 L128.8,195.4 L138.7,187.6 L148.5,179.9 L158.3,172.5 L168.2,165.3 L178.0,158.4 L187.8,151.8 L197.7,145.4 L207.5,139.4 L217.3,133.6 L227.2,128.1 L237.0,122.9 L246.8,117.9 L256.7,113.3 L266.5,108.9 L276.3,104.8 L286.2,100.9 L296.0,97.3 L305.8,93.9 L315.7,90.7 L325.5,87.7 L335.3,84.9 L345.2,82.4 L355.0,80.0 L364.8,77.7 L374.7,75.7 L384.5,73.7 L394.3,72.0 L404.2,70.3 L414.0,68.8 L423.8,67.4 L433.7,66.1 L443.5,64.9 L453.3,63.8 L463.2,62.8 L473.0,61.9 L482.8,61.0 L492.7,60.2 L502.5,59.5 L512.3,58.8 L522.2,58.2 L532.0,57.7 L541.8,57.2 L551.7,56.7 L561.5,56.3 L571.3,55.9 L581.2,55.5 L591.0,55.2 L600.8,54.9 L610.7,54.7 L620.5,54.4 L630.3,54.2 L640.2,54.0 L650.0,53.8" fill="none" stroke="#0f5c8c" stroke-width="2.5" stroke-linejoin="round"/><path d="M60,93.85083614567034 H305.83333333333337 V262" fill="none" stroke="#2f7d6d" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="5,4"/><rect x="300.83333333333337" y="88.85083614567034" width="10" height="10" rx="5" fill="#2f7d6d" stroke="#2f7d6d" stroke-width="1" /><text x="315.83333333333337" y="115.85083614567034" font-size="11" fill="#2f7d6d" font-weight="bold" text-anchor="start">25,000 per group: 80% power</text><rect x="104.16666666666666" y="206.43775220159722" width="10" height="10" rx="5" fill="#9b2c2c" stroke="#9b2c2c" stroke-width="1" /><text x="121.16666666666666" y="213.43775220159722" font-size="11" fill="#9b2c2c" font-weight="normal" text-anchor="start">5,000 per group: 24% power, so the</text><text x="121.16666666666666" y="227.43775220159722" font-size="11" fill="#9b2c2c" font-weight="normal" text-anchor="start">test misses this effect 3 times in 4</text><text x="16" y="322" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">+0.5 percentage points on a 3.9% baseline, at the 5% level.</text></svg>