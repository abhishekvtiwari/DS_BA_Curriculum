<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="392" viewBox="0 0 1040 392" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1040" height="392" fill="#ffffff"/><text x="30" y="32" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Power: the chance of catching an effect that is really there</text><path d="M90,300 H900" fill="none" stroke="#5b6475" stroke-width="1.4" stroke-linejoin="round"/><path d="M90,300 V60" fill="none" stroke="#5b6475" stroke-width="1.4" stroke-linejoin="round"/><path d="M85,300 H900" fill="none" stroke="#c9d3df" stroke-width="0.8" stroke-linejoin="round" stroke-dasharray="3,4"/><text x="78" y="304" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="end">0%</text><path d="M85,254.0 H900" fill="none" stroke="#c9d3df" stroke-width="0.8" stroke-linejoin="round" stroke-dasharray="3,4"/><text x="78" y="258.0" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="end">20%</text><path d="M85,208.0 H900" fill="none" stroke="#c9d3df" stroke-width="0.8" stroke-linejoin="round" stroke-dasharray="3,4"/><text x="78" y="212.0" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="end">40%</text><path d="M85,162.0 H900" fill="none" stroke="#c9d3df" stroke-width="0.8" stroke-linejoin="round" stroke-dasharray="3,4"/><text x="78" y="166.0" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="end">60%</text><path d="M85,116.0 H900" fill="none" stroke="#c9d3df" stroke-width="0.8" stroke-linejoin="round" stroke-dasharray="3,4"/><text x="78" y="120.0" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="end">80%</text><path d="M85,70.0 H900" fill="none" stroke="#c9d3df" stroke-width="0.8" stroke-linejoin="round" stroke-dasharray="3,4"/><text x="78" y="74.0" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="end">100%</text><text x="90.0" y="320" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">0k</text><text x="225.0" y="320" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">10k</text><text x="360.0" y="320" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">20k</text><text x="495.0" y="320" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">30k</text><text x="630.0" y="320" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">40k</text><text x="765.0" y="320" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">50k</text><text x="900.0" y="320" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="middle">60k</text><path d="M103.5,279.99 L123.75,266.88 L157.5,244.57 L225.0,202.01999999999998 L292.5,165.68 L360.0,137.16 L427.5,115.76999999999998 L495.0,100.59 L630.0,82.88000000000002 L765.0,75.06 L900.0,72.07" fill="none" stroke="#0f5c8c" stroke-width="2.5" stroke-linejoin="round"/><path d="M90,116.0 H427.5" fill="none" stroke="#2f7d6d" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5,4"/><path d="M427.5,300 V116.0" fill="none" stroke="#2f7d6d" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5,4"/><rect x="422.5" y="110.76999999999998" width="10" height="10" rx="5" fill="#2f7d6d" stroke="#2f7d6d" stroke-width="1" /><text x="454.5" y="155.1" font-size="12" fill="#2f7d6d" font-weight="bold" text-anchor="start">25,000 per group: 80% power</text><text x="198.0" y="267.8" font-size="12" fill="#b23b3b" font-weight="normal" text-anchor="start">at 5,000 per group the test</text><text x="198.0" y="281.6" font-size="12" fill="#b23b3b" font-weight="normal" text-anchor="start">misses this effect 3 times in 4</text><text x="495" y="342" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="middle">visitors per group</text><text x="30" y="372" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Detecting +0.5 percentage points on a 3.9% baseline, at the 5% level. Halving the effect you want to catch costs four times the data.</text></svg>