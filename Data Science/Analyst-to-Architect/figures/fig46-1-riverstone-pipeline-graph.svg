<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390" font-family="DejaVu Sans, Arial, sans-serif"><rect width="760" height="390" fill="#ffffff"/><rect x="16" y="14" width="728" height="54" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="30" y="36" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">Schedule: 30 6 * * *  ·  Asia/Kolkata</text><text x="30" y="56" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">Each run builds the last complete day: the 6:30 run on 6 Jan builds partition 2026-01-05</text><rect x="23" y="96" width="215" height="56" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="20" y="92" width="215" height="56" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><rect x="20" y="92" width="7" height="56" rx="3" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="36" y="116" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">raw_orders</text><text x="36" y="135" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">whole table: hash + upsert</text><rect x="23" y="170" width="215" height="56" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="20" y="166" width="215" height="56" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><rect x="20" y="166" width="7" height="56" rx="3" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="36" y="190" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">raw_order_items</text><text x="36" y="209" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">whole table: hash + upsert</text><rect x="23" y="244" width="215" height="56" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="20" y="240" width="215" height="56" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><rect x="20" y="240" width="7" height="56" rx="3" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="36" y="264" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">raw_dispatch</text><text x="36" y="283" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">one day&#x27;s file, column check</text><rect x="23" y="318" width="215" height="56" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="20" y="314" width="215" height="56" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><rect x="20" y="314" width="7" height="56" rx="3" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="36" y="338" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">raw_crm_leads</text><text x="36" y="357" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">whole list: API, retry policy</text><rect x="293" y="134" width="200" height="56" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="290" y="130" width="200" height="56" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><rect x="290" y="130" width="7" height="56" rx="3" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="306" y="154" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">daily_flash</text><text x="306" y="173" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">per day: partition overwrite</text><path d="M239,120 L286,150" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M286,150 L277.1,148.9 L281.3,142.3 Z" fill="#1d2330"/><path d="M239,194 L286,166" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M286,166 L281.0,173.5 L277.0,166.8 Z" fill="#1d2330"/><rect x="290" y="214" width="200" height="66" rx="8" fill="#fff4d6" stroke="#e2c46b" stroke-width="1.4" /><text x="304" y="238" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">check: flash_matches_erp</text><text x="304" y="260" font-size="11.5" fill="#b23b3b" font-weight="bold" text-anchor="start">blocking: a failure</text><text x="304" y="275" font-size="11.5" fill="#b23b3b" font-weight="bold" text-anchor="start">stops delivery</text><path d="M390,186 V212" fill="none" stroke="#c9a53f" stroke-width="2" stroke-linejoin="round" stroke-dasharray="4 3"/><rect x="548" y="134" width="195" height="56" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="545" y="130" width="195" height="56" rx="8" fill="#fff" stroke="#7a4fa0" stroke-width="1.6" /><rect x="545" y="130" width="7" height="56" rx="3" fill="#7a4fa0" stroke="none" stroke-width="1" /><text x="561" y="154" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">deliver_flash</text><text x="561" y="173" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">per day: outbox + log</text><path d="M494,158 L541,158" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M541,158 L532.9,161.9 L532.9,154.1 Z" fill="#1d2330"/><rect x="290" y="304" width="450" height="66" rx="8" fill="#fbfcfe" stroke="#c9d3df" stroke-width="1" /><text x="304" y="328" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">raw_dispatch and raw_crm_leads have no arrow into the Flash:</text><text x="304" y="348" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">their failures don&#x27;t stop the sales numbers.</text></svg>