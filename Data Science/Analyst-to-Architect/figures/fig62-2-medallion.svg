<svg xmlns="http://www.w3.org/2000/svg" width="680" height="355" viewBox="0 0 680 355" font-family="DejaVu Sans, Arial, sans-serif"><rect width="680" height="355" fill="#ffffff"/><text x="12" y="22" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Medallion: bronze, silver, gold, and what sits on top</text><text x="150" y="46" font-size="10.5" fill="#5b6475" font-weight="bold" text-anchor="start">What it holds</text><text x="422" y="46" font-size="10.5" fill="#5b6475" font-weight="bold" text-anchor="start">Where this book built it</text><rect x="12" y="54" width="128" height="54.8" rx="6" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" stroke-dasharray="5,3"/><text x="76.0" y="79.4" font-size="10.5" fill="#0f5c8c" font-weight="bold" text-anchor="middle">ON TOP</text><text x="76.0" y="93.0" font-size="10.5" fill="#0f5c8c" font-weight="bold" text-anchor="middle">Semantic layer</text><rect x="150" y="54" width="262" height="54.8" rx="6" fill="#fff" stroke="#0f5c8c" stroke-width="1.2" stroke-dasharray="5,3"/><text x="158" y="71.5" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">One definition per metric (revenue, active</text><text x="158" y="85.1" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">customer), reading gold tables. Not a fourth</text><text x="158" y="98.7" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">tier.</text><rect x="422" y="54" width="246" height="54.8" rx="6" fill="#eef2f7" stroke="none" stroke-width="1" /><text x="430" y="71.5" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Chapter 32, section 32.13 (the</text><text x="430" y="85.1" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">net_revenue macro); Chapter 16&#x27;s</text><text x="430" y="98.7" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">semantic model</text><path d="M76.0,128.8 L76.0,111.8" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M76.0,111.8 L79.0,118.1 L73.0,118.1 Z" fill="#5b6475"/><text x="84.0" y="123.8" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">reads</text><rect x="12" y="130.8" width="128" height="54.8" rx="6" fill="#9a6512" stroke="#9a6512" stroke-width="1.6" /><text x="76.0" y="156.20000000000002" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="middle">GOLD</text><text x="76.0" y="169.8" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="middle">Modeled (marts)</text><rect x="150" y="130.8" width="262" height="54.8" rx="6" fill="#fff" stroke="#9a6512" stroke-width="1.2" /><text x="158" y="148.3" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Business-ready tables built around the</text><text x="158" y="161.9" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">questions people ask: revenue by month,</text><text x="158" y="175.5" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">on-time delivery.</text><rect x="422" y="130.8" width="246" height="54.8" rx="6" fill="#eef2f7" stroke="none" stroke-width="1" /><text x="430" y="148.3" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Chapter 45&#x27;s modeled layer; Chapter 32&#x27;s</text><text x="430" y="161.9" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">marts, built with dbt</text><path d="M76.0,205.60000000000002 L76.0,188.60000000000002" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M76.0,188.60000000000002 L79.0,194.9 L73.0,194.9 Z" fill="#5b6475"/><text x="84.0" y="200.60000000000002" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">built from</text><rect x="12" y="207.60000000000002" width="128" height="54.8" rx="6" fill="#6b7383" stroke="#6b7383" stroke-width="1.6" /><text x="76.0" y="233.00000000000003" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="middle">SILVER</text><text x="76.0" y="246.60000000000002" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="middle">Staging</text><rect x="150" y="207.60000000000002" width="262" height="54.8" rx="6" fill="#fff" stroke="#6b7383" stroke-width="1.2" /><text x="158" y="225.10000000000002" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Cleaned, typed, deduplicated, and conformed</text><text x="158" y="238.70000000000002" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">to one shape, but not yet built around</text><text x="158" y="252.3" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">business questions.</text><rect x="422" y="207.60000000000002" width="246" height="54.8" rx="6" fill="#eef2f7" stroke="none" stroke-width="1" /><text x="430" y="225.10000000000002" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Chapter 45&#x27;s staging schema, kept clean</text><text x="430" y="238.70000000000002" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">by Chapter 47&#x27;s checks</text><path d="M76.0,282.40000000000003 L76.0,265.40000000000003" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M76.0,265.40000000000003 L79.0,271.7 L73.0,271.7 Z" fill="#5b6475"/><text x="84.0" y="277.40000000000003" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">built from</text><rect x="12" y="284.40000000000003" width="128" height="41.2" rx="6" fill="#b35a1f" stroke="#b35a1f" stroke-width="1.6" /><text x="76.0" y="303.00000000000006" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="middle">BRONZE</text><text x="76.0" y="316.6000000000001" font-size="10.5" fill="#fff" font-weight="bold" text-anchor="middle">Raw</text><rect x="150" y="284.40000000000003" width="262" height="41.2" rx="6" fill="#fff" stroke="#b35a1f" stroke-width="1.2" /><text x="158" y="301.90000000000003" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Exactly as the source sent it, kept for audit</text><text x="158" y="315.50000000000006" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">and replay.</text><rect x="422" y="284.40000000000003" width="246" height="41.2" rx="6" fill="#eef2f7" stroke="none" stroke-width="1" /><text x="430" y="301.90000000000003" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Chapter 45&#x27;s raw schema</text><text x="12" y="344.1" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">Data flows upwards: raw, then staging, then marts. The semantic layer is where &#x27;revenue&#x27; is defined once, on top of gold.</text></svg>