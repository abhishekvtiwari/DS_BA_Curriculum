<svg xmlns="http://www.w3.org/2000/svg" width="970" height="272" viewBox="0 0 970 272" font-family="DejaVu Sans, Arial, sans-serif"><rect width="970" height="272" fill="#ffffff"/><text x="30" y="30" font-size="14.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Medallion: bronze, silver, gold — a name for what Riverstone already does</text><rect x="30" y="60" width="300" height="140" rx="8" fill="#fff" stroke="#c0662b" stroke-width="1.8" /><rect x="30" y="60" width="300" height="34" rx="0" fill="#c0662b" stroke="none" stroke-width="1" /><text x="180" y="83" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">BRONZE — Raw</text><text x="46" y="116" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="start">Exactly as the source sent it, kept</text><text x="46" y="132" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="start">for replay and audit</text><rect x="44" y="168" width="272" height="24" rx="4" fill="#eef2f7" stroke="none" stroke-width="1" /><text x="180" y="184" font-size="9.6" fill="#5b6475" font-weight="normal" text-anchor="middle">Ch 45&#x27;s `raw` schema</text><path d="M332,130 L358,130" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M358,130 L351.7,133.0 L351.7,127.0 Z" fill="#5b6475"/><rect x="360" y="60" width="300" height="140" rx="8" fill="#fff" stroke="#5b6475" stroke-width="1.8" /><rect x="360" y="60" width="300" height="34" rx="0" fill="#5b6475" stroke="none" stroke-width="1" /><text x="510" y="83" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">SILVER — Staging</text><text x="376" y="116" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="start">Cleaned, typed, deduplicated,</text><text x="376" y="132" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="start">conformed to one shape</text><rect x="374" y="168" width="272" height="24" rx="4" fill="#eef2f7" stroke="none" stroke-width="1" /><text x="510" y="184" font-size="9.6" fill="#5b6475" font-weight="normal" text-anchor="middle">Ch 45&#x27;s `staging` schema, Ch 47&#x27;s tests</text><path d="M662,130 L688,130" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M688,130 L681.7,133.0 L681.7,127.0 Z" fill="#5b6475"/><rect x="690" y="60" width="300" height="140" rx="8" fill="#fff" stroke="#b7791f" stroke-width="1.8" /><rect x="690" y="60" width="300" height="34" rx="0" fill="#b7791f" stroke="none" stroke-width="1" /><text x="840" y="83" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">GOLD — Modelled / Marts</text><text x="706" y="116" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="start">Business-ready: the semantic layer&#x27;s</text><text x="706" y="132" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="start">tables</text><rect x="704" y="168" width="272" height="24" rx="4" fill="#eef2f7" stroke="none" stroke-width="1" /><text x="840" y="184" font-size="9.6" fill="#5b6475" font-weight="normal" text-anchor="middle">Ch 23&#x27;s semantic layer, dbt-style models</text><text x="30" y="235" font-size="11.3" fill="#5b6475" font-weight="normal" text-anchor="start">Medallion isn&#x27;t a new thing to build — it&#x27;s a name for the raw -&gt; staging -&gt; modelled layering this book has used since Chapter 45,</text><text x="30" y="253" font-size="11.3" fill="#5b6475" font-weight="normal" text-anchor="start">now recognized as an industry-standard convention rather than one team&#x27;s private habit.</text></svg>