<svg xmlns="http://www.w3.org/2000/svg" width="720" height="432" viewBox="0 0 720 432" font-family="DejaVu Sans, Arial, sans-serif"><rect width="720" height="432" fill="#ffffff"/><rect x="20" y="20" width="150" height="84" rx="7" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="34" y="54" font-size="17" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Nominal</text><text x="34" y="78" font-size="12" fill="#fff" font-weight="normal" text-anchor="start">Level 1</text><rect x="180" y="20" width="520" height="84" rx="7" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="194" y="44" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start">Names or labels, no order</text><text x="194" y="65" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">e.g. segment, city, payment method</text><rect x="190" y="74" width="500" height="22" rx="5" fill="#f6f9fc" stroke="none" stroke-width="1" /><text x="198" y="90" font-size="12" fill="#0f5c8c" font-weight="bold" text-anchor="start">Allows: count · most common value (mode)</text><rect x="20" y="116" width="150" height="84" rx="7" fill="#7a4fa0" stroke="none" stroke-width="1" /><text x="34" y="150" font-size="17" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Ordinal</text><text x="34" y="174" font-size="12" fill="#fff" font-weight="normal" text-anchor="start">Level 2</text><rect x="180" y="116" width="520" height="84" rx="7" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="194" y="140" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start">Order matters, gaps are unknown</text><text x="194" y="161" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">e.g. T-shirt size, rating 1–5, High/Medium/Low</text><rect x="190" y="170" width="500" height="22" rx="5" fill="#f6f9fc" stroke="none" stroke-width="1" /><text x="198" y="186" font-size="12" fill="#7a4fa0" font-weight="bold" text-anchor="start">Adds: rank · median · &quot;higher than&quot;</text><rect x="20" y="212" width="150" height="84" rx="7" fill="#c0662b" stroke="none" stroke-width="1" /><text x="34" y="246" font-size="17" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Interval</text><text x="34" y="270" font-size="12" fill="#fff" font-weight="normal" text-anchor="start">Level 3</text><rect x="180" y="212" width="520" height="84" rx="7" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="194" y="236" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start">Equal gaps, but no true zero</text><text x="194" y="257" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">e.g. temperature in °C, calendar dates</text><rect x="190" y="266" width="500" height="22" rx="5" fill="#f6f9fc" stroke="none" stroke-width="1" /><text x="198" y="282" font-size="12" fill="#c0662b" font-weight="bold" text-anchor="start">Adds: differences · mean</text><rect x="20" y="308" width="150" height="84" rx="7" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="34" y="342" font-size="17" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Ratio</text><text x="34" y="366" font-size="12" fill="#fff" font-weight="normal" text-anchor="start">Level 4</text><rect x="180" y="308" width="520" height="84" rx="7" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="194" y="332" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start">Equal gaps and a true zero</text><text x="194" y="353" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">e.g. revenue, quantity, weight, age</text><rect x="190" y="362" width="500" height="22" rx="5" fill="#f6f9fc" stroke="none" stroke-width="1" /><text x="198" y="378" font-size="12" fill="#2f7d6d" font-weight="bold" text-anchor="start">Adds: &quot;twice as much&quot; · % change</text><text x="20" y="414" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start">Each level keeps every calculation of the level before it and adds one more.</text></svg>