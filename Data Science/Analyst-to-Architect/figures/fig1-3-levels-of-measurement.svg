<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="382" viewBox="0 0 1000 382" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1000" height="382" fill="#ffffff"/><rect x="30" y="40" width="170" height="68" rx="7" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="44" y="70" font-size="17" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Nominal</text><text x="44" y="92" font-size="11.5" fill="#fff" font-weight="normal" text-anchor="start">Level 1</text><rect x="210" y="40" width="780" height="68" rx="7" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="226" y="66" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start">Names or labels, no order</text><text x="226" y="90" font-size="12.3" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">e.g. segment, city, payment method</text><rect x="670" y="52" width="306" height="44" rx="5" fill="#f6f9fc" stroke="none" stroke-width="1" /><text x="682" y="80" font-size="12.3" fill="#0f5c8c" font-weight="bold" text-anchor="start">count · most common value (mode)</text><rect x="30" y="118" width="170" height="68" rx="7" fill="#7a4fa0" stroke="none" stroke-width="1" /><text x="44" y="148" font-size="17" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Ordinal</text><text x="44" y="170" font-size="11.5" fill="#fff" font-weight="normal" text-anchor="start">Level 2</text><rect x="210" y="118" width="780" height="68" rx="7" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="226" y="144" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start">Order matters, gaps are unknown</text><text x="226" y="168" font-size="12.3" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">e.g. T-shirt size, rating 1–5, High/Medium/Low</text><rect x="670" y="130" width="306" height="44" rx="5" fill="#f6f9fc" stroke="none" stroke-width="1" /><text x="682" y="158" font-size="12.3" fill="#7a4fa0" font-weight="bold" text-anchor="start">+ rank · median · &quot;higher than&quot;</text><rect x="30" y="196" width="170" height="68" rx="7" fill="#c0662b" stroke="none" stroke-width="1" /><text x="44" y="226" font-size="17" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Interval</text><text x="44" y="248" font-size="11.5" fill="#fff" font-weight="normal" text-anchor="start">Level 3</text><rect x="210" y="196" width="780" height="68" rx="7" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="226" y="222" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start">Equal gaps, but no true zero</text><text x="226" y="246" font-size="12.3" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">e.g. temperature in °C, calendar dates</text><rect x="670" y="208" width="306" height="44" rx="5" fill="#f6f9fc" stroke="none" stroke-width="1" /><text x="682" y="236" font-size="12.3" fill="#c0662b" font-weight="bold" text-anchor="start">+ differences · mean</text><rect x="30" y="274" width="170" height="68" rx="7" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="44" y="304" font-size="17" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Ratio</text><text x="44" y="326" font-size="11.5" fill="#fff" font-weight="normal" text-anchor="start">Level 4</text><rect x="210" y="274" width="780" height="68" rx="7" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="226" y="300" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start">Equal gaps and a true zero</text><text x="226" y="324" font-size="12.3" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">e.g. revenue, quantity, weight, age</text><rect x="670" y="286" width="306" height="44" rx="5" fill="#f6f9fc" stroke="none" stroke-width="1" /><text x="682" y="314" font-size="12.3" fill="#2f7d6d" font-weight="bold" text-anchor="start">+ &quot;twice as much&quot; · % change</text><text x="30" y="366" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start">Each level allows everything above it, plus something new. Use only the maths your level allows.</text></svg>