<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="485" viewBox="0 0 1040 485" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1040" height="485" fill="#ffffff"/><text x="30" y="32" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">An experiment, in the order the decisions are made</text><rect x="30" y="66" width="120" height="40" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="90" y="91" font-size="12" fill="#5b6475" font-weight="bold" text-anchor="middle">Before</text><rect x="160" y="66" width="850" height="40" rx="6" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><text x="180" y="91" font-size="12.5" fill="#0f5c8c" font-weight="bold" text-anchor="start">Question and change</text><text x="520" y="91" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">the shorter enquiry form</text><rect x="30" y="114" width="120" height="40" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="90" y="139" font-size="12" fill="#5b6475" font-weight="bold" text-anchor="middle">Before</text><rect x="160" y="114" width="850" height="40" rx="6" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><text x="180" y="139" font-size="12.5" fill="#0f5c8c" font-weight="bold" text-anchor="start">Primary metric + guardrails</text><text x="520" y="139" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">enquiry rate per visitor; pages, value, orders</text><rect x="30" y="162" width="120" height="40" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="90" y="187" font-size="12" fill="#5b6475" font-weight="bold" text-anchor="middle">Before</text><rect x="160" y="162" width="850" height="40" rx="6" fill="#fff" stroke="#7a4fa0" stroke-width="1.6" /><text x="180" y="187" font-size="12.5" fill="#7a4fa0" font-weight="bold" text-anchor="start">MDE and sample size</text><text x="520" y="187" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">0.5 pp → 25,000 per group</text><rect x="30" y="210" width="120" height="40" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="90" y="235" font-size="12" fill="#5b6475" font-weight="bold" text-anchor="middle">Before</text><rect x="160" y="210" width="850" height="40" rx="6" fill="#fff" stroke="#7a4fa0" stroke-width="1.6" /><text x="180" y="235" font-size="12.5" fill="#7a4fa0" font-weight="bold" text-anchor="start">Duration and stopping rule</text><text x="520" y="235" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">two whole weeks, no interim decisions</text><rect x="30" y="258" width="120" height="40" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="90" y="283" font-size="12" fill="#5b6475" font-weight="bold" text-anchor="middle">During</text><rect x="160" y="258" width="850" height="40" rx="6" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><text x="180" y="283" font-size="12.5" fill="#2f7d6d" font-weight="bold" text-anchor="start">Randomize and watch guardrails</text><text x="520" y="283" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">50/50 by visitor</text><rect x="30" y="306" width="120" height="40" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="90" y="331" font-size="12" fill="#5b6475" font-weight="bold" text-anchor="middle">After</text><rect x="160" y="306" width="850" height="40" rx="6" fill="#fff" stroke="#c0662b" stroke-width="1.6" /><text x="180" y="331" font-size="12.5" fill="#c0662b" font-weight="bold" text-anchor="start">Sample-ratio check</text><text x="520" y="331" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">chi-square on group sizes — failed here</text><rect x="30" y="354" width="120" height="40" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="90" y="379" font-size="12" fill="#5b6475" font-weight="bold" text-anchor="middle">After</text><rect x="160" y="354" width="850" height="40" rx="6" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><text x="180" y="379" font-size="12.5" fill="#2f7d6d" font-weight="bold" text-anchor="start">Primary metric with CI</text><text x="520" y="379" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">+0.55 pp (0.19 to 0.91), p = 0.0026</text><rect x="30" y="402" width="120" height="40" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="90" y="427" font-size="12" fill="#5b6475" font-weight="bold" text-anchor="middle">After</text><rect x="160" y="402" width="850" height="40" rx="6" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><text x="180" y="427" font-size="12.5" fill="#2f7d6d" font-weight="bold" text-anchor="start">Effect size and decision</text><text x="520" y="427" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">+14% relative; ship, fix the Safari tag</text><text x="30" y="468" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Everything above the line is written down before a single visitor is randomized. That is what makes the numbers below it mean anything.</text></svg>