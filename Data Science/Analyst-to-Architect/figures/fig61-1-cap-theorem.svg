<svg xmlns="http://www.w3.org/2000/svg" width="740" height="404" viewBox="0 0 740 404" font-family="DejaVu Sans, Arial, sans-serif"><rect width="740" height="404" fill="#ffffff"/><text x="20" y="30" font-size="16" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">CAP: when the network partitions, pick one</text><polygon points="165.0,110.0 255.9,267.5 74.1,267.5" fill="#f3f6fa" stroke="#c9d3df" stroke-width="1.4"/><circle cx="165.0" cy="110.0" r="7" fill="#0f5c8c"/><text x="165.0" y="52.0" font-size="12.5" fill="#0f5c8c" font-weight="bold" text-anchor="middle">Consistency</text><text x="165.0" y="68.0" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="middle">every reader sees</text><text x="165.0" y="83.0" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="middle">the latest write</text><circle cx="255.9" cy="267.5" r="7" fill="#2f7d6d"/><text x="235.93266739736606" y="297.5" font-size="12.5" fill="#2f7d6d" font-weight="bold" text-anchor="middle">Availability</text><text x="235.93266739736606" y="313.5" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="middle">the system keeps</text><text x="235.93266739736606" y="328.5" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="middle">responding</text><circle cx="74.1" cy="267.5" r="7" fill="#b7791f"/><text x="99.06733260263394" y="297.5" font-size="12.5" fill="#b7791f" font-weight="bold" text-anchor="middle">Partition tolerance</text><text x="99.06733260263394" y="313.5" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="middle">the network can</text><text x="99.06733260263394" y="328.5" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="middle">drop messages</text><text x="165" y="211" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="middle">P is not</text><text x="165" y="226" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="middle">optional</text><text x="165" y="241" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="middle">at scale</text><rect x="343" y="60" width="385" height="128" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="340" y="56" width="385" height="128" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><path d="M340,64 a8,8 0 0 1 8,-8 H717 a8,8 0 0 1 8,8 V84 H340 Z" fill="#0f5c8c"/><text x="532.5" y="75" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Order writes (PO-intake → ERP)</text><text x="532.5" y="104" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="middle">CP: choose consistency</text><text x="532.5" y="121" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="middle">If the CRM check or the ERP can&#x27;t be reached,</text><text x="532.5" y="138" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="middle">hold the order in the exception queue.</text><text x="532.5" y="155" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="middle">Retrying is safe: one email, one order (Ch 58).</text><rect x="343" y="208" width="385" height="128" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="340" y="204" width="385" height="128" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><path d="M340,212 a8,8 0 0 1 8,-8 H717 a8,8 0 0 1 8,8 V232 H340 Z" fill="#2f7d6d"/><text x="532.5" y="223" font-size="12.5" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Dashboard reads (warehouse → BI)</text><text x="532.5" y="252" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="middle">AP: choose availability</text><text x="532.5" y="269" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="middle">If BI can&#x27;t reach the warehouse, show the last</text><text x="532.5" y="286" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="middle">imported data under its banner, &#x27;Data current</text><text x="532.5" y="303" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="middle">to 7 January, 6:35 a.m.&#x27; (Ch 47), not an error.</text><text x="20" y="372" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">CAP is not a menu you pick from once. Different parts of the same platform</text><text x="20" y="389" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">make different, deliberate choices.</text></svg>