<svg xmlns="http://www.w3.org/2000/svg" width="760" height="472" viewBox="0 0 760 472" font-family="DejaVu Sans, Arial, sans-serif"><rect width="760" height="472" fill="#ffffff"/><rect x="250" y="14" width="260" height="56" rx="8" fill="#1d2330" stroke="none" stroke-width="1" /><text x="380" y="38" font-size="16" fill="#fff" font-weight="bold" text-anchor="middle" font-family="Poppins, DejaVu Sans, sans-serif">Driver</text><text x="380" y="58" font-size="12" fill="#c9d4e0" font-weight="normal" text-anchor="middle">your code, the plan, small results</text><path d="M380,114 L380,74" fill="none" stroke="#c0662b" stroke-width="2" stroke-linejoin="round"/><path d="M380,74 L383.9,82.1 L376.1,82.1 Z" fill="#c0662b"/><text x="392" y="90" font-size="12" fill="#c0662b" font-weight="bold" text-anchor="start">collect() brings every row back</text><text x="392" y="106" font-size="12" fill="#c0662b" font-weight="bold" text-anchor="start">into the driver&#x27;s memory</text><rect x="20" y="122" width="168" height="232" rx="8" fill="#fbfcfe" stroke="#c9d3df" stroke-width="1.3" /><text x="32" y="144" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Worker 1</text><rect x="30" y="154" width="148" height="28" rx="5" fill="#e6edf4" stroke="#0f5c8c" stroke-width="1" /><text x="40" y="173" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">partition 1</text><rect x="30" y="188" width="148" height="28" rx="5" fill="#e6edf4" stroke="#0f5c8c" stroke-width="1" /><text x="40" y="207" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">partition 2</text><rect x="30" y="226" width="148" height="62" rx="5" fill="#eaf5f1" stroke="#2f7d6d" stroke-width="1.6" /><text x="40" y="245" font-size="12" fill="#2f7d6d" font-weight="bold" text-anchor="start">NARROW</text><text x="40" y="263" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">filter, select,</text><text x="40" y="280" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">partial totals</text><rect x="30" y="298" width="148" height="48" rx="5" fill="#fbeaea" stroke="#b23b3b" stroke-width="1.6" stroke-dasharray="6 4"/><text x="40" y="317" font-size="12" fill="#b23b3b" font-weight="bold" text-anchor="start">WIDE</text><text x="40" y="335" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">shuffle: rows move</text><rect x="202" y="122" width="168" height="232" rx="8" fill="#fbfcfe" stroke="#c9d3df" stroke-width="1.3" /><text x="214" y="144" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Worker 2</text><rect x="212" y="154" width="148" height="28" rx="5" fill="#e6edf4" stroke="#0f5c8c" stroke-width="1" /><text x="222" y="173" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">partition 3</text><rect x="212" y="188" width="148" height="28" rx="5" fill="#e6edf4" stroke="#0f5c8c" stroke-width="1" /><text x="222" y="207" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">partition 4</text><rect x="212" y="226" width="148" height="62" rx="5" fill="#eaf5f1" stroke="#2f7d6d" stroke-width="1.6" /><text x="222" y="245" font-size="12" fill="#2f7d6d" font-weight="bold" text-anchor="start">NARROW</text><text x="222" y="263" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">filter, select,</text><text x="222" y="280" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">partial totals</text><rect x="212" y="298" width="148" height="48" rx="5" fill="#fbeaea" stroke="#b23b3b" stroke-width="1.6" stroke-dasharray="6 4"/><text x="222" y="317" font-size="12" fill="#b23b3b" font-weight="bold" text-anchor="start">WIDE</text><text x="222" y="335" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">shuffle: rows move</text><rect x="384" y="122" width="168" height="232" rx="8" fill="#fbfcfe" stroke="#c9d3df" stroke-width="1.3" /><text x="396" y="144" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Worker 3</text><rect x="394" y="154" width="148" height="28" rx="5" fill="#e6edf4" stroke="#0f5c8c" stroke-width="1" /><text x="404" y="173" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">partition 5</text><rect x="394" y="188" width="148" height="28" rx="5" fill="#e6edf4" stroke="#0f5c8c" stroke-width="1" /><text x="404" y="207" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">partition 6</text><rect x="394" y="226" width="148" height="62" rx="5" fill="#eaf5f1" stroke="#2f7d6d" stroke-width="1.6" /><text x="404" y="245" font-size="12" fill="#2f7d6d" font-weight="bold" text-anchor="start">NARROW</text><text x="404" y="263" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">filter, select,</text><text x="404" y="280" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">partial totals</text><rect x="394" y="298" width="148" height="48" rx="5" fill="#fbeaea" stroke="#b23b3b" stroke-width="1.6" stroke-dasharray="6 4"/><text x="404" y="317" font-size="12" fill="#b23b3b" font-weight="bold" text-anchor="start">WIDE</text><text x="404" y="335" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">shuffle: rows move</text><rect x="566" y="122" width="168" height="232" rx="8" fill="#fbfcfe" stroke="#c9d3df" stroke-width="1.3" /><text x="578" y="144" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Worker 4</text><rect x="576" y="154" width="148" height="28" rx="5" fill="#e6edf4" stroke="#0f5c8c" stroke-width="1" /><text x="586" y="173" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">partition 7</text><rect x="576" y="188" width="148" height="28" rx="5" fill="#e6edf4" stroke="#0f5c8c" stroke-width="1" /><text x="586" y="207" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">partition 8</text><rect x="576" y="226" width="148" height="62" rx="5" fill="#eaf5f1" stroke="#2f7d6d" stroke-width="1.6" /><text x="586" y="245" font-size="12" fill="#2f7d6d" font-weight="bold" text-anchor="start">NARROW</text><text x="586" y="263" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">filter, select,</text><text x="586" y="280" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">partial totals</text><rect x="576" y="298" width="148" height="48" rx="5" fill="#fbeaea" stroke="#b23b3b" stroke-width="1.6" stroke-dasharray="6 4"/><text x="586" y="317" font-size="12" fill="#b23b3b" font-weight="bold" text-anchor="start">WIDE</text><text x="586" y="335" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">shuffle: rows move</text><path d="M144.0,354 C144.0,374 246.0,374 246.0,364" fill="none" stroke="#b23b3b" stroke-width="1.4" stroke-linejoin="round"/><path d="M246.0,364 L246.0,355" fill="none" stroke="#b23b3b" stroke-width="1.4" stroke-linejoin="round"/><path d="M246.0,355 L249.9,363.1 L242.1,363.1 Z" fill="#b23b3b"/><path d="M326.0,354 C326.0,374 428.0,374 428.0,364" fill="none" stroke="#b23b3b" stroke-width="1.4" stroke-linejoin="round"/><path d="M428.0,364 L428.0,355" fill="none" stroke="#b23b3b" stroke-width="1.4" stroke-linejoin="round"/><path d="M428.0,355 L431.9,363.1 L424.1,363.1 Z" fill="#b23b3b"/><path d="M508.0,354 C508.0,374 610.0,374 610.0,364" fill="none" stroke="#b23b3b" stroke-width="1.4" stroke-linejoin="round"/><path d="M610.0,364 L610.0,355" fill="none" stroke="#b23b3b" stroke-width="1.4" stroke-linejoin="round"/><path d="M610.0,355 L613.9,363.1 L606.1,363.1 Z" fill="#b23b3b"/><path d="M276.0,354 C276.0,392 114.0,392 114.0,364" fill="none" stroke="#b23b3b" stroke-width="1.4" stroke-linejoin="round"/><path d="M114.0,364 L114.0,355" fill="none" stroke="#b23b3b" stroke-width="1.4" stroke-linejoin="round"/><path d="M114.0,355 L117.9,363.1 L110.1,363.1 Z" fill="#b23b3b"/><path d="M458.0,354 C458.0,392 296.0,392 296.0,364" fill="none" stroke="#b23b3b" stroke-width="1.4" stroke-linejoin="round"/><path d="M296.0,364 L296.0,355" fill="none" stroke="#b23b3b" stroke-width="1.4" stroke-linejoin="round"/><path d="M296.0,355 L299.9,363.1 L292.1,363.1 Z" fill="#b23b3b"/><path d="M640.0,354 C640.0,392 478.0,392 478.0,364" fill="none" stroke="#b23b3b" stroke-width="1.4" stroke-linejoin="round"/><path d="M478.0,364 L478.0,355" fill="none" stroke="#b23b3b" stroke-width="1.4" stroke-linejoin="round"/><path d="M478.0,355 L481.9,363.1 L474.1,363.1 Z" fill="#b23b3b"/><text x="20" y="418" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">NARROW (solid boxes): each worker uses only its own partitions. Cheap, fully parallel.</text><text x="20" y="439" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">WIDE (dashed boxes, arrows underneath): rows for the same key must meet, so they cross</text><text x="20" y="458" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">between workers, through shuffle files and, on a cluster, the network. This is the cost.</text></svg>