<svg xmlns="http://www.w3.org/2000/svg" width="720" height="452" viewBox="0 0 720 452" font-family="DejaVu Sans, Arial, sans-serif"><rect width="720" height="452" fill="#ffffff"/><rect x="16" y="14" width="688" height="58" rx="8" fill="#fff4e8" stroke="#c0662b" stroke-width="1.6" /><text x="30" y="34" font-size="13.5" fill="#c0662b" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Data architect, across every phase</text><text x="30" y="56" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Designs how the pieces fit: where the score lives, who owns each definition, who may see what.</text><circle cx="30" cy="104" r="12" fill="#0f5c8c"/><text x="30" y="108.5" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">1</text><text x="50" y="109" font-size="13" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Clarify and</text><text x="50" y="126" font-size="13" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">answer</text><path d="M30,118 L30,150" fill="none" stroke="#5b6475" stroke-width="1.8" stroke-linejoin="round"/><path d="M30,150 L26.1,141.9 L33.9,141.9 Z" fill="#5b6475"/><rect x="193" y="89" width="252" height="50" rx="7" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="190" y="86" width="252" height="50" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.4" /><text x="202" y="106" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Business analyst</text><text x="202" y="125" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">makes the request a clear question</text><rect x="455" y="89" width="252" height="50" rx="7" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="452" y="86" width="252" height="50" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.4" /><text x="464" y="106" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Data analyst</text><text x="464" y="125" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">finds the five quiet customers</text><circle cx="30" cy="164" r="12" fill="#0f5c8c"/><text x="30" y="168.5" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">2</text><text x="50" y="169" font-size="13" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Share and</text><text x="50" y="186" font-size="13" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">standardize</text><path d="M30,178 L30,210" fill="none" stroke="#5b6475" stroke-width="1.8" stroke-linejoin="round"/><path d="M30,210 L26.1,201.9 L33.9,201.9 Z" fill="#5b6475"/><rect x="193" y="149" width="252" height="50" rx="7" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="190" y="146" width="252" height="50" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.4" /><text x="202" y="166" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">BI developer</text><text x="202" y="185" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">at-risk page on the sales dashboard</text><rect x="455" y="149" width="252" height="50" rx="7" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="452" y="146" width="252" height="50" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.4" /><text x="464" y="166" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Analytics engineer</text><text x="464" y="185" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">one tested definition of &quot;active&quot;</text><circle cx="30" cy="224" r="12" fill="#2f7d6d"/><text x="30" y="228.5" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">3</text><text x="50" y="229" font-size="13" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Supply</text><text x="50" y="246" font-size="13" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">trusted data</text><path d="M30,238 L30,270" fill="none" stroke="#5b6475" stroke-width="1.8" stroke-linejoin="round"/><path d="M30,270 L26.1,261.9 L33.9,261.9 Z" fill="#5b6475"/><rect x="193" y="209" width="514" height="50" rx="7" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="190" y="206" width="514" height="50" rx="7" fill="#fff" stroke="#2f7d6d" stroke-width="1.4" /><text x="202" y="226" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Data engineer</text><text x="202" y="245" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">fresh, checked data from payments, support and the CRM by 6 a.m.</text><circle cx="30" cy="284" r="12" fill="#7a4fa0"/><text x="30" y="288.5" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">4</text><text x="50" y="289" font-size="13" fill="#7a4fa0" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Predict</text><path d="M30,298 L30,330" fill="none" stroke="#5b6475" stroke-width="1.8" stroke-linejoin="round"/><path d="M30,330 L26.1,321.9 L33.9,321.9 Z" fill="#5b6475"/><rect x="193" y="269" width="252" height="50" rx="7" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="190" y="266" width="252" height="50" rx="7" fill="#fff" stroke="#7a4fa0" stroke-width="1.4" /><text x="202" y="286" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Data scientist</text><text x="202" y="305" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">predicts who will go quiet next</text><rect x="455" y="269" width="252" height="50" rx="7" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="452" y="266" width="252" height="50" rx="7" fill="#fff" stroke="#7a4fa0" stroke-width="1.4" /><text x="464" y="286" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">ML engineer</text><text x="464" y="305" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">scores every customer each night</text><circle cx="30" cy="344" r="12" fill="#1f6f86"/><text x="30" y="348.5" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">5</text><text x="50" y="349" font-size="13" fill="#1f6f86" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Act</text><rect x="193" y="329" width="252" height="50" rx="7" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="190" y="326" width="252" height="50" rx="7" fill="#fff" stroke="#1f6f86" stroke-width="1.4" /><text x="202" y="346" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Integration engineer</text><text x="202" y="365" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">tasks in the CRM, Monday email</text><rect x="455" y="329" width="252" height="50" rx="7" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="452" y="326" width="252" height="50" rx="7" fill="#fff" stroke="#1f6f86" stroke-width="1.4" /><text x="464" y="346" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">AI engineer</text><text x="464" y="365" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">call brief drafted; rep approves</text><rect x="16" y="390" width="688" height="52" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="30" y="410" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Start: &quot;Some customers seem to have stopped ordering. Which ones, and what should we do?&quot;</text><text x="30" y="430" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="start">End: every Monday, each sales rep knows which customers to call, and why.</text></svg>