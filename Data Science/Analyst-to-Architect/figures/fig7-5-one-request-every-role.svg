<svg xmlns="http://www.w3.org/2000/svg" width="720" height="580" viewBox="0 0 720 580" font-family="DejaVu Sans, Arial, sans-serif"><rect width="720" height="580" fill="#ffffff"/><rect x="16" y="16" width="688" height="70" rx="8" fill="#fff4e8" stroke="#c0662b" stroke-width="1.6" /><text x="30" y="38" font-size="14" fill="#c0662b" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Data architect, across every phase</text><text x="30" y="58" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Designs how the pieces fit: where the score lives, who owns each definition,</text><text x="30" y="76" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">who may see what, and what it costs.</text><circle cx="30" cy="126" r="12" fill="#0f5c8c"/><text x="30" y="130.5" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">1</text><text x="50" y="131" font-size="13" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Clarify and</text><text x="50" y="149" font-size="13" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">answer</text><path d="M30,142 L30,190" fill="none" stroke="#5b6475" stroke-width="1.8" stroke-linejoin="round"/><path d="M30,190 L26.1,181.9 L33.9,181.9 Z" fill="#5b6475"/><rect x="193" y="107" width="252" height="64" rx="7" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="190" y="104" width="252" height="64" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.4" /><text x="202" y="126" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Business analyst</text><text x="202" y="145" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">turns the request into a clear</text><text x="202" y="161" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">question</text><rect x="455" y="107" width="252" height="64" rx="7" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="452" y="104" width="252" height="64" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.4" /><text x="464" y="126" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Data analyst</text><text x="464" y="145" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">finds the five quiet customers</text><circle cx="30" cy="204" r="12" fill="#0f5c8c"/><text x="30" y="208.5" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">2</text><text x="50" y="209" font-size="13" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Share and</text><text x="50" y="227" font-size="13" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">standardize</text><path d="M30,220 L30,268" fill="none" stroke="#5b6475" stroke-width="1.8" stroke-linejoin="round"/><path d="M30,268 L26.1,259.9 L33.9,259.9 Z" fill="#5b6475"/><rect x="193" y="185" width="252" height="64" rx="7" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="190" y="182" width="252" height="64" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.4" /><text x="202" y="204" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">BI developer</text><text x="202" y="223" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">at-risk page on the sales</text><text x="202" y="239" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">dashboard</text><rect x="455" y="185" width="252" height="64" rx="7" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="452" y="182" width="252" height="64" rx="7" fill="#fff" stroke="#0f5c8c" stroke-width="1.4" /><text x="464" y="204" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Analytics engineer</text><text x="464" y="223" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">one tested definition of &quot;active&quot;</text><circle cx="30" cy="282" r="12" fill="#2f7d6d"/><text x="30" y="286.5" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">3</text><text x="50" y="287" font-size="13" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Supply</text><text x="50" y="305" font-size="13" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">trusted data</text><path d="M30,298 L30,346" fill="none" stroke="#5b6475" stroke-width="1.8" stroke-linejoin="round"/><path d="M30,346 L26.1,337.9 L33.9,337.9 Z" fill="#5b6475"/><rect x="193" y="263" width="514" height="64" rx="7" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="190" y="260" width="514" height="64" rx="7" fill="#fff" stroke="#2f7d6d" stroke-width="1.4" /><text x="202" y="282" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Data engineer</text><text x="202" y="301" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">fresh, checked data from payments, support and the CRM by 6 a.m.</text><circle cx="30" cy="360" r="12" fill="#7a4fa0"/><text x="30" y="364.5" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">4</text><text x="50" y="365" font-size="13" fill="#7a4fa0" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Predict</text><path d="M30,376 L30,424" fill="none" stroke="#5b6475" stroke-width="1.8" stroke-linejoin="round"/><path d="M30,424 L26.1,415.9 L33.9,415.9 Z" fill="#5b6475"/><rect x="193" y="341" width="252" height="64" rx="7" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="190" y="338" width="252" height="64" rx="7" fill="#fff" stroke="#7a4fa0" stroke-width="1.4" /><text x="202" y="360" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Data scientist</text><text x="202" y="379" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">predicts who will go quiet next</text><rect x="455" y="341" width="252" height="64" rx="7" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="452" y="338" width="252" height="64" rx="7" fill="#fff" stroke="#7a4fa0" stroke-width="1.4" /><text x="464" y="360" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">ML engineer</text><text x="464" y="379" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">scores every customer each night</text><circle cx="30" cy="438" r="12" fill="#1f6f86"/><text x="30" y="442.5" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">5</text><text x="50" y="443" font-size="13" fill="#1f6f86" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Act</text><rect x="193" y="419" width="252" height="64" rx="7" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="190" y="416" width="252" height="64" rx="7" fill="#fff" stroke="#1f6f86" stroke-width="1.4" /><text x="202" y="438" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Integration engineer</text><text x="202" y="457" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">tasks in the CRM, Monday email</text><rect x="455" y="419" width="252" height="64" rx="7" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="452" y="416" width="252" height="64" rx="7" fill="#fff" stroke="#1f6f86" stroke-width="1.4" /><text x="464" y="438" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">AI engineer</text><text x="464" y="457" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">call brief drafted; rep approves</text><rect x="16" y="494" width="688" height="70" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="30" y="516" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Start: Anita asks, &quot;Some customers seem to have stopped ordering.</text><text x="30" y="533" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Which ones, and what should we do?&quot;</text><text x="30" y="554" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start">End: every Monday, each sales rep knows which customers to call, and why.</text></svg>