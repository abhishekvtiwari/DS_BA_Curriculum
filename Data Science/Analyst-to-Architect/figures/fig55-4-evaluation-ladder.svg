<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="322" viewBox="0 0 1040 322" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1040" height="322" fill="#ffffff"/><text x="30" y="32" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Four numbers, each stricter than the last</text><text x="280" y="96" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="end">answered rather than refused</text><rect x="300" y="76" width="520" height="30" rx="5" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><rect x="300" y="76" width="472.72727272727275" height="30" rx="5" fill="#2f7d6d" stroke="#2f7d6d" stroke-width="1" /><text x="312" y="96" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="start">50 of 55</text><text x="840" y="96" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">the refusal threshold is not over-cautious</text><text x="280" y="142" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="end">cited the right document</text><rect x="300" y="122" width="520" height="30" rx="5" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><rect x="300" y="122" width="359.27272727272725" height="30" rx="5" fill="#0f5c8c" stroke="#0f5c8c" stroke-width="1" /><text x="312" y="142" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="start">38 of 55</text><text x="840" y="142" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">retrieval ranked the right document first</text><text x="280" y="188" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="end">answer contained the fact</text><rect x="300" y="168" width="520" height="30" rx="5" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><rect x="300" y="168" width="170.1818181818182" height="30" rx="5" fill="#c0662b" stroke="#c0662b" stroke-width="1" /><text x="312" y="188" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="start">18 of 55</text><text x="840" y="188" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">where a real model would change the result most</text><text x="280" y="234" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="end">correctly refused (unanswerable)</text><rect x="300" y="214" width="520" height="30" rx="5" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><rect x="300" y="214" width="364.0" height="30" rx="5" fill="#7a4fa0" stroke="#7a4fa0" stroke-width="1" /><text x="312" y="234" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="start">7 of 10</text><text x="840" y="234" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">the remaining three are guardrail work</text><text x="30" y="280" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Measured on the same 65 questions used for retrieval, so a change anywhere in the pipeline shows up in the ladder.</text><text x="30" y="300" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">The gaps between the rungs say which component to work on next, which is the whole reason to measure four things instead of one.</text></svg>