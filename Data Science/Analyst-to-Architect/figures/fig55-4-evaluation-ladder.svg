<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290" font-family="DejaVu Sans, Arial, sans-serif"><rect width="720" height="290" fill="#ffffff"/><text x="18" y="26" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Four numbers, each stricter than the last</text><text x="18" y="45" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">55 answerable questions; bar length out of 55</text><text x="190" y="75" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="end">answered, not refused</text><rect x="200" y="58" width="300" height="26" rx="4" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><rect x="200" y="58" width="272.72727272727275" height="26" rx="4" fill="#2f7d6d" stroke="#2f7d6d" stroke-width="1" /><text x="510" y="75" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">50 of 55</text><text x="190" y="111" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="end">cited the right document</text><rect x="200" y="94" width="300" height="26" rx="4" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><rect x="200" y="94" width="207.27272727272728" height="26" rx="4" fill="#0f5c8c" stroke="#0f5c8c" stroke-width="1" /><text x="510" y="111" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">38 of the 50 answered</text><text x="190" y="147" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="end">answer contained the fact</text><rect x="200" y="130" width="300" height="26" rx="4" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><rect x="200" y="130" width="65.45454545454545" height="26" rx="4" fill="#c0662b" stroke="#c0662b" stroke-width="1" /><text x="510" y="147" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">12 of the 38 cited correctly</text><path d="M18,172 H702" fill="none" stroke="#c9d3df" stroke-width="1" stroke-linejoin="round"/><text x="18" y="192" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">10 unanswerable questions; bar length out of 10 (a different scale)</text><text x="190" y="221" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="end">correctly refused</text><rect x="200" y="204" width="300" height="26" rx="4" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><rect x="200" y="204" width="210.0" height="26" rx="4" fill="#7a4fa0" stroke="#7a4fa0" stroke-width="1" /><text x="510" y="221" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">7 of 10</text><text x="18" y="260" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">The gaps between the rungs say which component to work on next: the stand-in generator loses</text><text x="18" y="277" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">most between the right document and the right fact, which is where a real model helps most.</text></svg>