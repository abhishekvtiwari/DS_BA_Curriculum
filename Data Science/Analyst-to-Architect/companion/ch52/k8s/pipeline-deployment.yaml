# A minimal Kubernetes deployment for the Riverstone pipeline (Chapter 52, section 52.3).
# Riverstone Supplies is fictional; every name and number is invented.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: riverstone-pipeline
  labels:
    app: riverstone-pipeline
spec:
  replicas: 2
  selector:
    matchLabels:
      app: riverstone-pipeline
  template:
    metadata:
      labels:
        app: riverstone-pipeline
    spec:
      containers:
        - name: pipeline
          image: riverstone/pipeline:1.4.0
          ports:
            - containerPort: 3000
          env:
            - name: RIVERSTONE_SOURCE
              valueFrom:
                secretKeyRef:
                  name: riverstone-db-secret
                  key: connection-string
            - name: CRM_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: riverstone-crm-secret
                  key: token
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: riverstone-pipeline
spec:
  selector:
    app: riverstone-pipeline
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
