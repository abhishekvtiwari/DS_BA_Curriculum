# Chapter 52, section 52.3: a long-running web service, for comparison with the CronJob.
# "flash-page" is a small internal web page Riverstone might add later (Exercise 11); it keeps no data of its own.
# Checked with PyYAML and kubeconform; not applied to a cluster in this book.
# Riverstone Supplies is fictional; every name and number is invented.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flash-page
  namespace: riverstone
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flash-page
  template:
    metadata:
      labels:
        app: flash-page
    spec:
      containers:
        - name: web
          image: riverstone/flash-page:1.0.0
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: flash-page
  namespace: riverstone
spec:
  selector:
    app: flash-page
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
