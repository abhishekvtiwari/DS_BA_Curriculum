<svg xmlns="http://www.w3.org/2000/svg" width="940" height="378" viewBox="0 0 940 378" font-family="DejaVu Sans, Arial, sans-serif"><rect width="940" height="378" fill="#ffffff"/><text x="30" y="30" font-size="14.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">One message per slide</text><rect x="30" y="58" width="430" height="300" rx="6" fill="#fff" stroke="#b23b3b" stroke-width="1.6" /><rect x="30" y="58" width="430" height="26" rx="0" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="44" y="76" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="start">Before: &quot;December Sales Review&quot;</text><text x="46" y="102" font-size="10" fill="#5b6475" font-weight="normal" text-anchor="start">• Nov revenue ₹15.60 cr, Dec ₹8.73 cr (-44.1%)</text><text x="46" y="126" font-size="10" fill="#5b6475" font-weight="normal" text-anchor="start">• Customer effect -₹1.26 cr</text><text x="46" y="150" font-size="10" fill="#5b6475" font-weight="normal" text-anchor="start">• Orders/customer effect -₹1.06 cr</text><text x="46" y="174" font-size="10" fill="#5b6475" font-weight="normal" text-anchor="start">• AOV effect -₹4.55 cr</text><text x="46" y="198" font-size="10" fill="#5b6475" font-weight="normal" text-anchor="start">• Retail share 50.5% → 52.0%</text><text x="46" y="222" font-size="10" fill="#5b6475" font-weight="normal" text-anchor="start">• Wholesale share 22.0% → 21.1%</text><text x="46" y="246" font-size="10" fill="#5b6475" font-weight="normal" text-anchor="start">• Hospitality share 27.5% → 26.8%</text><text x="46" y="270" font-size="10" fill="#5b6475" font-weight="normal" text-anchor="start">• Compare with May→June (-40.4%)</text><text x="46" y="294" font-size="10" fill="#5b6475" font-weight="normal" text-anchor="start">• Same pattern both times</text><text x="46" y="318" font-size="10" fill="#5b6475" font-weight="normal" text-anchor="start">• Recommend: review Jan actuals</text><text x="46" y="348" font-size="10.5" fill="#b23b3b" font-weight="bold" text-anchor="start">→ reader has to find the point</text><rect x="480" y="58" width="430" height="300" rx="6" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><rect x="480" y="58" width="430" height="26" rx="0" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="494" y="76" font-size="10.8" fill="#fff" font-weight="bold" text-anchor="start">After: &quot;December&#x27;s dip is seasonal, not a problem&quot;</text><text x="494" y="110" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start">December revenue: ₹8.73 cr</text><text x="494" y="132" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">44% below November — but AOV-led,</text><text x="494" y="150" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">mix-stable, and matches June&#x27;s pattern.</text><rect x="494" y="175" width="390" height="120" rx="6" fill="#eef2f7" stroke="none" stroke-width="1" /><text x="510" y="196" font-size="10.5" fill="#1d2330" font-weight="normal" text-anchor="start">Nov ₹15.6cr → Dec ₹8.73cr</text><rect x="520" y="215" width="90" height="16.615384615384617" rx="0" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="565" y="280" font-size="9.5" fill="#5b6475" font-weight="normal" text-anchor="middle">customers</text><text x="565" y="210" font-size="9.5" fill="#b23b3b" font-weight="bold" text-anchor="middle">-1.26</text><rect x="640" y="215" width="90" height="13.97802197802198" rx="0" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="685" y="280" font-size="9.5" fill="#5b6475" font-weight="normal" text-anchor="middle">freq.</text><text x="685" y="210" font-size="9.5" fill="#b23b3b" font-weight="bold" text-anchor="middle">-1.06</text><rect x="760" y="215" width="90" height="60.0" rx="0" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="805" y="280" font-size="9.5" fill="#5b6475" font-weight="normal" text-anchor="middle">AOV</text><text x="805" y="210" font-size="9.5" fill="#b23b3b" font-weight="bold" text-anchor="middle">-4.55</text><text x="494" y="320" font-size="10.8" fill="#2f7d6d" font-weight="bold" text-anchor="start">→ recommendation: no action; re-check after January</text></svg>