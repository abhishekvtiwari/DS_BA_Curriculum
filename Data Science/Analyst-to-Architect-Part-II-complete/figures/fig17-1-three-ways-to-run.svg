<svg xmlns="http://www.w3.org/2000/svg" width="930" height="300" viewBox="0 0 930 300" font-family="DejaVu Sans, Arial, sans-serif"><rect width="930" height="300" fill="#ffffff"/><text x="30" y="32" font-size="14.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Three ways to run Python, and what each is for</text><rect x="33" y="64" width="270" height="190" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="30" y="60" width="270" height="190" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><path d="M30,68 a8,8 0 0 1 8,-8 H292 a8,8 0 0 1 8,8 V86 H30 Z" fill="#0f5c8c"/><text x="41" y="78" font-size="11.8" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The REPL</text><text x="41" y="106" font-size="10.8" fill="#1d2330" font-weight="normal" text-anchor="start">Type python, get &gt;&gt;&gt;</text><text x="41" y="123" font-size="10.8" fill="#1d2330" font-weight="normal" text-anchor="start">Each line runs as you press Enter</text><text x="41" y="140" font-size="10.8" fill="#1d2330" font-weight="normal" text-anchor="start">Prints the value of an expression</text><text x="41" y="157" font-size="10.8" fill="#1d2330" font-weight="normal" text-anchor="start">Nothing is saved</text><text x="41" y="174" font-size="10.8" fill="#1d2330" font-weight="normal" text-anchor="start"></text><text x="41" y="191" font-size="10.8" fill="#1d2330" font-weight="normal" text-anchor="start">Use for: trying one thing,</text><text x="41" y="208" font-size="10.8" fill="#1d2330" font-weight="normal" text-anchor="start">checking what a function does</text><rect x="333" y="64" width="270" height="190" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="330" y="60" width="270" height="190" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><path d="M330,68 a8,8 0 0 1 8,-8 H592 a8,8 0 0 1 8,8 V86 H330 Z" fill="#2f7d6d"/><text x="341" y="78" font-size="11.8" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">A notebook (Jupyter)</text><text x="341" y="106" font-size="10.8" fill="#1d2330" font-weight="normal" text-anchor="start">Cells of code, output underneath</text><text x="341" y="123" font-size="10.8" fill="#1d2330" font-weight="normal" text-anchor="start">Notes and charts in between</text><text x="341" y="140" font-size="10.8" fill="#1d2330" font-weight="normal" text-anchor="start">State lives between cells</text><text x="341" y="157" font-size="10.8" fill="#1d2330" font-weight="normal" text-anchor="start">Cells can run out of order</text><text x="341" y="174" font-size="10.8" fill="#1d2330" font-weight="normal" text-anchor="start"></text><text x="341" y="191" font-size="10.8" fill="#1d2330" font-weight="normal" text-anchor="start">Use for: exploring data,</text><text x="341" y="208" font-size="10.8" fill="#1d2330" font-weight="normal" text-anchor="start">showing your working</text><rect x="633" y="64" width="270" height="190" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="630" y="60" width="270" height="190" rx="8" fill="#fff" stroke="#7a4fa0" stroke-width="1.6" /><path d="M630,68 a8,8 0 0 1 8,-8 H892 a8,8 0 0 1 8,8 V86 H630 Z" fill="#7a4fa0"/><text x="641" y="78" font-size="11.8" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">A script (.py)</text><text x="641" y="106" font-size="10.8" fill="#1d2330" font-weight="normal" text-anchor="start">Runs top to bottom, every time</text><text x="641" y="123" font-size="10.8" fill="#1d2330" font-weight="normal" text-anchor="start">Only print() shows anything</text><text x="641" y="140" font-size="10.8" fill="#1d2330" font-weight="normal" text-anchor="start">Takes arguments, returns an exit code</text><text x="641" y="157" font-size="10.8" fill="#1d2330" font-weight="normal" text-anchor="start">Can be scheduled and versioned</text><text x="641" y="174" font-size="10.8" fill="#1d2330" font-weight="normal" text-anchor="start"></text><text x="641" y="191" font-size="10.8" fill="#1d2330" font-weight="normal" text-anchor="start">Use for: anything repeated,</text><text x="641" y="208" font-size="10.8" fill="#1d2330" font-weight="normal" text-anchor="start">shared, or run at 6 a.m.</text><path d="M600,280 L330,280" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M330,280 L336.3,277.0 L336.3,283.0 Z" fill="#5b6475"/><text x="360" y="272" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">when it works, move it into a script (section 17.14)</text></svg>