<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="278" viewBox="0 0 1024 278" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1024" height="278" fill="#ffffff"/><text x="30" y="32" font-size="14.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The operating cycle: how cash becomes stock becomes cash again</text><rect x="23" y="64" width="150" height="90" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="20" y="60" width="150" height="90" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><path d="M20,68 a8,8 0 0 1 8,-8 H162 a8,8 0 0 1 8,8 V86 H20 Z" fill="#0f5c8c"/><text x="31" y="78" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Cash</text><text x="31" y="105" font-size="10.6" fill="#1d2330" font-weight="normal" text-anchor="start">in the bank</text><path d="M172,105 L182,105" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M182,105 L175.7,108.0 L175.7,102.0 Z" fill="#5b6475"/><rect x="187" y="64" width="150" height="90" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="184" y="60" width="150" height="90" rx="8" fill="#fff" stroke="#b7791f" stroke-width="1.6" /><path d="M184,68 a8,8 0 0 1 8,-8 H326 a8,8 0 0 1 8,8 V86 H184 Z" fill="#b7791f"/><text x="195" y="78" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Buy stock</text><text x="195" y="105" font-size="10.6" fill="#1d2330" font-weight="normal" text-anchor="start">pay suppliers</text><text x="195" y="122" font-size="10.6" fill="#1d2330" font-weight="normal" text-anchor="start">(DPO: 38 days)</text><path d="M336,105 L346,105" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M346,105 L339.7,108.0 L339.7,102.0 Z" fill="#5b6475"/><rect x="351" y="64" width="150" height="90" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="348" y="60" width="150" height="90" rx="8" fill="#fff" stroke="#c0662b" stroke-width="1.6" /><path d="M348,68 a8,8 0 0 1 8,-8 H490 a8,8 0 0 1 8,8 V86 H348 Z" fill="#c0662b"/><text x="359" y="78" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Hold inventory</text><text x="359" y="105" font-size="10.6" fill="#1d2330" font-weight="normal" text-anchor="start">in the warehouse</text><text x="359" y="122" font-size="10.6" fill="#1d2330" font-weight="normal" text-anchor="start">(DIO: 55 days)</text><path d="M500,105 L510,105" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M510,105 L503.7,108.0 L503.7,102.0 Z" fill="#5b6475"/><rect x="515" y="64" width="150" height="90" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="512" y="60" width="150" height="90" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><path d="M512,68 a8,8 0 0 1 8,-8 H654 a8,8 0 0 1 8,8 V86 H512 Z" fill="#2f7d6d"/><text x="523" y="78" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Sell to customer</text><text x="523" y="105" font-size="10.6" fill="#1d2330" font-weight="normal" text-anchor="start">invoice raised</text><path d="M664,105 L674,105" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M674,105 L667.7,108.0 L667.7,102.0 Z" fill="#5b6475"/><rect x="679" y="64" width="150" height="90" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="676" y="60" width="150" height="90" rx="8" fill="#fff" stroke="#7a4fa0" stroke-width="1.6" /><path d="M676,68 a8,8 0 0 1 8,-8 H818 a8,8 0 0 1 8,8 V86 H676 Z" fill="#7a4fa0"/><text x="687" y="78" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Collect payment</text><text x="687" y="105" font-size="10.6" fill="#1d2330" font-weight="normal" text-anchor="start">(DSO: 42 days)</text><path d="M828,105 L838,105" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M838,105 L831.7,108.0 L831.7,102.0 Z" fill="#5b6475"/><rect x="843" y="64" width="150" height="90" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="840" y="60" width="150" height="90" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><path d="M840,68 a8,8 0 0 1 8,-8 H982 a8,8 0 0 1 8,8 V86 H840 Z" fill="#0f5c8c"/><text x="851" y="78" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Cash</text><text x="851" y="105" font-size="10.6" fill="#1d2330" font-weight="normal" text-anchor="start">back in the bank</text><rect x="20" y="180" width="984" height="80" rx="8" fill="#fff" stroke="#b23b3b" stroke-width="1.6" /><rect x="20" y="180" width="9" height="80" rx="0" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="42" y="206" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Cash conversion cycle = DIO + DSO − DPO = 55 + 42 − 38 = 59 days</text><text x="42" y="228" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">Riverstone&#x27;s cash is tied up in stock and unpaid invoices for 59 days before it becomes cash again — even though the</text><text x="42" y="246" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">company is profitable. A profitable company can still run out of cash if this cycle is long and growing fast.</text></svg>