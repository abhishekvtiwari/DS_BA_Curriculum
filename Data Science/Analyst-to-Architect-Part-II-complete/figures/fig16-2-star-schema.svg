<svg xmlns="http://www.w3.org/2000/svg" width="920" height="584" viewBox="0 0 920 584" font-family="DejaVu Sans, Arial, sans-serif"><rect width="920" height="584" fill="#ffffff"/><text x="30" y="32" font-size="14.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Riverstone&#x27;s star schema in Power BI</text><rect x="343" y="154" width="250" height="200" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="340" y="150" width="250" height="200" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><path d="M340,158 a8,8 0 0 1 8,-8 H582 a8,8 0 0 1 8,8 V176 H340 Z" fill="#0f5c8c"/><text x="351" y="168" font-size="11.8" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">FACT  Sales</text><text x="351" y="195" font-size="10.6" fill="#1d2330" font-weight="normal" text-anchor="start">order_item_id</text><text x="351" y="212" font-size="10.6" fill="#1d2330" font-weight="normal" text-anchor="start">order_id  →  (degenerate)</text><text x="351" y="229" font-size="10.6" fill="#1d2330" font-weight="normal" text-anchor="start">customer_id</text><text x="351" y="246" font-size="10.6" fill="#1d2330" font-weight="normal" text-anchor="start">product_id</text><text x="351" y="263" font-size="10.6" fill="#1d2330" font-weight="normal" text-anchor="start">sales_rep_id</text><text x="351" y="280" font-size="10.6" fill="#1d2330" font-weight="normal" text-anchor="start">order_date</text><text x="351" y="297" font-size="10.6" fill="#1d2330" font-weight="normal" text-anchor="start">quantity, unit_price,</text><text x="351" y="314" font-size="10.6" fill="#1d2330" font-weight="normal" text-anchor="start">discount_pct</text><text x="351" y="331" font-size="10.6" fill="#1d2330" font-weight="normal" text-anchor="start">209,006 rows</text><rect x="43" y="64" width="230" height="120" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="40" y="60" width="230" height="120" rx="8" fill="#fff" stroke="#b7791f" stroke-width="1.6" /><path d="M40,68 a8,8 0 0 1 8,-8 H262 a8,8 0 0 1 8,8 V86 H40 Z" fill="#b7791f"/><text x="51" y="78" font-size="11.8" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">DIM  Date</text><text x="51" y="105" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="start">date (key)  ·  1,096 rows</text><text x="51" y="122" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="start">year, quarter, month no.,</text><text x="51" y="139" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="start">month name, is_weekend</text><text x="51" y="156" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="start">Marked as date table</text><rect x="663" y="64" width="230" height="120" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="660" y="60" width="230" height="120" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><path d="M660,68 a8,8 0 0 1 8,-8 H882 a8,8 0 0 1 8,8 V86 H660 Z" fill="#2f7d6d"/><text x="671" y="78" font-size="11.8" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">DIM  Customer</text><text x="671" y="105" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="start">customer_id (key)</text><text x="671" y="122" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="start">customer_name, city, region,</text><text x="671" y="139" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="start">segment, signup_date</text><text x="671" y="156" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="start">5,027 rows</text><rect x="43" y="334" width="230" height="110" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="40" y="330" width="230" height="110" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><path d="M40,338 a8,8 0 0 1 8,-8 H262 a8,8 0 0 1 8,8 V356 H40 Z" fill="#2f7d6d"/><text x="51" y="348" font-size="11.8" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">DIM  Product</text><text x="51" y="375" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="start">product_id (key)</text><text x="51" y="392" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="start">product_name, category,</text><text x="51" y="409" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="start">unit_price, unit_cost  ·  8 rows</text><rect x="663" y="334" width="230" height="110" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="660" y="330" width="230" height="110" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><path d="M660,338 a8,8 0 0 1 8,-8 H882 a8,8 0 0 1 8,8 V356 H660 Z" fill="#2f7d6d"/><text x="671" y="348" font-size="11.8" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">DIM  Employee</text><text x="671" y="375" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="start">employee_id (key)</text><text x="671" y="392" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="start">employee_name, job_title,</text><text x="671" y="409" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="start">manager  ·  16 rows</text><rect x="343" y="434" width="250" height="90" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="340" y="430" width="250" height="90" rx="8" fill="#fff" stroke="#7a4fa0" stroke-width="1.6" /><path d="M340,438 a8,8 0 0 1 8,-8 H582 a8,8 0 0 1 8,8 V456 H340 Z" fill="#7a4fa0"/><text x="351" y="448" font-size="11.8" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">FACT  Targets</text><text x="351" y="475" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="start">target_month (→ Date)</text><text x="351" y="492" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="start">target_revenue  ·  36 rows</text><path d="M272,140 L338,205" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M338,205 L331.4,202.7 L335.6,198.4 Z" fill="#5b6475"/><path d="M658,140 L592,205" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M592,205 L594.4,198.4 L598.6,202.7 Z" fill="#5b6475"/><path d="M272,360 L338,300" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M338,300 L335.4,306.5 L331.3,302.0 Z" fill="#5b6475"/><path d="M658,360 L592,300" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M592,300 L598.7,302.0 L594.6,306.5 Z" fill="#5b6475"/><path d="M465,428 L465,352" fill="none" stroke="#5b6475" stroke-width="1.5" stroke-linejoin="round"/><path d="M465,352 L468.0,358.3 L462.0,358.3 Z" fill="#5b6475"/><text x="285" y="150" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">1 → ∗</text><text x="610" y="150" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">1 → ∗</text><text x="285" y="352" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">1 → ∗</text><text x="610" y="352" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">1 → ∗</text><text x="478" y="400" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">1 → ∗</text><text x="30" y="548" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">One row per order line in the fact table; one row per thing in each dimension. Filters flow from the dimensions down into the facts,</text><text x="30" y="566" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">which is why every table joins to Date rather than to each other. Both fact tables use the Date dimension, at different grains.</text></svg>