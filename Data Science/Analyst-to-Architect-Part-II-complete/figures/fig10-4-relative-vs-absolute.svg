o, monospace">…</text><rect x="540" y="176" width="454" height="28" rx="0" fill="#fff" stroke="#c9d3df" stroke-width="0.8" /><text x="548" y="194" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">331</text><text x="592" y="194" font-size="11.3" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">=J331/SUM($J$2:$J$331)</text><text x="986" y="194" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="end" font-family="DejaVu Sans Mono, monospace">0.198%</text><rect x="540" y="214" width="454" height="30" rx="5" fill="#e2f3ee" stroke="none" stroke-width="1" /><text x="550" y="234" font-size="12.3" fill="#2f7d6d" font-weight="bold" text-anchor="start">Shares add up to 100.0%: every row divides by the same total</text><text x="30" y="290" font-size="12.3" fill="#5b6475" font-weight="normal" text-anchor="start">Press F4 (Windows) or Cmd+T (Mac Excel) while the cursor is in a reference to cycle J2 → $J$2 → J$2 → $J2. Google Sheets uses F4 too.</text></svg>