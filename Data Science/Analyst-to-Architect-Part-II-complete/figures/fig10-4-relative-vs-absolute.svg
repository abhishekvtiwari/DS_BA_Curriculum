<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="305" viewBox="0 0 1040 305" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1040" height="305" fill="#ffffff"/><text x="30" y="34" font-size="14" fill="#b23b3b" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Relative: the range slides down</text><text x="30" y="54" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">=J2/SUM(J2:J331) filled from O2 to O331</text><rect x="30" y="68" width="454" height="24" rx="4" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="38" y="85" font-size="11" fill="#fff" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">row</text><text x="82" y="85" font-size="11" fill="#fff" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">formula in O (copied down)</text><text x="382" y="85" font-size="11" fill="#fff" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">result</text><rect x="30" y="92" width="454" height="28" rx="0" fill="#fff" stroke="#c9d3df" stroke-width="0.8" /><text x="38" y="110" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">2</text><text x="82" y="110" font-size="11.3" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">=J2/SUM(J2:J331)</text><text x="476" y="110" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="end" font-family="DejaVu Sans Mono, monospace">0.066%</text><rect x="30" y="120" width="454" height="28" rx="0" fill="#fff" stroke="#c9d3df" stroke-width="0.8" /><text x="38" y="138" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">3</text><text x="82" y="138" font-size="11.3" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">=J3/SUM(J3:J3