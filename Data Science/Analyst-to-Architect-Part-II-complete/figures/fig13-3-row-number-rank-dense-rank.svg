<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="280" viewBox="0 0 1050 280" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1050" height="280" fill="#ffffff"/><text x="30" y="42" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Units sold, ranked three ways</text><rect x="30" y="50" width="570" height="24" rx="4" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="38" y="66.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">product_name</text><text x="218" y="66.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">units</text><text x="288" y="66.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">ROW_NUMBER</text><text x="408" y="66.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">RANK</text><text x="488" y="66.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">DENSE_RANK</text><rect x="30" y="74" width="570" height="24" rx="0" fill="#fff" stroke="#c9d3df" stroke-width="0.8" /><text x="38" y="90.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Water Bottle 1L</text><text x="218" y="90.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">230</text><text x="288" y="90.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">1</text><text x="408" y="90.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">1</text><text x="488" y="90.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">1</text><rect x="30" y="98" width="570" height="24" rx="0" fill="#fff" stroke="#c9d3df" stroke-width="0.8" /><text x="38" y="114.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Industrial Crate</text><text x="218" y="114.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">125</text><text x="288" y="114.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">2</text><text x="408" y="114.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">2</text><text x="488" y="114.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">2</text><rect x="30" y="122" width="570" height="24" rx="0" fill="#fff4d6" stroke="#c9d3df" stroke-width="0.8" /><text x="38" y="138.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Food Container Set</text><text x="218" y="138.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">85</text><text x="288" y="138.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">3</text><text x="408" y="138.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">3</text><text x="488" y="138.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">3</text><rect x="30" y="146" width="570" height="24" rx="0" fill="#fff4d6" stroke="#c9d3df" stroke-width="0.8" /><text x="38" y="162.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Storage Box 10L</text><text x="218" y="162.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">85</text><text x="288" y="162.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">4</text><text x="408" y="162.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">3</text><text x="488" y="162.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">3</text><rect x="30" y="170" width="570" height="24" rx="0" fill="#fff" stroke="#c9d3df" stroke-width="0.8" /><text x="38" y="186.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Storage Box 25L</text><text x="218" y="186.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">60</text><text x="288" y="186.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">5</text><text x="408" y="186.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">5</text><text x="488" y="186.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">4</text><rect x="30" y="194" width="570" height="24" rx="0" fill="#fff" stroke="#c9d3df" stroke-width="0.8" /><text x="38" y="210.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Garden Chair</text><text x="218" y="210.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">0</text><text x="288" y="210.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">6</text><text x="408" y="210.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">6</text><text x="488" y="210.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">5</text><rect x="640" y="52" width="380" height="62" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="654" y="70" font-size="13" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">ROW_NUMBER</text><text x="654" y="89" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Always 1, 2, 3, 4… Ties get different numbers,</text><text x="654" y="106" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">so add a tie-breaker to ORDER BY (here: product name).</text><rect x="640" y="124" width="380" height="62" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="654" y="142" font-size="13" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">RANK</text><text x="654" y="161" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Ties share a number, then it skips: 3, 3, 5.</text><text x="654" y="178" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Like a race: two joint third places, then fifth.</text><rect x="640" y="196" width="380" height="62" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="654" y="214" font-size="13" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">DENSE_RANK</text><text x="654" y="233" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">Ties share a number, no gaps: 3, 3, 4.</text><text x="654" y="250" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">Use it for &#x27;the top 3 distinct sales levels&#x27;.</text></svg>