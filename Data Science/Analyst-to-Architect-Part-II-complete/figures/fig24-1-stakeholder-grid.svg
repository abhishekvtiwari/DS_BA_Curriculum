<svg xmlns="http://www.w3.org/2000/svg" width="940" height="522" viewBox="0 0 940 522" font-family="DejaVu Sans, Arial, sans-serif"><rect width="940" height="522" fill="#ffffff"/><text x="30" y="30" font-size="14.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Stakeholder mapping: power vs. interest</text><rect x="140" y="60" width="760" height="420" rx="0" fill="#fff" stroke="#c9d3df" stroke-width="1.4" /><path d="M520.0,60 V480" fill="none" stroke="#c9d3df" stroke-width="1" stroke-linejoin="round"/><path d="M140,270.0 H900" fill="none" stroke="#c9d3df" stroke-width="1" stroke-linejoin="round"/><text x="330.0" y="78" font-size="11.5" fill="#5b6475" font-weight="bold" text-anchor="middle">Keep satisfied</text><text x="330.0" y="93" font-size="9.5" fill="#5b6475" font-weight="normal" text-anchor="middle">(high power, low interest)</text><text x="710.0" y="78" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="middle">Manage closely</text><text x="710.0" y="93" font-size="9.5" fill="#5b6475" font-weight="normal" text-anchor="middle">(high power, high interest)</text><text x="330.0" y="472" font-size="11.5" fill="#5b6475" font-weight="bold" text-anchor="middle">Monitor</text><text x="330.0" y="487" font-size="9.5" fill="#5b6475" font-weight="normal" text-anchor="middle">(low power, low interest)</text><text x="710.0" y="472" font-size="11.5" fill="#5b6475" font-weight="bold" text-anchor="middle">Keep informed</text><text x="710.0" y="487" font-size="9.5" fill="#5b6475" font-weight="normal" text-anchor="middle">(low power, high interest)</text><text x="126" y="270.0" font-size="11" fill="#5b6475" font-weight="bold" text-anchor="middle">POWER</text><g transform="rotate(-90 126 270.0)"><text x="126" y="270.0" font-size="11" fill="#5b6475" font-weight="bold" text-anchor="middle">POWER</text></g><text x="520.0" y="502" font-size="11" fill="#5b6475" font-weight="bold" text-anchor="middle">INTEREST →</text><circle cx="763.1999999999999" cy="102.0" r="5" fill="#0f5c8c"/><text x="772.1999999999999" y="98.0" font-size="9.8" fill="#1d2330" font-weight="bold" text-anchor="start">Anita Rao</text><text x="772.1999999999999" y="110.0" font-size="9.8" fill="#1d2330" font-weight="None" text-anchor="start">(Sales Head)</text><circle cx="656.8000000000001" cy="144.0" r="5" fill="#0f5c8c"/><text x="665.8000000000001" y="140.0" font-size="9.8" fill="#1d2330" font-weight="bold" text-anchor="start">Vikram Singh</text><text x="665.8000000000001" y="152.0" font-size="9.8" fill="#1d2330" font-weight="None" text-anchor="start">(Sales Mgr)</text><circle cx="710.0" cy="333.0" r="5" fill="#b7791f"/><text x="719.0" y="329.0" font-size="9.8" fill="#1d2330" font-weight="bold" text-anchor="start">Finance Controller</text><circle cx="558.0" cy="123.0" r="5" fill="#2f7d6d"/><text x="567.0" y="119.0" font-size="9.8" fill="#1d2330" font-weight="bold" text-anchor="start">Regional Sales Managers</text><circle cx="368.0" cy="248.99999999999997" r="5" fill="#5b6475"/><text x="377.0" y="244.99999999999997" font-size="9.8" fill="#1d2330" font-weight="bold" text-anchor="start">Branch staff</text><circle cx="596.0" cy="396.0" r="5" fill="#7a4fa0"/><text x="605.0" y="392.0" font-size="9.8" fill="#1d2330" font-weight="bold" text-anchor="start">IT / ERP team</text><circle cx="824.0" cy="417.0" r="5" fill="#b23b3b"/><text x="833.0" y="413.0" font-size="9.8" fill="#1d2330" font-weight="bold" text-anchor="start">Board / owning family</text><text x="30" y="504" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">Manage closely = involve in requirements and review drafts. Keep informed = share findings, don&#x27;t ask for time. Keep satisfied = brief them once, on their terms.</text></svg>