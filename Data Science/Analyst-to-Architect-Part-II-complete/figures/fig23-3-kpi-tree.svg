<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="420" viewBox="0 0 1010 420" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1010" height="420" fill="#ffffff"/><text x="30" y="30" font-size="14.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">A KPI tree: revenue decomposed into things a team can act on</text><rect x="403" y="62" width="220" height="64" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="400" y="58" width="220" height="64" rx="8" fill="#fff" stroke="₹114.7 cr" stroke-width="1.6" /><path d="M400,66 a8,8 0 0 1 8,-8 H612 a8,8 0 0 1 8,8 V84 H400 Z" fill="₹114.7 cr"/><text x="411" y="76" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Net revenue</text><rect x="123" y="164" width="180" height="90" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="120" y="160" width="180" height="90" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><path d="M120,168 a8,8 0 0 1 8,-8 H292 a8,8 0 0 1 8,8 V186 H120 Z" fill="#0f5c8c"/><text x="131" y="178" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Active customers</text><text x="131" y="205" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="start">4,599 in 2025</text><text x="131" y="222" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="start">new + retained − churned</text><rect x="333" y="164" width="180" height="90" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="330" y="160" width="180" height="90" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><path d="M330,168 a8,8 0 0 1 8,-8 H502 a8,8 0 0 1 8,8 V186 H330 Z" fill="#2f7d6d"/><text x="341" y="178" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Orders per customer</text><text x="341" y="205" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="start">≈10.1 / year</text><text x="341" y="222" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="start">frequency</text><rect x="543" y="164" width="180" height="90" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="540" y="160" width="180" height="90" rx="8" fill="#fff" stroke="#c0662b" stroke-width="1.6" /><path d="M540,168 a8,8 0 0 1 8,-8 H712 a8,8 0 0 1 8,8 V186 H540 Z" fill="#c0662b"/><text x="551" y="178" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Average order value</text><text x="551" y="205" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="start">₹24,736</text><text x="551" y="222" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="start">price × basket size</text><rect x="753" y="164" width="180" height="90" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="750" y="160" width="180" height="90" rx="8" fill="#fff" stroke="#7a4fa0" stroke-width="1.6" /><path d="M750,168 a8,8 0 0 1 8,-8 H922 a8,8 0 0 1 8,8 V186 H750 Z" fill="#7a4fa0"/><text x="761" y="178" font-size="11.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Gross margin</text><text x="761" y="205" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="start">27.5%</text><text x="761" y="222" font-size="10.4" fill="#1d2330" font-weight="normal" text-anchor="start">price − cost of goods</text><path d="M510,122 L210,158" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M210,158 L215.9,154.2 L216.6,160.3 Z" fill="#5b6475"/><path d="M510,122 L420,158" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M420,158 L424.7,152.8 L427.0,158.5 Z" fill="#5b6475"/><path d="M510,122 L630,158" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M630,158 L623.1,15