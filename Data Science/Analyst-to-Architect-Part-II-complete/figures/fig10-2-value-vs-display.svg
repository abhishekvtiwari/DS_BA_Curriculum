<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="360" viewBox="0 0 1060 360" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1060" height="360" fill="#ffffff"/><text x="30" y="32" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">You see</text><text x="230" y="32" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The cell really contains</text><text x="470" y="32" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Type</text><text x="640" y="32" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Why it matters</text><rect x="30" y="52" width="150" height="40" rx="0" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="170" y="78" font-size="15" fill="#1d2330" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">32,063</text><path d="M188,72 L222,72" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M222,72 L215.7,75.0 L215.7,69.0 Z" fill="#5b6475"/><rect x="230" y="52" width="210" height="40" rx="4" fill="#f6f9fc" stroke="#c0662b" stroke-width="1.5" /><text x="242" y="78" font-size="15" fill="#c0662b" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">32062.5</text><rect x="470" y="60" width="140" height="24" rx="12" fill="#fff" stroke="#c0662b" stroke-width="1" /><text x="540" y="76" font-size="11.5" fill="#c0662b" font-weight="bold" text-anchor="middle">Number</text><text x="640" y="77" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">A display format rounds what you see; formulas use 32062.5</text><rect x="30" y="122" width="150" height="40" rx="0" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="170" y="148" font-size="15" fill="#1d2330" font-weight="normal" text-anchor="end" font-family="DejaVu Sans Mono, monospace">2025-01-02</text><path d="M188,142 L222,142" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M222,142 L215.7,145.0 L215.7,139.0 Z" fill="#5b6475"/><rect x="230" y="122" width="210" height="40" rx="4" fill="#f6f9fc" stroke="#2f7d6d" stroke-width="1.5" /><text x="242" y="148" font-size="15" fill="#2f7d6d" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">45659</text><rect x="470" y="130" width="140" height="24" rx="12" fill="#fff" stroke="#2f7d6d" stroke-width="1" /><text x="540" y="146" font-size="11.5" fill="#2f7d6d" font-weight="bold" text-anchor="middle">Number (a date)</text><text x="640" y="147" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">Dates are day counts; the format makes 45659 look like a date</text><rect x="30" y="192" width="150" height="40" rx="0" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="40" y="218" font-size="15" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">0005</text><path d="M188,212 L222,212" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M222,212 L215.7,215.0 L215.7,209.0 Z" fill="#5b6475"/><rect x="230" y="192" width="210" height="40" rx="4" fill="#f6f9fc" stroke="#7a4fa0" stroke-width="1.5" /><text x="242" y="218" font-size="15" fill="#7a4fa0" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">0005</text><rect x="470" y="200" width="140" height="24" rx="12" fill="#fff" stroke="#7a4fa0" stroke-width="1" /><text x="540" y="216" font-size="11.5" fill="#7a4fa0" font-weight="bold" text-anchor="middle">Text</text><text x="640" y="217" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">A code, not a quantity: text keeps its leading zeros</text><rect x="30" y="262" width="150" height="40" rx="0" fill="#fff" stroke="#c9d3df" stroke-width="1.2" /><text x="40" y="288" font-size="15" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">2900</text><path d="M188,282 L222,282" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M222,282 L215.7,285.0 L215.7,279.0 Z" fill="#5b6475"/><rect x="230" y="262" width="210" height="40" rx="4" fill="#f6f9fc" stroke="#b23b3b" stroke-width="1.5" /><text x="242" y="288" font-size="15" fill="#b23b3b" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">2900␣</text><rect x="470" y="270" width="140" height="24" rx="12" fill="#fff" stroke="#b23b3b" stroke-width="1" /><text x="540" y="286" font-size="11.5" fill="#b23b3b" font-weight="bold" text-anchor="middle">Text</text><text x="640" y="287" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">A trailing space makes it text: SUM ignores it, LEN says 5</text><text x="30" y="340" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start">Check with the formula bar, =ISNUMBER(A1), =ISTEXT(A1), and =LEN(A1). Numbers align right by default; text aligns left.</text></svg>