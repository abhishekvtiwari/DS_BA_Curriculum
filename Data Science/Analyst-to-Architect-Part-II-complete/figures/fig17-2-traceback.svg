<svg xmlns="http://www.w3.org/2000/svg" width="1210" height="290" viewBox="0 0 1210 290" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1210" height="290" fill="#ffffff"/><text x="30" y="32" font-size="14.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">How to read a traceback</text><rect x="30" y="56" width="700" height="150" rx="8" fill="#fff" stroke="#c9d3df" stroke-width="1" /><text x="46" y="80" font-size="10.6" fill="#1d2330" font-weight="None" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Traceback (most recent call last):</text><text x="46" y="97" font-size="10.6" fill="#1d2330" font-weight="None" text-anchor="start" font-family="DejaVu Sans Mono, monospace">  File &quot;summarize.py&quot;, line 41, in &lt;module&gt;</text><text x="46" y="114" font-size="10.6" fill="#1d2330" font-weight="None" text-anchor="start" font-family="DejaVu Sans Mono, monospace">    raise SystemExit(main(folder))</text><text x="46" y="131" font-size="10.6" fill="#1d2330" font-weight="None" text-anchor="start" font-family="DejaVu Sans Mono, monospace">  File &quot;summarize.py&quot;, line 28, in main</text><text x="46" y="148" font-size="10.6" fill="#1d2330" font-weight="None" text-anchor="start" font-family="DejaVu Sans Mono, monospace">    s = summarize(path)</text><text x="46" y="165" font-size="10.6" fill="#1d2330" font-weight="None" text-anchor="start" font-family="DejaVu Sans Mono, monospace">  File &quot;summarize.py&quot;, line 19, in summarize</text><text x="46" y="182" font-size="10.6" fill="#1d2330" font-weight="None" text-anchor="start" font-family="DejaVu Sans Mono, monospace">    values.append(float(row[&quot;net_revenue&quot;]))</text><text x="46" y="199" font-size="10.6" fill="#b23b3b" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">ValueError: could not convert string to float: &#x27;&#x27;</text><path d="M760,196 L742,196" fill="none" stroke="#b23b3b" stroke-width="1.6" stroke-linejoin="round"/><path d="M742,196 L748.3,193.0 L748.3,199.0 Z" fill="#b23b3b"/><text x="768" y="192" font-size="11.6" fill="#b23b3b" font-weight="bold" text-anchor="start">1. Read this first: what went wrong</text><path d="M760,175 L742,175" fill="none" stroke="#0f5c8c" stroke-width="1.6" stroke-linejoin="round"/><path d="M742,175 L748.3,172.0 L748.3,178.0 Z" fill="#0f5c8c"/><text x="768" y="171" font-size="11.6" fill="#0f5c8c" font-weight="bold" text-anchor="start">2. Then this: the line that failed</text><path d="M760,158 L742,158" fill="none" stroke="#0f5c8c" stroke-width="1.6" stroke-linejoin="round"/><path d="M742,158 L748.3,155.0 L748.3,161.0 Z" fill="#0f5c8c"/><text x="768" y="154" font-size="11.6" fill="#0f5c8c" font-weight="bold" text-anchor="start">3. Your file and line number</text><path d="M760,90 L742,90" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M742,90 L748.3,87.0 L748.3,93.0 Z" fill="#5b6475"/><text x="768" y="86" font-size="11.6" fill="#5b6475" font-weight="normal" text-anchor="start">4. The chain that led there (top = oldest)</text><rect x="30" y="222" width="1170" height="52" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.5" /><rect x="30" y="222" width="8" height="52" rx="0" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="52" y="244" font-size="12.2" fill="#1d2330" font-weight="bold" text-anchor="start">What it tells you here:</text><text x="52" y="264" font-size="11.4" fill="#5b6475" font-weight="normal" text-anchor="start">a blank net_revenue in the CSV reached float(). Fix by converting defensively and counting what failed (section 17.12).</text></svg>