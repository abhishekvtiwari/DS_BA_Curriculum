<svg xmlns="http://www.w3.org/2000/svg" width="890" height="412" viewBox="0 0 890 412" font-family="DejaVu Sans, Arial, sans-serif"><rect width="890" height="412" fill="#ffffff"/><text x="30" y="32" font-size="14.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The pieces of Power BI, and where each one runs</text><rect x="33" y="64" width="250" height="150" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="30" y="60" width="250" height="150" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><path d="M30,68 a8,8 0 0 1 8,-8 H272 a8,8 0 0 1 8,8 V86 H30 Z" fill="#0f5c8c"/><text x="41" y="78" font-size="11.8" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Power BI Desktop (Windows, free)</text><text x="41" y="105" font-size="10.8" fill="#1d2330" font-weight="normal" text-anchor="start">Connect and transform (Power Query)</text><text x="41" y="122" font-size="10.8" fill="#1d2330" font-weight="normal" text-anchor="start">Model tables and relationships</text><text x="41" y="139" font-size="10.8" fill="#1d2330" font-weight="normal" text-anchor="start">Write DAX measures</text><text x="41" y="156" font-size="10.8" fill="#1d2330" font-weight="normal" text-anchor="start">Design report pages</text><text x="41" y="173" font-size="10.8" fill="#1d2330" font-weight="normal" text-anchor="start">Saves one .pbix file</text><rect x="333" y="64" width="250" height="150" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="330" y="60" width="250" height="150" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><path d="M330,68 a8,8 0 0 1 8,-8 H572 a8,8 0 0 1 8,8 V86 H330 Z" fill="#2f7d6d"/><text x="341" y="78" font-size="11.8" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Power BI Service (browser)</text><text x="341" y="105" font-size="10.8" fill="#1d2330" font-weight="normal" text-anchor="start">Workspace holds the content</text><text x="341" y="122" font-size="10.8" fill="#1d2330" font-weight="normal" text-anchor="start">Semantic model (the data + DAX)</text><text x="341" y="139" font-size="10.8" fill="#1d2330" font-weight="normal" text-anchor="start">Reports and dashboards</text><text x="341" y="156" font-size="10.8" fill="#1d2330" font-weight="normal" text-anchor="start">Scheduled refresh, apps, sharing</text><text x="341" y="173" font-size="10.8" fill="#1d2330" font-weight="normal" text-anchor="start">Row-level security applied</text><rect x="633" y="64" width="230" height="150" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="630" y="60" width="230" height="150" rx="8" fill="#fff" stroke="#7a4fa0" stroke-width="1.6" /><path d="M630,68 a8,8 0 0 1 8,-8 H852 a8,8 0 0 1 8,8 V86 H630 Z" fill="#7a4fa0"/><text x="641" y="78" font-size="11.8" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Readers</text><text x="641" y="105" font-size="10.8" fill="#1d2330" font-weight="normal" text-anchor="start">Browser or mobile app</text><text x="641" y="122" font-size="10.8" fill="#1d2330" font-weight="normal" text-anchor="start">An app or a shared link</text><text x="641" y="139" font-size="10.8" fill="#1d2330" font-weight="normal" text-anchor="start">Licence needed to view</text><text x="641" y="156" font-size="10.8" fill="#1d2330" font-weight="normal" text-anchor="start">Export to Excel or PDF</text><text x="641" y="173" font-size="10.8" fill="#1d2330" font-weight="normal" text-anchor="start">Subscriptions by email</text><path d="M284,120 L326,120" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M326,120 L319.7,123.0 L319.7,117.0 Z" fill="#5b6475"/><text x="288" y="112" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">publish</text><path d="M584,120 L626,120" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M626,120 L619.7,123.0 L619.7,117.0 Z" fill="#5b6475"/><text x="590" y="112" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">share</text><rect x="33" y="254" width="250" height="120" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="30" y="250" width="250" height="120" rx="8" fill="#fff" stroke="#b7791f" stroke-width="1.6" /><path d="M30,258 a8,8 0 0 1 8,-8 H272 a8,8 0 0 1 8,8 V276 H30 Z" fill="#b7791f"/><text x="41" y="268" font-size="11.8" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Your data sources</text><text x="41" y="295" font-size="10.8" fill="#1d2330" font-weight="normal" text-anchor="start">riverstone_full (PostgreSQL/MySQL)</text><text x="41" y="312" font-size="10.8" fill="#1d2330" font-weight="normal" text-anchor="start">CSV, Excel, SharePoint</text><text x="41" y="329" font-size="10.8" fill="#1d2330" font-weight="normal" text-anchor="start">Cloud services (APIs)</text><rect x="333" y="254" width="250" height="120" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="330" y="250" width="250" height="120" rx="8" fill="#fff" stroke="#c0662b" stroke-width="1.6" /><path d="M330,258 a8,8 0 0 1 8,-8 H572 a8,8 0 0 1 8,8 V276 H330 Z" fill="#c0662b"/><text x="341" y="268" font-size="11.8" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">On-premises data gateway</text><text x="341" y="295" font-size="10.8" fill="#1d2330" font-weight="normal" text-anchor="start">Only for data inside the network</text><text x="341" y="312" font-size="10.8" fill="#1d2330" font-weight="normal" text-anchor="start">Installed on a server that</text><text x="341" y="329" font-size="10.8" fill="#1d2330" font-weight="normal" text-anchor="start">can reach the database</text><path d="M155,246 L155,214" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M155,214 L158.0,220.3 L152.0,220.3 Z" fill="#5b6475"/><text x="160" y="232" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">import or query</text><path d="M330,310 L286,310" fill="none" stroke="#c0662b" stroke-width="1.6" stroke-linejoin="round"/><path d="M286,310 L292.3,307.0 L292.3,313.0 Z" fill="#c0662b"/><path d="M455,246 L455,214" fill="none" stroke="#c0662b" stroke-width="1.6" stroke-linejoin="round"/><path d="M455,214 L458.0,220.3 L452.0,220.3 Z" fill="#c0662b"/><text x="462" y="232" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="start">scheduled refresh</text><text x="30" y="395" font-size="11.5" fill="#5b6475" font-weight="normal" text-anchor="start">Desktop builds it; the Service runs it on a schedule and shares it. Nothing you build is visible to anyone until you publish.</text></svg>