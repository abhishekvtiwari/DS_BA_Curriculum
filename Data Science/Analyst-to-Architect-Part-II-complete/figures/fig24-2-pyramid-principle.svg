<svg xmlns="http://www.w3.org/2000/svg" width="940" height="330" viewBox="0 0 940 330" font-family="DejaVu Sans, Arial, sans-serif"><rect width="940" height="330" fill="#ffffff"/><text x="30" y="30" font-size="14.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The pyramid principle: how you think is not how you tell it</text><text x="30" y="58" font-size="12.5" fill="#5b6475" font-weight="bold" text-anchor="start">How the analysis was built (bottom-up)</text><rect x="30" y="80" width="300" height="24" rx="4" fill="#fff" stroke="#c9d3df" stroke-width="1" /><text x="42" y="96" font-size="10.3" fill="#1d2330" font-weight="normal" text-anchor="start">Pulled Nov &amp; Dec order data</text><path d="M180,104 L180,106" fill="none" stroke="#5b6475" stroke-width="1.2" stroke-linejoin="round"/><path d="M180,106 L177.0,99.7 L183.0,99.7 Z" fill="#5b6475"/><rect x="30" y="110" width="300" height="24" rx="4" fill="#fff" stroke="#c9d3df" stroke-width="1" /><text x="42" y="126" font-size="10.3" fill="#1d2330" font-weight="normal" text-anchor="start">Computed customers, orders/cust, AOV</text><path d="M180,134 L180,136" fill="none" stroke="#5b6475" stroke-width="1.2" stroke-linejoin="round"/><path d="M180,136 L177.0,129.7 L183.0,129.7 Z" fill="#5b6475"/><rect x="30" y="140" width="300" height="24" rx="4" fill="#fff" stroke="#c9d3df" stroke-width="1" /><text x="42" y="156" font-size="10.3" fill="#1d2330" font-weight="normal" text-anchor="start">Ran the chain-linked decomposition</text><path d="M180,164 L180,166" fill="none" stroke="#5b6475" stroke-width="1.2" stroke-linejoin="round"/><path d="M180,166 L177.0,159.7 L183.0,159.7 Z" fill="#5b6475"/><rect x="30" y="170" width="300" height="24" rx="4" fill="#fff" stroke="#c9d3df" stroke-width="1" /><text x="42" y="186" font-size="10.3" fill="#1d2330" font-weight="normal" text-anchor="start">Checked segment mix for a confound</text><path d="M180,194 L180,196" fill="none" stroke="#5b6475" stroke-width="1.2" stroke-linejoin="round"/><path d="M180,196 L177.0,189.7 L183.0,189.7 Z" fill="#5b6475"/><rect x="30" y="200" width="300" height="24" rx="4" fill="#fff" stroke="#c9d3df" stroke-width="1" /><text x="42" y="216" font-size="10.3" fill="#1d2330" font-weight="normal" text-anchor="start">Compared with the May–June pattern</text><path d="M180,224 L180,226" fill="none" stroke="#5b6475" stroke-width="1.2" stroke-linejoin="round"/><path d="M180,226 L177.0,219.7 L183.0,219.7 Z" fill="#5b6475"/><rect x="30" y="230" width="300" height="24" rx="4" fill="#fff" stroke="#c9d3df" stroke-width="1" /><text x="42" y="246" font-size="10.3" fill="#1d2330" font-weight="normal" text-anchor="start">Concluded: seasonal, no action needed</text><path d="M345,190 L395,190" fill="none" stroke="#0f5c8c" stroke-width="2" stroke-linejoin="round"/><path d="M395,190 L388.7,193.0 L388.7,187.0 Z" fill="#0f5c8c"/><text x="430" y="58" font-size="12.5" fill="#5b6475" font-weight="bold" text-anchor="start">How it&#x27;s told to Anita Rao (top-down)</text><polygon points="540.0,160 820.0,160 795.0,120 565.0,120" fill="#0f5c8c" stroke="#0f5c8c" stroke-width="1"/><text x="680" y="144" font-size="10.6" fill="#fff" font-weight="bold" text-anchor="middle">December&#x27;s fall is seasonal — no action needed</text><polygon points="575.0,210 785.0,210 760.0,170 600.0,170" fill="#2f7d6d" stroke="#0f5c8c" stroke-width="1"/><text x="680" y="194" font-size="10.6" fill="#fff" font-weight="None" text-anchor="middle">Because: AOV drove 66% of it, mix didn&#x27;t shift, same pattern as June</text><polygon points="610.0,260 750.0,260 725.0,220 635.0,220" fill="#dfe5ec" stroke="#0f5c8c" stroke-width="1"/><text x="680" y="244" font-size="9.8" fill="#1d2330" font-weight="None" text-anchor="middle">Detail: the decomposition, the segment table, the appendix</text><text x="430" y="290" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">Say the answer first. The reasoning and the detail support it —</text><text x="430" y="306" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">they don&#x27;t have to be discovered in the order you found them.</text></svg>