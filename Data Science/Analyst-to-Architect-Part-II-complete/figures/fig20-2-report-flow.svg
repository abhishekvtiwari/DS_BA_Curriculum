<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="300" viewBox="0 0 1110 300" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1110" height="300" fill="#ffffff"/><text x="30" y="34" font-size="15" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Mapping a report&#x27;s flow, and finding the manual steps</text><rect x="30" y="80" width="160" height="96" rx="7" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><text x="42" y="104" font-size="11.8" fill="#1d2330" font-weight="bold" text-anchor="start">ERP export</text><text x="42" y="124" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">daily, 02:00</text><rect x="42" y="136" width="136" height="26" rx="4" fill="#2f7d6d" stroke="none" stroke-width="1" /><text x="110" y="154" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">automatic</text><path d="M192,128 L208,128" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M208,128 L201.7,131.0 L201.7,125.0 Z" fill="#5b6475"/><rect x="210" y="80" width="160" height="96" rx="7" fill="#fff" stroke="#b23b3b" stroke-width="1.6" /><text x="222" y="104" font-size="11.8" fill="#1d2330" font-weight="bold" text-anchor="start">Analyst opens 4 files</text><text x="222" y="124" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">08:30</text><rect x="222" y="136" width="136" height="26" rx="4" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="290" y="154" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">MANUAL 25 min</text><path d="M372,128 L388,128" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M388,128 L381.7,131.0 L381.7,125.0 Z" fill="#5b6475"/><rect x="390" y="80" width="160" height="96" rx="7" fill="#fff" stroke="#b23b3b" stroke-width="1.6" /><text x="402" y="104" font-size="11.8" fill="#1d2330" font-weight="bold" text-anchor="start">Clean and combine</text><text x="402" y="124" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">in a workbook</text><rect x="402" y="136" width="136" height="26" rx="4" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="470" y="154" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">MANUAL 30 min</text><path d="M552,128 L568,128" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M568,128 L561.7,131.0 L561.7,125.0 Z" fill="#5b6475"/><rect x="570" y="80" width="160" height="96" rx="7" fill="#fff" stroke="#b23b3b" stroke-width="1.6" /><text x="582" y="104" font-size="11.8" fill="#1d2330" font-weight="bold" text-anchor="start">Pivot + chart</text><text x="582" y="124" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">in the same workbook</text><rect x="582" y="136" width="136" height="26" rx="4" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="650" y="154" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">MANUAL 20 min</text><path d="M732,128 L748,128" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M748,128 L741.7,131.0 L741.7,125.0 Z" fill="#5b6475"/><rect x="750" y="80" width="160" height="96" rx="7" fill="#fff" stroke="#b7791f" stroke-width="1.6" /><text x="762" y="104" font-size="11.8" fill="#1d2330" font-weight="bold" text-anchor="start">Write commentary</text><text x="762" y="124" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">3 sentences</text><rect x="762" y="136" width="136" height="26" rx="4" fill="#b7791f" stroke="none" stroke-width="1" /><text x="830" y="154" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">judgment: keep</text><path d="M912,128 L928,128" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M928,128 L921.7,131.0 L921.7,125.0 Z" fill="#5b6475"/><rect x="930" y="80" width="160" height="96" rx="7" fill="#fff" stroke="#b23b3b" stroke-width="1.6" /><text x="942" y="104" font-size="11.8" fill="#1d2330" font-weight="bold" text-anchor="start">Email to 14 managers</text><text x="942" y="124" font-size="11" fill="#5b6475" font-weight="normal" text-anchor="start">by 10:00</text><rect x="942" y="136" width="136" height="26" rx="4" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="1010" y="154" font-size="11" fill="#fff" font-weight="bold" text-anchor="middle">MANUAL 5 min</text><rect x="30" y="200" width="1050" height="86" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.5" /><rect x="30" y="200" width="9" height="86" rx="0" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="52" y="226" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">What the map tells you</text><text x="52" y="248" font-size="11.6" fill="#1d2330" font-weight="normal" text-anchor="start">80 minutes a day are mechanical; 3 sentences are judgment. Automate the 80, keep the 3, and put them in the email as a comment box.</text><text x="52" y="270" font-size="11.6" fill="#5b6475" font-weight="normal" text-anchor="start">Time the steps for one week before deciding: people are wrong about which step is the slow one.</text></svg>