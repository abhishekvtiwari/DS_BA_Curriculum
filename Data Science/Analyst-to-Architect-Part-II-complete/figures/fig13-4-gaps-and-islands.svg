ins, DejaVu Sans, sans-serif"></text><rect x="30" y="150" width="440" height="24" rx="4" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="38" y="166.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">month</text><text x="118" y="166.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">month_number</text><text x="248" y="166.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">row_number</text><text x="368" y="166.5" font-size="11" fill="#fff" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">island_id</text><rect x="30" y="174" width="440" height="24" rx="0" fill="#efe7f6" stroke="#c9d3df" stroke-width="0.8" /><text x="38" y="190.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Jan</text><text x="118" y="190.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">24301</text><text x="248" y="190.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">1</text><text x="368" y="190.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">24300</text><rect x="30" y="198" width="440" height="24" rx="0" fill="#e2f3ee" stroke="#c9d3df" stroke-width="0.8" /><text x="38" y="214.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Mar</text><text x="118" y="214.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">24303</text><text x="248" y="214.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">2</text><text x="368" y="21