d_id to get each streak:</text><text x="536" y="236" font-size="12.5" fill="#2f7d6d" font-weight="bold" text-anchor="start">   Mar–Jun  →  4 months in a row (the longest)</text><text x="536" y="260" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">   Jan, Aug, Nov  →  1 month each</text><text x="536" y="284" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">Real uses: attendance streaks, machine uptime runs.</text></svg>