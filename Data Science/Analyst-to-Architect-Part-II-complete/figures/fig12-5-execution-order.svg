<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="320" viewBox="0 0 1050 320" font-family="DejaVu Sans, Arial, sans-serif"><rect width="1050" height="320" fill="#ffffff"/><text x="30" y="34" font-size="14" fill="#5b6475" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">You write it in this order</text><rect x="30" y="48" width="112" height="32" rx="16" fill="#eef2f6" stroke="#c9d3df" stroke-width="1" /><text x="86.0" y="69" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">SELECT</text><rect x="156" y="48" width="112" height="32" rx="16" fill="#eef2f6" stroke="#c9d3df" stroke-width="1" /><text x="212.0" y="69" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">FROM</text><rect x="282" y="48" width="112" height="32" rx="16" fill="#eef2f6" stroke="#c9d3df" stroke-width="1" /><text x="338.0" y="69" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">JOIN</text><rect x="408" y="48" width="112" height="32" rx="16" fill="#eef2f6" stroke="#c9d3df" stroke-width="1" /><text x="464.0" y="69" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">WHERE</text><rect x="534" y="48" width="112" height="32" rx="16" fill="#eef2f6" stroke="#c9d3df" stroke-width="1" /><text x="590.0" y="69" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">GROUP BY</text><rect x="660" y="48" width="112" height="32" rx="16" fill="#eef2f6" stroke="#c9d3df" stroke-width="1" /><text x="716.0" y="69" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">HAVING</text><rect x="786" y="48" width="112" height="32" rx="16" fill="#eef2f6" stroke="#c9d3df" stroke-width="1" /><text x="842.0" y="69" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">ORDER BY</text><rect x="912" y="48" width="112" height="32" rx="16" fill="#eef2f6" stroke="#c9d3df" stroke-width="1" /><text x="968.0" y="69" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">LIMIT</text><text x="30" y="122" font-size="14" fill="#0f5c8c" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">The database runs it in this order</text><rect x="30" y="146" width="112" height="82" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.5" /><circle cx="86.0" cy="146" r="12" fill="#0f5c8c"/><text x="86.0" y="150.5" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">1</text><text x="86.0" y="178" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">FROM / JOIN</text><text x="86.0" y="198" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">gather and</text><text x="86.0" y="213" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">combine tables</text><path d="M143,187 H150" fill="none" stroke="#0f5c8c" stroke-width="2" stroke-linejoin="round"/><path d="M150,182 l6,5 l-6,5 z" fill="#0f5c8c"/><rect x="156" y="146" width="112" height="82" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.5" /><circle cx="212.0" cy="146" r="12" fill="#0f5c8c"/><text x="212.0" y="150.5" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">2</text><text x="212.0" y="178" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">WHERE</text><text x="212.0" y="198" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">drop rows</text><path d="M269,187 H276" fill="none" stroke="#0f5c8c" stroke-width="2" stroke-linejoin="round"/><path d="M276,182 l6,5 l-6,5 z" fill="#0f5c8c"/><rect x="282" y="146" width="112" height="82" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.5" /><circle cx="338.0" cy="146" r="12" fill="#0f5c8c"/><text x="338.0" y="150.5" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">3</text><text x="338.0" y="178" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">GROUP BY</text><text x="338.0" y="198" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">make groups</text><path d="M395,187 H402" fill="none" stroke="#0f5c8c" stroke-width="2" stroke-linejoin="round"/><path d="M402,182 l6,5 l-6,5 z" fill="#0f5c8c"/><rect x="408" y="146" width="112" height="82" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.5" /><circle cx="464.0" cy="146" r="12" fill="#0f5c8c"/><text x="464.0" y="150.5" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">4</text><text x="464.0" y="178" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">HAVING</text><text x="464.0" y="198" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">drop groups</text><path d="M521,187 H528" fill="none" stroke="#0f5c8c" stroke-width="2" stroke-linejoin="round"/><path d="M528,182 l6,5 l-6,5 z" fill="#0f5c8c"/><rect x="534" y="146" width="112" height="82" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.5" /><circle cx="590.0" cy="146" r="12" fill="#0f5c8c"/><text x="590.0" y="150.5" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">5</text><text x="590.0" y="178" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">SELECT</text><text x="590.0" y="198" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">compute columns</text><text x="590.0" y="213" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">and aliases</text><path d="M647,187 H654" fill="none" stroke="#0f5c8c" stroke-width="2" stroke-linejoin="round"/><path d="M654,182 l6,5 l-6,5 z" fill="#0f5c8c"/><rect x="660" y="146" width="112" height="82" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.5" /><circle cx="716.0" cy="146" r="12" fill="#0f5c8c"/><text x="716.0" y="150.5" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">6</text><text x="716.0" y="178" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">DISTINCT</text><text x="716.0" y="198" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">remove duplicate</text><text x="716.0" y="213" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">rows</text><path d="M773,187 H780" fill="none" stroke="#0f5c8c" stroke-width="2" stroke-linejoin="round"/><path d="M780,182 l6,5 l-6,5 z" fill="#0f5c8c"/><rect x="786" y="146" width="112" height="82" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.5" /><circle cx="842.0" cy="146" r="12" fill="#0f5c8c"/><text x="842.0" y="150.5" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">7</text><text x="842.0" y="178" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">ORDER BY</text><text x="842.0" y="198" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">sort (aliases</text><text x="842.0" y="213" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">exist now)</text><path d="M899,187 H906" fill="none" stroke="#0f5c8c" stroke-width="2" stroke-linejoin="round"/><path d="M906,182 l6,5 l-6,5 z" fill="#0f5c8c"/><rect x="912" y="146" width="112" height="82" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.5" /><circle cx="968.0" cy="146" r="12" fill="#0f5c8c"/><text x="968.0" y="150.5" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">8</text><text x="968.0" y="178" font-size="11.5" fill="#1d2330" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">LIMIT</text><text x="968.0" y="198" font-size="10.5" fill="#5b6475" font-weight="normal" text-anchor="middle">keep first n</text><rect x="30" y="250" width="994" height="54" rx="6" fill="#fff4d6" stroke="#e2c46b" stroke-width="1" /><text x="46" y="272" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">This is why WHERE can&#x27;t use COUNT(*) or a SELECT alias (step 2 runs before steps 3 and 5),</text><text x="46" y="292" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">and why ORDER BY can use an alias (step 7 runs after step 5).</text></svg>