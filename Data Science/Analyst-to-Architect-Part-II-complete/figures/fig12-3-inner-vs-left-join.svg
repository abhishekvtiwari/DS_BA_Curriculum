width="0.8" /><text x="608" y="296.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Sharma Hardware</text><text x="788" y="296.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">5001</text><rect x="600" y="304" width="280" height="24" rx="0" fill="#fff" stroke="#c9d3df" stroke-width="0.8" /><text x="608" y="320.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Sharma Hardware</text><text x="788" y="320.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">5005</text><rect x="600" y="328" width="280" height="24" rx="0" fill="#fff" stroke="#c9d3df" stroke-width="0.8" /><text x="608" y="344.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Sharma Hardware</text><text x="788" y="344.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">5011</text><rect x="600" y="352" width="280" height="24" rx="0" fill="#fff" stroke="#c9d3df" stroke-width="0.8" /><text x="608" y="368.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Patel Kitchenware</text><text x="788" y="368.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">5003</text><rect x="600" y="376" width="280" height="24" rx="0" fill="#fdecec" stroke="#c9d3df" stroke-width="0.8" /><text x="608" y="392.5" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">Blue Bay Cafe</text><text x="788" y="392.5" font-size="11.5" fill="#b23b3b" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace" font-style="italic">NULL</text><rect x="30" y="262" width="520" height="118" rx="6" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="46" y="290" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">INNER JOIN keeps a row only when both sides match.</text><text x="46" y="314" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">LEFT JOIN keeps every row from the left table (customers);</text><text x="46" y="338" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">where there is no match, the right side is filled with NULL.</text><text x="46" y="362" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">Sharma Hardware appears three times: one output row per match.</text></svg>