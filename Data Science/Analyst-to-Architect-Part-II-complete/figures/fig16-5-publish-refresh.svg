<svg xmlns="http://www.w3.org/2000/svg" width="970" height="352" viewBox="0 0 970 352" font-family="DejaVu Sans, Arial, sans-serif"><rect width="970" height="352" fill="#ffffff"/><text x="30" y="32" font-size="14.5" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">From a .pbix file to a report the branches trust</text><rect x="33" y="70" width="166" height="150" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="30" y="66" width="166" height="150" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><path d="M30,74 a8,8 0 0 1 8,-8 H188 a8,8 0 0 1 8,8 V92 H30 Z" fill="#0f5c8c"/><text x="41" y="84" font-size="11.8" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">1  Build</text><text x="41" y="111" font-size="10.2" fill="#1d2330" font-weight="normal" text-anchor="start">Desktop: Power Query,</text><text x="41" y="128" font-size="10.2" fill="#1d2330" font-weight="normal" text-anchor="start">model, DAX, pages</text><text x="41" y="145" font-size="10.2" fill="#1d2330" font-weight="normal" text-anchor="start">Test with the roles you</text><text x="41" y="162" font-size="10.2" fill="#1d2330" font-weight="normal" text-anchor="start">defined (View as)</text><path d="M198,140 L208,140" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M208,140 L201.7,143.0 L201.7,137.0 Z" fill="#5b6475"/><rect x="215" y="70" width="166" height="150" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="212" y="66" width="166" height="150" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><path d="M212,74 a8,8 0 0 1 8,-8 H370 a8,8 0 0 1 8,8 V92 H212 Z" fill="#2f7d6d"/><text x="223" y="84" font-size="11.8" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">2  Publish</text><text x="223" y="111" font-size="10.2" fill="#1d2330" font-weight="normal" text-anchor="start">Publish to a workspace</text><text x="223" y="128" font-size="10.2" fill="#1d2330" font-weight="normal" text-anchor="start">Semantic model + report</text><text x="223" y="145" font-size="10.2" fill="#1d2330" font-weight="normal" text-anchor="start">land in the Service</text><path d="M380,140 L390,140" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M390,140 L383.7,143.0 L383.7,137.0 Z" fill="#5b6475"/><rect x="397" y="70" width="166" height="150" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="394" y="66" width="166" height="150" rx="8" fill="#fff" stroke="#c0662b" stroke-width="1.6" /><path d="M394,74 a8,8 0 0 1 8,-8 H552 a8,8 0 0 1 8,8 V92 H394 Z" fill="#c0662b"/><text x="405" y="84" font-size="11.8" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">3  Refresh</text><text x="405" y="111" font-size="10.2" fill="#1d2330" font-weight="normal" text-anchor="start">Set credentials</text><text x="405" y="128" font-size="10.2" fill="#1d2330" font-weight="normal" text-anchor="start">Schedule (8/day Pro,</text><text x="405" y="145" font-size="10.2" fill="#1d2330" font-weight="normal" text-anchor="start">48/day PPU)</text><text x="405" y="162" font-size="10.2" fill="#1d2330" font-weight="normal" text-anchor="start">Gateway for on-prem data</text><path d="M562,140 L572,140" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M572,140 L565.7,143.0 L565.7,137.0 Z" fill="#5b6475"/><rect x="579" y="70" width="166" height="150" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="576" y="66" width="166" height="150" rx="8" fill="#fff" stroke="#7a4fa0" stroke-width="1.6" /><path d="M576,74 a8,8 0 0 1 8,-8 H734 a8,8 0 0 1 8,8 V92 H576 Z" fill="#7a4fa0"/><text x="587" y="84" font-size="11.8" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">4  Secure</text><text x="587" y="111" font-size="10.2" fill="#1d2330" font-weight="normal" text-anchor="start">Roles: East sees East</text><text x="587" y="128" font-size="10.2" fill="#1d2330" font-weight="normal" text-anchor="start">Members mapped to roles</text><text x="587" y="145" font-size="10.2" fill="#1d2330" font-weight="normal" text-anchor="start">Test as a real user</text><path d="M744,140 L754,140" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M754,140 L747.7,143.0 L747.7,137.0 Z" fill="#5b6475"/><rect x="761" y="70" width="166" height="150" rx="8" fill="#eef2f7" stroke="none" stroke-width="1" /><rect x="758" y="66" width="166" height="150" rx="8" fill="#fff" stroke="#b7791f" stroke-width="1.6" /><path d="M758,74 a8,8 0 0 1 8,-8 H916 a8,8 0 0 1 8,8 V92 H758 Z" fill="#b7791f"/><text x="769" y="84" font-size="11.8" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">5  Deliver</text><text x="769" y="111" font-size="10.2" fill="#1d2330" font-weight="normal" text-anchor="start">Publish an app</text><text x="769" y="128" font-size="10.2" fill="#1d2330" font-weight="normal" text-anchor="start">Or share the report</text><text x="769" y="145" font-size="10.2" fill="#1d2330" font-weight="normal" text-anchor="start">Subscriptions, alerts</text><text x="769" y="162" font-size="10.2" fill="#1d2330" font-weight="normal" text-anchor="start">Usage metrics</text><rect x="30" y="240" width="910" height="96" rx="8" fill="#fff" stroke="#c9d3df" stroke-width="1" /><text x="46" y="266" font-size="12.5" fill="#1d2330" font-weight="bold" text-anchor="start">What breaks most often</text><rect x="46" y="282" width="8" height="36" rx="0" fill="#b23b3b" stroke="none" stroke-width="1" /><text x="62" y="298" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start">Refresh fails:</text><text x="62" y="314" font-size="10.6" fill="#5b6475" font-weight="normal" text-anchor="start">credentials or gateway</text><rect x="274" y="282" width="8" height="36" rx="0" fill="#c0662b" stroke="none" stroke-width="1" /><text x="290" y="298" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start">Numbers differ:</text><text x="290" y="314" font-size="10.6" fill="#5b6475" font-weight="normal" text-anchor="start">filters, not DAX</text><rect x="502" y="282" width="8" height="36" rx="0" fill="#7a4fa0" stroke="none" stroke-width="1" /><text x="518" y="298" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start">Viewers can&#x27;t open it:</text><text x="518" y="314" font-size="10.6" fill="#5b6475" font-weight="normal" text-anchor="start">licence</text><rect x="730" y="282" width="8" height="36" rx="0" fill="#0f5c8c" stroke="none" stroke-width="1" /><text x="746" y="298" font-size="11" fill="#1d2330" font-weight="bold" text-anchor="start">Slow report:</text><text x="746" y="314" font-size="10.6" fill="#5b6475" font-weight="normal" text-anchor="start">too many visuals</text></svg>