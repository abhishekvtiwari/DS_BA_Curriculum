idth="318" height="300" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="370" y="40" width="318" height="300" rx="8" fill="#fff" stroke="#b23b3b" stroke-width="1.6" /><path d="M370,48 a8,8 0 0 1 8,-8 H680 a8,8 0 0 1 8,8 V76 H370 Z" fill="#b23b3b"/><text x="384" y="64" font-size="13.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Opened with month-first dates</text><text x="386" y="108" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">order_date   customer_code</text><rect x="380" y="118" width="298" height="24" rx="3" fill="#fdf3dc" stroke="none" stroke-width="1" /><text x="386" y="136" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">2025-02-01   2</text><rect x="380" y="146" width="298" height="24" rx="3" fill="#fdf3dc" stroke="none" stroke-width="1" /><text x="386" y="164" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">2025-12-01   5</text><rect x="380" y="174" width="298" height="24" rx="3" fill="#f8e1e1" stroke="none" stroke-width="1" /><text x="386" y="192" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">13-01-2025   5</text><text x="386" y="240" font-size="12.3" fill="#b23b3b" font-weight="normal" text-anchor="start">• 125 lines: wrong real dates</text><text x="386" y="264" font-size="12.3" fill="#b23b3b" font-weight="normal" text-anchor="start">• 10 lines: right by luck (day = month)</text><text x="386" y="288" font-size="12.3" fill="#b23b3b" font-weight="normal" text-anchor="start">• 195 lines: dates left as text</text><text x="386" y="312" font-size="12.3" fill="#b23b3b" font-weight="normal" text-anchor="start">• 330 lines: codes lost their zeros</text><path d="M690,190 L708,190" fill="none" stroke="#5b6475" stroke-width="1.6" stroke-linejoin="round"/><path d="M708,190 L701.7,193.0 L701.7,187.0 Z" fill="#5b6475"/><rect x="713" y="44" width="318" height="300" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="710" y="40" width="318" height="300" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><path d="M710,48 a8,8 0 0 1 8,-8 H1020 a8,8 0 0 1 8,8 V76 H710 Z" fill="#2f7d6d"/><text x="724" y="64" font-size="13.5" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Imported with column types set</text><text x="726" y="108" font-size="12" fill="#1d2330" font-weight="bold" text-anchor="start" font-family="DejaVu Sans Mono, monospace">order_date   customer_code</text><rect x="720" y="118" width="298" height="24" rx="3" fill="#f6f9fc" stroke="none" stroke-width="1" /><text x="726" y="136" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">2025-01-02   0002</text><rect x="720" y="146" width="298" height="24" rx="3" fill="#f6f9fc" stroke="none" stroke-width="1" /><text x="726" y="164" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">2025-01-12   0005</text><rect x="720" y="174" width="298" height="24" rx="3" fill="#f6f9fc" stroke="none" stroke-width="1" /><text x="726" y="192" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start" font-family="DejaVu Sans Mono, monospace">2025-01-13   0005</text><text x="726" y="240" font-size="12.3" fill="#2f7d6d" font-weight="normal" text-anchor="start">• 330 lines: real, correct dates</text><text x="726" y="264" font-size="12.3" fill="#2f7d6d" font-weight="normal" text-anchor="start">• 330 lines: codes kept as text</text><text x="726" y="288" font-size="12.3" fill="#2f7d6d" font-weight="normal" text-anchor="start">• January revenue ₹202,640 ✓</text><text x="30" y="24" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">The same export, three ways (330 order lines). Counts are measured on Riverstone&#x27;s 2025 export.</text><text x="30" y="370" font-size="12.3" fill="#1d2330" font-weight="normal" text-anchor="start">Month-first reading turns 2 January into 1 February, and January revenue drops from ₹202,640 to ₹91,649 without any error message.</text></svg>