<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="446" viewBox="0 0 1040 446" font-family="DejaVu Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1040" height="446" fill="#ffffff"/><rect x="33" y="34" width="460" height="320" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="30" y="30" width="460" height="320" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><path d="M30,38 a8,8 0 0 1 8,-8 H482 a8,8 0 0 1 8,8 V64 H30 Z" fill="#0f5c8c"/><text x="42" y="53" font-size="15" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Provider secures: THE CLOUD</text><text x="46" y="100" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">Physical data centers and hardware</text><text x="46" y="126" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">The virtualization layer</text><text x="46" y="152" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">Managed services&#x27; own software</text><text x="46" y="178" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">Network backbone between regions</text><rect x="30" y="220" width="460" height="110" rx="7" fill="#eaf5f1" stroke="#2f7d6d" stroke-width="1.4" /><text x="46" y="244" font-size="12.5" fill="#2f7d6d" font-weight="bold" text-anchor="start">You never touch this layer directly.</text><text x="46" y="266" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">A data center flooding, a hardware fault,</text><text x="46" y="286" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">a hypervisor bug: the provider&#x27;s problem.</text><rect x="523" y="34" width="490" height="320" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="520" y="30" width="490" height="320" rx="8" fill="#fff" stroke="#c0662b" stroke-width="1.6" /><path d="M520,38 a8,8 0 0 1 8,-8 H1002 a8,8 0 0 1 8,8 V64 H520 Z" fill="#c0662b"/><text x="532" y="53" font-size="15" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">You secure: WHAT&#x27;S IN THE CLOUD</text><text x="536" y="100" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">Your data, and who can read or change it</text><text x="536" y="126" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">IAM: identities, roles, permissions (52.1)</text><text x="536" y="152" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">Network rules: VPCs, subnets, security groups</text><text x="536" y="178" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">How you configure every service you use</text><text x="536" y="204" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">Your application code and its containers</text><text x="536" y="230" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">Secrets: tokens, passwords, keys (52.6)</text><rect x="520" y="290" width="490" height="42" rx="7" fill="#fff4e8" stroke="#c0662b" stroke-width="1.4" /><text x="536" y="316" font-size="12" fill="#c0662b" font-weight="bold" text-anchor="start">A public bucket, an open port, a committed secret: always yours.</text><rect x="30" y="372" width="980" height="54" rx="7" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="46" y="398" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start">The line never moves, whatever the provider or the service.</text><text x="46" y="417" font-size="12.5" fill="#5b6475" font-weight="normal" text-anchor="start" font-style="italic">&quot;The provider secures the cloud; you secure what&#x27;s in it.&quot;</text></svg>