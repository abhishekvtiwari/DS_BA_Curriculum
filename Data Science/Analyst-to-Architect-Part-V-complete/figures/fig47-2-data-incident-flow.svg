<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="316" viewBox="0 0 1040 316" font-family="DejaVu Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1040" height="316" fill="#ffffff"/><rect x="33" y="44" width="186" height="170" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="30" y="40" width="186" height="170" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><path d="M30,48 a8,8 0 0 1 8,-8 H208 a8,8 0 0 1 8,8 V74 H30 Z" fill="#0f5c8c"/><text x="42" y="63" font-size="13" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">1 · Detect</text><text x="42" y="102" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Failed test, freshness</text><text x="42" y="121" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">alert, or a person saying</text><text x="42" y="140" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">the number looks wrong</text><path d="M218,130 L230,130" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M230,130 L221.9,133.9 L221.9,126.1 Z" fill="#1d2330"/><rect x="235" y="44" width="186" height="170" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="232" y="40" width="186" height="170" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><path d="M232,48 a8,8 0 0 1 8,-8 H410 a8,8 0 0 1 8,8 V74 H232 Z" fill="#0f5c8c"/><text x="244" y="63" font-size="13" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">2 · Classify</text><text x="244" y="102" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">S1 wrong data reached</text><text x="244" y="121" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">people or systems</text><text x="244" y="140" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">S2 output late, nothing sent</text><text x="244" y="159" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">S3 minor or warning-level</text><path d="M420,130 L432,130" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M432,130 L423.9,133.9 L423.9,126.1 Z" fill="#1d2330"/><rect x="437" y="44" width="186" height="170" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="434" y="40" width="186" height="170" rx="8" fill="#fff" stroke="#c0662b" stroke-width="1.6" /><path d="M434,48 a8,8 0 0 1 8,-8 H612 a8,8 0 0 1 8,8 V74 H434 Z" fill="#c0662b"/><text x="446" y="63" font-size="13" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">3 · Contain</text><text x="446" y="102" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Stop publishing and syncs</text><text x="446" y="121" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Tell the people who use it,</text><text x="446" y="140" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">before they find out</text><path d="M622,130 L634,130" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M634,130 L625.9,133.9 L625.9,126.1 Z" fill="#1d2330"/><rect x="639" y="44" width="186" height="170" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="636" y="40" width="186" height="170" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><path d="M636,48 a8,8 0 0 1 8,-8 H814 a8,8 0 0 1 8,8 V74 H636 Z" fill="#2f7d6d"/><text x="648" y="63" font-size="13" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">4 · Fix and verify</text><text x="648" y="102" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Repair the cause, re-run</text><text x="648" y="121" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">the affected days, run the</text><text x="648" y="140" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">same tests, publish</text><path d="M824,130 L836,130" fill="none" stroke="#1d2330" stroke-width="2" stroke-linejoin="round"/><path d="M836,130 L827.9,133.9 L827.9,126.1 Z" fill="#1d2330"/><rect x="841" y="44" width="186" height="170" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="838" y="40" width="186" height="170" rx="8" fill="#fff" stroke="#7a4fa0" stroke-width="1.6" /><path d="M838,48 a8,8 0 0 1 8,-8 H1016 a8,8 0 0 1 8,8 V74 H838 Z" fill="#7a4fa0"/><text x="850" y="63" font-size="13" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">5 · Review</text><text x="850" y="102" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">Blameless write-up:</text><text x="850" y="121" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">timeline, cause, impact,</text><text x="850" y="140" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">and the checks added</text><text x="850" y="159" font-size="11.5" fill="#1d2330" font-weight="normal" text-anchor="start">to catch it sooner</text><rect x="30" y="232" width="994" height="58" rx="7" fill="#fff4e8" stroke="#c0662b" stroke-width="1" /><text x="46" y="256" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">People forgive late data far more than wrong data they already acted on.</text><text x="46" y="278" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">So communication happens at step 3, not after step 4.</text></svg>