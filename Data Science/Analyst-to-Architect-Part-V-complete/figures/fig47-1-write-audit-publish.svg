<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="390" viewBox="0 0 1040 390" font-family="DejaVu Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="1040" height="390" fill="#ffffff"/><rect x="33" y="74" width="280" height="150" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="30" y="70" width="280" height="150" rx="8" fill="#fff" stroke="#0f5c8c" stroke-width="1.6" /><path d="M30,78 a8,8 0 0 1 8,-8 H302 a8,8 0 0 1 8,8 V104 H30 Z" fill="#0f5c8c"/><text x="42" y="93" font-size="15" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">1 · Write</text><text x="44" y="132" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">Build the day&#x27;s numbers into</text><text x="44" y="152" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">audit.daily_flash_new</text><text x="44" y="172" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start"></text><text x="44" y="192" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">Nobody reads this table.</text><path d="M314,145 L354,145" fill="none" stroke="#1d2330" stroke-width="2.2" stroke-linejoin="round"/><path d="M354,145 L345.9,148.9 L345.9,141.1 Z" fill="#1d2330"/><rect x="361" y="74" width="300" height="150" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="358" y="70" width="300" height="150" rx="8" fill="#fff" stroke="#c0662b" stroke-width="1.6" /><path d="M358,78 a8,8 0 0 1 8,-8 H650 a8,8 0 0 1 8,8 V104 H358 Z" fill="#c0662b"/><text x="370" y="93" font-size="15" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">2 · Audit</text><text x="372" y="132" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">one row per day</text><text x="372" y="152" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">revenue not negative</text><text x="372" y="172" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">matches the ERP (orders and</text><text x="372" y="192" font-size="12.5" fill="#1d2330" font-weight="normal" text-anchor="start">revenue recomputed from source)</text><path d="M662,115 L706,65" fill="none" stroke="#2f7d6d" stroke-width="2.2" stroke-linejoin="round"/><path d="M706,65 L703.6,73.7 L697.7,68.5 Z" fill="#2f7d6d"/><text x="640" y="42" font-size="12" fill="#2f7d6d" font-weight="bold" text-anchor="start">tests pass</text><path d="M662,180 L706,235" fill="none" stroke="#b23b3b" stroke-width="2.2" stroke-linejoin="round"/><path d="M706,235 L697.9,231.1 L704.0,226.2 Z" fill="#b23b3b"/><text x="636" y="276" font-size="12" fill="#b23b3b" font-weight="bold" text-anchor="start">a test fails</text><rect x="713" y="4" width="300" height="120" rx="8" fill="#e9eef4" stroke="none" stroke-width="1" /><rect x="710" y="0" width="300" height="120" rx="8" fill="#fff" stroke="#2f7d6d" stroke-width="1.6" /><path d="M710,8 a8,8 0 0 1 8,-8 H1002 a8,8 0 0 1 8,8 V34 H710 Z" fill="#2f7d6d"/><text x="722" y="23" font-size="15" fill="#fff" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">3 · Publish</text><text x="724" y="56" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">One transaction swaps the day into</text><text x="724" y="75" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">mart.daily_flash, which dashboards</text><text x="724" y="94" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">and analysts read.</text><rect x="710" y="200" width="300" height="120" rx="8" fill="#fbeaea" stroke="#b23b3b" stroke-width="1.6" /><text x="726" y="228" font-size="14" fill="#b23b3b" font-weight="bold" text-anchor="start" font-family="Poppins, DejaVu Sans, sans-serif">Publish blocked</text><text x="726" y="252" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">mart.daily_flash keeps its last</text><text x="726" y="271" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">good data; an incident alert goes</text><text x="726" y="290" font-size="12" fill="#1d2330" font-weight="normal" text-anchor="start">to the owner.</text><rect x="30" y="300" width="640" height="60" rx="7" fill="#f6f9fc" stroke="#c9d3df" stroke-width="1" /><text x="46" y="326" font-size="13" fill="#1d2330" font-weight="bold" text-anchor="start">Readers of the published table only ever see data that passed its tests.</text><text x="46" y="346" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">In Chapter 46 the same failure left a wrong row where anyone could query it.</text></svg>